name: Validate JRA historical combination parser

on:
  push:
    branches: [main]
    paths:
      - "scripts/validate-jra-historical-combination-parser.py"
      - ".github/workflows/validate-jra-historical-combination-parser.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/jra-historical-combination-parser' \
            -f description='Validating full JRA historical combination matrices' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser validation
        run: python scripts/validate-jra-historical-combination-parser.py
      - name: Save validation report
        run: |
          git add -f analysis-results/jra-historical-combination-parser-validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Save JRA historical combination parser validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Assert complete validation
        run: |
          python - <<'PY'
          import json
          report=json.load(open('analysis-results/jra-historical-combination-parser-validation.json', encoding='utf-8'))
          if report.get('allMatrixBetTypesValidated') is not True:
              raise SystemExit('JRA_HISTORICAL_COMBINATION_PARSER_NOT_FULLY_VALIDATED')
          PY
      - name: Publish success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='analysis/jra-historical-combination-parser' \
            -f description='All JRA historical combination matrices validated' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='analysis/jra-historical-combination-parser' \
            -f description='JRA historical combination matrix validation incomplete' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
