name: Seed Worker Completed Model D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-worker-completed-model-d1.yml"
      - "scripts/build-worker-completed-model-assets.py"
      - "scripts/seed-worker-completed-model-d1.py"
      - "models/ten-year-completed-model.txt"
      - "config/ten-year-completed-model.json"
      - "scripts/ten-year-production-core.py"

permissions:
  contents: read

concurrency:
  group: seed-worker-completed-model-d1
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical LightGBM runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy<3"
      - name: Build compact completed model
        run: python scripts/build-worker-completed-model-assets.py
      - name: Seed production D1
        run: python scripts/seed-worker-completed-model-d1.py --apply
      - name: Upload seed audit
        uses: actions/upload-artifact@v4
        with:
          name: worker-completed-model-d1-seed
          path: worker-model-d1-seed-audit.json
          retention-days: 30
