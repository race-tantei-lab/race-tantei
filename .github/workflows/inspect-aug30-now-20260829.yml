name: Inspect Aug 30 now 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-aug30-now-20260829.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Inspect immediately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def q(sql):
              req=urllib.request.Request(url,data=json.dumps({'sql':sql,'params':[]}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(body)
              return (body.get('result') or [{}])[0].get('results') or []
          counts=q("""
          WITH per_race AS (
            SELECT r.race_id,r.venue,r.race_no,r.entry_url,
                   COUNT(rr.horse_no) AS runnerRows,
                   SUM(CASE WHEN COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS activeRunners
            FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
            WHERE r.race_date='2026-08-30'
            GROUP BY r.race_id,r.venue,r.race_no,r.entry_url
          )
          SELECT venue,COUNT(*) AS races,
                 SUM(CASE WHEN LENGTH(TRIM(COALESCE(entry_url,'')))>0 AND activeRunners>=3 THEN 1 ELSE 0 END) AS ready,
                 SUM(runnerRows) AS runnerRows
          FROM per_race GROUP BY venue ORDER BY venue
          """)
          print('COUNTS',json.dumps(counts,ensure_ascii=False))
          state=q("""
          SELECT state_key AS stateKey,state_value AS stateValue,updated_at AS updatedAt FROM rt_system_state
          WHERE state_key IN ('worker_upcoming_entry_repair','worker_upcoming_entry_derived_repair')
          ORDER BY updated_at DESC
          """)
          print('STATE',json.dumps(state,ensure_ascii=False))
          PY
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          curl -sS --max-time 10 -D /tmp/h -o /tmp/d -w 'API total=%{time_total}s http=%{http_code} bytes=%{size_download}\n' "$base/api/public/day?date=2026-08-30&_rt=$(date +%s%N)"
          node -e "const p=require('/tmp/d'); console.log('PAYLOAD',JSON.stringify({date:p.date,races:p.races?.length,venues:[...new Set((p.races||[]).map(r=>r.venue))]}))"
