name: Live deadline external watchdog
run-name: Live deadline external watchdog · ${{ github.event_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    # GitHub cron itself has a five-minute floor. Each scheduled job below stays
    # alive and emits one authenticated pulse per minute, closing that cadence gap.
    # UTC windows cover 08:00-19:55 JST every day, including irregular JRA dates.
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-10 * * *"
  push:
    branches: [main]
    paths:
      - "src/live-deadline-entry-v2.ts"
      - "src/v1/github-actions-oidc.ts"
      - "src/v1/live-preview-safety.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/v1/completed-final-invariants.ts"
      - ".github/workflows/live-deadline-external-watchdog.yml"
      - ".github/workflows/deploy-live-deadline.yml"
      - "wrangler.live-deadline.jsonc"
      - "wrangler.live-deadline-backup.jsonc"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: live-deadline-external-watchdog
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Execute independent minute-pulse live deadline watchdog
        shell: bash
        run: |
          set -euo pipefail
          url='https://race-tantei-live-deadline.race-tantei.workers.dev/internal/github-tick'
          pulses=5
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then pulses=1; fi

          for pulse in $(seq 1 "$pulses"); do
            response=$(curl --fail-with-body --max-time 15 -sS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=race-tantei-live-deadline")
            token=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
            test -n "$token"
            echo "::add-mask::$token"

            rm -f /tmp/live-watchdog-body
            code=$(curl --max-time 90 -sS -o /tmp/live-watchdog-body -w '%{http_code}' \
              -X POST -H "Authorization: Bearer ${token}" "$url" || true)
            body=$(cat /tmp/live-watchdog-body 2>/dev/null || true)
            echo "pulse=$pulse/$pulses code=$code body=$body"

            if [ "$code" = "200" ]; then
              echo "$body" | grep -q '"source":"github-oidc"'
            elif [ "$code" = "202" ] && echo "$body" | grep -q '"status":"lease_busy"'; then
              echo "pulse=$pulse overlapped a healthy live-deadline owner"
            elif [ "$code" = "401" ]; then
              echo 'GITHUB_OIDC_AUTHENTICATION_FAILED' >&2
              exit 1
            else
              echo "EXTERNAL_LIVE_DEADLINE_PULSE_FAILED pulse=$pulse code=$code" >&2
              exit 1
            fi

            if [ "$pulse" -lt "$pulses" ]; then sleep 55; fi
          done

      - name: Mark external watchdog success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/live-deadline-external-watchdog' \
            -f description='Independent GitHub OIDC watchdog completed minute pulses' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark external watchdog failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/live-deadline-external-watchdog' \
            -f description='Independent GitHub OIDC live deadline pulse failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
