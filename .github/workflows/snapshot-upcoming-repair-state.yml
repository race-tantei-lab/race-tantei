name: Snapshot upcoming repair state
run-name: Snapshot upcoming repair state · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot-upcoming-repair-state.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read Worker repair state
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT state_key AS stateKey,state_value AS stateValue,updated_at AS updatedAt FROM rt_system_state WHERE state_key='worker_upcoming_entry_repair' OR state_key LIKE 'worker_upcoming_entry_probe:%' ORDER BY state_key;"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$sql" > /tmp/state.json
          mkdir -p analysis-results
          cp /tmp/state.json analysis-results/upcoming-worker-repair-state.json
          cat /tmp/state.json
      - name: Save snapshot
        run: |
          git add -f analysis-results/upcoming-worker-repair-state.json
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save upcoming Worker repair state" || true
          git pull --rebase origin main
          git push origin HEAD:main
