name: Diagnose live deadline now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-deadline-now.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish diagnostic pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='diagnostic/live-deadline-now' \
            -f description='Reading current production deadline state' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dump current live deadline state
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=$today"
          echo '=== DRIVER / LIVE / GUARD STATES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS stateValue FROM rt_system_state WHERE state_key IN ('live_deadline_driver:${today}','worker_live_lock:${today}','worker_deadline_guard:${today}','final_daily_selection:${today}') ORDER BY state_key"
          echo '=== SELECTED RACE FINAL/PREVIEW STATUS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}') SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.start_time_jst AS startTimeJst,r.start_time_utc AS startTimeUtc,CAST((julianday(r.start_time_utc)-julianday('now'))*1440 AS INTEGER) AS minutesToStart,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows,(SELECT COUNT(*) FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS previewState,(SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id=r.race_id) AS previewArchiveRows FROM rt_races r JOIN selected x ON x.raceId=r.race_id ORDER BY r.start_time_utc,r.race_id"
          echo '=== MISSED NIIGATA 1R PREVIEW ENVELOPE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT s.updated_at AS stateUpdatedAt,json_extract(j.value,'$.generatedAt') AS generatedAt,json_extract(j.value,'$.oddsFetchedAt') AS oddsFetchedAt,json_extract(j.value,'$.oddsSource') AS oddsSource,json_extract(j.value,'$.bodyWeightApplied') AS bodyWeightApplied,json_array_length(json_extract(j.value,'$.courseBets')) AS courseBetCount FROM rt_system_state s,json_each(json_extract(s.state_value,'$.snapshots')) j WHERE s.state_key='worker_live_preview:2026-08-23-niigata-01' ORDER BY generatedAt DESC"
          echo '=== PREVIEW ARCHIVE SCHEMA ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "PRAGMA table_info(rt_live_preview_archive)"
          echo '=== MISSED NIIGATA 1R ARCHIVE ROWS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT * FROM rt_live_preview_archive WHERE race_id='2026-08-23-niigata-01' ORDER BY rowid DESC LIMIT 10"
          echo '=== FIRST RACES ALL VENUES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.start_time_jst AS startTimeJst,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows FROM rt_races r WHERE r.race_date='${today}' AND r.race_no<=2 ORDER BY r.start_time_utc,r.race_id"
      - name: Dump public day API
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          curl --max-time 20 --fail-with-body -sS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=${today}" -o /tmp/day.json
          head -c 20000 /tmp/day.json
          echo
      - name: Publish diagnostic success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='diagnostic/live-deadline-now' \
            -f description='Current production deadline state captured' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish diagnostic failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='diagnostic/live-deadline-now' \
            -f description='Production deadline diagnostic failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
