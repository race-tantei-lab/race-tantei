name: Latest odds replay check
on:
  push:
    branches:
      - diag/latest-odds-replay-check-20260923
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
          SELECT race_id AS raceId,COUNT(*) AS rows,COUNT(DISTINCT bet_type) AS types,
                 MIN(captured_at_utc) AS minCapture,MAX(captured_at_utc) AS maxCapture
          FROM rt_official_odds_latest
          WHERE race_id IN (
            SELECT DISTINCT b.race_id FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id
            WHERE r.race_date BETWEEN '2026-09-20' AND '2026-09-22' AND b.source_prediction_id=-2
          )
          GROUP BY race_id ORDER BY race_id"
