# Read-only production control-plane audit. No D1 mutations.
name: Audit production control plane now
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-production-control-plane-now.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      DB_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare control plane and D1 insights
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          cf() {
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$1"
          }
          META="$(cf "$base/d1/database/$DB_ID")"
          echo "$META" | jq '{success, errors, result: {uuid:.result.uuid,name:.result.name,file_size:.result.file_size,num_tables:.result.num_tables,version:.result.version}}'
          DB_NAME="$(echo "$META" | jq -r '.result.name')"
          test -n "$DB_NAME" && test "$DB_NAME" != "null"
          for w in race-tantei-phase0 race-tantei-live-deadline race-tantei-live-deadline-backup; do
            echo "::group::$w schedules"
            cf "$base/workers/scripts/$w/schedules" | jq '{success, errors, result}'
            echo "::endgroup::"
            echo "::group::$w deployments"
            cf "$base/workers/scripts/$w/deployments" | jq '{success, errors, result: (.result | if type=="array" then .[0:5] else . end)}'
            echo "::endgroup::"
            echo "::group::$w settings"
            cf "$base/workers/scripts/$w/script-settings" | jq '{success, errors, result: {compatibility_date:.result.compatibility_date, compatibility_flags:.result.compatibility_flags, logpush:.result.logpush, observability:.result.observability, usage_model:.result.usage_model}}'
            echo "::endgroup::"
          done
          echo "::group::D1 insights reads 1d"
          npx -y wrangler@latest d1 insights "$DB_NAME" --time-period 1d --sort-type sum --sort-by reads --limit 30 --json
          echo "::endgroup::"
          echo "::group::D1 insights writes 1d"
          npx -y wrangler@latest d1 insights "$DB_NAME" --time-period 1d --sort-type sum --sort-by writes --limit 30 --json
          echo "::endgroup::"
          echo "::group::D1 insights count 1d"
          npx -y wrangler@latest d1 insights "$DB_NAME" --time-period 1d --sort-type sum --sort-by count --limit 30 --json
          echo "::endgroup::"
          echo "::group::D1 insights reads 7d"
          npx -y wrangler@latest d1 insights "$DB_NAME" --time-period 7d --sort-type sum --sort-by reads --limit 30 --json
          echo "::endgroup::"
          echo "::group::D1 insights writes 7d"
          npx -y wrangler@latest d1 insights "$DB_NAME" --time-period 7d --sort-type sum --sort-by writes --limit 30 --json
          echo "::endgroup::"
      - name: Static SQL inventory
        shell: bash
        run: |
          set -euo pipefail
          rg -n --glob '!node_modules/**' --glob '!.git/**' --glob '!.github/**' --glob '!test/**' --glob '!tests/**' -i 'SELECT |INSERT |UPDATE |DELETE |CREATE (TABLE|INDEX|TRIGGER)|UPSERT' src functions scripts scripts_oracle 2>/dev/null | head -n 500 || true
