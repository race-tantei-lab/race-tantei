name: Audit active Cloudflare cron schedules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-cloudflare-crons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - name: List active Worker cron schedules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def get(path):
            req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}{path}',headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result')
          scripts=get('/workers/scripts') or []
          active=[]
          for item in scripts:
            name=str(item.get('id') or item.get('name') or '')
            if not name: continue
            try:
              schedules=get(f'/workers/scripts/{name}/schedules') or []
            except urllib.error.HTTPError as e:
              if e.code==404: continue
              raise
            for schedule in schedules:
              cron=str(schedule.get('cron') or '')
              if cron: active.append({'worker':name,'cron':cron})
          active.sort(key=lambda x:(x['worker'],x['cron']))
          print('ACTIVE_CRON_COUNT',len(active))
          print('ACTIVE_CRONS',json.dumps(active,ensure_ascii=False))
          if len(active)>5: raise SystemExit('FREE_CRON_LIMIT_INCONSISTENT')
          PY
