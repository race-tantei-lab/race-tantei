name: Nonlinear v4 allocation refinement

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nonlinear-v4-allocation-refinement.yml"
      - "scripts/refine-nonlinear-v4-allocation.py"
      - "scripts/train-nonlinear-market-blend-v4.py"
      - "analysis-results/nonlinear-market-blend-v4.json"

concurrency:
  group: nonlinear-v4-allocation-refinement
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Refine allocation
        shell: bash
        run: |
          set -o pipefail
          python scripts/refine-nonlinear-v4-allocation.py 2>&1 | tee nonlinear-v4-allocation-refinement.log

      - name: Upload result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonlinear-v4-allocation-refinement
          path: |
            nonlinear-v4-allocation-refinement.json
            nonlinear-v4-allocation-refinement.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save result to GitHub
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in nonlinear-v4-allocation-refinement.json nonlinear-v4-allocation-refinement.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No result change to commit."
          else
            git commit -m "Save nonlinear v4 allocation refinement"
            git push
          fi
