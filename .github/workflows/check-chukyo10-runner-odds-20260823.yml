name: Check Chukyo10 runner odds
on:
  push:
    branches: [main]
    paths: [".github/workflows/check-chukyo10-runner-odds-20260823.yml"]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - run: npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT horse_no,horse_name,win_odds,popularity,updated_at FROM rt_runners WHERE race_id='2026-08-23-chukyo-10' ORDER BY horse_no"