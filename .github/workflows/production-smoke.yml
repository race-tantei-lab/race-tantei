name: Production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment and verify health
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          expected=""
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected="$(grep '"MODEL_VERSION"' wrangler.jsonc | sed -E 's/.*"MODEL_VERSION"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          fi

          for attempt in $(seq 1 36); do
            echo "Health attempt ${attempt}/36 expected=${expected:-any}"
            health="$(curl --silent --show-error --fail --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" EXPECTED="$expected" python - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ.get("HEALTH", ""))
          except Exception:
              sys.exit(1)
          expected = os.environ.get("EXPECTED", "")
          valid = data.get("ok") is True and bool(data.get("modelVersion"))
          if expected:
              valid = valid and data.get("modelVersion") == expected
          sys.exit(0 if valid else 1)
          PY
            then
              echo "$health"
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Production health endpoint did not reach the expected model."
              echo "$health"
              exit 1
            fi
            sleep 10
          done

      - name: Verify production pages and live data
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 25 -D /tmp/home.headers "${base}/" >/tmp/home.html
          grep -q 'レース探偵' /tmp/home.html

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            grep -qi '^x-race-ui-version: phase-c' /tmp/home.headers
            curl --silent --show-error --fail --max-time 25 "${base}/validation" >/tmp/validation.html
            grep -q 'フェーズC' /tmp/validation.html
            validation="$(curl --silent --show-error --fail --max-time 25 "${base}/api/validation")"
            VALIDATION="$validation" python - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ.get("VALIDATION", ""))
          except Exception:
              sys.exit(1)
          valid = (
              data.get("phase") == "phase-c-validation-v1"
              and isinstance(data.get("dates"), list)
              and len(data.get("dates", [])) == 2
              and int(data.get("totalRaces", 0)) > 0
          )
          print(json.dumps({
              "phase": data.get("phase"),
              "processed": data.get("processedRaces"),
              "total": data.get("totalRaces"),
              "remaining": data.get("remainingRaces")
          }, ensure_ascii=False))
          sys.exit(0 if valid else 1)
          PY
          fi

          for attempt in $(seq 1 48); do
            echo "Data attempt ${attempt}/48"
            status="$(curl --silent --show-error --fail --max-time 25 "${base}/api/status" || true)"
            races="$(curl --silent --show-error --fail --max-time 25 "${base}/api/races" || true)"
            if STATUS="$status" RACES="$races" python - <<'PY'
          import json, os, sys
          try:
              status = json.loads(os.environ.get("STATUS", ""))
              races = json.loads(os.environ.get("RACES", ""))
          except Exception:
              sys.exit(1)
          sources = sum(int(row.get("count", 0)) for row in status.get("sourceCounts", []))
          last_race = status.get("lastRace")
          valid_races = isinstance(races, list) and len(races) > 0
          print(json.dumps({"sources": sources, "lastRace": last_race, "raceCount": len(races) if isinstance(races, list) else 0}, ensure_ascii=False))
          sys.exit(0 if sources > 0 and last_race and valid_races else 1)
          PY
            then
              echo "Production Worker has discovered and stored live races."
              break
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "Production ingestion did not create race sources and races in time."
              echo "$status"
              echo "$races"
              exit 1
            fi
            sleep 10
          done

          curl --silent --show-error --fail --max-time 25 "${base}/" >/tmp/home-after-sync.html
          HOME_HTML="$(cat /tmp/home-after-sync.html)" python - <<'PY'
          import json, os, re
          html = os.environ.get("HOME_HTML", "")
          matches = re.findall(
              r'data-day-panel="([^"]+)"[\s\S]*?<div class="day-summary">[\s\S]*?<p>買い目あり\s+(\d+)R',
              html
          )
          print(json.dumps({
              "liveBuyCounts": [
                  {"date": date, "buyRaces": int(count)} for date, count in matches
              ],
              "visibleBuyCards": len(re.findall(r'data-race-category="buy"', html))
          }, ensure_ascii=False))
          PY

          races="$(curl --silent --show-error --fail --max-time 25 "${base}/api/races")"
          RACES="$races" BASE="$base" python - <<'PY'
          import json, os, urllib.parse, urllib.request
          rows = json.loads(os.environ.get("RACES", "[]"))
          base = os.environ["BASE"]
          diagnostics = []
          for row in rows:
              if row.get("raceDate") != "2026-08-02" or row.get("status") == "finished":
                  continue
              race_id = str(row.get("raceId", ""))
              if not race_id:
                  continue
              try:
                  url = base + "/api/races/" + urllib.parse.quote(race_id, safe="")
                  with urllib.request.urlopen(url, timeout=25) as response:
                      detail = json.load(response)
                  prediction = detail.get("prediction") or {}
                  predicted = detail.get("predictedRunners") or []
                  bets = detail.get("bets") or []
                  max_ev = max(
                      [float(item.get("expectedValuePct") or 0) for item in predicted],
                      default=0
                  )
                  diagnostics.append({
                      "raceId": race_id,
                      "raceNo": row.get("raceNo"),
                      "status": row.get("status"),
                      "predictionStatus": row.get("predictionStatus"),
                      "modelVersion": prediction.get("modelVersion"),
                      "runnerCount": len(predicted),
                      "maxRunnerWinEvPct": round(max_ev, 1),
                      "betCount": len(bets)
                  })
              except Exception as error:
                  diagnostics.append({"raceId": race_id, "error": str(error)})
              if len(diagnostics) >= 12:
                  break
          print(json.dumps({"activeRaceDiagnostics": diagnostics}, ensure_ascii=False))
          PY

      - name: Publish Phase C production verification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/phase-c' \
            -f description='Phase C production routes verified' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
