name: Production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment and verify health
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 36); do
            echo "Health attempt ${attempt}/36"
            health="$(curl --silent --show-error --fail --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" python - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ.get("HEALTH", ""))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get("ok") is True and data.get("modelVersion") == "v2.0.1-live" else 1)
          PY
            then
              echo "$health"
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Production health endpoint did not reach v2.0.1-live"
              echo "$health"
              exit 1
            fi
            sleep 10
          done

      - name: Verify complete weekend discovery in production
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 25 "${base}/" >/tmp/home.html
          grep -q 'レース探偵' /tmp/home.html

          for attempt in $(seq 1 48); do
            echo "Full-ingestion attempt ${attempt}/48"
            status="$(curl --silent --show-error --fail --max-time 25 "${base}/api/status" || true)"
            races="$(curl --silent --show-error --fail --max-time 25 "${base}/api/races" || true)"
            if STATUS="$status" RACES="$races" python - <<'PY'
          import json, os, sys
          try:
              status = json.loads(os.environ.get("STATUS", ""))
              races = json.loads(os.environ.get("RACES", ""))
          except Exception:
              sys.exit(1)
          sources = sum(int(row.get("count", 0)) for row in status.get("sourceCounts", []))
          last_race = status.get("lastRace")
          last_sync = status.get("lastSync") or {}
          sync_finished = bool(last_sync.get("finished_at"))
          race_count = len(races) if isinstance(races, list) else 0
          print(json.dumps({"sources": sources, "lastRace": last_race, "raceCount": race_count, "lastSync": last_sync}, ensure_ascii=False))
          sys.exit(0 if sources >= 72 and last_race and race_count > 0 and sync_finished else 1)
          PY
            then
              echo "Production Worker has discovered the complete 72-race weekend set."
              exit 0
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "Production did not complete the 72-race weekend discovery in time."
              echo "$status"
              echo "$races"
              exit 1
            fi
            sleep 10
          done
