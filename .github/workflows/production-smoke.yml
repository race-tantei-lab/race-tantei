name: Production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production verification pending
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/phase-d' -f description='Verifying final Race Tantei public deployment' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify current production is alive on PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 30 "${base}/" >/tmp/home.html
          curl --silent --show-error --fail --max-time 30 "${base}/conditions" >/tmp/conditions.html
          curl --silent --show-error --fail --max-time 30 "${base}/guide" >/tmp/guide.html
          grep -q 'レース探偵' /tmp/home.html
          grep -q '条件詳細' /tmp/conditions.html
          grep -q 'レース探偵の見方' /tmp/guide.html

      - name: Wait for deployed final public history and fixed targets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 36); do
            home_code="$(curl --silent --show-error --max-time 25 -o /tmp/home.html -w '%{http_code}' "${base}/" || true)"
            c8="$(curl --silent --show-error --max-time 25 -o /tmp/day8.json -w '%{http_code}' "${base}/api/public/day?date=2026-08-08" || true)"
            c9="$(curl --silent --show-error --max-time 25 -o /tmp/day9.json -w '%{http_code}' "${base}/api/public/day?date=2026-08-09" || true)"
            if [ "$home_code" = "200" ] && [ "$c8" = "200" ] && [ "$c9" = "200" ]; then
              if python - <<'PY'
          import json,sys
          home=open('/tmp/home.html',encoding='utf-8').read()
          d8=json.load(open('/tmp/day8.json',encoding='utf-8')); d9=json.load(open('/tmp/day9.json',encoding='utf-8'))
          bought={'buy','hit','miss'}
          target={'target','overdue','missing','buy','hit','miss'}
          aug8=[r for r in d8.get('races',[]) if (r.get('publicState') or {}).get('code') in bought]
          aug9=[r for r in d9.get('races',[]) if (r.get('publicState') or {}).get('code') in target]
          valid=(
            '296.8%' in home and '297.6%' in home and '297.0%' in home
            and home.count('3225R')>=3
            and len(aug8)==15 and len(aug9)==15
            and all((r.get('publicState') or {}).get('code')!='skip' for r in aug9)
          )
          print(json.dumps({'aug8Locked':len(aug8),'aug9Targets':[(r.get('venue'),r.get('raceNo'),(r.get('publicState') or {}).get('code')) for r in aug9],'valid':valid},ensure_ascii=False))
          sys.exit(0 if valid else 1)
          PY
              then exit 0; fi
            fi
            echo "Waiting for final public deployment (${attempt}/36)"; sleep 5
          done
          echo 'Final public site did not become visible in time.'; exit 1

      - name: Publish production verification
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/phase-d' -f description='Final ROI, Aug 8 history and Aug 9 fixed targets verified' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish production verification failure
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/phase-d' -f description='Final public deployment verification failed' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
