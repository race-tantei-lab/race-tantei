name: Production smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed Worker
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error --fail --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" python - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ.get("HEALTH", ""))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get("ok") is True and data.get("modelVersion") == "v2.0.1-live" else 1)
          PY
            then
              echo "$health"
              exit 0
            fi
            sleep 10
          done
          echo "Worker health verification timed out."
          exit 1

      - name: Verify full weekend discovery and corrected race names
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 25 "${base}/" >/tmp/home.html
          grep -q 'レース探偵' /tmp/home.html

          for attempt in $(seq 1 120); do
            echo "Final production attempt ${attempt}/120"
            status="$(curl --silent --show-error --fail --max-time 25 "${base}/api/status" || true)"
            races="$(curl --silent --show-error --fail --max-time 25 "${base}/api/races" || true)"
            if STATUS="$status" RACES="$races" python - <<'PY'
          import json, os, sys
          try:
              status = json.loads(os.environ.get("STATUS", ""))
              races = json.loads(os.environ.get("RACES", ""))
          except Exception:
              sys.exit(1)

          sources = sum(int(row.get("count", 0)) for row in status.get("sourceCounts", []))
          last_sync = status.get("lastSync") or {}
          sync_finished = bool(last_sync.get("finished_at"))
          target = next((race for race in races if race.get("raceId") == "2026-08-01-sapporo-05"), None) if isinstance(races, list) else None
          correct_name = bool(target and target.get("raceName") == "メイクデビュー札幌")
          race_count = len(races) if isinstance(races, list) else 0
          snapshot = {
              "sources": sources,
              "raceCount": race_count,
              "targetRace": target,
              "lastSync": last_sync,
              "syncFinished": sync_finished,
              "correctRaceName": correct_name,
          }
          print(json.dumps(snapshot, ensure_ascii=False))
          sys.exit(0 if sources >= 72 and race_count > 0 and sync_finished and correct_name else 1)
          PY
            then
              echo "Final production verification passed."
              exit 0
            fi
            sleep 10
          done

          echo "Final production verification timed out."
          echo "$status"
          echo "$races"
          exit 1
