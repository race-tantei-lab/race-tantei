name: Production smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current production is alive
        shell: bash
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 -D /tmp/home.headers "${base}/" >/tmp/home.html
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 "${base}/conditions" >/tmp/conditions.html
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 "${base}/guide" >/tmp/guide.html
          grep -Fq 'レース探偵' /tmp/home.html
          grep -Fq '完成モデル＋継続学習' /tmp/conditions.html
          grep -Fq '継続学習について' /tmp/guide.html
          echo 'PRODUCTION_SMOKE_OK'
