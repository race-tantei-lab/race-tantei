name: Production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Phase D pending verification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/phase-d' \
            -f description='Verifying unified ROI and scaled course budgets' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Wait for Cloudflare deployment and verify health
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          expected=""
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected="$(grep '"MODEL_VERSION"' wrangler.jsonc | sed -E 's/.*"MODEL_VERSION"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          fi
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error --fail --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" EXPECTED="$expected" python - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ.get("HEALTH", ""))
          except Exception:
              sys.exit(1)
          expected = os.environ.get("EXPECTED", "")
          valid = data.get("ok") is True and bool(data.get("modelVersion"))
          if expected:
              valid = valid and data.get("modelVersion") == expected
          print(json.dumps({"modelVersion": data.get("modelVersion"), "expected": expected or "any"}))
          sys.exit(0 if valid else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "$health"
              exit 1
            fi
            sleep 10
          done

      - name: Verify current production is alive on PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 4); do
            if curl --silent --show-error --fail --max-time 60 "${base}/" >/tmp/home.html \
              && grep -q 'レース探偵' /tmp/home.html; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Verify venue selections, budgets and unified ROI after deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 30); do
            curl --silent --show-error --fail --max-time 45 -D /tmp/home.headers "${base}/" >/tmp/home.html
            curl --silent --show-error --fail --max-time 45 "${base}/performance" >/tmp/performance.html
            performance="$(curl --silent --show-error --fail --max-time 45 "${base}/api/performance/courses")"
            if HOME_FILE=/tmp/home.html PERFORMANCE_FILE=/tmp/performance.html PERFORMANCE="$performance" python - <<'PY'
          from html.parser import HTMLParser
          import json, os, sys

          class SelectionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.day = None
                  self.venue = None
                  self.stack = []
                  self.counts = {}
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  previous = (self.day, self.venue)
                  self.stack.append((tag, previous))
                  if tag == "section" and values.get("data-day-panel"):
                      self.day = values["data-day-panel"]
                  if tag == "section" and values.get("data-venue-panel"):
                      self.venue = values["data-venue-panel"]
                  if tag == "a" and values.get("data-race-selected") == "true" and self.day and self.venue:
                      key = (self.day, self.venue)
                      self.counts[key] = self.counts.get(key, 0) + 1
              def handle_endtag(self, tag):
                  for index in range(len(self.stack) - 1, -1, -1):
                      open_tag, previous = self.stack[index]
                      if open_tag == tag:
                          self.stack = self.stack[:index]
                          self.day, self.venue = previous
                          break

          home_html = open(os.environ["HOME_FILE"], encoding="utf-8").read()
          performance_html = open(os.environ["PERFORMANCE_FILE"], encoding="utf-8").read()
          parser = SelectionParser()
          parser.feed(home_html)
          performance = json.loads(os.environ.get("PERFORMANCE", "{}"))
          historical = performance.get("historical", []) if isinstance(performance, dict) else []
          target_stakes = {"ライト": 1600, "スタンダード": 4200, "プレミアム": 8800}
          historical_ok = len(historical) == 3
          budget_ok = historical_ok
          for row in historical:
              course = row.get("course")
              races = int(row.get("selectedRaces", 0))
              stake = float(row.get("stakeYen", 0))
              pending = int(row.get("pendingTickets", 0))
              target = target_stakes.get(course)
              if not target or races <= 0 or pending != 0:
                  budget_ok = False
                  continue
              average = stake / races
              if abs(average - target) > 0.01:
                  budget_ok = False

          expected_dates = {"2026-08-01", "2026-08-02"}
          counts = {
              f"{date}:{venue}": count
              for (date, venue), count in parser.counts.items()
              if date in expected_dates
          }
          venue_ok = len(counts) >= 6 and all(count >= 5 for count in counts.values())
          home_ok = (
              "総合成績" in home_html
              and "過去レース＋本番を合算" in home_html
              and "1R目安" not in home_html
              and "上限 " not in home_html
              and "本番公開成績" not in home_html
          )
          performance_ok = (
              "コース別総合成績" in performance_html
              and "過去レースと本番公開分を分けずに合算" in performance_html
              and "1レースの購入額" not in performance_html
              and "目安1,600円" not in performance_html
              and "上限2,000円" not in performance_html
              and "本番公開のみ" not in performance_html
              and "遡及検証のみ" not in performance_html
          )
          valid = historical_ok and budget_ok and venue_ok and home_ok and performance_ok
          print(json.dumps({
              "historical": historical,
              "venueSelections": counts,
              "budgetOk": budget_ok,
              "homeOk": home_ok,
              "performanceOk": performance_ok,
              "valid": valid
          }, ensure_ascii=False))
          sys.exit(0 if valid else 1)
          PY
            then
              grep -qi '^x-race-ui-version: phase-d' /tmp/home.headers
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "$performance"
              exit 1
            fi
            sleep 10
          done

      - name: Publish Phase D production verification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/phase-d' \
            -f description='Unified ROI and scaled budgets verified' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish Phase D failure
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/phase-d' \
            -f description='Unified ROI production verification failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
