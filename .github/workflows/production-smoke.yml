name: Production smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all weekend race records in production
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 180); do
            echo "All-records attempt ${attempt}/180"
            health="$(curl --silent --show-error --fail --max-time 25 "${base}/health" || true)"
            status="$(curl --silent --show-error --fail --max-time 25 "${base}/api/status" || true)"
            races="$(curl --silent --show-error --fail --max-time 25 "${base}/api/races" || true)"
            if HEALTH="$health" STATUS="$status" RACES="$races" python - <<'PY'
          import json, os, re, sys
          try:
              health = json.loads(os.environ.get("HEALTH", ""))
              status = json.loads(os.environ.get("STATUS", ""))
              races = json.loads(os.environ.get("RACES", ""))
          except Exception:
              sys.exit(1)

          sources = sum(int(row.get("count", 0)) for row in status.get("sourceCounts", []))
          weekend = [r for r in races if r.get("raceDate") in {"2026-08-01", "2026-08-02"}] if isinstance(races, list) else []
          unique_ids = {r.get("raceId") for r in weekend if r.get("raceId")}
          bad_names = [
              {"raceId": r.get("raceId"), "raceName": r.get("raceName")}
              for r in weekend
              if not r.get("raceName")
              or r.get("raceName") == "検索ウィンドウ"
              or re.fullmatch(r"\d+(?:R|レース)?", str(r.get("raceName")))
          ]
          target = next((r for r in weekend if r.get("raceId") == "2026-08-01-sapporo-05"), None)
          correct_target = bool(target and target.get("raceName") == "メイクデビュー札幌")
          last_sync = status.get("lastSync") or {}
          snapshot = {
              "health": health.get("ok"),
              "model": health.get("modelVersion"),
              "sources": sources,
              "weekendRaceCount": len(unique_ids),
              "badNames": bad_names,
              "targetRace": target,
              "lastSync": last_sync,
          }
          print(json.dumps(snapshot, ensure_ascii=False))
          ok = (
              health.get("ok") is True
              and health.get("modelVersion") == "v2.0.1-live"
              and sources >= 72
              and len(unique_ids) >= 72
              and not bad_names
              and correct_target
              and bool(last_sync.get("finished_at"))
          )
          sys.exit(0 if ok else 1)
          PY
            then
              echo "All 72 weekend race records are stored with valid names."
              exit 0
            fi
            sleep 10
          done
          echo "All-records production verification timed out."
          exit 1
