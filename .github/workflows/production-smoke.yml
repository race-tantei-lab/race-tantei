name: Production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production verification pending
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/phase-d' -f description='Verifying canonical Race Tantei public deployment' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify current production is alive on PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 "${base}/" >/tmp/home.html
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 "${base}/conditions" >/tmp/conditions.html
          curl --silent --show-error --fail --connect-timeout 3 --max-time 10 "${base}/guide" >/tmp/guide.html
          grep -q 'レース探偵' /tmp/home.html
          grep -q '予想ロジック' /tmp/conditions.html
          grep -q 'レース探偵の使い方' /tmp/guide.html

      - name: Wait for canonical deployment and public API
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"

          fetch_url() {
            local url="$1" body="$2" codefile="$3"
            local code
            code="$(curl --silent --show-error --connect-timeout 3 --max-time 8 -o "$body" -w '%{http_code}' "$url" || true)"
            printf '%s' "$code" >"$codefile"
          }

          for attempt in $(seq 1 12); do
            fetch_url "${base}/" /tmp/home.html /tmp/home.code & p1=$!
            fetch_url "${base}/conditions" /tmp/conditions.html /tmp/conditions.code & p2=$!
            fetch_url "${base}/api/public/day?date=2026-08-08" /tmp/day8.json /tmp/day8.code & p3=$!
            fetch_url "${base}/api/public/day?date=2026-08-09" /tmp/day9.json /tmp/day9.code & p4=$!
            wait "$p1"; wait "$p2"; wait "$p3"; wait "$p4"

            home_code="$(cat /tmp/home.code)"
            conditions_code="$(cat /tmp/conditions.code)"
            c8="$(cat /tmp/day8.code)"
            c9="$(cat /tmp/day9.code)"
            echo "attempt=${attempt} home=${home_code} conditions=${conditions_code} day8=${c8} day9=${c9}"

            if [ "$home_code" = "200" ] && [ "$conditions_code" = "200" ] && [ "$c8" = "200" ] && [ "$c9" = "200" ]; then
              if python - <<'PY'
          import json,sys
          home=open('/tmp/home.html',encoding='utf-8').read()
          conditions=open('/tmp/conditions.html',encoding='utf-8').read()
          d8=json.load(open('/tmp/day8.json',encoding='utf-8'))
          d9=json.load(open('/tmp/day9.json',encoding='utf-8'))
          r8=d8.get('races')
          r9=d9.get('races')
          condition_markers=(
            '予想ロジック',
            '上位5頭',
            '選定用の仮買い目',
            'Plackett-Luce',
            'ln(予測確率) + 0.4 × ln(JRA公式オッズ)',
            '未使用データだけで検証した成績ではありません',
            'データ更新のタイミング',
            '公開した買い目と結果は後から変更しません',
          )
          checks={
            'homeAlive':'レース探偵' in home,
            'courses':all(x in home for x in ('ライト','スタンダード','プレミアム')),
            'conditionsMethodology':all(marker in conditions for marker in condition_markers),
            'day8ApiShape':isinstance(r8,list) and len(r8)>0,
            'day9ApiShape':isinstance(r9,list) and len(r9)>0,
          }
          print(json.dumps({
            'checks':checks,
            'day8RaceCount':len(r8) if isinstance(r8,list) else None,
            'day9RaceCount':len(r9) if isinstance(r9,list) else None,
          },ensure_ascii=False))
          sys.exit(0 if all(checks.values()) else 1)
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          echo 'Canonical public site did not satisfy production smoke within the bounded wait.'; exit 1

      - name: Publish production verification
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/phase-d' -f description='Canonical public API and product copy verified' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish production verification failure
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/phase-d' -f description='Canonical public deployment verification failed' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
