name: Durable Runtime Probe

on:
  push:
    branches: [fix/durable-autonomous-race-ops]
    paths:
      - ".github/workflows/durable-runtime-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify deployed durable runtime
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          today=$(TZ=Asia/Tokyo date +%F)
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH sel AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:$today'
            ),
            future AS (
              SELECT r.race_id AS raceId
              FROM rt_races r JOIN sel ON sel.raceId=r.race_id
              WHERE julianday(r.start_time_utc)>julianday('now')
            )
            SELECT
              datetime('now','+9 hours') AS jstNow,
              (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_driver:$today') AS driverUpdatedAt,
              (SELECT state_value FROM rt_system_state WHERE state_key='live_deadline_driver:$today') AS driver,
              (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_primary_heartbeat:v1') AS heartbeatUpdatedAt,
              (SELECT COUNT(*) FROM future) AS futureCount,
              (SELECT COUNT(*) FROM future f WHERE EXISTS(
                SELECT 1 FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||f.raceId
              ) OR (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=f.raceId AND b.source_prediction_id=-2)=6) AS protectedFutureCount,
              (SELECT COUNT(*) FROM rt_system_state s WHERE s.state_key LIKE 'worker_live_final:$today%' AND json_extract(s.state_value,'$.oddsMode')='probability_fallback') AS probabilityFallbackFinals,
              (SELECT COUNT(DISTINCT a.race_id) FROM rt_live_preview_archive a JOIN sel ON sel.raceId=a.race_id) AS archivedSelectedCount
          " > /tmp/probe.json
          cat /tmp/probe.json
          python3 - <<'PY'
          import json,datetime
          raw=json.load(open('/tmp/probe.json')); rows=[]
          for b in raw if isinstance(raw,list) else [raw]:
              if isinstance(b,dict): rows += b.get('results') or []
          assert rows, raw
          r=rows[0]
          d=json.loads(r.get('driver') or '{}')
          assert d.get('version')=='live-deadline-v13-durable-official-lastgood-20260920', d
          assert d.get('phase')=='complete', d
          assert int(r.get('protectedFutureCount') or 0)==int(r.get('futureCount') or 0), r
          assert int(r.get('probabilityFallbackFinals') or 0)==0, r
          assert int(r.get('archivedSelectedCount') or 0)>=1, r
          hb=datetime.datetime.fromisoformat(str(r['heartbeatUpdatedAt']).replace(' ','T')+'+00:00')
          assert (datetime.datetime.now(datetime.timezone.utc)-hb).total_seconds()<180, (hb,r)
          print('DURABLE_RUNTIME_PROBE_OK',json.dumps(r,ensure_ascii=False))
          PY
      - name: Verify health
        run: |
          curl -fsS https://race-tantei-live-deadline.race-tantei.workers.dev/health | grep -q 'live-deadline-v13-durable-official-lastgood-20260920'
          curl -fsS https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health | grep -q 'live-deadline-v13-durable-official-lastgood-20260920'
