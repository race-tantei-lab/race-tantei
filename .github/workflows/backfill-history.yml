name: One-off history backfill
run-name: Targeted history market repair · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/repair-invalid-market-history.mjs"
      - "src/v1/three-month-history.ts"
      - "src/v1/three-month-desktop.ts"
      - ".github/workflows/backfill-history.yml"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Concurrent JRA result requests"
        required: false
        default: "2"
      request_interval_ms:
        description: "Minimum interval between JRA requests"
        required: false
        default: "850"

permissions:
  contents: read
  statuses: write

concurrency:
  group: race-tantei-history-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      REPAIR_CONCURRENCY: ${{ inputs.concurrency || '2' }}
      REPAIR_REQUEST_INTERVAL_MS: ${{ inputs.request_interval_ms || '850' }}
      REPAIR_RACES_PER_FILE: "30"
      REPAIR_MAX_ATTEMPTS: "6"
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MARKET_AUDIT_SQL: >-
        WITH per_race AS (
          SELECT r.race_id, r.race_date,
            SUM(CASE WHEN rr.runner_status='active' THEN 1 ELSE 0 END) AS active_runners,
            SUM(CASE WHEN rr.runner_status='active' AND rr.win_odds IS NOT NULL AND rr.win_odds>1
              AND rr.popularity BETWEEN 1 AND 18 THEN 1 ELSE 0 END) AS valid_market_runners,
            SUM(CASE WHEN rr.runner_status='active' AND (
              rr.win_odds IS NULL OR rr.win_odds<=1 OR
              rr.popularity IS NULL OR rr.popularity<1 OR rr.popularity>18 OR
              rr.popularity <> 1 + (
                SELECT COUNT(*) FROM rt_runners better
                WHERE better.race_id=rr.race_id
                  AND better.runner_status='active'
                  AND better.popularity < rr.popularity
              )
            ) THEN 1 ELSE 0 END) AS invalid_market_runners,
            COUNT(DISTINCT CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS distinct_popularity,
            MIN(CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS min_popularity,
            MAX(CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS max_popularity
          FROM rt_races r
          JOIN rt_runners rr ON rr.race_id=r.race_id
          WHERE r.status='finished' AND r.race_date BETWEEN '2024-05-01' AND '2026-08-02'
          GROUP BY r.race_id, r.race_date
        )
        SELECT COUNT(*) AS races,
          SUM(CASE WHEN active_runners>=2 THEN 1 ELSE 0 END) AS auditable_races,
          SUM(CASE WHEN active_runners>=2 AND invalid_market_runners>0 THEN 1 ELSE 0 END) AS invalid_races,
          SUM(CASE WHEN active_runners>=2 AND max_popularity>18 THEN 1 ELSE 0 END) AS popularity_over_18_races,
          MIN(race_date) AS first_date,
          MAX(race_date) AS last_date
        FROM per_race;
      INVALID_RACES_SQL: >-
        WITH per_race AS (
          SELECT r.race_id,
            SUM(CASE WHEN rr.runner_status='active' THEN 1 ELSE 0 END) AS active_runners,
            SUM(CASE WHEN rr.runner_status='active' AND rr.win_odds IS NOT NULL AND rr.win_odds>1
              AND rr.popularity BETWEEN 1 AND 18 THEN 1 ELSE 0 END) AS valid_market_runners,
            SUM(CASE WHEN rr.runner_status='active' AND (
              rr.win_odds IS NULL OR rr.win_odds<=1 OR
              rr.popularity IS NULL OR rr.popularity<1 OR rr.popularity>18 OR
              rr.popularity <> 1 + (
                SELECT COUNT(*) FROM rt_runners better
                WHERE better.race_id=rr.race_id
                  AND better.runner_status='active'
                  AND better.popularity < rr.popularity
              )
            ) THEN 1 ELSE 0 END) AS invalid_market_runners,
            COUNT(DISTINCT CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS distinct_popularity,
            MIN(CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS min_popularity,
            MAX(CASE WHEN rr.runner_status='active' THEN rr.popularity END) AS max_popularity
          FROM rt_races r
          JOIN rt_runners rr ON rr.race_id=r.race_id
          WHERE r.status='finished' AND r.race_date BETWEEN '2024-05-01' AND '2026-08-02'
          GROUP BY r.race_id
        )
        SELECT r.race_id, r.race_date, r.venue, r.race_no, r.result_url,
          p.active_runners, p.valid_market_runners, p.invalid_market_runners,
          p.distinct_popularity, p.min_popularity, p.max_popularity
        FROM per_race p
        JOIN rt_races r ON r.race_id=p.race_id
        WHERE p.active_runners>=2 AND p.invalid_market_runners>0
        ORDER BY r.race_date, r.venue, r.race_no;

    steps:
      - name: Publish setup status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='history/backfill' \
            -f description='準備中：人気データの限定修復' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile parsers and validate script
        shell: bash
        run: |
          npm run build:test
          node --check scripts/repair-invalid-market-history.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            canonicalOfficialJraResultUrl,
            hasValidPopularityRanks,
            isOfficialJraResultUrl
          } from './scripts/repair-invalid-market-history.mjs';
          assert.equal(isOfficialJraResultUrl('https://sp.jra.jp/JRADB/accessS.html?CNAME=sw01sde01'), true);
          assert.equal(isOfficialJraResultUrl('https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde01'), true);
          assert.equal(isOfficialJraResultUrl('https://jra.go.jp/JRADB/accessS.html?CNAME=pw01sde01'), true);
          assert.equal(isOfficialJraResultUrl('http://sp.jra.jp/JRADB/accessS.html'), false);
          assert.equal(isOfficialJraResultUrl('https://evil-jra.jp/JRADB/accessS.html'), false);
          assert.equal(isOfficialJraResultUrl('https://sp.jra.jp.example.com/JRADB/accessS.html'), false);
          assert.equal(isOfficialJraResultUrl('https://sp.jra.jp/not-jradb'), false);
          const canonical = new URL(canonicalOfficialJraResultUrl(
            'https://sp.jra.jp/JRADB/accessS.html?CNAME=sw01sde1001202601030120260801/DC'
          ));
          assert.equal(canonical.hostname, 'www.jra.go.jp');
          assert.equal(canonical.searchParams.get('CNAME'), 'pw01sde1001202601030120260801/DC');
          assert.equal(hasValidPopularityRanks([1, 2, 2, 4], 4), true);
          assert.equal(hasValidPopularityRanks([1, 2, 3, 4], 4), true);
          assert.equal(hasValidPopularityRanks([1, 2, 2, 3], 4), false);
          assert.equal(hasValidPopularityRanks([2, 2], 2), false);
          console.log('history repair validation tests passed');
          NODE

      - name: Publish pre-audit status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='history/backfill' \
            -f description='処理中：全7,695レースの修復前監査' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Audit D1 and export invalid races
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/history-market-repair
          npx wrangler d1 execute race-tantei-phase0 --remote --command "$MARKET_AUDIT_SQL" --json --config wrangler.jsonc \
            > tmp/history-market-repair/market-audit-before.json
          npx wrangler d1 execute race-tantei-phase0 --remote --command "$INVALID_RACES_SQL" --json --config wrangler.jsonc \
            > tmp/history-market-repair/invalid-races.json
          cat tmp/history-market-repair/market-audit-before.json
          TARGET_COUNT=$(node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const payload = JSON.parse(await readFile('tmp/history-market-repair/invalid-races.json', 'utf8'));
          const rows = [];
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== 'object') return;
            if ('race_id' in value && 'result_url' in value) rows.push(value);
            else Object.values(value).forEach(visit);
          };
          visit(payload);
          const unique = new Set(rows.map((row) => String(row.race_id)));
          console.log(unique.size);
          NODE
          )
          echo "count=$TARGET_COUNT" >> "$GITHUB_OUTPUT"
          echo "targeted invalid races: $TARGET_COUNT"

      - name: Publish targeted fetch status
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='history/backfill' \
            -f description='処理中：修復対象のみ公式結果を再取得' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Fetch and validate targeted official results
        if: steps.targets.outputs.count != '0'
        run: node scripts/repair-invalid-market-history.mjs

      - name: Publish D1 repair status
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='history/backfill' \
            -f description='処理中：修復済み人気順位をD1へ限定更新' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Load targeted repair SQL into D1
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tmp/history-market-repair/sql/repair-*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No targeted repair SQL files" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Loading $file"
            npx wrangler d1 execute race-tantei-phase0 --remote --file "$file" --config wrangler.jsonc
          done

      - name: Publish post-audit status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='history/backfill' \
            -f description='処理中：修復後の全期間完全性監査' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Audit D1 market data after repair
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --command "$MARKET_AUDIT_SQL" --json --config wrangler.jsonc \
            > tmp/history-market-repair/market-audit-after.json
          cat tmp/history-market-repair/market-audit-after.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const payload = JSON.parse(await readFile("tmp/history-market-repair/market-audit-after.json", "utf8"));
          const queue = [payload];
          let row = null;
          while (queue.length > 0 && !row) {
            const value = queue.shift();
            if (Array.isArray(value)) queue.push(...value);
            else if (value && typeof value === "object") {
              if (Object.prototype.hasOwnProperty.call(value, "invalid_races")) row = value;
              else queue.push(...Object.values(value));
            }
          }
          if (!row) throw new Error("MARKET_AUDIT_RESULT_NOT_FOUND");
          const invalid = Number(row.invalid_races ?? -1);
          const auditable = Number(row.auditable_races ?? 0);
          console.log(JSON.stringify({ auditableRaces: auditable, invalidRaces: invalid }));
          if (!Number.isFinite(invalid) || invalid !== 0) {
            throw new Error(`MARKET_AUDIT_FAILED:${invalid}`);
          }
          NODE

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-backfill-report
          path: |
            tmp/history-market-repair/summary.json
            tmp/history-market-repair/failures.json
            tmp/history-market-repair/invalid-races.json
            tmp/history-market-repair/market-audit-before.json
            tmp/history-market-repair/market-audit-after.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
            DESCRIPTION='完了：全期間の修復対象0件・監査合格'
          else
            STATE=failure
            DESCRIPTION='失敗：限定履歴修復のログ確認が必要'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='history/backfill' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
