name: One-off history backfill

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-history-v2.mjs"
      - "src/v1/three-month-desktop.ts"
      - ".github/workflows/backfill-history.yml"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Concurrent JRA page downloads"
        required: false
        default: "24"

permissions:
  contents: read

concurrency:
  group: race-tantei-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      BACKFILL_CONCURRENCY: ${{ inputs.concurrency || '24' }}
      BACKFILL_RACES_PER_FILE: "40"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile parsers
        run: npm run build:test

      - name: Download and parse all history pages in parallel
        run: node scripts/backfill-history-v2.mjs

      - name: Bulk load generated SQL into D1
        shell: bash
        run: |
          set -euo pipefail
          for file in tmp/history-backfill/backfill-*.sql; do
            echo "Loading $file"
            npx wrangler d1 execute race-tantei-phase0 --remote --file "$file" --config wrangler.jsonc
          done
          npx wrangler d1 execute race-tantei-phase0 --remote --file tmp/history-backfill/zzzz-state.sql --config wrangler.jsonc

      - name: Verify repaired popularity ranks
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS invalid_popularity_rows
            FROM rt_runners rr
            JOIN rt_races r ON r.race_id = rr.race_id
            WHERE r.race_date BETWEEN '2024-05-01' AND '2026-08-31'
              AND rr.runner_status = 'active'
              AND (rr.popularity IS NULL OR rr.popularity < 1 OR rr.popularity > 18);
          " | tee popularity-integrity.txt
          if grep -Eq 'invalid_popularity_rows[^0-9]*[1-9][0-9]*' popularity-integrity.txt; then
            echo "Invalid popularity rows remain after backfill"
            exit 1
          fi

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-backfill-report
          path: |
            tmp/history-backfill/summary.json
            tmp/history-backfill/failures.json
            popularity-integrity.txt
          if-no-files-found: ignore
          retention-days: 14
