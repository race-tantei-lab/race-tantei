name: 2026-09-06 production preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-20260906.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 0 6 9 *' # 09:25 JST on Sep 6; acceptance after daily D1 reset/bootstrap

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4

      - name: Export tomorrow readiness without rows_read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export';headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result') or {}
          opts={'tables':['rt_races','rt_runners','rt_selection_state_meta','rt_system_state']}
          result=post({'output_format':'polling','dump_options':opts});bookmark=result.get('at_bookmark')
          for _ in range(90):
            signed=(result.get('result') or {}).get('signed_url')
            if signed: break
            if not bookmark: raise RuntimeError('EXPORT_BOOKMARK_MISSING')
            time.sleep(1);result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':opts})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=180) as r: open('/tmp/preflight.sql','wb').write(r.read())
          print('EXPORT_BYTES',os.path.getsize('/tmp/preflight.sql'))
          PY

      - name: Build local export database and inspect recovery readiness
        shell: bash
        run: |
          rm -f /tmp/preflight.sqlite
          python3 - <<'PY'
          import json,sqlite3
          con=sqlite3.connect('/tmp/preflight.sqlite');con.executescript(open('/tmp/preflight.sql',encoding='utf-8').read())
          rows=con.execute("SELECT race_date,venue,meeting_no,meeting_day,COUNT(*) FROM rt_races WHERE race_date='2026-09-06' GROUP BY race_date,venue,meeting_no,meeting_day HAVING COUNT(*)=12 ORDER BY venue").fetchall()
          meetings=[{'date':r[0],'venue':r[1],'meetingNo':int(r[2]),'meetingDay':int(r[3]),'raceCount':int(r[4])} for r in rows]
          if len(meetings)!=3: raise SystemExit('MEETING_0906_NOT_THREE:'+json.dumps(meetings,ensure_ascii=False))
          states=dict(con.execute("SELECT state_key,state_value FROM rt_system_state WHERE state_key IN ('worker_upcoming_calendar_repair','worker_upcoming_entry_repair','worker_upcoming_entry_derived_repair')").fetchall())
          anchors=con.execute("""
            SELECT venue,race_date,entry_url FROM rt_races
            WHERE race_no=1 AND race_date<'2026-09-06'
              AND entry_url LIKE '%/JRADB/accessD.html?CNAME=pw01dde01%'
              AND venue IN ('中山','札幌','阪神')
            ORDER BY venue,race_date DESC
          """).fetchall()
          latest={}
          for venue,date,url in anchors:
            latest.setdefault(str(venue),{'raceDate':str(date),'entryUrl':str(url)})
          print('MEETINGS_0906',json.dumps(meetings,ensure_ascii=False))
          print('DERIVED_RECOVERY_ANCHORS',json.dumps(latest,ensure_ascii=False))
          missing=sorted({'中山','札幌','阪神'}-set(latest))
          if missing: print('DERIVED_RECOVERY_ANCHORS_MISSING',','.join(missing))
          for key in ('worker_upcoming_calendar_repair','worker_upcoming_entry_repair','worker_upcoming_entry_derived_repair'):
            print('CLOUDFLARE_MAINTENANCE_STATE',key,states.get(key,'MISSING'))
          con.close()
          PY

      - name: Verify 9/6 program, real runners and selection model state
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,json,sqlite3
          date='2026-09-06';con=sqlite3.connect('/tmp/preflight.sqlite')
          races=con.execute('SELECT race_id,venue,race_no,start_time_utc FROM rt_races WHERE race_date=? ORDER BY venue,race_no',(date,)).fetchall()
          by=collections.Counter(str(r[1]) for r in races)
          if len(races)!=36 or set(by.values())!={12}: raise SystemExit('PROGRAM_NOT_36:'+json.dumps(dict(by),ensure_ascii=False))
          if any(not r[3] for r in races): raise SystemExit('START_TIME_MISSING')
          readiness=con.execute('''SELECT r.race_id,r.venue,r.race_no,SUM(CASE WHEN rr.race_id IS NOT NULL AND COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS active
            FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id WHERE r.race_date=? GROUP BY r.race_id,r.venue,r.race_no ORDER BY r.venue,r.race_no''',(date,)).fetchall()
          bad=[{'raceId':r[0],'venue':r[1],'raceNo':r[2],'active':r[3]} for r in readiness if int(r[3] or 0)<3]
          if len(readiness)!=36 or bad: raise SystemExit('RUNNERS_INCOMPLETE:'+json.dumps(bad,ensure_ascii=False))
          meta=dict(con.execute('SELECT key,value FROM rt_selection_state_meta').fetchall())
          if meta.get('ready')!='1' or meta.get('modelVersion')!='ten-year-completed-model' or not meta.get('generation') or int(meta.get('chunkCount') or 0)<=0 or int(meta.get('byteLength') or 0)<=0:
            raise SystemExit('SELECTION_MODEL_STATE_NOT_READY:'+json.dumps(meta,ensure_ascii=False))
          con.close();print('PREFLIGHT_DB_OK',date,'RACES',len(races),'VENUES',dict(by),'RUNNER_RACES',len(readiness),'MODEL',meta.get('modelVersion'),'GENERATION',meta.get('generation'))
          PY

      - name: Verify deployed live workers and public 9/6 API
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --retry 2 --max-time 10 -sS -o /tmp/p -w '%{http_code}' https://race-tantei-live-deadline.race-tantei.workers.dev/health)" = 200
          test "$(curl --retry 2 --max-time 10 -sS -o /tmp/b -w '%{http_code}' https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health)" = 200
          curl --retry 2 --max-time 15 -fsS 'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-06' -o /tmp/day.json
          python3 - <<'PY'
          import collections,json
          body=json.load(open('/tmp/day.json',encoding='utf-8'));races=body.get('races') or [];by=collections.Counter(str(x.get('venue') or '') for x in races)
          if len(races)!=36 or len(by)!=3 or any(v!=12 for v in by.values()): raise SystemExit('PUBLIC_0906_NOT_36:'+json.dumps(dict(by),ensure_ascii=False))
          print('PREFLIGHT_PUBLIC_OK','RACES',len(races),'VENUES',dict(by),'SOURCE',body.get('fallbackSource','live-d1'))
          PY

      - name: Verify permanent configs point to v3 gate
        shell: bash
        run: |
          grep -q 'src/live-deadline-entry-v3.ts' wrangler.live-deadline.jsonc
          grep -q 'src/live-deadline-entry-v3.ts' wrangler.live-deadline-backup.jsonc
          grep -q "cron: '1 0 \* \* \*'" .github/workflows/race-day-bootstrap.yml
          echo 'PREFLIGHT_20260906_OK'
