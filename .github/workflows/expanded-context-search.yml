name: Expanded context ROI completion search
run-name: Expanded context ROI completion search · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-expanded-context-search.py"
      - "scripts/verify-race-tantei-fixed-constraints.py"
      - "scripts/verify-production-candidate.py"
      - "scripts/find-and-promote-production-candidate.py"
      - "scripts/verify-approved-production-model.py"
      - "config/race-tantei-fixed-constraints.json"
      - "docs/RACE_TANTEI_NON_NEGOTIABLE_RULES.md"
      - ".github/workflows/expanded-context-search.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: expanded-context-roi-completion-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish exploration start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/expanded-context-search' \
            -f description='内部探索中：固定条件を維持したまま完成条件200%以上を探索' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify immutable completion rules
        run: |
          python -m py_compile \
            scripts/analyze-expanded-context-search.py \
            scripts/verify-race-tantei-fixed-constraints.py \
            scripts/verify-production-candidate.py \
            scripts/find-and-promote-production-candidate.py \
            scripts/verify-approved-production-model.py
          python scripts/verify-race-tantei-fixed-constraints.py

      - name: Run unversioned exploration
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-expanded-context-search.py 2>&1 | tee expanded-context-search.log

      - name: Attempt promotion only through completion gate
        if: success()
        shell: bash
        run: |
          set -o pipefail
          python scripts/find-and-promote-production-candidate.py | tee exploration-promotion.log
          if [[ -f config/approved-production-model.json ]]; then
            python scripts/verify-approved-production-model.py
          fi

      - name: Stage internal result or approved completion
        if: success()
        shell: bash
        run: |
          git add -f analysis-results/exploration-expanded-context.json
          if [[ -f config/approved-production-model.json ]]; then
            git add \
              config/approved-production-model.json \
              scripts/final-course-policy.py \
              analysis-results/v16-completion-report.json
          fi

      - name: Upload exploration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-context-search
          path: |
            analysis-results/exploration-expanded-context.json
            expanded-context-search.log
            exploration-promotion.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save exploration state
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No exploration state changes to save."
          else
            git commit -m "Save expanded context exploration result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            STATE=failure
            DESCRIPTION='内部探索処理でエラー。ログを確認'
          elif [[ -f config/approved-production-model.json ]]; then
            STATE=success
            DESCRIPTION='完成条件合格：全ゲート通過後にv16を昇格'
          else
            STATE=success
            DESCRIPTION='内部探索完了：完成条件通過前のため本番変更なし'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='analysis/expanded-context-search' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
