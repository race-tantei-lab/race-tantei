name: Sep21 Emergency Canonical Final
# rerun with corrected T45-T15 recovery window

on:
  push:
    branches: [ops/sep21-final-preflight]
    paths:
      - ".github/workflows/sep21-emergency-canonical-final.yml"

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" numpy
      - name: Run canonical pre-T15 generator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run-ten-year-auto-final-live.py | tee /tmp/live.log
      - name: Verify all selected races inside T45 have canonical six rows or remain safely before T15
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH sel AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:2026-09-21'
            )
            SELECT r.race_id AS raceId,r.start_time_jst AS startTimeJst,
                   ROUND((julianday(r.start_time_utc)-julianday('now'))*1440,2) AS remainingMin,
                   (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
                   (SELECT MIN(locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS lockedAt
            FROM rt_races r JOIN sel ON sel.raceId=r.race_id
            WHERE (julianday(r.start_time_utc)-julianday('now'))*1440.0 > 0
              AND (julianday(r.start_time_utc)-julianday('now'))*1440.0 <= 45
            ORDER BY r.start_time_utc
          " > /tmp/verify.json
          cat /tmp/verify.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/verify.json')); rows=[]
          for b in raw if isinstance(raw,list) else [raw]:
              if isinstance(b,dict): rows += b.get('results') or []
          bad=[]
          for r in rows:
              rem=float(r.get('remainingMin') or 0)
              n=int(r.get('finalRows') or 0)
              if rem <= 15 and n != 6:
                  bad.append(r)
          if bad:
              raise SystemExit('T15_FINAL_MISSING:'+json.dumps(bad,ensure_ascii=False))
          print('SEP21_EMERGENCY_VERIFY',json.dumps(rows,ensure_ascii=False))
          PY
