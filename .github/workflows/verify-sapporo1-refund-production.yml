name: Verify Sapporo1 refund production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sapporo1-refund-production.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trigger production result reconciliation
        shell: bash
        run: |
          set +e
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in 1 2 3 4; do
            echo "production sync trigger $i"
            curl --retry 1 --retry-delay 1 --retry-all-errors --connect-timeout 5 --max-time 45 -fsS "$base/?refund_sync=$i" >/tmp/home-$i.html
            sleep 12
          done
          exit 0
      - name: Verify Sapporo 1R official settlement
        run: |
          python - <<'PY'
          import datetime as dt,importlib.util,json,pathlib,sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('verify_d1',p);m=importlib.util.module_from_spec(s);sys.modules['verify_d1']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat();rid=f'{date}-sapporo-01'
          race=m.d1_query('''SELECT refund_horse_nos_json AS refunds,result_url AS resultUrl,status FROM rt_races WHERE race_id=?''',[rid])
          bets=m.d1_query('''SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,return_yen AS returnYen,settlement_status AS settlementStatus FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination''',[rid])
          payouts=m.d1_query('''SELECT bet_type AS betType,combination,payout_yen AS payoutYen FROM rt_payouts WHERE race_id=? ORDER BY bet_type,combination''',[rid])
          if not race: raise RuntimeError('SAPPORO1_RACE_MISSING')
          refunds=set(json.loads(str(race[0].get('refunds') or '[]')))
          if not {8,10}.issubset(refunds): raise RuntimeError(f'SAPPORO1_REFUNDS_MISSING:{sorted(refunds)}')
          if len(bets)!=6: raise RuntimeError(f'SAPPORO1_BET_COUNT:{len(bets)}')
          pending=[b for b in bets if str(b.get('settlementStatus'))!='settled']
          if pending: raise RuntimeError('SAPPORO1_PENDING:'+json.dumps(pending,ensure_ascii=False))
          refund_bets=[b for b in bets if str(b.get('betType'))=='ワイド' and str(b.get('combination')) in {'5-8','8-5'}]
          if len(refund_bets)!=3: raise RuntimeError('SAPPORO1_REFUND_BETS_INVALID:'+json.dumps(refund_bets,ensure_ascii=False))
          bad_refunds=[b for b in refund_bets if int(b.get('returnYen') or -1)!=int(b.get('stakeYen') or 0)]
          if bad_refunds: raise RuntimeError('SAPPORO1_REFUND_AMOUNT_INVALID:'+json.dumps(bad_refunds,ensure_ascii=False))
          win_payout=[p for p in payouts if str(p.get('betType'))=='単勝' and str(p.get('combination'))=='3']
          if len(win_payout)!=1 or int(win_payout[0].get('payoutYen') or 0)<=0: raise RuntimeError('SAPPORO1_WIN_PAYOUT_MISSING:'+json.dumps(payouts,ensure_ascii=False))
          win_bets=[b for b in bets if str(b.get('betType'))=='単勝' and str(b.get('combination'))=='3']
          if len(win_bets)!=3 or any(int(b.get('returnYen') or 0)<=int(b.get('stakeYen') or 0) for b in win_bets): raise RuntimeError('SAPPORO1_WIN_SETTLEMENT_INVALID:'+json.dumps(win_bets,ensure_ascii=False))
          out={'status':'SAPPORO1_REFUND_PRODUCTION_OK','raceId':rid,'refundHorseNos':sorted(refunds),'winPayoutPer100Yen':int(win_payout[0]['payoutYen']),'bets':bets,'payoutCount':len(payouts),'resultUrl':race[0].get('resultUrl')}
          print(json.dumps(out,ensure_ascii=False))
          PY
