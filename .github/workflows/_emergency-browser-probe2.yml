name: Emergency browser race rail probe
on:
  push:
    branches: [fix/cancelled-race-active-count-verifiers]
    paths: [".github/workflows/_emergency-browser-probe2.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute production home in Chrome
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$chrome"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$base/" >/tmp/dom.html 2>/tmp/chrome.log || true
          echo '=== RACE RAIL ==='
          perl -0777 -ne 'if(/<div class="race-rail" id="races">(.*?)<\/div><\/div><\/section>/s){print substr($1,0,12000)} else {print "NO_RACE_RAIL_MATCH\n"}' /tmp/dom.html
          echo
          echo '=== CHROME ERRORS ==='
          grep -Ei 'TypeError|ReferenceError|Uncaught|ERR_|Failed to fetch|error' /tmp/chrome.log | tail -120 || true
