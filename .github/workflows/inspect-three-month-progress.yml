# progress probe 5
name: Inspect three month progress

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official calendar result links
        run: |
          set -euo pipefail
          for date in 0502 0509 0606 0704 0801; do
            month="${date:0:2}"
            url="https://www.jra.go.jp/keiba/calendar2026/2026/$((10#$month))/${date}.html"
            curl --silent --show-error --fail --max-time 60 "$url" -o "calendar-${date}.raw"
          done
          python - <<'PY'
          import re, urllib.parse
          for date in ('0502','0509','0606','0704','0801'):
              raw=open(f'calendar-{date}.raw','rb').read()
              for enc in ('utf-8','cp932','shift_jis'):
                  try:
                      html=raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      pass
              decoded=urllib.parse.unquote(html).replace('&amp;','&')
              links=[]
              for pattern in (r'[sp]w01sde[0-9A-Za-z/]+', r'CNAME=([^"\'&<> ]+)'):
                  for value in re.findall(pattern, decoded, flags=re.I):
                      if 'sde' in value.lower() and value not in links:
                          links.append(value)
              print('DATE',date,'COUNT',len(links))
              for value in links[:30]:
                  print(value)
          PY

      - name: Read current progress
        run: |
          curl --silent --show-error --fail --max-time 60 \
            "https://race-tantei-phase0.race-tantei.workers.dev/api/history/three-months/status" \
            -o progress.json
          python - <<'PY'
          import json
          data=json.load(open('progress.json',encoding='utf-8'))
          p=data.get('progress',{})
          v=data.get('validation',{})
          print(json.dumps({
            'phase':p.get('phase'),
            'discovery':f"{p.get('discoveryDates')}/{p.get('totalDiscoveryDates')}",
            'meetings':f"{p.get('completedMeetingTasks')}/{p.get('meetingTasks')}",
            'failedRaces':p.get('failedRaces'),
            'storedRaces':p.get('storedRaces'),
            'processedRaces':v.get('processedRaces'),
            'venueDays':v.get('venueDays')
          },ensure_ascii=False,indent=2))
          PY
