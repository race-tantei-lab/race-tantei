# progress probe 6
name: Inspect three month progress

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official result page scripts
        run: |
          set -euo pipefail
          url='https://sp.jra.jp/JRADB/accessS.html?CNAME=sw01sde0104202601010820260502%2F34'
          curl --silent --show-error --fail --max-time 60 "$url" -o historical.raw
          python - <<'PY'
          import re, urllib.parse
          raw=open('historical.raw','rb').read()
          for enc in ('cp932','shift_jis','utf-8'):
              try:
                  html=raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          open('historical.html','w',encoding='utf-8').write(html)
          print('SCRIPT_SRCS')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,flags=re.I):
              print(urllib.parse.urljoin('https://sp.jra.jp/JRADB/accessS.html',src))
          print('INLINE_CNAME_LINES')
          for line in html.splitlines():
              if any(token in line.lower() for token in ('cname','sde10','checksum','encrypt','hash')):
                  print(line[:1000])
          PY
          mkdir -p scripts
          python - <<'PY' > script-urls.txt
          import re, urllib.parse
          html=open('historical.html',encoding='utf-8').read()
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,flags=re.I):
              print(urllib.parse.urljoin('https://sp.jra.jp/JRADB/accessS.html',src))
          PY
          i=0
          while IFS= read -r src; do
            i=$((i+1))
            curl --silent --show-error --max-time 60 "$src" -o "scripts/$i.js" || true
          done < script-urls.txt
          echo 'SCRIPT_MATCHES'
          grep -RniE 'CNAME|sde10|checksum|encrypt|hash|charCodeAt|toString\(16\)' scripts historical.html | head -300 || true

      - name: Read current progress
        run: |
          curl --silent --show-error --fail --max-time 60 \
            "https://race-tantei-phase0.race-tantei.workers.dev/api/history/three-months/status" \
            -o progress.json
          python - <<'PY'
          import json
          data=json.load(open('progress.json',encoding='utf-8'))
          p=data.get('progress',{})
          v=data.get('validation',{})
          print(json.dumps({
            'phase':p.get('phase'),
            'discovery':f"{p.get('discoveryDates')}/{p.get('totalDiscoveryDates')}",
            'meetings':f"{p.get('completedMeetingTasks')}/{p.get('meetingTasks')}",
            'failedRaces':p.get('failedRaces'),
            'storedRaces':p.get('storedRaces'),
            'processedRaces':v.get('processedRaces'),
            'venueDays':v.get('venueDays')
          },ensure_ascii=False,indent=2))
          PY
