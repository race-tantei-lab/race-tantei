# progress probe 4
name: Inspect three month progress

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read progress without mutation
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 60 \
            "${base}/api/history/three-months/status" -o progress.json
          python - <<'PY'
          import json
          data=json.load(open('progress.json',encoding='utf-8'))
          progress=data.get('progress',{})
          validation=data.get('validation',{})
          print(json.dumps({
            'phase':progress.get('phase'),
            'discovery':f"{progress.get('discoveryDates')}/{progress.get('totalDiscoveryDates')}",
            'meetings':f"{progress.get('completedMeetingTasks')}/{progress.get('meetingTasks')}",
            'nextRaceNo':progress.get('nextRaceNo'),
            'failedRaces':progress.get('failedRaces'),
            'storedRaces':progress.get('storedRaces'),
            'validationComplete':validation.get('complete'),
            'processedRaces':validation.get('processedRaces'),
            'totalRaces':validation.get('totalRaces'),
            'remainingRaces':validation.get('remainingRaces'),
            'venueDays':validation.get('venueDays')
          },ensure_ascii=False,indent=2))
          PY

      - name: Inspect official historical navigation links
        run: |
          set -euo pipefail
          url='https://sp.jra.jp/JRADB/accessS.html?CNAME=sw01sde0104202601010820260502%2F34'
          curl --silent --show-error --fail --max-time 60 "$url" -o historical.raw
          python - <<'PY'
          import re, urllib.parse
          raw=open('historical.raw','rb').read()
          for enc in ('cp932','shift_jis','utf-8'):
              try:
                  html=raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          else:
              html=raw.decode('cp932',errors='replace')
          found=[]
          for value in re.findall(r'(?:CNAME=|CNAME%3D)(sw01sde[^"\'&<> ]+)', html, flags=re.I):
              decoded=urllib.parse.unquote(value).replace('&amp;','&')
              if decoded not in found:
                  found.append(decoded)
          for value in re.findall(r'sw01sde\d{20,}/\d{2}', urllib.parse.unquote(html), flags=re.I):
              if value not in found:
                  found.append(value)
          print('RESULT_LINKS')
          for value in found[:100]:
              print(value)
          print('COUNT',len(found))
          PY
