name: Diagnose Niigata 9R T15 pipeline

on:
  push:
    branches:
      - fix/normal-t15-atomic-final-20260816
    paths:
      - .github/workflows/diagnose-niigata9-t15-root.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production D1 timestamps and public page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request

          rid='2026-08-16-niigata-09'
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          db=os.environ['CLOUDFLARE_D1_DATABASE_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def q(sql, params=None):
              req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':params or []}).encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as r: payload=json.loads(r.read().decode())
              if not payload.get('success'): raise RuntimeError(payload.get('errors'))
              return payload.get('result',[{}])[0].get('results',[])

          queries={
            'race':("SELECT race_id AS raceId,start_time_utc AS startTimeUtc,start_time_jst AS startTimeJst,status FROM rt_races WHERE race_id=?",[rid]),
            'bets':("SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,assumed_odds AS assumedOdds,locked_at AS lockedAt,settlement_status AS settlementStatus,source_prediction_id AS sourcePredictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type",[rid]),
            'final':("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=?",[f'worker_live_final:{rid}']),
            'preview':("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=?",[f'worker_live_preview:{rid}']),
            'deadline_audit':("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=?",['worker_deadline_guard:2026-08-16']),
            'live_audit':("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=?",['worker_live_lock:2026-08-16']),
            'selection':("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=?",['final_daily_selection:2026-08-16']),
          }
          out={}
          for name,(sql,params) in queries.items(): out[name]=q(sql,params)
          for name in ('final','preview','deadline_audit','live_audit','selection'):
              for row in out[name]:
                  try: row['parsed']=json.loads(row.get('value') or 'null')
                  except Exception: row['parsed']='PARSE_ERROR'
                  row.pop('value',None)
          print('NIIGATA9_DIAG='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
          python - <<'PY'
          import urllib.request
          url='https://race-tantei-phase0.race-tantei.workers.dev/races/2026-08-16-niigata-09'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print('PUBLIC_STATUS',r.status)
              print('PUBLIC_UI_VERSION',r.headers.get('x-race-ui-version'))
              for needle in ['買い目未確定','単勝','ワイド','2-11','16:25までに確定予定でしたが']:
                  print('PUBLIC_HAS',needle,needle in body)
          PY
