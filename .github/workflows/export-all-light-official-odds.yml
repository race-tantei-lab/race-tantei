name: Export all Light official odds
run-name: Export all Light official odds · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-all-light-official-odds.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: export-all-light-official-odds
  cancel-in-progress: true
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/all-light-official-odds' -f description='全7695Rの単勝・ワイド・馬連公式オッズ取得中' -f target_url="$TARGET" >/dev/null
  export:
    needs: register
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0,1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      SHARD_COUNT: 7
      SHARD_INDEX: ${{ matrix.shard }}
      WORKERS: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python scripts/verify-race-tantei-fixed-constraints.py
      - run: python scripts/export-all-light-official-odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-light-official-odds-shard-${{ matrix.shard }}
          path: |
            artifacts/all-light-official-odds-shard-${{ matrix.shard }}.jsonl.gz
            artifacts/all-light-official-odds-meta-shard-${{ matrix.shard }}.json
          compression-level: 0
          retention-days: 14
  finalize:
    if: always()
    needs: [register,export]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.export.result }}
        run: |
          if [ "$RESULT" = success ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/all-light-official-odds' -f description='全7695Rライト公式オッズ取得成功' -f target_url="$TARGET" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/all-light-official-odds' -f description="全7695Rライト公式オッズ取得失敗:$RESULT" -f target_url="$TARGET" >/dev/null; exit 1
          fi
