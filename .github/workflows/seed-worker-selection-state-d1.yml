name: Seed Worker Selection State D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-worker-selection-state-d1.yml"
      - "scripts/seed-worker-selection-state-d1.py"
      - "models/ten-year-race-selection-state.json.gz"

permissions:
  contents: read

concurrency:
  group: seed-worker-selection-state-d1
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed production D1
        run: python scripts/seed-worker-selection-state-d1.py --apply
      - name: Upload seed audit
        uses: actions/upload-artifact@v4
        with:
          name: worker-selection-state-d1-seed
          path: worker-selection-state-seed-audit.json
          retention-days: 30
