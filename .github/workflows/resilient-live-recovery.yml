name: Resilient live recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resilient-live-recovery.yml"
      - "scripts/run-resilient-live-recovery.py"
  schedule:
    - cron: "*/5 8-19 * * 6,0,1"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.25"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install completed-model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy<3"
      - name: Compile resilient recovery
        run: python -m py_compile scripts/run-resilient-live-recovery.py scripts/run-ten-year-auto-final-live.py scripts/generate-ten-year-live-bets.py
      - name: Recover every imminent selected race
        run: python scripts/run-resilient-live-recovery.py
      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilient-live-recovery-${{ github.run_id }}
          path: |
            analysis-results/resilient-live-recovery.json
            analysis-results/resilient-live-recovery-*.json
            official-odds-collection-report.json
          if-no-files-found: warn
          retention-days: 30
