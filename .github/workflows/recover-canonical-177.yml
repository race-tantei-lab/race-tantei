name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='inspecting historical candidate tables read-only' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect D1 candidate tables read-only
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          out=Path('artifacts/canonical-177-d1-inspect');out.mkdir(parents=True,exist_ok=True)
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['CLOUDFLARE_D1_DATABASE_ID']}/query"
          def q(sql,params=None):
            req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':params or []}).encode(),headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=90) as r:p=json.loads(r.read().decode())
            if not p.get('success'):raise RuntimeError(p.get('errors'))
            return p.get('result',[{}])[0].get('results',[])
          tables=['rt_official_value_candidates','rt_predictions','rt_prediction_runners','rt_official_odds_latest','rt_official_odds_snapshots']
          report={}
          for t in tables:
            try:
              cols=q(f'PRAGMA table_info({t})')
              names=[x['name'] for x in cols]
              info={'columns':cols,'count':q(f'SELECT COUNT(*) n FROM {t}')[0]['n']}
              date_col=next((x for x in ['race_date','raceDate','created_at','as_of'] if x in names),None)
              race_col=next((x for x in ['race_id','raceId'] if x in names),None)
              if date_col: info['dateRange']=q(f'SELECT MIN({date_col}) mn, MAX({date_col}) mx FROM {t}')[0]
              if race_col: info['distinctRaces']=q(f'SELECT COUNT(DISTINCT {race_col}) n FROM {t}')[0]['n']
              info['sample']=q(f'SELECT * FROM {t} LIMIT 3')
              report[t]=info
            except Exception as e:report[t]={'error':f'{type(e).__name__}:{e}'}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-d1-inspect
          path: artifacts/canonical-177-d1-inspect/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='candidate table inspection complete' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='candidate table inspection failed' -f target_url="$TARGET" >/dev/null