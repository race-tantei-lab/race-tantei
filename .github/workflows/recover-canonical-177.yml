name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='inventorying historical analysis artifacts' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - name: Inventory Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/canonical-177-artifacts
          OUT=artifacts/canonical-177-artifacts
          gh api --paginate -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.expired,.size_in_bytes,.created_at,.expires_at,.workflow_run.id,.workflow_run.head_branch,.workflow_run.head_sha] | @tsv' > "$OUT/all-artifacts.tsv"
          grep -Ei '7695|official|odds|completion|speed|v16|rule|candidate|market|dataset|analysis' "$OUT/all-artifacts.tsv" > "$OUT/relevant-artifacts.tsv" || true
          echo '=== RELEVANT ARTIFACTS ==='
          cat "$OUT/relevant-artifacts.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-artifact-inventory
          path: artifacts/canonical-177-artifacts/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='artifact inventory complete' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='artifact inventory failed' -f target_url="$TARGET" >/dev/null