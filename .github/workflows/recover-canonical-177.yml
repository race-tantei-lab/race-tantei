name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='inspect decoded rule payload structure' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - name: Inspect archived rule payload
        run: |
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          cfg=json.loads(Path('config/v16-uniform-rule-model.json').read_text())
          root=json.loads(zlib.decompress(base64.b64decode(cfg['rulePayload'])))
          out=Path('artifacts/canonical-177-recovery'); out.mkdir(parents=True,exist_ok=True)
          (out/'decoded-root.json').write_text(json.dumps(root,ensure_ascii=False,indent=2)+'\n')
          def describe(x):
              d={'type':type(x).__name__}
              if isinstance(x,dict):
                  d['keys']=list(x.keys()); d['keyTypes']={k:type(v).__name__ for k,v in x.items()}; d['lengths']={k:len(v) for k,v in x.items() if hasattr(v,'__len__')}
              elif isinstance(x,list):
                  d['length']=len(x); d['sampleTypes']=[type(v).__name__ for v in x[:5]]; d['sample']=x[:3]
              return d
          summary={'root':describe(root)}
          if isinstance(root,dict):
              for k,v in root.items():
                  if isinstance(v,(list,dict)):
                      summary[k]=describe(v)
          (out/'structure.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-recovery
          path: artifacts/canonical-177-recovery/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='rule payload structure inspected' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='rule payload inspection failed' -f target_url="$TARGET" >/dev/null