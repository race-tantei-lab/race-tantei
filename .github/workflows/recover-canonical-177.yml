name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='bundling historical rule engine code' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle recovery code
        run: |
          mkdir -p artifacts/canonical-177-code
          cp -a scripts artifacts/canonical-177-code/scripts
          cp -a config artifacts/canonical-177-code/config
          cp -a analysis-results artifacts/canonical-177-code/analysis-results
          mkdir -p artifacts/canonical-177-code/workflows
          cp -a .github/workflows/*.yml artifacts/canonical-177-code/workflows/ || true
          git log --all --oneline -- scripts/v16-uniform-rule-selector.py > artifacts/canonical-177-code/v16-selector-history.txt || true
          git log --all --oneline -- scripts/train-market-residual-ranking-v3.py > artifacts/canonical-177-code/residual-history.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-code-bundle
          path: artifacts/canonical-177-code/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='historical rule engine code bundled' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='code bundle failed' -f target_url="$TARGET" >/dev/null