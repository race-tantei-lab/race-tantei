name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='recovering old walk-forward source' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover walk-forward source tree
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mkdir -p artifacts/walk-forward-source
          git archive --format=tar refs/remotes/origin/agent/walk-forward-12m-learning src scripts workflows | tar -xf - -C artifacts/walk-forward-source
          rg -n -i 'RunnerHistoryStats|horseWins|jockeyWins|trainerWins|courseWins|walk-forward/data|walkForward|winProbability' artifacts/walk-forward-source > artifacts/walk-forward-source/recovery-grep.txt || true
          sed -n '1,800p' artifacts/walk-forward-source/recovery-grep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-walk-forward-source
          path: artifacts/walk-forward-source/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='walk-forward source recovered' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='walk-forward source recovery failed' -f target_url="$TARGET" >/dev/null