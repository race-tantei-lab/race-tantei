name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='scanning all Git blobs for stable-rule originals' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all refs
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/tags/*:refs/tags/*' --prune || true
      - name: Scan blob contents by frozen SHA-256
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from collections import defaultdict
          from pathlib import Path

          targets = {
            '9e918f4864f93ce21dd72f4a1eb295055ae9dce03db924ea45e8d5c0ed7424f5': 'quinella-59',
            '29250ef7ffd9e307cceec66bf22f030a98e217df3755bfff754fcd122359d2fd': 'wide-61',
            '7ade354725bd604a3fbcd9cf43be13ea6ad6317640c0d82dcde765c531910b1d': 'win-45',
            '69ac969c6ac14bdd62b52e85a8a3762ffdec261dbf0c7c24a991d8ed72d879cd': 'exacta-135',
            'ea61c1ab2bbe15b304c97d0657c0559c9b2a23f8a52c47ffb84ef083f7b4cb0e': 'trio-61',
            'd4ab3797259f641261ab84eac353b203dc572fdaf83fdcb4d734150b398dcc3c': 'trifecta-108',
          }
          out = Path('artifacts/canonical-177-git-hash-scan'); out.mkdir(parents=True, exist_ok=True)

          rev = subprocess.check_output(['git','rev-list','--objects','--all'], text=True, errors='replace')
          paths = defaultdict(set)
          object_ids = set()
          for line in rev.splitlines():
              if not line.strip(): continue
              parts = line.split(' ',1)
              oid = parts[0]; object_ids.add(oid)
              if len(parts)>1 and parts[1]: paths[oid].add(parts[1])

          proc = subprocess.Popen(['git','cat-file','--batch-check=%(objectname) %(objecttype) %(objectsize)'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          check_out,_ = proc.communicate('\n'.join(object_ids)+'\n')
          blobs=[]
          for line in check_out.splitlines():
              p=line.split()
              if len(p)>=3 and p[1]=='blob':
                  oid,size=p[0],int(p[2])
                  # rule files should be small; avoid hashing huge DB/binary blobs
                  if size <= 20_000_000:
                      blobs.append((oid,size))

          matches=[]
          scanned=0
          for oid,size in blobs:
              data=subprocess.check_output(['git','cat-file','blob',oid])
              scanned += 1
              sha=hashlib.sha256(data).hexdigest()
              if sha in targets:
                  label=targets[sha]
                  fn=out/f'{label}__{oid}.bin'
                  fn.write_bytes(data)
                  matches.append({'label':label,'sha256':sha,'gitBlob':oid,'size':size,'paths':sorted(paths.get(oid,[])),'savedAs':fn.name})

          # Also collect historical filenames likely related to stable rules for diagnostics.
          likely=[]
          for oid, ps in paths.items():
              for p in ps:
                  lp=p.lower()
                  if ('stable' in lp or 'rule' in lp or 'tier' in lp or 'market-distortion' in lp) and (lp.endswith('.csv') or lp.endswith('.json') or lp.endswith('.jsonl') or lp.endswith('.pkl') or lp.endswith('.gz')):
                      likely.append({'gitBlob':oid,'path':p})
          report={'targetCount':len(targets),'scannedBlobCount':scanned,'matches':matches,'likelyHistoricalPaths':sorted(likely,key=lambda x:x['path'])}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'targetCount':len(targets),'scannedBlobCount':scanned,'matchCount':len(matches),'matches':matches},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-git-hash-scan
          path: artifacts/canonical-177-git-hash-scan/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='Git blob hash scan complete' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='Git blob hash scan failed' -f target_url="$TARGET" >/dev/null