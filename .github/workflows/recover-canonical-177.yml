name: Recover canonical 177 rule evidence
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: ['.github/workflows/recover-canonical-177.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/recover-canonical-177' -f description='matching frozen Aug 8 candidate probabilities in D1' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match frozen probabilities read-only
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          out=Path('artifacts/canonical-177-d1-match');out.mkdir(parents=True,exist_ok=True)
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['CLOUDFLARE_D1_DATABASE_ID']}/query"
          def q(sql,params=None):
            req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql,'params':params or []}).encode(),headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=90) as r:p=json.loads(r.read().decode())
            if not p.get('success'):raise RuntimeError(p.get('errors'))
            return p.get('result',[{}])[0].get('results',[])
          targets=[
            ('2026-08-08-sapporo-03',10,0.1587862983572685),
            ('2026-08-08-niigata-01',11,0.021661905675722303),
            ('2026-08-08-chukyo-06',2,0.016374922199569455),
            ('2026-08-08-chukyo-11',5,0.01291686143695954),
          ]
          report={}
          report['modelVersionsAug8']=q("SELECT model_version, status, COUNT(*) n, MIN(generated_at) mn, MAX(generated_at) mx FROM rt_predictions WHERE race_id LIKE '2026-08-08-%' GROUP BY model_version,status ORDER BY n DESC")
          report['targetRows']={}
          for race,horse,target in targets:
            rows=q("SELECT p.id,p.race_id,p.model_version,p.status,p.generated_at,p.locked_at,p.source_odds_at,pr.horse_no,pr.horse_name,pr.predicted_order,pr.win_probability,pr.place_probability,pr.current_odds,pr.expected_value_pct,ABS(pr.win_probability-?) AS abs_diff FROM rt_predictions p JOIN rt_prediction_runners pr ON pr.prediction_id=p.id WHERE p.race_id=? AND pr.horse_no=? ORDER BY abs_diff ASC,p.generated_at DESC LIMIT 100",[target,race,horse])
            report['targetRows'][f'{race}:{horse}']={'target':target,'rows':rows}
          # exact/nearly exact matches anywhere in D1, useful if race ids were aliased
          report['globalProbabilityMatches']={}
          for _,_,target in targets:
            report['globalProbabilityMatches'][str(target)]=q("SELECT p.race_id,p.model_version,p.status,p.generated_at,pr.horse_no,pr.horse_name,pr.win_probability,ABS(pr.win_probability-?) abs_diff FROM rt_prediction_runners pr JOIN rt_predictions p ON p.id=pr.prediction_id WHERE ABS(pr.win_probability-?) < 0.0000001 ORDER BY abs_diff ASC LIMIT 100",[target,target])
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-177-d1-match
          path: artifacts/canonical-177-d1-match/
          retention-days: 7
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/recover-canonical-177' -f description='Aug 8 probability match complete' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/recover-canonical-177' -f description='Aug 8 probability match failed' -f target_url="$TARGET" >/dev/null