name: Recent hit rate audit
on:
  push:
    branches:
      - diag/recent-hit-rate-audit-20260922
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Query recent finalized race outcomes
        shell: bash
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
          WITH race_bets AS (
            SELECT r.race_date AS raceDate,b.race_id AS raceId,
                   SUM(b.stake_yen) AS stake,
                   SUM(COALESCE(b.return_yen,0)) AS ret,
                   SUM(CASE WHEN b.settlement_status='pending' THEN 1 ELSE 0 END) AS pending,
                   COUNT(*) AS rows
            FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id
            WHERE r.race_date BETWEEN '2026-09-19' AND '2026-09-22'
              AND b.source_prediction_id=-2
              AND b.course='ライト'
            GROUP BY r.race_date,b.race_id
          )
          SELECT raceDate,
                 COUNT(*) AS finalizedRaces,
                 SUM(CASE WHEN pending=0 THEN 1 ELSE 0 END) AS settledRaces,
                 SUM(CASE WHEN pending=0 AND ret>0 THEN 1 ELSE 0 END) AS hitRaces,
                 SUM(CASE WHEN pending=0 AND ret=0 THEN 1 ELSE 0 END) AS missRaces,
                 SUM(CASE WHEN pending=0 THEN stake ELSE 0 END) AS settledStake,
                 SUM(CASE WHEN pending=0 THEN ret ELSE 0 END) AS returnYen
          FROM race_bets GROUP BY raceDate ORDER BY raceDate
          "
