name: Walk-forward past-only real-money JRA ROI200 patterns
on:
  push:
    branches:
      - research/nov2026-decade-ten-runner-cash
    paths:
      - scripts/research-nov2026-rolling-cash-roi200-conditions.py
      - .github/workflows/nov2026-rolling-real-cash-roi200.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling-jra-money-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.6.1'
      - name: Load existing immutable 2015-2026 complete six-market result cash
        uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Require actual paid cash sources (not old pred selections)
        run: |
          test -s analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
          test -s analysis-results/jra-decade-sixmarket-top10-races-v3.json
      - name: Verify monetary stake accounting
        run: |
          python -m py_compile scripts/research-nov2026-rolling-cash-roi200-conditions.py
          python -u scripts/research-nov2026-rolling-cash-roi200-conditions.py --self-test
      - name: Mine annually refreshed ROI200 actual money patterns using only prior years, test 2025 and 2026
        run: python -u scripts/research-nov2026-rolling-cash-roi200-conditions.py
      - name: Keep money audit off production, no scheduled monitoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-ten-runner-actual-roi200-money
          path: analysis-results/nov2026-three-year-rolling-roi200-paid-ticket-rules.json
          if-no-files-found: warn
          retention-days: 30
