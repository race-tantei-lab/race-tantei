name: Walk-forward past-only real-money JRA ROI200 patterns
on:
  push:
    branches:
      - research/nov2026-stable-multiyear-cash
    paths:
      - scripts/research-nov2026-rolling-cash-roi200-conditions.py
      - scripts/research-nov2026-bayes-crossmarket-cash.py
      - scripts/research-nov2026-cash-covariance-generator.py
      - scripts/research-nov2026-temporal-interaction-cash.py
      - scripts/research-nov2026-downside-pair-cash.py
      - scripts/research-nov2026-rank-exposure-cash.py
      - scripts/research-nov2026-cash-regret-maximin.py
      - scripts/research-nov2026-relative-cash-contrast.py
      - .github/workflows/nov2026-rolling-real-cash-roi200.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling-jra-money-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.6.1'
      - name: Load existing immutable 2015-2026 complete six-market result cash
        uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Rebuild pinned third-party six-market payout cache on cache miss
        env:
          PINNED_REF: f552ca8628646f39b05ffdbdc3ab8734939ffd66
        run: |
          if test -s analysis-results/jra-decade-sixmarket-top10-cash-v3.npz && test -s analysis-results/jra-decade-sixmarket-top10-races-v3.json; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          p=Path('external-jra-cash-decade')
          p.mkdir(exist_ok=True)
          for year in range(2015,2027):
              for month in range(1,13 if year<2026 else 5):
                  name=f'raceresults_{year}{month:02d}.csv'
                  url=f'https://raw.githubusercontent.com/Kenseimk/keiba-agent/{__import__("os").environ["PINNED_REF"]}/data/{name}'
                  urlretrieve(url,p/name)
                  if (p/name).stat().st_size<100: raise RuntimeError(f'empty payout source {name}')
          PY
          python - <<'PY'
          import importlib.util
          p='scripts/research-nov2026-decade-roi-first-sixmarkets.py'
          spec=importlib.util.spec_from_file_location('cash_source',p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          common=m.mod('scripts/research-nov2026-sixmarket-real-paid-cash.py','cash_parser')
          races=m.read_all_races(common.parse_payments)
          m.CACHE.parent.mkdir(parents=True,exist_ok=True)
          m.full_features(races)
          PY
      - name: Require actual paid cash sources (not old pred selections)
        run: |
          test -s analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
          test -s analysis-results/jra-decade-sixmarket-top10-races-v3.json
      - name: Verify monetary stake accounting
        run: |
          python -m py_compile scripts/research-nov2026-rolling-cash-roi200-conditions.py
          python -u scripts/research-nov2026-rolling-cash-roi200-conditions.py --self-test
      - name: New cross-market empirical Bayes cash ticket generator and settlement
        run: python -u scripts/research-nov2026-bayes-crossmarket-cash.py
      - name: New cash covariance pair generator and actual settlement
        run: python -u scripts/research-nov2026-cash-covariance-generator.py
      - name: Temporal conditional monetary interaction ticket generator
        run: python -u scripts/research-nov2026-temporal-interaction-cash.py
      - name: New cross-market downside-aware cash pair selection
        run: python -u scripts/research-nov2026-downside-pair-cash.py
      - name: New additive cash residual and rank-exposure ticket generator
        run: python -u scripts/research-nov2026-rank-exposure-cash.py
      - name: Year-balanced conditional cash regret maximin ticket generation
        run: python -u scripts/research-nov2026-cash-regret-maximin.py
      - name: Within-race popularity-cohort monetary contrast ticket generator
        run: python -u scripts/research-nov2026-relative-cash-contrast.py
      - name: Mine annually refreshed ROI200 actual money patterns using only prior years, test 2025 and 2026
        run: python -u scripts/research-nov2026-rolling-cash-roi200-conditions.py
      - name: Keep money audit off production, no scheduled monitoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-ten-runner-actual-roi200-money
          path: |
            analysis-results/nov2026-three-year-rolling-roi200-paid-ticket-rules.json
            analysis-results/nov2026-bayes-crossmarket-cash.json
            analysis-results/nov2026-cash-covariance-generator.json
            analysis-results/nov2026-temporal-interaction-cash.json
            analysis-results/nov2026-downside-pair-cash.json
            analysis-results/nov2026-rank-exposure-cash.json
            analysis-results/nov2026-cash-regret-maximin.json
            analysis-results/nov2026-relative-cash-contrast.json
          if-no-files-found: warn
          retention-days: 30
