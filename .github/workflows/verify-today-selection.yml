name: Verify today public selection

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/verify-today-selection.yml"
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *" # 09:05 JST daily; official JRA gate below decides whether racing is scheduled

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Resolve official JRA race-day gate
        id: race_day
        shell: bash
        run: |
          set -euo pipefail
          gate=$(npx tsx -e "import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts'; (async()=>{console.log(JSON.stringify(await shouldRunOnJraRaceDay(new Date())));})().catch(e=>{console.error(e);process.exit(1)})")
          echo "$gate"
          should_run=$(GATE="$gate" node -e 'const g=JSON.parse(process.env.GATE||"{}"); process.stdout.write(g.shouldRun ? "true" : "false")')
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
      - name: Verify today's frozen selection is public
        if: steps.race_day.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          today="$(TZ=Asia/Tokyo date +%F)"
          ok=0
          for attempt in $(seq 1 4); do
            code="$(curl --retry 2 --retry-delay 2 --retry-all-errors --silent --show-error --connect-timeout 5 --max-time 40 -o /tmp/today.json -w '%{http_code}' "${base}/api/public/day?date=${today}" || true)"
            echo "attempt=${attempt} date=${today} http=${code}"
            if [ "$code" = "200" ] && python - <<'PY'
          import collections,datetime,json,sys
          data=json.load(open('/tmp/today.json',encoding='utf-8'))
          rows=data.get('races') if isinstance(data,dict) else None
          if not isinstance(rows,list):
              print('TODAY_SELECTION_INVALID: races missing')
              sys.exit(1)
          venues=collections.Counter(str(r.get('venue') or '') for r in rows if r.get('venue'))
          states=collections.Counter(str((r.get('publicState') or {}).get('code') or '') for r in rows)
          active_rows=[r for r in rows if str((r.get('publicState') or {}).get('code') or '')!='cancelled']
          active_venues=collections.Counter(str(r.get('venue') or '') for r in active_rows if r.get('venue'))
          structured=len(active_venues)>=1 and all(n==12 for n in active_venues.values())
          selected_codes={'target','buy','hit','miss','overdue','missing'}
          selected=[r for r in rows if str((r.get('publicState') or {}).get('code') or '') in selected_codes]
          selected_by_venue=collections.Counter(str(r.get('venue') or '') for r in selected)
          skip_by_venue=collections.Counter(str(r.get('venue') or '') for r in rows if (r.get('publicState') or {}).get('code')=='skip')
          now=datetime.datetime.now(datetime.timezone.utc)
          def start_utc(row):
              raw=str(row.get('startTimeUtc') or '')
              try:
                  return datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
              except Exception:
                  return None
          historical_deadline_failures=[]
          future_deadline_failures=[]
          future_t15_unfinalized=[]
          for r in selected:
              code=str((r.get('publicState') or {}).get('code') or '')
              start=start_utc(r)
              if code in {'missing','overdue'}:
                  if start and start > now:
                      future_deadline_failures.append(r.get('raceId'))
                  else:
                      historical_deadline_failures.append(r.get('raceId'))
              if start and start > now and (start-now).total_seconds() <= 15*60 and code not in {'buy','hit','miss'}:
                  future_t15_unfinalized.append(r.get('raceId'))
          detail={
              'raceCount':len(rows),
              'venues':dict(venues),
              'states':dict(states),
              'activeVenues':dict(active_venues),
              'selectedByVenue':dict(selected_by_venue),
              'skipByVenue':dict(skip_by_venue),
              'selectedRaceIds':[r.get('raceId') for r in selected],
              'historicalDeadlineFailures':historical_deadline_failures,
              'futureDeadlineFailures':future_deadline_failures,
              'futureT15Unfinalized':future_t15_unfinalized,
          }
          print(json.dumps(detail,ensure_ascii=False))
          good=(
              structured
              and states.get('pending',0)==0
              and not future_deadline_failures
              and not future_t15_unfinalized
              and all(selected_by_venue.get(v,0)==5 for v in active_venues)
              and all(skip_by_venue.get(v,0)==7 for v in active_venues)
              and not any(v not in active_venues for v in selected_by_venue)
          )
          if not good:
              print('TODAY_SELECTION_PUBLIC_PROJECTION_INVALID')
              sys.exit(1)
          print('TODAY_SELECTION_PUBLIC_PROJECTION_OK')
          PY
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
