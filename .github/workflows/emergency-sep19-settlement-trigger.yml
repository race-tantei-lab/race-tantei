name: Emergency Sep19 Settlement Trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep19-settlement-trigger.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger settlement and verify production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          BASE=https://race-tantei-phase0.race-tantei.workers.dev
          curl -fsS -X POST "$BASE/_ops/settle-20260919-4c82bfa1" -H 'cache-control: no-cache' > /tmp/settle.json
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'content-type: application/json' --data-binary @-
          }
          q "SELECT b.race_id AS raceId,COUNT(*) AS rows,SUM(b.settlement_status='settled') AS settledRows,SUM(b.settlement_status='pending') AS pendingRows,r.status AS raceStatus,r.result_url AS resultUrl,(SELECT COUNT(*) FROM rt_payouts p WHERE p.race_id=b.race_id) AS payoutRows,(SELECT COUNT(*) FROM rt_results x WHERE x.race_id=b.race_id) AS resultRows FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE b.race_id IN ('2026-09-19-hanshin-05','2026-09-19-hanshin-06') GROUP BY b.race_id ORDER BY b.race_id" > /tmp/sep19.json
          q "SELECT r.race_id AS raceId,r.start_time_jst AS startTimeJst,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS sourceMinus2,(SELECT MIN(b.locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS lockedAt,(SELECT COUNT(*) FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||r.race_id) AS previewState FROM rt_races r WHERE r.race_id IN ('2026-09-20-hanshin-01','2026-09-20-hanshin-02','2026-09-20-nakayama-02','2026-09-20-hanshin-03') ORDER BY r.start_time_utc" > /tmp/sep20.json
          curl -fsS -D /tmp/home.headers -o /tmp/home.html "$BASE/?_rt=$(date +%s)"
          curl -fsS "$BASE/api/public/day?date=2026-09-19&_rt=$(date +%s)" > /tmp/day19.json
          curl -fsS "$BASE/api/public/day?date=2026-09-20&_rt=$(date +%s)" > /tmp/day20.json
          python3 - <<'PY'
          import json,pathlib
          def cf(path):
              x=json.load(open(path))
              return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          s19=cf('/tmp/sep19.json'); s20=cf('/tmp/sep20.json')
          home=pathlib.Path('/tmp/home.html').read_text(errors='replace')
          headers=pathlib.Path('/tmp/home.headers').read_text(errors='replace')
          d19=json.load(open('/tmp/day19.json')); d20=json.load(open('/tmp/day20.json'))
          report={
            'settlementAudit':json.load(open('/tmp/settle.json')),
            'sep19':s19,
            'sep20Early':s20,
            'home':{
              'hasSep20Calendar':'"raceDate":"2026-09-20"' in home,
              'hasTodayConst':'const today="2026-09-20";' in home,
              'hasFalseEmpty':'本日（9/20）の公開買い目はありません。' in home,
              'headers':headers[:2500]
            },
            'day19States':{r['raceId']:r.get('publicState') for r in d19.get('races',[]) if r.get('raceId') in ('2026-09-19-hanshin-05','2026-09-19-hanshin-06')},
            'day20RaceCount':len(d20.get('races') or []),
            'day20SelectedCount':sum(1 for r in d20.get('races',[]) if (r.get('publicState') or {}).get('code')!='skip')
          }
          pathlib.Path('ops/sep19-settlement-trigger-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if any(int(x.get('settledRows') or 0)!=6 or int(x.get('pendingRows') or 0)!=0 or int(x.get('payoutRows') or 0)==0 for x in s19):
              raise SystemExit('SEP19_SETTLEMENT_NOT_COMPLETE')
          if not report['home']['hasSep20Calendar'] or not report['home']['hasTodayConst'] or report['home']['hasFalseEmpty']:
              raise SystemExit('SEP20_HOME_NOT_FIXED')
          if report['day20RaceCount']!=24:
              raise SystemExit('SEP20_DAY_API_NOT_24')
          PY
      - name: Persist report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/sep19-settlement-trigger-report.json || exit 0
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep19-settlement-trigger-report.json
          git commit -m "ops: verify Sep 19 settlement and Sep 20 home"
          git pull --rebase origin main
          git push origin HEAD:main
