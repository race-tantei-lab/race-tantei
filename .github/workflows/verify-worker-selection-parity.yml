name: Verify Worker Selection Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-worker-selection-parity.yml"
      - "src/v1/completed-selection-runtime.ts"
      - "scripts/verify-worker-selection-parity.mjs"
      - "scripts/ten-year-production-core.py"
      - "scripts/generate-ten-year-preday-selection.py"
      - "models/ten-year-race-selection-state.json.gz"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Generate canonical Python selection and target bundles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-ten-year-preday-selection.py --date 2026-08-15 --out /tmp/selection-python.json
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path('.')
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(spec);sys.modules[name]=m;spec.loader.exec_module(m);return m
          core=load(root/'scripts/ten-year-production-core.py','selection_core_parity')
          collector=load(root/'scripts/collect-jra-official-odds.py','selection_collector_parity')
          bundles=core.target_bundles(collector,'2026-08-15')
          pathlib.Path('/tmp/selection-target-bundles.json').write_text(json.dumps(bundles,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Compare Worker selection with canonical Python
        run: npx tsx scripts/verify-worker-selection-parity.mjs
