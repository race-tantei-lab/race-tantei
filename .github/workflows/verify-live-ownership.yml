name: Verify live ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/public-site-entry-v*.ts'
      - 'src/live-deadline-entry-v2.ts'
      - 'src/v1/**'
      - 'scripts/verify-live-ownership.py'
      - 'scripts/verify-live-lock-safety.py'
      - 'wrangler.jsonc'
      - 'wrangler.live-deadline.jsonc'
      - 'wrangler.live-deadline-backup.jsonc'
      - 'config/canonical-production-manifest.json'
      - '.github/workflows/verify-live-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'src/public-site-entry-v*.ts'
      - 'src/live-deadline-entry-v2.ts'
      - 'src/v1/**'
      - 'scripts/verify-live-ownership.py'
      - 'scripts/verify-live-lock-safety.py'
      - 'wrangler.jsonc'
      - 'wrangler.live-deadline.jsonc'
      - 'wrangler.live-deadline-backup.jsonc'
      - 'config/canonical-production-manifest.json'
      - '.github/workflows/verify-live-ownership.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exclusive normal-race ownership
        run: python scripts/verify-live-ownership.py

      - name: Verify full live-lock safety
        run: python scripts/verify-live-lock-safety.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
