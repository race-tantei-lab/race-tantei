name: iOS URL production verify
on:
  push:
    branches:
      - diag/ios-url-verify-20260921
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for p in '/' '/races/' '/api/public/day?date=2026-09-21'; do
            echo "=== $p ==="
            curl -sS --max-redirs 0 -D /tmp/h -o /tmp/b -w 'http=%{http_code} redirect=%{redirect_url} effective=%{url_effective} bytes=%{size_download} total=%{time_total}\n' "$base$p" || true
            grep -iE '^(location|content-type|x-race-ui-version|x-race-home-path|server|cf-ray):' /tmp/h || true
          done
          echo '=== repeated home timings ==='
          for n in 1 2 3 4 5; do
            curl --compressed -sS -o /tmp/home$n -w "try=$n http=%{http_code} bytes=%{size_download} ttfb=%{time_starttransfer} total=%{time_total} effective=%{url_effective} redirect=%{redirect_url}\\n" "$base/?_iosverify=${GITHUB_RUN_ID}-$n"
          done
          echo '=== home markers ==='
          grep -Eo '<base href="[^"]+"|rel="canonical" href="[^"]+"|data:text/html[^"<> ]*' /tmp/home1 | head -20 || true
          echo '=== iPhone-like rendered rail ==='
          google-chrome --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=6000 \
            --user-agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1' \
            --dump-dom "$base/?_iosbrowser=${GITHUB_RUN_ID}" >/tmp/dom 2>/tmp/chrome.err
          python - <<'PY'
          from html.parser import HTMLParser
          import re
          s=open('/tmp/dom',encoding='utf-8').read()
          class C(HTMLParser):
              def __init__(self): super().__init__(); self.cap=False; self.depth=0; self.buf=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if not self.cap and d.get('id')=='races': self.cap=True; self.depth=1; self.buf.append(self.get_starttag_text()); return
                  if self.cap:
                      self.buf.append(self.get_starttag_text())
                      if t=='div': self.depth+=1
              def handle_endtag(self,t):
                  if self.cap:
                      self.buf.append(f'</{t}>')
                      if t=='div':
                          self.depth-=1
                          if self.depth==0:self.cap=False
              def handle_data(self,d):
                  if self.cap:self.buf.append(d)
          p=C();p.feed(s);rail=''.join(p.buf)
          print('cards=',len(re.findall(r'class="race-card',rail)))
          print('load_error=', 'レース情報を取得できませんでした' in rail)
          print('loading=', 'レース情報を読み込み中' in rail)
          print('has_6R_buy=', '6R' in rail and '買い目確定' in rail)
          print('has_8R=', '8R' in rail)
          PY
          grep -Ei 'TypeError|ReferenceError|Uncaught|SyntaxError' /tmp/chrome.err && exit 1 || true
