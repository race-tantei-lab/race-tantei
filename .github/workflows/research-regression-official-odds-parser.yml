name: Research regression official-odds parser

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-regression-official-odds-parser.yml"
      - "scripts/research-fetch-resolved-demanded-official-odds.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SELECTION_ARTIFACT_ID: '9088036803'
  SOURCE_INPUT_ARTIFACT_ID: '9086766461'
  CANONICAL_ODDS_RUN_ID: '31373205723'
  COMPLETED_2016_ARTIFACT_ID: '9088548944'
  META_ODDS_RUN_ID: '31456971683'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.4
      - name: Verify partial-market parser union on known official race
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          resolver_path = root / 'scripts' / 'research-fetch-resolved-demanded-official-odds.py'
          spec = importlib.util.spec_from_file_location('resolver_regression', resolver_path)
          resolver = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = resolver
          spec.loader.exec_module(resolver)

          historical = resolver.load_module(root / 'scripts' / 'research-fetch-demanded-official-odds.py', 'historical_regression')
          historical.result_marker = resolver.flexible_result_marker
          os.environ.setdefault('CLOUDFLARE_ACCOUNT_ID', 'research-unused')
          os.environ.setdefault('CLOUDFLARE_D1_DATABASE_ID', 'research-unused')
          os.environ.setdefault('CLOUDFLARE_API_TOKEN', 'research-unused')
          current = resolver.load_module(root / 'scripts' / 'collect-current-jra-official-odds.py', 'current_regression')
          current.self_test()
          resolver.result_derivation_self_test()

          row = {
              'raceId': '2021-03-27-chukyo-03',
              'raceDate': '2021-03-27',
              'venue': '中京',
              'raceNo': 3,
              'resultUrl': 'https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0107202102050320210327%2F45',
              'requiredMarkets': ['win','umaren','wide','umatan','trio','trifecta'],
              'targetDayResultsUsedForSelection': False,
              'historicalFinalOddsUsedForSelection': False,
              'syntheticOddsUsed': False,
              'productionDatabaseWritten': False,
          }
          primary = historical.fetch_race(row)
          partial = resolver.required_markets_partial(row, primary, historical)
          fallback = resolver.current_fetch(row, historical, current)
          merged = resolver.merge_official_results(primary, fallback, row, historical, partial)
          value = merged['officialOdds']['umatan'].get('14-15')
          assert value is not None, merged['officialOddsCoverage']['umatan']
          assert merged['provenance']['syntheticOddsUsed'] is False
          assert merged['provenance']['productionDatabaseWritten'] is False
          print({
              'raceId': row['raceId'],
              'primary14to15': primary.get('officialOdds',{}).get('umatan',{}).get('14-15'),
              'fallback14to15': fallback.get('officialOdds',{}).get('umatan',{}).get('14-15'),
              'merged14to15': value,
              'partialMarkets': partial,
              'added': merged['provenance']['parserUnionAddedCombinations'],
              'syntheticOddsUsed': merged['provenance']['syntheticOddsUsed'],
          })
          PY
      - name: Diagnose whether the regression race is reused or refetched
        run: |
          set -euo pipefail
          mkdir -p input/selections input/source input/existing-odds analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}/zip" > selections.zip
          unzip -q selections.zip -d input/selections
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_INPUT_ARTIFACT_ID}/zip" > source.zip
          unzip -q source.zip 'corrected-odds/*.jsonl' 'history/ten-year-history-corpus.jsonl' -d input/source
          cp input/source/corrected-odds/*.jsonl input/existing-odds/
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANONICAL_ODDS_RUN_ID}/artifacts?per_page=100" > canonical.json
          for y in $(seq 2016 2022); do
            id=$(jq -r --arg n "research-demanded-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' canonical.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "canonical-${y}.zip"
            unzip -q "canonical-${y}.zip" "research-demanded-odds-${y}.jsonl" -d input/existing-odds
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPLETED_2016_ARTIFACT_ID}/zip" > completed-2016.zip
          unzip -q completed-2016.zip 'ml-discovery-odds-2016.jsonl' -d input/existing-odds
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${META_ODDS_RUN_ID}/artifacts?per_page=100" > meta-arts.json
          for y in 2017 2018 2019 2020 2021 2022; do
            id=$(jq -r --arg n "research-meta-fetched-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' meta-arts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "meta-${y}.zip"
            unzip -q "meta-${y}.zip" "research-meta-fetched-odds-${y}.jsonl" -d input/existing-odds
          done
          python scripts/research-build-ml-discovery-odds-demand.py \
            --selections-dir input/selections/ml-five-selections \
            --existing-odds-dir input/existing-odds \
            --history input/source/history/ten-year-history-corpus.jsonl \
            --max-year 2022 \
            --out analysis-results/ml-discovery-odds-demand.jsonl \
            --meta analysis-results/ml-discovery-odds-demand-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          target='2021-03-27-chukyo-03'
          found=[]
          for p in sorted(Path('input/existing-odds').glob('*.jsonl')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  r=json.loads(line)
                  if str(r.get('raceId')) != target: continue
                  found.append({
                      'file':p.name,
                      'requiredMarkets':r.get('requiredMarkets'),
                      'umatan14to15':((r.get('officialOdds') or {}).get('umatan') or {}).get('14-15'),
                      'umatanCoverage':((r.get('officialOddsCoverage') or {}).get('umatan')),
                      'source':(r.get('provenance') or {}).get('officialOddsSource'),
                  })
          demanded=False
          for line in Path('analysis-results/ml-discovery-odds-demand.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip() and str(json.loads(line).get('raceId'))==target:
                  demanded=True
                  break
          print(json.dumps({'target':target,'targetRows':found,'targetIn3451Demand':demanded},ensure_ascii=False))
          PY
