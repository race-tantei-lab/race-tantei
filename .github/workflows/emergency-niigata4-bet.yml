name: Emergency Niigata4 bet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-niigata4-bet.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.20"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install completed-model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0"
      - name: Force exact-race generation
        run: |
          python - <<'PY'
          import datetime as dt, importlib.util, json, pathlib, sys
          ROOT=pathlib.Path('.').resolve()
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(spec);sys.modules[name]=m;spec.loader.exec_module(m);return m
          run=load(ROOT/'scripts/run-auto-final-live.py','emergency_run')
          canon=load(ROOT/'scripts/run-ten-year-auto-final-live.py','emergency_canon')
          collector=run.collector_module()
          date=run.now_jst().date().isoformat(); rid=f'{date}-niigata-04'
          existing=collector.d1_query('SELECT COUNT(*) AS n FROM rt_public_bets WHERE race_id=?',[rid])
          if int(existing[0].get('n') or 0)>0:
              canon.verify_locked(collector,[rid]); print(json.dumps({'status':'already_generated','raceId':rid},ensure_ascii=False)); raise SystemExit(0)
          state=collector.d1_query('SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1',[f'final_daily_selection:{date}'])
          if not state: raise RuntimeError('TODAY_SELECTION_MISSING')
          payload=json.loads(str(state[0]['value'])); ids=[str(x['raceId']) for x in payload.get('selected',[])]
          if rid not in ids: raise RuntimeError(f'NOT_SELECTED:{rid}')
          race=collector.d1_query('SELECT race_id AS raceId,race_date AS raceDate,venue,race_no AS raceNo,start_time_utc AS startTimeUtc,entry_url AS entryUrl FROM rt_races WHERE race_id=? LIMIT 1',[rid])
          if not race: raise RuntimeError('RACE_MISSING')
          start=run.parse_utc(race[0].get('startTimeUtc')); now=dt.datetime.now(dt.timezone.utc)
          if start is None or start<=now: raise RuntimeError(f'RACE_ALREADY_STARTED:{start}:{now}')
          live=run.load_module('emergency_live_odds',run.ODDS_LIVE_SOURCE)
          fast=live.base
          fast.selected_ids=lambda:{rid}
          fast.base.upcoming_races=lambda:race
          fast.main()
          report=json.loads((ROOT/'official-odds-collection-report.json').read_text(encoding='utf-8'))
          if int(report.get('eligibleFixedTargetCount') or 0)!=1 or int(report.get('errorCount') or 0)!=0:
              raise RuntimeError(f'ODDS_COLLECTION_FAILED:{report}')
          covered=report.get('racesByBetType') or {}
          for bt in ('単勝','馬連','ワイド','馬単','3連複','3連単'):
              if int(covered.get(bt) or 0)!=1: raise RuntimeError(f'ODDS_TYPE_MISSING:{bt}:{covered}')
          sel=pathlib.Path('/tmp/emergency-selection.json'); sel.write_text(json.dumps(payload,ensure_ascii=False),encoding='utf-8')
          out=ROOT/'analysis-results'/f'emergency-{rid}.json'; out.parent.mkdir(exist_ok=True)
          canon.run_generator(date,sel,out)
          canon.verify_locked(collector,[rid])
          rows=collector.d1_query('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,assumed_odds AS assumedOdds FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination',[rid])
          print('EMERGENCY_BET_GENERATED='+json.dumps({'raceId':rid,'secondsBeforeStart':int((start-dt.datetime.now(dt.timezone.utc)).total_seconds()),'rows':rows},ensure_ascii=False))
          PY
