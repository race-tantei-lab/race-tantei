name: JRA historical odds page probe
run-name: JRA historical odds page probe · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jra-historical-odds-link-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/jra-historical-odds' -f description='JRA過去オッズCNAMEをPOST検証中' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch historical odds page by POST
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re, http.cookiejar
          from pathlib import Path
          from bs4 import BeautifulSoup
          result_url='https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0108202403050220240504%2F2B'
          odds_cname='pw151ou1008202403050220240504Z/4C'
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          common={'User-Agent':'Mozilla/5.0','Accept-Language':'ja','Referer':'https://www.jra.go.jp/'}
          # Establish the same session as an actual click from the result page.
          req0=urllib.request.Request(result_url,headers=common)
          with opener.open(req0,timeout=60) as r0:
              _=r0.read()
          data=urllib.parse.urlencode({'CNAME':odds_cname}).encode('ascii')
          req=urllib.request.Request('https://www.jra.go.jp/JRADB/accessO.html',data=data,headers={**common,'Referer':result_url,'Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with opener.open(req,timeout=60) as r:
              raw=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get('content-type')
          html=raw.decode('cp932','replace')
          soup=BeautifulSoup(html,'html.parser')
          text=' '.join(soup.stripped_strings)
          tables=[]
          for table in soup.find_all('table'):
              rows=[]
              for tr in table.find_all('tr')[:120]:
                  cells=[' '.join(c.stripped_strings) for c in tr.find_all(['th','td'])]
                  if cells: rows.append(cells)
              if rows: tables.append(rows)
          snippets=[]
          for needle in ['馬連','馬単','ワイド','3連複','3連単','単勝']:
              for m in list(re.finditer(re.escape(needle),text))[:10]:
                  snippets.append({'needle':needle,'text':text[max(0,m.start()-250):m.end()+1400]})
          cnames=sorted(set(re.findall(r'pw\d+[a-zA-Z0-9_/.-]+',html)))
          out={'status':status,'contentType':ctype,'finalUrl':final,'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'contains':{x:(x in text) for x in ['単勝','ワイド','馬連','馬単','3連複','3連単']}, 'tableCount':len(tables),'tables':tables[:20],'snippets':snippets[:60],'cnames':cnames[:150], 'cookieCount':len(list(cj))}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/jra-historical-odds-link-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':status,'finalUrl':final,'bytes':len(raw),'title':out['title'],'contains':out['contains'],'tableCount':len(tables),'cookieCount':out['cookieCount'],'cnames':cnames[:50]},ensure_ascii=False))
          if not any(out['contains'].values()):
              raise SystemExit('ODDS_PAGE_HAS_NO_ODDS_CONTENT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jra-historical-odds-link-probe
          path: artifacts/jra-historical-odds-link-probe.json
          retention-days: 7
      - name: Success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/jra-historical-odds' -f description='JRA過去オッズ画面POST取得成功' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/jra-historical-odds' -f description='JRA過去オッズPOST取得失敗' -f target_url="$STATUS_TARGET_URL" >/dev/null
