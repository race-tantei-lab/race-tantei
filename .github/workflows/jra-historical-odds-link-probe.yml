name: JRA doAction form probe
run-name: JRA doAction form probe · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jra-historical-odds-link-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/jra-historical-odds' -f description='JRA doActionのhidden値を監査中' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Inspect result page forms and doAction
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          url='https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0108202403050220240504%2F2B'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja','Referer':'https://www.jra.go.jp/'})
          with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(); status=r.status
          html=raw.decode('cp932','replace')
          soup=BeautifulSoup(html,'html.parser')
          forms=[]
          for f in soup.find_all('form'):
              inputs=[]
              for i in f.find_all(['input','select','textarea']):
                  inputs.append({'tag':i.name,'type':i.get('type'),'name':i.get('name'),'value':i.get('value'),'id':i.get('id')})
              forms.append({'id':f.get('id'),'name':f.get('name'),'method':f.get('method'),'action':f.get('action'),'inputs':inputs})
          js_src=[urllib.parse.urljoin(url,s.get('src')) for s in soup.find_all('script',src=True)]
          inline=[]
          for s in soup.find_all('script'):
              txt=s.get_text('\n')
              if 'doAction' in txt or 'CNAME' in txt: inline.append(txt[:12000])
          onclick=[]
          for tag in soup.find_all(onclick=True):
              if 'doAction' in tag.get('onclick',''): onclick.append(tag.get('onclick'))
          out={'status':status,'forms':forms,'jsSrc':js_src,'inline':inline,'doActionCalls':onclick[:100]}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/jra-historical-odds-link-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':status,'formCount':len(forms),'forms':forms,'jsSrc':js_src,'inlineCount':len(inline),'oddsCalls':[x for x in onclick if 'accessO' in x][:10]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jra-historical-odds-link-probe
          path: artifacts/jra-historical-odds-link-probe.json
          retention-days: 7
      - name: Success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/jra-historical-odds' -f description='JRA doAction hidden値監査完了' -f target_url="$STATUS_TARGET_URL" >/dev/null
