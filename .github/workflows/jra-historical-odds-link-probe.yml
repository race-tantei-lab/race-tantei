name: JRA historical odds link probe
run-name: JRA historical odds link probe · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jra-historical-odds-link-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/jra-historical-odds' -f description='JRA過去オッズリンクをCP932で確認中' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Extract odds links
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          url='https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde0108202403050220240504%2F2B'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja','Referer':'https://www.jra.go.jp/'})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read(); final=r.geturl(); status=r.status; ctype=r.headers.get('content-type')
          html=raw.decode('cp932','replace')
          soup=BeautifulSoup(html,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              text=' '.join(a.stripped_strings)
              href=urllib.parse.urljoin(final,a.get('href'))
              hay=(text+' '+href).lower()
              if 'オッズ' in text or 'odds' in hay or 'accesso' in hay or 'pw01o' in hay:
                  links.append({'text':text,'href':href})
          # Include form/action diagnostics because some JRA menus are form submissions.
          forms=[]
          for f in soup.find_all('form'):
              blob=' '.join(f.stripped_strings)
              action=urllib.parse.urljoin(final,f.get('action') or '')
              vals={i.get('name'):i.get('value') for i in f.find_all('input') if i.get('name')}
              if 'オッズ' in blob or any('odd' in str(x).lower() for x in [action,*vals.values()]):
                  forms.append({'text':blob[:500],'action':action,'inputs':vals})
          out={'status':status,'contentType':ctype,'finalUrl':final,'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links, 'forms':forms, 'containsOddsText':('オッズ' in html)}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/jra-historical-odds-link-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          if not links and not forms:
              raise SystemExit('NO_ODDS_NAV_FOUND')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jra-historical-odds-link-probe
          path: artifacts/jra-historical-odds-link-probe.json
          retention-days: 7
      - name: Success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/jra-historical-odds' -f description='JRA過去オッズ遷移を確認' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/jra-historical-odds' -f description='JRA過去オッズ遷移取得失敗' -f target_url="$STATUS_TARGET_URL" >/dev/null
