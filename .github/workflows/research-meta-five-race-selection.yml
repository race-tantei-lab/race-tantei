name: Research meta five-race reselection

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-meta-five-race-selection.yml"
      - "scripts/research-select-five-races-meta.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  ALL_RACE_RUN_ID: '31455507850'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark meta selection pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/meta-five-race-selection' -f description='Waiting for all-race OOS predictions then selecting five races' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet lightgbm==4.6.0 scikit-learn==1.7.1 pandas==2.3.1 numpy==2.2.6
      - name: Wait for and download eleven all-race folds
        run: |
          set -euo pipefail
          mkdir -p input/predictions
          for i in $(seq 1 240); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ALL_RACE_RUN_ID}/artifacts?per_page=100" > arts.json
            n=$(jq '[.artifacts[] | select(.name|startswith("research-all-race-ranker-20"))] | length' arts.json)
            if [ "$n" -ge 11 ]; then break; fi
            sleep 15
          done
          for y in $(seq 2016 2026); do
            id=$(jq -r --arg n "research-all-race-ranker-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' arts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "fold-${y}.zip"
            unzip -q "fold-${y}.zip" -d input/predictions
          done
          test $(find input/predictions -name 'all-race-ranker-20*.jsonl' | wc -l) -eq 11
      - name: Select five races per venue-day
        run: |
          python scripts/research-select-five-races-meta.py --predictions-dir input/predictions --out analysis-results/meta-five-race-demand.jsonl --meta analysis-results/meta-five-race-demand-meta.json
      - name: Verify exact selection policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/meta-five-race-demand-meta.json').read_text())
          assert m['allEvaluationRaces']>34000,m
          assert m['selectedRaces']==14410,m
          assert m['targetDayResultsUsedForSelection'] is False,m
          assert m['futureYearResultsUsedForSelection'] is False,m
          assert m['officialOddsUsedForSelection'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          assert m['structuralCancellationExceptions']==[{'date':'2020-03-29','venueCode':6,'eligible':2}],m['structuralCancellationExceptions']
          print(json.dumps({'allRaces':m['allEvaluationRaces'],'selected':m['selectedRaces'],'years':m['selectedByYear'],'diagnostics':m['diagnosticsByYear']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-meta-five-race-selection
          path: |
            analysis-results/meta-five-race-demand.jsonl
            analysis-results/meta-five-race-demand-meta.json
          retention-days: 30
      - name: Mark meta selection success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/meta-five-race-selection' -f description='Five-race reselection completed from past-only OOS meta model' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark meta selection failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/meta-five-race-selection' -f description='Meta five-race reselection needs repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
