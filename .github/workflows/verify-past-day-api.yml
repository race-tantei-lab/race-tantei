name: Verify historical day API
# verify frozen canonical history on production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-past-day-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe canonical historical days
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for d in 2024-05-26 2025-05-25 2026-08-02; do
            echo "=== $d ==="
            code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o "/tmp/$d.body" -w '%{http_code}' "$base/api/public/day?date=$d")
            test "$code" = '200'
            DATE="$d" node -e "const fs=require('fs');const d=process.env.DATE;const p=JSON.parse(fs.readFileSync('/tmp/'+d+'.body','utf8'));const r=p.races;if(!Array.isArray(r)||r.length<12)throw new Error('bad historical races '+d);const venues=new Set(r.map(x=>x.venue));const selectedCodes=new Set(['hit','miss','refund','buy','lose']);const selected=r.filter(x=>selectedCodes.has(x.publicState?.code));const skip=r.filter(x=>x.publicState?.code==='skip');if(selected.length!==venues.size*5)throw new Error('historical selection count '+d+': '+selected.length+' expected '+venues.size*5);if(skip.length!==r.length-selected.length)throw new Error('historical skip count '+d+': '+skip.length+' expected '+(r.length-selected.length));console.log(d,'races=',r.length,'venues=',venues.size,'selected=',selected.length,'skip=',skip.length)"
          done

      - name: Verify historical selected race detail
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          race_id=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/2024-05-26.body','utf8'));const selectedCodes=new Set(['hit','miss','refund','buy','lose']);const r=p.races.find(x=>selectedCodes.has(x.publicState?.code));if(!r)process.exit(2);process.stdout.write(r.raceId)")
          test -n "$race_id"
          echo "detail=$race_id"
          code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/detail.html -w '%{http_code}' "$base/races/$race_id")
          test "$code" = '200'
          grep -q '確定買い目' /tmp/detail.html
          grep -Eq '購入(額)?' /tmp/detail.html
          grep -q '出走馬' /tmp/detail.html
          if grep -Eq '<h1>[0-9]{1,2}(R|レース)</h1>|<h1>(検索ウィンドウ|検索メニュー|サイト内検索|出馬表)</h1>' /tmp/detail.html; then
            echo 'Historical detail still has a placeholder race name.' >&2
            exit 1
          fi
