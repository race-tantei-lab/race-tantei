name: Verify historical day API
# verify repaired canonical history on production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-past-day-api.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark pending
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"pending","context":"production/past-day-api","description":"checking repaired historical race pages"}' >/dev/null
      - name: Probe multiple historical days
        run: |
          set -euo pipefail
          for d in 2024-05-26 2025-05-25 2026-08-02; do
            echo "=== $d ==="
            code=$(curl -sS -o "/tmp/$d.body" -w '%{http_code}' "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$d")
            echo "HTTP $code"
            test "$code" = "200"
            python - "$d" <<'PY'
import json,sys
p=json.load(open('/tmp/'+sys.argv[1]+'.body'))
r=p.get('races')
assert isinstance(r,list) and len(r)>=12,(sys.argv[1],p)
print(sys.argv[1], 'races', len(r), 'selected', sum((x.get('publicState') or {}).get('code') in ('hit','miss','buy') for x in r))
PY
          done
      - name: Verify historical selected race detail
        run: |
          set -euo pipefail
          race_id=$(python - <<'PY'
import json
p=json.load(open('/tmp/2024-05-26.body'))
for r in p['races']:
    if (r.get('publicState') or {}).get('code') in ('hit','miss','buy'):
        print(r['raceId']);break
PY
          )
          test -n "$race_id"
          echo "detail=$race_id"
          code=$(curl -sS -o /tmp/detail.html -w '%{http_code}' "https://race-tantei-phase0.race-tantei.workers.dev/races/$race_id")
          test "$code" = "200"
          grep -q '確定買い目' /tmp/detail.html
          grep -q '購入額' /tmp/detail.html
          grep -q '出走馬' /tmp/detail.html
      - name: Mark success
        if: success()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"success","context":"production/past-day-api","description":"historical API and race detail verified"}' >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"failure","context":"production/past-day-api","description":"historical API/detail verification failed"}' >/dev/null
