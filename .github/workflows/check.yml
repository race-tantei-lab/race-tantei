name: Phase 0 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify live-lock safety
        run: python scripts/verify-live-lock-safety.py
      - name: Verify bodyweight final-lock acquisition
        run: python scripts/verify-bodyweight-final-lock.py
      - name: Verify WIN5 navigation UI
        run: python scripts/verify-win5-ui.py
      - name: Verify public language clarity
        run: python scripts/verify-public-language.py
      - name: Typecheck and test
        run: npm run check
