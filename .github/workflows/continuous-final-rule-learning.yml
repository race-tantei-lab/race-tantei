name: Continuous final rule learning

on:
  workflow_dispatch:
  # Keep analytical D1 work away from the live race/deadline window.
  # 12:37 UTC = 21:37 JST, after normal JRA racing has finished.
  schedule:
    - cron: "37 12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous-final-rule-learning.yml"
      - "scripts/update-final-rule-learning.py"
      - "scripts/generate-final-live-bets-batched.py"

concurrency:
  group: continuous-final-rule-learning
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  learn:
    # A push can happen during racing. Production-D1 learning is schedule/manual only.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark learning pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/continuous-final-rule-learning' \
            -f description='確定済み実戦結果から継続学習中' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile continuous learner
        run: python -m py_compile scripts/update-final-rule-learning.py scripts/generate-final-live-bets-batched.py
      - name: Learn only from settled immutable live bets
        shell: bash
        run: |
          set -o pipefail
          python scripts/update-final-rule-learning.py | tee final-rule-learning-state.json
      - name: Verify learning report
        run: |
          python - <<'PY'
          import json
          x=json.load(open('final-rule-learning-state.json',encoding='utf-8'))
          assert x['immutableHistory'] is True
          assert x['source']=='settled pre-start-locked final live public bets only'
          assert x['factorRange']==[0.8,1.2]
          print('continuous learning ok',x['settledRaces'],x['settledUniqueTickets'])
          PY
      - name: Upload learning audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-rule-learning-state
          path: final-rule-learning-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Mark learning success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='analysis/continuous-final-rule-learning' \
            -f description='継続学習完了・過去買い目変更なし' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark learning failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='analysis/continuous-final-rule-learning' \
            -f description='継続学習に失敗・ログ確認が必要' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
