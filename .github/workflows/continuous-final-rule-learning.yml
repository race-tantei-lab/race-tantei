name: Continuous final rule learning

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous-final-rule-learning.yml"
      - "scripts/update-final-rule-learning.py"
      - "scripts/generate-final-live-bets-learning.py"

concurrency:
  group: continuous-final-rule-learning
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile continuous learner
        run: python -m py_compile scripts/update-final-rule-learning.py scripts/generate-final-live-bets-learning.py
      - name: Learn only from settled immutable live bets
        shell: bash
        run: |
          set -o pipefail
          python scripts/update-final-rule-learning.py | tee final-rule-learning-state.json
      - name: Verify learning report
        run: |
          python - <<'PY'
          import json
          x=json.load(open('final-rule-learning-state.json',encoding='utf-8'))
          assert x['immutableHistory'] is True
          assert x['source']=='settled pre-start-locked final live public bets only'
          assert x['factorRange']==[0.8,1.2]
          print('continuous learning ok',x['settledRaces'],x['settledUniqueTickets'])
          PY
      - name: Upload learning audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-rule-learning-state
          path: final-rule-learning-state.json
          if-no-files-found: warn
          retention-days: 30
