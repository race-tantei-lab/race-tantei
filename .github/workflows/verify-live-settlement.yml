name: Verify live settlement integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-settlement.yml"
  schedule:
    - cron: '30 8 * * *' # 17:30 JST; exits immediately on non-race days

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect race day
        id: race_day
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt,importlib.util,pathlib,sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('race_day_detect',p);m=importlib.util.module_from_spec(s);sys.modules['race_day_detect']=m;s.loader.exec_module(m)
          today=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          rows=m.d1_query('SELECT COUNT(*) AS races FROM rt_races WHERE race_date=?',[today])
          count=int(rows[0].get('races') or 0) if rows else 0
          with open('/tmp/race-day','w') as f: f.write('1' if count else '0')
          print('RACE_DAY_DETECT',today,count)
          PY
          if [ "$(cat /tmp/race-day)" = 1 ]; then echo 'active=true' >> "$GITHUB_OUTPUT"; else echo 'active=false' >> "$GITHUB_OUTPUT"; fi

      - name: Reconcile production, results, payouts and all selected settlements
        if: steps.race_day.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 60 -fsS \
            "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$today" -o /tmp/today.json
          python - <<'PY'
          import collections,datetime as dt,importlib.util,json,pathlib,re,sys
          root=pathlib.Path.cwd(); path=root/'scripts'/'collect-jra-official-odds.py'
          spec=importlib.util.spec_from_file_location('settlement_guard_collector',path)
          mod=importlib.util.module_from_spec(spec);sys.modules['settlement_guard_collector']=mod;spec.loader.exec_module(mod)
          today=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          unordered={'ワイド','馬連','3連複'}
          def nums(combination): return [int(x) for x in re.findall(r'\d{1,2}',str(combination or ''))]
          def canonical(bet_type,combination):
              values=nums(combination)
              if bet_type in unordered: values.sort()
              return '-'.join(map(str,values))

          state=mod.d1_query('SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1',[f'final_daily_selection:{today}'])
          if not state: raise RuntimeError('SELECTION_MISSING:'+today)
          selected_payload=json.loads(str(state[0].get('value') or '{}')); selected=selected_payload.get('selected') or []
          selected_ids=[str(x.get('raceId') or '') for x in selected]
          by=collections.Counter(str(x.get('venue') or '') for x in selected)
          if len(selected_ids)!=15 or len(by)!=3 or any(v!=5 for v in by.values()): raise RuntimeError('SELECTION_COUNT_INVALID:'+json.dumps(dict(by),ensure_ascii=False))
          ph=','.join('?' for _ in selected_ids)

          bets=mod.d1_query(f'''SELECT b.id,b.race_id AS raceId,b.course,b.bet_type AS betType,b.combination,
                                      b.stake_yen AS stakeYen,b.settlement_status AS settlementStatus,
                                      COALESCE(b.return_yen,0) AS returnYen,r.status,
                                      COALESCE(r.refund_horse_nos_json,'[]') AS refundsJson
                               FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id
                               WHERE b.race_id IN ({ph}) ORDER BY b.race_id,b.id''',selected_ids)
          payouts=mod.d1_query(f'''SELECT p.race_id AS raceId,p.bet_type AS betType,p.combination,p.payout_yen AS payoutYen
                                  FROM rt_payouts p WHERE p.race_id IN ({ph})''',selected_ids)
          result_counts=mod.d1_query(f'''SELECT race_id AS raceId,COUNT(*) AS rows FROM rt_results WHERE race_id IN ({ph}) GROUP BY race_id''',selected_ids)
          payout_counts=mod.d1_query(f'''SELECT race_id AS raceId,COUNT(*) AS rows FROM rt_payouts WHERE race_id IN ({ph}) GROUP BY race_id''',selected_ids)
          have_results={str(x['raceId']) for x in result_counts if int(x.get('rows') or 0)>0}
          have_payouts={str(x['raceId']) for x in payout_counts if int(x.get('rows') or 0)>0}
          if have_results!=set(selected_ids): raise RuntimeError('RESULTS_MISSING:'+','.join(sorted(set(selected_ids)-have_results)))
          if have_payouts!=set(selected_ids): raise RuntimeError('PAYOUTS_MISSING:'+','.join(sorted(set(selected_ids)-have_payouts)))

          payout_map={(str(p['raceId']),str(p['betType']),canonical(str(p['betType']),str(p['combination']))):int(p.get('payoutYen') or 0) for p in payouts}
          false_zero=[];bad_refunds=[];bad_positive=[];race_rows=collections.defaultdict(list)
          for b in bets:
              race_id=str(b['raceId']);race_rows[race_id].append(b)
              try: refunds={int(x) for x in json.loads(str(b.get('refundsJson') or '[]'))}
              except Exception: refunds=set()
              is_refund=any(x in refunds for x in nums(b.get('combination')))
              settled=str(b.get('settlementStatus'))=='settled'; returned=int(b.get('returnYen') or 0);stake=int(b.get('stakeYen') or 0)
              key=(race_id,str(b['betType']),canonical(str(b['betType']),str(b['combination'])));official=payout_map.get(key)
              if settled and is_refund and returned!=stake: bad_refunds.append({'id':b['id'],'raceId':race_id,'stakeYen':stake,'returnYen':returned})
              if settled and not is_refund and returned==0 and official and official>0: false_zero.append({'id':b['id'],'raceId':race_id,'officialPayoutYen':official})
              if settled and not is_refund and returned>0:
                  expected=round(stake/100*official) if official and official>0 else 0
                  if expected<=0 or returned!=expected: bad_positive.append({'id':b['id'],'raceId':race_id,'expectedReturnYen':expected,'returnYen':returned})
          missing_bets=[rid for rid in selected_ids if len(race_rows.get(rid,[]))!=6]
          unsettled=[rid for rid in selected_ids if len(race_rows.get(rid,[]))==6 and any(str(x.get('settlementStatus'))!='settled' for x in race_rows[rid])]
          if missing_bets: raise RuntimeError('SELECTED_RACE_BETS_NOT_SIX:'+','.join(sorted(missing_bets)))
          if unsettled: raise RuntimeError('SELECTED_RACE_UNSETTLED:'+','.join(sorted(unsettled)))
          if false_zero: raise RuntimeError('LIVE_SETTLEMENT_FALSE_MISS:'+json.dumps(false_zero,ensure_ascii=False))
          if bad_refunds: raise RuntimeError('LIVE_SETTLEMENT_BAD_REFUND:'+json.dumps(bad_refunds,ensure_ascii=False))
          if bad_positive: raise RuntimeError('LIVE_SETTLEMENT_BAD_POSITIVE_RETURN:'+json.dumps(bad_positive,ensure_ascii=False))

          payload=json.loads(pathlib.Path('/tmp/today.json').read_text(encoding='utf-8'))
          api={str(r.get('raceId')):str((r.get('publicState') or {}).get('code') or '') for r in payload.get('races',[])}
          mismatches=[];hits=[];refund_only=[]
          for race_id in selected_ids:
              rows=race_rows[race_id];genuine_hit=False;has_refund=False
              for x in rows:
                  try: refunds={int(v) for v in json.loads(str(x.get('refundsJson') or '[]'))}
                  except Exception: refunds=set()
                  is_refund=any(v in refunds for v in nums(x.get('combination')));has_refund=has_refund or is_refund
                  if not is_refund and int(x.get('returnYen') or 0)>0: genuine_hit=True
              expected='hit' if genuine_hit else ('refund' if has_refund else 'miss')
              if expected=='hit': hits.append(race_id)
              if expected=='refund': refund_only.append(race_id)
              actual=api.get(race_id,'')
              if actual!=expected: mismatches.append({'raceId':race_id,'expected':expected,'actual':actual})
          if mismatches: raise RuntimeError('LIVE_SETTLEMENT_API_MISMATCH:'+json.dumps(mismatches,ensure_ascii=False))
          print(json.dumps({'status':'LIVE_SETTLEMENT_FULL_DAY_OK','date':today,'selectedRaceCount':15,'settledRacesChecked':15,'hitRaceIds':sorted(hits),'refundOnlyRaceIds':sorted(refund_only),'resultsComplete':True,'payoutsComplete':True,'falseMisses':0,'badRefunds':0,'badPositiveReturns':0,'apiMismatches':0},ensure_ascii=False))
          PY
