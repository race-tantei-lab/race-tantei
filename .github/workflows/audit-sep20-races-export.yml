name: Audit Sep 20 D1 race URLs from export
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/audit-sep20-races-export.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export races
        shell: bash
        run: |
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_races --output /tmp/races.sql
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_runners --output /tmp/runners.sql
          sqlite3 /tmp/r.db < /tmp/races.sql
          sqlite3 /tmp/r.db < /tmp/runners.sql
          echo '=== SEP20_RACES ==='
          sqlite3 -json /tmp/r.db "
            SELECT race_id AS raceId,venue,race_no AS raceNo,
              CASE WHEN LENGTH(TRIM(COALESCE(entry_url,'')))>0 THEN 1 ELSE 0 END AS hasEntryUrl,
              entry_url AS entryUrl,start_time_utc AS startTimeUtc,surface,distance_m AS distanceM
            FROM rt_races WHERE race_date='2026-09-20' ORDER BY venue,race_no;"
          echo '=== SEP20_RACE_SUMMARY ==='
          sqlite3 -json /tmp/r.db "
            SELECT venue,COUNT(*) races,
              SUM(CASE WHEN LENGTH(TRIM(COALESCE(entry_url,'')))>0 THEN 1 ELSE 0 END) entryUrls,
              SUM(CASE WHEN start_time_utc IS NOT NULL AND surface IS NOT NULL AND distance_m IS NOT NULL THEN 1 ELSE 0 END) metadataReady
            FROM rt_races WHERE race_date='2026-09-20' GROUP BY venue ORDER BY venue;"
          echo '=== SEP20_RUNNER_SUMMARY ==='
          sqlite3 -json /tmp/r.db "
            SELECT r.venue,COUNT(DISTINCT r.race_id) AS racesWithRunners,
              COUNT(ru.horse_no) AS activeRunnerRows,
              MIN(CASE WHEN ru.race_id IS NULL THEN 0 ELSE 1 END) AS allJoined
            FROM rt_races r
            LEFT JOIN rt_runners ru ON ru.race_id=r.race_id AND COALESCE(ru.runner_status,'active')='active'
            WHERE r.race_date='2026-09-20'
            GROUP BY r.venue ORDER BY r.venue;"
          echo '=== SEP20_PER_RACE_RUNNERS ==='
          sqlite3 -json /tmp/r.db "
            SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,
              COUNT(ru.horse_no) AS activeRunners
            FROM rt_races r
            LEFT JOIN rt_runners ru ON ru.race_id=r.race_id AND COALESCE(ru.runner_status,'active')='active'
            WHERE r.race_date='2026-09-20'
            GROUP BY r.race_id,r.venue,r.race_no
            ORDER BY r.venue,r.race_no;"
