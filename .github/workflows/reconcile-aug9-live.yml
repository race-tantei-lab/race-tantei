name: Reconcile August 9 live locks
run-name: Reconcile August 9 live locks · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-aug9-live.yml'
      - 'scripts/reconcile-predeadline-live-locks.py'
      - 'scripts/generate-final-live-bets-production.py'
      - 'scripts/generate-final-live-bets-snapshot.py'
      - 'scripts/generate-final-preday-selection-remote.py'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: reconcile-aug9-live
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_ODDS_REQUEST_PAUSE_SECONDS: '0.50'
      JRA_ODDS_D1_BATCH_ROWS: '20'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Compile correction path
        run: python -m py_compile scripts/repair-aug9-official-program.py scripts/generate-final-preday-selection-remote.py scripts/collect-current-jra-official-odds-live.py scripts/generate-final-live-bets.py scripts/generate-final-live-bets-snapshot.py scripts/generate-final-live-bets-production.py scripts/reconcile-predeadline-live-locks.py
      - name: Restore official program and freeze corrected selection
        run: |
          mkdir -p analysis-results
          python scripts/repair-aug9-official-program.py
          python scripts/generate-final-preday-selection-remote.py --date 2026-08-09 --out analysis-results/final-aug9-selection.json
          python - <<'PY'
          import json
          x=json.load(open('analysis-results/final-aug9-selection.json',encoding='utf-8'))
          assert x['resultDataUsedForTargetDay'] is False
          assert len(x['selected'])==15
          r=next(r for r in x['selected'] if r['raceId']=='2026-08-09-niigata-11')
          assert r['raceName']!='検索ウィンドウ' and int(r['distanceM'])>0 and r['surface'] in ('芝','ダート','障害')
          assert 'conditions' in r and 'direction' in r
          print('niigata11 frozen metadata',r['raceName'],r['surface'],r['distanceM'],r.get('conditions'),r.get('direction'))
          PY
      - name: Collect current official odds
        run: |
          python scripts/collect-current-jra-official-odds-live.py | tee /tmp/reconcile-odds.log
          test -s current-selected-official-odds.json.gz
      - name: Recompute candidates from frozen metadata without writing
        run: |
          python scripts/generate-final-live-bets-production.py \
            --repo . --date 2026-08-09 \
            --selection analysis-results/final-aug9-selection.json \
            --odds-file current-selected-official-odds.json.gz \
            --out analysis-results/final-aug9-corrected-candidate.json | tee /tmp/reconcile-candidate.log
          test -s analysis-results/final-aug9-corrected-candidate.json
      - name: Correct only differences that are still before deadline
        run: |
          python scripts/reconcile-predeadline-live-locks.py \
            --candidate analysis-results/final-aug9-corrected-candidate.json \
            --out analysis-results/final-aug9-reconcile-report.json | tee /tmp/reconcile.log
      - name: Verify public D1 locks
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,COUNT(*) AS rows,COUNT(DISTINCT course) AS courses,MIN(locked_at) AS lockedAt FROM rt_public_bets WHERE race_id IN ('2026-08-09-niigata-11','2026-08-09-chukyo-11','2026-08-09-niigata-12') GROUP BY race_id ORDER BY race_id" > analysis-results/final-aug9-reconciled-d1.json
          cat analysis-results/final-aug9-reconciled-d1.json
      - name: Save reconciliation proof
        run: |
          git add -f analysis-results/final-aug9-selection.json analysis-results/final-aug9-corrected-candidate.json analysis-results/final-aug9-reconcile-report.json analysis-results/final-aug9-reconciled-d1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile August 9 live locks before deadline'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
