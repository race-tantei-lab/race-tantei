name: Research NEW racewise LambdaRank + top3 + 2-part JRA payout model (2025)

on:
  pull_request:
    branches:
      - research/postaug-independent-models-paired-20261107
    paths:
      - scripts/research-structural-ranker-twohead-2025.py
      - .github/workflows/research-structural-ranker-twohead-2025.yml

permissions:
  contents: read

concurrency:
  group: structural-ranker-twohead-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-horse-ranker-and-ticket-hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent structural model training libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Strict structural model syntax and mathematical sanity checks
        run: |
          python -m py_compile scripts/research-structural-ranker-twohead-2025.py
          python -u scripts/research-structural-ranker-twohead-2025.py --self-test
      - name: Train grouped ranking and placement and 2024-payout hurdle, evaluate unseen-year 2025 real JRA payout
        run: python -u scripts/research-structural-ranker-twohead-2025.py
      - name: Preserve exact same-population two-type hit and ROI, model internals, and exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-ranker-top3-hurdle-2025-paired-jra-roi
          path: analysis-results/structural-ranker-twohead-2024train-2025jra.json
          if-no-files-found: warn
          retention-days: 30
