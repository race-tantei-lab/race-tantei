name: Research NEW LambdaRank CatBoost and actual JRA payout modeling

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-multitarget-ranking-payout-value.py
      - .github/workflows/research-multitarget-ranking-payout-value.yml
permissions:
  contents: read
concurrency:
  group: multitarget-payout-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chronological-horse-and-payout-model:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned CPU model libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1' 'catboost==1.2.8'
      - name: Syntax and exact PL ticket and JRA ROI self tests
        run: |
          python -m py_compile scripts/research-multitarget-ranking-payout-value.py
          python scripts/research-multitarget-ranking-payout-value.py --self-test
      - name: Chronologically train ranking and multi-target horse models, then learn actual payout and test 2025
        run: python -u scripts/research-multitarget-ranking-payout-value.py
      - name: Preserve all paired JRA ROI and hit evidence including baseline-fixed races
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-jra-multitarget-lambdarank-catboost-tweedie
          path: analysis-results/multiobjective-ranker-catboost-tweedie-2025-jra.json
          if-no-files-found: warn
          retention-days: 30
