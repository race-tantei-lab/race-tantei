name: Research ten-year canonical transfer

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-ten-year-canonical-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  HISTORY_ARTIFACT_ID: '9056288221'
  DEMAND_RUN_ID: '31373103782'
  ODDS_RUN_ID: '31373205723'
  REPAIR_RUN_ID: '31399828698'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Mark transfer research pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-canonical-transfer' \
            -f description='Waiting for zero-gap official odds repair before 297-rule transfer' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - name: Wait for targeted official odds repair
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}" --jq '.conclusion // ""')
            echo "repair run: status=$status conclusion=$conclusion poll=$i"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 30
          done
          echo "repair workflow wait timeout"
          exit 1

      - name: Download assembled history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assembled
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > assembled.zip
          unzip -q assembled.zip -d assembled
          test -s assembled/ten-year-history-corpus.jsonl

      - name: Download demand manifest and pruned rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demand
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-ten-year-canonical-demand" and .expired==false) | .id' demand-artifacts.json | head -n1)
          test -n "$id" && test "$id" != "null"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          test -s demand/research-ten-year-canonical-demand.jsonl
          test -s demand/research-canonical-rules-297.json

      - name: Download all official odds shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p odds
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}/artifacts?per_page=100" > odds-artifacts.json
          for year in $(seq 2016 2026); do
            name="research-demanded-odds-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' odds-artifacts.json | head -n1)
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "missing artifact $name"; exit 1; fi
            mkdir -p "odds/$year"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$name.zip"
            unzip -q "$name.zip" -d "odds/$year"
          done
          find odds -mindepth 2 -name 'research-demanded-odds-20*.jsonl' -type f -exec cp {} odds/ \;
          count=$(find odds -maxdepth 1 -name 'research-demanded-odds-20*.jsonl' -type f | wc -l)
          test "$count" -eq 11

      - name: Download targeted odds repair artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}/artifacts?per_page=100" > repair-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-demanded-odds-repair" and .expired==false) | .id' repair-artifacts.json | head -n1)
          test -n "$id" && test "$id" != "null"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > repair.zip
          unzip -q repair.zip -d repair
          test -f repair/research-demanded-odds-repair.jsonl
          test -s repair/research-demanded-odds-repair-meta.json
          test -s repair/research-demanded-odds-resolved-failures-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('repair/research-demanded-odds-resolved-failures-meta.json').read_text())
          m=json.loads(Path('repair/research-demanded-odds-repair-meta.json').read_text())
          assert int(r.get('unresolvedCount') or 0)==0,r
          assert int(r.get('resolvedCount') or 0)==int(r.get('initialFailureCount') or 0),r
          assert not m.get('failures'),m
          assert int(m.get('completedRaces') or 0)==int(r.get('resolvedCount') or 0),(r,m)
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          assert m['productionModelChanged'] is False,m
          print(json.dumps({'resolved':r['resolvedCount'],'repaired':m['completedRaces'],'failures':len(m.get('failures',[]))},ensure_ascii=False))
          PY
          cp repair/research-demanded-odds-repair.jsonl odds/research-demanded-odds-repair.jsonl

      - name: Evaluate canonical transfer
        run: |
          set -euo pipefail
          python scripts/research-evaluate-canonical-transfer.py \
            --corpus assembled/ten-year-history-corpus.jsonl \
            --demand demand/research-ten-year-canonical-demand.jsonl \
            --rules demand/research-canonical-rules-297.json \
            --odds-dir odds \
            --out analysis-results/research-canonical-297-ten-year-transfer.json

      - name: Verify diagnostic provenance and completeness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-canonical-297-ten-year-transfer.json').read_text())
          assert m['evaluationStart']=='2016-08-10',m
          assert m['evaluationEnd']=='2026-08-09',m
          assert m['sourceRuleCount']==297,m
          assert m['missingOddsRaceCount']==0,m
          assert m['evaluationErrorCount']==0,m
          assert m['hardGateEligible'] is True,m
          assert m['historicalFinalOddsUsed'] is True,m
          assert m['prestartTimingValidationPerformed'] is False,m
          assert m['targetDayResultsUsedForSelection'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          assert m['productionModelChanged'] is False,m
          print(json.dumps({
            'selectedDemandRaces':m['selectedDemandRaces'],
            'oddsRaces':m['oddsRaces'],
            'missingOddsRaceCount':m['missingOddsRaceCount'],
            'evaluationErrorCount':m['evaluationErrorCount'],
            'evaluatedRaces':m['evaluatedRaces'],
            'hardGateEligible':m['hardGateEligible'],
            'allThreeCoursesAtLeast200Pct':m['allThreeCoursesAtLeast200Pct'],
            'roi':{k:v['roiPct'] for k,v in m['courses'].items()},
          },ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-canonical-297-ten-year-transfer
          path: analysis-results/research-canonical-297-ten-year-transfer.json
          if-no-files-found: warn
          retention-days: 30

      - name: Mark transfer research complete
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-canonical-transfer' \
            -f description='297-rule retrospective ten-year transfer diagnostic completed with zero odds gaps' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark transfer research failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-canonical-transfer' \
            -f description='Canonical transfer diagnostic requires targeted repair' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
