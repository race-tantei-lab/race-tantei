name: Harden odds preview parser version
on:
  push:
    branches: [main]
    paths: [".github/workflows/harden-odds-preview-version-20260823.yml"]
permissions:
  contents: write
  statuses: write
concurrency:
  group: harden-odds-preview-parser-version
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/odds-preview-provenance' -f description='Hardening preview parser provenance' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Patch preview provenance guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          VERSION = 'jra-decimal-cells-sanity-v2-20260823'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/v1/completed-worker-live-lock.ts')
          s = p.read_text()
          if VERSION not in s:
              s = replace_once(s, 'const PREVIEW_VERSION = 1;\nconst OFFICIAL_ODDS_SOURCES = new Set(["jra-fast-official", "jra-crawl-official"]);', f'const PREVIEW_VERSION = 1;\nconst ODDS_PARSER_VERSION = "{VERSION}";\nconst OFFICIAL_ODDS_SOURCES = new Set(["jra-fast-official", "jra-crawl-official"]);', 'live-lock constant')
              s = replace_once(s, '  oddsFetchedAt: string;\n  oddsSource: string;\n  oddsSnapshotSha256: string;', '  oddsFetchedAt: string;\n  oddsSource: string;\n  oddsParserVersion: string;\n  oddsSnapshotSha256: string;', 'live-lock type')
              s = replace_once(s, '  if (!OFFICIAL_ODDS_SOURCES.has(snapshot.oddsSource) || !/^[0-9a-f]{64}$/.test(snapshot.oddsSnapshotSha256)) return false;', '  if (snapshot.oddsParserVersion !== ODDS_PARSER_VERSION) return false;\n  if (!OFFICIAL_ODDS_SOURCES.has(snapshot.oddsSource) || !/^[0-9a-f]{64}$/.test(snapshot.oddsSnapshotSha256)) return false;', 'live-lock validation')
              s = replace_once(s, '    oddsFetchedAt,\n    oddsSource: fetched.source,\n    oddsSnapshotSha256: await sha256Hex(canonicalOddsRows(fetched.rows)),', '    oddsFetchedAt,\n    oddsSource: fetched.source,\n    oddsParserVersion: ODDS_PARSER_VERSION,\n    oddsSnapshotSha256: await sha256Hex(canonicalOddsRows(fetched.rows)),', 'live-lock generation')
              s = replace_once(s, '    oddsFetchedAt: snapshot.oddsFetchedAt, oddsSource: snapshot.oddsSource,\n    oddsSnapshotSha256: snapshot.oddsSnapshotSha256,', '    oddsFetchedAt: snapshot.oddsFetchedAt, oddsSource: snapshot.oddsSource,\n    oddsParserVersion: snapshot.oddsParserVersion,\n    oddsSnapshotSha256: snapshot.oddsSnapshotSha256,', 'live-lock final state')
              p.write_text(s)

          p = Path('src/v1/completed-worker-deadline-guard.ts')
          s = p.read_text()
          if VERSION not in s:
              s = replace_once(s, 'const MAX_OFFICIAL_PREVIEW_AGE_MS = 60 * 60 * 1000;\nconst COURSES =', f'const MAX_OFFICIAL_PREVIEW_AGE_MS = 60 * 60 * 1000;\nconst ODDS_PARSER_VERSION = "{VERSION}";\nconst COURSES =', 'deadline constant')
              s = replace_once(s, '  oddsFetchedAt?: string;\n  oddsSource?: string;\n  oddsSnapshotSha256?: string;', '  oddsFetchedAt?: string;\n  oddsSource?: string;\n  oddsParserVersion?: string;\n  oddsSnapshotSha256?: string;', 'deadline type')
              s = replace_once(s, '    oddsSource: string;\n    oddsSnapshotSha256: string;\n  } {', '    oddsSource: string;\n    oddsParserVersion: string;\n    oddsSnapshotSha256: string;\n  } {', 'deadline predicate type')
              s = replace_once(s, '  if (snapshot.oddsSource !== "jra-fast-official" && snapshot.oddsSource !== "jra-crawl-official") return false;\n  if (!/^[0-9a-f]{64}$/.test(String(snapshot.oddsSnapshotSha256 || ""))) return false;', '  if (snapshot.oddsParserVersion !== ODDS_PARSER_VERSION) return false;\n  if (snapshot.oddsSource !== "jra-fast-official" && snapshot.oddsSource !== "jra-crawl-official") return false;\n  if (!/^[0-9a-f]{64}$/.test(String(snapshot.oddsSnapshotSha256 || ""))) return false;', 'deadline validation')
              s = replace_once(s, '    oddsSource: string;\n    oddsSnapshotSha256: string;\n  },\n  now: Date,', '    oddsSource: string;\n    oddsParserVersion: string;\n    oddsSnapshotSha256: string;\n  },\n  now: Date,', 'deadline commit type')
              s = replace_once(s, '    oddsFetchedAt: snapshot.oddsFetchedAt,\n    oddsSource: snapshot.oddsSource,\n    oddsSnapshotSha256: snapshot.oddsSnapshotSha256,', '    oddsFetchedAt: snapshot.oddsFetchedAt,\n    oddsSource: snapshot.oddsSource,\n    oddsParserVersion: snapshot.oddsParserVersion,\n    oddsSnapshotSha256: snapshot.oddsSnapshotSha256,', 'deadline final state')
              p.write_text(s)
          PY
      - name: Verify source markers and types
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'jra-decimal-cells-sanity-v2-20260823' src/v1/completed-worker-live-lock.ts
          grep -q 'jra-decimal-cells-sanity-v2-20260823' src/v1/completed-worker-deadline-guard.ts
          grep -q 'snapshot.oddsParserVersion !== ODDS_PARSER_VERSION' src/v1/completed-worker-live-lock.ts
          grep -q 'snapshot.oddsParserVersion !== ODDS_PARSER_VERSION' src/v1/completed-worker-deadline-guard.ts
          npm run typecheck
      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/completed-worker-live-lock.ts src/v1/completed-worker-deadline-guard.ts
          if git diff --cached --quiet; then
            echo 'Source already hardened.'
          else
            git commit -m 'Reject previews from obsolete odds parser'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/odds-preview-provenance' -f description='Obsolete parser previews are rejected' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/odds-preview-provenance' -f description='Preview parser provenance hardening failed' -f target_url="$STATUS_TARGET_URL" >/dev/null