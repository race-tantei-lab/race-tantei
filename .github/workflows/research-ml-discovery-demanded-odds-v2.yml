name: Research ML discovery demanded official odds v2

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-ml-discovery-demanded-odds-v2.yml"
      - "scripts/research-build-ml-discovery-odds-demand.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  SELECTION_ARTIFACT_ID: '9088036803'
  SOURCE_INPUT_ARTIFACT_ID: '9086766461'
  OLD_ODDS_RUN_ID: '31373205723'
  COMPLETED_2016_ARTIFACT_ID: '9088548944'
  META_ODDS_RUN_ID: '31456971683'
  SUPERSEDED_RUN_IDS: '31456300365 31457357885 31457880795'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/ml-discovery-odds-v2' -f description='Waiting for reusable 2017-2022 meta odds, then fetching only strict remainder' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Wait for reusable meta official odds through 2022
        run: |
          set -euo pipefail
          mkdir -p input/meta-reuse
          for i in $(seq 1 720); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${META_ODDS_RUN_ID}/artifacts?per_page=100" > meta-artifacts.json
            n=0
            for y in $(seq 2017 2022); do
              id=$(jq -r --arg n "research-meta-fetched-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' meta-artifacts.json | head -n1)
              if [ -n "$id" ] && [ "$id" != null ]; then n=$((n+1)); fi
            done
            if [ "$n" -eq 6 ]; then break; fi
            sleep 15
          done
          for y in $(seq 2017 2022); do
            id=$(jq -r --arg n "research-meta-fetched-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' meta-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "meta-${y}.zip"
            unzip -q "meta-${y}.zip" "research-meta-fetched-odds-${y}.jsonl" -d input/meta-reuse
          done
          test $(find input/meta-reuse -name 'research-meta-fetched-odds-20*.jsonl' | wc -l) -eq 6
      - name: Stop superseded and supplementary fetches
        run: |
          for rid in $SUPERSEDED_RUN_IDS $META_ODDS_RUN_ID; do
            if [ "$rid" != "$GITHUB_RUN_ID" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}/cancel" >/dev/null 2>&1 || true
            fi
          done
      - name: Assemble reusable official odds
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}/zip" > selections.zip
          mkdir -p input/selections
          unzip -q selections.zip -d input/selections
          mkdir -p input/source/existing-odds input/source/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_INPUT_ARTIFACT_ID}/zip" > source-clean.zip
          unzip -q source-clean.zip 'corrected-odds/*.jsonl' 'history/ten-year-history-corpus.jsonl' -d input/source/base
          cp input/source/base/corrected-odds/*.jsonl input/source/existing-odds/
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_ODDS_RUN_ID}/artifacts?per_page=100" > old-artifacts.json
          for y in $(seq 2016 2022); do
            id=$(jq -r --arg n "research-demanded-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' old-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "old-${y}.zip"
            unzip -q "old-${y}.zip" "research-demanded-odds-${y}.jsonl" -d input/source/existing-odds
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPLETED_2016_ARTIFACT_ID}/zip" > completed-2016.zip
          unzip -q completed-2016.zip 'ml-discovery-odds-2016.jsonl' -d input/source/existing-odds
          cp input/meta-reuse/research-meta-fetched-odds-20*.jsonl input/source/existing-odds/
      - name: Build locked discovery demand
        run: |
          python scripts/research-build-ml-discovery-odds-demand.py \
            --selections-dir input/selections/ml-five-selections \
            --existing-odds-dir input/source/existing-odds \
            --history input/source/base/history/ten-year-history-corpus.jsonl \
            --max-year 2022 \
            --out analysis-results/ml-discovery-odds-demand.jsonl \
            --meta analysis-results/ml-discovery-odds-demand-meta.json
      - name: Verify reduced exact demand
        run: |
          python - <<'PY'
          import json
          m=json.load(open('analysis-results/ml-discovery-odds-demand-meta.json'))
          assert m['discoveryBoundaryLocked'] is True,m
          assert m['unionSelectedRaces']==16224,m
          assert m['reusedRaces']==12773,m
          assert m['missingRaces']==3451,m
          assert m['missingByYear']=={'2017':476,'2018':582,'2019':576,'2020':576,'2021':591,'2022':650},m
          assert m['reuseRequiresAllSixMarkets'] is True,m
          assert m['targetRaceResultUsedForDemand'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps(m,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml-discovery-odds-v2-demand
          path: |
            analysis-results/ml-discovery-odds-demand.jsonl
            analysis-results/ml-discovery-odds-demand-meta.json
          retention-days: 30

  year:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ['2017','2018','2019','2020','2021','2022']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.4
      - uses: actions/download-artifact@v4
        with:
          name: research-ml-discovery-odds-v2-demand
          path: input
      - name: Fetch official odds ${{ matrix.year }}
        run: |
          python scripts/research-fetch-demanded-official-odds.py \
            --input input/ml-discovery-odds-demand.jsonl \
            --out analysis-results/ml-discovery-odds-${{ matrix.year }}.jsonl \
            --meta analysis-results/ml-discovery-odds-${{ matrix.year }}-meta.json \
            --year '${{ matrix.year }}' --workers 4
      - name: Require every demanded race
        env:
          YEAR: ${{ matrix.year }}
        run: |
          expected=$(python - <<'PY'
          import json,os
          y=os.environ['YEAR'];print(sum(1 for line in open('input/ml-discovery-odds-demand.jsonl') if line.strip() and str(json.loads(line)['raceDate']).startswith(y+'-')))
          PY
          )
          actual=$(wc -l < "analysis-results/ml-discovery-odds-${YEAR}.jsonl")
          echo "year=${YEAR} expected=${expected} actual=${actual}"
          test "$actual" -eq "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml-discovery-odds-v2-${{ matrix.year }}
          path: |
            analysis-results/ml-discovery-odds-${{ matrix.year }}.jsonl
            analysis-results/ml-discovery-odds-${{ matrix.year }}-meta.json
          retention-days: 30

  summarize:
    if: always()
    needs: year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: research-ml-discovery-odds-v2-20*
          path: years
          merge-multiple: true
      - name: Verify six year files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('years').glob('ml-discovery-odds-20*.jsonl'))
          total=sum(sum(1 for line in p.open() if line.strip()) for p in files)
          assert len(files)==6,[p.name for p in files]
          assert total==3451,total
          print(json.dumps({'yearFiles':6,'newOfficialOddsRaces':3451,'reusedOfficialOddsRaces':12773,'syntheticOddsUsed':False,'productionDatabaseWritten':False},ensure_ascii=False))
          PY
      - name: Mark success
        if: ${{ needs.year.result == 'success' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/ml-discovery-odds-v2' -f description='All 3451 remaining strict discovery odds races acquired' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: ${{ needs.year.result != 'success' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/ml-discovery-odds-v2' -f description='Targeted repair required' -f target_url="$STATUS_TARGET_URL" >/dev/null
          exit 1
