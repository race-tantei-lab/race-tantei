name: Ensure automatic final live bets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ensure-auto-final-live.yml"
  schedule:
    # JST race-window watchdog. The actual generator is the isolated Cloudflare
    # primary/backup Workers; this workflow verifies them and self-heals them.
    - cron: "*/10 23 * * 5,6,0"
    - cron: "*/10 0-10 * * 6,0,1"
    - cron: "0 11 * * 6,0,1"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: ensure-auto-final-live
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark watchdog pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/auto-final-watchdog' \
            -f description='Checking current live-deadline Workers and final coverage' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Verify or self-heal isolated live-deadline Workers
        shell: bash
        run: |
          set -euo pipefail

          expected_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('src/live-deadline-entry-v2.ts').read_text(encoding='utf-8')
          m=re.search(r'const\s+DRIVER_VERSION\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit('LIVE_DEADLINE_DRIVER_VERSION_NOT_FOUND')
          print(m.group(1))
          PY
          )

          health_ok() {
            local url body
            for url in \
              'https://race-tantei-live-deadline.race-tantei.workers.dev/health' \
              'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
              body=$(curl --max-time 15 --retry 2 --retry-delay 2 --fail-with-body -sS "$url") || return 1
              BODY="$body" EXPECTED_VERSION="$expected_version" node - <<'NODE' || return 1
          const b=JSON.parse(process.env.BODY||'{}');
          if(b.status!=='up'||b.service!=='race-tantei-live-deadline'||b.version!==process.env.EXPECTED_VERSION) process.exit(1);
          NODE
            done
          }

          heartbeat_ok() {
            local today state
            today=$(TZ=Asia/Tokyo date +%F)
            state=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
              "SELECT updated_at AS updatedAt,unixepoch('now')-unixepoch(updated_at) AS ageSeconds,json_extract(state_value,'$.status') AS status,json_extract(state_value,'$.ok') AS ok,json_extract(state_value,'$.completedAt') AS completedAt FROM rt_system_state WHERE state_key='live_deadline_priority_guard_success:${today}' LIMIT 1") || return 1
            STATE_JSON="$state" node - <<'NODE'
          const p=JSON.parse(process.env.STATE_JSON||'[]');
          const r=p?.[0]?.results?.[0];
          const age=Number(r?.ageSeconds);
          if(!r || r.status!=='completed' || Number(r.ok)!==1 || !r.completedAt || !Number.isFinite(age) || age < -30 || age > 240) process.exit(1);
          console.log(JSON.stringify({heartbeat:'fresh',ageSeconds:age,updatedAt:r.updatedAt}));
          NODE
          }

          if health_ok && heartbeat_ok; then
            echo "LIVE_DEADLINE_WATCHDOG_HEALTHY"
          else
            echo "LIVE_DEADLINE_WATCHDOG_REPAIRING"
            npx wrangler deploy --config wrangler.live-deadline.jsonc
            npx wrangler deploy --config wrangler.live-deadline-backup.jsonc

            repaired=0
            for i in $(seq 1 12); do
              sleep 10
              if health_ok && heartbeat_ok; then
                repaired=1
                break
              fi
              echo "waiting for fresh Worker cron heartbeat attempt=$i"
            done
            if [ "$repaired" -ne 1 ]; then
              today=$(TZ=Asia/Tokyo date +%F)
              echo "LIVE_DEADLINE_SELF_HEAL_FAILED date=$today"
              npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
                "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('live_deadline_priority_guard_success:${today}','live_deadline_driver:${today}','final_daily_selection:${today}') ORDER BY state_key" || true
              exit 1
            fi
            echo "LIVE_DEADLINE_SELF_HEAL_SUCCEEDED"
          fi

      - name: Verify due selected races have all six final bet rows
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}'), q AS (SELECT r.race_id AS raceId,(julianday(r.start_time_utc)-julianday('now'))*1440.0 AS minutesToStart,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows FROM rt_races r JOIN selected x ON x.raceId=r.race_id) SELECT raceId,ROUND(minutesToStart,2) AS minutesToStart,finalRows FROM q WHERE minutesToStart <= 15 ORDER BY minutesToStart")
          echo "$rows"
          ROWS="$rows" node - <<'NODE'
          const p=JSON.parse(process.env.ROWS||'[]');
          const rows=p?.[0]?.results||[];
          const bad=rows.filter(r=>Number(r.finalRows)!==6);
          if(bad.length) throw new Error(`DUE_SELECTED_FINAL_ROWS_INVALID:${JSON.stringify(bad)}`);
          console.log(JSON.stringify({dueSelectedFinalCoverage:'ok',checked:rows.length}));
          NODE

      - name: Mark watchdog success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/auto-final-watchdog' \
            -f description='Workers healthy; current due selected races have six final rows' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark watchdog failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/auto-final-watchdog' \
            -f description='Automatic final live bet watchdog failed; inspect run' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
