name: Ensure automatic final live bets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ensure-auto-final-live.yml"
  schedule:
    # Watchdog runs five minutes after the primary :07/:17/... cadence.
    # The first active UTC hour starts at :12 so it does not pre-empt the day's first :07 primary run.
    - cron: "12-52/10 23 * * 5,6,0"
    - cron: "2-52/10 0-10 * * 6,0,1"
    - cron: "2 11 * * 6,0,1"

permissions:
  contents: read
  actions: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ensure recent automatic live-lock run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          now="$(date -u +%s)"
          payload="$(gh api "repos/${repo}/actions/workflows/auto-final-live-bets.yml/runs?per_page=10")"
          status="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch")][0].status // "none"')"
          conclusion="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch")][0].conclusion // "none"')"
          updated="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch")][0].updated_at // ""')"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
            echo "AUTO_FINAL_RECENT_RUN_ACTIVE status=$status updated=$updated"
            exit 0
          fi
          age=999999
          if [ -n "$updated" ]; then
            ts="$(date -u -d "$updated" +%s)"
            age=$((now-ts))
          fi
          if [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$age" -le 720 ]; then
            echo "AUTO_FINAL_RECENT_RUN_OK age_seconds=$age status=$status conclusion=$conclusion updated=$updated"
            exit 0
          fi
          echo "AUTO_FINAL_STALE_OR_FAILED_DISPATCH age_seconds=$age status=$status conclusion=$conclusion updated=$updated"
          gh workflow run auto-final-live-bets.yml -R "$repo" --ref main
