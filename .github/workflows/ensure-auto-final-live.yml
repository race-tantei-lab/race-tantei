name: Ensure automatic final live bets

on:
  workflow_dispatch:
  schedule:
    # Staggered watchdog: if the primary live-lock workflow has not run recently, dispatch it.
    - cron: "7-57/10 23 * * 5,6,0"
    - cron: "7-57/10 0-10 * * 6,0,1"

permissions:
  contents: read
  actions: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ensure recent automatic live-lock run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          now="$(date -u +%s)"
          payload="$(gh api "repos/${repo}/actions/workflows/auto-final-live-bets.yml/runs?per_page=10")"
          status="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch")][0].status // "none"')"
          updated="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch")][0].updated_at // ""')"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
            echo "AUTO_FINAL_RECENT_RUN_ACTIVE status=$status updated=$updated"
            exit 0
          fi
          age=999999
          if [ -n "$updated" ]; then
            ts="$(date -u -d "$updated" +%s)"
            age=$((now-ts))
          fi
          if [ "$age" -le 720 ]; then
            echo "AUTO_FINAL_RECENT_RUN_OK age_seconds=$age status=$status updated=$updated"
            exit 0
          fi
          echo "AUTO_FINAL_STALE_DISPATCH age_seconds=$age status=$status updated=$updated"
          gh workflow run auto-final-live-bets.yml --ref main
