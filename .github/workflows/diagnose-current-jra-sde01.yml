name: Diagnose current JRA sde01 pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-current-jra-sde01.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect same-race sde01 pages
        run: |
          python - <<'PY'
          import datetime as dt,html as htmlmod,importlib.util,json,pathlib,re,sys,urllib.parse,urllib.request
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('d',p);m=importlib.util.module_from_spec(s);sys.modules['d']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          rows=m.d1_query('''SELECT DISTINCT r.race_id AS raceId,r.entry_url AS entryUrl
                              FROM rt_races r JOIN rt_public_bets b ON b.race_id=r.race_id
                              WHERE r.race_date=? AND r.status='finished' ORDER BY r.start_time_utc''',[date])
          def cname(url):
              return (urllib.parse.parse_qs(urllib.parse.urlsplit(url).query).get('CNAME') or [''])[0]
          for row in rows:
              entry=str(row['entryUrl'])
              req=urllib.request.Request(entry,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja-JP,ja;q=0.9','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  raw=resp.read(4_000_000); ctype=resp.headers.get('content-type',''); final=resp.geturl()
              text=m.decode_body(raw,ctype)
              links=[]
              for x in re.findall(r'href=["\']([^"\']*accessS\.html[^"\']*)["\']',text,re.I):
                  try:
                      href=urllib.parse.urljoin(final,htmlmod.unescape(x)); cn=cname(href)
                      if 'sde01' in cn and date.replace('-','') in cn:
                          links.append(href)
                  except Exception: pass
              if not links:
                  print('SDE01_MISSING='+json.dumps({'raceId':row['raceId'],'entry':entry},ensure_ascii=False)); continue
              url=links[0]
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja-JP,ja;q=0.9','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  body=resp.read(4_000_000); ctype2=resp.headers.get('content-type',''); final2=resp.geturl(); status=resp.status
              text2=m.decode_body(body,ctype2)
              plain=htmlmod.unescape(re.sub(r'<[^>]+>',' ',text2)); plain=re.sub(r'\s+',' ',plain)
              outlinks=[]
              for x in re.findall(r'href=["\']([^"\']*accessS\.html[^"\']*)["\']',text2,re.I):
                  try:
                      href=urllib.parse.urljoin(final2,htmlmod.unescape(x)); outlinks.append({'url':href,'cname':cname(href)})
                  except Exception: pass
              markers={k:(k in plain) for k in ['着順','払戻金','単勝','複勝','ワイド','馬連','馬単','3連複','3連単']}
              print('SDE01_PAGE='+json.dumps({'raceId':row['raceId'],'url':url,'final':final2,'status':status,'contentType':ctype2,'bytes':len(body),'cname':cname(final2),'markers':markers,'plainHead':plain[:2500],'accessSLinks':outlinks[:80]},ensure_ascii=False))
          PY
