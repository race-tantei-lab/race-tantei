name: Replay storage audit
on:
  push:
    branches:
      - diag/replay-schema-20260923
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Inspect replay storage
        shell: bash
        run: |
          set -euo pipefail
          q(){ npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$1"; }
          echo '=== TABLES ==='
          q "SELECT name,sql FROM sqlite_master WHERE type='table' AND (lower(name) LIKE '%odd%' OR lower(name) LIKE '%preview%' OR lower(name) LIKE '%archive%' OR lower(name) LIKE '%snapshot%' OR lower(name) LIKE '%history%' OR lower(name) LIKE '%state%') ORDER BY name"
          echo '=== STATE KEYS ==='
          q "SELECT state_key AS stateKey,updated_at AS updatedAt,length(state_value) AS bytes FROM rt_system_state WHERE (state_key LIKE 'worker_live_preview:%' OR state_key LIKE 'worker_live_final:%') AND (state_key LIKE '%2026-09-20-%' OR state_key LIKE '%2026-09-21-%' OR state_key LIKE '%2026-09-22-%') ORDER BY state_key"
          echo '=== ARCHIVE COUNTS ==='
          q "SELECT race_id AS raceId,COUNT(*) AS n,MIN(created_at) AS firstAt,MAX(created_at) AS lastAt,MIN(length(envelope_json)) AS minBytes,MAX(length(envelope_json)) AS maxBytes FROM rt_live_preview_archive WHERE race_id LIKE '2026-09-20-%' OR race_id LIKE '2026-09-21-%' OR race_id LIKE '2026-09-22-%' GROUP BY race_id ORDER BY race_id"
