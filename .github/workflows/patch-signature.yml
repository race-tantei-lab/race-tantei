name: Patch live page signatures

on:
  push:
    branches: [complete-live-v2]
    paths:
      - '.github/workflows/patch-signature.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-live-v2
      - name: Patch signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/v1/jra.ts')
          s = p.read_text()
          old = '''export function pageLooksLikeEntry(html: string): boolean {
            const lines = htmlToLines(html);
            const text = lines.join(" ");
            return /出馬表/.test(text) && /馬名/.test(text) && /騎手名/.test(text) && /(?:コース|発走時刻)/.test(text);
          }

          export function pageLooksLikeResult(html: string): boolean {
            const lines = htmlToLines(html);
            const text = lines.join(" ");
            return /レース結果/.test(text) && /着順/.test(text) && /払戻金/.test(text);
          }'''
          new = '''export function pageLooksLikeEntry(html: string): boolean {
            const text = htmlToLines(html).join(" ");
            return /出馬表/.test(text) && /20\\d{2}年/.test(text) && /(?:札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉)/.test(text) && /<table\\b/i.test(html);
          }

          export function pageLooksLikeResult(html: string): boolean {
            const text = htmlToLines(html).join(" ");
            return /レース結果/.test(text) && /20\\d{2}年/.test(text) && /<table\\b/i.test(html);
          }'''
          if old not in s:
              raise SystemExit('signature anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/patch-signature.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate live JRA pages by stable structure"
          git push origin HEAD:complete-live-v2
