name: Replay 2026 Aug-Nov REAL on-time D1 cash for newly learned v16 betting methods
on:
  push:
    branches: [research/20261115-aug-nov-v16-live-cash-v17]
    paths:
      - scripts/replay-v16-aug-nov-real-live-bets-v17.py
      - .github/workflows/replay-v16-aug-nov-live-cash-v17.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric live cash replay runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Test 15-minute timestamps and true paid-yen scaling
        run: |
          python -m py_compile scripts/replay-v16-aug-nov-real-live-bets-v17.py
          python scripts/replay-v16-aug-nov-real-live-bets-v17.py --self-test
      - name: Read-only replay LIVE Aug15-Nov14 using true past cash and actual locked bets
        run: |
          python -u scripts/replay-v16-aug-nov-real-live-bets-v17.py \
            --out /tmp/v16-aug-nov-real-live-cash-v17.json
      - name: Preserve exact recorded 2026 ROI of each selected research method
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: august-november-original-baseline-vs-v16-new-method-live-cash
          path: /tmp/v16-aug-nov-real-live-cash-v17.json
          if-no-files-found: warn
          retention-days: 30
