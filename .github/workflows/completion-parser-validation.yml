name: Completion parser validation

on:
  push:
    branches: [analysis/completion-search-20260807]
    paths:
      - ".github/workflows/completion-parser-validation.yml"
      - "scripts/validate-jra-historical-combination-parser.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c6d1826b573b2e68cb13ec37e9e8ade' }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '949b5e8b-d1a4-4c4e-80d1-d031afdc03de' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-jra-historical-combination-parser.py
      - uses: actions/upload-artifact@v4
        with:
          name: completion-parser-validation
          path: analysis-results/jra-historical-combination-parser-validation.json
          retention-days: 1
