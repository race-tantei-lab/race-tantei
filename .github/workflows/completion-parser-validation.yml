name: Completion parser validation

on:
  push:
    branches: [analysis/completion-search-20260807]
    paths:
      - ".github/workflows/completion-parser-validation.yml"
      - "scripts/run-completion-parser-validation.py"
      - "scripts/validate-jra-historical-combination-parser.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c6d1826b573b2e68cb13ec37e9e8ade' }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '949b5e8b-d1a4-4c4e-80d1-d031afdc03de' }}
    steps:
      - name: Publish pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/completion-parser-validation' -f description='Validating historical JRA odds matrices' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/run-completion-parser-validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-parser-validation
          path: analysis-results/jra-historical-combination-parser-validation.json
          retention-days: 1
      - name: Assert full validation
        run: python -c "import json; r=json.load(open('analysis-results/jra-historical-combination-parser-validation.json',encoding='utf-8')); assert r.get('allMatrixBetTypesValidated') is True, r"
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/completion-parser-validation' -f description='Historical JRA odds matrices fully validated' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/completion-parser-validation' -f description='Historical JRA odds matrix validation failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
