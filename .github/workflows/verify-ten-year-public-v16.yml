name: Verify ten-year public v17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ten-year-public-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://race-tantei-phase0.race-tantei.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify historical day result labels
        id: day
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 4 --retry-delay 2 -o day.json -w '%{http_code}' "$BASE_URL/api/public/day?date=2016-08-13")
          echo "day_http=$code bytes=$(wc -c < day.json)"
          test "$code" = "200"
          rid=$(python - <<'PY'
          import json
          x=json.load(open('day.json'))
          rows=x.get('races',[])
          assert x.get('ok') is True and rows
          labels=[r['publicState']['label'] for r in rows]
          assert '買い目あり' not in labels, labels
          assert set(labels) <= {'的中','不的中','見送り'}, set(labels)
          assert any(v in ('的中','不的中') for v in labels), labels
          selected=next(r for r in rows if r['publicState']['label'] in ('的中','不的中'))
          print(selected['raceId'])
          PY
          )
          echo "rid=$rid" >> "$GITHUB_OUTPUT"

      - name: Verify historical runner details
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ steps.day.outputs.rid }}'
          code=$(curl -sS --retry 4 --retry-delay 2 -o race.html -w '%{http_code}' "$BASE_URL/races/$rid")
          echo "race_http=$code raceId=$rid bytes=$(wc -c < race.html)"
          test "$code" = "200"
          grep -Eq '的中|不的中' race.html
          grep -q '出走馬・結果' race.html
          grep -q '着順' race.html
          grep -q '騎手' race.html
          grep -q '調教師' race.html
          grep -vq '馬情報を取得できませんでした' race.html
          echo "TEN_YEAR_PUBLIC_V17_OK raceId=$rid"
