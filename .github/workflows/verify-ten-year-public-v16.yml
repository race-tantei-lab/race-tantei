name: Verify ten-year public v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ten-year-public-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://race-tantei-phase0.race-tantei.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production home
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 4 --retry-delay 2 -o home.html -w '%{http_code}' "$BASE_URL/")
          echo "home_http=$code bytes=$(wc -c < home.html)"
          test "$code" = "200"
          grep -q '431.7%' home.html
          grep -q '2016-08-10' home.html

      - name: Verify ten-year calendar API
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 4 --retry-delay 2 -o calendar.json -w '%{http_code}' "$BASE_URL/api/public/calendar")
          echo "calendar_http=$code bytes=$(wc -c < calendar.json)"
          test "$code" = "200"
          python - <<'PY'
          import json
          x=json.load(open('calendar.json'))
          rows=x.get('calendar',[])
          assert any(r.get('raceDate','').startswith('2016-') for r in rows), '2016 calendar missing'
          assert any(r.get('raceDate','').startswith('2026-') for r in rows), '2026 calendar missing'
          print('calendar_rows',len(rows))
          PY

      - name: Verify 2016 day API
        id: day
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 4 --retry-delay 2 -o day.json -w '%{http_code}' "$BASE_URL/api/public/day?date=2016-08-10")
          echo "day_http=$code bytes=$(wc -c < day.json)"
          test "$code" = "200"
          rid=$(python - <<'PY'
          import json
          x=json.load(open('day.json'))
          assert x.get('ok') is True
          rows=x.get('races',[])
          assert rows, '2016-08-10 races missing'
          assert all('publicState' in r for r in rows)
          print(rows[0]['raceId'])
          PY
          )
          echo "rid=$rid" >> "$GITHUB_OUTPUT"

      - name: Verify historical race page
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ steps.day.outputs.rid }}'
          code=$(curl -sS --retry 4 --retry-delay 2 -o race.html -w '%{http_code}' "$BASE_URL/races/$rid")
          echo "race_http=$code raceId=$rid bytes=$(wc -c < race.html)"
          test "$code" = "200"
          grep -Eq '確定買い目|見送り' race.html
          echo "TEN_YEAR_PUBLIC_V16_OK raceId=$rid"
