name: Audit production live state

on:
  pull_request:
    paths:
      - '.github/workflows/audit-production-live.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
        run: |
          set -euo pipefail
          q(){ npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$1"; }
          echo '=== AUG9_RACES ==='
          q "SELECT race_id,venue,race_no,race_name,status,start_time_jst FROM rt_races WHERE race_date='2026-08-09' ORDER BY venue,race_no"
          echo '=== AUG9_PREDICTIONS ==='
          q "SELECT p.id,p.race_id,p.status,p.created_at,p.locked_at FROM rt_predictions p JOIN rt_races r ON r.race_id=p.race_id WHERE r.race_date='2026-08-09' ORDER BY p.race_id,p.id" || true
          echo '=== AUG9_BETS ==='
          q "SELECT b.race_id,b.bet_type,b.combination,b.stake_yen,b.assumed_odds,b.return_yen,b.settlement_status,p.status AS prediction_status,p.locked_at FROM rt_bets b JOIN rt_predictions p ON p.id=b.prediction_id JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-08-09' ORDER BY b.race_id,b.id" || true
          echo '=== AUG9_PUBLIC_BETS ==='
          q "SELECT race_id,course,bet_type,combination,stake_yen,assumed_odds,return_yen,settlement_status,locked_at FROM rt_public_bets WHERE race_id LIKE '2026-08-09-%' ORDER BY race_id,course,id" || true
          echo '=== AUG9_OFFICIAL_ODDS ==='
          q "SELECT bet_type,COUNT(DISTINCT race_id) AS races,COUNT(*) AS rows,MIN(captured_at_utc) AS first_seen,MAX(captured_at_utc) AS latest FROM rt_official_odds_snapshots WHERE race_id LIKE '2026-08-09-%' GROUP BY bet_type ORDER BY bet_type" || true
