name: Audit production live state

on:
  pull_request:
    paths:
      - '.github/workflows/audit-production-live.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
        run: |
          set -euo pipefail
          q(){ npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$1"; }
          echo '=== RAW_RACE_ARCHIVE ==='
          q "SELECT COUNT(*) AS races,MIN(race_date) AS min_date,MAX(race_date) AS max_date,COUNT(DISTINCT race_date||'|'||venue) AS venue_days FROM rt_races WHERE race_date BETWEEN '2024-05-04' AND '2026-08-02'"
          echo '=== RAW_RUNNERS ==='
          q "SELECT COUNT(*) AS runners,COUNT(DISTINCT r.race_id) AS races FROM rt_runners rr JOIN rt_races r ON r.race_id=rr.race_id WHERE r.race_date BETWEEN '2024-05-04' AND '2026-08-02'"
          echo '=== RAW_RESULTS ==='
          q "SELECT COUNT(*) AS results,COUNT(DISTINCT r.race_id) AS races FROM rt_results x JOIN rt_races r ON r.race_id=x.race_id WHERE r.race_date BETWEEN '2024-05-04' AND '2026-08-02'"
          echo '=== TABLES_ODDS_PAYOUTS ==='
          q "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%odds%' OR name LIKE '%payout%') ORDER BY name"
          echo '=== HIST_OFFICIAL_LATEST ==='
          q "SELECT COUNT(*) AS rows,COUNT(DISTINCT race_id) AS races,MIN(substr(race_id,1,10)) AS min_date,MAX(substr(race_id,1,10)) AS max_date FROM rt_official_odds_latest WHERE substr(race_id,1,10) BETWEEN '2024-05-04' AND '2026-08-02'" || true
          echo '=== PUBLIC_BETS ==='
          q "SELECT course,COUNT(DISTINCT race_id) AS races,COUNT(*) AS tickets,SUM(stake_yen) AS stake,SUM(COALESCE(return_yen,0)) AS return_yen FROM rt_public_bets WHERE settlement_status='settled' GROUP BY course ORDER BY CASE course WHEN 'ライト' THEN 1 WHEN 'スタンダード' THEN 2 ELSE 3 END"
          echo '=== AUG9_RACES_RUNNERS_BETS ==='
          q "SELECT venue,COUNT(*) AS races FROM rt_races WHERE race_date='2026-08-09' GROUP BY venue ORDER BY venue"
          q "SELECT r.venue,COUNT(rr.horse_no) AS runners,COUNT(DISTINCT r.race_id) AS races FROM rt_races r JOIN rt_runners rr ON rr.race_id=r.race_id WHERE r.race_date='2026-08-09' GROUP BY r.venue ORDER BY r.venue"
          q "SELECT COUNT(*) AS bets,COUNT(DISTINCT b.race_id) AS races FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-08-09'"
          echo '=== AUG9_OFFICIAL_ODDS ==='
          q "SELECT bet_type,COUNT(DISTINCT race_id) AS races,COUNT(*) AS rows,MAX(captured_at_utc) AS latest FROM rt_official_odds_latest WHERE race_id LIKE '2026-08-09-%' GROUP BY bet_type ORDER BY bet_type" || true
