name: Walk-forward free runner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: walk-forward-free-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Start local Worker with remote D1
        run: |
          nohup npx wrangler dev \
            --config wrangler.learning.jsonc \
            --test-scheduled \
            --port 8787 \
            --log-level warn \
            > /tmp/race-tantei-learning.log 2>&1 &
          echo $! > /tmp/race-tantei-learning.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/race-tantei-learning.log
          exit 1

      - name: Run learning pipeline for up to 48 minutes
        run: |
          started_at=$(date +%s)
          deadline=$((started_at + 2880))
          iteration=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            iteration=$((iteration + 1))
            echo "scheduled iteration=${iteration}"

            if ! curl \
              --silent \
              --show-error \
              --fail \
              --max-time 120 \
              "http://127.0.0.1:8787/__scheduled?cron=*+*+*+*+*"; then
              echo "Scheduled iteration failed; printing runner log"
              tail -n 200 /tmp/race-tantei-learning.log || true
              exit 1
            fi

            echo
            sleep 1
          done

      - name: Print runner log
        if: always()
        run: tail -n 300 /tmp/race-tantei-learning.log || true
