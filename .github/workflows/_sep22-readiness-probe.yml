name: Sep22 substitute readiness probe

on:
  push:
    branches:
      - fix/cancelled-race-active-count-verifiers
    paths:
      - ".github/workflows/_sep22-readiness-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Probe Sep22 gate and D1
        shell: bash
        run: |
          set -euo pipefail
          npx tsx -e "import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts'; (async()=>{const r=await shouldRunOnJraRaceDay(new Date('2026-09-22T03:00:00Z')); console.log('SEP22_GATE',JSON.stringify(r)); if(!r.shouldRun) process.exit(2);})().catch(e=>{console.error(e);process.exit(1)})"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH p AS (
              SELECT r.race_date AS raceDate,r.venue,r.race_id AS raceId,r.race_no AS raceNo,
                     r.start_time_utc AS startTimeUtc,r.status,
                     CASE WHEN LENGTH(TRIM(COALESCE(r.entry_url,'')))>0 THEN 1 ELSE 0 END AS hasEntryUrl,
                     SUM(CASE WHEN rr.race_id IS NOT NULL AND COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS active
              FROM rt_races r
              LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
              WHERE r.race_date='2026-09-22'
              GROUP BY r.race_date,r.venue,r.race_id,r.race_no,r.start_time_utc,r.status,r.entry_url
            )
            SELECT venue,COUNT(*) AS races,
                   SUM(CASE WHEN startTimeUtc IS NOT NULL THEN 1 ELSE 0 END) AS withStart,
                   SUM(CASE WHEN hasEntryUrl=1 THEN 1 ELSE 0 END) AS withEntryUrl,
                   SUM(CASE WHEN active>=3 THEN 1 ELSE 0 END) AS entryReady,
                   MIN(active) AS minActive,
                   MIN(raceNo) AS minRaceNo,MAX(raceNo) AS maxRaceNo
            FROM p GROUP BY venue ORDER BY venue
          "
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS stateValue
            FROM rt_system_state
            WHERE state_key IN (
              'worker_upcoming_calendar_repair',
              'worker_upcoming_entry_repair',
              'worker_upcoming_entry_derived_repair',
              'worker_upcoming_calendar_day:2026-09-22',
              'final_daily_selection:2026-09-22'
            )
            ORDER BY state_key
          "
      - name: Dry run Sep22 selection if card exists
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-ten-year-preday-selection.py --date 2026-09-22 --out /tmp/sep22-selection.json
          python3 - <<'PY'
          import collections,json
          p=json.load(open('/tmp/sep22-selection.json'))
          selected=p.get('selected') or []
          by=collections.Counter(str(r.get('venue') or '') for r in selected)
          print('SEP22_SELECTION',json.dumps({
            'sourceModel':p.get('sourceModel'),
            'resultDataUsedForTargetDay':p.get('resultDataUsedForTargetDay'),
            'selected':len(selected),
            'venues':dict(by),
            'raceIds':[r.get('raceId') for r in selected],
          },ensure_ascii=False))
          assert p.get('sourceModel')=='ten-year-completed-model'
          assert p.get('resultDataUsedForTargetDay') is False
          assert len(by)>=1 and all(v==5 for v in by.values())
          assert len(selected)==5*len(by)
          PY
