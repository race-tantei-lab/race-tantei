name: Automatic final live bets

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule cron is UTC. These two windows equal 08:00-19:55 JST
    # on Saturday/Sunday/Monday.
    - cron: "*/5 23 * * 5,6,0"
    - cron: "*/5 0-10 * * 6,0,1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-final-live-bets.yml"
      - "scripts/run-stored-preview-deadline-backup.py"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/public-site-entry-v29.ts"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile stored-preview backup
        run: python -m py_compile scripts/run-stored-preview-deadline-backup.py

      - name: Finalize due races from stored preview only
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-stored-preview-deadline-backup.py 2>&1 | tee automatic-final-live.log
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('analysis-results/critical-auto-bet-generation.json')
          if not p.exists():
              raise SystemExit('STORED_PREVIEW_BACKUP_AUDIT_MISSING')
          data=json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode')!='stored_preview_only':
              raise SystemExit(f"BACKUP_MODE_INVALID:{data.get('mode')}")
          if data.get('generatedRaceIds'):
              raise SystemExit(f"POST_DEADLINE_GENERATION_FORBIDDEN:{data.get('generatedRaceIds')}")
          urgent=list(data.get('urgentMissingRaceIds') or [])
          failures=list(data.get('failures') or [])
          if urgent or failures:
              raise SystemExit(f"LIVE_BACKUP_CURRENT_DUE_INCOMPLETE urgent={urgent} failures={failures}")
          print(json.dumps({
              'status':'stored_preview_backup_due_complete',
              'dueRaceIds':data.get('dueRaceIds') or [],
              'selfHealedRaceIds':data.get('selfHealedRaceIds') or [],
              'alreadyFinalRaceIds':data.get('alreadyFinalRaceIds') or [],
              'remainingFutureRaceIds':data.get('remainingFutureRaceIds') or [],
          }, ensure_ascii=False))
          PY

      - name: Upload automatic live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-final-live-audit-${{ github.run_id }}
          path: |
            analysis-results/critical-auto-bet-generation.json
            automatic-final-live.log
          if-no-files-found: warn
          retention-days: 30

      - name: Mark automatic live lock success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/auto-final-live' \
            -f description='独立バックアップ: 保存済み予測のみで締切対象を確定' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark automatic live lock failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/auto-final-live' \
            -f description='独立バックアップ: 締切対象に保存済み予測不足または未確定あり' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
