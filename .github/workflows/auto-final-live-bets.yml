name: Automatic final live bets

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule cron is UTC. These two windows equal 08:00-19:55 JST
    # on Saturday/Sunday/Monday.
    - cron: "*/5 23 * * 5,6,0"
    - cron: "*/5 0-10 * * 6,0,1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-final-live-bets.yml"
      - "scripts/run-stored-preview-deadline-backup.py"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/public-site-entry-v29.ts"
      - "src/public-site-entry-v34.ts"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drive pre-deadline official live tick
        id: live_tick
        shell: bash
        run: |
          set -euo pipefail
          url='https://race-tantei-phase0.race-tantei.workers.dev/_ops/live-tick'
          rm -f /tmp/live-tick-h /tmp/live-tick-b
          code=$(curl --max-time 120 -sS -D /tmp/live-tick-h -o /tmp/live-tick-b -w '%{http_code}' -X POST "$url" || true)
          body=$(cat /tmp/live-tick-b 2>/dev/null || true)
          version=$(tr -d '\r' </tmp/live-tick-h 2>/dev/null | awk -F': ' 'tolower($1)=="x-race-ui-version"{print $2}' | tail -1)
          echo "LIVE_TICK code=$code version=$version body=$body"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          # Historical misses keep status=deadline_breach even when this invocation
          # successfully refreshes/locks the current future race. Accept that state;
          # true current unresolved/error responses remain hard failures.
          if [ "$code" = "503" ] && echo "$body" | grep -q '"status":"deadline_breach"'; then
            echo 'LIVE_TICK_EXECUTED_WITH_HISTORICAL_BREACH'
            exit 0
          fi
          echo 'PRE_DEADLINE_LIVE_TICK_FAILED' >&2
          exit 1

      - name: Compile stored-preview backup
        if: always()
        run: python -m py_compile scripts/run-stored-preview-deadline-backup.py

      - name: Finalize due races from stored preview only
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-stored-preview-deadline-backup.py 2>&1 | tee automatic-final-live.log
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('analysis-results/critical-auto-bet-generation.json')
          if not p.exists():
              raise SystemExit('STORED_PREVIEW_BACKUP_AUDIT_MISSING')
          data=json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode')!='stored_preview_only':
              raise SystemExit(f"BACKUP_MODE_INVALID:{data.get('mode')}")
          if data.get('generatedRaceIds'):
              raise SystemExit(f"POST_DEADLINE_GENERATION_FORBIDDEN:{data.get('generatedRaceIds')}")
          urgent=list(data.get('urgentMissingRaceIds') or [])
          failures=list(data.get('failures') or [])
          if urgent or failures:
              raise SystemExit(f"LIVE_BACKUP_CURRENT_DUE_INCOMPLETE urgent={urgent} failures={failures}")
          print(json.dumps({
              'status':'stored_preview_backup_due_complete',
              'dueRaceIds':data.get('dueRaceIds') or [],
              'selfHealedRaceIds':data.get('selfHealedRaceIds') or [],
              'alreadyFinalRaceIds':data.get('alreadyFinalRaceIds') or [],
              'remainingFutureRaceIds':data.get('remainingFutureRaceIds') or [],
          }, ensure_ascii=False))
          PY

      - name: Upload automatic live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-final-live-audit-${{ github.run_id }}
          path: |
            analysis-results/critical-auto-bet-generation.json
            automatic-final-live.log
          if-no-files-found: warn
          retention-days: 30

      - name: Mark automatic live lock success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/auto-final-live' \
            -f description='独立バックアップ: 締切前ライブ駆動 + 保存済み予測で締切確定' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark automatic live lock failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/auto-final-live' \
            -f description='独立バックアップ: ライブ駆動失敗または締切対象未確定あり' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
