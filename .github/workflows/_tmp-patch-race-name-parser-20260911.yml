name: Temporary patch race-name parser 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/_tmp-patch-race-name-parser-20260911.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch parser safety
        env:
          REPLACEMENT_B64: ZnVuY3Rpb24gaXNJbnZhbGlkUmFjZU5hbWUodmFsdWU6IHN0cmluZyk6IGJvb2xlYW4gewogIGNvbnN0IHRleHQgPSB2YWx1ZS5yZXBsYWNlKC9ccysvZywgIiAiKS50cmltKCk7CiAgaWYgKCF0ZXh0KSByZXR1cm4gdHJ1ZTsKICBpZiAoL14oPzrmpJzntKIoPzrjgqbjgqPjg7Pjg4njgqZ8窓kP3xメニューを開く|JRAホーム|レース情報トップ|出馬表|レース|レース結果|払戻金|関連メニュー|コースレコード|勝馬の紹介
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('src/v1/jra.ts')
          s = p.read_text()
          start = s.index('function parseRaceName(html: string, raceNo: number): string {')
          end = s.index('\n\nfunction parseHeader(', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Verify parser guard
        run: |
          grep -n "isInvalidRaceName" src/v1/jra.ts
          grep -n "検索" src/v1/jra.ts
          npm run check --if-present
      - name: Commit parser patch
        run: |
          if git diff --quiet -- src/v1/jra.ts; then
            echo 'No parser diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/jra.ts
          git commit -m 'fix: reject JRA search UI text as race names'
          git push origin HEAD:${{ github.ref_name }}
