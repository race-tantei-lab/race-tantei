name: Deploy 9/6 entry recovery now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-entry-recovery-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck recovery worker
        run: npm run build:test
      - name: Deploy recovery worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify recovery endpoint exists
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --max-time 10 -sS -o /tmp/body -w '%{http_code}' 'https://race-tantei-phase0.race-tantei.workers.dev/_ops/entry-seed-sync-20260906-7f4c9d2a')
          test "$code" = 404
          echo RECOVERY_WORKER_DEPLOYED
