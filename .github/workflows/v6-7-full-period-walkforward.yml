name: V6.7 full-period walk-forward analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v6-7-full-period-walkforward.yml"
      - "scripts/analyze-v6-full-period-walkforward.py"
      - "scripts/analyze-v6-rolling-oos.py"
      - "scripts/analyze-v6-course-policy.py"
      - "scripts/analyze-v6-shadow.py"
      - "scripts/train-nonlinear-market-blend-v4.py"

concurrency:
  group: v6-7-full-period-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Compile analysis
        run: python -m py_compile scripts/analyze-v6-full-period-walkforward.py

      - name: Run full-period analysis
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-v6-full-period-walkforward.py 2>&1 | tee v6-7-full-period-analysis.log

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-7-full-period-analysis
          path: |
            v6-7-full-period-analysis.json
            v6-7-full-period-analysis.log
          if-no-files-found: warn
          retention-days: 30
