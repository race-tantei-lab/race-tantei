name: Completion raw export trigger

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'analysis/completion-search-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export existing D1 categories
        run: python scripts/export-completion-raw-categories.py
      - name: Save run pointer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('artifacts/completion-raw-run.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({'runId': int(os.environ['GITHUB_RUN_ID'])}) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: completion-raw-categories
          path: |
            artifacts/completion-raw-categories.pkl.gz
            artifacts/completion-raw-categories-meta.json
          compression-level: 0
          retention-days: 1
      - name: Commit pointer and metadata to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/completion-raw-categories-meta.json artifacts/completion-raw-run.json
          git commit -m "Save completion raw export pointer" || exit 0
          git push origin HEAD:analysis/completion-search-20260807
