name: Verify Worker Live Lock Cron

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-worker-live-lock-cron.yml"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/race-day-gate.ts"
      - "src/public-site-entry-v20.ts"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify race-day gate stays before D1
        run: python3 scripts/verify-race-day-gate.py
      - name: Resolve JRA race-day gate for cron verifier
        id: race_day
        shell: bash
        run: |
          set -euo pipefail
          gate=$(npx --yes tsx -e "import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts'; (async()=>{const r=await shouldRunOnJraRaceDay(new Date()); console.log(JSON.stringify(r));})().catch(e=>{console.error(e);process.exit(1)})")
          echo "$gate"
          should_run=$(GATE="$gate" node -e 'const g=JSON.parse(process.env.GATE||"{}"); process.stdout.write(g.shouldRun ? "true" : "false")')
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
      - name: Confirm non-race day skips D1 cron audit
        if: steps.race_day.outputs.should_run != 'true'
        run: echo "WORKER_LIVE_LOCK_CRON_SKIP_NON_RACE_DAY"
      - name: Wait for a fresh race-day Worker cron audit
        if: steps.race_day.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          started=$(date -u +%s)
          for i in $(seq 1 36); do
            raw=$(npx wrangler d1 execute race-tantei-phase0 --remote --config wrangler.jsonc --command "SELECT state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key='worker_live_lock:${today}' LIMIT 1" --json 2>/dev/null || true)
            value=$(printf '%s' "$raw" | jq -r '.[0].results[0].value // empty' 2>/dev/null || true)
            updated=$(printf '%s' "$raw" | jq -r '.[0].results[0].updatedAt // empty' 2>/dev/null || true)
            if [ -n "$value" ] && [ -n "$updated" ]; then
              updated_epoch=$(date -u -d "$updated UTC" +%s 2>/dev/null || echo 0)
              if [ "$updated_epoch" -ge "$started" ]; then
                printf '%s' "$value" | jq .
                if printf '%s' "$value" | jq -e '
                  .sourceModel == "ten-year-completed-model" and
                  (.selectedRaceCount == 10 or .selectedRaceCount == 15) and
                  (.selectedRaceCount % 5 == 0) and
                  .status == "ok" and
                  (.completeAfter >= .completeBefore) and
                  (.deadlineBreachRaceIds | length) == 0 and
                  (.alreadyStartedIncompleteRaceIds | length) == 0 and
                  (.previewMissingUrgentRaceIds | length) == 0 and
                  (.bodyWeightBreachRaceIds | length) == 0
                ' >/dev/null; then
                  echo "WORKER_LIVE_LOCK_CRON_OK updatedAt=$updated selectedRaceCount=$(printf '%s' "$value" | jq -r '.selectedRaceCount')"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "No fresh healthy Worker live-lock audit arrived within six minutes" >&2
          exit 1
