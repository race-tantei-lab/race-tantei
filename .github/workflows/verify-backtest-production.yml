name: Verify production backtest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run and inspect August 1 backtest
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 50); do
            echo "Backtest attempt ${attempt}/50"
            html="$(curl --silent --show-error --fail --max-time 45 "${base}/backtest/2026-08-01")"
            echo "$html" >/tmp/backtest.html
            python - <<'PY'
          import re
          html=open('/tmp/backtest.html',encoding='utf-8').read()
          title=re.search(r'<title>(.*?)</title>',html,re.S)
          progress=re.search(r'計算済み<b>(\d+)/(\d+)R</b>',html)
          hits=re.search(r'的中<b>(\d+)R</b>',html)
          money=re.search(r'購入／払戻<b>[^0-9]*([0-9,]+)円\s*/\s*([0-9,]+)円</b>',html)
          roi=re.search(r'回収率<b>([0-9.]+)%</b>',html)
          bad=html.count('検索ウィンドウ')
          print({'title':title.group(1) if title else None,'progress':progress.groups() if progress else None,'hits':hits.group(1) if hits else None,'money':money.groups() if money else None,'roi':roi.group(1) if roi else None,'badRaceNames':bad})
          if not progress: raise SystemExit(1)
          done,total=map(int,progress.groups())
          if total >= 36 and done >= 36 and bad == 0:
              raise SystemExit(0)
          raise SystemExit(2)
          PY
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Backtest production verification passed."
              exit 0
            fi
            sleep 10
          done
          echo "Backtest did not finish all 36 races in time."
          cat /tmp/backtest.html
          exit 1
