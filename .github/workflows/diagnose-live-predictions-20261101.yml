name: Diagnose Nov 1 actual prediction completeness (read only)
on:
  push:
    branches: ["diagnostics/d1-near-cap-20261101"]
    paths: [".github/workflows/diagnose-live-predictions-20261101.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Bounded targeted D1 queries only
        run: |
          python3 - <<'PY'
          import os, json,urllib.request,datetime
          url="https://api.cloudflare.com/client/v4/accounts/3c6d1826b573b2e68cb13ec37e9e8ade/d1/database/949b5e8b-d1a4-4c4e-80d1-d031afdc03de/query"
          def query(sql,args=[]):
            req=urllib.request.Request(url,data=json.dumps({"sql":sql,"params":args}).encode(),headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=25) as f:r=json.load(f)
            if not r.get("success"):print("QUERY_ERROR",r.get("errors"));return []
            d=r["result"][0];print("QUERY_USAGE",d.get("meta",{}).get("rows_read"));return d.get("results") or []
          now=datetime.datetime.now(datetime.timezone.utc)
          print("UTC_NOW",now.isoformat())
          rows=query("SELECT race_id AS id,race_date AS date,venue,race_no AS raceNo,race_name AS name,start_time_utc AS startUtc,status FROM rt_races WHERE race_date=? ORDER BY venue,race_no",["2026-11-01"])
          print("RACE_PROGRAM",json.dumps(rows,ensure_ascii=False)[:18000])
          s=query("SELECT state_key AS key,state_value AS val,updated_at AS updatedAt FROM rt_system_state WHERE state_key IN ('final_daily_selection:2026-11-01','worker_selection:2026-11-01')",[])
          chosen=[]
          for r in s:
            try:
              payload=json.loads(r["val"]);chosen=[x["raceId"] for x in payload.get("selected",[]) if x.get("raceId")] if r["key"].startswith("final_daily_selection") else chosen
              print("SELECTION_STATE",json.dumps({"key":r["key"],"selected":chosen,"venueCounts":payload.get("venueCounts"),"updated":r["updatedAt"],"selectionKeys":list(payload)},ensure_ascii=False))
            except Exception as e:print("SELECTION_PARSE_FAILED",r["key"],str(e)[:80])
          for item in rows:
            if item["id"] in chosen:
              q=query("SELECT course,bet_type AS betType,settlement_status AS settlement,locked_at AS lockedAt,source_prediction_id AS predictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type",[item["id"]])
              v=query("SELECT state_key AS key,updated_at AS updatedAt FROM rt_system_state WHERE state_key IN (?, ?, ?)",["worker_live_preview:"+item["id"],"worker_live_final:"+item["id"],"worker_live_lock:"+item["id"]])
              print("SELECTED_BETS",json.dumps({"race":item["id"],"startUtc":item["startUtc"],"bets":q,"workStates":v},ensure_ascii=False))
          other=query("SELECT race_id AS id,status,requested_at AS requested,attempts,message,start_time_utc AS startUtc,CASE WHEN result_json IS NULL THEN 0 ELSE 1 END AS hasResult FROM rt_adhoc_requests WHERE race_date=? ORDER BY requested_at LIMIT 5",["2026-11-01"])
          print("ADHOC_QUEUE",json.dumps(other,ensure_ascii=False))
          PY
