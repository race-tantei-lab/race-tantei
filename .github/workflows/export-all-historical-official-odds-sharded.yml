name: Export all historical official odds sharded
run-name: Export all historical official odds sharded · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-all-historical-official-odds-sharded.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: export-all-historical-official-odds
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run id
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/all-historical-odds-sharded' -f description='固定7,695レースのJRA公式過去オッズを7分割取得中' -f target_url="$TARGET" >/dev/null

  export:
    needs: register
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0,1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      SHARD_COUNT: 7
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py
      - name: Build full fixed-archive selection shard
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; database=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          shard_count=int(os.environ['SHARD_COUNT']); shard_index=int(os.environ['SHARD_INDEX'])
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          body=json.dumps({'sql':"SELECT race_id raceId FROM rt_races WHERE race_date>=? AND race_date<? AND status='finished' ORDER BY race_date,venue,race_no",'params':['2024-05-04','2026-08-03']}).encode()
          req=urllib.request.Request(endpoint,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as r: payload=json.loads(r.read().decode())
          if not payload.get('success'): raise RuntimeError(payload.get('errors'))
          ids=[x['raceId'] for x in payload.get('result',[{}])[0].get('results',[])]
          if len(ids)!=7695: raise RuntimeError(f'FIXED_ARCHIVE_COUNT_MISMATCH:{len(ids)}')
          shard=[rid for i,rid in enumerate(ids) if i % shard_count == shard_index]
          Path('analysis-results/fixed-oos-five-races-per-venue-day.json').write_text(json.dumps({'generatedFrom':'full fixed archive; no outcome-based filtering','shardIndex':shard_index,'shardCount':shard_count,'races':shard},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          Path('artifacts').mkdir(exist_ok=True)
          Path(f'artifacts/all-selection-meta-shard-{shard_index}.json').write_text(json.dumps({'fixedArchiveRaces':len(ids),'shardIndex':shard_index,'shardCount':shard_count,'shardRaces':len(shard),'outcomesUsedForSelection':False,'payoutsUsedForSelection':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'all':len(ids),'shard':shard_index,'count':len(shard)}))
          PY
      - name: Apply audited tab-key fix and worker count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/export-selected-historical-official-odds.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("            tab[m.group(2)] = m.group(1)","            tab['15' + m.group(2)] = m.group(1)",1)
          s=s.replace("WORKERS = 20","WORKERS = 12",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Export official odds shard
        run: python scripts/export-selected-historical-official-odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-historical-official-odds-shard-${{ matrix.shard }}
          path: |
            artifacts/selected-historical-official-odds.jsonl.gz
            artifacts/selected-historical-official-odds-meta.json
            artifacts/all-selection-meta-shard-${{ matrix.shard }}.json
          compression-level: 0
          retention-days: 14

  finalize:
    if: always()
    needs: [register, export]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPORT_RESULT: ${{ needs.export.result }}
        run: |
          if [ "$EXPORT_RESULT" = "success" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/all-historical-odds-sharded' -f description='固定7,695レースJRA公式過去オッズ7分割取得成功' -f target_url="$TARGET" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/all-historical-odds-sharded' -f description="固定7,695レースJRA公式過去オッズ取得失敗:${EXPORT_RESULT}" -f target_url="$TARGET" >/dev/null
            exit 1
          fi