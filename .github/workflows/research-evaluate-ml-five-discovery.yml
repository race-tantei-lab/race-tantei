name: Research evaluate ML five-race discovery

on:
  workflow_dispatch:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-evaluate-ml-five-discovery.yml"
      - "scripts/research-build-ml-discovery-odds-demand.py"
      - "scripts/research-evaluate-ml-five-discovery.py"
      - "scripts/research-freeze-practical-ml-discovery-winner.py"

concurrency:
  group: research-evaluate-ml-five-discovery
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  SELECTION_ARTIFACT_ID: '9088036803'
  SOURCE_INPUT_ARTIFACT_ID: '9086766461'
  CANONICAL_ODDS_RUN_ID: '31373205723'
  ALL_RACE_RUN_ID: '31455874661'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Mark discovery pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/ml-five-discovery-eval' -f description='Running strict 2016-2022 discovery; 2023-2026 untouched' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.4
      - name: Compile scripts
        run: |
          python -m py_compile scripts/research-build-ml-discovery-odds-demand.py scripts/research-fetch-demanded-official-odds.py scripts/research-evaluate-ml-five-discovery.py scripts/research-freeze-practical-ml-discovery-winner.py
      - name: Download fixed research inputs
        run: |
          set -euo pipefail
          mkdir -p input/selections input/source input/existing-odds input/new-odds input/predictions analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}/zip" > selections.zip
          unzip -q selections.zip -d input/selections
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_INPUT_ARTIFACT_ID}/zip" > source.zip
          unzip -q source.zip 'corrected-odds/*.jsonl' 'history/ten-year-history-corpus.jsonl' -d input/source
          cp input/source/corrected-odds/*.jsonl input/existing-odds/
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANONICAL_ODDS_RUN_ID}/artifacts?per_page=100" > canonical.json
          for y in $(seq 2016 2022); do
            id=$(jq -r --arg n "research-demanded-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' canonical.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "canonical-${y}.zip"
            unzip -q "canonical-${y}.zip" "research-demanded-odds-${y}.jsonl" -d input/existing-odds
          done
      - name: Build and verify exact missing demand
        run: |
          python scripts/research-build-ml-discovery-odds-demand.py \
            --selections-dir input/selections/ml-five-selections \
            --existing-odds-dir input/existing-odds \
            --history input/source/history/ten-year-history-corpus.jsonl \
            --max-year 2022 \
            --out analysis-results/ml-discovery-odds-demand.jsonl \
            --meta analysis-results/ml-discovery-odds-demand-meta.json
          python - <<'PY'
          import json
          m=json.load(open('analysis-results/ml-discovery-odds-demand-meta.json'))
          assert m['discoveryMaxYear']==2022,m
          assert m['holdoutStart']=='2023-01-01',m
          assert m['unionSelectedRaces']==16224,m
          assert m['reusedRaces']==10246,m
          assert m['missingRaces']==5978,m
          assert m['missingByYear']=={'2016':337,'2017':931,'2018':930,'2019':915,'2020':955,'2021':939,'2022':971},m
          assert m['reuseRequiresAllSixMarkets'] is True,m
          assert m['targetRaceResultUsedForDemand'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps(m,ensure_ascii=False))
          PY
      - name: Fetch all 5978 missing official six-market races
        run: |
          python scripts/research-fetch-demanded-official-odds.py \
            --input analysis-results/ml-discovery-odds-demand.jsonl \
            --out input/new-odds/ml-discovery-odds-all.jsonl \
            --meta analysis-results/ml-discovery-odds-all-meta.json \
            --workers 8
      - name: Require zero fetch failures and exact count
        run: |
          python - <<'PY'
          import json
          m=json.load(open('analysis-results/ml-discovery-odds-all-meta.json'))
          actual=sum(1 for line in open('input/new-odds/ml-discovery-odds-all.jsonl') if line.strip())
          assert actual==5978,actual
          assert not m.get('failures'),m.get('failures')
          assert m.get('syntheticOddsUsed') is False,m
          assert m.get('productionDatabaseWritten') is False,m
          print(json.dumps({'actual':actual,'coverage':m.get('coverage')},ensure_ascii=False))
          PY
      - name: Download all-race OOS predictions only after odds are complete
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ALL_RACE_RUN_ID}/artifacts?per_page=100" > ranker.json
          for y in $(seq 2016 2026); do
            id=$(jq -r --arg n "research-all-race-ranker-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' ranker.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "ranker-${y}.zip"
            unzip -q "ranker-${y}.zip" -d input/predictions
          done
      - name: Evaluate all 16 fixed combinations
        run: |
          python scripts/research-evaluate-ml-five-discovery.py \
            --predictions-dir input/predictions \
            --selections-dir input/selections/ml-five-selections \
            --existing-odds-dir input/existing-odds \
            --new-odds-dir input/new-odds \
            --history input/source/history/ten-year-history-corpus.jsonl \
            --out analysis-results/ml-five-discovery-evaluation.json
      - name: Freeze practical diagnostic candidate and enforce Top50 gate
        run: |
          python scripts/research-freeze-practical-ml-discovery-winner.py \
            --input analysis-results/ml-five-discovery-evaluation.json \
            --out analysis-results/ml-five-discovery-practical-frozen.json
          python - <<'PY'
          import json
          d=json.load(open('analysis-results/ml-five-discovery-evaluation.json'))
          p=json.load(open('analysis-results/ml-five-discovery-practical-frozen.json'))
          assert d['discoveryPeriod']['end']=='2022-12-31',d
          assert d['holdoutPeriodUntouched']=={'start':'2023-01-01','end':'2026-08-09'},d
          assert d['candidateCombinations']==16 and d['selectedRacesPerCombination']==9190,d
          assert d['inactiveHorsesFilteredBeforeRanking'] is True,d
          assert d['completionHardGate']['allCoursesTop50ReturnAndProfitExcludedRoiPctAtLeast']==200.0,d
          assert p['practicalDiscoveryWinner']['selector'] in ('confidence','concentration'),p
          assert p['practicalDiscoveryWinner']['historicalFinalPopularityUsedForSelection'] is False,p
          assert p['historicalHoldoutMayBeOpened']==p['practicalDiscoveryWinner']['eligibleForHistoricalHoldout'],p
          print(json.dumps({'all16Best':d['discoveryBestCandidate'],'all16Passed':d['discoveryPassed'],'practicalWinner':p['practicalDiscoveryWinner'],'historicalHoldoutMayBeOpened':p['historicalHoldoutMayBeOpened']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml-five-discovery-evaluation
          path: |
            analysis-results/ml-discovery-odds-demand-meta.json
            analysis-results/ml-discovery-odds-all-meta.json
            analysis-results/ml-five-discovery-evaluation.json
            analysis-results/ml-five-discovery-practical-frozen.json
          retention-days: 30
      - name: Mark discovery success
        run: |
          open=$(jq -r '.historicalHoldoutMayBeOpened' analysis-results/ml-five-discovery-practical-frozen.json)
          if [ "$open" = true ]; then desc='Discovery practical candidate passed Top50 gate; holdout may open'; else desc='Discovery completed; practical Top50 gate failed and holdout stays closed'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/ml-five-discovery-eval' -f description="$desc" -f target_url="$STATUS_TARGET_URL" >/dev/null
