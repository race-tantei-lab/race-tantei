name: Ten-year production history audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-ten-year-production-history.py"
      - ".github/workflows/d1-ten-year-production-history-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ten-year-production-history-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit canonical history readiness
        run: python scripts/audit-ten-year-production-history.py
      - uses: actions/upload-artifact@v4
        with:
          name: ten-year-production-history-audit
          path: artifacts/ten-year-production-history-audit.json
          retention-days: 7
