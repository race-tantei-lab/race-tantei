name: Apply v4 home consistency fix

on:
  push:
    branches:
      - agent/fix-home-performance-consistency
    paths:
      - ".github/workflows/apply-home-performance-consistency-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-home-performance-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch data source and labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          phase = Path("src/v1/phase-a-dashboard.ts")
          text = phase.read_text(encoding="utf-8")

          replacements = [
              (
                  """          WHEN r.race_date='${AUG1_DATE}' AND p.model_version='${AUG1_MODEL}' THEN 1
          WHEN r.race_date='${AUG2_DATE}' AND p.model_version=? THEN 1
          WHEN r.race_date='${AUG2_DATE}' AND p.model_version='${AUG2_MODEL}' THEN 2
          WHEN r.race_date NOT IN ('${AUG1_DATE}','${AUG2_DATE}') AND p.model_version=? THEN 1""",
                  """          WHEN r.race_date IN ('${AUG1_DATE}','${AUG2_DATE}') AND p.model_version=? THEN 1
          WHEN r.race_date='${AUG1_DATE}' AND p.model_version='${AUG1_MODEL}' THEN 2
          WHEN r.race_date='${AUG2_DATE}' AND p.model_version='${AUG2_MODEL}' THEN 2
          WHEN r.race_date NOT IN ('${AUG1_DATE}','${AUG2_DATE}') AND p.model_version=? THEN 1""",
              ),
              (
                  """      WHERE EXISTS (
        SELECT 1 FROM rt_bets b
        WHERE b.prediction_id=p.id
          AND (b.bet_type LIKE 'ライト｜%' OR b.bet_type LIKE 'スタンダード｜%' OR b.bet_type LIKE 'プレミアム｜%')
      )""",
                  """      WHERE p.status IN ('draft','locked')""",
              ),
              (
                  """    WITH ${chosenCte()},
    aug1_done AS (
      SELECT COUNT(DISTINCT race_id) AS count
      FROM chosen_prediction
      WHERE race_date='${AUG1_DATE}' AND model_version='${AUG1_MODEL}'
    )
    SELECT CASE""",
                  """    WITH ${chosenCte()}
    SELECT CASE""",
              ),
              (
                  """    WHERE b.settlement_status='settled'
      AND (p.race_date<>'${AUG1_DATE}' OR (SELECT count FROM aug1_done)>=36)
      AND (b.bet_type LIKE 'ライト｜%' OR b.bet_type LIKE 'スタンダード｜%' OR b.bet_type LIKE 'プレミアム｜%')""",
                  """    WHERE b.settlement_status='settled'
      AND (b.bet_type LIKE 'ライト｜%' OR b.bet_type LIKE 'スタンダード｜%' OR b.bet_type LIKE 'プレミアム｜%')""",
              ),
              (
                  """      WHERE r.race_date=? AND p.model_version=? AND p.status='locked'
        AND EXISTS (SELECT 1 FROM rt_bets b WHERE b.prediction_id=p.id AND b.settlement_status='settled')
    `).bind(AUG1_DATE, AUG1_MODEL).first<{ count: number }>()""",
                  """      WHERE r.race_date=? AND p.model_version=? AND p.status='locked'
    `).bind(AUG1_DATE, liveModel).first<{ count: number }>()""",
              ),
              (
                  "const retrospective = race.modelVersion === AUG1_MODEL || race.modelVersion === AUG2_MODEL;",
                  "const retrospective = race.raceDate === AUG1_DATE || race.raceDate === AUG2_DATE;",
              ),
              ('<div class="retro">遡及検証</div>', '<div class="retro">8月v4再計算</div>'),
              ("8月1日検証を集計中", "8月1日v4再計算を反映中"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f"PHASE_A_PATCH_TARGET_MISSING: {old[:80]}")
              text = text.replace(old, new, 1)

          day_anchor = """  const defaultFilter = buyCount > 0 ? "buy" : "all";

  const venueButtons"""
          day_replacement = """  const defaultFilter = buyCount > 0 ? "buy" : "all";
  const dailyTotals = COURSES.map(({ name, key }) => {
    const selectedValues = races.map((race) => courseValues(race, key)).filter((value) => value.count > 0);
    const stake = selectedValues.reduce((sum, value) => sum + value.stake, 0);
    const returns = selectedValues.reduce((sum, value) => sum + value.returns, 0);
    const roi = stake > 0 ? returns / stake * 100 : null;
    const roiClass = roi !== null && roi >= 100 ? "plus" : "minus";
    return `<div class="day-total"><b>${escapeHtml(name)}</b><strong class="${roiClass}">${roi === null ? "—" : `${roi.toFixed(1)}%`}</strong><span>${selectedValues.length}R　${formatYen(stake)} → ${formatYen(returns)}</span></div>`;
  }).join("");

  const venueButtons"""
          if day_anchor not in text:
              raise RuntimeError("DAY_TOTAL_LOGIC_TARGET_MISSING")
          text = text.replace(day_anchor, day_replacement, 1)

          render_anchor = """    <div class="day-summary"><div><h2>${dateLabel(date)}</h2><span>${races.length}R</span></div><p>買い目あり ${buyCount}R　終了 ${finishedCount}R</p></div>
    <div class="filter-tabs""" 
          render_replacement = """    <div class="day-summary"><div><h2>${dateLabel(date)}</h2><span>${races.length}R</span></div><p>買い目あり ${buyCount}R　終了 ${finishedCount}R</p></div>
    <div class="day-course-totals">${dailyTotals}</div>
    <div class="filter-tabs"""
          if render_anchor not in text:
              raise RuntimeError("DAY_TOTAL_RENDER_TARGET_MISSING")
          text = text.replace(render_anchor, render_replacement, 1)

          css_anchor = ".day-summary p{margin:0}.filter-tabs,.venue-tabs{display:flex;gap:7px;overflow:auto}"
          css_replacement = ".day-summary p{margin:0}.day-course-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 10px}.day-total{border:1px solid var(--line);border-radius:12px;background:#0d1722;padding:9px}.day-total b,.day-total strong,.day-total span{display:block}.day-total strong{margin:3px 0;font-size:18px}.day-total span{color:var(--muted);font-size:10px}.filter-tabs,.venue-tabs{display:flex;gap:7px;overflow:auto}"
          if css_anchor not in text:
              raise RuntimeError("DAY_TOTAL_CSS_TARGET_MISSING")
          text = text.replace(css_anchor, css_replacement, 1)
          text = text.replace("@media(max-width:720px){.metrics", "@media(max-width:720px){.day-course-totals{grid-template-columns:1fr}.metrics", 1)
          phase.write_text(text, encoding="utf-8")

          ui = Path("src/production-ui-entry.ts")
          ui_text = ui.read_text(encoding="utf-8")
          old_count = "const selected = normalizedMetrics(metrics).reduce((sum, row) => sum + row.settledRaces, 0);"
          new_count = "const selected = Math.max(0, ...normalizedMetrics(metrics).map((row) => row.settledRaces));"
          if old_count not in ui_text:
              raise RuntimeError("PRODUCTION_COUNT_TARGET_MISSING")
          ui_text = ui_text.replace(old_count, new_count, 1)
          old_label = "${selected}R／3コース合計"
          new_label = "${selected}R（3コース共通）"
          if old_label not in ui_text:
              raise RuntimeError("PRODUCTION_LABEL_TARGET_MISSING")
          ui_text = ui_text.replace(old_label, new_label, 1)
          ui.write_text(ui_text, encoding="utf-8")

          Path(".github/workflows/apply-home-performance-consistency-fix.yml").unlink()
          PY
      - run: npm ci
      - name: Verify source changes
        run: npm run typecheck && npm run build:test && npm run test:unit && npm run build
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/phase-a-dashboard.ts src/production-ui-entry.ts .github/workflows/apply-home-performance-consistency-fix.yml
          git commit -m "Align home race details with v4 aggregate"
          git push origin HEAD:agent/fix-home-performance-consistency
