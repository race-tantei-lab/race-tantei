name: Audit live-selection readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assert pre-provisioned live-selection indexes without writes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('rt_idx_ml_horse_hist_lookup','rt_idx_ml_horse_total_lookup','rt_idx_ml_horse_surface_lookup','rt_idx_ml_horse_dist_lookup','rt_idx_ml_horse_venue_lookup','rt_idx_ml_jockey_lookup','rt_idx_ml_trainer_lookup','rt_idx_ml_pair_lookup') ORDER BY name" \
            > /tmp/indexes.json
          python3 - <<'PY'
          import json
          required={'rt_idx_ml_horse_hist_lookup','rt_idx_ml_horse_total_lookup','rt_idx_ml_horse_surface_lookup','rt_idx_ml_horse_dist_lookup','rt_idx_ml_horse_venue_lookup','rt_idx_ml_jockey_lookup','rt_idx_ml_trainer_lookup','rt_idx_ml_pair_lookup'}
          raw=json.load(open('/tmp/indexes.json')); rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
            if isinstance(block,dict): rows += block.get('results') or []
          found={str(r.get('name')) for r in rows}; missing=sorted(required-found)
          print('LIVE_INDEXES_FOUND',sorted(found))
          if missing: raise SystemExit('MISSING_PREPROVISIONED_INDEXES:'+','.join(missing))
          PY

      - name: Verify live workers
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --max-time 10 -sS -o /tmp/p -w '%{http_code}' https://race-tantei-live-deadline.race-tantei.workers.dev/health)" = 200
          test "$(curl --max-time 10 -sS -o /tmp/b -w '%{http_code}' https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health)" = 200

      - name: Verify authoritative selection when present
        shell: bash
        run: |
          set -euo pipefail
          date=$(TZ=Asia/Tokyo date +%F)
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT state_value AS value FROM rt_system_state WHERE state_key='final_daily_selection:$date' LIMIT 1" > /tmp/sel.json
          python3 - <<'PY'
          import collections,json,sys
          raw=json.load(open('/tmp/sel.json')); rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
            if isinstance(block,dict): rows += block.get('results') or []
          if not rows or not rows[0].get('value'):
            print('SELECTION_NOT_PRESENT_YET')
            sys.exit(0)
          p=json.loads(rows[0]['value']); s=p.get('selected') or []
          ids=[str(x.get('raceId') or '') for x in s]; by=collections.Counter(str(x.get('venue') or '') for x in s)
          ok=(p.get('sourceModel')=='ten-year-completed-model' and p.get('resultDataUsedForTargetDay') is False and len(s)==15 and len(set(ids))==15 and len(by)==3 and all(v==5 for v in by.values()))
          if not ok: raise SystemExit('INVALID_SELECTION:'+json.dumps({'model':p.get('sourceModel'),'resultUsed':p.get('resultDataUsedForTargetDay'),'count':len(s),'venues':dict(by)},ensure_ascii=False))
          print('SELECTION_READY',json.dumps({'count':len(s),'venues':dict(by),'raceIds':ids},ensure_ascii=False))
          PY
