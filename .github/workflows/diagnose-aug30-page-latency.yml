name: Diagnose Aug30 page latency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aug30-page-latency.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deployment
        run: sleep 20
      - name: Measure production endpoints
        shell: bash
        run: |
          set -u
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          measure(){ label="$1"; url="$2"; out="$3"; headers="${4:-}"; if [ -n "$headers" ]; then curl --connect-timeout 5 --max-time 15 -sS -D "$headers" -o "$out" -w "$label code=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}\\n" "$url" || echo "$label CURL_FAILED:$?"; else curl --connect-timeout 5 --max-time 15 -sS -o "$out" -w "$label code=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}\\n" "$url" || echo "$label CURL_FAILED:$?"; fi; }
          echo '=== HOME ==='
          measure home "$base/?_rt=$(date +%s%N)" /tmp/home.html
          echo '=== AUG30 DAY API ==='
          measure day "$base/api/public/day?date=2026-08-30&_rt=$(date +%s%N)" /tmp/day.json /tmp/day.headers
          grep -i 'x-race-current-day-path' /tmp/day.headers 2>/dev/null || true
          : >/tmp/ids.txt
          if [ -s /tmp/day.json ]; then
            node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/day.json','utf8');
          let p; try{p=JSON.parse(raw)}catch(e){console.log('DAY_PARSE_FAILED',raw.slice(0,500));process.exit(0)}
          const races=p.races||p.items||p.day?.races||[];
          console.log('RACE_COUNT',Array.isArray(races)?races.length:'not-array');
          const ids=(Array.isArray(races)?races:[]).map(r=>r.raceId||r.race_id||r.id).filter(Boolean).slice(0,5);
          fs.writeFileSync('/tmp/ids.txt',ids.join('\n'));
          console.log('RACE_IDS',ids);
          NODE
          fi
          echo '=== AUG30 DAY API REPEATS ==='
          for n in 1 2 3; do measure "repeat$n" "$base/api/public/day?date=2026-08-30&_rt=$(date +%s%N)" /tmp/repeat.json; done
          echo '=== AUG30 RACE DETAILS ==='
          i=0
          while IFS= read -r rid; do
            [ -z "$rid" ] && continue
            i=$((i+1))
            measure "race$i:$rid" "$base/races/$rid?_rt=$(date +%s%N)" "/tmp/race-$i.html"
          done </tmp/ids.txt
          echo 'DIAG_COMPLETE'

# final production measurement after canonical-entry deploy
