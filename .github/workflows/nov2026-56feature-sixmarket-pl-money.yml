name: Evaluate chronology-safe 56-feature six-market monetary predictor
on:
  push:
    branches:
      - research/nov2026-56feature-sixmarket-pl-money
    paths:
      - scripts/research-nov2026-56feature-sixmarket-pl-money.py
      - .github/workflows/nov2026-56feature-sixmarket-pl-money.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculate-financial-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin financial model dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Check mathematical probability and settlement invariants
        run: |
          python -m py_compile scripts/research-nov2026-56feature-sixmarket-pl-money.py
          python -u scripts/research-nov2026-56feature-sixmarket-pl-money.py --self-test
      - name: Get unchanged six-market paid result source, never D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-archive
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          for year in 2024 2025; do
            for m in $(seq -w 1 12); do
              target="raceresults_$year$m.csv"
              curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
            done
          done
          for m in 01 02 03; do
            target="raceresults_2026$m.csv"
            curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
          done
          test "$(find external-jra-cash-archive -name '*.csv' | wc -l)" -eq 27
      - name: Fit 56-feature/real paid-money six-market predictor and validate chronological ROI
        run: python -u scripts/research-nov2026-56feature-sixmarket-pl-money.py
      - name: Preserve paired real-payout financial evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixmarket-56feature-paid-money-roi
          path: analysis-results/nov2026-56feature-sixmarket-pl-cash.json
          if-no-files-found: warn
          retention-days: 30
