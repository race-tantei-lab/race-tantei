name: Disable obsolete guardian schedules

on:
  push:
    branches: [main]
    paths:
      - "wrangler.live-deadline-guardian.jsonc"
      - "wrangler.live-deadline-guardian-backup.jsonc"
      - ".github/workflows/disable-obsolete-guardians.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disable-obsolete-guardians
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Remove primary guardian cron
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.live-deadline-guardian.jsonc
      - name: Remove backup guardian cron
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.live-deadline-guardian-backup.jsonc
      - name: Confirm configs have no schedules
        run: |
          node - <<'JS'
          const fs=require('fs');
          for (const path of ['wrangler.live-deadline-guardian.jsonc','wrangler.live-deadline-guardian-backup.jsonc']) {
            const c=JSON.parse(fs.readFileSync(path,'utf8'));
            if ((c.triggers?.crons||[]).length) throw new Error('GUARDIAN_CRON_STILL_CONFIGURED:'+path);
          }
          console.log('OBSOLETE_GUARDIAN_SCHEDULES_DISABLED');
          JS
