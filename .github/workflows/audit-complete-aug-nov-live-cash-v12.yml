name: Audit all actual production race betting Aug-Nov 2026 (read-only)
on:
  push:
    branches: [research/20261114-canonical-56feature-walkforward-v12]
    paths:
      - scripts/audit-complete-aug-nov-2026-live-cash-v12.py
      - .github/workflows/audit-complete-aug-nov-live-cash-v12.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Verify original production money audit contract
        run: |
          python scripts/audit-production-live-roi-readonly.py --self-test
          python -m py_compile scripts/audit-complete-aug-nov-2026-live-cash-v12.py
      - name: Audit every historical live frozen tip and cash bet through yesterday
        run: python -u scripts/audit-complete-aug-nov-2026-live-cash-v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-production-aug-nov-cash-readonly-v12
          path: analysis-results/20261114-production-aug-nov-roi-readonly.json
          if-no-files-found: warn
          retention-days: 14
