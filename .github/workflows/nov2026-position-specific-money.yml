name: Evaluate positional finish distribution six-market actual cash
on:
  push:
    branches:
      - research/nov2026-position-specific-sixmarket-cash
    paths:
      - scripts/research-nov2026-position-specific-money.py
      - .github/workflows/nov2026-position-specific-money.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  positional-real-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned monetary research dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Test six-market ordered-finishing probability identities
        run: |
          python -m py_compile scripts/research-nov2026-position-specific-money.py
          python -u scripts/research-nov2026-position-specific-money.py --self-test
      - name: Download unchanged JRA six-market payouts from public historical mirror; no D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-archive
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          for year in 2024 2025; do
            for m in $(seq -w 1 12); do
              target="raceresults_$year$m.csv"
              curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
            done
          done
          for m in 01 02 03; do
            target="raceresults_2026$m.csv"
            curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
          done
          test "$(find external-jra-cash-archive -name '*.csv' | wc -l)" -eq 27
      - name: Reconstruct chronological runner forms; train three finish-position models; score real financial ROI
        run: python -u scripts/research-nov2026-position-specific-money.py
      - name: Archive actual money audit without production changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-market-position-specific-real-cash-audit
          path: analysis-results/nov2026-position-specific-sixmarket-cash.json
          if-no-files-found: warn
          retention-days: 30
