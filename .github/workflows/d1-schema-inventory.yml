name: D1 schema inventory audit
run-name: D1 schema inventory audit · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/export-d1-schema-inventory.py"
      - ".github/workflows/d1-schema-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: d1-schema-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/d1-schema' -f description='D1の利用可能テーブルを監査中' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export schema inventory
        run: python scripts/export-d1-schema-inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: d1-schema-inventory
          path: artifacts/d1-schema-inventory.json
          retention-days: 7
      - name: Publish success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/d1-schema' -f description='D1テーブル監査完了' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/d1-schema' -f description='D1テーブル監査失敗' -f target_url="$STATUS_TARGET_URL" >/dev/null
