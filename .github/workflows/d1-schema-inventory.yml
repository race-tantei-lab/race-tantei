name: D1 schema inventory audit
run-name: D1 schema inventory audit · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/export-d1-schema-inventory.py"
      - ".github/workflows/d1-schema-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-schema-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export schema inventory
        run: python scripts/export-d1-schema-inventory.py
      - name: Save inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/d1-schema-inventory.json
          git commit -m "Save D1 schema inventory" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
