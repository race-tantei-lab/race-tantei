name: Research ExtraTrees historical actual JRA payout source coverage

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-extra-trees-historical-source-coverage.py
      - .github/workflows/research-extra-trees-historical-source-coverage.yml

permissions:
  contents: read

jobs:
  historical-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/research-extra-trees-historical-source-coverage.py
      - name: Verify actual JRA payout source for 2023 through 2026 (8 indexed queries only, read-only)
        run: python3 scripts/research-extra-trees-historical-source-coverage.py
