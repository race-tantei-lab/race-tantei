name: Research paired complement joint cash
on:
  push:
    branches: [research/nov2026-pair-complement-cash-1111]
    paths:
      - 'scripts/research-nov2026-pair-complement-cash.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas requests
      - name: Restore fixed premine results without rerunning discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p analysis-results/premined-{form,joint,pair}
          gh run download 42926949569 --dir /tmp/form --repo "${{ github.repository }}"
          gh run download 42964965187 --dir /tmp/joint --repo "${{ github.repository }}"
          gh run download 42967478747 --dir /tmp/pair --repo "${{ github.repository }}"
          find /tmp/form -name 'nov2026-form-decade-all-robust-cells.csv.gz' -exec cp {} analysis-results/premined-form/ \;
          find /tmp/joint -name 'nov2026-relative-draw-robust-cells.csv.gz' -exec cp {} analysis-results/premined-joint/ \;
          find /tmp/pair -name 'nov2026-form-pair-venue-quarter-robust-cells.csv.gz' -exec cp {} analysis-results/premined-pair/ \;
          test -s analysis-results/premined-form/nov2026-form-decade-all-robust-cells.csv.gz
          test -s analysis-results/premined-joint/nov2026-relative-draw-robust-cells.csv.gz
          test -s analysis-results/premined-pair/nov2026-form-pair-venue-quarter-robust-cells.csv.gz
      - run: python scripts/research-nov2026-pair-complement-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-complement-cash
          path: |
            analysis-results/nov2026-pair-complement-cash.json
            analysis-results/nov2026-pair-complement-bets.csv.gz
          if-no-files-found: warn
