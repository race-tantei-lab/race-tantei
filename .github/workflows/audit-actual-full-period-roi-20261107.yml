name: Audit full-period actual production ROI 2026-11-07 (read-only)
on:
  push:
    branches:
      - audit/full-period-live-roi-after-paid-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-period ROI calculations with fixed synthetic data
        run: python3 scripts/audit-production-live-roi-readonly.py --self-test
      - name: Audit all production race dates since August 10 without writing to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python3 scripts/audit-production-live-roi-readonly.py
