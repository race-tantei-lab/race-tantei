name: Calibrate new win/rank/place mixture on 2025 then score 2026 (no D1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrated-horse-mixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install exact ML versions
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'scikit-learn==1.6.1' 'numpy<3' 'joblib==1.4.2'
      - name: Verify no production D1 credentials or network reads
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_D1_DATABASE_ID:-}"
          python -m py_compile scripts/train-nov2026-horse-mixture-calibration.py
      - name: Learn 2025-only mixture; genuine 2026 chronological holdout
        run: python -u scripts/train-nov2026-horse-mixture-calibration.py
      - name: Preserve 2025 calibration, 2026 unfit labels and trained 3-head weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov2026-new-calibrated-horse-mixture
          path: |
            analysis-results/nov2026-calibrated-horse-mixture-2025-to-2026.json
            analysis-results/nov2026-calibrated-horse-mixture-frozen.joblib
          if-no-files-found: warn
          retention-days: 30
