name: Emergency Sep20 D1 Insights

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep20-d1-insights.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Query D1 analytics and insights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          npx wrangler d1 insights race-tantei-phase0 --timePeriod=30m --sort-type=sum --sort-by=reads --sort-direction=DESC --limit=30 --json > /tmp/insights.json 2>/tmp/insights.err || true
          cat > /tmp/gql.json <<'JSON'
          {
            "query":"query D1Usage($accountTag: string!, $start: Date, $end: Date, $databaseId: string) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 100, filter: { date_geq: $start, date_leq: $end, databaseId: $databaseId }) { sum { readQueries writeQueries rowsRead rowsWritten } dimensions { date databaseId } } } } }",
            "variables":{"accountTag":"3c6d1826b573b2e68cb13ec37e9e8ade","start":"2026-09-20","end":"2026-09-20","databaseId":"949b5e8b-d1a4-4c4e-80d1-d031afdc03de"}
          }
          JSON
          curl -fsS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/gql.json > /tmp/analytics.json
          python3 - <<'PY'
          import json,pathlib
          def load(p):
              try:return json.load(open(p,encoding='utf-8'))
              except:return None
          insights=load('/tmp/insights.json')
          analytics=load('/tmp/analytics.json')
          err=pathlib.Path('/tmp/insights.err').read_text(errors='replace')
          # Safety signal: surface any query whose 30m rows read is unexpectedly large.
          items=insights if isinstance(insights,list) else []
          top=[{
            'query':x.get('query'),'totalRowsRead':x.get('totalRowsRead'),'numberOfTimesRun':x.get('numberOfTimesRun'),
            'avgRowsRead':x.get('avgRowsRead'),'totalRowsWritten':x.get('totalRowsWritten')
          } for x in items[:30]]
          report={'capturedAtUtc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'analyticsUtcDate':analytics,'insights30m':top,'insightsError':err}
          pathlib.Path('ops/sep20-d1-insights.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-d1-insights.json
          git commit -m "ops: capture Sep 20 D1 insights"
          git pull --rebase origin main
          git push origin HEAD:main
