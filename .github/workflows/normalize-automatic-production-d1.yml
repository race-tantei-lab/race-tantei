name: Normalize automatic production D1 workflows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/normalize-automatic-d1-workflows.py"
      - ".github/workflows/normalize-automatic-production-d1.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Normalize all non-production automatic D1 readers
        run: python scripts/normalize-automatic-d1-workflows.py
      - name: Package normalized workflow files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- .github/workflows > /tmp/changed-workflows.txt
          cat /tmp/changed-workflows.txt
          mkdir -p /tmp/normalized
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "/tmp/normalized/$(dirname "$file")"
            cp "$file" "/tmp/normalized/$file"
          done < /tmp/changed-workflows.txt
          cp /tmp/changed-workflows.txt /tmp/normalized/changed-workflows.txt
          tar -C /tmp/normalized -czf normalized-production-d1-workflows.tar.gz .

      - name: Upload normalized workflow patch
        uses: actions/upload-artifact@v4
        with:
          name: normalized-production-d1-workflows
          path: normalized-production-d1-workflows.tar.gz
          if-no-files-found: error
          retention-days: 1
