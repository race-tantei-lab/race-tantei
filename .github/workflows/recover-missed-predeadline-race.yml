name: Recover missed predeadline race

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-missed-predeadline-race.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  RECOVERY_RACE_ID: "2026-08-16-chukyo-01"
  RECOVERY_RACE_DATE: "2026-08-16"
  RECOVERY_CUTOFF_UTC: "2026-08-16T00:35:00Z"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy<3"
      - name: Recover the missed 1R from pre-T15 data only
        run: python scripts/recover-predeadline-race.py
      - name: Verify public projection
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS \
            "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-08-16" \
            -o /tmp/day.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/day.json',encoding='utf-8')).get('races',[])
          row=next((r for r in rows if r.get('raceId')=='2026-08-16-chukyo-01'),None)
          if not row:
              raise SystemExit('RECOVERY_PUBLIC_RACE_MISSING')
          state=(row.get('publicState') or {}).get('code')
          print(json.dumps({'raceId':row.get('raceId'),'publicState':row.get('publicState')},ensure_ascii=False))
          if state in {'missing','overdue','target','pending',None,''}:
              raise SystemExit(f'RECOVERY_PUBLIC_STATE_NOT_FIXED:{state}')
          print('RECOVERY_PUBLIC_PROJECTION_OK')
          PY
      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeadline-recovery-2026-08-16-chukyo-01-${{ github.run_id }}
          path: analysis-results/predeadline-recovery-2026-08-16-chukyo-01.json
          if-no-files-found: warn
          retention-days: 30
