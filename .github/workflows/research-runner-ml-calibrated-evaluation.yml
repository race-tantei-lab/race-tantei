name: Research runner ML calibrated evaluation

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-runner-ml-calibrated-evaluation.yml"
      - "scripts/research-evaluate-runner-ml-calibrated.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  RANKER_RUN_ID: '31454005329'
  SOURCE_INPUT_ARTIFACT_ID: '9086766461'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark calibrated evaluation pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/runner-ml-calibrated' -f description='Nested past-only probability calibration with Top50 gate' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile calibrated evaluator
        run: python -m py_compile scripts/research-evaluate-runner-ml-market.py scripts/research-evaluate-runner-ml-calibrated.py
      - name: Download eleven ranker folds
        run: |
          set -euo pipefail
          mkdir -p input/predictions
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RANKER_RUN_ID}/artifacts?per_page=100" > ranker-artifacts.json
          for y in $(seq 2016 2026); do
            id=$(jq -r --arg n "research-runner-ranker-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' ranker-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "ranker-${y}.zip"
            unzip -q "ranker-${y}.zip" -d input/predictions
          done
      - name: Download source-clean odds and results
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_INPUT_ARTIFACT_ID}/zip" > source-clean.zip
          mkdir -p input/source
          unzip -q source-clean.zip 'corrected-odds/*.jsonl' 'history/ten-year-history-corpus.jsonl' -d input/source
      - name: Evaluate nested calibrated probabilities
        run: |
          python scripts/research-evaluate-runner-ml-calibrated.py \
            --predictions-dir input/predictions \
            --odds-dir input/source/corrected-odds \
            --history input/source/history/ten-year-history-corpus.jsonl \
            --out analysis-results/runner-ml-calibrated-evaluation.json
      - name: Verify hard gates and no target-year ROI tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis-results/runner-ml-calibrated-evaluation.json').read_text())
          assert d['selectedRaces']==14410,d
          assert d['targetRaceResultUsedForPrediction'] is False,d
          assert d['targetYearRoiUsedForCalibration'] is False,d
          assert d['syntheticOddsUsed'] is False,d
          assert d['productionDatabaseWritten'] is False,d
          assert d['completionHardGate']['allCoursesTop50ExcludedRoiPctAtLeast']==200.0,d
          for c in ('light','standard','premium'):
            x=d['courses'][c];assert x['races']==14410,x
            assert x['top50ExcludedRoiPct'] is not None,x
            assert x['top100ExcludedRoiPct'] is not None,x
            assert x['top1PctExcludedRoiPct'] is not None,x
          print(json.dumps({'courses':{c:{'roi':d['courses'][c]['roiPct'],'top50':d['courses'][c]['top50ExcludedRoiPct'],'top100':d['courses'][c]['top100ExcludedRoiPct'],'top1pct':d['courses'][c]['top1PctExcludedRoiPct']} for c in ('light','standard','premium')},'pass':d['passesCompletionHardGate'],'params':d['yearParameters']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-runner-ml-calibrated-evaluation
          path: analysis-results/runner-ml-calibrated-evaluation.json
          retention-days: 30
      - name: Mark calibrated evaluation success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/runner-ml-calibrated' -f description='Nested calibrated evaluation completed with Top50 robustness' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark calibrated evaluation failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/runner-ml-calibrated' -f description='Nested calibrated evaluation needs repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
