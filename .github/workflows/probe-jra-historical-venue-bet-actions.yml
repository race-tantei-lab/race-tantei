name: Probe JRA historical venue bet actions

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe-jra-historical-venue-bet-actions.py"
      - ".github/workflows/probe-jra-historical-venue-bet-actions.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish probe pending
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/jra-historical-bet-actions' \
            -f description='Probing JRA historical venue-day bet actions' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify probe source
        run: python -m py_compile scripts/probe-jra-historical-venue-bet-actions.py
      - name: Probe venue-day embedded bet actions
        run: python scripts/probe-jra-historical-venue-bet-actions.py
      - name: Save probe report
        shell: bash
        run: |
          git add -f analysis-results/jra-historical-venue-bet-actions-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No probe changes to save."
          else
            git commit -m "Save JRA historical venue bet actions probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish probe success
        if: success()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='analysis/jra-historical-bet-actions' \
            -f description='JRA historical venue-day bet action probe completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish probe failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='analysis/jra-historical-bet-actions' \
            -f description='JRA historical venue-day bet action probe failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
