name: Verify quota-free Sep 19 results

on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-v37.ts"
      - "src/v1/quota-free-jra-result-20260919.ts"
      - ".github/workflows/verify-quota-free-results-20260919.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public Worker deploy
        run: sleep 75
      - name: Verify completed race result without D1
        shell: bash
        run: |
          set -euo pipefail
          url='https://race-tantei-phase0.race-tantei.workers.dev/races/2026-09-19-hanshin-01'
          curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -D /tmp/headers "$url" -o /tmp/body
          tr -d '\r' </tmp/headers | tee /tmp/headers.clean
          grep -qi '^x-race-result-source: jra-official-direct-quota-free-20260919$' /tmp/headers.clean
          grep -q 'JRA公式結果' /tmp/body
          grep -q '払戻' /tmp/body
          echo 'QUOTA_FREE_RESULT_OK race=2026-09-19-hanshin-01'
