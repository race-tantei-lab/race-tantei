name: Verify quota-free Sep 19 results

on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-v37.ts"
      - "src/v1/quota-free-jra-result-20260919.ts"
      - ".github/workflows/verify-quota-free-results-20260919.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public Worker deploy
        run: sleep 75
      - name: Verify completed race results without D1
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev/races'
          for race in             2026-09-19-hanshin-01             2026-09-19-hanshin-02             2026-09-19-hanshin-03             2026-09-19-hanshin-05             2026-09-19-hanshin-06             2026-09-19-nakayama-01             2026-09-19-nakayama-02             2026-09-19-nakayama-03             2026-09-19-nakayama-07; do
            curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 -fsS -D "/tmp/$race.headers" "$base/$race" -o "/tmp/$race.body"
            tr -d '\r' <"/tmp/$race.headers" | tee "/tmp/$race.headers.clean"
            grep -qi 'x-race-result-source: jra-official-direct-quota-free-20260919' "/tmp/$race.headers.clean"
            grep -q 'JRA公式結果' "/tmp/$race.body"
            grep -q '払戻' "/tmp/$race.body"
            echo "QUOTA_FREE_RESULT_OK race=$race"
          done
