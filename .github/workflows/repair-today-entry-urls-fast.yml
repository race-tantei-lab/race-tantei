name: Repair today entry URLs and prove odds
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-today-entry-urls-fast.yml"
      - "scripts/repair-today-entry-urls-fast.mjs"
      - "scripts/smoke-live-worker-official-odds.mjs"
      - "src/v1/jra-official-odds-fetch.ts"
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  REPAIR_RACE_DATE: "2026-08-16"
  SMOKE_RACE_DATE: "2026-08-16"
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and compile production JRA parser
        run: |
          npm ci
          npm run build:test
      - name: Repair all 36 canonical entry URLs
        run: node scripts/repair-today-entry-urls-fast.mjs
      - name: Prove Worker six-type official odds on next selected race
        run: node scripts/smoke-live-worker-official-odds.mjs
      - name: Show repair and odds proof
        if: always()
        run: |
          cat analysis-results/today-entry-url-repair.json 2>/dev/null || true
          cat analysis-results/live-worker-six-type-odds-smoke.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-url-root-fix-${{ github.run_id }}
          path: |
            analysis-results/today-entry-url-repair.json
            analysis-results/live-worker-six-type-odds-smoke.json
          if-no-files-found: warn
          retention-days: 30
