name: Research independent 6m 96m historical final-odds replay
on:
  push:
    branches: [research/20261115-rolling-final-odds-replay]
    paths:
      - "scripts/probe-independent-final-odds-20261115.py"
      - "scripts/replay-independent-final-odds-20261115.mts"
      - ".github/workflows/research-independent-final-odds-replay-20261115.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      AUDIT_DATE: '2026-11-08'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: |
          pip install beautifulsoup4
          npm ci --prefer-offline --no-audit --no-fund
      - name: Probe JRA historical final odds and feature-state availability
        run: python3 scripts/probe-independent-final-odds-20261115.py
