name: Probe failed result URL formats
run-name: Probe failed result URL formats · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-failed-result-url-formats.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/result-url-format-probe' -f description='3連系モバイルフォームを監査中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Inspect mobile forms and desktop translation
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request, http.cookiejar
          from bs4 import BeautifulSoup
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          ep=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          rid='2026-05-30-tokyo-05'
          body=json.dumps({'sql':'SELECT result_url resultUrl FROM rt_races WHERE race_id=?','params':[rid]}).encode()
          req=urllib.request.Request(ep,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as r: result_url=json.loads(r.read().decode()).get('result',[{}])[0].get('results',[])[0]['resultUrl']
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          hdr={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}
          with op.open(urllib.request.Request(result_url,headers=hdr),timeout=60) as r: result_html=r.read().decode('cp932','replace')
          first=re.search(r'(sw151ou[0-9A-Za-z_/.-]+)',result_html).group(1)
          def post(host,cname,referer):
            data=urllib.parse.urlencode({'cname':cname}).encode('ascii')
            req=urllib.request.Request(host+'/JRADB/accessO.html',data=data,headers={**hdr,'Referer':referer,'Content-Type':'application/x-www-form-urlencoded'},method='POST')
            with op.open(req,timeout=60) as r: raw=r.read(); final=r.geturl()
            return raw.decode('cp932','replace'),final
          h151,u151=post('https://sp.jra.jp',first,result_url)
          toks=sorted(set(re.findall(r'sw15[1-8][A-Za-z0-9_/.-]+',h151)))
          targets=[x for x in toks if x.startswith(('sw157ou','sw158ou')) and '10052026021105' in x]
          out=[]
          for cname in targets:
            h,u=post('https://sp.jra.jp',cname,u151); s=BeautifulSoup(h,'html.parser')
            forms=[]
            for f in s.find_all('form'):
              fields=[]
              for el in f.find_all(['input','select','button']):
                rec={'tag':el.name,'type':el.get('type'),'name':el.get('name'),'id':el.get('id'),'value':el.get('value'),'onclick':el.get('onclick'),'onchange':el.get('onchange')}
                if el.name=='select': rec['options']=[{'value':o.get('value'),'text':' '.join(o.stripped_strings)} for o in el.find_all('option')[:25]]
                fields.append(rec)
              forms.append({'id':f.get('id'),'name':f.get('name'),'method':f.get('method'),'action':f.get('action'),'onsubmit':f.get('onsubmit'),'fields':fields})
            js=[]
            for sc in s.find_all('script'):
              src=sc.get('src'); txt=sc.get_text('\n')
              if src: js.append({'src':urllib.parse.urljoin(u,src)})
              elif any(k in txt for k in ['157','158','axis','jiku','select','cname','CNAME','doAction']): js.append({'inline':txt[:10000]})
            # Test desktop endpoint using identical race token/checksum but pw prefix.
            desktop_cname='pw'+cname[2:]
            try:
              dh,du=post('https://www.jra.go.jp',desktop_cname,'https://www.jra.go.jp/')
              ds=BeautifulSoup(dh,'html.parser')
              dtext=' '.join(ds.stripped_strings)
              desktop={'cname':desktop_cname,'finalUrl':du,'title':ds.title.get_text(' ',strip=True) if ds.title else '', 'tableCount':len(ds.find_all('table')), 'containsError':'パラメータエラー' in dtext, 'preview':dtext[:800]}
            except Exception as e:
              desktop={'cname':desktop_cname,'error':type(e).__name__+':'+str(e)}
            html_snips=[]
            for needle in ['軸馬を選択してください','着順を選択してください','表示']:
              pos=h.find(needle)
              if pos>=0: html_snips.append(h[max(0,pos-2500):pos+4000])
            out.append({'mobileCname':cname,'title':s.title.get_text(' ',strip=True) if s.title else '', 'forms':forms,'scripts':js,'desktopTest':desktop,'htmlSnippets':html_snips[:3]})
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if len(out)!=2: raise SystemExit('TARGET_PAGES_MISSING')
          PY
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/result-url-format-probe' -f description='3連系モバイルフォーム監査完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/result-url-format-probe' -f description='3連系モバイルフォーム監査失敗' -f target_url="$TARGET" >/dev/null
