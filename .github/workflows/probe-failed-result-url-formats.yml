name: Probe failed result URL formats
run-name: Probe failed result URL formats · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-failed-result-url-formats.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/result-url-format-probe' -f description='JRAモバイル結果のオッズ導線を監査中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact D1 URLs and mobile odds CNAMEs
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          ep=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          ids=['2026-05-30-tokyo-05','2026-07-19-hakodate-06','2026-08-01-sapporo-01','2026-08-02-chukyo-10']
          body=json.dumps({'sql':'SELECT race_id raceId,result_url resultUrl FROM rt_races WHERE race_id IN (?,?,?,?) ORDER BY race_id','params':ids}).encode()
          req=urllib.request.Request(ep,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as r: p=json.loads(r.read().decode())
          rows=p.get('result',[{}])[0].get('results',[])
          out=[]
          for row in rows:
            url=row['resultUrl']
            rq=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'})
            with urllib.request.urlopen(rq,timeout=60) as rr: raw=rr.read(); final=rr.geturl()
            html=raw.decode('cp932','replace')
            # Capture all likely CNAME-like tokens, not only desktop doAction calls.
            tokens=sorted(set(re.findall(r'[ps]w\d+[A-Za-z0-9_/.-]+',html)))
            access_o=[]
            for pat in [r"doAction\([^,]+,\s*'([^']+)'\)", r'CNAME=([^&"\']+)']:
              try: access_o += re.findall(pat,html)
              except Exception: pass
            out.append({'raceId':row['raceId'],'resultUrl':url,'decodedResultUrl':urllib.parse.unquote(url),'finalUrl':final,'sw151Tokens':[x for x in tokens if x.startswith('sw151')][:10],'pw151Tokens':[x for x in tokens if x.startswith('pw151')][:10],'all15Tokens':[x for x in tokens if re.match(r'[ps]w15[1-8]',x)][:40],'navCnames':access_o[:40]})
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/result-url-format-probe' -f description='JRAモバイルオッズ導線監査完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/result-url-format-probe' -f description='JRAモバイルオッズ導線監査失敗' -f target_url="$TARGET" >/dev/null
