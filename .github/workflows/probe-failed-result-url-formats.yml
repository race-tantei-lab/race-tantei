name: Probe failed result URL formats
run-name: Probe failed result URL formats · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-failed-result-url-formats.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/result-url-format-probe' -f description='JRAモバイル過去オッズ構造を監査中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Map mobile odds pages
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request, http.cookiejar
          from bs4 import BeautifulSoup
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          ep=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          rid='2026-05-30-tokyo-05'
          body=json.dumps({'sql':'SELECT race_id raceId,result_url resultUrl FROM rt_races WHERE race_id=?','params':[rid]}).encode()
          req=urllib.request.Request(ep,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as r: p=json.loads(r.read().decode())
          row=p.get('result',[{}])[0].get('results',[])[0]; result_url=row['resultUrl']
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          hdr={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}
          with op.open(urllib.request.Request(result_url,headers=hdr),timeout=60) as r: html=r.read().decode('cp932','replace')
          tokens=sorted(set(re.findall(r'sw15[1-8][A-Za-z0-9_/.-]+',html)))
          first=[x for x in tokens if x.startswith('sw151ou')][0]
          def post(cname, referer):
            data=urllib.parse.urlencode({'cname':cname}).encode('ascii')
            req=urllib.request.Request('https://sp.jra.jp/JRADB/accessO.html',data=data,headers={**hdr,'Referer':referer,'Content-Type':'application/x-www-form-urlencoded'},method='POST')
            with op.open(req,timeout=60) as r: raw=r.read(); final=r.geturl()
            return raw.decode('cp932','replace'),final
          h151,u151=post(first,result_url); s151=BeautifulSoup(h151,'html.parser')
          all_tokens=sorted(set(re.findall(r'sw15[1-8][A-Za-z0-9_/.-]+',h151)))
          current=[x for x in all_tokens if re.match(r'sw15[1-8]ou',x) and '10052026021105' in x]
          pages=[]
          for cname in current:
            h,u=post(cname,u151); s=BeautifulSoup(h,'html.parser')
            tables=[]
            for t in s.find_all('table')[:12]:
              rr=[]
              for tr in t.find_all('tr')[:10]:
                cells=[' '.join(c.stripped_strings) for c in tr.find_all(['th','td'])]
                if cells: rr.append(cells)
              if rr: tables.append({'class':t.get('class'),'rows':rr})
            pages.append({'cname':cname,'title':s.title.get_text(' ',strip=True) if s.title else '', 'tables':tables, 'text':' '.join(s.stripped_strings)[:3000]})
          print(json.dumps({'resultUrl':result_url,'first':first,'allCurrentTokens':current,'pages':pages},ensure_ascii=False,indent=2))
          if len(current)<6: raise SystemExit('MOBILE_ODDS_TYPE_MAP_INCOMPLETE')
          PY
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/result-url-format-probe' -f description='JRAモバイル過去オッズ構造監査完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/result-url-format-probe' -f description='JRAモバイル過去オッズ構造監査失敗' -f target_url="$TARGET" >/dev/null
