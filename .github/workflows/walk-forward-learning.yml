name: Walk-forward 12 month learning

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walk-forward-12m-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Advance official history and feature generation
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 30); do
            status_code=$(curl --silent --show-error --output step.json --write-out "%{http_code}" \
              --max-time 90 --request POST \
              --header "x-race-training: walk-forward-12m-v1" \
              "${base}/api/training/walk-forward/step" || true)
            if [ "$status_code" != "200" ]; then
              echo "Training step ${attempt} returned HTTP ${status_code}; stopping this run without publishing."
              break
            fi
            python - <<'PY'
          import json
          row=json.load(open('step.json', encoding='utf-8'))
          progress=row.get('progress',{})
          print(json.dumps({
              'stage': row.get('stage'),
              'phase': progress.get('phase'),
              'generatedRaces': progress.get('generatedRaces'),
              'targetRaces': progress.get('targetRaces'),
              'history': progress.get('history',{})
          }, ensure_ascii=False))
          open('step-complete.txt','w',encoding='utf-8').write('true' if progress.get('complete') is True else 'false')
          PY
            if [ "$(cat step-complete.txt)" = "true" ]; then
              break
            fi
            sleep 2
          done

      - name: Read learning progress
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 90 \
            "${base}/api/training/walk-forward/status" -o walk-forward-status.json
          python - <<'PY'
          import json
          status=json.load(open('walk-forward-status.json', encoding='utf-8'))
          print(json.dumps(status, ensure_ascii=False, indent=2))
          ready=status.get('complete') is True
          with open('ready.txt','w',encoding='utf-8') as f:
              f.write('true' if ready else 'false')
          PY

      - name: Publish import progress
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          status=json.load(open('walk-forward-status.json', encoding='utf-8'))
          print('## 12か月ウォークフォワード学習')
          print(f"- フェーズ: {status.get('phase')}")
          print(f"- 基礎予想: {status.get('generatedRaces',0)} / {status.get('targetRaces',0)}R")
          history=status.get('history',{})
          print(f"- 公式履歴URL: {history.get('importedUrls',0)} / {history.get('resultUrls',0)}")
          print(f"- 恒久取得失敗: {history.get('permanentFailures',0)}")
          PY

      - name: Fetch completed split dataset
        if: ${{ success() }}
        run: |
          if [ "$(cat ready.txt)" != "true" ]; then
            echo "Dataset is still being imported. This run ends without changing site performance."
            exit 0
          fi
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          curl --silent --show-error --fail --max-time 240 \
            "${base}/api/training/walk-forward/data" -o walk-forward-data.json
          python - <<'PY'
          import json
          data=json.load(open('walk-forward-data.json', encoding='utf-8'))
          assert data.get('complete') is True
          counts=data.get('splitCounts',{})
          progress=data.get('progress',{})
          history=progress.get('history',{})
          assert history.get('permanentFailures',0) == 0, history
          assert counts.get('train',0) >= 1800, counts
          assert counts.get('validation',0) >= 300, counts
          assert counts.get('holdout',0) >= 150, counts
          print(json.dumps(counts, ensure_ascii=False))
          PY

      - name: Train on 12 months and evaluate historical test once
        if: ${{ hashFiles('walk-forward-data.json') != '' }}
        run: |
          python scripts/optimize_walk_forward_roi.py walk-forward-data.json \
            --candidates 8 \
            --race-policies 180 \
            --ticket-policies 280 \
            --output walk-forward-roi-result.json

      - name: Compare with audited v1 baseline
        if: ${{ hashFiles('walk-forward-roi-result.json') != '' }}
        run: |
          python scripts/check_walk_forward_promotion.py \
            walk-forward-data.json \
            walk-forward-roi-result.json

      - name: Require historical gate before shadow mode
        if: ${{ hashFiles('walk-forward-roi-result.json') != '' }}
        run: |
          python - <<'PY'
          import json
          result=json.load(open('walk-forward-roi-result.json', encoding='utf-8'))
          print(json.dumps({
              'historicalGatePassed': result['historicalGatePassed'],
              'promotionReady': result['promotionReady'],
              'nextRequiredStage': result['nextRequiredStage'],
              'promotionChecks': result['promotionChecks'],
              'validation': result['validation']['courses'],
              'holdout': result['holdout']['courses'],
              'baselineHoldout': result['baseline']['holdout']['courses']
          }, ensure_ascii=False, indent=2))
          assert result['historicalGatePassed'] is True, 'Candidate did not beat audited v1 on the locked historical test'
          assert result['promotionReady'] is False, 'Historical data alone must never promote production'
          assert result['nextRequiredStage'] == 'future-shadow'
          PY

      - name: Publish learning result
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists('walk-forward-roi-result.json'):
              print('- データ準備中のため、モデル選定と回収率更新は未実施です。')
              raise SystemExit(0)
          result=json.load(open('walk-forward-roi-result.json', encoding='utf-8'))
          print(f"- 履歴テスト合格: **{result.get('historicalGatePassed', False)}**")
          print(f"- 本番昇格: **{result.get('promotionReady', False)}**")
          print(f"- 次段階: {result.get('nextRequiredStage')}")
          print(f"- 校正: modelWeight={result['calibration']['modelWeight']:.2f}, temperature={result['calibration']['temperature']:.2f}")
          for split in ('validation','holdout'):
              print(f"### {split}")
              for course,row in result[split]['courses'].items():
                  print(f"- {course}: ROI {row['roiPct']:.1f}% / 的中率 {row['hitRatePct']:.1f}% / 最大1日寄与 {row['maximumPositiveDayShare']:.1%}")
          if 'baseline' in result:
              print('### 現行v1との履歴テスト比較')
              for course,check in result['promotionChecks'].items():
                  print(f"- {course}: v1 {check['baselineRoiPct']:.1f}% → 新 {check['learnedRoiPct']:.1f}%（必要 {check['requiredRoiPct']:.1f}%）")
          PY

      - name: Upload learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-learning
          path: |
            walk-forward-status.json
            walk-forward-data.json
            walk-forward-roi-result.json
          if-no-files-found: warn
