name: Audit August v4 backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-august-v4-backfill.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Query August v4 state
        shell: bash
        run: |
          mkdir -p analysis-results
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
          SELECT r.race_date raceDate,
                 COUNT(DISTINCT p.race_id) predictedRaces,
                 COUNT(DISTINCT CASE WHEN b.id IS NOT NULL THEN b.race_id END) selectedRaces,
                 COUNT(b.id) tickets,
                 COALESCE(SUM(b.stake_yen),0) stakeYen,
                 COALESCE(SUM(CASE WHEN b.settlement_status='settled' THEN b.return_yen ELSE 0 END),0) returnYen,
                 SUM(CASE WHEN b.settlement_status='pending' THEN 1 ELSE 0 END) pendingTickets
          FROM rt_predictions p
          JOIN rt_races r ON r.race_id=p.race_id
          LEFT JOIN rt_bets b ON b.prediction_id=p.id
            AND (b.bet_type LIKE 'ライト｜%' OR b.bet_type LIKE 'スタンダード｜%' OR b.bet_type LIKE 'プレミアム｜%')
          WHERE p.model_version='v4.1.0-nonlinear-hgb-5r'
            AND r.race_date IN ('2026-08-01','2026-08-02')
          GROUP BY r.race_date ORDER BY r.race_date;
          SELECT CASE
                   WHEN b.bet_type LIKE 'ライト｜%' THEN 'ライト'
                   WHEN b.bet_type LIKE 'スタンダード｜%' THEN 'スタンダード'
                   WHEN b.bet_type LIKE 'プレミアム｜%' THEN 'プレミアム'
                 END course,
                 COUNT(DISTINCT b.race_id) races,
                 COUNT(*) tickets,
                 COALESCE(SUM(b.stake_yen),0) stakeYen,
                 COALESCE(SUM(b.return_yen),0) returnYen,
                 COALESCE(SUM(CASE WHEN b.return_yen>0 THEN 1 ELSE 0 END),0) hits,
                 SUM(CASE WHEN b.settlement_status='pending' THEN 1 ELSE 0 END) pendingTickets
          FROM rt_bets b
          JOIN rt_predictions p ON p.id=b.prediction_id
          JOIN rt_races r ON r.race_id=b.race_id
          WHERE p.model_version='v4.1.0-nonlinear-hgb-5r'
            AND r.race_date>='2026-08-01'
            AND (b.bet_type LIKE 'ライト｜%' OR b.bet_type LIKE 'スタンダード｜%' OR b.bet_type LIKE 'プレミアム｜%')
          GROUP BY course ORDER BY course;
          SELECT state_key,state_value,updated_at
          FROM rt_system_state
          WHERE state_key='production_model:v4.1.0-nonlinear-hgb-5r:august_backfill';
          " > analysis-results/august-v4-d1-audit.json
      - name: Save audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis-results/august-v4-d1-audit.json
          git commit -m "Save August v4 D1 audit" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
