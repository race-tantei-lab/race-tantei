name: Apply WIN5 hard lock fix v3

on:
  push:
    branches:
      - fix/win5-hard-lock-20260816
    paths:
      - .github/workflows/apply-win5-hard-lock-fix-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/win5-hard-lock-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the verified patch logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-win5-hard-lock-fix-v2.yml').read_text(encoding='utf-8')
          marker='      - name: Patch WIN5 finalization and display\n'
          a=src.index(marker)
          a=src.index('        run: |\n',a)+len('        run: |\n')
          b=src.index('      - name: Validate patch\n',a)
          lines=[]
          for line in src[a:b].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-win5.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/apply-win5.sh
          # Do not add the pre-existing non-runnable standalone WIN5 test to
          # test:unit. The permanent static regression verifier covers this fix.
          git checkout HEAD -- package.json package-lock.json
      - name: Validate all deterministic checks
        shell: bash
        run: |
          npm install
          python scripts/verify-win5-ui.py
          npm run typecheck
          npm run build:test
          npm run test:unit
          npm run build
          git checkout HEAD -- package.json package-lock.json
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/completed-win5.ts src/public-site-entry-v29.ts src/public-site-entry-v27.ts scripts/verify-win5-ui.py
          git diff --cached --check
          git commit -m "Make WIN5 final immutable at deadline"
          git push origin HEAD:fix/win5-hard-lock-20260816
