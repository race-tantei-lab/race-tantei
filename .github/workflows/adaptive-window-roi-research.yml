name: Adaptive window ROI research tests
on:
  pull_request:
    paths:
      - "scripts/research-adaptive-window-meta-roi.py"
      - "scripts/research-adaptive-roi-cash-verifier.py"
      - "tests/test_research_adaptive_window_meta_roi.py"
      - "tests/test_research_adaptive_roi_cash_verifier.py"
      - ".github/workflows/adaptive-window-roi-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research modules
        run: python -m py_compile scripts/research-adaptive-window-meta-roi.py scripts/research-adaptive-roi-cash-verifier.py tests/test_research_adaptive_window_meta_roi.py tests/test_research_adaptive_roi_cash_verifier.py
      - name: Verify no forward leakage, strict cash ROI, T15, and refunds
        run: |
          python -m unittest discover -s tests -p 'test_research_adaptive_window_meta_roi.py' -v
          python -m unittest discover -s tests -p 'test_research_adaptive_roi_cash_verifier.py' -v
