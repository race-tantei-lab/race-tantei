name: Adaptive window ROI research tests
on:
  pull_request:
    paths:
      - "scripts/research-adaptive-window-meta-roi.py"
      - "tests/test_research_adaptive_window_meta_roi.py"
      - ".github/workflows/adaptive-window-roi-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/research-adaptive-window-meta-roi.py tests/test_research_adaptive_window_meta_roi.py
      - name: Test future-information isolation
        run: python -m unittest discover -s tests -p 'test_research_adaptive_window_meta_roi.py' -v
