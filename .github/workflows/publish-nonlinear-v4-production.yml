name: Publish final v5 course-specific predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-nonlinear-v4-production.yml"
      - "scripts/final-course-policy.py"
      - "scripts/run-final-course-production.py"
      - "scripts/publish-nonlinear-v4-production.py"
      - "scripts/train-nonlinear-market-blend-v4.py"

concurrency:
  group: publish-final-v5-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Publish final v5 model
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-final-course-production.py 2>&1 | tee production-final-course-model.log
      - name: Upload production report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-final-v5
          path: |
            production-final-course-model.json
            production-final-course-model.log
          if-no-files-found: warn
          retention-days: 30
      - name: Save production report
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in production-final-course-model.json production-final-course-model.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No production report change."
          else
            git commit -m "Save final v5 production report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
