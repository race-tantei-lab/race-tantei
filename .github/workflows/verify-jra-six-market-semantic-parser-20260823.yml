name: Verify JRA six-market semantic parser 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-jra-six-market-semantic-parser-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and parser regressions
        run: |
          npm run typecheck
          npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Verify uncapped real JRA Chukyo10 markets
        shell: bash
        run: |
          set -euo pipefail
          race='2026-08-23-chukyo-10'
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT entry_url FROM rt_races WHERE race_id='$race'" > /tmp/race.json
          entry=$(node -e "const p=require('/tmp/race.json');process.stdout.write(p[0].results[0].entry_url)")
          cat > .semantic-odds-verify.ts <<'TS'
          import { fetchFastJraOfficialOddsForRace } from "./src/v1/jra-official-odds-fetch.ts";

          async function main() {
            const r=await fetchFastJraOfficialOddsForRace(process.env.ENTRY_URL!,{raceDate:"2026-08-23",venue:"中京",raceNo:10});
            const counts=Object.fromEntries(r.pages.map(p=>[p.betType,p.rows.length]));
            console.log("COUNTS",JSON.stringify(counts));
            const tan3=r.rows.filter(x=>x.betType==="3連単");
            const got=new Set(tan3.map(x=>x.combination));
            const missing:string[]=[];
            for(let a=1;a<=14;a++) for(let b=1;b<=14;b++) if(b!==a) for(let c=1;c<=14;c++) if(c!==a&&c!==b){
              const key=`${a}-${b}-${c}`;
              if(!got.has(key)) missing.push(key);
            }
            const win=r.rows.find(x=>x.betType==="単勝"&&x.combination==="12");
            const high=tan3.filter(x=>x.oddsMin>100000);
            console.log("MISSING_TOTAL",missing.length);
            console.log("HIGH_ODDS_ROWS",high.length);
            console.log("HIGH_ODDS_SAMPLE",JSON.stringify(high.slice(0,20)));
            console.log("HORSE12_WIN",JSON.stringify(win));
            if(counts["単勝"]!==14||counts["ワイド"]!==91||counts["馬連"]!==91||counts["馬単"]!==182||counts["3連複"]!==364||counts["3連単"]!==2184) throw new Error(`COUNT_MISMATCH:${JSON.stringify(counts)}`);
            if(missing.length) throw new Error(`TAN3_MISSING:${missing.length}`);
            if(high.length!==253) throw new Error(`HIGH_ODDS_COUNT_UNEXPECTED:${high.length}`);
            if(!win||win.oddsMin!==1.7||win.oddsMax!==1.7) throw new Error(`HORSE12_WIN_MISMATCH:${JSON.stringify(win)}`);
            const keys=new Set<string>();
            for(const row of r.rows){const key=`${row.betType}:${row.combination}`;if(keys.has(key))throw new Error(`DUPLICATE:${key}`);keys.add(key);if(!Number.isFinite(row.oddsMin)||!Number.isFinite(row.oddsMax)||row.oddsMin<1||row.oddsMax<row.oddsMin)throw new Error(`ODDS_INVALID:${key}`);}
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          ENTRY_URL="$entry" npx tsx .semantic-odds-verify.ts
          rm -f .semantic-odds-verify.ts
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/jra-six-market-semantic' -f description='All six JRA markets complete from semantic cells' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/jra-six-market-semantic' -f description='JRA semantic parser verification failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
