name: Verify JRA six-market semantic parser 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-jra-six-market-semantic-parser-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and parser regressions
        run: |
          npm run typecheck
          npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Verify complete official JRA markets on real Chukyo10
        shell: bash
        run: |
          set -euo pipefail
          race='2026-08-23-chukyo-10'
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT entry_url FROM rt_races WHERE race_id='$race'" > /tmp/race.json
          entry=$(node -e "const p=require('/tmp/race.json');process.stdout.write(p[0].results[0].entry_url)")
          cat > .semantic-odds-verify.ts <<'TS'
          import { fetchFastJraOfficialOddsForRace } from "./src/v1/jra-official-odds-fetch.ts";
          import { decodeJraHtml, jraActionLinks } from "./src/v1/jra-official-odds.ts";
          import { findFastJraTypeCnames, JRA_FAST_TYPE_PREFIX } from "./src/v1/jra-official-odds-fast.ts";

          async function main() {
            const entryUrl=process.env.ENTRY_URL!;
            const target={raceDate:"2026-08-23",venue:"中京",raceNo:10} as const;
            const r=await fetchFastJraOfficialOddsForRace(entryUrl,target);
            const counts=Object.fromEntries(r.pages.map(p=>[p.betType,p.rows.length]));
            console.log(JSON.stringify({source:r.source,sourceHost:r.sourceHost,counts},null,2));
            const expected={"単勝":14,"馬連":91,"ワイド":91,"馬単":182,"3連複":364,"3連単":1931};
            for(const [k,v] of Object.entries(expected)) if(Number(counts[k])!==v) throw new Error(`COUNT_MISMATCH:${k}:${counts[k]}:${v}`);
            const win=r.rows.find(x=>x.betType==="単勝"&&x.combination==="12");
            console.log("HORSE12_WIN",JSON.stringify(win));
            if(!win || win.oddsMin!==1.7 || win.oddsMax!==1.7) throw new Error(`HORSE12_WIN_MISMATCH:${JSON.stringify(win)}`);
            const keys=new Set<string>();
            for(const row of r.rows){const key=`${row.betType}:${row.combination}`; if(keys.has(key)) throw new Error(`DUPLICATE:${key}`); keys.add(key); if(!Number.isFinite(row.oddsMin)||!Number.isFinite(row.oddsMax)||row.oddsMin<1||row.oddsMax<row.oddsMin) throw new Error(`ODDS_INVALID:${key}`);}

            const headers={"User-Agent":"Mozilla/5.0 Chrome/136 Safari/537.36","Accept-Language":"ja-JP,ja;q=0.9","Cache-Control":"no-cache","Pragma":"no-cache"};
            async function raw(url:string,cname?:string){const h:Record<string,string>={...headers};let body:string|undefined;if(cname){body=new URLSearchParams({cname}).toString();h["Content-Type"]="application/x-www-form-urlencoded";}const res=await fetch(url,{method:body?"POST":"GET",headers:h,body,redirect:"follow"});if(!res.ok)throw new Error(`RAW_HTTP_${res.status}`);return decodeJraHtml(await res.arrayBuffer(),res.headers.get("content-type"));}
            const dateDigits="20260823";
            const entryHtml=await raw(entryUrl);
            const entryCnames=findFastJraTypeCnames(entryHtml,dateDigits,10);
            const oddsUrl=new URL("/JRADB/accessO.html",entryUrl).toString();
            const winCname=entryCnames["単勝"] ?? jraActionLinks(entryHtml).find(x=>x.cname.startsWith(JRA_FAST_TYPE_PREFIX["単勝"]))?.cname;
            if(!winCname)throw new Error("RAW_WIN_CNAME_MISSING");
            const winHtml=await raw(oddsUrl,winCname);
            const cnames={...entryCnames,...findFastJraTypeCnames(winHtml,dateDigits,10)};
            const tan3Cname=cnames["3連単"];
            if(!tan3Cname)throw new Error("RAW_TAN3_CNAME_MISSING");
            const tan3Html=await raw(oddsUrl,tan3Cname);
            let rawPublishedTan3=0;
            for(const table of tan3Html.matchAll(/<table\b([^>]*)>([\s\S]*?)<\/table>/gi)){
              const classes=(table[1].match(/\bclass\s*=\s*(["'])(.*?)\1/i)?.[2]??"").split(/\s+/);
              if(!classes.includes("tan3"))continue;
              for(const row of (table[2]??"").matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)) if(/<td\b[^>]*>[\s\S]*?\d+\.\d+[\s\S]*?<\/td>/i.test(row[0])) rawPublishedTan3++;
            }
            console.log("RAW_PUBLISHED_TAN3_ROWS",rawPublishedTan3);
            if(rawPublishedTan3!==counts["3連単"]) throw new Error(`TAN3_RAW_COVERAGE_MISMATCH:${rawPublishedTan3}:${counts["3連単"]}`);
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          ENTRY_URL="$entry" npx tsx .semantic-odds-verify.ts
          rm -f .semantic-odds-verify.ts
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/jra-six-market-semantic' -f description='All published JRA odds parsed from semantic cells' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/jra-six-market-semantic' -f description='JRA six-market semantic parser verification failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
