name: Force finish upcoming entry repair
run-name: Force finish upcoming entry repair · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-finish-upcoming-entries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Drive production Worker repair until all 36 races have entries
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          sql="WITH per_race AS (SELECT r.race_id,r.venue,r.race_no,SUM(CASE WHEN rr.runner_status='active' THEN 1 ELSE 0 END) AS activeRunners FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id WHERE r.race_date='2026-08-22' GROUP BY r.race_id,r.venue,r.race_no) SELECT venue,COUNT(*) AS races,SUM(CASE WHEN activeRunners>=3 THEN 1 ELSE 0 END) AS readyRaces,MIN(activeRunners) AS minActiveRunners,MAX(activeRunners) AS maxActiveRunners FROM per_race GROUP BY venue ORDER BY venue;"
          for attempt in $(seq 1 36); do
            curl --retry 2 --retry-delay 1 --retry-all-errors -fsS "$base/races/2026-08-22-chukyo-01" >/dev/null || true
            sleep 5
            npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$sql" > /tmp/summary.json
            cat /tmp/summary.json
            if node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/summary.json','utf8'));
          const rows=(Array.isArray(raw)?raw:[raw]).flatMap(x=>x.results||[]);
          if(rows.length!==3) process.exit(1);
          if(rows.some(r=>Number(r.races)!==12||Number(r.readyRaces)!==12||Number(r.minActiveRunners)<3)) process.exit(1);
          console.log('ALL_36_UPCOMING_ENTRIES_READY', JSON.stringify(rows));
          NODE
            then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'UPCOMING_ENTRY_REPAIR_NOT_COMPLETE' >&2
              exit 1
            fi
          done
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "WITH per_race AS (SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,SUM(CASE WHEN rr.runner_status='active' THEN 1 ELSE 0 END) AS activeRunners,MAX(r.entry_url) AS entryUrl FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id WHERE r.race_date='2026-08-22' GROUP BY r.race_id,r.venue,r.race_no) SELECT * FROM per_race ORDER BY venue,raceNo;" > /tmp/races.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key AS stateKey,state_value AS stateValue,updated_at AS updatedAt FROM rt_system_state WHERE state_key IN ('worker_upcoming_entry_derived_repair','worker_upcoming_entry_repair') ORDER BY state_key;" > /tmp/state.json
          mkdir -p analysis-results
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('analysis-results/final-upcoming-entry-repair.json',JSON.stringify({generatedAt:new Date().toISOString(),summary:JSON.parse(fs.readFileSync('/tmp/summary.json','utf8')),races:JSON.parse(fs.readFileSync('/tmp/races.json','utf8')),state:JSON.parse(fs.readFileSync('/tmp/state.json','utf8'))},null,2)+'\n');
          NODE
      - name: Persist final repair proof
        shell: bash
        run: |
          git add -f analysis-results/final-upcoming-entry-repair.json
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save final upcoming entry repair proof" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
