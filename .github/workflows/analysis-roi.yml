name: Legacy in-sample ROI diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch legacy analysis dataset
        run: |
          set -euo pipefail
          url="https://race-tantei-phase0.race-tantei.workers.dev/api/validation/analysis-data"
          curl --silent --show-error --fail --max-time 90 "$url" -o analysis-data.json

      - name: Run legacy optimizer as diagnostic only
        run: |
          python scripts/optimize_validation_roi.py analysis-data.json \
            --race-policies 300 \
            --ticket-policies 400 \
            --output analysis-roi-result.json

      - name: Publish warning and result
        if: always()
        run: |
          echo '## 旧インサンプル診断（本番昇格には使用しない）' >> "$GITHUB_STEP_SUMMARY"
          echo '- 同じ期間への最適化結果であり、将来回収率の根拠にはしません。' >> "$GITHUB_STEP_SUMMARY"
          if [ -f analysis-roi-result.json ]; then
            cat analysis-roi-result.json
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-in-sample-roi
          path: |
            analysis-data.json
            analysis-roi-result.json
          if-no-files-found: warn
