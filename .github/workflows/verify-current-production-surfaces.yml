name: Verify current production surfaces 20260919
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/verify-current-production-surfaces.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - name: Verify live health, deployments, schedules and public fallback
        shell: bash
        run: |
          set -euo pipefail
          for role in race-tantei-live-deadline race-tantei-live-deadline-backup; do
            echo "=== HEALTH $role ==="
            body=$(curl --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 -fsS "https://$role.race-tantei.workers.dev/health")
            echo "$body"
            BODY="$body" node - <<'NODE'
          const b=JSON.parse(process.env.BODY);
          if(b.status!=="up" || b.version!=="live-deadline-v11-persistent-miss-lastgood-20260919") throw new Error(JSON.stringify(b));
          NODE
            echo "=== DEPLOY $role ==="
            dep=$(curl --max-time 20 -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$role/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            DEP="$dep" node - <<'NODE'
          const b=JSON.parse(process.env.DEP); const d=(b.result?.deployments||b.result||[])[0];
          if(!b.success||!d||Number(d.versions?.[0]?.percentage)!==100) throw new Error(JSON.stringify(b));
          console.log(JSON.stringify({deploymentId:d.id,createdOn:d.created_on,versionId:d.versions[0].version_id,percentage:d.versions[0].percentage}));
          NODE
            echo "=== CRON $role ==="
            curl --max-time 20 -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$role/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo
          done
          echo "=== PUBLIC_DEPLOY ==="
          pdep=$(curl --max-time 20 -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/race-tantei-phase0/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          PDEP="$pdep" node - <<'NODE'
          const b=JSON.parse(process.env.PDEP); const d=(b.result?.deployments||b.result||[])[0];
          if(!b.success||!d||Number(d.versions?.[0]?.percentage)!==100) throw new Error(JSON.stringify(b));
          console.log(JSON.stringify({deploymentId:d.id,createdOn:d.created_on,versionId:d.versions[0].version_id,percentage:d.versions[0].percentage}));
          NODE
          echo "=== PUBLIC_CRON ==="
          curl --max-time 20 -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/race-tantei-phase0/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo
          echo "=== PUBLIC_DAY ==="
          day=$(curl --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-19")
          echo "$day"
          DAY="$day" node - <<'NODE'
          const b=JSON.parse(process.env.DAY); const rows=b.races||[];
          const counts={}; for(const r of rows){const c=r.publicState?.code||"";counts[c]=(counts[c]||0)+1}
          console.log("PUBLIC_STATE_COUNTS",JSON.stringify(counts));
          const selected=rows.filter(r=>["target","buy","hit","miss","overdue","missing"].includes(r.publicState?.code));
          console.log("PUBLIC_SELECTED",JSON.stringify(selected.map(r=>({raceId:r.raceId,code:r.publicState?.code,label:r.publicState?.label}))));
          if(rows.length!==24) throw new Error("PUBLIC_CARD_NOT_24");
          NODE
          echo "=== PUBLIC_PERF ==="
          curl --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/daily-performance?date=2026-09-19"
