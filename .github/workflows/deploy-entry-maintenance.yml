name: Deploy entry maintenance Worker

on:
  push:
    branches: [main]
    paths:
      - "src/published-entry-maintenance-entry.ts"
      - "src/v1/published-entry-maintenance.ts"
      - "src/v1/jra-entry-anchor-discovery.ts"
      - "wrangler.entry-maintenance.jsonc"
      - ".github/workflows/deploy-entry-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-race-tantei-entry-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate maintenance Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.entry-maintenance.jsonc --outdir dist-entry-maintenance
      # Two obsolete guardian schedules are removed before this production deploy,
      # so the Free-plan cron allocation can be used for entry acquisition.
      - name: Deploy maintenance Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.entry-maintenance.jsonc
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          url='https://race-tantei-entry-maintenance.race-tantei.workers.dev/health'
          for attempt in $(seq 1 10); do
            code=$(curl --max-time 10 -sS -o /tmp/health -w '%{http_code}' "$url" || true)
            echo "HEALTH_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = 200 ] && grep -q 'published-entry-v1' /tmp/health; then
              cat /tmp/health
              exit 0
            fi
            sleep 3
          done
          echo 'ENTRY_MAINTENANCE_HEALTH_FAILED' >&2
          cat /tmp/health 2>/dev/null || true
          exit 1
