name: Replay odds window audit
on:
  push:
    branches:
      - diag/replay-odds-window-20260923
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit snapshots
        shell: bash
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
          SELECT race_id AS raceId,
                 COUNT(*) AS rows,
                 COUNT(DISTINCT captured_at_utc) AS captures,
                 MIN(captured_at_utc) AS minCapture,
                 MAX(captured_at_utc) AS maxCapture,
                 MIN(seconds_to_start) AS minSeconds,
                 MAX(seconds_to_start) AS maxSeconds,
                 MIN(ABS(seconds_to_start-900)) AS nearestT15Sec,
                 COUNT(DISTINCT bet_type) AS betTypes
          FROM rt_official_odds_snapshots
          WHERE race_id IN (
            '2026-09-20-nakayama-02','2026-09-20-nakayama-03',
            '2026-09-20-hanshin-01','2026-09-20-hanshin-02','2026-09-20-hanshin-03','2026-09-20-hanshin-06',
            '2026-09-21-hanshin-02','2026-09-21-hanshin-03','2026-09-21-hanshin-06','2026-09-21-hanshin-08',
            '2026-09-22-nakayama-01','2026-09-22-nakayama-02','2026-09-22-nakayama-03','2026-09-22-nakayama-12'
          )
          GROUP BY race_id ORDER BY race_id
          "
          echo '=== NEAREST ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
          WITH caps AS (
            SELECT race_id,captured_at_utc,seconds_to_start,
                   COUNT(*) AS rows,COUNT(DISTINCT bet_type) AS types,
                   ROW_NUMBER() OVER(PARTITION BY race_id ORDER BY ABS(seconds_to_start-900), captured_at_utc DESC) AS rn
            FROM rt_official_odds_snapshots
            WHERE race_id LIKE '2026-09-20-%' OR race_id LIKE '2026-09-21-%' OR race_id LIKE '2026-09-22-%'
            GROUP BY race_id,captured_at_utc,seconds_to_start
            HAVING types=6
          )
          SELECT * FROM caps WHERE rn=1 ORDER BY race_id
          "
