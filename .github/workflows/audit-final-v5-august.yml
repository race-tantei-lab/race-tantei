name: Audit final v5 August

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-final-v5-august.yml"
      - "scripts/audit-final-v5-august.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit D1
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit-final-v5-august.py 2>&1 | tee final-v5-august-audit.log
      - name: Save audit
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in final-v5-august-audit.json final-v5-august-audit.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No audit change."
          else
            git commit -m "Save final v5 August audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Registered on main; trigger the first audit run.
