name: Diagnose Sep 19 missing finals from export
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/diag-sep19-missing-finals.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export state and preview archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/state.db /tmp/*.sql
          for table in rt_system_state rt_races rt_public_bets rt_live_preview_archive; do
            npx wrangler d1 export race-tantei-phase0 --remote --table "$table" --output "/tmp/$table.sql"
            sqlite3 /tmp/state.db < "/tmp/$table.sql"
          done
      - name: Diagnose selected races
        shell: bash
        run: |
          echo '=== SELECTED_LIVE_STATE ==='
          sqlite3 -json /tmp/state.db "
            WITH sel AS (
              SELECT json_extract(j.value,'$.raceId') race_id
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:2026-09-19'
            )
            SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.start_time_utc AS startTimeUtc,
              (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) finalRows,
              json_extract(p.state_value,'$.snapshots[0].generatedAt') AS previewGeneratedAt,
              json_extract(p.state_value,'$.snapshots[0].oddsFetchedAt') AS previewOddsFetchedAt,
              json_extract(p.state_value,'$.snapshots[0].oddsSource') AS previewOddsSource,
              json_extract(p.state_value,'$.snapshots[0].oddsParserVersion') AS previewParser,
              json_extract(f.state_value,'$.lockedAt') AS finalLockedAt,
              json_extract(f.state_value,'$.finalizedFrom') AS finalizedFrom
            FROM sel JOIN rt_races r ON r.race_id=sel.race_id
            LEFT JOIN rt_system_state p ON p.state_key='worker_live_preview:'||r.race_id
            LEFT JOIN rt_system_state f ON f.state_key='worker_live_final:'||r.race_id
            ORDER BY r.start_time_utc;"
          echo '=== ARCHIVE_MISSING_RACES ==='
          sqlite3 -json /tmp/state.db "
            SELECT race_id AS raceId,created_at AS createdAt,
              json_extract(state_value,'$.snapshots[0].generatedAt') AS generatedAt,
              json_extract(state_value,'$.snapshots[0].oddsFetchedAt') AS oddsFetchedAt,
              json_extract(state_value,'$.snapshots[0].oddsSource') AS oddsSource
            FROM rt_live_preview_archive
            WHERE race_id IN ('2026-09-19-nakayama-02','2026-09-19-nakayama-07','2026-09-19-nakayama-11')
            ORDER BY race_id,created_at;"
          echo '=== DRIVER_STATE ==='
          sqlite3 -json /tmp/state.db "
            SELECT state_key,state_value,updated_at
            FROM rt_system_state
            WHERE state_key IN (
              'live_deadline_driver:2026-09-19',
              'worker_live_lock:2026-09-19',
              'worker_deadline_guard:2026-09-19',
              'live_deadline_sla:2026-09-19'
            );"
