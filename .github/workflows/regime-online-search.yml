name: Regime full-period ROI completion search
run-name: Regime full-period ROI completion search · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-regime-online-search.py"
      - ".github/workflows/regime-online-search.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: regime-full-period-roi-completion-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish exploration start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/regime-full-period-search' \
            -f description='内部探索中：条件別オンライン実回収モデルを全期間検証' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Verify source and fixed rules
        run: |
          python -m py_compile scripts/analyze-regime-online-search.py
          python scripts/verify-race-tantei-fixed-constraints.py
      - name: Run regime exploration
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-regime-online-search.py 2>&1 | tee regime-online-search.log
      - name: Attempt promotion only through completion gate
        if: success()
        shell: bash
        run: |
          python scripts/find-and-promote-production-candidate.py | tee regime-promotion.log
          if [[ -f config/approved-production-model.json ]]; then
            python scripts/verify-approved-production-model.py
          fi
      - name: Stage internal result or approved completion
        if: success()
        shell: bash
        run: |
          git add -f analysis-results/exploration-regime-online.json
          if [[ -f config/approved-production-model.json ]]; then
            git add config/approved-production-model.json scripts/final-course-policy.py analysis-results/v16-completion-report.json
          fi
      - name: Upload exploration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-full-period-search
          path: |
            analysis-results/exploration-regime-online.json
            regime-online-search.log
            regime-promotion.log
          if-no-files-found: warn
          retention-days: 30
      - name: Save exploration state
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No exploration state changes to save."
          else
            git commit -m "Save regime full-period exploration result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            STATE=failure
            DESCRIPTION='内部探索処理でエラー。ログを確認'
          elif [[ -f config/approved-production-model.json ]]; then
            STATE=success
            DESCRIPTION='完成条件合格：全ゲート通過後にv16を昇格'
          else
            STATE=success
            DESCRIPTION='内部探索完了：完成条件通過前のため本番変更なし'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='analysis/regime-full-period-search' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
