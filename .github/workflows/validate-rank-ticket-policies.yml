name: Validate rank-only ticket policies
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check lightgbm==4.6.0 'numpy<3'
      - run: python .github/analysis/validate-rank-ticket-policies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-ticket-policy-validation
          path: artifacts/rank-ticket-policy-validation.json
          if-no-files-found: warn
          retention-days: 14
