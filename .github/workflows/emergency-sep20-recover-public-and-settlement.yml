name: Emergency Sep20 Recover Public and Settlement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep20-recover-public-and-settlement.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck main
        run: npm run typecheck

      - name: Deploy latest live primary and backup
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.live-deadline.jsonc | tee /tmp/live-primary-deploy.txt
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc | tee /tmp/live-backup-deploy.txt

      - name: Add one-shot settlement trigger locally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/public-site-entry-recovery-20260906.ts')
          s=p.read_text()
          marker='const RECOVERY_PATH = "/_ops/entry-seed-sync-20260906-7f4c9d2a";'
          repl=marker+'\nconst SEP19_SETTLE_RECOVERY_PATH = "/_ops/settle-20260919-8e4d17c2";'
          if marker not in s: raise SystemExit('RECOVERY_CONST_MARKER_MISSING')
          s=s.replace(marker,repl,1)
          marker2='''    if (request.method === "POST" && url.pathname === RECOVERY_PATH) {
      const audit = await runConfiguredEntrySeedWriteOnly(env, "2026-09-06");
      return Response.json(audit, {
        status: audit.status === "failed" ? 503 : 200,
        headers: { "cache-control": "no-store, max-age=0" },
      });
    }'''
          repl2='''    if (request.method === "POST" && url.pathname === SEP19_SETTLE_RECOVERY_PATH) {
      const audit = await runBoundedResultSettlement(env, new Date());
      return Response.json(audit, { headers: { "cache-control": "no-store, max-age=0" } });
    }
    if (url.pathname === SEP19_SETTLE_RECOVERY_PATH) return new Response("NOT_FOUND", { status: 404 });
''' + marker2
          if marker2 not in s: raise SystemExit('RECOVERY_FETCH_MARKER_MISSING')
          s=s.replace(marker2,repl2,1)
          p.write_text(s)
          PY
          npm run typecheck

      - name: Deploy temporary trigger and run settlement
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc | tee /tmp/public-temp-deploy.txt
          BASE=https://race-tantei-phase0.race-tantei.workers.dev
          for i in 1 2; do
            curl -fsS -X POST "$BASE/_ops/settle-20260919-8e4d17c2" -H 'cache-control: no-cache' | tee "/tmp/settle-$i.json"
            echo
            sleep 2
          done

      - name: Remove temporary trigger and deploy clean main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/public-site-entry-recovery-20260906.ts
          npm run typecheck
          npx wrangler deploy --config wrangler.jsonc | tee /tmp/public-clean-deploy.txt

      - name: Verify D1 APIs and home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
          }
          q "SELECT b.race_id AS raceId,COUNT(*) AS rows,SUM(b.settlement_status='settled') AS settledRows,SUM(b.settlement_status='pending') AS pendingRows,SUM(CASE WHEN COALESCE(b.return_yen,0)>0 THEN 1 ELSE 0 END) AS positiveReturnRows,r.status AS raceStatus,r.result_url AS resultUrl,(SELECT COUNT(*) FROM rt_payouts p WHERE p.race_id=b.race_id) AS payoutRows,(SELECT COUNT(*) FROM rt_results x WHERE x.race_id=b.race_id) AS resultRows FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-09-19' AND b.source_prediction_id=-2 GROUP BY b.race_id ORDER BY b.race_id" > /tmp/sep19.json
          q "WITH s AS (SELECT state_value FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-20' LIMIT 1), selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId,json_extract(j.value,'$.venue') AS venue,json_extract(j.value,'$.raceNo') AS raceNo FROM s,json_each(json_extract(s.state_value,'$.selected')) j) SELECT x.venue,x.raceNo,x.raceId,r.start_time_jst AS startTimeJst,r.start_time_utc AS startTimeUtc,(SELECT COUNT(*) FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||x.raceId) AS previewState,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId) AS finalRows,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId AND b.source_prediction_id=-2) AS sourceMinus2,(SELECT MIN(b.locked_at) FROM rt_public_bets b WHERE b.race_id=x.raceId) AS lockedAt FROM selected x JOIN rt_races r ON r.race_id=x.raceId ORDER BY r.start_time_utc" > /tmp/sep20.json
          q "SELECT state_value AS selection FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-20' LIMIT 1" > /tmp/selection.json
          BASE=https://race-tantei-phase0.race-tantei.workers.dev
          curl -fsS "$BASE/api/public/day?date=2026-09-19&_rt=$(date +%s)" > /tmp/day19.json
          curl -fsS "$BASE/api/public/day?date=2026-09-20&_rt=$(date +%s)" > /tmp/day20.json
          curl -fsS -D /tmp/home.headers -o /tmp/home.html "$BASE/?_rt=$(date +%s)"
          curl -fsS "$BASE/api/public/today-summary?_rt=$(date +%s)" > /tmp/summary.json

          python3 - <<'PY'
          import json,pathlib
          def cf(path):
              x=json.load(open(path)); return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          s19=cf('/tmp/sep19.json'); s20=cf('/tmp/sep20.json'); selrows=cf('/tmp/selection.json')
          selection=json.loads(selrows[0]['selection']) if selrows else {}
          d19=json.load(open('/tmp/day19.json')); d20=json.load(open('/tmp/day20.json')); summary=json.load(open('/tmp/summary.json'))
          home=pathlib.Path('/tmp/home.html').read_text(errors='replace'); headers=pathlib.Path('/tmp/home.headers').read_text(errors='replace')
          states19={r['raceId']:(r.get('publicState') or {}) for r in d19.get('races',[])}
          report={
            'sep19':s19,'sep20Selected':s20,'selection':selection,
            'sep19ApiSelectedStates':{rid:states19.get(rid) for rid in [x['raceId'] for x in s19]},
            'day20RaceCount':len(d20.get('races') or []),
            'day20SelectedStates':[{'raceId':r.get('raceId'),'venue':r.get('venue'),'raceNo':r.get('raceNo'),'publicState':r.get('publicState')} for r in d20.get('races',[]) if r.get('raceId') in {x.get('raceId') for x in (selection.get('selected') or [])}],
            'todaySummary':summary,
            'home':{
              'hasSep20Calendar':'"raceDate":"2026-09-20"' in home,
              'todayConst':'const today="2026-09-20";' in home,
              'todayUpperConst':'const TODAY="2026-09-20";' in home,
              'hasFalseOldEmpty':'本日（9/20）の公開買い目はありません。' in home,
              'headers':headers[:3000]
            },
            'settleRuns':[json.load(open('/tmp/settle-1.json')),json.load(open('/tmp/settle-2.json'))],
            'deployLogs':{
              'publicClean':pathlib.Path('/tmp/public-clean-deploy.txt').read_text(errors='replace')[-4000:],
              'livePrimary':pathlib.Path('/tmp/live-primary-deploy.txt').read_text(errors='replace')[-2500:],
              'liveBackup':pathlib.Path('/tmp/live-backup-deploy.txt').read_text(errors='replace')[-2500:]
            }
          }
          pathlib.Path('ops/sep20-final-recovery-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          # Hard gates.
          bad19=[x for x in s19 if x['raceId'] in ('2026-09-19-hanshin-05','2026-09-19-hanshin-06') and (int(x.get('pendingRows') or 0)!=0 or int(x.get('settledRows') or 0)!=6 or int(x.get('payoutRows') or 0)==0)]
          if bad19: raise SystemExit('SEP19_SETTLEMENT_STILL_BAD:'+json.dumps(bad19,ensure_ascii=False))
          for rid in ('2026-09-19-hanshin-05','2026-09-19-hanshin-06'):
              if (states19.get(rid) or {}).get('code') not in ('hit','miss','refund'):
                  raise SystemExit('SEP19_PUBLIC_STATE_BAD:'+rid+':'+json.dumps(states19.get(rid),ensure_ascii=False))
          if len(selection.get('selected') or [])!=10 or (selection.get('selectedVenueCounts') or {}).get('中山')!=5 or (selection.get('selectedVenueCounts') or {}).get('阪神')!=5:
              raise SystemExit('SEP20_SELECTION_BAD:'+json.dumps(selection,ensure_ascii=False))
          if len(d20.get('races') or [])!=24: raise SystemExit('SEP20_PUBLIC_DAY_NOT_24')
          if not report['home']['hasSep20Calendar'] or not report['home']['todayConst']:
              raise SystemExit('HOME_SEP20_NOT_VISIBLE:'+json.dumps(report['home'],ensure_ascii=False))
          if report['home']['hasFalseOldEmpty']:
              raise SystemExit('HOME_FALSE_EMPTY_STILL_VISIBLE')
          # Any selected race already within/past T-15 must have a final. Future ones
          # may still only have preview, which is expected until their lock window.
          import datetime
          now=datetime.datetime.now(datetime.timezone.utc)
          t15_bad=[]
          for r in s20:
              st=datetime.datetime.fromisoformat(str(r['startTimeUtc']).replace('Z','+00:00'))
              if (st-now).total_seconds()<=15*60 and (int(r.get('finalRows') or 0)!=6 or int(r.get('sourceMinus2') or 0)!=6):
                  t15_bad.append(r)
          if t15_bad: raise SystemExit('SEP20_T15_FINAL_BAD:'+json.dumps(t15_bad,ensure_ascii=False))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Persist final recovery report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/sep20-final-recovery-report.json || exit 0
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-final-recovery-report.json
          git commit -m "ops: verify Sep 20 public and Sep 19 settlement recovery" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
