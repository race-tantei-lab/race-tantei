name: ML feature meta replay check
on:
  push:
    branches:
      - diag/ml-meta-replay-20260923
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT key,value,updated_at AS updatedAt FROM rt_ml_feature_meta ORDER BY key"
