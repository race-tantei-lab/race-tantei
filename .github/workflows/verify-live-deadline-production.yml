name: Verify live deadline production readiness

on:
  push:
    branches: [main]
    paths:
      - "src/live-deadline-entry-v2.ts"
      - "src/live-deadline-entry-v3.ts"
      - "src/public-site-entry-recovery-20260906.ts"
      - "src/v1/live-preview-safety.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/v1/completed-final-invariants.ts"
      - "src/v1/jra-official-odds-fetch.ts"
      - "src/v1/jra-official-odds.ts"
      - "src/v1/race-day-gate.ts"
      - "scripts/install-race-day-runtime-guards.sql"
      - "scripts/verify-live-lock-safety.py"
      - "scripts/verify-race-day-gate.py"
      - "wrangler.jsonc"
      - "wrangler.live-deadline.jsonc"
      - "wrangler.live-deadline-backup.jsonc"
      - ".github/workflows/deploy-live-deadline.yml"
      - ".github/workflows/verify-live-deadline-production.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark production readiness pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='production/live-deadline-readiness' \
            -f description='Verifying bounded primary/standby production path' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Static safety verification
        run: |
          npm run typecheck
          python3 scripts/verify-live-lock-safety.py
          python3 scripts/verify-race-day-gate.py
      - name: Wait for production deploy and cron registration
        if: github.event_name == 'push'
        run: sleep 120
      - name: Verify isolated Workers are healthy and current
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('src/live-deadline-entry-v2.ts').read_text(encoding='utf-8')
          m=re.search(r'const\s+DRIVER_VERSION\s*=\s*"([^"]+)"',text)
          if not m: raise SystemExit('LIVE_DEADLINE_DRIVER_VERSION_NOT_FOUND')
          print(m.group(1))
          PY
          )
          for url in \
            'https://race-tantei-live-deadline.race-tantei.workers.dev/health' \
            'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
            body=$(curl --max-time 20 --retry 6 --retry-delay 5 --fail-with-body -sS "$url")
            echo "$url $body"
            BODY="$body" EXPECTED_VERSION="$expected_version" node - <<'NODE'
          const b=JSON.parse(process.env.BODY||'{}');
          if(b.status!=='up'||b.service!=='race-tantei-live-deadline'||b.version!==process.env.EXPECTED_VERSION) throw new Error('LIVE_HEALTH_OR_VERSION_BAD');
          NODE
          done
      - name: Verify Cloudflare primary and standby crons
        shell: bash
        run: |
          set -euo pipefail
          check_schedule() {
            script="$1"
            expected="$2"
            body=$(curl --max-time 20 --retry 4 --retry-delay 3 --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/schedules" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            BODY="$body" SCRIPT="$script" EXPECTED="$expected" node - <<'NODE'
          const b=JSON.parse(process.env.BODY||'{}');
          const s=Array.isArray(b.result?.schedules)?b.result.schedules.map(x=>String(x.cron)).sort():[];
          if(b.success!==true||s.length!==1||s[0]!==process.env.EXPECTED) throw new Error(`LIVE_CRON_BAD:${process.env.SCRIPT}:${JSON.stringify(s)}:expected=${process.env.EXPECTED}`);
          NODE
          }
          check_schedule 'race-tantei-live-deadline' '* * * * *'
          check_schedule 'race-tantei-live-deadline-backup' '2-59/5 * * * *'
      - name: Verify public Worker cannot mutate live bets
        run: |
          code=$(curl --max-time 20 -sS -o /tmp/public-live-tick-body -w '%{http_code}' -X POST \
            'https://race-tantei-phase0.race-tantei.workers.dev/_ops/live-tick' || true)
          test "$code" = "404"
      - name: Resolve JRA race-day gate for verifier
        id: race_day
        shell: bash
        run: |
          set -euo pipefail
          gate=$(npx tsx -e "import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts'; (async()=>{const r=await shouldRunOnJraRaceDay(new Date()); console.log(JSON.stringify(r));})().catch(e=>{console.error(e);process.exit(1)})")
          echo "$gate"
          should_run=$(GATE="$gate" node -e 'const g=JSON.parse(process.env.GATE||"{}"); process.stdout.write(g.shouldRun ? "true" : "false")')
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
      - name: Verify persistent D1 guards
        shell: bash
        run: |
          set -euo pipefail
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT name,type FROM sqlite_master WHERE name IN ('rt_live_preview_archive','rt_live_deadline_lease','rt_guard_final_bet_insert_deadline','rt_guard_final_state_insert_deadline','rt_guard_official_odds_final_insert','rt_ignore_unchanged_runner','rt_ignore_unchanged_race','rt_ignore_unchanged_system_state') ORDER BY name")
          echo "$rows"
          for name in rt_live_preview_archive rt_live_deadline_lease rt_guard_final_bet_insert_deadline rt_guard_final_state_insert_deadline rt_guard_official_odds_final_insert rt_ignore_unchanged_runner rt_ignore_unchanged_race rt_ignore_unchanged_system_state; do
            printf '%s' "$rows" | grep -Fq "$name"
          done
      - name: Verify primary heartbeat on race days
        if: steps.race_day.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          heartbeat=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT unixepoch('now')-unixepoch(updated_at) AS ageSeconds FROM rt_system_state WHERE state_key='live_deadline_primary_heartbeat:v1' LIMIT 1")
          echo "$heartbeat"
          HEARTBEAT="$heartbeat" node - <<'NODE'
          const p=JSON.parse(process.env.HEARTBEAT||'[]'); const r=p?.[0]?.results?.[0];
          if(!r) throw new Error('PRIMARY_HEARTBEAT_MISSING');
          const age=Number(r.ageSeconds); if(!Number.isFinite(age)||age < -30||age > 150) throw new Error(`PRIMARY_HEARTBEAT_STALE:${age}`);
          console.log(JSON.stringify({primaryHeartbeat:'ok',ageSeconds:age}));
          NODE
      - name: Verify completed live driver heartbeat on race days
        if: steps.race_day.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          state=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT updated_at AS updatedAt,unixepoch('now')-unixepoch(updated_at) AS ageSeconds,json_extract(state_value,'$.status') AS status,json_extract(state_value,'$.completedAt') AS completedAt FROM rt_system_state WHERE state_key='live_deadline_driver:${today}' LIMIT 1")
          STATE_JSON="$state" node - <<'NODE'
          const p=JSON.parse(process.env.STATE_JSON||'[]'); const r=p?.[0]?.results?.[0];
          if(!r) throw new Error('LIVE_DRIVER_STATE_MISSING');
          const age=Number(r.ageSeconds);
          if(!r.status||!r.completedAt||!Number.isFinite(age)||age < -30||age > 300) throw new Error(`LIVE_DRIVER_STATE_BAD:${JSON.stringify(r)}`);
          NODE
      - name: Verify T-40 selected races have official current previews on race days
        if: steps.race_day.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          expected_parser=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('src/v1/jra-official-odds-fetch.ts').read_text(encoding='utf-8')
          m=re.search(r'JRA_OFFICIAL_ODDS_PARSER_VERSION\s*=\s*"([^"]+)"', text)
          if not m: raise SystemExit('PARSER_VERSION_NOT_FOUND')
          print(m.group(1))
          PY
          )
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}'), q AS (SELECT r.race_id AS raceId,(julianday(r.start_time_utc)-julianday('now'))*1440.0 AS minutesToStart,(SELECT json_extract(p.state_value,'$.snapshots[0].oddsParserVersion') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id LIMIT 1) AS parserVersion,(SELECT json_extract(p.state_value,'$.snapshots[0].oddsSource') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id LIMIT 1) AS oddsSource FROM rt_races r JOIN selected x ON x.raceId=r.race_id) SELECT raceId,ROUND(minutesToStart,2) AS minutesToStart,parserVersion,oddsSource FROM q WHERE minutesToStart > 17 AND minutesToStart <= 40 ORDER BY minutesToStart")
          ROWS="$rows" EXPECTED_PARSER="$expected_parser" node - <<'NODE'
          const p=JSON.parse(process.env.ROWS||'[]'); const rows=p?.[0]?.results||[];
          const bad=rows.filter(r=>r.parserVersion!==process.env.EXPECTED_PARSER || !['jra-fast-official','jra-crawl-official'].includes(r.oddsSource));
          if(bad.length) throw new Error(`PREVIEW_T40_COVERAGE_INVALID:${JSON.stringify(bad)}`);
          console.log(JSON.stringify({PREVIEW_T40_COVERAGE_OK:true,checked:rows.length}));
          NODE
      - name: Verify every T-16 due selected race has exact six final rows on race days
        if: steps.race_day.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}'), q AS (SELECT r.race_id AS raceId,(julianday(r.start_time_utc)-julianday('now'))*1440.0 AS minutesToStart,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows FROM rt_races r JOIN selected x ON x.raceId=r.race_id) SELECT raceId,ROUND(minutesToStart,2) AS minutesToStart,finalRows FROM q WHERE minutesToStart BETWEEN 15 AND 16 ORDER BY minutesToStart")
          ROWS="$rows" node - <<'NODE'
          const p=JSON.parse(process.env.ROWS||'[]'); const rows=p?.[0]?.results||[];
          for(const r of rows){ if(Number(r.finalRows)!==6) throw new Error(`DUE_FINAL_NOT_SIX:${r.raceId}:${r.minutesToStart}:${r.finalRows}`); }
          console.log(JSON.stringify({dueFinalRows:'ok',checked:rows.length}));
          NODE
      - name: Mark production readiness success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='production/live-deadline-readiness' \
            -f description='Primary/standby, D1 guards and race-day duties verified' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark production readiness failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='production/live-deadline-readiness' \
            -f description='Live deadline readiness failed closed; inspect production state' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
