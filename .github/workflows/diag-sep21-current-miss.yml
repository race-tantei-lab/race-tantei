name: Diagnose Sep21 Current Miss

on:
  push:
    branches: [diag/sep21-current-miss]
    paths:
      - ".github/workflows/diag-sep21-current-miss.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Dump selected races and live states
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH sel AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:2026-09-21'
            )
            SELECT datetime('now','+9 hours') AS jstNow,
              r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.start_time_jst AS startTimeJst,
              ROUND((julianday(r.start_time_utc)-julianday('now'))*1440,2) AS remainingMin,
              (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
              (SELECT MIN(locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS lockedAt,
              (SELECT updated_at FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS previewUpdatedAt,
              (SELECT json_extract(p.state_value,'$.snapshots[0].generatedAt') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS previewGeneratedAt,
              (SELECT json_extract(p.state_value,'$.snapshots[0].oddsSource') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS oddsSource,
              (SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id=r.race_id) AS archiveRows
            FROM rt_races r JOIN sel ON sel.raceId=r.race_id
            ORDER BY r.start_time_utc
          "
      - name: Dump driver guard heartbeat and recovery
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key,updated_at,state_value
            FROM rt_system_state
            WHERE state_key IN (
              'live_deadline_driver:2026-09-21',
              'worker_deadline_guard:2026-09-21',
              'live_deadline_primary_heartbeat:v2',
              'worker_live_lock:2026-09-21'
            )
            OR state_key LIKE 'critical_pre_t15_recovery:%'
            ORDER BY state_key
          "
      - name: Public API
        run: curl -fsS 'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-21'
