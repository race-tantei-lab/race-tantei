name: Apply round three live lock hardening

on:
  push:
    branches:
      - hardening/live-lock-v35
    paths:
      - "scripts/harden-live-lock-round3.py"
      - ".github/workflows/apply-live-lock-hardening-round3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-live-lock-hardening-round3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/live-lock-v35
          fetch-depth: 0
      - name: Apply deterministic transform
        run: python scripts/harden-live-lock-round3.py
      - name: Commit hardened live lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/completed-worker-live-lock.ts
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m 'Harden preview generation and T-25 finalization'
          git push origin HEAD:hardening/live-lock-v35
