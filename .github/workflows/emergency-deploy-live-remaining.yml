name: Emergency Deploy Live Remaining Races

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-deploy-live-remaining.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Deploy live primary and backup immediately
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.live-deadline.jsonc | tee /tmp/primary.txt
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc | tee /tmp/backup.txt
      - name: Wait for cron and verify remaining protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'content-type: application/json' --data-binary @-
          }
          ok=0
          for i in $(seq 1 10); do
            sleep 12
            q "SELECT r.race_id AS raceId,r.start_time_jst AS startTimeJst,ROUND((julianday(r.start_time_utc)-julianday('now'))*1440.0,2) AS remainingMin,(SELECT COUNT(*) FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||r.race_id) AS previewState,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS sourceMinus2,(SELECT MIN(b.locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS lockedAt FROM rt_races r WHERE r.race_id IN ('2026-09-20-hanshin-09','2026-09-20-nakayama-11','2026-09-20-nakayama-12') ORDER BY r.start_time_utc" > /tmp/remaining.json
            if python3 - <<'PY'
          import json,sys
          x=json.load(open('/tmp/remaining.json'))
          rows=((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          d={r['raceId']:r for r in rows}
          # Past 阪神9 remains immutable missing. Remaining future races must be protected
          # by either preview or already-final rows.
          future=['2026-09-20-nakayama-11','2026-09-20-nakayama-12']
          good=all(int(d.get(r,{}).get('previewState') or 0)>0 or int(d.get(r,{}).get('finalRows') or 0)==6 for r in future)
          print(json.dumps(rows,ensure_ascii=False))
          sys.exit(0 if good else 1)
          PY
            then ok=1; break; fi
          done
          q "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('live_deadline_driver:2026-09-20','worker_live_lock:2026-09-20','worker_deadline_guard:2026-09-20') ORDER BY state_key" > /tmp/state.json
          python3 - <<'PY'
          import json,pathlib
          def cf(p):
              x=json.load(open(p)); return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          remaining=cf('/tmp/remaining.json')
          state=cf('/tmp/state.json')
          parsed={}
          for r in state:
              try: parsed[r['state_key']]=json.loads(r['state_value'])
              except: parsed[r['state_key']]=r.get('state_value')
          report={'remaining':remaining,'state':parsed}
          pathlib.Path('ops/sep20-remaining-after-live-fix.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          test "$ok" = 1
      - name: Persist verification
        if: always()
        shell: bash
        run: |
          test -f ops/sep20-remaining-after-live-fix.json || exit 0
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-remaining-after-live-fix.json
          git commit -m "ops: verify remaining Sep 20 races after live fix" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
