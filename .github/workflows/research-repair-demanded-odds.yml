name: Research repair demanded official odds
# Research only. Network-repair current pages first, then fill only residual failures from the audited Aug 8 official archive.

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-repair-demanded-odds.yml"
      - "scripts/research-resolve-demanded-odds-failures.mjs"
      - "scripts/research-fetch-resolved-demanded-official-odds.py"
      - "scripts/research-merge-demanded-odds-archive-repair.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  DEMAND_RUN_ID: '31373103782'
  ODDS_RUN_ID: '31373205723'
  HISTORY_ARTIFACT_ID: '9056288221'
  AUDITED_ODDS_ARCHIVE_ARTIFACT_ID: '9018047154'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mark repair pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-demanded-odds-repair' \
            -f description='Repairing odds gaps from official JRA network and audited archive' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build official archive helpers and install odds parser dependency
        run: |
          set -euo pipefail
          npm ci
          npm run build:test
          pip install beautifulsoup4==4.13.4

      - name: Confirm yearly demanded odds workflow completed
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}" --jq '.status')
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}" --jq '.conclusion // ""')
          echo "yearly odds: status=$status conclusion=$conclusion"
          test "$status" = "completed"
          test "$conclusion" = "success"

      - name: Download demand manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demand
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-ten-year-canonical-demand" and .expired==false) | .id' demand-artifacts.json | head -n1)
          test -n "$id" && test "$id" != "null"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          test -s demand/research-ten-year-canonical-demand.jsonl

      - name: Download assembled ten-year corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assembled
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip -d assembled
          test -s assembled/ten-year-history-corpus.jsonl

      - name: Download all yearly odds artifacts and failure metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-odds
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}/artifacts?per_page=100" > odds-artifacts.json
          for year in $(seq 2016 2026); do
            name="research-demanded-odds-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' odds-artifacts.json | head -n1)
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "missing artifact $name"; exit 1; fi
            mkdir -p "base-odds/$year"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$name.zip"
            unzip -q "$name.zip" -d "base-odds/$year"
          done
          count=$(find base-odds -name 'research-demanded-odds-*-meta.json' -type f | wc -l)
          test "$count" -eq 11

      - name: Resolve all failed races to official JRA result URLs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/research-resolve-demanded-odds-failures.mjs \
            --demand demand/research-ten-year-canonical-demand.jsonl \
            --meta-dir base-odds \
            --corpus assembled/ten-year-history-corpus.jsonl \
            --out analysis-results/research-demanded-odds-resolved-failures.jsonl \
            --meta analysis-results/research-demanded-odds-resolved-failures-meta.json

      - name: Fetch official final odds for resolved failed races only
        shell: bash
        run: |
          set -euo pipefail
          count=$(python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-demanded-odds-resolved-failures-meta.json').read_text())
          print(int(m['resolvedCount']))
          PY
          )
          if [ "$count" = "0" ]; then
            : > analysis-results/research-demanded-odds-repair.jsonl
            python - <<'PY'
          import json
          from pathlib import Path
          m={
            'purpose':'research_only_selective_official_final_odds_repair',
            'inputDemandRaces':0,'completedRaces':0,'failures':[],
            'syntheticOddsUsed':False,'productionDatabaseWritten':False,'productionModelChanged':False
          }
          Path('analysis-results/research-demanded-odds-repair-meta.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          else
            python scripts/research-fetch-resolved-demanded-official-odds.py \
              --input analysis-results/research-demanded-odds-resolved-failures.jsonl \
              --workers 3 \
              --out analysis-results/research-demanded-odds-repair.jsonl \
              --meta analysis-results/research-demanded-odds-repair-meta.json
          fi

      - name: Download audited Aug 8 official odds archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audited-archive
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDITED_ODDS_ARCHIVE_ARTIFACT_ID}/zip" > audited-archive.zip
          unzip -q audited-archive.zip -d audited-archive
          test -s audited-archive/all7695-official-odds.jsonl.gz
          test -s audited-archive/input-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('audited-archive/input-meta.json').read_text())
          assert int(m['races'])==7695 and int(m['uniqueOddsRaces'])==7695,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['estimatedOddsUsed'] is False,m
          assert m['outcomeBasedRaceFiltering'] is False,m
          print(json.dumps({'archiveRaces':m['races'],'coveragePct':m['coveragePct'],'synthetic':m['syntheticOddsUsed'],'estimated':m['estimatedOddsUsed']},ensure_ascii=False))
          PY

      - name: Fill residual failures from audited official archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research-merge-demanded-odds-archive-repair.py \
            --current-jsonl analysis-results/research-demanded-odds-repair.jsonl \
            --current-meta analysis-results/research-demanded-odds-repair-meta.json \
            --archive-gz audited-archive/all7695-official-odds.jsonl.gz \
            --archive-meta audited-archive/input-meta.json \
            --out-jsonl analysis-results/research-demanded-odds-repair.jsonl \
            --out-meta analysis-results/research-demanded-odds-repair-meta.json

      - name: Verify repair is complete and research-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('analysis-results/research-demanded-odds-resolved-failures-meta.json').read_text())
          m=json.loads(Path('analysis-results/research-demanded-odds-repair-meta.json').read_text())
          assert r['unresolvedCount']==0,r
          assert r['resolvedCount']==r['initialFailureCount'],r
          assert not m.get('failures'),m
          assert int(m.get('inputDemandRaces') or 0)==r['resolvedCount'],(r,m)
          assert int(m.get('completedRaces') or 0)==r['resolvedCount'],(r,m)
          assert int(m.get('networkRepairedRaces') or 0)+int(m.get('archiveRepairedRaces') or 0)==r['resolvedCount'],(r,m)
          assert int(m.get('archiveArtifactId') or 0)==9018047154,m
          assert r['syntheticOddsUsed'] is False and m['syntheticOddsUsed'] is False
          assert m['estimatedOddsUsed'] is False,m
          assert r['productionDatabaseWritten'] is False and m['productionDatabaseWritten'] is False
          assert r['productionModelChanged'] is False and m['productionModelChanged'] is False
          print(json.dumps({
            'initialFailures':r['initialFailureCount'],
            'networkRepaired':m['networkRepairedRaces'],
            'archiveRepaired':m['archiveRepairedRaces'],
            'repairedOdds':m['completedRaces'],
            'remainingFailures':len(m.get('failures',[])),
            'archiveArtifactId':m['archiveArtifactId']
          },ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-demanded-odds-repair
          path: |
            analysis-results/research-demanded-odds-resolved-failures.jsonl
            analysis-results/research-demanded-odds-resolved-failures-meta.json
            analysis-results/research-demanded-odds-repair.jsonl
            analysis-results/research-demanded-odds-repair-meta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Mark repair success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-demanded-odds-repair' \
            -f description='All demanded odds gaps repaired from official JRA sources with zero synthetic odds' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark repair failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-demanded-odds-repair' \
            -f description='Targeted demanded odds repair still needs correction' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
