name: Audit D1 insights now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-d1-insights-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Top D1 queries by rows read
        run: |
          npx wrangler d1 insights race-tantei-phase0 --time-period 6h --sort-type sum --sort-by reads --sort-direction DESC --limit 30 --json | tee /tmp/d1-insights.json
