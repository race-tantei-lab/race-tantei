name: Research Aug-Nov 2026 frozen single-win hypothesis vs JRA final official odds

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-aug-nov-frozen-policy-recheck.py
      - .github/workflows/research-aug-nov-frozen-policy-recheck.yml

permissions:
  contents: read

concurrency:
  group: research-aug-nov-frozen-official-final-odds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recheck-2026-aug-nov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific and JRA HTML parsing libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1' 'beautifulsoup4==4.13.4'
      - name: Validate syntax and no-hindsight fixed-policy selection
        run: |
          python -m py_compile scripts/research-aug-nov-frozen-policy-recheck.py
          python -u scripts/research-aug-nov-frozen-policy-recheck.py --self-test
      - name: Rebuild 56-feature 2025-frozen model, replay 2026 features and fetch historical JRA final win quotes
        run: python -u scripts/research-aug-nov-frozen-policy-recheck.py
      - name: Upload reproducible retrospective, NEVER promote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aug-nov-2026-frozen-12plus-jra-final-win-odds
          path: analysis-results/research-aug-nov-frozen-12plus-official-final-odds-20261107.json
          if-no-files-found: warn
          retention-days: 30
