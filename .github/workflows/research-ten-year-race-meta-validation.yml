name: Research ten-year race metadata validation

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - "scripts/research-ten-year-race-meta-validation.py"
      - "scripts/research-ten-year-race-meta-validation-v2.py"
      - ".github/workflows/research-ten-year-race-meta-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark metadata validation pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-race-meta' \
            -f description='Validating historical race metadata' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile metadata validator
        run: python -m py_compile scripts/research-ten-year-race-meta-validation-v2.py
      - name: Validate 2016-2026 metadata
        shell: bash
        run: |
          set -o pipefail
          python scripts/research-ten-year-race-meta-validation-v2.py | tee research-ten-year-race-meta.log
      - name: Upload metadata audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ten-year-race-meta-validation
          path: |
            analysis-results/research-ten-year-race-meta-validation.json
            research-ten-year-race-meta.log
          if-no-files-found: error
          retention-days: 30
      - name: Mark metadata validation success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-race-meta' \
            -f description='Historical race metadata validated' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark metadata validation failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-race-meta' \
            -f description='Historical race metadata validation failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
