name: Research 2024-trained payout value model evaluated on 2025 actual JRA hit and ROI

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-two-stage-payout-value-2024-2025.py
      - .github/workflows/research-two-stage-payout-value-2024-2025.yml

permissions:
  contents: read

concurrency:
  group: payout-stage2-2025-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chronological-payout-value:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned actual-JRA research dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Syntax and exact combo payout self test
        run: |
          python -m py_compile scripts/research-two-stage-payout-value-2024-2025.py
          python scripts/research-two-stage-payout-value-2024-2025.py --self-test
      - name: Fit value model on past-only 2024 labels and settle independently held 2025 records
        run: python -u scripts/research-two-stage-payout-value-2024-2025.py
      - name: Preserve same-cohort hit, ROI, payouts, exclusions and model specification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payout-stage2-2025-actual-jra-same-races
          path: analysis-results/payout-value-stage2-2024train-2025actual-jra.json
          if-no-files-found: warn
          retention-days: 30
