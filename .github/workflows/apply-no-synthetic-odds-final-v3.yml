name: Apply synthetic odds root fix v3
on:
  push:
    branches:
      - fix/no-synthetic-odds-final-20260816
    paths:
      - .github/workflows/apply-no-synthetic-odds-final-v3.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-synthetic-odds-final-20260816
      - name: Block synthetic final
        run: sed -i 's/await commitFallback(env.DB, raceId, race, runners, now);/throw new Error(`DEADLINE_GUARD_OFFICIAL_ODDS_REQUIRED:${raceId}`);/' src/v1/completed-worker-deadline-guard.ts
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add src/v1/completed-worker-deadline-guard.ts
          git commit -m 'Require official odds for deadline finalization'
          git push origin HEAD:fix/no-synthetic-odds-final-20260816
