name: Research preserve provisional 2026 transfer shard

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-diagnose-2026-eval-error.yml"
      - "scripts/research-evaluate-canonical-transfer-fast.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  HISTORY_ARTIFACT_ID: '9056288221'
  DEMAND_RUN_ID: '31373103782'
  ODDS_2026_ARTIFACT_ID: '9063550877'
  PARTIAL_REPAIR_ARTIFACT_ID: '9067680353'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark 2026 provisional shard pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/2026-transfer-provisional-clean' \
            -f description='Preserving evaluated 2026 races with unresolved races explicit' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Download 2026 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds repair
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-ten-year-canonical-demand" and .expired==false) | .id' demand-artifacts.json | head -n1)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ODDS_2026_ARTIFACT_ID}/zip" > odds.zip
          unzip -q odds.zip -d odds
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARTIAL_REPAIR_ARTIFACT_ID}/zip" > repair.zip
          unzip -q repair.zip -d repair
      - name: Evaluate 2026 and keep result even with explicitly unresolved races
        shell: bash
        run: |
          set +e
          python scripts/research-evaluate-canonical-transfer-year.py \
            --year 2026 \
            --corpus history/ten-year-history-corpus.jsonl \
            --demand demand/research-ten-year-canonical-demand.jsonl \
            --rules demand/research-canonical-rules-297.json \
            --odds odds/research-demanded-odds-2026.jsonl \
            --repair repair/research-demanded-odds-repair.jsonl \
            --out analysis-results/research-canonical-transfer-2026-provisional.json
          echo $? > analysis-results/research-canonical-transfer-2026-exit.txt
          exit 0
      - name: Verify unresolved races are explicit, never treated as losses
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-canonical-transfer-2026-provisional.json').read_text())
          assert m['selectedDemandRaces']==900,m
          assert m['missingOddsRaceCount']==30,m
          assert m['evaluatedRaces']==862,m
          assert m['evaluationErrorCount']==8,m
          assert not m['missingDemandRacesInCorpus'],m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          unresolved=set(m['missingOddsRaceIds']) | {e['raceId'] for e in m['evaluationErrors']}
          assert len(unresolved)==38,(len(unresolved),unresolved)
          print(json.dumps({
            'evaluated':m['evaluatedRaces'],'missingFinalOdds':m['missingOddsRaceCount'],
            'evaluationErrors':m['evaluationErrorCount'],'unresolvedUnique':len(unresolved),
            'errors':m['evaluationErrors'],
            'roiObserved':{k:v['roiPct'] for k,v in m['courses'].items()},
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-canonical-transfer-2026-provisional-clean
          path: |
            analysis-results/research-canonical-transfer-2026-provisional.json
            analysis-results/research-canonical-transfer-2026-exit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Mark provisional shard success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/2026-transfer-provisional-clean' \
            -f description='2026 provisional shard preserved; 38 unresolved races explicit' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark provisional shard failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/2026-transfer-provisional-clean' \
            -f description='2026 provisional shard integrity check failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
