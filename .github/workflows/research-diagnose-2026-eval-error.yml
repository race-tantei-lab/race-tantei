name: Research verify fixed 2026 transfer shard

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-diagnose-2026-eval-error.yml"
      - "scripts/research-evaluate-canonical-transfer-fast.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  HISTORY_ARTIFACT_ID: '9056288221'
  DEMAND_RUN_ID: '31373103782'
  ODDS_2026_ARTIFACT_ID: '9063550877'
  PARTIAL_REPAIR_ARTIFACT_ID: '9067680353'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark 2026 verification pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/2026-transfer-fixed' \
            -f description='Re-evaluating 2026 with official final-odds betting field' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Download 2026 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds repair
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-ten-year-canonical-demand" and .expired==false) | .id' demand-artifacts.json | head -n1)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ODDS_2026_ARTIFACT_ID}/zip" > odds.zip
          unzip -q odds.zip -d odds
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARTIAL_REPAIR_ARTIFACT_ID}/zip" > repair.zip
          unzip -q repair.zip -d repair
      - name: Evaluate fixed 2026 shard
        run: |
          set -euo pipefail
          python scripts/research-evaluate-canonical-transfer-year.py \
            --year 2026 \
            --corpus history/ten-year-history-corpus.jsonl \
            --demand demand/research-ten-year-canonical-demand.jsonl \
            --rules demand/research-canonical-rules-297.json \
            --odds odds/research-demanded-odds-2026.jsonl \
            --repair repair/research-demanded-odds-repair.jsonl \
            --out analysis-results/research-canonical-transfer-2026-fixed.json
      - name: Verify 2026 shard integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-canonical-transfer-2026-fixed.json').read_text())
          assert m['selectedDemandRaces']==900,m
          assert m['missingOddsRaceCount']==30,m
          assert m['evaluatedRaces']==870,m
          assert m['evaluationErrorCount']==0,m
          assert not m['missingDemandRacesInCorpus'],m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps({'evaluated':m['evaluatedRaces'],'missing':m['missingOddsRaceCount'],'roi':{k:v['roiPct'] for k,v in m['courses'].items()},'lowerBound':{k:v['zeroReturnLowerBoundRoiPct'] for k,v in m['courses'].items()}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-canonical-transfer-2026-fixed
          path: analysis-results/research-canonical-transfer-2026-fixed.json
          if-no-files-found: error
          retention-days: 30
      - name: Mark 2026 verification success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/2026-transfer-fixed' \
            -f description='2026 shard evaluated with zero errors; 30 final-odds races explicitly missing' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark 2026 verification failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/2026-transfer-fixed' \
            -f description='2026 shard still needs targeted correction' -f target_url="$STATUS_TARGET_URL" >/dev/null
