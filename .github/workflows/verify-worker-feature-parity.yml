name: Verify Worker Feature Parity

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-worker-feature-parity.yml
      - scripts/build-worker-feature-parity.py
      - scripts/verify-worker-feature-parity.ts
      - src/v1/completed-feature-runtime.ts
      - scripts/ten-year-production-core.py
      - models/ten-year-runner-feature-state.json.gz

permissions:
  contents: read

concurrency:
  group: verify-worker-feature-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python feature fixture from current JRA day
        run: python scripts/build-worker-feature-parity.py

      - name: Verify exact TypeScript feature parity
        run: npx tsx scripts/verify-worker-feature-parity.ts

      - name: Upload parity fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-feature-parity
          path: worker-feature-parity.json
          if-no-files-found: warn
          retention-days: 7
