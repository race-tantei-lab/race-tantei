name: Verify restored read-only cash research sites live
on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-performance-history-fix-20260915.ts"
      - ".github/workflows/verify-independent-sites-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check original unchanged and research sites no longer expose unvalidated independent picks
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in $(seq 1 25); do
            success=1
            curl -fsS --retry 2 --retry-delay 2 "$base/" -o /tmp/original.html || success=0
            grep -Fq 'id="races"' /tmp/original.html || success=0
            for mode in 6m 96m; do
              curl -fsS --retry 2 --retry-delay 2 -D "/tmp/${mode}.headers" "$base/models/${mode}?date=2026-11-08" -o "/tmp/${mode}.html" || success=0
              grep -Fiq 'x-race-model-full-page: standalone-v3' "/tmp/${mode}.headers" || success=0
              grep -Fq 'data-model-filter="true"' "/tmp/${mode}.html" || success=0
              grep -Fq '参考予想' "/tmp/${mode}.html" || success=0
              ! grep -Fiq 'x-race-independent-model: cash' "/tmp/${mode}.headers" || success=0
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base/models/${mode}/api/public/day?date=2026-11-08")" = "404" || success=0
            done
            if test "$success" = "1"; then
              echo RESTORED_RESEARCH_PAGES_AND_ORIGINAL_SITE_LIVE_OK
              exit 0
            fi
            sleep 15
          done
          echo RESTORED_RESEARCH_PAGES_LIVE_FAILED >&2
          exit 1
