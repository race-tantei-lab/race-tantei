name: Verify canonical-only homepage without retired features
on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-performance-history-fix-20260915.ts"
      - "src/v1/retired-public-features-ui.ts"
      - ".github/workflows/verify-independent-sites-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify original race metrics and deleted unused red-box/WIN5/adhoc sections
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in $(seq 1 25); do
            success=1
            curl -fsS --retry 2 --retry-delay 2 "$base/" -o /tmp/canonical.html || success=0
            grep -Fq 'id="races"' /tmp/canonical.html || success=0
            ! grep -Fq '716.83%研究モデル' /tmp/canonical.html || success=0
            ! grep -Fq '直近6か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq '過去96か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq 'prediction-model-tabs' /tmp/canonical.html || success=0
            ! grep -Fq 'data-prediction-model=' /tmp/canonical.html || success=0
            ! grep -Fq '/models/6m' /tmp/canonical.html || success=0
            ! grep -Fq '選定外のレースも予想できます' /tmp/canonical.html || success=0
            ! grep -Fq '指定レースを予想する' /tmp/canonical.html || success=0
            ! grep -Fq '開催日を選んで予想・結果を確認できます。' /tmp/canonical.html || success=0
            ! grep -Fq '予想・買い目は各レース詳細で確認' /tmp/canonical.html || success=0
            ! grep -Fq 'class="hero home-hero-compact"' /tmp/canonical.html || success=0
            ! grep -Fq 'class="home-live-learning home-guide-compact"' /tmp/canonical.html || success=0
            ! grep -Fq 'href="/adhoc"' /tmp/canonical.html || success=0
            ! grep -Fq 'href="/win5"' /tmp/canonical.html || success=0
            grep -Fq '累計回収率' /tmp/canonical.html || success=0
            grep -Fq '会場別回収率' /tmp/canonical.html || success=0
            for path in /models /models/6m /models/6m/races/2026-11-08-tokyo-01 /models/96m /models/96m/races/2026-11-08-tokyo-01 /models/compare /models/6m/api/public/day?date=2026-11-08; do
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base$path")" = "404" || success=0
            done
            for path in /adhoc /adhoc/ /api/adhoc/races /api/adhoc/status /win5 /win5/ /api/win5 /api/public/win5; do
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base$path")" = "404" || success=0
            done
            if test "$success" = "1"; then
              echo CANONICAL_ONLY_RETIRED_UI_ADHOC_WIN5_GONE_SITE_LIVE_OK
              exit 0
            fi
            sleep 10
          done
          echo RETIRED_MODELS_STILL_VISIBLE_OR_CANONICAL_UNHEALTHY >&2
          exit 1
