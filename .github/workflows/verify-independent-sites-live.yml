name: Verify canonical-only site and all retired model paths
on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-performance-history-fix-20260915.ts"
      - ".github/workflows/verify-independent-sites-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify unchanged canonical homepage and no retired 716 percent pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in $(seq 1 25); do
            success=1
            curl -fsS --retry 2 --retry-delay 2 "$base/" -o /tmp/canonical.html || success=0
            grep -Fq 'id="races"' /tmp/canonical.html || success=0
            ! grep -Fq '716.83%研究モデル' /tmp/canonical.html || success=0
            ! grep -Fq '直近6か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq '過去96か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq 'prediction-model-tabs' /tmp/canonical.html || success=0
            ! grep -Fq 'data-prediction-model=' /tmp/canonical.html || success=0
            ! grep -Fq '/models/6m' /tmp/canonical.html || success=0
            for path in /models /models/6m /models/6m/races/2026-11-08-tokyo-01 /models/96m /models/96m/races/2026-11-08-tokyo-01 /models/compare /models/6m/api/public/day?date=2026-11-08; do
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base$path")" = "404" || success=0
            done
            if test "$success" = "1"; then
              echo CANONICAL_ONLY_NO_716_OR_6M_OR_96M_SITE_LIVE_OK
              exit 0
            fi
            sleep 10
          done
          echo RETIRED_MODELS_STILL_VISIBLE_OR_CANONICAL_UNHEALTHY >&2
          exit 1
