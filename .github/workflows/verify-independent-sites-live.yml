name: Verify canonical-only homepage without retired features
on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-performance-history-fix-20260915.ts"
      - "src/v1/venue-period-performance.ts"
      - "src/v1/venue-period-ui.ts"
      - "src/v1/venue-period-history.json"
      - "src/v1/retired-public-features-ui.ts"
      - ".github/workflows/verify-independent-sites-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify original race metrics and deleted unused red-box/WIN5/adhoc sections
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in $(seq 1 25); do
            success=1
            curl -fsS --retry 2 --retry-delay 2 "$base/" -o /tmp/canonical.html || success=0
            grep -Fq 'id="races"' /tmp/canonical.html || success=0
            ! grep -Fq '716.83%研究モデル' /tmp/canonical.html || success=0
            ! grep -Fq '直近6か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq '過去96か月モデル' /tmp/canonical.html || success=0
            ! grep -Fq 'prediction-model-tabs' /tmp/canonical.html || success=0
            ! grep -Fq 'data-prediction-model=' /tmp/canonical.html || success=0
            ! grep -Fq '/models/6m' /tmp/canonical.html || success=0
            ! grep -Fq '選定外のレースも予想できます' /tmp/canonical.html || success=0
            ! grep -Fq '指定レースを予想する' /tmp/canonical.html || success=0
            ! grep -Fq '開催日を選んで予想・結果を確認できます。' /tmp/canonical.html || success=0
            ! grep -Fq '予想・買い目は各レース詳細で確認' /tmp/canonical.html || success=0
            ! grep -Fq 'class="hero home-hero-compact"' /tmp/canonical.html || success=0
            ! grep -Fq 'class="home-live-learning home-guide-compact"' /tmp/canonical.html || success=0
            ! grep -Fq 'href="/adhoc"' /tmp/canonical.html || success=0
            ! grep -Fq 'href="/win5"' /tmp/canonical.html || success=0
            ! grep -Fq '累計回収率（ライト）' /tmp/canonical.html || success=0
            ! grep -Fq '会場別回収率（ライト）' /tmp/canonical.html || success=0
            ! grep -Fq 'class="metrics shared-roi"' /tmp/canonical.html || success=0
            ! grep -Fq 'class="venue-roi-rail shared-venue-roi"' /tmp/canonical.html || success=0
            grep -Fq '<details class="roi-collapse" id="roi-fold">' /tmp/canonical.html || success=0
            grep -Fq '<summary aria-label="回収率を見る・閉じる">' /tmp/canonical.html || success=0
            grep -Fq '競馬場ごとの月別・年別' /tmp/canonical.html || success=0
            grep -Fq 'id="venue-period-roi"' /tmp/canonical.html || success=0
            grep -Fq 'data-venue-period-mode="month"' /tmp/canonical.html || success=0
            grep -Fq 'data-venue-period-mode="year"' /tmp/canonical.html || success=0
            curl -fsS --retry 2 --retry-delay 2 "$base/api/public/venue-period-performance" -o /tmp/venue-period.json || success=0
            if test -s /tmp/venue-period.json; then
              python3 - <<'PY' || success=0
          import json
          x=json.load(open("/tmp/venue-period.json"))
          html=open("/tmp/canonical.html",encoding="utf8").read()
          first=html.index('<details class="roi-collapse" id="roi-fold">')
          end=html.index('</div></details><section class="daily-performance-wrap"',first)
          content=html[first:end]
          for required in ('id="venue-period-roi"','会場別・年別／月別回収率','id="venue-period-rows"'):
           assert required in content,required
          for obsolete in ('累計回収率','会場別回収率（ライト）','class="metrics shared-roi"','class="venue-roi-rail shared-venue-roi"'):
           assert obsolete not in content,obsolete
          assert 'open' not in html[first:first+len('<details class="roi-collapse" id="roi-fold">')]
          assert 'id="races"' in html[end:]
          assert html.count('id="roi-fold"')==1
          assert x.get("ok") is True
          assert x.get("version")=="venue-period-roi-v1-canonical-light"
          assert x.get("basis")=="ten-year-backtest-plus-production-light-settled-complete-pairs"
          assert x.get("historicalRaces")==14410
          assert x.get("historicalThrough")=="2026-08-09"
          assert len(x.get("venues",[]))==11
          assert len(x.get("months",[]))>400 and len(x.get("years",[]))>30
          assert sum(int(r["stakeYen"]) for r in x["years"] if r["venue"]=="全会場") >= 28820000
          for r in x["months"]+x["years"]:
           assert r["races"]>0 and r["stakeYen"]>0
           assert abs(r["roiPct"]-r["returnYen"]/r["stakeYen"]*100)<1e-6
          print("LIVE_VENUE_MONTH_YEAR_ROI_FINANCIAL_INTEGRITY_OK",x["productionRaces"],x["updatedAt"])
          PY
            else
              success=0
            fi
            for path in /models /models/6m /models/6m/races/2026-11-08-tokyo-01 /models/96m /models/96m/races/2026-11-08-tokyo-01 /models/compare /models/6m/api/public/day?date=2026-11-08; do
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base$path")" = "404" || success=0
            done
            for path in /adhoc /adhoc/ /api/adhoc/races /api/adhoc/status /win5 /win5/ /api/win5 /api/public/win5; do
              test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base$path")" = "404" || success=0
            done
            if test "$success" = "1"; then
              echo CANONICAL_ONLY_RETIRED_UI_ADHOC_WIN5_GONE_SITE_LIVE_OK
              exit 0
            fi
            sleep 10
          done
          echo RETIRED_MODELS_STILL_VISIBLE_OR_CANONICAL_UNHEALTHY >&2
          exit 1
