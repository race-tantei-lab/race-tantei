name: Verify restored 716 percent model and retired 96m URLs
on:
  push:
    branches: [main]
    paths:
      - "src/public-site-entry-performance-history-fix-20260915.ts"
      - ".github/workflows/verify-independent-sites-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check original and six-month pages, absent 96-month public interface
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for i in $(seq 1 25); do
            success=1
            curl -fsS --retry 2 --retry-delay 2 "$base/" -o /tmp/original.html || success=0
            grep -Fq 'id="races"' /tmp/original.html || success=0
            curl -fsS --retry 2 --retry-delay 2 -D /tmp/6m.headers "$base/models/6m?date=2026-11-08" -o /tmp/6m.html || success=0
            grep -Fiq 'x-race-model-full-page: standalone-v3' /tmp/6m.headers || success=0
            grep -Fq 'data-model-filter="true"' /tmp/6m.html || success=0
            grep -Fq '参考予想' /tmp/6m.html || success=0
            grep -Fq '716.83%研究モデル' /tmp/6m.html || success=0
            grep -Fq '5レース' /tmp/6m.html || success=0
            grep -Fq '3レース' /tmp/6m.html || success=0
            grep -Fq '100円単位' /tmp/6m.html || success=0
            ! grep -Fq '1,800円、他方に200円' /tmp/6m.html || success=0
            ! grep -Fq '過去96か月モデル' /tmp/6m.html || success=0
            ! grep -Fq '/models/96m' /tmp/6m.html || success=0
            grep -Fq '716.83%研究モデル' /tmp/original.html || success=0
            ! grep -Fq '過去96か月モデル' /tmp/original.html || success=0
            test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base/models/96m")" = "404" || success=0
            test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base/models/96m/races/2026-11-08-tokyo-01")" = "404" || success=0
            test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base/models/6m/api/public/day?date=2026-11-08")" = "404" || success=0
            test "$(curl -sS --retry 2 -o /dev/null -w '%{http_code}' "$base/models/compare")" = "302" || success=0
            if test "$success" = "1"; then
              echo RESTORED_716_PERCENT_TWO_MODELS_LIVE_OK
              exit 0
            fi
            sleep 15
          done
          echo TWO_MODELS_SITE_LIVE_FAILED >&2
          exit 1
