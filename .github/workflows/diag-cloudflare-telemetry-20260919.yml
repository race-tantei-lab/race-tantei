name: Diagnose Cloudflare telemetry 20260919
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/diag-cloudflare-telemetry-20260919.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - name: Script settings and deployments
        shell: bash
        run: |
          set +e
          for script in race-tantei-live-deadline race-tantei-live-deadline-backup race-tantei-phase0; do
            echo "=== SETTINGS $script ==="
            curl --max-time 20 -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/settings"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo
            echo "=== DEPLOYMENTS $script ==="
            curl --max-time 20 -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/deployments"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo
          done
      - name: Observability keys
        shell: bash
        run: |
          set +e
          echo "=== OBSERVABILITY_KEYS ==="
          curl --max-time 30 -sS -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data '{"limit":1000,"from":1758258000000,"to":1758270000000}'
          echo
          exit 0
