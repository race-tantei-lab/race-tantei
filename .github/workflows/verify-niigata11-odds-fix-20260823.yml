name: Verify Niigata11 odds fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-niigata11-odds-fix-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify live official odds and preview
        shell: bash
        run: |
          set -euo pipefail
          race='2026-08-23-niigata-11'
          echo '=== TIME ==='; TZ=Asia/Tokyo date -Is
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,start_time_jst,start_time_utc,entry_url FROM rt_races WHERE race_id='$race'" > /tmp/race.json
          cat /tmp/race.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT horse_no,horse_name,win_odds,popularity,updated_at FROM rt_runners WHERE race_id='$race' ORDER BY horse_no" > /tmp/runners.json
          echo '=== D1 RUNNER ODDS ==='; cat /tmp/runners.json
          entry=$(node -e "const p=require('/tmp/race.json');process.stdout.write(p[0].results[0].entry_url)")
          ENTRY_URL="$entry" npx tsx -e "import {fetchFastJraOfficialOddsForRace} from './src/v1/jra-official-odds-fetch.ts'; (async()=>{const r=await fetchFastJraOfficialOddsForRace(process.env.ENTRY_URL!,{raceDate:'2026-08-23',venue:'新潟',raceNo:11}); const win=r.rows.filter(x=>x.betType==='単勝').sort((a,b)=>Number(a.combination)-Number(b.combination)); console.log('=== FRESH JRA WIN ODDS ==='); console.log(JSON.stringify({source:r.source,host:r.sourceHost,win},null,2)); if(win.length<3) throw new Error('WIN_ROWS_TOO_FEW'); if(win.some(x=>!Number.isFinite(x.oddsMin)||x.oddsMin<=1)) throw new Error('INVALID_WIN_ODDS'); const implied=win.reduce((s,x)=>s+1/x.oddsMin,0); console.log('implied_probability_sum='+implied); if(implied>1.8) throw new Error('WIN_MARKET_SANITY_HIGH:'+implied); })()"
          echo '=== CURRENT PREVIEW / FINAL ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('worker_live_preview:$race','worker_live_final:$race') ORDER BY state_key"
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/niigata11-odds-fix' -f description='Fresh JRA odds parser verified after fix' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/niigata11-odds-fix' -f description='Fresh JRA odds parser verification failed' -f target_url="$STATUS_TARGET_URL" >/dev/null