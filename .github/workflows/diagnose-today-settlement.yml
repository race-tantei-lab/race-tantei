name: Diagnose today settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-today-settlement.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print today settlement evidence
        run: |
          python - <<'PY'
          import datetime as dt,importlib.util,json,pathlib,sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('diag',p);m=importlib.util.module_from_spec(s);sys.modules['diag']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          races=m.d1_query('''SELECT DISTINCT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.race_name AS raceName,r.status,r.result_url AS resultUrl,r.refund_horse_nos_json AS refunds
                              FROM rt_races r JOIN rt_public_bets b ON b.race_id=r.race_id
                              WHERE r.race_date=? AND r.status='finished' ORDER BY r.start_time_utc''',[date])
          bets=m.d1_query('''SELECT b.race_id AS raceId,b.course,b.bet_type AS betType,b.combination,b.stake_yen AS stakeYen,b.settlement_status AS settlementStatus,b.return_yen AS returnYen
                             FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id
                             WHERE r.race_date=? AND r.status='finished' ORDER BY b.race_id,b.id''',[date])
          payouts=m.d1_query('''SELECT p.race_id AS raceId,p.bet_type AS betType,p.combination,p.payout_yen AS payoutYen,p.popularity
                                FROM rt_payouts p JOIN rt_races r ON r.race_id=p.race_id
                                WHERE r.race_date=? ORDER BY p.race_id,p.bet_type,p.combination''',[date])
          schema=m.d1_query('PRAGMA table_info(rt_runners)')
          print('RACES='+json.dumps(races,ensure_ascii=False))
          print('BETS='+json.dumps(bets,ensure_ascii=False))
          print('PAYOUTS='+json.dumps(payouts,ensure_ascii=False))
          print('RUNNER_SCHEMA='+json.dumps(schema,ensure_ascii=False))
          cols={x.get('name') for x in schema}
          candidates=[x for x in ('finish_position','finish_order','result_rank','rank','placing','arrival_order') if x in cols]
          if candidates:
              col=candidates[0]
              rows=m.d1_query(f'''SELECT rr.race_id AS raceId,rr.horse_no AS horseNo,rr.horse_name AS horseName,rr.{col} AS finishValue
                                  FROM rt_runners rr JOIN rt_races r ON r.race_id=rr.race_id
                                  WHERE r.race_date=? AND r.status='finished' ORDER BY rr.race_id,rr.{col}''',[date])
              print('FINISHERS='+json.dumps(rows,ensure_ascii=False))
          PY
