name: Check race-day recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/race-day-scheduler-v37-recovery-static.test.mjs
