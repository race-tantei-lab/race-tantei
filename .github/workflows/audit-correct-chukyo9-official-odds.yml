name: Audit and correct Chukyo 9R official odds
on:
  push:
    branches:
      - ops/finalize-niigata9-20260816
    paths:
      - .github/workflows/audit-correct-chukyo9-official-odds.yml
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit and correct official odds only if synthetic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        shell: bash
        run: |
          cat > /tmp/chukyo9.ts <<'TS'
          async function main(){
            const mod:any=await import(process.cwd()+'/src/v1/jra-official-odds-fetch.ts');
            const rid='2026-08-16-chukyo-09';
            const ep=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.CLOUDFLARE_D1_DATABASE_ID}/query`;
            async function q(sql:string,params:any[]=[]){const r=await fetch(ep,{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const j:any=await r.json();if(!j.success)throw new Error(JSON.stringify(j.errors));return j.result?.[0]?.results??[];}
            const race=(await q('SELECT race_date AS raceDate,venue,race_no AS raceNo,entry_url AS entryUrl,start_time_utc AS startTimeUtc FROM rt_races WHERE race_id=? LIMIT 1',[rid]))[0];
            const bets=await q('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,assumed_odds AS assumedOdds,locked_at AS lockedAt,source_prediction_id AS sourcePredictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid]);
            const sr=(await q('SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1',[`worker_live_final:${rid}`]))[0];
            const state=sr?.value?JSON.parse(sr.value):null;
            console.log('BEFORE='+JSON.stringify({race,bets,state}));
            if(!state||bets.length!==6){console.log('NOT_FINAL');return;}
            if(state.oddsAvailable!==false&&state.oddsMode!=='probability_fallback'){console.log('OFFICIAL_ALREADY='+JSON.stringify({bets,oddsMode:state.oddsMode,oddsSource:state.oddsSource}));return;}
            const start=Date.parse(race.startTimeUtc);if(Date.now()>=start)throw new Error('REFUSE_POST_START');
            const fetched=await mod.fetchFastJraOfficialOddsForRace(race.entryUrl,{raceDate:race.raceDate,venue:race.venue,raceNo:Number(race.raceNo)});
            const sig=[...new Set(bets.map((x:any)=>`${x.betType}:${x.combination}`))];
            const om=new Map<string,number>();for(const x of fetched.rows){const mid=(Number(x.oddsMin)+Number(x.oddsMax))/2;if(Number.isFinite(mid)&&mid>0)om.set(`${x.betType}:${x.combination}`,mid);}
            for(const s of sig){if(!om.has(s))throw new Error(`ODDS_MISSING:${s}`);const i=s.indexOf(':');const bt=s.slice(0,i),co=s.slice(i+1);await q('UPDATE rt_public_bets SET assumed_odds=? WHERE race_id=? AND bet_type=? AND combination=? AND source_prediction_id=-2',[Number(om.get(s)!.toFixed(6)),rid,bt,co]);}
            const lockedAt=state.lockedAt, correctedAt=new Date().toISOString();state.oddsAvailable=true;state.oddsMode='official_correction_pre_start';state.oddsFetchedAt=correctedAt;state.oddsSource=fetched.source;state.oddsCorrectedAt=correctedAt;state.tickets=(state.tickets??[]).map((t:any)=>{const o=om.get(`${t.betType}:${t.combination}`);return o?{...t,officialOdds:Number(o.toFixed(6))}:t;});if(state.lockedAt!==lockedAt)throw new Error('LOCK_CHANGED');
            await q('UPDATE rt_system_state SET state_value=?,updated_at=CURRENT_TIMESTAMP WHERE state_key=?',[JSON.stringify(state),`worker_live_final:${rid}`]);
            const after=await q('SELECT course,bet_type AS betType,combination,assumed_odds AS assumedOdds,locked_at AS lockedAt FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid]);console.log('CORRECTED='+JSON.stringify({source:fetched.source,odds:Object.fromEntries(sig.map(s=>[s,om.get(s)])),lockedAt,after}));
          } main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx tsx /tmp/chukyo9.ts
