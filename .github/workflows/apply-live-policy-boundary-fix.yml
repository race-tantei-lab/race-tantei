name: Apply live safety gate fix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-live-policy-boundary-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch safety gate
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/backup_wrangler.get("triggers", {}).get("crons", \[\]) != \["\* \* \* \* \*"\]/backup_wrangler.get("triggers", {}).get("crons", []) != ["2-59\/5 * * * *"]/' scripts/verify-live-lock-safety.py
          sed -i 's/backup standby must check primary health every minute/backup standby must check primary health every five minutes/' scripts/verify-live-lock-safety.py
          sed -i '/"WORKER_HARD_T15_START_MISSED",/a\        "ids.length !== 15",\n        "counts.size !== 3",\n        "startMs - generationStartedMs <= DEADLINE_MS",\n        "if (remaining <= DEADLINE_MS)",' scripts/verify-live-lock-safety.py
          grep -F '2-59/5 * * * *' scripts/verify-live-lock-safety.py
          grep -F 'ids.length !== 15' scripts/verify-live-lock-safety.py
          grep -F 'startMs - generationStartedMs <= DEADLINE_MS' scripts/verify-live-lock-safety.py
      - name: Verify safety gate
        run: |
          npm ci
          npm run typecheck
          python3 scripts/verify-live-lock-safety.py
          npx --yes tsx tests/jra-official-odds-fetch-tests.ts
          npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name race-tantei-bot
          git config user.email race-tantei-bot@users.noreply.github.com
          rm -f .github/workflows/apply-live-policy-boundary-fix.yml
          git add -A scripts/verify-live-lock-safety.py .github/workflows/apply-live-policy-boundary-fix.yml
          git commit -m 'fix: enforce quota-safe standby policy in live safety gate'
          git push origin HEAD:main
