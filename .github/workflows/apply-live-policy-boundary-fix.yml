name: Apply live policy boundary fix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-live-policy-boundary-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/new Set(ids).size !== ids.length || counts.size < 2 || \[...counts.values()\].some((count) => count !== 5)/ids.length !== 15 || new Set(ids).size !== ids.length || counts.size !== 3 || [...counts.values()].some((count) => count !== 5)/' src/v1/completed-worker-live-lock.ts
          sed -i 's/startMs - generationStartedMs < DEADLINE_MS/startMs - generationStartedMs <= DEADLINE_MS/' src/v1/completed-worker-live-lock.ts
          sed -i 's/if (remaining < DEADLINE_MS) {/if (remaining <= DEADLINE_MS) {/' src/v1/completed-worker-live-lock.ts
          grep -F 'ids.length !== 15' src/v1/completed-worker-live-lock.ts
          grep -F 'startMs - generationStartedMs <= DEADLINE_MS' src/v1/completed-worker-live-lock.ts
          grep -F 'if (remaining <= DEADLINE_MS)' src/v1/completed-worker-live-lock.ts
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npx --yes tsx tests/jra-official-odds-fetch-tests.ts
          npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name race-tantei-bot
          git config user.email race-tantei-bot@users.noreply.github.com
          git add src/v1/completed-worker-live-lock.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: enforce 15-race selection and strict T-15 boundary'
          git push origin HEAD:main
