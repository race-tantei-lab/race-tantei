name: Apply live safety gate fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-live-policy-boundary-fix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/apply-live-safety-fix.sh
      - run: npm ci
      - run: npm run typecheck
      - run: python3 scripts/verify-live-lock-safety.py
      - run: npx --yes tsx tests/jra-official-odds-fetch-tests.ts
      - run: npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
      - name: Commit
        run: |
          git config user.name race-tantei-bot
          git config user.email race-tantei-bot@users.noreply.github.com
          git add scripts/verify-live-lock-safety.py
          git commit -m 'fix: enforce quota-safe standby policy in live safety gate'
          git push origin HEAD:main
