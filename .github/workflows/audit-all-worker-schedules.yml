name: Audit all production Worker schedules
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/audit-all-worker-schedules.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - name: List Worker scripts and schedules
        shell: bash
        run: |
          set -euo pipefail
          scripts=$(curl --max-time 30 -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$scripts" > /tmp/scripts.json
          node - <<'NODE' >/tmp/names
          const b=require('/tmp/scripts.json');
          const rows=Array.isArray(b.result)?b.result:[];
          for(const x of rows) console.log(x.id||x.etag||x.name||'');
          NODE
          while read -r script; do
            [ -z "$script" ] && continue
            echo "=== SCRIPT $script ==="
            curl --max-time 20 -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo
          done </tmp/names
