name: Validate live deadline proof v36

on:
  push:
    branches: [hardening/live-proof-v36]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: validate-live-proof-v36
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark proof pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='hardening/live-deadline-proof-v36' \
            -f description='Running exhaustive 15-race live deadline proof' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck complete repository
        run: npm run typecheck
      - name: Compile test suite
        run: npm run build:test
      - name: Exhaustive 15-race full-day fault simulation
        run: node dist-test/tests/live-deadline-full-day-proof-tests.js
      - name: Strict T-15 boundary regression
        run: node dist-test/tests/completed-worker-deadline-guard-tests.js
      - name: Verify production architecture markers
        run: python scripts/verify-live-deadline-proof.py
      - name: Verify existing canonical final rows have no duplicate ticket identity
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT race_id,course,bet_type,COUNT(*) AS c FROM rt_public_bets WHERE source_prediction_id=-2 GROUP BY race_id,course,bet_type HAVING COUNT(*)>1 LIMIT 10")
          echo "$result"
          RESULT="$result" python - <<'PY'
          import json, os
          body = json.loads(os.environ['RESULT'])
          rows = []
          for part in body:
              rows.extend(part.get('results') or [])
          if rows:
              raise SystemExit('duplicate canonical final rows: ' + json.dumps(rows, ensure_ascii=False))
          print('canonical final duplicate check: ok')
          PY
      - name: Build primary isolated Worker
        run: npx wrangler deploy --dry-run --config wrangler.live-deadline.jsonc --outdir dist-live-proof-primary
      - name: Build backup isolated Worker
        run: npx wrangler deploy --dry-run --config wrangler.live-deadline-backup.jsonc --outdir dist-live-proof-backup
      - name: Mark proof success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='hardening/live-deadline-proof-v36' \
            -f description='15-race fault matrix, D1 duplicate audit, T-15 boundary and dual builds passed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark proof failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='hardening/live-deadline-proof-v36' \
            -f description='Live deadline proof v36 failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
