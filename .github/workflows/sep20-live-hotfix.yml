name: Sep20 Live Hotfix Deploy Verify

on:
  push:
    branches: [ops/sep20-live-hotfix]
    paths:
      - "src/live-deadline-entry-v2.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - ".github/workflows/sep20-live-hotfix.yml"

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck hotfix
        run: npm run typecheck
      - name: Pure fallback smoke
        run: |
          npx --yes tsx -e "import {chooseCompletedProbabilityFallbackTickets,emergencyRunnerWeights} from './src/v1/completed-ticket-fallback.ts'; import {completedCourseBets} from './src/v1/completed-ticket-runtime.ts'; const h=[1,2,3,4,5,6]; const w=emergencyRunnerWeights([2,3,4,5,6,7]); const t=chooseCompletedProbabilityFallbackTickets(h,w); const b=completedCourseBets(t); if(t.length!==2||new Set(t.map(x=>x.betType)).size!==2||b.length!==6) throw new Error('FALLBACK_SHAPE_BAD'); console.log('FALLBACK_SHAPE_OK',JSON.stringify(t));"
      - name: Deploy live primary and backup
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc
      - name: Wait for autonomous cron and verify
        shell: bash
        run: |
          set -euo pipefail
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
          }
          ok=0
          for attempt in $(seq 1 10); do
            sleep 15
            q "SELECT datetime('now','+9 hours') AS jstNow,(SELECT COUNT(*) FROM rt_system_state WHERE state_key='worker_live_preview:2026-09-20-nakayama-11') AS nakayama11Preview,(SELECT COUNT(*) FROM rt_public_bets WHERE race_id='2026-09-20-nakayama-11') AS nakayama11Final,(SELECT COUNT(*) FROM rt_public_bets WHERE race_id='2026-09-20-nakayama-07') AS immutableMissingNakayama07,(SELECT COUNT(*) FROM rt_public_bets WHERE race_id='2026-09-20-hanshin-09') AS immutableMissingHanshin09,(SELECT state_value FROM rt_system_state WHERE state_key='live_deadline_driver:2026-09-20' LIMIT 1) AS driver" > /tmp/probe.json
            cat /tmp/probe.json
            if python3 - <<'PY'
          import json,sys
          x=json.load(open('/tmp/probe.json'))
          r=((x.get('result') or [{}])[0].get('results') or [{}])[0]
          try:d=json.loads(r.get('driver') or '{}')
          except:d={}
          good=(int(r.get('nakayama11Preview') or 0)==1
                and int(r.get('immutableMissingNakayama07') or 0)==0
                and int(r.get('immutableMissingHanshin09') or 0)==0
                and str(d.get('version') or '')=='live-deadline-v12-preview-first-fallback-20260920'
                and d.get('phase')=='complete')
          print(json.dumps({'row':r,'driverStatus':d.get('status'),'driverVersion':d.get('version'),'good':good},ensure_ascii=False))
          sys.exit(0 if good else 1)
          PY
            then ok=1; break; fi
          done
          test "$ok" = 1
      - name: Verify live health version
        run: |
          set -euo pipefail
          for u in             https://race-tantei-live-deadline.race-tantei.workers.dev/health             https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health
          do
            body=$(curl -fsS "$u")
            echo "$body"
            echo "$body" | grep -q 'live-deadline-v12-preview-first-fallback-20260920'
          done
