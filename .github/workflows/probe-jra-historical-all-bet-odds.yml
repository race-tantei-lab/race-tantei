name: Probe all JRA historical official bet odds

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe-jra-historical-all-bet-odds.py"
      - ".github/workflows/probe-jra-historical-all-bet-odds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify probe source
        run: python -m py_compile scripts/probe-jra-historical-all-bet-odds.py
      - name: Probe historical all-bet official odds
        run: python scripts/probe-jra-historical-all-bet-odds.py
      - name: Save probe report
        shell: bash
        run: |
          git add -f analysis-results/jra-historical-all-bet-odds-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No probe changes to save."
          else
            git commit -m "Save JRA historical all-bet odds probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
