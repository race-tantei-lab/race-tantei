name: Verify Worker JRA Odds Parity

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-worker-odds-parity.yml
      - scripts/build-worker-odds-parity.py
      - scripts/verify-worker-odds-parity.ts
      - src/v1/jra-official-odds.ts
      - scripts/collect-jra-official-odds.py

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

permissions:
  contents: read

concurrency:
  group: verify-worker-jra-odds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build live official JRA odds fixture
        run: python scripts/build-worker-odds-parity.py

      - name: Verify TypeScript parser against canonical Python parser
        run: npx tsx scripts/verify-worker-odds-parity.ts

      - name: Upload live parity fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-jra-odds-parity
          path: worker-odds-parity.json
          if-no-files-found: warn
          retention-days: 2
