name: Research joint draw-field cash conditions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas requests
      - name: Fetch pinned settled racing records
        run: |
          git clone --filter=blob:none https://github.com/Kenseimk/keiba-agent.git /tmp/keiba-agent
          git -C /tmp/keiba-agent checkout f552ca8628646f39b05ffdbdc3ab8734939ffd66
          mkdir -p external-jra-cash-decade
          find /tmp/keiba-agent -type f -name 'raceresults_*.csv' -exec cp {} external-jra-cash-decade/ \;
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -ge 80
      - name: Cash settle finite conditions
        run: python scripts/research-nov2026-relative-draw-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-draw-form-cash-results
          path: |
            analysis-results/nov2026-relative-draw-cash-roi200.json
            analysis-results/nov2026-relative-draw-robust-cells.csv.gz
          if-no-files-found: warn
          retention-days: 7
