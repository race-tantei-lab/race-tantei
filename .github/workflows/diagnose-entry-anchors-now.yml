name: Diagnose entry anchors now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-entry-anchors-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Export race URL metadata without rows_read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result') or {}
          opts={'tables':['rt_races']}
          result=post({'output_format':'polling','dump_options':opts});bookmark=result.get('at_bookmark')
          for _ in range(60):
            signed=(result.get('result') or {}).get('signed_url')
            if signed: break
            time.sleep(1);result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':opts})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=120) as r: open('/tmp/races.sql','wb').write(r.read())
          print('EXPORT_BYTES',os.path.getsize('/tmp/races.sql'))
          PY

      - name: Print usable anchors and current entry URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sqlite3
          con=sqlite3.connect('/tmp/races.sqlite')
          con.executescript(open('/tmp/races.sql',encoding='utf-8').read())
          current=con.execute("""
            SELECT venue,race_no,entry_url FROM rt_races
            WHERE race_date='2026-09-06' AND length(trim(coalesce(entry_url,'')))>0
            ORDER BY venue,race_no
          """).fetchall()
          print('CURRENT_0906_ENTRY_URLS',json.dumps([{'venue':v,'raceNo':n,'url':u} for v,n,u in current],ensure_ascii=False))
          for venue in ('札幌','中山','阪神'):
            rows=con.execute("""
              SELECT race_date,race_no,meeting_no,meeting_day,entry_url FROM rt_races
              WHERE venue=? AND race_no=1 AND race_date<'2026-09-06'
                AND entry_url LIKE '%/JRADB/accessD.html?CNAME=pw01dde01%'
              ORDER BY race_date DESC LIMIT 20
            """,(venue,)).fetchall()
            print('RACE1_HISTORY',venue,json.dumps([{'date':d,'raceNo':n,'meetingNo':m,'meetingDay':md,'url':u} for d,n,m,md,u in rows],ensure_ascii=False))
          con.close()
          PY
