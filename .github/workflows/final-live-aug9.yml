name: Final live August 9 lock
run-name: Final live August 9 · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: final-live-aug9
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_ODDS_REQUEST_PAUSE_SECONDS: '0.50'
      JRA_ODDS_D1_BATCH_ROWS: '20'
    steps:
      - name: Mark live lock pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/final-live-lock' -f description='8月9日固定済み買い目の手動監査を実行中' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Compile frozen live pipeline
        run: python -m py_compile scripts/repair-aug9-official-program.py scripts/collect-jra-official-odds.py scripts/collect-jra-official-odds-runtime.py scripts/collect-current-jra-official-odds.py scripts/collect-current-jra-official-odds-fast.py scripts/collect-current-jra-official-odds-live.py scripts/generate-final-preday-selection.py scripts/generate-final-preday-selection-remote.py scripts/final-rules-payload.py scripts/generate-final-live-bets.py scripts/generate-final-live-bets-batched.py

      - name: Repair August 9 official race program
        run: python scripts/repair-aug9-official-program.py

      - name: Rebuild fixed five races directly from D1 without target results
        run: |
          mkdir -p analysis-results
          python scripts/generate-final-preday-selection-remote.py --date 2026-08-09 --out analysis-results/final-aug9-selection.json
          python - <<'PY'
          import json
          x=json.load(open('analysis-results/final-aug9-selection.json',encoding='utf-8'))
          assert x['resultDataUsedForTargetDay'] is False
          assert len(x['selected'])==15
          for v in ('札幌','新潟','中京'):
              assert sum(r['venue']==v for r in x['selected'])==5
          assert all(int(r['distanceM'])>0 for r in x['selected'])
          print('reselected',[(r['venue'],r['raceNo'],r['raceName'],r['startTimeJst']) for r in x['selected']])
          PY

      - name: Collect official odds for fixed targets
        run: |
          python scripts/collect-current-jra-official-odds-live.py | tee /tmp/final-live-odds.log
          test -s current-selected-official-odds.json.gz
          test -s official-odds-collection-report.json
          cat official-odds-collection-report.json

      - name: Verify immutable existing bets without replacing them
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,COUNT(*) AS rows,COUNT(DISTINCT course) AS courses,MIN(locked_at) AS lockedAt FROM rt_public_bets WHERE race_id LIKE '2026-08-09-%' GROUP BY race_id ORDER BY race_id" > analysis-results/final-aug9-live-d1.json
          cat analysis-results/final-aug9-live-d1.json
          python - <<'PY'
          import json
          x=json.load(open('analysis-results/final-aug9-live-d1.json',encoding='utf-8'))
          rows=[]
          for block in x:
              rows.extend(block.get('results',[]))
          assert rows, 'AUG9_PUBLIC_BETS_MISSING'
          print('aug9 immutable public bets verified',len(rows))
          PY

      - name: Mark live lock audit success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/final-live-lock' -f description='8月9日固定済み買い目を変更せず監査完了' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark live lock audit failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/final-live-lock' -f description='8月9日固定済み買い目の監査に失敗' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
