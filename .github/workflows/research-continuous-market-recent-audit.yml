name: Research continuous market recent audit

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-continuous-market-recent-audit.yml"
      - "scripts/research-evaluate-continuous-market-value.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  RECENT_ODDS_RUN_ID: '31446902302'
  REPAIR_RUN_ID: '31447072766'
  BEST_DEMAND_RUN_ID: '31417411680'
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending \
            -f context='research/continuous-market-recent-audit' -f description='Auditing completed 2024-2026 official-odds segment' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Download history and frozen selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds repair analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > h.zip
          unzip -q h.zip ten-year-history-corpus.jsonl -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BEST_DEMAND_RUN_ID}/artifacts?per_page=100" > d.json
          id=$(jq -r '.artifacts[] | select(.name=="research-blend-0.60" and .expired==false) | .id' d.json | head -n1)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > d.zip
          unzip -q d.zip -d demand
      - name: Download recent shards and residual repair
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECENT_ODDS_RUN_ID}/artifacts?per_page=100" > recent.json
          for year in 2024 2025 2026; do
            name="research-continuous-market-odds-recent-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' recent.json | head -n1)
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$year.zip"
            mkdir -p "tmp-$year"; unzip -q "$year.zip" -d "tmp-$year"
            cp "tmp-$year/research-continuous-market-odds-${year}.jsonl" odds/
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}/artifacts?per_page=100" > repair.json
          rid=$(jq -r '.artifacts[] | select(.name=="research-continuous-market-odds-repair" and .expired==false) | .id' repair.json | head -n1)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${rid}/zip" > repair.zip
          unzip -q repair.zip -d repair
      - name: Merge repaired rows into recent shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          by={str(y):{} for y in (2024,2025,2026)}
          for y in by:
            p=Path(f'odds/research-continuous-market-odds-{y}.jsonl')
            for line in p.read_text().splitlines():
              if line.strip():
                r=json.loads(line);by[y][str(r['raceId'])]=r
          rp=Path('repair/research-continuous-market-odds-repair.jsonl')
          repairs=[json.loads(x) for x in rp.read_text().splitlines() if x.strip()]
          for r in repairs:
            y=str(r['raceDate'])[:4];by[y][str(r['raceId'])]=r
          for y,rows in by.items():
            Path(f'odds/research-continuous-market-odds-{y}.jsonl').write_text(''.join(json.dumps(rows[k],ensure_ascii=False,separators=(',',':'))+'\n' for k in sorted(rows)))
          print(json.dumps({'counts':{y:len(x) for y,x in by.items()},'repairs':len(repairs)},ensure_ascii=False))
          PY
      - name: Evaluate completed recent segment
        run: |
          python scripts/research-evaluate-continuous-market-value.py \
            --corpus history/ten-year-history-corpus.jsonl --demand demand/demand.jsonl --odds-dir odds \
            --out analysis-results/recent-audit.json
      - name: Summarize recent completeness and ROI
        run: |
          python - <<'PY'
          import json,collections
          from pathlib import Path
          m=json.loads(Path('analysis-results/recent-audit.json').read_text());b=m['bestVariant'];v=m['variants'][b]
          errs=[e for e in v['evaluationErrors'] if str(e['raceDate'])[:4] in {'2024','2025','2026'}]
          out={'best':b,'evaluated':v['evaluatedRaces'],'candidateErrorRaces':len({e['raceId'] for e in errs}),'errorKinds':dict(collections.Counter(e['error'].split(':',1)[0] for e in errs)),'overallPartialRoi':{c:v['courses'][c]['roiPct'] for c in v['courses']},'byYear':{c:{y:s['roiPct'] for y,s in v['courses'][c]['byYear'].items()} for c in v['courses']},'missingSelectedOutsideRecentExpected':m['missingOddsRaceCount'],'syntheticOddsUsed':m['syntheticOddsUsed']}
          Path('analysis-results/recent-audit-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n');print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-continuous-market-recent-audit
          path: |
            analysis-results/recent-audit.json
            analysis-results/recent-audit-summary.json
          retention-days: 14
      - name: Mark success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success \
            -f context='research/continuous-market-recent-audit' -f description='2024-2026 market-value audit completed' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure \
            -f context='research/continuous-market-recent-audit' -f description='Recent market-value audit requires repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
