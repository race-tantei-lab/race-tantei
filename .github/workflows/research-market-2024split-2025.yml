name: Research 2024 market residual train and 2025 JRA payout (NOT T15)

on:
  pull_request:
    branches:
      - research/market-residual-ranker-20261108
    paths:
      - scripts/research-market-2024-split-calibration-2025.py
      - scripts/research-market-residual-ranker-2025.py
      - .github/workflows/research-market-2024split-2025.yml

permissions:
  contents: read

concurrency:
  group: market-residual-2024splits-2025-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-t15-market-correction-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned historical machine-learning packages
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Validate structural model + actual price feature code
        run: |
          python -m py_compile scripts/research-market-2024-split-calibration-2025.py
          python -u scripts/research-market-2024-split-calibration-2025.py --self-test
      - name: Train 2024 market residual, train later-2024 payoff head, audit all 2025 actual JRA payouts
        run: python -u scripts/research-market-2024-split-calibration-2025.py
      - name: Upload paired actual-JRA hit and ROI evidence (historical final odds != preT15)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2024split-market-residual-2025-jra-roi-not-t15
          path: analysis-results/market-residual-2024split-2025jra.json
          if-no-files-found: warn
          retention-days: 30
