name: Research ten-year historical odds validation

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - "scripts/research-ten-year-odds-validation.py"
      - ".github/workflows/research-ten-year-odds-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.45"
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mark validation pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-odds' \
            -f description='Validating JRA historical odds across 2016-2026' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation scripts
        run: |
          python -m py_compile \
            scripts/research-ten-year-odds-validation.py \
            scripts/validate-jra-historical-parser-across-period.py \
            scripts/validate-jra-historical-combination-parser.py \
            scripts/collect-jra-official-odds.py

      - name: Validate official historical odds
        shell: bash
        run: |
          set -o pipefail
          python scripts/research-ten-year-odds-validation.py | tee research-ten-year-odds.log

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ten-year-odds-validation
          path: |
            analysis-results/research-ten-year-odds-validation.json
            research-ten-year-odds.log
          if-no-files-found: error
          retention-days: 30

      - name: Mark validation success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-odds' \
            -f description='Historical odds validated across 2016-2026' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark validation failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-odds' \
            -f description='Historical odds validation incomplete' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
