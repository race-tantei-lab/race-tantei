name: Research independent past-year LightGBM real-yen cash payout and forward 82-day audit
on:
  push:
    branches:
      - research/20261114-ml-cash-return-independent
permissions:
  contents: read
jobs:
  learn-actual-cash-posterior-and-select-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1 beautifulsoup4==4.13.4
      - name: Verify chronology, cash ROI and strict HIT20 ledger mathematics
        run: |
          python -m py_compile scripts/research-20261114-ml-expected-cash.py
          python scripts/research-20261114-ml-expected-cash.py --self-test
      - name: Restore chronological runner form and payout cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
            analysis-results
          key: historical-payout-mirror-v1
          restore-keys: |
            historical-payout-
      - name: Load pinned 136 monthly six-market payout records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/multiticket_months
          cat /tmp/multiticket_months | xargs -P 8 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Train 10 independent expanding-year past-only actual payout models and cross-period cash audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python -u scripts/research-20261114-ml-expected-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIGHTGBM-REAL-CASH-136MONTH-82DAY-AUDIT
          path: |
            analysis-results/20261114-ml-cash-full-history.json
            analysis-results/20261114-ml-cash-aug-nov-forward.json
          if-no-files-found: warn
          retention-days: 30
