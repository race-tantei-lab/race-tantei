name: Apply ROI-only daily history 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-daily-roi-only-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch daily history headline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v1/daily-performance-public.ts')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('daily-performance-v2-today-fixed-20260825','daily-performance-v3-roi-only-history-20260828'),
            ('grid-template-columns:72px minmax(0,1fr) auto','grid-template-columns:72px minmax(0,1fr)'),
            ('grid-template-columns:60px minmax(0,1fr) auto','grid-template-columns:60px minmax(0,1fr)'),
            ("const renderHistory=(days)=>{if(!Array.isArray(days)||!days.length){history.innerHTML='<div class=\"daily-summary-empty\">日別成績はまだありません。</div>';return;}history.innerHTML=days.map((d)=>{const profitShown=d.settledStakeYen>0?signed(d.profitYen):'未精算',profitClass=d.settledStakeYen>0?tone(d.profitYen):'';return '<details class=\"daily-history-day\"><summary><b>'+shortDate(d.date)+'</b><span>回収率 '+pct(d.roiPct)+'　購入 '+yen(d.settledStakeYen)+'</span><strong class=\"'+profitClass+'\">'+profitShown+'</strong></summary><div class=\"daily-history-courses\">'+courseRows(d.courses)+'</div></details>';}).join('');};",
             "const renderHistory=(days)=>{if(!Array.isArray(days)||!days.length){history.innerHTML='<div class=\"daily-summary-empty\">日別成績はまだありません。</div>';return;}history.innerHTML=days.map((d)=>'<details class=\"daily-history-day\"><summary><b>'+shortDate(d.date)+'</b><span>回収率 '+pct(d.roiPct)+'</span></summary><div class=\"daily-history-courses\">'+courseRows(d.courses)+'</div></details>').join('');};")
          ]
          for a,b in reps:
            if a not in s:
              raise SystemExit('PATCH_TARGET_MISSING:'+a[:100])
            s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/apply-daily-roi-only-20260828.yml').unlink()
          PY
      - run: npm ci
      - run: npm run typecheck
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/daily-performance-public.ts .github/workflows/apply-daily-roi-only-20260828.yml
          git commit -m 'Show only ROI in daily history summary'
          git pull --rebase origin main
          git push origin HEAD:main
