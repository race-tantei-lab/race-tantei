name: Diagnose current official odds collection

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-current-official-odds.yml'

permissions:
  contents: read

jobs:
  collect-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_ODDS_REQUEST_PAUSE_SECONDS: '0.02'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run fast current collector
        run: |
          python scripts/collect-current-jra-official-odds-fast.py
      - name: Show collector report
        if: always()
        run: |
          if [ -f official-odds-collection-report.json ]; then cat official-odds-collection-report.json; fi
      - name: Audit production D1
        if: always()
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT bet_type,COUNT(DISTINCT race_id) AS races,COUNT(*) AS rows,MAX(captured_at_utc) AS latest FROM rt_official_odds_latest WHERE race_id LIKE '2026-08-09-%' GROUP BY bet_type ORDER BY bet_type"
