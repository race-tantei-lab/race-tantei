name: Verify Worker Selection Cron

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-worker-selection-cron.yml"
      - "src/v1/completed-selection-runtime.ts"
      - "src/public-site-entry-v20.ts"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Wait for a fresh Worker selection audit
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          started=$(date -u +%s)
          for i in $(seq 1 42); do
            raw=$(npx wrangler d1 execute race-tantei-phase0 --remote --config wrangler.jsonc --command "SELECT state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key='worker_selection:${today}' LIMIT 1" --json 2>/dev/null || true)
            value=$(printf '%s' "$raw" | jq -r '.[0].results[0].value // empty' 2>/dev/null || true)
            updated=$(printf '%s' "$raw" | jq -r '.[0].results[0].updatedAt // empty' 2>/dev/null || true)
            if [ -n "$value" ] && [ -n "$updated" ]; then
              updated_epoch=$(date -u -d "$updated UTC" +%s 2>/dev/null || echo 0)
              if [ "$updated_epoch" -ge "$started" ]; then
                printf '%s' "$value" | jq .
                printf '%s' "$value" | jq -e '
                  .sourceModel == "ten-year-completed-model" and
                  .resultDataUsedForTargetDay == false and
                  .selectedRaceCount == 15 and
                  (.selectedRaceIds | length) == 15 and
                  (.selectedRaceIds | unique | length) == 15 and
                  ([.selectedVenueCounts[]] | length) == 3 and
                  ([.selectedVenueCounts[]] | all(. == 5))
                ' >/dev/null
                echo "WORKER_SELECTION_CRON_OK updatedAt=$updated"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No fresh Worker selection audit arrived within seven minutes" >&2
          exit 1
