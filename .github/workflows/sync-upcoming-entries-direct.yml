name: Sync upcoming JRA entries directly
run-name: Sync upcoming JRA entries directly · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-upcoming-entries-direct.mjs"
      - "scripts/run-upcoming-entry-direct-sync.mjs"
      - ".github/workflows/sync-upcoming-entries-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upcoming-jra-entries-direct
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_HOME_URL: https://sp.jra.jp/
      JRA_SEED_ENTRY_URLS: https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050120260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050220260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050320260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050420260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050520260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050620260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050720260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050820260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601050920260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601051020260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601051120260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0101202601051220260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050120260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050220260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050320260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050420260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050520260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050620260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050720260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050820260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602050920260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602051020260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602051120260808%2F00,https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0104202602051220260808%2F00,https