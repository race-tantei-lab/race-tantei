name: Sync upcoming JRA entries directly
run-name: Sync upcoming JRA entries directly · ${{ github.sha }}

on:
  schedule:
    - cron: "30 7 * * 4"          # Thu 16:30 JST: first published weekend entries
    - cron: "30 1,4,7,10 * * 5"  # Fri 10:30/13:30/16:30/19:30 JST
    - cron: "30 1,4,7,10 * * 6"  # Sat 10:30/13:30/16:30/19:30 JST
    - cron: "30 1,4,7,10 * * 0"  # Sun 10:30/13:30/16:30/19:30 JST: prepare holiday Monday
    - cron: "0 22 * * *"         # Daily 07:00 JST: same-day safety refresh; no-op when no race data is published
  push:
    branches: [main]
    paths:
      - "scripts/find-current-jra-entry-anchor.mjs"
      - "scripts/sync-upcoming-entries-direct.mjs"
      - "scripts/run-upcoming-entry-direct-sync.mjs"
      - "scripts/audit-upcoming-entry-readiness.py"
      - ".github/workflows/sync-upcoming-entries-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upcoming-jra-entries-direct
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_HOME_URL: https://www.jra.go.jp/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and compile JRA parser
        run: |
          npm ci
          npm run build:test
      - name: Discover current weekend anchor and save entries
        run: node scripts/run-upcoming-entry-direct-sync.mjs
      - name: Audit saved races
        if: always()
        run: python scripts/audit-upcoming-entry-readiness.py
      - name: Save sync reports
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for f in jra-entry-anchor-discovery.json upcoming-entry-direct-sync.json upcoming-entry-readiness.json; do
            if [ -f "$f" ]; then cp "$f" "analysis-results/$f"; fi
          done
          git add -f analysis-results/jra-entry-anchor-discovery.json analysis-results/upcoming-entry-direct-sync.json analysis-results/upcoming-entry-readiness.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git commit -m "Save upcoming JRA entry direct sync result" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upcoming-entry-direct-sync
          path: |
            jra-entry-anchor-discovery.json
            upcoming-entry-direct-sync.json
            upcoming-entry-readiness.json
          if-no-files-found: warn
          retention-days: 14
