name: Sync upcoming JRA entries directly
run-name: Sync upcoming JRA entries directly · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "50 12 * * *" # 21:50 JST: evening fallback after official entries should be available
    - cron: "20 22 * * *" # 07:20 JST: race-morning fallback before first race/08:00 selection gate

permissions:
  contents: read

concurrency:
  group: sync-upcoming-jra-entries-direct
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    outputs:
      needs_sync: ${{ steps.readiness.outputs.needs_sync }}
    steps:
      - name: Check today/tomorrow entry readiness with one bounded D1 query
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt,json,os,urllib.request
          now=dt.datetime.now(dt.timezone.utc).astimezone(dt.timezone(dt.timedelta(hours=9)))
          dates=[now.date().isoformat(),(now.date()+dt.timedelta(days=1)).isoformat()]
          sql="""
          WITH per_race AS (
            SELECT r.race_date AS raceDate,r.race_id AS raceId,r.venue,
                   MAX(CASE WHEN LENGTH(TRIM(COALESCE(r.entry_url,'')))>0 THEN 1 ELSE 0 END) AS hasEntryUrl,
                   SUM(CASE WHEN rr.race_id IS NOT NULL AND COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS activeRunners
            FROM rt_races r
            LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
            WHERE r.race_date IN (?,?)
            GROUP BY r.race_date,r.race_id,r.venue
          )
          SELECT raceDate,venue,COUNT(*) AS races,
                 SUM(CASE WHEN hasEntryUrl=1 AND activeRunners>=3 THEN 1 ELSE 0 END) AS ready,
                 MIN(activeRunners) AS minActive
          FROM per_race
          GROUP BY raceDate,venue
          ORDER BY raceDate,venue
          """
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['CLOUDFLARE_D1_DATABASE_ID']}/query"
          body=json.dumps({"sql":sql,"params":dates}).encode()
          req=urllib.request.Request(url,data=body,method="POST",headers={
            "Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],
            "Content-Type":"application/json",
          })
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          if not payload.get("success"): raise SystemExit("ENTRY_GATE_D1_QUERY_FAILED:"+json.dumps(payload,ensure_ascii=False))
          rows=[]
          for block in payload.get("result") or []:
            rows += block.get("results") or []
          incomplete=[row for row in rows if int(row.get("races") or 0)!=12 or int(row.get("ready") or 0)!=12]
          print("ENTRY_FALLBACK_GATE",json.dumps({"dates":dates,"rows":rows,"incomplete":incomplete},ensure_ascii=False))
          needs=bool(rows and incomplete)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
            f.write("needs_sync="+("true" if needs else "false")+"\n")
          PY

  sync:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_HOME_URL: https://www.jra.go.jp/
      JRA_MEETING_DISCOVERY_FILE: /tmp/jra-meetings-from-d1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and compile JRA parser
        run: |
          npm ci
          npm run build:test

      - name: Export meeting metadata without consuming rows_read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt,json,os,sqlite3,time,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result') or {}
          opts={'tables':['rt_races']}
          result=post({'output_format':'polling','dump_options':opts}); bookmark=result.get('at_bookmark')
          for _ in range(90):
            signed=(result.get('result') or {}).get('signed_url')
            if signed: break
            if not bookmark: raise RuntimeError('EXPORT_BOOKMARK_MISSING')
            time.sleep(1)
            result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':opts})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=120) as r: sql=r.read().decode('utf-8')
          con=sqlite3.connect('/tmp/meeting.sqlite'); con.executescript(sql)
          jst=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=9)).date()
          start=jst.isoformat(); end=(jst+dt.timedelta(days=3)).isoformat()
          rows=con.execute('''
            SELECT race_date,venue,meeting_no,meeting_day,COUNT(*) AS races
            FROM rt_races
            WHERE race_date>=? AND race_date<=?
            GROUP BY race_date,venue,meeting_no,meeting_day
            HAVING COUNT(*)=12
            ORDER BY race_date,venue
          ''',(start,end)).fetchall(); con.close()
          meetings=[{'date':r[0],'venue':r[1],'meetingNo':int(r[2]),'meetingDay':int(r[3]),'raceCount':int(r[4])} for r in rows]
          payload={'generatedAtUtc':dt.datetime.now(dt.timezone.utc).isoformat(),'start':start,'end':end,'meetings':meetings}
          open(os.environ['JRA_MEETING_DISCOVERY_FILE'],'w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2))
          print('D1_EXPORT_MEETINGS',json.dumps(meetings,ensure_ascii=False))
          PY

      - name: Diagnostic JRA entry discovery and save
        run: node scripts/run-upcoming-entry-direct-sync.mjs
      - name: Audit saved races
        if: always()
        run: python scripts/audit-upcoming-entry-readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upcoming-entry-direct-sync
          path: |
            jra-entry-anchor-discovery.json
            upcoming-entry-direct-sync.json
            upcoming-entry-readiness.json
          if-no-files-found: warn
          retention-days: 14
