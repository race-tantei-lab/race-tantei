    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and compile JRA parser
        run: |
          npm ci
          npm run build:test
      - name: Discover, parse and save upcoming entries
        run: node scripts/run-upcoming-entry-direct-sync.mjs
      - name: Audit saved races
        run: python scripts/audit-upcoming-entry-readiness.py
      - name: Save sync reports
        shell: bash
        run: |
          mkdir -p analysis-results
          cp upcoming-entry-direct-sync.json analysis-results/upcoming-entry-direct-sync.json
          cp upcoming-entry-readiness.json analysis-results/upcoming-entry-readiness.json
          git add -f analysis-results/upcoming-entry-direct-sync.json analysis-results/upcoming-entry-readiness.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save upcoming JRA entry direct sync result"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upcoming-entry-direct-sync
          path: |
            upcoming-entry-direct-sync.json
            upcoming-entry-readiness.json
          if-no-files-found: warn
          retention-days: 14
