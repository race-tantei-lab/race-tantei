name: Recover v16 177 probe
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: [.github/workflows/recover-v16-177-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/recover-v16-177-from-frozen-pool.py
      - name: Persist probe
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/v16-177-recovery-probe.json
          git commit -m 'Persist v16 177 recovery probe' || exit 0
          git push
