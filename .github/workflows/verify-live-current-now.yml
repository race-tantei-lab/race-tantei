name: Verify current live finals now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-current-now.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='diagnostic/live-current' -f description='Checking exact current final rows' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Verify deployed version and D1 state
        shell: bash
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('src/live-deadline-entry-v2.ts').read_text()
          print(re.search(r'const DRIVER_VERSION = "([^"]+)"',t).group(1))
          PY
          )
          for u in https://race-tantei-live-deadline.race-tantei.workers.dev/health https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health; do
            b=$(curl --max-time 15 --fail-with-body -sS "$u"); echo "$u $b"
            BODY="$b" EXPECTED="$expected" node -e 'const b=JSON.parse(process.env.BODY);if(b.version!==process.env.EXPECTED||b.status!=="up")process.exit(1)'
          done
          today=$(TZ=Asia/Tokyo date +%F)
          echo '=== PRIORITY GUARD ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS stateValue FROM rt_system_state WHERE state_key='live_deadline_priority_guard_success:${today}' LIMIT 1"
          echo '=== SELECTED FINALS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}') SELECT r.race_id AS raceId,r.start_time_jst AS startTimeJst,ROUND((julianday(r.start_time_utc)-julianday('now'))*1440.0,2) AS minutesToStart,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows FROM rt_races r JOIN selected x ON x.raceId=r.race_id ORDER BY r.start_time_utc"
      - name: Mark success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='diagnostic/live-current' -f description='Current production live state captured' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='diagnostic/live-current' -f description='Current production live verification failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
