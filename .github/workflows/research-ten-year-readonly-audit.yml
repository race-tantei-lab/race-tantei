name: Research ten-year read-only audit

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - "scripts/research-ten-year-readonly-audit.py"
      - ".github/workflows/research-ten-year-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark research audit pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-audit' \
            -f description='Checking D1 range and JRA ten-year archive availability' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile read-only audit
        run: python -m py_compile scripts/research-ten-year-readonly-audit.py

      - name: Run read-only audit
        run: python scripts/research-ten-year-readonly-audit.py | tee research-ten-year-audit.log

      - name: Upload research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ten-year-readonly-audit
          path: |
            analysis-results/research-ten-year-readonly-audit.json
            research-ten-year-audit.log
          if-no-files-found: error
          retention-days: 30

      - name: Mark research audit success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-audit' \
            -f description='Ten-year research audit completed read-only' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark research audit failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-audit' \
            -f description='Ten-year research audit failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
