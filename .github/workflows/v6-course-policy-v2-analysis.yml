name: V6.2 robust course policy analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v6-course-policy-v2-analysis.yml"
      - "scripts/analyze-v6-course-policy-v2.py"
      - "scripts/analyze-v6-course-policy.py"

concurrency:
  group: v6-course-policy-v2-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Verify source
        run: python -m py_compile scripts/analyze-v6-course-policy-v2.py
      - name: Run analysis
        shell: bash
        run: |
          set -o pipefail
          echo "V6_2_ANALYSIS_STARTED" | tee v6-course-policy-analysis-v2.log
          python -u scripts/analyze-v6-course-policy-v2.py 2>&1 | tee -a v6-course-policy-analysis-v2.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-course-policy-analysis-v2
          path: |
            v6-course-policy-analysis-v2.json
            v6-course-policy-analysis-v2.log
          if-no-files-found: warn
          retention-days: 30
      - name: Save report
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in v6-course-policy-analysis-v2.json v6-course-policy-analysis-v2.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Save v6.2 robust course policy analysis"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
