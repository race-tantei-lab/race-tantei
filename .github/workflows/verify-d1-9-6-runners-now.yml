name: Verify 9/6 D1 runners now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-d1-9-6-runners-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Export races and runners without rows_read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result') or {}
          opts={'tables':['rt_races','rt_runners']}
          result=post({'output_format':'polling','dump_options':opts}); bookmark=result.get('at_bookmark')
          for _ in range(90):
            signed=(result.get('result') or {}).get('signed_url')
            if signed: break
            if not bookmark: raise RuntimeError('EXPORT_BOOKMARK_MISSING')
            time.sleep(1); result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':opts})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=180) as r: open('/tmp/current.sql','wb').write(r.read())
          PY
      - name: Require all 36 races to have real active runners
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,json,sqlite3
          con=sqlite3.connect('/tmp/current.sqlite'); con.executescript(open('/tmp/current.sql',encoding='utf-8').read())
          rows=con.execute('''
            SELECT r.race_id,r.venue,r.race_no,
                   SUM(CASE WHEN rr.race_id IS NOT NULL AND rr.runner_status='active' THEN 1 ELSE 0 END) AS active
            FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
            WHERE r.race_date='2026-09-06'
            GROUP BY r.race_id,r.venue,r.race_no ORDER BY r.venue,r.race_no
          ''').fetchall()
          bad=[{'raceId':r[0],'venue':r[1],'raceNo':r[2],'active':int(r[3] or 0)} for r in rows if int(r[3] or 0)<3]
          by=collections.Counter(str(r[1]) for r in rows)
          print('RACES',len(rows),'VENUES',dict(by),'BAD',json.dumps(bad,ensure_ascii=False))
          if len(rows)!=36 or len(by)!=3 or any(v!=12 for v in by.values()) or bad:
            raise SystemExit('D1_0906_RUNNERS_INCOMPLETE')
          print('D1_0906_ALL_36_RUNNERS_READY')
          PY
