name: Source locator permanent fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-locator-permanent-fix.yml"
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate remaining quota hot paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== distinct entry url ==='
          git grep -n -E "DISTINCT.*entry_url|entry_url.*DISTINCT" -- 'src/**' 'functions/**' 'scripts/**' || true
          echo '=== finished completeness / payouts ==='
          git grep -n -E "payoutTypes|activeRunners|COUNT\(DISTINCT.*bet_type|GROUP_CONCAT.*bet_type|status=.finished" -- 'src/**' 'functions/**' 'scripts/**' | head -n 300 || true
          echo '=== historical race1 entry anchor ==='
          git grep -n -E "race_no.?=.?1|pw01dde" -- 'src/**' 'functions/**' 'scripts/**' | head -n 260 || true
          echo '=== result/settlement maintenance ==='
          git grep -n -E "settle|settlement|awaiting_result|getDueRaceSources|saveResultBundle|run.*Result|result repair|result_repair" -- 'src/**' 'functions/**' 'scripts/**' | head -n 420 || true
          echo '=== runtime schema calls ==='
          git grep -n -E "ensureSchema\(|CREATE TABLE IF NOT EXISTS|CREATE INDEX IF NOT EXISTS|CREATE TRIGGER IF NOT EXISTS" -- 'src/**' | head -n 350 || true
