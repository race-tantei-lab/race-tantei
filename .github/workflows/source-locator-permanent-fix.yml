name: Source locator permanent fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-locator-permanent-fix.yml"
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace legacy migration callers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== migrateLegacyData exact references ==='
          git grep -n -F "migrateLegacyData" -- ':!node_modules/**' ':!.git/**' || true
          echo '=== migrate module imports ==='
          git grep -n -E "from .*migrate|import.*migrate" -- 'src/**' 'functions/**' 'scripts/**' || true
          echo '=== legacy final-bet transfer shapes ==='
          git grep -n -E "rt_bets b.*rt_predictions|INSERT( OR IGNORE)? INTO rt_public_bets|INSERT INTO rt_public_bets" -- 'src/**' 'functions/**' 'scripts/**' | head -n 250 || true
          echo '=== public/live scheduled entrypoints ==='
          git grep -n -E "async scheduled|scheduled\(" -- 'src/public-site-entry-recovery-20260906.ts' 'src/live-deadline-entry-v2.ts' 'src/live-deadline-entry-v3.ts' 'src/v1/**' | head -n 250 || true
