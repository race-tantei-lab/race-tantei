name: Source locator permanent fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-locator-permanent-fix.yml"
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate D1 hot paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== race-name repair ==='
          rg -n -C 6 -i "race_name|検索ウィンドウ|検索メニュー|サイト内検索|メニューを開く" . --glob '!node_modules/**' --glob '!.git/**' --glob '!.github/**' | head -n 1400 || true
          echo '=== legacy public bets migration ==='
          rg -n -C 8 -i "INSERT OR IGNORE INTO rt_public_bets|rt_bets b JOIN rt_predictions|public_bets" . --glob '!node_modules/**' --glob '!.git/**' --glob '!.github/**' | head -n 1600 || true
          echo '=== runtime ML index creation ==='
          rg -n -C 8 -i "rt_idx_ml_|CREATE INDEX IF NOT EXISTS.*rt_ml|CREATE INDEX.*rt_ml" . --glob '!node_modules/**' --glob '!.git/**' --glob '!.github/**' | head -n 1400 || true
          echo '=== schema/lease/state hot paths ==='
          rg -n -C 8 -i "ensureLivePreviewSafetySchema|ensureSchema|CREATE TABLE IF NOT EXISTS|rt_live_deadline_lease|saveDriverState|saveState\(" src functions scripts --glob '!node_modules/**' 2>/dev/null | head -n 1800 || true
          echo '=== generation/selection/deadline ==='
          rg -n -C 8 -i "runCompletedWorkerLiveLock|final_daily_selection|source_prediction_id=-2|T-15|15 min|deadline|worker_live_preview|official" src functions scripts --glob '!node_modules/**' 2>/dev/null | head -n 2200 || true
