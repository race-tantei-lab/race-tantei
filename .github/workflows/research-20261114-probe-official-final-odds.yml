name: Research read-only JRA final-odds gap probe Aug-Nov 2026
on:
  push:
    branches:
      - research/20261114-backfill-jra-final-odds-aug-nov
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 numpy==2.2.6
      - name: Identify D1 missing final odds and fetch official JRA samples
        run: python -u scripts/research-20261114-probe-official-final-odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readonly-jra-final-odds-gap-probe
          path: analysis-results/20261114-official-final-odds-fetch-probe.json
          if-no-files-found: warn
          retention-days: 30
