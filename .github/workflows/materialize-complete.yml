name: Materialize complete v1

on:
  push:
    branches: [complete-v1]
    paths:
      - 'complete-payload.*'
      - '.github/workflows/materialize-complete.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('complete-payload.00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-v1
      - name: Decode remaining source files
        run: |
          cat complete-payload.* | base64 --decode > /tmp/remaining.zip
          unzip -o /tmp/remaining.zip
          rm -f complete-payload.*
          rm -f .github/workflows/materialize-complete.yml
      - name: Commit materialized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize complete automated MVP"
          git push origin HEAD:complete-v1
