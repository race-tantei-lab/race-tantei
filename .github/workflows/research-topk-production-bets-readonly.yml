name: Research 3-4-5 Race Counts Only (no production writes)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-topk-production-bets-readonly.py
      - scripts/research-archived-market-benchmark-20261107.py
      - .github/workflows/research-topk-production-bets-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/research-topk-production-bets-readonly.py
      - name: Validate 3/4/5 real-money denominators, deadlines and missing races
        run: python3 scripts/research-topk-production-bets-readonly.py --self-test
      - name: Compare frozen 2026 model with archived-odds market benchmark (not live T15)
        run: python3 scripts/research-archived-market-benchmark-20261107.py

  # D1 free quota protection: NEVER run this query on an automatic PR push.
  # One explicit workflow_dispatch only, after confirming daily quota available.
  historical_bets_readonly:
    if: github.event_name == 'workflow_dispatch'
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Compare actual historical 3/4/5 top-score subsets (two bounded SELECT queries, NO writes)
        run: |
          python3 scripts/research-topk-production-bets-readonly.py --live --output artifacts/research-topk-actual-20261107.json
      - name: Preserve research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-topk-3-4-5-actual-readonly
          path: artifacts/research-topk-actual-20261107.json
          if-no-files-found: warn
          retention-days: 14
