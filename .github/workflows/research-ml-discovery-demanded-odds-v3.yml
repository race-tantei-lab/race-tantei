name: Research ML discovery demanded official odds v3

on:
  workflow_dispatch:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-ml-discovery-demanded-odds-v3.yml"
      - "scripts/research-build-ml-discovery-odds-demand.py"

concurrency:
  group: research-ml-discovery-demanded-odds-v3
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  SELECTION_ARTIFACT_ID: '9088036803'
  SOURCE_INPUT_ARTIFACT_ID: '9086766461'
  OLD_ODDS_RUN_ID: '31373205723'
  COMPLETED_2016_ARTIFACT_ID: '9088548944'
  META_ODDS_RUN_ID: '31456971683'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/ml-discovery-odds-v3' -f description='Reusing all audited odds; fetching only 3451 strict-discovery races' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Assemble all reusable official odds
        run: |
          set -euo pipefail
          mkdir -p input/selections input/source/base input/source/existing-odds analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}/zip" > selections.zip
          unzip -q selections.zip -d input/selections
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_INPUT_ARTIFACT_ID}/zip" > source.zip
          unzip -q source.zip 'corrected-odds/*.jsonl' 'history/ten-year-history-corpus.jsonl' -d input/source/base
          cp input/source/base/corrected-odds/*.jsonl input/source/existing-odds/
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_ODDS_RUN_ID}/artifacts?per_page=100" > canonical.json
          for y in $(seq 2016 2022); do
            id=$(jq -r --arg n "research-demanded-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' canonical.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "canonical-${y}.zip"
            unzip -q "canonical-${y}.zip" "research-demanded-odds-${y}.jsonl" -d input/source/existing-odds
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPLETED_2016_ARTIFACT_ID}/zip" > completed-2016.zip
          unzip -q completed-2016.zip 'ml-discovery-odds-2016.jsonl' -d input/source/existing-odds
      - name: Wait for and reuse meta-selected 2017-2022 six-market odds
        run: |
          set -euo pipefail
          for y in 2017 2018 2019 2020 2021 2022; do
            id=''
            for i in $(seq 1 900); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${META_ODDS_RUN_ID}/artifacts?per_page=100" > meta-arts.json
              id=$(jq -r --arg n "research-meta-fetched-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' meta-arts.json | head -n1)
              if [ -n "$id" ] && [ "$id" != null ]; then break; fi
              sleep 10
            done
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "meta-${y}.zip"
            unzip -q "meta-${y}.zip" "research-meta-fetched-odds-${y}.jsonl" -d input/source/existing-odds
          done
      - name: Build locked strict discovery demand
        run: |
          python scripts/research-build-ml-discovery-odds-demand.py \
            --selections-dir input/selections/ml-five-selections \
            --existing-odds-dir input/source/existing-odds \
            --history input/source/base/history/ten-year-history-corpus.jsonl \
            --max-year 2022 \
            --out analysis-results/ml-discovery-odds-demand.jsonl \
            --meta analysis-results/ml-discovery-odds-demand-meta.json
      - name: Verify exact minimized demand
        run: |
          python - <<'PY'
          import json
          m=json.load(open('analysis-results/ml-discovery-odds-demand-meta.json'))
          assert m['discoveryBoundaryLocked'] is True,m
          assert m['unionSelectedRaces']==16224,m
          assert m['reusedRaces']==12773,m
          assert m['missingRaces']==3451,m
          assert m['missingByYear']=={'2017':476,'2018':582,'2019':576,'2020':576,'2021':591,'2022':650},m
          assert m['reuseRequiresAllSixMarkets'] is True,m
          assert m['targetRaceResultUsedForDemand'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps(m,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml-discovery-odds-v3-demand
          path: |
            analysis-results/ml-discovery-odds-demand.jsonl
            analysis-results/ml-discovery-odds-demand-meta.json
          retention-days: 30

  year:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ['2017','2018','2019','2020','2021','2022']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.4
      - uses: actions/download-artifact@v4
        with:
          name: research-ml-discovery-odds-v3-demand
          path: input
      - name: Fetch official odds ${{ matrix.year }}
        run: |
          python scripts/research-fetch-demanded-official-odds.py \
            --input input/ml-discovery-odds-demand.jsonl \
            --out analysis-results/ml-discovery-odds-${{ matrix.year }}.jsonl \
            --meta analysis-results/ml-discovery-odds-${{ matrix.year }}-meta.json \
            --year '${{ matrix.year }}' --workers 4
      - name: Require every demanded race
        env:
          YEAR: ${{ matrix.year }}
        run: |
          expected=$(python - <<'PY'
          import json,os
          y=os.environ['YEAR'];print(sum(1 for line in open('input/ml-discovery-odds-demand.jsonl') if line.strip() and str(json.loads(line)['raceDate']).startswith(y+'-')))
          PY
          )
          actual=$(wc -l < "analysis-results/ml-discovery-odds-${YEAR}.jsonl")
          echo "year=${YEAR} expected=${expected} actual=${actual}"
          test "$actual" -eq "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml-discovery-odds-v3-${{ matrix.year }}
          path: |
            analysis-results/ml-discovery-odds-${{ matrix.year }}.jsonl
            analysis-results/ml-discovery-odds-${{ matrix.year }}-meta.json
          retention-days: 30

  summarize:
    if: always()
    needs: year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: research-ml-discovery-odds-v3-20*
          path: years
          merge-multiple: true
      - name: Verify six minimized year files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('years').glob('ml-discovery-odds-20*.jsonl'))
          total=sum(sum(1 for line in p.open() if line.strip()) for p in files)
          assert len(files)==6,[p.name for p in files]
          assert total==3451,total
          print(json.dumps({'yearFiles':6,'newOfficialOddsRaces':3451,'reusedOfficialOddsRaces':12773,'syntheticOddsUsed':False,'productionDatabaseWritten':False},ensure_ascii=False))
          PY
      - name: Mark success
        if: ${{ needs.year.result == 'success' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/ml-discovery-odds-v3' -f description='All 3451 genuinely missing strict-discovery odds acquired' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: ${{ needs.year.result != 'success' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/ml-discovery-odds-v3' -f description='Targeted repair required' -f target_url="$STATUS_TARGET_URL" >/dev/null
          exit 1

# meta 2022 complete; start minimized strict acquisition
