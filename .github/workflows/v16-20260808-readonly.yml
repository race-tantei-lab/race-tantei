name: v16 Aug 8 read-only export
run-name: v16 Aug 8 read-only export · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v16-20260808-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish start
        env: {GH_TOKEN: '${{ github.token }}', TARGET: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/v16-20260808-readonly' -f description='8/8公式オッズ直接取得中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Fetch and parse desktop JRA official odds
        run: |
          python - <<'PY'
          import concurrent.futures,itertools,json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          ROOT=Path('.'); OUT=ROOT/'artifacts'/'v16-20260808-readonly'; OUT.mkdir(parents=True,exist_ok=True); PAGES=OUT/'odds-html'; PAGES.mkdir(exist_ok=True)
          sapp={1:0xC5,2:0x7A,3:0x2F,4:0xE4,5:0x99,6:0x4E,7:0x03,8:0xB8,9:0x6D,10:0x62,11:0x17,12:0xCC}
          specs={'01':('札幌','sapporo','01',0),'04':('新潟','niigata','02',0x0F),'07':('中京','chukyo','02',0x0F-0x22)}
          rows=[]
          for vc,(jp,en,meeting,off) in specs.items():
            for rno in range(1,13):
              es=(sapp[rno]+off)%256; rs=(es-0x44)%256; body=f'{vc}2026{meeting}05{rno:02d}20260808'
              rows.append({'raceId':f'2026-08-08-{en}-{rno:02d}','raceDate':'2026-08-08','venue':jp,'raceNo':rno,'entrySuffix':es,'entryCname':f'pw01dde01{body}/{es:02X}','entryUrl':f'https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde01{body}/{es:02X}','resultUrl':f'https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde01{body}/{rs:02X}'})
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0 (compatible; RaceTanteiAug8ReadOnly/1.0; +https://www.jra.go.jp/)','Accept-Language':'ja'})
          def geturl(url):
            r=sess.get(url,timeout=60); r.encoding='cp932'; r.raise_for_status(); return r.text
          def postc(cname):
            r=sess.post('https://www.jra.go.jp/JRADB/accessO.html',data={'cname':cname},timeout=60); r.encoding='cp932'; r.raise_for_status(); return r.text
          def of(x):
            try:return float(str(x).replace(',','').strip())
            except:return None
          def pp(soup,wide=False,ordered=False):
            text=' '.join(soup.stripped_strings); out={}
            if wide:
              for a,b,lo,hi in re.findall(r'(?<!\d)(\d{1,2})-(\d{1,2})\s+([0-9,.]+)\s*-\s*([0-9,.]+)',text):
                v1,v2=of(lo),of(hi)
                if v1 is not None and v2 is not None: out[tuple(sorted((int(a),int(b))))]=[v1,v2]
            else:
              for a,b,v in re.findall(r'(?<!\d)(\d{1,2})-(\d{1,2})\s+(票数なし|[0-9,.]+)',text):
                vv=of(v)
                if vv is not None: out[(int(a),int(b)) if ordered else tuple(sorted((int(a),int(b))))]=vv
            return out
          def pt(soup,ordered=False):
            out={}; text=' '.join(soup.stripped_strings)
            for a,b,c,v in re.findall(r'(?<!\d)(\d{1,2})-(\d{1,2})-(\d{1,2})\s+(票数なし|[0-9,.]+)',text):
              vv=of(v); aa,bb,cc=int(a),int(b),int(c)
              if vv is not None and len({aa,bb,cc})==3: out[(aa,bb,cc) if ordered else tuple(sorted((aa,bb,cc)))]=vv
            return out
          adds={'win':('pw151ouS3',163,'Z/'),'umaren':('pw154ouS3',47,'Z/'),'wide':('pw155ouS3',179,'Z/'),'umatan':('pw156ouS3',55,'Z/'),'trio':('pw157ouS3',29,'Z99/'),'trifecta':('pw158ouS3',63,'Z/')}
          def one(row):
            eh=geturl(row['entryUrl']); et=' '.join(BeautifulSoup(eh,'html.parser').stripped_strings)
            if not all(x in et for x in ['2026年8月8日',row['venue'],f"{row['raceNo']}レース"]): raise RuntimeError('entry mismatch')
            # horse numbers + final win odds from entry table
            soup=BeautifulSoup(eh,'html.parser'); win={}
            for tr in soup.select('table.basic tr'):
              txt=' '.join(tr.stripped_strings)
              m=re.search(r'(?:^|\s)(\d{1,2})\s+.+?\s+([0-9]+\.[0-9]+)\s*\(\s*\d+\s*番人気',txt)
              if m: win[int(m.group(1))]=float(m.group(2))
            if len(win)<5: raise RuntimeError(f'win parse {len(win)}')
            result={'raceId':row['raceId'],'raceDate':row['raceDate'],'venue':row['venue'],'raceNo':row['raceNo'],'horses':sorted(win),'win':[win[h] for h in sorted(win)]}
            parsed={}
            for typ,(prefix,add,mid) in adds.items():
              if typ=='win': continue
              body=row['entryCname'].split('pw01dde01',1)[1].rsplit('/',1)[0]
              cd=(row['entrySuffix']+add)%256; cname=prefix+body+mid+f'{cd:02X}'
              html=postc(cname); (PAGES/f"{row['raceId']}-{typ}.html").write_text(html,encoding='utf-8')
              ss=BeautifulSoup(html,'html.parser')
              parsed[typ]=pp(ss,wide=True) if typ=='wide' else pp(ss,ordered=(typ=='umatan')) if typ in ('umaren','umatan') else pt(ss,ordered=(typ=='trifecta'))
            hs=sorted(win); pairs=list(itertools.combinations(hs,2)); ex=[(a,b) for a in hs for b in hs if a!=b]; trios=list(itertools.combinations(hs,3)); tri3=[(a,b,c) for a in hs for b in hs for c in hs if len({a,b,c})==3]
            result['umaren']=[parsed['umaren'].get(x) for x in pairs]; result['wide']=[parsed['wide'].get(x) for x in pairs]; result['umatan']=[parsed['umatan'].get(x) for x in ex]; result['trio']=[parsed['trio'].get(x) for x in trios]; result['trifecta']=[parsed['trifecta'].get(x) for x in tri3]
            result['present']={k:sum(v is not None for v in result[k]) for k in ('win','umaren','wide','umatan','trio','trifecta')}
            result['expected']={'win':len(hs),'umaren':len(pairs),'wide':len(pairs),'umatan':len(ex),'trio':len(trios),'trifecta':len(tri3)}
            return result,eh,geturl(row['resultUrl'])
          ok=[]; fail=[]; ENT=OUT/'entry-html'; RES=OUT/'result-html'; ENT.mkdir(exist_ok=True); RES.mkdir(exist_ok=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:
            fm={p.submit(one,r):r for r in rows}
            for i,f in enumerate(concurrent.futures.as_completed(fm),1):
              r=fm[f]
              try:
                x,eh,rh=f.result(); ok.append(x); (ENT/f"{r['raceId']}.html").write_text(eh,encoding='utf-8'); (RES/f"{r['raceId']}.html").write_text(rh,encoding='utf-8')
                print(json.dumps({'done':i,'race':r['raceId'],'present':x['present'],'expected':x['expected']},ensure_ascii=False),flush=True)
              except Exception as e:
                fail.append({'raceId':r['raceId'],'error':f'{type(e).__name__}:{e}'}); print(json.dumps({'done':i,'race':r['raceId'],'error':str(e)},ensure_ascii=False),flush=True)
          ok.sort(key=lambda x:(x['venue'],x['raceNo'])); (OUT/'official-odds.json').write_text(json.dumps(ok,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8'); (OUT/'failures.json').write_text(json.dumps(fail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'races':len(ok),'failures':len(fail)},ensure_ascii=False),flush=True)
          if fail or len(ok)!=36: raise RuntimeError('FETCH_INCOMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v16-20260808-readonly, path: artifacts/v16-20260808-readonly/, compression-level: 1, retention-days: 3}
      - name: Publish success
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', TARGET: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/v16-20260808-readonly' -f description='8/8公式オッズ取得完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env: {GH_TOKEN: '${{ github.token }}', TARGET: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/v16-20260808-readonly' -f description='8/8公式オッズ取得失敗' -f target_url="$TARGET" >/dev/null
