name: v16 Aug 8 read-only export
run-name: v16 Aug 8 read-only export · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v16-20260808-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/v16-20260808-readonly' -f description='8/8公式36Rを検証取得中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Validate exact JRA URLs and export official odds
        run: |
          python - <<'PY'
          import concurrent.futures,json,re,requests
          from pathlib import Path
          ROOT=Path('.'); OUT=ROOT/'artifacts'/'v16-20260808-readonly'; OUT.mkdir(parents=True,exist_ok=True)
          ENT=OUT/'entry-html'; RES=OUT/'result-html'; ENT.mkdir(exist_ok=True); RES.mkdir(exist_ok=True)
          # Entry check digits: observed Sapporo values; R1-R8 and R10/R12 are independently present in D1.
          sapp={1:0xC5,2:0x7A,3:0x2F,4:0xE4,5:0x99,6:0x4E,7:0x03,8:0xB8,9:0x6D,10:0x62,11:0x17,12:0xCC}
          # Cross-venue offsets independently verified from JRA 2026-07-25: Niigata=Sapporo+0x0f; Chukyo=Niigata-0x22.
          specs={'01':('札幌','sapporo','01',0x00),'04':('新潟','niigata','02',0x0F),'07':('中京','chukyo','02',0x0F-0x22)}
          rows=[]
          for vc,(jp,en,meeting,off) in specs.items():
            for rno in range(1,13):
              es=(sapp[rno]+off)%256; rs=(es-0x44)%256
              body=f'{vc}2026{meeting}05{rno:02d}20260808'
              rows.append({'raceId':f'2026-08-08-{en}-{rno:02d}','raceDate':'2026-08-08','venue':jp,'raceNo':rno,'venueCode':vc,'entrySuffix':f'{es:02X}','resultSuffix':f'{rs:02X}','entryUrl':f'https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde01{body}/{es:02X}','resultUrl':f'https://www.jra.go.jp/JRADB/accessS.html?CNAME=pw01sde01{body}/{rs:02X}'})
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0 (compatible; RaceTanteiAug8ReadOnly/1.0; +https://www.jra.go.jp/)','Accept-Language':'ja'})
          def grab(row):
            e=sess.get(row['entryUrl'],timeout=60); e.encoding='cp932'; e.raise_for_status()
            s=sess.get(row['resultUrl'],timeout=60); s.encoding='cp932'; s.raise_for_status()
            # Accept only pages whose visible text identifies the exact date, venue and race number.
            et=' '.join(re.sub('<[^>]+>',' ',e.text).split()); st=' '.join(re.sub('<[^>]+>',' ',s.text).split())
            needles=['2026年8月8日',row['venue'],f"{row['raceNo']}レース"]
            if not all(n in et for n in needles): raise RuntimeError('ENTRY_BODY_MISMATCH:'+row['raceId'])
            if not all(n in st for n in needles): raise RuntimeError('RESULT_BODY_MISMATCH:'+row['raceId'])
            return row,e.text,s.text
          failures=[]; valid=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as p:
            fm={p.submit(grab,r):r for r in rows}
            for i,f in enumerate(concurrent.futures.as_completed(fm),1):
              r=fm[f]
              try:
                rr,eh,rh=f.result(); valid.append(rr); (ENT/f"{rr['raceId']}.html").write_text(eh,encoding='utf-8'); (RES/f"{rr['raceId']}.html").write_text(rh,encoding='utf-8')
              except Exception as e: failures.append({'raceId':r['raceId'],'error':f'{type(e).__name__}:{e}','entryUrl':r['entryUrl'],'resultUrl':r['resultUrl']})
              print(json.dumps({'urlDone':i,'valid':len(valid),'fail':len(failures)},ensure_ascii=False),flush=True)
          valid.sort(key=lambda x:(x['venueCode'],x['raceNo']))
          (OUT/'validated-races.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (OUT/'url-failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if failures or len(valid)!=36: raise RuntimeError(f'URL_VALIDATION_INCOMPLETE:{len(valid)}/36:{len(failures)}')
          parser=ROOT/'scripts'/'export-mobile-historical-official-odds-retry.py'; source=parser.read_text(encoding='utf-8'); marker='# Rebuild exactly the same deterministic 3,210-race selection used by the primary export.'
          ns={'__file__':str(parser)}; exec(compile(source.split(marker,1)[0],str(parser),'exec'),ns); fetch_race=ns['fetch_race']
          jobs=[{'raceId':r['raceId'],'raceDate':r['raceDate'],'venue':r['venue'],'raceNo':r['raceNo'],'resultUrl':r['resultUrl']} for r in valid]
          odds=[]; ofail=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as p:
            fm={p.submit(fetch_race,r):r for r in jobs}
            for i,f in enumerate(concurrent.futures.as_completed(fm),1):
              r=fm[f]
              try: odds.append(f.result())
              except Exception as e: ofail.append({'raceId':r['raceId'],'error':f'{type(e).__name__}:{e}'})
              print(json.dumps({'oddsDone':i,'ok':len(odds),'fail':len(ofail)},ensure_ascii=False),flush=True)
          odds.sort(key=lambda x:(x['venue'],x['raceNo']))
          (OUT/'official-odds.json').write_text(json.dumps(odds,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          (OUT/'official-odds-failures.json').write_text(json.dumps(ofail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if ofail or len(odds)!=36: raise RuntimeError(f'OFFICIAL_ODDS_INCOMPLETE:{len(odds)}/36:{len(ofail)}')
          print(json.dumps({'complete':True,'validatedRaces':len(valid),'officialOddsRaces':len(odds)},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-20260808-readonly
          path: artifacts/v16-20260808-readonly/
          compression-level: 1
          retention-days: 3
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/v16-20260808-readonly' -f description='8/8公式36R取得完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/v16-20260808-readonly' -f description='8/8公式36R取得失敗' -f target_url="$TARGET" >/dev/null
