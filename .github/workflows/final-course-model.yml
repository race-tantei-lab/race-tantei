name: Final course-specific model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-course-model.yml"
      - "scripts/final-course-policy.py"
      - "scripts/analyze-final-course-model.py"
      - "scripts/run-final-course-production.py"
      - "scripts/backfill-final-course-august.py"
      - "scripts/publish-nonlinear-v4-production.py"
      - "scripts/train-nonlinear-market-blend-v4.py"
      - "analysis-results/nonlinear-market-blend-v4.json"

concurrency:
  group: final-course-model
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Run final pipeline with diagnostics
        shell: bash
        run: |
          set +e
          : > final-course-diagnostic.log

          echo "[compile]" | tee -a final-course-diagnostic.log
          python -m py_compile \
            scripts/final-course-policy.py \
            scripts/analyze-final-course-model.py \
            scripts/run-final-course-production.py \
            scripts/backfill-final-course-august.py \
            >> final-course-diagnostic.log 2>&1
          compile_status=$?
          echo "compile_status=$compile_status" | tee -a final-course-diagnostic.log

          analysis_status=99
          backfill_status=99
          if [[ $compile_status -eq 0 ]]; then
            echo "[analysis]" | tee -a final-course-diagnostic.log
            python scripts/analyze-final-course-model.py \
              > final-course-model-analysis.log 2>&1
            analysis_status=$?
            cat final-course-model-analysis.log >> final-course-diagnostic.log
            echo "analysis_status=$analysis_status" | tee -a final-course-diagnostic.log
          fi

          if [[ $compile_status -eq 0 && $analysis_status -eq 0 ]]; then
            echo "[backfill]" | tee -a final-course-diagnostic.log
            python scripts/backfill-final-course-august.py \
              > final-course-august-backfill.log 2>&1
            backfill_status=$?
            cat final-course-august-backfill.log >> final-course-diagnostic.log
            echo "backfill_status=$backfill_status" | tee -a final-course-diagnostic.log
          fi

          if [[ $compile_status -ne 0 || $analysis_status -ne 0 || $backfill_status -ne 0 ]]; then
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-course-model
          path: |
            final-course-model-analysis.json
            final-course-model-analysis.log
            final-course-august-backfill.json
            final-course-august-backfill.log
            final-course-diagnostic.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save reports
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in \
            final-course-model-analysis.json \
            final-course-model-analysis.log \
            final-course-august-backfill.json \
            final-course-august-backfill.log \
            final-course-diagnostic.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Save final course model diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
