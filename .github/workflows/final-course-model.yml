name: Final course-specific model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-course-model.yml"
      - "scripts/final-course-policy.py"
      - "scripts/run-final-course-production.py"
      - "scripts/backfill-final-course-august-fast.py"

concurrency:
  group: final-course-model
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  publish-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish production start status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/fixed-budget-publisher' \
            -f description='処理中：固定購入額で本番予想を作成' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify sources and fixed budgets
        shell: bash
        run: |
          python -m py_compile scripts/final-course-policy.py scripts/run-final-course-production.py scripts/backfill-final-course-august-fast.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/run-final-course-production.py')
          spec = importlib.util.spec_from_file_location('production_runner_budget_test', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = {'ライト': 2000, 'スタンダード': 5000, 'プレミアム': 10000}
          assert module.PRODUCTION_COURSE_TARGET_STAKES == expected
          policy = module.load_policy()
          assert policy.COURSE_TARGET_STAKES == expected
          print('fixed production budgets verified')
          PY

      - name: Publish upcoming production predictions
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-final-course-production.py 2>&1 | tee final-course-production.log

      - name: Recalculate August with the same fixed budgets
        shell: bash
        run: |
          set -o pipefail
          python scripts/backfill-final-course-august-fast.py 2>&1 | tee final-course-august-backfill.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-budget-production
          path: |
            production-final-course-model.json
            final-course-production.log
            final-course-august-backfill.json
            final-course-august-backfill.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save reports
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in production-final-course-model.json final-course-production.log final-course-august-backfill.json final-course-august-backfill.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Save fixed-budget production result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
            DESCRIPTION='完了：L2000円 S5000円 P10000円で本番反映'
          else
            STATE=failure
            DESCRIPTION='失敗：固定購入額の本番反映ログ確認が必要'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='production/fixed-budget-publisher' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
