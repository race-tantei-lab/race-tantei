name: Final course-specific model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-course-model.yml"
      - "scripts/final-course-policy.py"
      - "scripts/run-final-course-production.py"
      - "scripts/backfill-final-course-august-fast.py"

concurrency:
  group: final-course-model
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  august-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Verify sources
        run: python -m py_compile scripts/final-course-policy.py scripts/run-final-course-production.py scripts/backfill-final-course-august-fast.py
      - name: Recalculate August with final v5
        shell: bash
        run: |
          set -o pipefail
          python scripts/backfill-final-course-august-fast.py 2>&1 | tee final-course-august-backfill.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-v5-august
          path: |
            final-course-august-backfill.json
            final-course-august-backfill.log
          if-no-files-found: warn
          retention-days: 30
      - name: Save report
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in final-course-august-backfill.json final-course-august-backfill.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Save final v5 August result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
