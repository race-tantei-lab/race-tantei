name: Quick Nakayama URL Probe
on:
  push:
    branches: [diag/sep21-current-miss]
    paths: [".github/workflows/quick-nak-url.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Query race URLs
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT race_id,race_no,entry_url,start_time_utc FROM rt_races WHERE race_id IN ('2026-09-21-nakayama-01','2026-09-21-nakayama-02','2026-09-21-nakayama-03') ORDER BY race_no"
          jq -n --arg sql "$sql" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
