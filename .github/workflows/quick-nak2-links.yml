name: Quick Nak2 Entry Links
on:
  push:
    branches: [diag/sep21-current-miss]
    paths: [".github/workflows/quick-nak2-links.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Print JRA action links
        env:
          CLOUDFLARE_API_TOKEN: x
          CLOUDFLARE_ACCOUNT_ID: x
          CLOUDFLARE_D1_DATABASE_ID: x
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          spec=importlib.util.spec_from_file_location('m',p); m=importlib.util.module_from_spec(spec); sys.modules['m']=m; spec.loader.exec_module(m)
          url='https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0106202604070220260921%2F69'
          html=m.fetch_url(url)
          print('ENTRY_LEN',len(html))
          for x in m.action_links(html):
              print('ACTION',repr(x))
          PY
