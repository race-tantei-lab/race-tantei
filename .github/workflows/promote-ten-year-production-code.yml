name: Promote ten-year production code

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-ten-year-production-code.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize production sources
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64,gzip
          payloads={
            'scripts/ten-year-production-core.py': '''''',
            'scripts/generate-ten-year-preday-selection.py': '''''',
            'scripts/generate-ten-year-live-bets.py': ''''''
          }
          for path,payload in payloads.items():
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PYCODE
          python -m py_compile scripts/ten-year-production-core.py scripts/generate-ten-year-preday-selection.py scripts/generate-ten-year-live-bets.py
      - name: Commit production sources
        run: |
          set -euo pipefail
          git add scripts/ten-year-production-core.py scripts/generate-ten-year-preday-selection.py scripts/generate-ten-year-live-bets.py
          git config user.name "race-tantei-bot"
          git config user.email "race-tantei-bot@users.noreply.github.com"
          git commit -m "Add completed ten-year production generators"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
