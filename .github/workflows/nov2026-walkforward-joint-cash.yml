name: Research chronological rolling joint cash regime portfolio
on:
  push:
    branches:
      - research/nov2026-walkforward-joint-cash-1111
    paths:
      - scripts/research-nov2026-walkforward-joint-cash.py
      - .github/workflows/nov2026-walkforward-joint-cash.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  joint-cash-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - name: Restore original finite cash discovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis-results/premined-form analysis-results/premined-joint analysis-results/premined-pair
          gh run download 42926949569 --repo "${GITHUB_REPOSITORY}" -n decade-form-real-payout-roi200-cells -D analysis-results/premined-form
          gh run download 42964965187 --repo "${GITHUB_REPOSITORY}" -n joint-draw-field-76-schema-real-cash-roi200-cells -D analysis-results/premined-joint
          gh run download 42967478747 --repo "${GITHUB_REPOSITORY}" -n form-pair-venue-quarter-171-schema-real-cash-roi200-cells -D analysis-results/premined-pair
          test -s analysis-results/premined-form/nov2026-form-decade-all-robust-cells.csv.gz
          test -s analysis-results/premined-joint/nov2026-relative-draw-robust-cells.csv.gz
          test -s analysis-results/premined-pair/nov2026-form-pair-venue-quarter-robust-cells.csv.gz
      - uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Download pinned 136 monthly mirrored cash files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/cash_months
          cat /tmp/cash_months | xargs -P 12 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 3 --max-time 45 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Execute past-only rolling selection and yearwise cash settlement
        run: python -u scripts/research-nov2026-walkforward-joint-cash.py
      - name: Preserve complete joint cash outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov2026-walkforward-joint-cash
          path: |
            analysis-results/nov2026-walkforward-joint-cash.json
            analysis-results/nov2026-walkforward-joint-bets.csv.gz
          retention-days: 30
          if-no-files-found: warn
