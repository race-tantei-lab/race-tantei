name: Patch discovery refresh on model version

on:
  push:
    branches: [fix-discovery-version-refresh]
    paths:
      - '.github/workflows/patch-discovery-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-discovery-version-refresh
      - name: Force discovery after model deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/complete.ts')
          s = p.read_text()
          old = '''async function shouldDiscover(env: Env, now: Date): Promise<boolean> {
            const last = await getState(env.DB, "last_discovery_at");
            if (!last) return true;
            const lastMs = new Date(last).getTime();
            if (!Number.isFinite(lastMs)) return true;
            const elapsedMinutes = (now.getTime() - lastMs) / 60_000;
            if (!isJstEntryWindow(now)) return elapsedMinutes >= 24 * 60;
            return elapsedMinutes >= (isJstRaceWindow(now) ? 20 : 90);
          }'''
          new = '''async function shouldDiscover(env: Env, now: Date): Promise<boolean> {
            const discoveryVersion = await getState(env.DB, "last_discovery_model_version");
            if (discoveryVersion !== env.MODEL_VERSION) return true;
            const last = await getState(env.DB, "last_discovery_at");
            if (!last) return true;
            const lastMs = new Date(last).getTime();
            if (!Number.isFinite(lastMs)) return true;
            const elapsedMinutes = (now.getTime() - lastMs) / 60_000;
            if (!isJstEntryWindow(now)) return elapsedMinutes >= 24 * 60;
            return elapsedMinutes >= (isJstRaceWindow(now) ? 20 : 90);
          }'''
          if old not in s:
              raise SystemExit('shouldDiscover anchor not found')
          s = s.replace(old, new, 1)

          old_state = '''        await setState(env.DB, "last_discovery_at", nowIso());
                  await setState(env.DB, "last_discovery_count", String(urls.length));
                  await setState(env.DB, "last_discovery_error", "");'''
          new_state = '''        await setState(env.DB, "last_discovery_at", nowIso());
                  await setState(env.DB, "last_discovery_count", String(urls.length));
                  await setState(env.DB, "last_discovery_model_version", env.MODEL_VERSION);
                  await setState(env.DB, "last_discovery_error", "");'''
          if old_state not in s:
              raise SystemExit('discovery state anchor not found')
          p.write_text(s.replace(old_state, new_state, 1))
          PY
          rm -f .github/workflows/patch-discovery-version.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh JRA discovery after model deployment"
          git push origin HEAD:fix-discovery-version-refresh
