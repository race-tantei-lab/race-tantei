name: One-shot live recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-live-recovery.yml"

permissions:
  contents: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark recovery pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='production/one-shot-live-recovery' \
            -f description='Repairing rescue parser and preview scheduling' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Patch live finalization root causes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'PATCH_MARKER_MISSING:{path}:{old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Root cause 1: the persistent T-16 rescue guard was validating the
          # previous odds-parser version, while every current preview is v3.
          replace_exact(
              'src/v1/completed-worker-deadline-guard.ts',
              'const ODDS_PARSER_VERSION = "jra-decimal-cells-sanity-v2-20260823";',
              'const ODDS_PARSER_VERSION = "jra-semantic-table-parser-v3-20260823";',
          )

          # Root cause 2: at T-30..T-17 the first race refreshed every 45s,
          # which can consume the one-preview-per-tick budget and starve the
          # next selected race. Three minutes keeps multiple last-good previews
          # rotating while still forcing a fresh T-17 generation attempt.
          replace_exact(
              'src/v1/completed-worker-live-lock.ts',
              'const NEAR_PREVIEW_REFRESH_MS = 45 * 1000;',
              'const NEAR_PREVIEW_REFRESH_MS = 3 * 60 * 1000;',
          )

          # Bump the deployed driver identity so production proof cannot pass
          # against an old Worker deployment.
          replace_exact(
              'src/live-deadline-entry-v2.ts',
              'const DRIVER_VERSION = "live-deadline-v6-t15-start-t10-reflect-20260823";',
              'const DRIVER_VERSION = "live-deadline-v7-rescue-parser-fair-preview-20260829";',
          )

          # Prevent this exact parser split from ever passing the static safety gate again.
          p = Path('scripts/verify-live-lock-safety.py')
          text = p.read_text(encoding='utf-8')
          old = '''        'new Set(["jra-fast-official", "jra-crawl-official"])',\n        'cachedWorkerModel','''
          new = '''        'new Set(["jra-fast-official", "jra-crawl-official"])',\n        'const ODDS_PARSER_VERSION = "jra-semantic-table-parser-v3-20260823";',\n        'cachedWorkerModel','''
          if old not in text:
              raise SystemExit('PATCH_MARKER_MISSING:safety-live-parser')
          text = text.replace(old, new)
          old = '''        'snapshot.oddsSource !== "jra-fast-official" && snapshot.oddsSource !== "jra-crawl-official"',\n        "ensureCompletedFinalImmutability",'''
          new = '''        'snapshot.oddsSource !== "jra-fast-official" && snapshot.oddsSource !== "jra-crawl-official"',\n        'const ODDS_PARSER_VERSION = "jra-semantic-table-parser-v3-20260823";',\n        "ensureCompletedFinalImmutability",'''
          if old not in text:
              raise SystemExit('PATCH_MARKER_MISSING:safety-guard-parser')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          git diff -- src/v1/completed-worker-deadline-guard.ts src/v1/completed-worker-live-lock.ts src/live-deadline-entry-v2.ts scripts/verify-live-lock-safety.py

      - name: Typecheck and static safety gate
        run: |
          set -euo pipefail
          npm run typecheck
          python3 scripts/verify-live-lock-safety.py

      - name: Deploy repaired primary and backup Workers
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc

      - name: Prove repaired Workers and live preview protection
        shell: bash
        run: |
          set -euo pipefail
          expected='live-deadline-v7-rescue-parser-fair-preview-20260829'

          health_ok() {
            local body url
            for url in \
              'https://race-tantei-live-deadline.race-tantei.workers.dev/health' \
              'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
              body=$(curl --max-time 15 --retry 2 --retry-delay 2 --fail-with-body -sS "$url") || return 1
              BODY="$body" EXPECTED="$expected" node - <<'NODE' || return 1
          const b=JSON.parse(process.env.BODY||'{}');
          if(b.status!=='up'||b.service!=='race-tantei-live-deadline'||b.version!==process.env.EXPECTED) process.exit(1);
          NODE
            done
          }

          health_ok
          today=$(TZ=Asia/Tokyo date +%F)
          fresh=0
          for i in $(seq 1 15); do
            sleep 8
            state=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
              "SELECT updated_at AS updatedAt,unixepoch('now')-unixepoch(updated_at) AS ageSeconds,json_extract(state_value,'$.version') AS version FROM rt_system_state WHERE state_key='live_deadline_priority_guard_success:${today}' LIMIT 1")
            if STATE="$state" EXPECTED="$expected" node - <<'NODE'
          const p=JSON.parse(process.env.STATE||'[]');
          const r=p?.[0]?.results?.[0];
          const age=Number(r?.ageSeconds);
          if(!r || r.version!==process.env.EXPECTED || !Number.isFinite(age) || age < -30 || age > 180) process.exit(1);
          console.log(JSON.stringify({workerCron:'fresh',version:r.version,ageSeconds:age,updatedAt:r.updatedAt}));
          NODE
            then
              fresh=1
              break
            fi
          done
          test "$fresh" -eq 1

          # Any selected race inside the live preview window but still safely
          # before T-17 must have a persisted official-v3 last-good preview.
          coverage=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}'), q AS (SELECT r.race_id AS raceId,(julianday(r.start_time_utc)-julianday('now'))*1440.0 AS minutesToStart,(SELECT COUNT(*) FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id AND json_extract(p.state_value,'$.snapshots[0].oddsParserVersion')='jra-semantic-table-parser-v3-20260823') AS validPreview FROM rt_races r JOIN selected x ON x.raceId=r.race_id) SELECT raceId,ROUND(minutesToStart,2) AS minutesToStart,validPreview FROM q WHERE minutesToStart > 17 AND minutesToStart <= 90 ORDER BY minutesToStart")
          echo "$coverage"
          COVERAGE="$coverage" node - <<'NODE'
          const p=JSON.parse(process.env.COVERAGE||'[]');
          const rows=p?.[0]?.results||[];
          const bad=rows.filter(r=>Number(r.validPreview)!==1);
          if(bad.length) throw new Error(`FUTURE_SELECTED_PREVIEW_UNPROTECTED:${JSON.stringify(bad)}`);
          console.log(JSON.stringify({futurePreviewProtection:'ok',checked:rows.length,rows}));
          NODE

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'race-tantei-recovery-bot'
          git config user.email 'race-tantei-recovery-bot@users.noreply.github.com'
          rm -f .github/workflows/one-shot-live-recovery.yml
          git add src/v1/completed-worker-deadline-guard.ts src/v1/completed-worker-live-lock.ts src/live-deadline-entry-v2.ts scripts/verify-live-lock-safety.py .github/workflows/one-shot-live-recovery.yml
          git commit -m 'Fix live final rescue and preview starvation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark recovery success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='production/one-shot-live-recovery' \
            -f description='Parser rescue fixed; Workers deployed; future previews protected' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark recovery failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='production/one-shot-live-recovery' \
            -f description='One-shot live recovery failed; inspect run' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
