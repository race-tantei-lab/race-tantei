name: Install race program guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-race-program-guard.yml'
      - 'scripts/install-race-program-guard.py'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  install:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Mark guard pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/race-program-guard' -f description='D1番組データ破壊防止ガードを設定中' -f target_url="$STATUS_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install guard
        run: python scripts/install-race-program-guard.py
      - name: Mark guard success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/race-program-guard' -f description='D1番組データ破壊防止ガード設定済み' -f target_url="$STATUS_URL" >/dev/null
      - name: Mark guard failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/race-program-guard' -f description='D1番組データ破壊防止ガード設定失敗' -f target_url="$STATUS_URL" >/dev/null
