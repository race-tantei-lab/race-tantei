name: Drive live tick
run-name: Drive live tick · ${{ github.event_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule cron is UTC. These two windows equal 08:00-19:55 JST
    # on Saturday/Sunday/Monday, including the JST day boundary correctly.
    - cron: "*/5 23 * * 5,6,0"
    - cron: "*/5 0-10 * * 6,0,1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/drive-live-tick.yml"
      - "src/public-site-entry-v34.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "wrangler.jsonc"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run independent live-deadline driver
        shell: bash
        run: |
          set -euo pipefail
          url='https://race-tantei-phase0.race-tantei.workers.dev/_ops/live-tick'
          expected='ten-year-completed-public-v34-independent-live-driver-20260822'
          for attempt in $(seq 1 40); do
            rm -f /tmp/h /tmp/b
            code=$(curl --max-time 120 -sS -D /tmp/h -o /tmp/b -w '%{http_code}' -X POST "$url" || true)
            version=$(tr -d '\r' </tmp/h 2>/dev/null | awk -F': ' 'tolower($1)=="x-race-ui-version"{print $2}' | tail -1)
            body=$(cat /tmp/b 2>/dev/null || true)
            echo "attempt=$attempt code=$code version=$version body=$body"
            if [ "$version" = "$expected" ] && [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$version" = "$expected" ] && [ "$code" = "503" ] && echo "$body" | grep -q '"status":"deadline_breach"'; then
              echo 'LIVE_TICK_EXECUTED_WITH_HISTORICAL_BREACH'
              exit 0
            fi
            if [ "$version" = "$expected" ] && [ "$code" = "503" ]; then
              echo 'LIVE_TICK_CURRENT_ERROR' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'LIVE_TICK_INDEPENDENT_DRIVER_NOT_READY' >&2
          exit 1

      - name: Mark live tick driver success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/live-tick-driver' \
            -f description='Independent JST live deadline driver executed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark live tick driver failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/live-tick-driver' \
            -f description='Independent JST live deadline driver failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
