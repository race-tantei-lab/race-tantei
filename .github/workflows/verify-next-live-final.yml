name: Verify next live final across T25 and T20

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-next-live-final.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='diagnostic/next-final' -f description='Waiting to verify Chukyo 2R final at T-25/T-20' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Wait until just after T-25 and inspect
        shell: bash
        run: |
          set -euo pipefail
          target_epoch=$(date -u -d '2026-08-23 00:56:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target_epoch" ]; then sleep $((target_epoch-now)); fi
          out=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT COUNT(*) AS finalRows,COUNT(DISTINCT course) AS courses,COUNT(DISTINCT ticket_no) AS ticketNos,MIN(source_prediction_id) AS minSource,MAX(source_prediction_id) AS maxSource FROM rt_public_bets WHERE race_id='2026-08-23-chukyo-02'")
          echo "T25_CHECK=$out"
          OUT="$out" node - <<'NODE'
          const p=JSON.parse(process.env.OUT||'[]'); const r=p?.[0]?.results?.[0]||{};
          const ok=Number(r.finalRows)===6&&Number(r.courses)===3&&Number(r.ticketNos)===2&&Number(r.minSource)===-2&&Number(r.maxSource)===-2;
          require('fs').writeFileSync('/tmp/t25_ok',ok?'1':'0');
          console.log(JSON.stringify({normalT25:ok,row:r}));
          NODE
      - name: If needed, wait until just after T-20 rescue and require exact final
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/t25_ok)" = "1" ]; then echo 'Normal T-25 final already exact-six'; exit 0; fi
          target_epoch=$(date -u -d '2026-08-23 01:01:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target_epoch" ]; then sleep $((target_epoch-now)); fi
          out=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT COUNT(*) AS finalRows,COUNT(DISTINCT course) AS courses,COUNT(DISTINCT ticket_no) AS ticketNos,MIN(source_prediction_id) AS minSource,MAX(source_prediction_id) AS maxSource FROM rt_public_bets WHERE race_id='2026-08-23-chukyo-02'")
          echo "T20_CHECK=$out"
          OUT="$out" node - <<'NODE'
          const p=JSON.parse(process.env.OUT||'[]'); const r=p?.[0]?.results?.[0]||{};
          if(Number(r.finalRows)!==6||Number(r.courses)!==3||Number(r.ticketNos)!==2||Number(r.minSource)!==-2||Number(r.maxSource)!==-2) throw new Error(`NEXT_FINAL_NOT_EXACT_SIX_AFTER_T20:${JSON.stringify(r)}`);
          console.log(JSON.stringify({rescuedByT20:true,row:r}));
          NODE
      - name: Verify public API sees the final
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --max-time 20 --fail-with-body -sS 'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-08-23')
          BODY="$body" node - <<'NODE'
          const p=JSON.parse(process.env.BODY||'{}'); const r=(p.races||[]).find(x=>x.raceId==='2026-08-23-chukyo-02');
          if(!r) throw new Error('CHUKYO2_PUBLIC_MISSING');
          if(!['buy','hit','miss'].includes(String(r.publicState?.code||''))) throw new Error(`CHUKYO2_PUBLIC_NOT_FINAL:${r.publicState?.code}`);
          console.log(JSON.stringify({publicState:r.publicState?.code,raceId:r.raceId}));
          NODE
      - name: Mark success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='diagnostic/next-final' -f description='Next selected race reached exact-six final before T-15' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='diagnostic/next-final' -f description='Next selected race failed exact-six final verification' -f target_url="$STATUS_TARGET_URL" >/dev/null
