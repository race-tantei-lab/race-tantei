name: Verify next live final across T25 and T20

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-next-live-final.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='diagnostic/next-final' -f description='Verifying Chukyo 2R final at T-25/T-20' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Inspect schema and T-25 state without failing early
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RT_PUBLIC_BETS SCHEMA ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "PRAGMA table_info(rt_public_bets)"
          echo '=== KNOWN GOOD SAPPORO 1R SAMPLE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT * FROM rt_public_bets WHERE race_id='2026-08-23-sapporo-01' ORDER BY rowid LIMIT 6"
          out=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT COUNT(*) AS finalRows FROM rt_public_bets WHERE race_id='2026-08-23-chukyo-02'")
          echo "T25_CHECK=$out"
          OUT="$out" node - <<'NODE'
          const p=JSON.parse(process.env.OUT||'[]'); const r=p?.[0]?.results?.[0]||{};
          const ok=Number(r.finalRows)===6;
          require('fs').writeFileSync('/tmp/t25_ok',ok?'1':'0');
          console.log(JSON.stringify({normalT25RowsSix:ok,row:r}));
          NODE
      - name: If needed wait through T-20 rescue and require six rows
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/t25_ok)" = "1" ]; then echo 'Normal T-25 final already has six rows'; exit 0; fi
          target_epoch=$(date -u -d '2026-08-23 01:01:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target_epoch" ]; then sleep $((target_epoch-now)); fi
          out=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT COUNT(*) AS finalRows FROM rt_public_bets WHERE race_id='2026-08-23-chukyo-02'")
          echo "T20_CHECK=$out"
          OUT="$out" node - <<'NODE'
          const p=JSON.parse(process.env.OUT||'[]'); const r=p?.[0]?.results?.[0]||{};
          if(Number(r.finalRows)!==6) throw new Error(`NEXT_FINAL_NOT_SIX_AFTER_T20:${JSON.stringify(r)}`);
          console.log(JSON.stringify({rescuedByT20RowsSix:true,row:r}));
          NODE
      - name: Verify exact structure and public API
        shell: bash
        run: |
          set -euo pipefail
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT * FROM rt_public_bets WHERE race_id='2026-08-23-chukyo-02' ORDER BY rowid LIMIT 6")
          echo "FINAL_ROWS=$rows"
          ROWS="$rows" node - <<'NODE'
          const p=JSON.parse(process.env.ROWS||'[]'); const rows=p?.[0]?.results||[];
          if(rows.length!==6) throw new Error(`FINAL_ROW_COUNT:${rows.length}`);
          const keys=Object.keys(rows[0]||{});
          console.log(JSON.stringify({keys,rows}));
          const sourceKey=keys.find(k=>k.toLowerCase().replaceAll('_','')==='sourcepredictionid');
          if(sourceKey && rows.some(r=>Number(r[sourceKey])!==-2)) throw new Error('FINAL_SOURCE_NOT_MINUS2');
          NODE
          body=$(curl --max-time 20 --fail-with-body -sS 'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-08-23')
          BODY="$body" node - <<'NODE'
          const p=JSON.parse(process.env.BODY||'{}'); const r=(p.races||[]).find(x=>x.raceId==='2026-08-23-chukyo-02');
          if(!r) throw new Error('CHUKYO2_PUBLIC_MISSING');
          if(!['buy','hit','miss'].includes(String(r.publicState?.code||''))) throw new Error(`CHUKYO2_PUBLIC_NOT_FINAL:${r.publicState?.code}`);
          console.log(JSON.stringify({publicState:r.publicState?.code,raceId:r.raceId}));
          NODE
      - name: Mark success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='diagnostic/next-final' -f description='Next selected race reached six-row final before T-15' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='diagnostic/next-final' -f description='Next selected race failed six-row final verification' -f target_url="$STATUS_TARGET_URL" >/dev/null
