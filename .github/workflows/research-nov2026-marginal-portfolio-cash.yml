name: Research marginal joint cash portfolio (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nov2026-marginal-portfolio-cash-1111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas requests
      - name: Restore fixed historical discovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p analysis-results/premined-form analysis-results/premined-joint analysis-results/premined-pair
          gh run download 42926949569 --dir /tmp/form --repo "${{ github.repository }}"
          gh run download 42964965187 --dir /tmp/joint --repo "${{ github.repository }}"
          gh run download 42967478747 --dir /tmp/pair --repo "${{ github.repository }}"
          find /tmp/form /tmp/joint /tmp/pair -type f | head -60
          find /tmp/form -name 'nov2026-form-decade-all-robust-cells.csv.gz' -exec cp {} analysis-results/premined-form/ \;
          find /tmp/joint -name 'nov2026-relative-draw-robust-cells.csv.gz' -exec cp {} analysis-results/premined-joint/ \;
          find /tmp/pair -name 'nov2026-form-pair-venue-quarter-robust-cells.csv.gz' -exec cp {} analysis-results/premined-pair/ \;
          test -s analysis-results/premined-form/nov2026-form-decade-all-robust-cells.csv.gz
          test -s analysis-results/premined-joint/nov2026-relative-draw-robust-cells.csv.gz
          test -s analysis-results/premined-pair/nov2026-form-pair-venue-quarter-robust-cells.csv.gz
      - name: Calculate chronological marginal portfolio cash
        run: python scripts/research-nov2026-marginal-portfolio-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marginal-joint-cash-research
          path: |
            analysis-results/nov2026-marginal-portfolio-cash.json
            analysis-results/nov2026-marginal-portfolio-bets.csv.gz
          if-no-files-found: warn
