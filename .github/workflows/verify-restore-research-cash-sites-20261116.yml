name: Verify restoration of 6m/96m research predictions without canonical changes
on:
  push:
    branches: [fix/restore-pre-independent-prediction-sites-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Strict routing and cron restoration audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          router=Path('src/public-site-entry-performance-history-fix-20260915.ts').read_text()
          assert 'return serveFullModel(request, env,fullModelPath[1]==="6m"?"cash6":"cash96",fullModelPath[2]);' in router
          assert 'independentHomeResponse' not in router
          assert 'independentDetailResponse' not in router
          assert 'independentDayApi' not in router
          assert 'independentPerformance' not in router
          assert 'return addOriginalModelSwitch' in router
          for mode in ('6m','96m'):
            conf=json.loads(Path('wrangler.independent-'+mode+'.jsonc').read_text())
            assert conf['triggers']['crons']==[],mode
          print('RESTORED_RESEARCH_CASH_SITES_AND_ZERO_INDEPENDENT_SCHEDULES_OK')
          PY
      - name: Compile and test existing and restored model sources
        run: |
          npm run typecheck
          npx tsc -p tsconfig.three-model.json
          npx tsc -p tsconfig.test.json
          node dist-test/tests/three-model-full-pages-tests.js
          node dist-test/tests/three-model-compare-tests.js
          npm run test:unit
      - name: Dry-run canonical production Worker bundle only
        run: |
          python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy<3"
          python scripts/build-worker-completed-model-assets.py
          npx wrangler deploy --dry-run --outdir dist-rollback-production
          test -n "$(find dist-rollback-production -type f -name '*.js' -print -quit)"
      - name: Dry-run disabled-schedule 6m and 96m Workers
        run: |
          npx wrangler deploy --dry-run --config wrangler.independent-6m.jsonc --outdir dist-no-6m-cron
          npx wrangler deploy --dry-run --config wrangler.independent-96m.jsonc --outdir dist-no-96m-cron
