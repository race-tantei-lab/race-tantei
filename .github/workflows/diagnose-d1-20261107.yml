name: Diagnose D1 availability (read only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-d1-20261107.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Publish read-only diagnostic link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=diagnostics/d1-read-probe \
            -f description="Checking D1 REST rejection reason (read-only)" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Read one harmless D1 row and expose the Cloudflare error reason
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://api.cloudflare.com/client/v4/accounts/3c6d1826b573b2e68cb13ec37e9e8ade/d1/database/949b5e8b-d1a4-4c4e-80d1-d031afdc03de/query"
          payload = json.dumps({"sql": "SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1", "params": ["public_daily_performance_history:v1"]}).encode()
          request = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.loads(response.read().decode())
                  print("D1_DIAG_STATUS", response.status)
                  print("D1_DIAG_RESPONSE", json.dumps({"success": body.get("success"), "errors": body.get("errors"), "readRows": sum(len(x.get("results") or []) for x in (body.get("result") or [])), "rowsRead": sum(int((x.get("meta") or {}).get("rows_read", 0)) for x in (body.get("result") or []))}, ensure_ascii=False))
          except urllib.error.HTTPError as exc:
              print("D1_DIAG_HTTP_ERROR", exc.code)
              print("D1_DIAG_ERROR_BODY", exc.read().decode("utf-8", "replace")[:1500])
          PY
      - name: Probe public routes without writing
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = "https://race-tantei-phase0.race-tantei.workers.dev"
          for path in ["/", "/api/public/today-summary", "/api/public/day?date=2026-11-07", "/races/"]:
              for attempt in range(1, 4):
                  url = base + path + ("&" if "?" in path else "?") + "_diagnostic=" + str(attempt)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={"Cache-Control": "no-cache"}), timeout=12) as response:
                          body = response.read()
                          keys = []
                          if "json" in response.headers.get("Content-Type",""):
                              try:
                                  data = json.loads(body)
                                  keys = list(data.keys())
                                  if path.startswith("/api/public/today-summary"): keys += ["courses=" + str(len(data.get("courses") or [])), "hasPredictions=" + str(data.get("hasPredictions"))]
                              except Exception: keys = ["bad-json"]
                          print("PUBLIC_PROBE", path, attempt, response.status, "ui="+str(response.headers.get("x-race-ui-version")), "stale="+str(response.headers.get("x-race-home-data-status")), "bytes="+str(len(body)), "keys="+json.dumps(keys))
                  except urllib.error.HTTPError as exc:
                      print("PUBLIC_PROBE_HTTP_ERROR", path, attempt, exc.code, "body="+exc.read(180).decode("utf-8", "replace"))
                  except Exception as exc:
                      print("PUBLIC_PROBE_ERROR", path, attempt, type(exc).__name__, str(exc)[:180])
          PY
      - name: Mark diagnostic completed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=diagnostics/d1-read-probe \
            -f description="Read-only D1 probe finished; inspect diagnostic log" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
