name: Audit locked shadow vs live ROI (read-only)

on:
  schedule:
    - cron: "15 11 * * *" # 20:15 JST, after normal JRA settlement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify identical-race settlement math without D1 access
        run: python3 scripts/audit-live-shadow-portfolio-roi.py --self-test
      - name: Inspect past races only; never write D1 or modify public bets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python3 scripts/audit-live-shadow-portfolio-roi.py
