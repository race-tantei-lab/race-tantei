name: Inspect live Niigata9 production state
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-sapporo12-status-20260823.yml"
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/niigata9-live-inspect' -f description='Inspecting Niigata9 final and driver state' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Inspect D1 and health
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEALTH ==='
          for u in https://race-tantei-live-deadline.race-tantei.workers.dev/health https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health; do curl -fsS "$u"; echo; done
          echo '=== FINAL SHAPE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,COUNT(*) AS bet_rows,COUNT(DISTINCT course) AS courses,COUNT(DISTINCT bet_type||':'||combination) AS unique_bets,MIN(locked_at) AS locked_at,MAX(locked_at) AS max_locked_at,group_concat(course||':'||bet_type||':'||combination||':'||stake_yen,' | ') AS rows FROM rt_public_bets WHERE race_id='2026-08-23-niigata-09' GROUP BY race_id"
          echo '=== FINAL STATE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key,updated_at,json_extract(state_value,'$.finalizedFrom') AS finalized_from,json_extract(state_value,'$.previewGeneratedAt') AS preview_generated_at,json_extract(state_value,'$.generationStartedAt') AS generation_started_at,json_extract(state_value,'$.oddsFetchedAt') AS odds_fetched_at,json_extract(state_value,'$.oddsSource') AS odds_source,json_extract(state_value,'$.bodyWeightApplied') AS body_weight_applied,json_extract(state_value,'$.bodyWeightFetchedAt') AS body_weight_fetched_at,json_extract(state_value,'$.onlineLearning.cutoffUtc') AS learning_cutoff,json_extract(state_value,'$.bodyWeightError') AS body_weight_error FROM rt_system_state WHERE state_key='worker_live_final:2026-08-23-niigata-09' LIMIT 1"
          echo '=== DRIVER/AUDIT ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('live_deadline_driver:2026-08-23','worker_live_lock:2026-08-23','worker_deadline_guard:2026-08-23','live_deadline_sla:2026-08-23') ORDER BY state_key"
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/niigata9-live-inspect' -f description='Niigata9 live state captured' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/niigata9-live-inspect' -f description='Niigata9 live state capture failed' -f target_url="$STATUS_TARGET_URL" >/dev/null