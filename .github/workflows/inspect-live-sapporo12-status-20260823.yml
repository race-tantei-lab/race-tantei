name: Inspect live Sapporo12 production state
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-sapporo12-status-20260823.yml"
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/sapporo12-live-inspect' -f description='Inspecting Sapporo12 and later live finals' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Inspect D1 and health
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEALTH ==='
          for u in https://race-tantei-live-deadline.race-tantei.workers.dev/health https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health; do curl -fsS "$u" || true; echo; done
          echo '=== RACES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "WITH ids(race_id) AS (VALUES ('2026-08-23-sapporo-12'),('2026-08-23-niigata-09'),('2026-08-23-chukyo-09'),('2026-08-23-chukyo-10'),('2026-08-23-niigata-11'),('2026-08-23-niigata-12')) SELECT i.race_id,r.start_time_jst,r.start_time_utc,ROUND((julianday(r.start_time_utc)-julianday('now'))*1440,2) AS minutes_to_start,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=i.race_id) AS bet_rows,(SELECT COUNT(DISTINCT course) FROM rt_public_bets b WHERE b.race_id=i.race_id) AS courses,(SELECT COUNT(DISTINCT bet_type||':'||combination) FROM rt_public_bets b WHERE b.race_id=i.race_id) AS unique_bets,(SELECT json_array_length(json_extract(s.state_value,'$.snapshots[0].courseBets')) FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||i.race_id) AS preview_bets,(SELECT json_extract(s.state_value,'$.snapshots[0].generatedAt') FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||i.race_id) AS preview_generated,(SELECT json_extract(s.state_value,'$.snapshots[0].oddsSource') FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||i.race_id) AS odds_source FROM ids i LEFT JOIN rt_races r ON r.race_id=i.race_id ORDER BY r.start_time_utc"
          echo '=== STATES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('live_deadline_driver:2026-08-23','worker_live_lock:2026-08-23','worker_deadline_guard:2026-08-23','live_deadline_sla:2026-08-23','live_deadline_priority_guard_success:2026-08-23') ORDER BY state_key"
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/sapporo12-live-inspect' -f description='Live state captured' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/sapporo12-live-inspect' -f description='Live state capture failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
