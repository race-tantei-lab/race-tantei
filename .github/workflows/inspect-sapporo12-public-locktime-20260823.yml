name: Verify Sapporo12 lock time and public page
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-sapporo12-public-locktime-20260823.yml"
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/sapporo12-public-locktime' -f description='Checking lock timestamp and public page' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Check D1 lock timestamp
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id,settlement_status FROM rt_public_bets WHERE race_id='2026-08-23-sapporo-12' ORDER BY course,bet_type,combination"
      - name: Check public race page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://race-tantei-phase0.race-tantei.workers.dev/races/2026-08-23-sapporo-12'
          code=$(curl --max-time 20 --retry 3 --retry-delay 2 -sS -o /tmp/page -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          echo '=== HEADERS ==='
          curl --max-time 20 -sSI "$URL" | sed -n '1,30p'
          echo '=== PUBLIC MATCHES ==='
          grep -o -E '.{0,120}(札幌|sapporo|12R|馬連|ワイド|三連複|買い目|円).{0,180}' /tmp/page | head -80 || true
          echo '=== COUNTS ==='
          echo "bytes=$(wc -c </tmp/page)"
          echo "race_mentions=$(grep -oi 'sapporo-12\|札幌12\|12R' /tmp/page | wc -l)"
          echo "yen_mentions=$(grep -o '円' /tmp/page | wc -l)"
          test "$code" = 200
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/sapporo12-public-locktime' -f description='Lock time and public page captured' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/sapporo12-public-locktime' -f description='Lock/page check failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
