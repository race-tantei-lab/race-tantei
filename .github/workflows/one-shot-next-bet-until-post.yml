name: One-shot next bet until post

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-next-bet-until-post.yml"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run next bet until post one-shot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch canonical next-bet display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/public-site-entry-v31.ts')
          text = path.read_text()
          old = '''  if (path === "/") {
              if (!html.includes('class="home-next-release')) {
                const state = await loadStableNextBet(env);
                const slot = stableNextBetHtml(state);
                if (html.includes('<details class="home-publish-flow home-publish-details">')) {
                  html = html.replace('<details class="home-publish-flow home-publish-details">', `${slot}<details class="home-publish-flow home-publish-details">`);
                } else {
                  html = html.replace(/(<div class="section-title"><h2>累計回収率<\\/h2>)/, `${slot}$1`);
                }
              }
          '''
          new = '''  if (path === "/") {
              const state = await loadStableNextBet(env);
              const slot = stableNextBetHtml(state);
              if (html.includes('class="home-next-release')) {
                html = html.replace(/<section class="home-next-release[\\s\\S]*?<\\/section>/, slot);
              } else if (html.includes('<details class="home-publish-flow home-publish-details">')) {
                html = html.replace('<details class="home-publish-flow home-publish-details">', `${slot}<details class="home-publish-flow home-publish-details">`);
              } else {
                html = html.replace(/(<div class="section-title"><h2>累計回収率<\\/h2>)/, `${slot}$1`);
              }
          '''
          if old not in text:
              raise SystemExit('TARGET_BLOCK_NOT_FOUND')
          text = text.replace(old, new, 1)
          text = text.replace(
              'const UI_VERSION = "ten-year-completed-public-v31-current-methodology-20260816";',
              'const UI_VERSION = "ten-year-completed-public-v31-next-bet-until-post-20260830";',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/public-site-entry-v31.ts

      - name: Verify live-lock safety
        run: python scripts/verify-live-lock-safety.py

      - name: Typecheck
        run: npm run typecheck

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-tantei-ui-fix-bot"
          git config user.email "race-tantei-ui-fix-bot@users.noreply.github.com"
          git add src/public-site-entry-v31.ts
          git commit -m "Keep finalized next bet visible until post"
          git pull --rebase origin main
          git push origin HEAD:main
