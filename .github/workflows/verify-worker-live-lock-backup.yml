name: Verify Worker Live-Lock Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-worker-live-lock-backup.yml
      - scripts/verify-worker-live-lock-backup.py

permissions:
  contents: read

concurrency:
  group: verify-worker-live-lock-backup
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for fresh Cloudflare cron audit
        run: python scripts/verify-worker-live-lock-backup.py
