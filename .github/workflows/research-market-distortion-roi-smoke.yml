name: Research market distortion ROI smoke

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-market-distortion-roi-smoke.yml"
      - "scripts/research-evaluate-market-distortion-roi.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  OLD_ODDS_RUN_ID: '31373205723'
  BEST_DEMAND_RUN_ID: '31417411680'
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Mark market distortion smoke pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/market-distortion-roi-smoke' \
            -f description='Validating production-style market features on overlap-only official odds' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator
        run: python -m py_compile scripts/research-evaluate-market-distortion-roi.py
      - name: Download corpus, frozen selection, and old official odds overlap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip ten-year-history-corpus.jsonl -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BEST_DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-blend-0.60" and .expired==false) | .id' demand-artifacts.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_ODDS_RUN_ID}/artifacts?per_page=100" > odds-artifacts.json
          for year in $(seq 2016 2026); do
            name="research-demanded-odds-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' odds-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$year.zip"
            mkdir -p "tmp-$year"; unzip -q "$year.zip" -d "tmp-$year"
            cp "tmp-$year/research-demanded-odds-${year}.jsonl" "odds/research-continuous-market-odds-${year}.jsonl"
          done
      - name: Run market distortion ROI evaluator on overlap only
        run: |
          python scripts/research-evaluate-market-distortion-roi.py \
            --corpus history/ten-year-history-corpus.jsonl \
            --demand demand/demand.jsonl \
            --odds-dir odds \
            --out analysis-results/market-distortion-smoke.json
      - name: Verify smoke provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/market-distortion-smoke.json').read_text())
          assert m['selectedDemandRaces']==14410,m
          assert m['missingOddsRaceCount']>0,m
          assert m['marketFeatureFormulaMatchesProductionLiveGenerator'] is True,m
          assert m['productionRulesReused'] is False,m
          assert m['raceSelectionFrozenBeforeOdds'] is True,m
          assert m['targetDayResultsUsedForRaceSelection'] is False,m
          assert m['sameDayResultsUsedForTicketValue'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          b=m['bestVariant'];v=m['variants'][b]
          print(json.dumps({'partialSmokeOnly':True,'best':b,'evaluated':v['evaluatedRaces'],'errors':v['evaluationErrorCount'],'roi':{c:x['roiPct'] for c,x in v['courses'].items()}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-market-distortion-roi-smoke
          path: analysis-results/market-distortion-smoke.json
          retention-days: 14
      - name: Mark market distortion smoke success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/market-distortion-roi-smoke' \
            -f description='Production-style market feature overlap smoke completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark market distortion smoke failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/market-distortion-roi-smoke' \
            -f description='Market distortion ROI smoke requires repair' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
