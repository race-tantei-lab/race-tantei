name: Settle August 9 payouts now
run-name: Settle August 9 payouts · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settle-aug9-now.yml'
      - 'scripts/sync-aug9-selected-payouts.py'
      - 'scripts/settle-aug9-public-bets.py'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: settle-aug9-now
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Mark settlement pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/aug9-settlement' -f description='8/9公式払戻を取得・精算中' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync official payouts
        run: |
          set -o pipefail
          python scripts/sync-aug9-selected-payouts.py | tee /tmp/payout-sync.log

      - name: Settle reconstructed and live bets
        run: |
          set -o pipefail
          python scripts/settle-aug9-public-bets.py | tee /tmp/settlement.log

      - name: Audit payout display data
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          root=pathlib.Path('.')
          p=root/'scripts'/'collect-jra-official-odds.py'
          spec=importlib.util.spec_from_file_location('audit_d1',p);m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          per_race=m.d1_query('''
            SELECT b.race_id AS raceId,b.course,SUM(b.stake_yen) AS stakeYen,SUM(COALESCE(b.return_yen,0)) AS returnYen,
                   MIN(b.settlement_status) AS minStatus,MAX(b.settlement_status) AS maxStatus
            FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id
            WHERE b.race_id LIKE '2026-08-09-%' AND r.status='finished'
            GROUP BY b.race_id,b.course ORDER BY b.race_id,b.course
          ''')
          totals=m.d1_query('''
            SELECT course,COUNT(DISTINCT race_id) AS settledRaces,SUM(stake_yen) AS stakeYen,SUM(COALESCE(return_yen,0)) AS returnYen
            FROM rt_public_bets WHERE race_id LIKE '2026-08-09-%' AND settlement_status='settled'
            GROUP BY course ORDER BY course
          ''')
          hit=[];by={}
          for x in per_race: by.setdefault(x['raceId'],{})[x['course']]=int(x.get('returnYen') or 0)
          for race,payouts in by.items():
            if any(v>0 for v in payouts.values()):hit.append({'raceId':race,'payouts':payouts})
          payload={'finishedCourseRows':per_race,'aug9Totals':totals,'hitRaces':hit}
          pathlib.Path('analysis-results').mkdir(exist_ok=True)
          pathlib.Path('analysis-results/aug9-settlement-final.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          assert all(x['minStatus']=='settled' and x['maxStatus']=='settled' for x in per_race), per_race
          PY

      - name: Save final settlement audit
        run: |
          cp /tmp/payout-sync.log analysis-results/aug9-selected-payout-sync.log
          cp /tmp/settlement.log analysis-results/aug9-public-settlement.log
          git add -f analysis-results/aug9-selected-payout-sync.json analysis-results/aug9-selected-payout-sync.log analysis-results/aug9-public-settlement.json analysis-results/aug9-public-settlement.log analysis-results/aug9-settlement-final.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Save final August 9 payout settlement'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Mark settlement success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/aug9-settlement' -f description='8/9公式払戻の精算完了' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark settlement failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/aug9-settlement' -f description='8/9公式払戻の精算失敗' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
