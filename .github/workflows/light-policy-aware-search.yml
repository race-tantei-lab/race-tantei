name: Policy-aware light betting search

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/light-policy-aware-search.yml"
      - "scripts/run-light-policy-aware-search.mjs"
      - "scripts/train-payout-segment-ensemble.mjs"
      - "src/v1/**"
      - "package.json"

concurrency:
  group: policy-aware-light-betting-search
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build analysis modules
        run: npm run build:test

      - name: Search policy-aware light strategy
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-light-policy-aware-search.mjs 2>&1 | tee light-policy-aware-search.log

      - name: Publish result
        if: always()
        shell: bash
        run: |
          if [[ -f light-policy-aware-search.json ]]; then
            echo "## Policy-aware light search" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat light-policy-aware-search.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-policy-aware-search
          path: |
            light-policy-aware-search.json
            light-policy-aware-search.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save available result to GitHub
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in light-policy-aware-search.json light-policy-aware-search.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No result change to commit."
          else
            git commit -m "Save policy-aware light betting analysis"
            git push
          fi
