name: Verify Aug 30 entry fill 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aug30-entry-fill-20260829.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production cron
        run: sleep 85
      - name: Inspect Aug 30 entry repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def q(sql,params=None):
              req=urllib.request.Request(url,data=json.dumps({'sql':sql,'params':params or []}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(body)
              return (body.get('result') or [{}])[0].get('results') or []
          rows=q("""
          WITH per_race AS (
            SELECT r.race_id,r.venue,r.race_no,
                   MAX(CASE WHEN LENGTH(TRIM(COALESCE(r.entry_url,'')))>0 THEN 1 ELSE 0 END) AS hasEntry,
                   SUM(CASE WHEN COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS activeRunners
            FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
            WHERE r.race_date='2026-08-30'
            GROUP BY r.race_id,r.venue,r.race_no
          )
          SELECT venue,COUNT(*) AS races,
                 SUM(CASE WHEN hasEntry=1 AND activeRunners>=3 THEN 1 ELSE 0 END) AS entriesReady,
                 SUM(activeRunners) AS activeRunnerRows
          FROM per_race GROUP BY venue ORDER BY venue
          """)
          print('AUG30_ENTRY_COUNTS',json.dumps(rows,ensure_ascii=False))
          states=q("""
          SELECT state_key AS stateKey,state_value AS stateValue,updated_at AS updatedAt
          FROM rt_system_state
          WHERE state_key IN ('worker_upcoming_entry_derived_repair','worker_upcoming_entry_repair')
             OR state_key LIKE 'worker_upcoming_entry_probe:2026-08-30:%'
          ORDER BY updated_at DESC LIMIT 12
          """)
          print('AUG30_ENTRY_STATES',json.dumps(states,ensure_ascii=False))
          PY
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          curl -sS --max-time 10 -D /tmp/h -o /tmp/d -w 'AUG30_API total=%{time_total}s http=%{http_code}\n' "$base/api/public/day?date=2026-08-30&_rt=$(date +%s%N)"
          grep -i '^x-race-upcoming-day-path: direct-d1-fast-upcoming-v1' /tmp/h
