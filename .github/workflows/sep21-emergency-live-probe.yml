name: Sep21 Emergency Live Probe

on:
  push:
    branches: [ops/sep21-final-preflight]
    paths:
      - ".github/workflows/sep21-emergency-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Probe leases and current state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT 'lease' AS kind,lease_key AS key,owner,expires_at_epoch-unixepoch('now') AS remainingSec,updated_at,NULL AS payload
            FROM rt_live_deadline_lease
            UNION ALL
            SELECT 'state',state_key,NULL,NULL,updated_at,state_value
            FROM rt_system_state
            WHERE state_key IN (
              'live_deadline_primary_heartbeat:v2',
              'live_deadline_driver:2026-09-21',
              'worker_deadline_guard:2026-09-21',
              'worker_live_preview:2026-09-21-nakayama-01',
              'worker_live_preview:2026-09-21-hanshin-01'
            )
            ORDER BY kind,key
          "
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT
              r.race_id AS raceId,
              r.start_time_jst AS startTimeJst,
              ROUND((julianday(r.start_time_utc)-julianday('now'))*1440,2) AS remainingMin,
              (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
              (SELECT json_extract(p.state_value,'$.snapshots[0].generatedAt') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS previewGeneratedAt,
              (SELECT json_extract(p.state_value,'$.snapshots[0].oddsSource') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS oddsSource,
              (SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id=r.race_id) AS archiveRows
            FROM rt_races r
            WHERE r.race_id IN ('2026-09-21-nakayama-01','2026-09-21-hanshin-01','2026-09-21-nakayama-02')
            ORDER BY r.start_time_utc
          "

      - name: Capture live outcomes
        shell: bash
        run: |
          set +e
          timeout 80s npx wrangler tail race-tantei-live-deadline --format json > /tmp/p.log 2>&1 &
          p1=$!
          timeout 80s npx wrangler tail race-tantei-live-deadline-backup --format json > /tmp/b.log 2>&1 &
          p2=$!
          wait $p1; true
          wait $p2; true
          echo '---PRIMARY---'; tail -n 220 /tmp/p.log
          echo '---BACKUP---'; tail -n 220 /tmp/b.log
          exit 0

      - name: Re-probe after tails
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT
              datetime('now','+9 hours') AS jstNow,
              (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_driver:2026-09-21') AS driverUpdatedAt,
              (SELECT state_value FROM rt_system_state WHERE state_key='live_deadline_driver:2026-09-21') AS driver,
              (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_primary_heartbeat:v2') AS heartbeatUpdatedAt,
              (SELECT updated_at FROM rt_system_state WHERE state_key='worker_deadline_guard:2026-09-21') AS guardUpdatedAt,
              (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id='2026-09-21-nakayama-01' AND b.source_prediction_id=-2) AS nak1FinalRows,
              (SELECT json_extract(p.state_value,'$.snapshots[0].generatedAt') FROM rt_system_state p WHERE p.state_key='worker_live_preview:2026-09-21-nakayama-01') AS nak1Preview,
              (SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id='2026-09-21-nakayama-01') AS nak1ArchiveRows
          "
