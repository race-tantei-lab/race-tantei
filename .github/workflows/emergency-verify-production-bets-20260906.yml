name: Emergency verify production bets 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-verify-production-bets-20260906.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export production D1 without SELECT quota
        run: npx wrangler d1 export race-tantei-phase0 --remote --output=/tmp/prod.sql
      - name: Verify real production rows from export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          src=pathlib.Path('/tmp/prod.sql'); dst=pathlib.Path('/tmp/current-day.sql')
          needle='2026-09-06'
          def statements(lines):
              buf=[]; quote=None
              for line in lines:
                  buf.append(line); i=0; complete=False
                  while i<len(line):
                      c=line[i]
                      if quote:
                          if c==quote:
                              if quote=="'" and i+1<len(line) and line[i+1]=="'": i+=2; continue
                              quote=None
                      else:
                          if c in ("'", '"'): quote=c
                          elif c==';': complete=True
                      i+=1
                  if complete and quote is None:
                      yield ''.join(buf); buf=[]
              if buf: yield ''.join(buf)
          with src.open('r',encoding='utf-8') as fin, dst.open('w',encoding='utf-8') as out:
              out.write('PRAGMA foreign_keys=OFF;\nBEGIN;\n')
              for stmt in statements(fin):
                  u=stmt.lstrip().upper()
                  if u.startswith('CREATE TABLE ') or (u.startswith('INSERT INTO ') and needle in stmt):
                      out.write(stmt if stmt.endswith('\n') else stmt+'\n')
              out.write('COMMIT;\n')
          PY
          rm -f /tmp/current.sqlite
          sqlite3 /tmp/current.sqlite < /tmp/current-day.sql
          python - <<'PY'
          import collections,json,sqlite3
          db=sqlite3.connect('/tmp/current.sqlite'); db.row_factory=sqlite3.Row
          row=db.execute("SELECT state_value FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-06' LIMIT 1").fetchone()
          if not row: raise SystemExit('SELECTION_MISSING')
          sel=json.loads(row['state_value']); selected=sel.get('selected') or []
          if len(selected)!=15: raise SystemExit(f'SELECTION_COUNT_INVALID:{len(selected)}')
          expected={'ライト':2000,'スタンダード':5000,'プレミアム':10000}
          summary=[]
          for item in selected:
              rid=str(item['raceId'])
              race=db.execute('SELECT venue,race_no,start_time_utc FROM rt_races WHERE race_id=?',(rid,)).fetchone()
              rows=db.execute("SELECT course,bet_type,combination,stake_yen,source_prediction_id,settlement_status,locked_at FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination",(rid,)).fetchall()
              by=collections.defaultdict(list)
              for r in rows: by[str(r['course'])].append(r)
              exact=len(rows)==6 and set(by)==set(expected)
              sig=[]
              if exact:
                  for course,budget in expected.items():
                      cr=by[course]
                      exact &= len(cr)==2 and len({r['bet_type'] for r in cr})==2 and sum(int(r['stake_yen']) for r in cr)==budget
                      exact &= all(int(r['source_prediction_id'])==-2 and str(r['settlement_status'])=='pending' and r['locked_at'] for r in cr)
                      sig.append({(str(r['bet_type']),str(r['combination'])) for r in cr})
                  exact &= sig[0]==sig[1]==sig[2]
              summary.append({'raceId':rid,'venue':race['venue'] if race else item.get('venue'),'raceNo':race['race_no'] if race else item.get('raceNo'),'startUtc':race['start_time_utc'] if race else None,'rows':len(rows),'exactSix':bool(exact)})
          print('SELECTION_SOURCE',sel.get('sourceModel'),'RESULT_DATA_USED',sel.get('resultDataUsedForTargetDay'))
          print('PRODUCTION_BET_SUMMARY',json.dumps(summary,ensure_ascii=False))
          print('EXACT_SIX_IDS',json.dumps([x['raceId'] for x in summary if x['exactSix']],ensure_ascii=False))
          print('EMPTY_IDS',json.dumps([x['raceId'] for x in summary if x['rows']==0],ensure_ascii=False))
          PY
