name: Research Aug-Nov independent model families paired hit plus JRA ROI (no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-postaug-independent-models-paired.py
      - scripts/postaug-support-aug-nov-frozen-policy-recheck.py
      - scripts/postaug-support-chronological-56feature-validation.py
      - .github/workflows/research-postaug-independent-models-paired.yml

permissions:
  contents: read

concurrency:
  group: independent-postaug-2026-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned offline research libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1' 'beautifulsoup4==4.13.4'
      - name: Syntax and exact two-type settlement accounting
        run: |
          python -m py_compile scripts/research-postaug-independent-models-paired.py
          python scripts/research-postaug-independent-models-paired.py --self-test
      - name: Read bounded actual D1 results and compare independent model probabilities and portfolios
        run: python -u scripts/research-postaug-independent-models-paired.py
      - name: Upload paired hit rate AND ROI evidence without touching production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postaug-independent-models-hit-roi-no-promotion
          path: |
            analysis-results/postaug-independent-paired-model-search-20261107.json
            analysis-results/model-packages/postaug-extra-trees-120.joblib
            analysis-results/model-packages/postaug-extra-trees-120-manifest.json
          if-no-files-found: warn
          retention-days: 30
