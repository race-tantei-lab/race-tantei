name: Repair today settlement identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-today-settlement-identity.yml"

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  GH_TOKEN: ${{ github.token }}
  IDENTITY_SAFE_CODE_SHA: 0d7831fe2eb88b712b6eba7269e10f89c3c73c58

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for identity-safe Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-worker.yml/runs?head_sha=${IDENTITY_SAFE_CODE_SHA}&per_page=5")
            state=$(printf '%s' "$json" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("workflow_runs",[]); print((r[0].get("status")+":"+str(r[0].get("conclusion"))) if r else "missing")')
            echo "identity-safe deploy=$state"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            if [[ "$state" == completed:* ]]; then exit 1; fi
            sleep 5
          done
          echo 'IDENTITY_SAFE_DEPLOY_TIMEOUT' >&2
          exit 1
      - name: Verify exact JRA race key and reset only current-day settlement
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, importlib.util, json, pathlib, sys, urllib.parse

          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('repair_d1',p)
          m=importlib.util.module_from_spec(s);sys.modules['repair_d1']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          rows=m.d1_query('''
            SELECT DISTINCT r.race_id AS raceId,r.race_date AS raceDate,r.venue,r.race_no AS raceNo,
                   r.entry_url AS entryUrl,r.result_url AS storedResultUrl,s.result_url AS sourceResultUrl
            FROM rt_races r
            JOIN rt_public_bets b ON b.race_id=r.race_id
            JOIN rt_race_sources s ON s.race_id=r.race_id AND s.entry_url=r.entry_url
            WHERE r.race_date=? AND r.status='finished' AND s.result_url IS NOT NULL
            ORDER BY r.start_time_utc,r.race_id
          ''',[date])
          if not rows:
              print(json.dumps({'status':'NO_FINISHED_PUBLIC_RACES','date':date},ensure_ascii=False))
              pathlib.Path('/tmp/repair_ids.txt').write_text('',encoding='utf-8')
              raise SystemExit(0)

          def cname(url):
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(str(url)).query)
              return (q.get('CNAME') or q.get('cname') or [''])[0]

          valid=[]; evidence=[]
          for row in rows:
              entry=cname(row['entryUrl'])
              source=cname(row['sourceResultUrl'])
              expected=entry.replace('pw01dde','pw01sde',1).replace('sw01dde','sw01sde',1)
              ok=bool(entry and source and expected!=entry and source==expected)
              ev={'raceId':row['raceId'],'raceDate':row['raceDate'],'venue':row['venue'],'raceNo':int(row['raceNo']),
                  'entryCname':entry,'expectedResultCname':expected,'sourceResultCname':source,
                  'storedResultUrl':row['storedResultUrl'],'sourceResultUrl':row['sourceResultUrl'],'identityOk':ok}
              evidence.append(ev)
              if not ok:
                  raise RuntimeError('JRA_RESULT_RACE_KEY_MISMATCH:'+json.dumps(ev,ensure_ascii=False))
              valid.append(str(row['raceId']))

          pathlib.Path('/tmp/repair_ids.txt').write_text('\n'.join(valid)+'\n',encoding='utf-8')
          pathlib.Path('/tmp/source_identity.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          placeholders=','.join('?' for _ in valid)
          # Predictions, selected races, ticket combinations, official odds and stakes remain untouched.
          m.d1_query(f'DELETE FROM rt_payouts WHERE race_id IN ({placeholders})',valid)
          m.d1_query(f'''UPDATE rt_public_bets SET settlement_status='pending',return_yen=NULL WHERE race_id IN ({placeholders})''',valid)
          m.d1_query(f'''UPDATE rt_races
                         SET result_url=(SELECT s.result_url FROM rt_race_sources s WHERE s.race_id=rt_races.race_id AND s.entry_url=rt_races.entry_url LIMIT 1),
                             refund_horse_nos_json='[]',updated_at=CURRENT_TIMESTAMP
                         WHERE race_id IN ({placeholders})''',valid)
          print(json.dumps({'status':'RESET_FOR_OFFICIAL_RECONCILIATION','date':date,'raceIds':valid,'identityEvidence':evidence},ensure_ascii=False))
          PY
      - name: Reconcile from identity-checked JRA results
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          [ -s /tmp/repair_ids.txt ] || exit 0
          for i in $(seq 1 6); do
            curl --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 90 -fsS \
              "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$today&repair=$i" -o /tmp/today.json || true
            sleep 3
          done
      - name: Verify repaired settlement and public hit labels
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          ids=[x for x in pathlib.Path('/tmp/repair_ids.txt').read_text(encoding='utf-8').splitlines() if x]
          if not ids:
              print('NO_REPAIR_IDS'); raise SystemExit(0)
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('verify_d1',p);m=importlib.util.module_from_spec(s);sys.modules['verify_d1']=m;s.loader.exec_module(m)
          ph=','.join('?' for _ in ids)
          bets=m.d1_query(f'''SELECT race_id AS raceId,course,bet_type AS betType,combination,stake_yen AS stakeYen,
                                     settlement_status AS settlementStatus,return_yen AS returnYen
                              FROM rt_public_bets WHERE race_id IN ({ph}) ORDER BY race_id,id''',ids)
          payouts=m.d1_query(f'''SELECT race_id AS raceId,bet_type AS betType,combination,payout_yen AS payoutYen,popularity
                                 FROM rt_payouts WHERE race_id IN ({ph}) ORDER BY race_id,bet_type,combination''',ids)
          if not payouts: raise RuntimeError('REPAIR_NO_OFFICIAL_PAYOUTS_IMPORTED')
          pending=[b for b in bets if str(b.get('settlementStatus'))!='settled']
          if pending: raise RuntimeError('REPAIR_BETS_STILL_PENDING:'+json.dumps(pending,ensure_ascii=False))
          by={rid:[] for rid in ids}
          for b in bets: by[str(b['raceId'])].append(b)
          expected={rid:('hit' if any(int(x.get('returnYen') or 0)>0 for x in rows) else 'miss') for rid,rows in by.items()}
          payload=json.loads(pathlib.Path('/tmp/today.json').read_text(encoding='utf-8'))
          api={str(r.get('raceId')):str((r.get('publicState') or {}).get('code') or '') for r in payload.get('races',[])}
          mismatch=[{'raceId':rid,'expected':code,'actual':api.get(rid)} for rid,code in expected.items() if api.get(rid)!=code]
          if mismatch: raise RuntimeError('REPAIR_PUBLIC_LABEL_MISMATCH:'+json.dumps(mismatch,ensure_ascii=False))
          result={'status':'TODAY_SETTLEMENT_REPAIRED','expectedPublicState':expected,
                  'hitRaceIds':[rid for rid,code in expected.items() if code=='hit'],'bets':bets,'payouts':payouts}
          print(json.dumps(result,ensure_ascii=False))
          pathlib.Path('/tmp/repair_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-settlement-identity-repair
          path: |
            /tmp/source_identity.json
            /tmp/repair_result.json
          if-no-files-found: warn
          retention-days: 30
