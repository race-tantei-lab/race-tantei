name: Emergency D1 write probe 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-d1-write-probe-20260906.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Single-row write probe only
        shell: bash
        run: |
          set +e
          key="ops_write_probe:2026-09-06:${GITHUB_RUN_ID}"
          cmd="INSERT INTO rt_system_state (state_key,state_value,updated_at) VALUES ('$key','{\"probe\":true,\"date\":\"2026-09-06\"}',CURRENT_TIMESTAMP)"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$cmd" >/tmp/probe.out 2>/tmp/probe.err
          rc=$?
          echo "WRITE_PROBE_RC=$rc"
          echo "--- probe stdout ---"
          cat /tmp/probe.out || true
          echo "--- probe stderr ---"
          cat /tmp/probe.err || true
          test "$rc" -eq 0
