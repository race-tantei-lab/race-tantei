name: Combine seasonal high-ROI cash conditions into frozen two-market portfolio
on:
  push:
    branches:
      - research/nov2026-seasonal-ensemble-cash-roi200
    paths:
      - scripts/research-nov2026-seasonal-ensemble-cash-first.py
      - .github/workflows/nov2026-seasonal-ensemble-cash-first.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  seasonal-cash-first-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin actual payout and chronological runner dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - name: Get frozen historical ROI200 source conditions (no new model fitting)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis-results/premined-form analysis-results/premined-joint
          gh run download 42926949569 --repo "${GITHUB_REPOSITORY}" \
            -n decade-form-real-payout-roi200-cells -D analysis-results/premined-form
          gh run download 42964965187 --repo "${GITHUB_REPOSITORY}" \
            -n joint-draw-field-76-schema-real-cash-roi200-cells -D analysis-results/premined-joint
          test -s analysis-results/premined-form/nov2026-form-decade-all-robust-cells.csv.gz
          test -s analysis-results/premined-joint/nov2026-relative-draw-robust-cells.csv.gz
          mkdir -p analysis-results/premined-pair
          gh run download 42967478747 --repo "${GITHUB_REPOSITORY}" \
            -n form-pair-venue-quarter-171-schema-real-cash-roi200-cells -D analysis-results/premined-pair
          test -s analysis-results/premined-pair/nov2026-form-pair-venue-quarter-robust-cells.csv.gz
      - name: Verify money arithmetic and historical condition schema
        run: |
          python -m py_compile scripts/research-nov2026-seasonal-ensemble-cash-first.py
          python -u scripts/research-nov2026-seasonal-ensemble-cash-first.py --self-test
      - name: Restore pinned cash and categorical cache if available
        uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Download same 136 immutable historical JRA settled payout mirror CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/official_csv_months
          cat /tmp/official_csv_months | xargs -P 12 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 3 --max-time 45 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Create full seasonal multi-rule policy using TRAIN CASH only then test 2023-2026
        run: python -u scripts/research-nov2026-seasonal-ensemble-cash-first.py
      - name: Preserve season by season bought tickets and strict paid yen ROI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-dynamic-multi-condition-real-money-roi200
          path: |
            analysis-results/nov2026-seasonal-ensemble-actual-cash.json
            analysis-results/nov2026-seasonal-ensemble-frozen-bets.csv.gz
          retention-days: 30
          if-no-files-found: warn
