name: Export mobile historical official odds retry
run-name: Export mobile historical official odds retry · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-mobile-historical-official-odds-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/mobile-official-odds-retry' -f description='モバイルJRA公式オッズ欠損32件を補修中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply audited current-race marker guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/export-mobile-historical-official-odds-retry.py')
          s=p.read_text(encoding='utf-8')
          old="""    h151, u151 = post_mobile(opener, {'cname': first_m.group(1)}, result_url)\n    s151 = BeautifulSoup(h151, 'html.parser')\n"""
          new="""    first_cname = first_m.group(1)\n    marker = first_cname.split('Z', 1)[0].replace('sw151ou', '', 1)\n    h151, u151 = post_mobile(opener, {'cname': first_cname}, result_url)\n    s151 = BeautifulSoup(h151, 'html.parser')\n"""
          if old not in s: raise SystemExit('FIRST_CNAME_PATCH_TARGET_MISSING')
          s=s.replace(old,new,1)
          old2="candidates = [x for x in tokens if x.startswith('sw' + prefix + 'ou')]"
          new2="candidates = [x for x in tokens if x.startswith('sw' + prefix + 'ou') and marker in x]"
          if old2 not in s: raise SystemExit('MARKER_PATCH_TARGET_MISSING')
          s=s.replace(old2,new2,1)
          s=s.replace("'source': 'jra_historical_official_odds_mobile_retry'","'source': 'jra_historical_official_odds'",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Export retry races
        run: python scripts/export-mobile-historical-official-odds-retry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-historical-official-odds-retry
          path: |
            artifacts/mobile-historical-official-odds-retry.jsonl.gz
            artifacts/mobile-historical-official-odds-retry-meta.json
          compression-level: 0
          retention-days: 14
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/mobile-official-odds-retry' -f description='モバイルJRA公式オッズ補修成功' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/mobile-official-odds-retry' -f description='モバイルJRA公式オッズ補修失敗' -f target_url="$TARGET" >/dev/null
