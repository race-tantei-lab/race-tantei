name: Verify recency strength 2026-10-12
on:
  push:
    branches: [main]
    paths:
      - ".github/analysis/recency-strength-20261012.py"
      - ".github/analysis/fetch-current-day-official-odds.py"
      - ".github/workflows/verify-recency-strength-20261012.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lightgbm==4.6.0 'numpy<3'
      - name: Freeze actual selected 30 races
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          A=os.environ['CLOUDFLARE_ACCOUNT_ID'];D=os.environ['CLOUDFLARE_D1_DATABASE_ID'];T=os.environ['CLOUDFLARE_API_TOKEN']
          U=f'https://api.cloudflare.com/client/v4/accounts/{A}/d1/database/{D}/query'
          def q(sql,p=None):
            req=urllib.request.Request(U,data=json.dumps({'sql':sql,'params':p or []}).encode(),method='POST',headers={'Authorization':f'Bearer {T}','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=120) as r:x=json.loads(r.read().decode())
            if not x.get('success'):raise RuntimeError(x)
            return (x.get('result') or [{}])[0].get('results') or []
          rows=q("SELECT state_key k,state_value v FROM rt_system_state WHERE state_key IN (?,?,?) ORDER BY state_key",[
            'final_daily_selection:2026-10-10','final_daily_selection:2026-10-11','final_daily_selection:2026-10-12'])
          ids=[]
          for z in rows:
            p=json.loads(z['v']); ids.extend(str(a['raceId']) for a in p.get('selected',[]) if a.get('raceId'))
          ids=list(dict.fromkeys(ids))
          assert len(ids)==30,(len(ids),ids)
          Path('analysis-results/fixed-oos-five-races-per-venue-day.json').write_text(json.dumps({'races':ids},ensure_ascii=False)+'\n')
          rs=q("SELECT race_id raceId,result_url resultUrl FROM rt_races WHERE race_id IN ("+','.join('?' for _ in ids)+") ORDER BY race_id",ids)
          print(json.dumps({'selected':len(ids),'mobile':sum('sp.jra.jp' in str(x.get('resultUrl') or '') or 'CNAME=sw' in str(x.get('resultUrl') or '') for x in rs),'urls':rs},ensure_ascii=False))
          PY
      - name: Fetch JRA official odds for all 30 races
        run: |
          cp scripts/export-selected-historical-official-odds.py /tmp/export.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/export.py');s=p.read_text()
          s=s.replace("ROOT = Path(__file__).resolve().parents[1]","ROOT = Path.cwd()")
          s=s.replace("START = '2024-05-04'","START = '2026-10-10'")
          s=s.replace("END_EXCLUSIVE = '2026-08-03'","END_EXCLUSIVE = '2026-10-13'")
          s=s.replace("WORKERS = 20","WORKERS = 6")
          s=s.replace("r'pw01sde10", "r'pw01sde(?:10|01)")
          s=s.replace("            tab[m.group(2)] = m.group(1)","            tab['15' + m.group(2)] = m.group(1)",1)
          p.write_text(s)
          PY
          python /tmp/export.py || true
          python .github/analysis/fetch-current-day-official-odds.py
          python - <<'PY'
          import gzip
          from pathlib import Path
          files=[Path('artifacts/selected-historical-official-odds.jsonl.gz'),Path('artifacts/current-day-selected-official-odds.jsonl.gz')]
          out=Path('artifacts/mobile-historical-official-odds-retry.jsonl.gz')
          seen=set();rows=[]
          for p in files:
            if not p.exists():continue
            with gzip.open(p,'rt',encoding='utf-8') as fh:
              for line in fh:
                if not line.strip():continue
                import json
                x=json.loads(line);rid=str(x['raceId'])
                if rid in seen:continue
                seen.add(rid);rows.append(x)
          with gzip.open(out,'wt',encoding='utf-8') as fh:
            for x in rows:fh.write(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n')
          print({'mergedOfficialOddsRaces':len(rows),'ids':sorted(seen)})
          assert len(rows)==30,(len(rows),sorted(seen))
          PY

      - name: Compare recency strengths
        run: python .github/analysis/recency-strength-20261012.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recency-strength-20261012
          path: |
            artifacts/recency-strength-20261012.json
            artifacts/selected-historical-official-odds-meta.json
            artifacts/current-day-selected-official-odds.jsonl.gz
          if-no-files-found: warn
          retention-days: 14
