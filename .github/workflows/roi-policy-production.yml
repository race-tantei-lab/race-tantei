name: ROI policy production verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish ROI verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/roi-policy' \
            -f description='Reading fixed-policy production results without mutation' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Wait for ROI policy deployment
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          expected="$(grep '"MODEL_VERSION"' wrangler.jsonc | sed -E 's/.*"MODEL_VERSION"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" EXPECTED="$expected" python - <<'PY'
          import json, os, sys
          try:
              data=json.loads(os.environ.get('HEALTH',''))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get('ok') is True and data.get('modelVersion') == os.environ['EXPECTED'] else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify fixed policy results read-only
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 12); do
            performance="$(curl --silent --show-error --max-time 30 "${base}/api/performance/courses/read-only" || true)"
            if PERFORMANCE="$performance" python - <<'PY'
          import json, os, sys
          try:
              payload=json.loads(os.environ.get('PERFORMANCE',''))
          except Exception:
              sys.exit(1)
          historical=payload.get('historical', []) if isinstance(payload, dict) else []
          targets={'ライト':1600,'スタンダード':4200,'プレミアム':8800}
          valid=len(historical)==3
          summary={}
          for row in historical:
              course=row.get('course')
              races=int(row.get('selectedRaces',0))
              stake=float(row.get('stakeYen',0))
              roi=float(row.get('roiPct') or 0)
              hit=float(row.get('hitRatePct') or 0)
              pending=int(row.get('pendingTickets',0))
              average=stake/races if races else 0
              summary[course]={'races':races,'roiPct':roi,'hitRatePct':hit,'averageStake':average,'pending':pending}
              valid = valid and course in targets and races >= 30 and pending == 0
              valid = valid and abs(average-targets[course]) < 0.01
          print(json.dumps({'valid':valid,'historical':summary},ensure_ascii=False))
          if valid:
              text='ROI L{:.1f}% S{:.1f}% P{:.1f}% integrity verified'.format(
                  summary['ライト']['roiPct'],
                  summary['スタンダード']['roiPct'],
                  summary['プレミアム']['roiPct']
              )
              open('roi-description.txt','w',encoding='utf-8').write(text)
          sys.exit(0 if valid else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "$performance"
          exit 1

      - name: Publish ROI verification success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description="$(cat roi-description.txt)"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/roi-policy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish ROI verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/roi-policy' \
            -f description='Fixed policy integrity verification failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
