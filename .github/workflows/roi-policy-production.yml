name: Approved production policy verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/roi-policy' \
            -f description='Checking approved production gate' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check whether a completed model is approved
        id: approval
        shell: bash
        run: |
          if [[ -f config/approved-production-model.json ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo 'No completed model has passed every ROI 200 gate; production remains locked.' > roi-description.txt
          fi

      - name: Verify approval manifest and immutable constraints
        if: steps.approval.outputs.approved == 'true'
        run: |
          python scripts/verify-race-tantei-fixed-constraints.py
          python scripts/verify-approved-production-model.py

      - name: Wait for approved deployment
        if: steps.approval.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          expected="$(python - <<'PY'
          import json
          print(json.load(open('config/approved-production-model.json', encoding='utf-8'))['modelVersion'])
          PY
          )"
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error --max-time 25 "${base}/health" || true)"
            if HEALTH="$health" EXPECTED="$expected" python - <<'PY'
          import json, os, sys
          try:
              data=json.loads(os.environ.get('HEALTH',''))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get('ok') is True and data.get('modelVersion') == os.environ['EXPECTED'] else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify approved production results read-only
        if: steps.approval.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          for attempt in $(seq 1 12); do
            performance="$(curl --silent --show-error --max-time 30 "${base}/api/performance/courses/read-only" || true)"
            if PERFORMANCE="$performance" python - <<'PY'
          import json, os, sys
          try:
              payload=json.loads(os.environ.get('PERFORMANCE',''))
              constraints=json.load(open('config/race-tantei-fixed-constraints.json', encoding='utf-8'))
              approval=json.load(open('config/approved-production-model.json', encoding='utf-8'))
          except Exception:
              sys.exit(1)
          rows=payload.get('historical', []) if isinstance(payload, dict) else []
          expected_courses=constraints['courses']
          valid=len(rows)==len(expected_courses)
          summary={}
          for row in rows:
              course=row.get('course')
              races=int(row.get('selectedRaces', row.get('settledRaces', 0)) or 0)
              stake=float(row.get('stakeYen',0) or 0)
              pending=int(row.get('pendingTickets',0) or 0)
              average=stake/races if races else 0
              summary[course]={
                  'races':races,
                  'averageStake':average,
                  'pending':pending,
                  'roiPct':row.get('roiPct'),
              }
              valid = valid and course in expected_courses and pending == 0 and races > 0
              if course in expected_courses:
                  valid = valid and abs(average-float(expected_courses[course]['budgetYen'])) < 0.01
          model_version=payload.get('modelVersion') if isinstance(payload, dict) else None
          if model_version is not None:
              valid = valid and model_version == approval['modelVersion']
          print(json.dumps({'valid':valid,'modelVersion':approval['modelVersion'],'historical':summary},ensure_ascii=False))
          if valid:
              open('roi-description.txt','w',encoding='utf-8').write(
                  f"Approved {approval['modelVersion']} production integrity verified"
              )
          sys.exit(0 if valid else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "$performance"
          exit 1

      - name: Publish verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description="$(cat roi-description.txt)"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/roi-policy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/roi-policy' \
            -f description='Approved production integrity verification failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
