name: Temporary direct race-name parser patch 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/_tmp-patch-race-name-direct-20260911.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch canonical parser
        run: |
          python - <<'PY'
          from pathlib import Path
          jra = Path('src/v1/jra.ts')
          s = jra.read_text()
          old_invalid = '|コースレコード|勝馬の紹介)$/.test(text)'
          new_invalid = '|コースレコード|勝馬の紹介|緊急情報|JRAからのお知らせ)$/.test(text)'
          if old_invalid not in s: raise SystemExit('invalid-label anchor missing')
          s = s.replace(old_invalid, new_invalid, 1)
          needle = '  if (explicitHtml) {\n    const explicitName = stripHtml(explicitHtml).replace(/\\s+/g, " ").trim();\n    if (!isInvalidRaceName(explicitName)) return explicitName;\n  }\n'
          extra = '  const raceClassHtml = html.match(/<div\\b[^>]*class=["\\\'][^"\\\']*\\brace_name\\b[^"\\\']*["\\\'][^>]*>([\\s\\S]*?)<\\/div>/i)?.[1]\n    ?? html.match(/<span\\b[^>]*class=["\\\'][^"\\\']*\\brace_name\\b[^"\\\']*["\\\'][^>]*>([\\s\\S]*?)<\\/span>/i)?.[1];\n  if (raceClassHtml) {\n    const raceClassName = stripHtml(raceClassHtml).replace(/\\s+/g, " ").trim();\n    if (!isInvalidRaceName(raceClassName)) return raceClassName;\n  }\n'
          if needle not in s: raise SystemExit('parser insertion anchor missing')
          jra.write_text(s.replace(needle, needle + extra, 1))
          PY
      - name: Verify parser on official JRA page
        run: |
          cat > check-race-name.ts <<'TS'
          import { fetchJraPage, parseEntryPage } from './src/v1/jra.ts';
          const url = 'https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0106202604031120260912/9D';
          const page = await fetchJraPage(url);
          const race = parseEntryPage(page.html, page.url).race;
          console.log(JSON.stringify({raceDate:race.raceDate,venue:race.venue,raceNo:race.raceNo,raceName:race.raceName}));
          if (race.raceDate !== '2026-09-12' || race.venue !== '中山' || race.raceNo !== 11) throw new Error('RACE_IDENTITY_MISMATCH');
          if (/検索|緊急情報|JRAからのお知らせ|^11レース$/.test(race.raceName)) throw new Error(`BAD_RACE_NAME:${race.raceName}`);
          TS
          npx tsx check-race-name.ts
          rm check-race-name.ts
      - name: Run stable repository checks
        run: npm run typecheck && npm run build:test && npm run test:unit
      - name: Commit parser patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/jra.ts
          git diff --cached --check
          git commit -m 'fix: parse official JRA race_name directly'
          git push origin HEAD:${{ github.ref_name }}
