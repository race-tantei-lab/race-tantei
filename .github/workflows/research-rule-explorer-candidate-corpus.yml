name: Research rule explorer candidate corpus

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-rule-explorer-candidate-corpus.yml"
      - "scripts/research-evaluate-market-rule-candidate-corpus.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CANDIDATE_RUN_ID: '31453106744'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark candidate-corpus explorer pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/rule-explorer-candidate-corpus' -f description='Waiting for reusable candidate corpus then evaluating dynamic rules' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile explorer
        run: python -m py_compile scripts/research-evaluate-market-rule-candidate-corpus.py
      - name: Wait for candidate corpus artifact
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" > a.json
            id=$(jq -r '.artifacts[] | select(.name=="research-active-market-candidate-corpus" and .expired==false) | .id' a.json | head -n1)
            if [ -n "$id" ] && [ "$id" != null ]; then echo "$id" > id.txt; exit 0; fi
            sleep 15
          done
          exit 1
      - name: Download candidate corpus
        run: |
          id=$(cat id.txt)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > candidates.zip
          unzip -q candidates.zip -d input
          test -s input/active-market-candidates.jsonl
      - name: Evaluate dynamic rule grid from fixed candidates
        run: |
          python scripts/research-evaluate-market-rule-candidate-corpus.py --candidates input/active-market-candidates.jsonl --out result.json
      - name: Require exact completion
        run: |
          python - <<'PY'
          import json
          m=json.load(open('result.json'));b=m['bestVariant'];v=m['variants'][b]
          assert m['selectedDemandRaces']==14410,m
          assert m['candidateCorpusFrozenBeforeExploration'] is True,m
          assert m['sameDayResultsUsedForTicketRule'] is False,m
          assert m['productionRulesReused'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert v['evaluatedRaces']==14410,v
          assert v['evaluationErrorCount']==0,v['evaluationErrors'][:20]
          budgets={'ライト':2000,'スタンダード':5000,'プレミアム':10000};s={}
          for c,x in v['courses'].items():
            largest=x['returnConcentration']['largestRaceReturnYen'];s[c]={'roi':x['roiPct'],'excludeLargest':round(100*(x['returnYen']-largest)/(x['stakeYen']-budgets[c]),4),'top1Share':x['returnConcentration']['top1ReturnSharePct']}
          print(json.dumps({'best':b,'courses':s,'periods':{c:{p:y['roiPct'] for p,y in x['byPeriod'].items()} for c,x in v['courses'].items()}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-rule-explorer-candidate-corpus
          path: result.json
          retention-days: 30
      - name: Mark explorer success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/rule-explorer-candidate-corpus' -f description='Dynamic rule grid completed from reusable candidate corpus' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark explorer failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/rule-explorer-candidate-corpus' -f description='Candidate-corpus rule explorer requires repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
