name: Research exact Sep19 Nakayama final win odds provider probe
on:
  push:
    branches:
      - research/20261114-sep19-nakayama-82day-final
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python -u scripts/research-20261114-jra-cname-checksum.py
