name: One-shot persist v9 live source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-persist-v9-source.yml"

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply v9 patch from audited recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-shot-early-public-final.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='- name: Move public-final target earlier')
          run=next(i for i in range(start+1,len(src)) if src[i].strip()=='run: |')
          body=[]
          for line in src[run+1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-v9.sh').write_text('\n'.join(body)+'\n',encoding='utf-8')
          PY
          bash /tmp/apply-v9.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/completed-worker-deadline-guard-tests.ts')
          t=p.read_text(encoding='utf-8')
          old='{ raceId: "stale-refresh", remainingMs: 20 * minute, hasPreview: true, previewFresh: false },'
          new='{ raceId: "stale-refresh", remainingMs: 31 * minute, hasPreview: true, previewFresh: false },'
          if old not in t: raise SystemExit('STALE_REFRESH_TEST_MARKER_MISSING')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          npm run typecheck
          npx --yes tsx tests/jra-official-odds-fetch-tests.ts
          npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
          python3 scripts/verify-live-lock-safety.py
      - name: Commit only v9 source and regression gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'race-tantei-hardening-bot'
          git config user.email 'race-tantei-hardening-bot@users.noreply.github.com'
          git add src/v1/completed-worker-live-lock.ts src/v1/completed-worker-deadline-guard.ts src/v1/live-preview-safety.ts src/live-deadline-entry-v2.ts tests/completed-worker-deadline-guard-tests.ts scripts/verify-live-lock-safety.py
          git commit -m 'Persist v9 T-30 live finalization core'
          git push origin HEAD:main
