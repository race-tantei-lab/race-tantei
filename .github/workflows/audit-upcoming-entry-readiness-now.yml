name: Audit upcoming entry readiness now
run-name: Audit upcoming entry readiness now · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-upcoming-entry-readiness-now.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-upcoming-entry-readiness-now
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit D1
        run: python scripts/audit-upcoming-entry-readiness.py
      - name: Save readiness report
        if: always()
        shell: bash
        run: |
          if [ -f upcoming-entry-readiness.json ]; then
            mkdir -p analysis-results
            cp upcoming-entry-readiness.json analysis-results/upcoming-entry-readiness.json
            git add -f analysis-results/upcoming-entry-readiness.json
            git config user.name "github-actions[bot]"
            git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save current upcoming entry readiness" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
