name: One-shot deploy next bet until post

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-deploy-next-bet-until-post.yml"

permissions:
  contents: read

jobs:
  deploy-and-prove:
    if: contains(github.event.head_commit.message, 'Run deployment proof for next bet until post')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install canonical model runtime
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3'

      - name: Build canonical Worker model asset
        run: python scripts/build-worker-completed-model-assets.py

      - name: Verify live-lock safety
        run: python scripts/verify-live-lock-safety.py

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy current guarded public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc

      - name: Prove live home next-bet card
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for attempt in $(seq 1 12); do
            curl --retry 2 --retry-delay 1 --retry-all-errors -fsS -D /tmp/home.headers "$base/?proof=$GITHUB_RUN_ID-$attempt" -o /tmp/home.html
            if grep -q 'class="home-next-release' /tmp/home.html && grep -q 'aria-label="次の買い目"' /tmp/home.html; then
              echo 'LIVE_HOME_NEXT_BET_CARD_OK'
              grep -o '<section class="home-next-release[^>]*>.*</section>' /tmp/home.html | head -c 1200 || true
              exit 0
            fi
            sleep 3
          done
          echo 'live next-bet card not found' >&2
          head -c 3000 /tmp/home.html >&2 || true
          exit 1
