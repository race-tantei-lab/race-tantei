name: New JRA CASH return model — train and test core, no D1
on:
  push:
    branches:
      - research/nov2026-direct-cash-tweedie-robust-new-model
    paths:
      - scripts/research-nov2026-stablecash-direct-payoff.py
      - .github/workflows/research-nov2026-new-stablecash-direct-payoff.yml
permissions:
  contents: read
jobs:
  train-new-direct-money-return-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned true direct cash return ML dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Assert no production D1 tokens, payouts or live bets exposed
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_D1_DATABASE_ID:-}"
          python -m py_compile scripts/research-nov2026-stablecash-direct-payoff.py
      - name: Really fit four fresh direct-money models on non-JRA unit labels
        run: python -u scripts/research-nov2026-stablecash-direct-payoff.py --self-test
      - name: Prove actual cash labels and strict chronology are enforced
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/research-nov2026-stablecash-direct-payoff.py').read_text()
          for required in (
            'objective="tweedie"', 'objective="poisson"',
            'tweedie_variance_power=1.25', 'np.quantile(multipliers[win],.95)',
            'cash_scores', 'early', 'late', 'payout100',
            'min_races', 'm24+m25', 'robust_numeric_gate',
            '"trimLargestTicketRoiPct"', '"trimLargestRaceRoiPct"',
            '2026PreT15OfficialOddsProven":False',
            'CLOUDFLARE_D1_ACTUAL_JRA_RESEARCH_BLOCKED_BEFORE_22_JST'
          ):
            # The script does not artificially create a synthetic JRA payout.
            assert required.replace('min_races','min-races') in s,required
          for forbidden in ("UPDATE rt_public_bets","INSERT INTO rt_public_bets",
                            "DELETE FROM rt_public_bets"):
            assert forbidden not in s
          print("STABLECASH_NEW_MONETARY_OBJECTIVE_ONLY_AND_NO_PRE_22_JRA_D1_OK")
          PY
