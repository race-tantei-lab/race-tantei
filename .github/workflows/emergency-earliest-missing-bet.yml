name: Emergency earliest missing bet

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 23 * * 5,6,0"
    - cron: "*/5 0-10 * * 6,0,1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-earliest-missing-bet.yml"
      - "scripts/run-emergency-earliest-missing-bet.py"

concurrency:
  group: emergency-earliest-missing-bet-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.20"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install completed-model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0"
      - name: Recover earliest future selected race without tickets
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-emergency-earliest-missing-bet.py | tee emergency-earliest-missing-bet.log
      - name: Upload emergency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-earliest-missing-bet-audit
          path: |
            analysis-results/emergency-auto-bet-*.json
            official-odds-collection-report.json
            emergency-earliest-missing-bet.log
          if-no-files-found: warn
          retention-days: 30
