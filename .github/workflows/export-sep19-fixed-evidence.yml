name: Export Sep19 fixed ticket evidence
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/export-sep19-fixed-evidence.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export final states and runners
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_system_state --output /tmp/state.sql
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_runners --output /tmp/runners.sql
          sqlite3 /tmp/e.db < /tmp/state.sql
          sqlite3 /tmp/e.db < /tmp/runners.sql
          sqlite3 -json /tmp/e.db "
            WITH finals AS (
              SELECT substr(state_key,length('worker_live_final:')+1) race_id,state_value
              FROM rt_system_state
              WHERE state_key LIKE 'worker_live_final:2026-09-19-%'
            )
            SELECT f.race_id AS raceId,
              json_extract(f.state_value,'$.tickets') AS tickets,
              (SELECT json_group_object(CAST(horse_no AS TEXT),horse_name)
               FROM rt_runners r WHERE r.race_id=f.race_id) AS horseNames
            FROM finals f
            ORDER BY f.race_id;" > /tmp/evidence.json
          echo '=== FIXED_EVIDENCE ==='
          cat /tmp/evidence.json
