name: Apply selection readiness hardening

on:
  push:
    branches:
      - hardening/live-lock-v35
    paths:
      - "scripts/harden-selection-readiness-round3.py"
      - ".github/workflows/apply-selection-readiness-round3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-selection-readiness-round3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/live-lock-v35
          fetch-depth: 0
      - name: Apply deterministic transform
        run: python scripts/harden-selection-readiness-round3.py
      - name: Commit selection readiness hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/live-deadline-entry-v2.ts
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m 'Repair entry readiness before selection freeze'
          git push origin HEAD:hardening/live-lock-v35
