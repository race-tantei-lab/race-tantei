name: Verify public UI features

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-public-ui-features
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BASE_URL: https://race-tantei-phase0.race-tantei.workers.dev
    steps:
      - name: Mark feature verification pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='production/public-ui-features' \
            -f description='実条件・実数値の予想根拠と今日の結果を本番確認中' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Verify today summary API and home
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/public/today-summary" -o /tmp/summary.json
          TODAY="$today" node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/summary.json','utf8'));
          if(s.date!==process.env.TODAY) throw new Error('today summary date mismatch');
          if(!Array.isArray(s.courses)||s.courses.length!==3) throw new Error('today summary courses missing');
          const names=s.courses.map(x=>x.course).sort().join(',');
          if(names!==['スタンダード','プレミアム','ライト'].sort().join(',')) throw new Error('today summary course names invalid');
          for(const x of s.courses){
            for(const key of ['totalRaces','settledRaces','hitRaces','stakeYen','returnYen']) if(!Number.isFinite(Number(x[key]))) throw new Error('invalid '+key+' for '+x.course);
          }
          console.log('today summary api=ok',JSON.stringify(s));
          NODE
          has_predictions=$(node -e "const s=require('/tmp/summary.json');process.stdout.write(s.hasPredictions?'yes':'no')")
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/" -o /tmp/home.html
          if [[ "$has_predictions" == 'yes' ]]; then
            grep -q '今日の結果' /tmp/home.html
          fi

      - name: Verify exact prediction evidence when today has bets
        shell: bash
        run: |
          set -euo pipefail
          has_predictions=$(node -e "const s=require('/tmp/summary.json');process.stdout.write(s.hasPredictions?'yes':'no')")
          if [[ "$has_predictions" != 'yes' ]]; then
            echo 'No public bets today; prediction evidence verification skipped.'
            exit 0
          fi
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/public/today-prediction-sample" -o /tmp/sample.json
          race_id=$(TODAY="$today" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/sample.json','utf8'));
          if(p.date!==process.env.TODAY) throw new Error('prediction sample date mismatch');
          if(!p.hasPredictions || !p.raceId) process.exit(2);
          process.stdout.write(String(p.raceId));
          NODE
          )
          test -n "$race_id"
          curl --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 3 --max-time 25 -fsS "$BASE_URL/races/$race_id" -o /tmp/detail.html
          RACE_ID="$race_id" node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/detail.html','utf8');
          const required=[
            ['decision-marker','data-decision-evidence="canonical-live-v1"'],
            ['selection-trace-marker','data-selection-trace="canonical-selection-trace-v1"'],
            ['frozen-parity','凍結済み選定と一致'],
            ['race-score','raceScore'],
            ['venue-rank','会場内順位'],
            ['selection-top-five','選定用の上位候補5頭'],
            ['condition-sample','この条件の過去サンプル'],
            ['smoothed-roi','補正後ROI'],
            ['local-weighted-roi','局所条件の加重ROI'],
            ['ticket-probability','組合せ予測確率'],
            ['ticket-value-product','確率 × オッズ'],
            ['runner-model-probability','モデル予測勝率'],
            ['runner-recent-top3','近3走3着内'],
          ];
          const missing=required.filter(([,needle])=>!html.includes(needle)).map(([name])=>name);
          const proxyCount=(html.match(/レース選定用 仮買い目/g)||[]).length;
          if(proxyCount!==3) missing.push(`proxy-ticket-count=${proxyCount}`);
          if(html.includes('条件に合致')) missing.push('generic-condition-match-copy');
          if(missing.length){
            console.error('PREDICTION_EVIDENCE_MISSING race='+process.env.RACE_ID+' markers='+missing.join(','));
            console.error('PREDICTION_EVIDENCE_DEBUG selectionTrace='+html.includes('data-selection-trace=')+' decisionMarker='+html.includes('data-decision-evidence=')+' proxyCount='+proxyCount+' bytes='+Buffer.byteLength(html));
            process.exit(1);
          }
          console.log('EXACT_PREDICTION_EVIDENCE_OK race='+process.env.RACE_ID+' proxyTickets='+proxyCount);
          NODE

      - name: Mark feature verification success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='production/public-ui-features' \
            -f description='実条件・実数値の予想根拠と今日の結果を本番確認済み' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark feature verification failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context='production/public-ui-features' \
            -f description='実条件の予想根拠または今日の結果の本番確認に失敗' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
