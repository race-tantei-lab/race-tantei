name: Verify public UI features

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-public-ui-features
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BASE_URL: https://race-tantei-phase0.race-tantei.workers.dev
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve expected deployed UI version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          wrangler = Path('wrangler.jsonc').read_text(encoding='utf-8')
          main_match = re.search(r'"main"\s*:\s*"([^"]+)"', wrangler)
          revision_match = re.search(r'"DEPLOY_REVISION"\s*:\s*"([^"]+)"', wrangler)
          if not main_match or not revision_match:
              raise SystemExit('Could not resolve current main entry / DEPLOY_REVISION from wrangler.jsonc')

          entry = main_match.group(1)
          revision = revision_match.group(1)
          source = Path(entry).read_text(encoding='utf-8')
          ui_match = re.search(r'const\s+UI_VERSION\s*=\s*"([^"]+)"', source)
          if not ui_match:
              raise SystemExit(f'Could not resolve UI_VERSION from {entry}')
          ui_version = ui_match.group(1)
          if ui_version != revision:
              raise SystemExit(f'UI_VERSION / DEPLOY_REVISION mismatch: {ui_version} != {revision}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'EXPECTED_UI_VERSION={ui_version}\n')
              f.write(f'EXPECTED_UI_ENTRY={entry}\n')
          print(f'expected ui entry={entry} version={ui_version}')
          PY

      - name: Mark feature verification pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='production/public-ui-features' \
            -f description='3タブと最終2点の具体的な根拠を本番確認中' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Verify today summary API and home
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/public/today-summary" -o /tmp/summary.json
          TODAY="$today" node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/summary.json','utf8'));
          if(s.date!==process.env.TODAY) throw new Error('today summary date mismatch');
          if(!Array.isArray(s.courses)||s.courses.length!==3) throw new Error('today summary courses missing');
          const names=s.courses.map(x=>x.course).sort().join(',');
          if(names!==['スタンダード','プレミアム','ライト'].sort().join(',')) throw new Error('today summary course names invalid');
          for(const x of s.courses){
            for(const key of ['totalRaces','settledRaces','hitRaces','stakeYen','returnYen']) if(!Number.isFinite(Number(x[key]))) throw new Error('invalid '+key+' for '+x.course);
          }
          console.log('today summary api=ok',JSON.stringify(s));
          NODE
          has_predictions=$(node -e "const s=require('/tmp/summary.json');process.stdout.write(s.hasPredictions?'yes':'no')")
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/" -o /tmp/home.html
          if [[ "$has_predictions" == 'yes' ]]; then
            grep -q '今日の結果' /tmp/home.html
          fi

      - name: Verify compact race tabs and final ticket rationale
        shell: bash
        run: |
          set -euo pipefail
          has_predictions=$(node -e "const s=require('/tmp/summary.json');process.stdout.write(s.hasPredictions?'yes':'no')")
          if [[ "$has_predictions" != 'yes' ]]; then
            echo 'No public bets today; race detail verification skipped.'
            exit 0
          fi
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/public/today-prediction-sample" -o /tmp/sample.json
          race_id=$(TODAY="$today" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/sample.json','utf8'));
          if(p.date!==process.env.TODAY) throw new Error('prediction sample date mismatch');
          if(!p.hasPredictions || !p.raceId) process.exit(2);
          process.stdout.write(String(p.raceId));
          NODE
          )
          test -n "$race_id"
          curl --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 3 --max-time 25 -fsS -D /tmp/detail.headers "$BASE_URL/races/$race_id" -o /tmp/detail.html
          RACE_ID="$race_id" node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/detail.html','utf8');
          const headers=fs.readFileSync('/tmp/detail.headers','utf8');
          const required=[
            ['tabs','data-race-tabs'],
            ['bets-tab','data-race-tab="bets"'],
            ['reason-tab','data-race-tab="reason"'],
            ['horses-tab','data-race-tab="horses"'],
            ['ticket-probability','この組合せが当たる推定確率'],
            ['official-odds','JRA公式オッズ'],
            ['ticket-value-product','推定確率 × 公式オッズ'],
            ['ticket-final-score','買い目の評価点'],
            ['selection-explanation','選ばれた理由：'],
            ['runner-list','出走馬'],
            ['tab-activation','function activate(name)'],
          ];
          const missing=required.filter(([,needle])=>!html.includes(needle)).map(([name])=>name);
          const actualUi=(headers.match(/^x-race-ui-version:\s*(.+)$/mi)||[])[1]?.trim()||'';
          if(actualUi!==process.env.EXPECTED_UI_VERSION) missing.push(`ui-version-header=${actualUi||'missing'} expected=${process.env.EXPECTED_UI_VERSION}`);
          const reasonCount=(html.match(/data-ticket-reason=/g)||[]).length;
          if(reasonCount!==2) missing.push(`ticket-reason-count=${reasonCount}`);
          for(const forbidden of ['なぜこのレースを選んだか','レース選定用 仮買い目','raceScore','この条件の過去サンプル','補正後ROI']){
            if(html.includes(forbidden)) missing.push('forbidden:'+forbidden);
          }
          if(missing.length){
            console.error('RACE_DETAIL_UI_MISSING race='+process.env.RACE_ID+' markers='+missing.join(','));
            console.error('RACE_DETAIL_UI_DEBUG bytes='+Buffer.byteLength(html)+' headers='+headers.replace(/\r?\n/g,' | '));
            process.exit(1);
          }
          console.log('RACE_DETAIL_TABS_OK race='+process.env.RACE_ID+' reasons='+reasonCount+' ui='+actualUi);
          NODE

      - name: Mark feature verification success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='production/public-ui-features' \
            -f description='3タブと最終2点の具体的な根拠を本番確認済み' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark feature verification failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context='production/public-ui-features' \
            -f description='3タブまたは最終2点の根拠表示の本番確認に失敗' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
