name: Research frozen 2024 market model tested Aug-Nov 2026 real JRA payout (NOT T15)

on:
  pull_request:
    branches:
      - research/market-residual-2024-walkforward-20261108
    paths:
      - scripts/research-frozen-market-residual-2026-aug-nov.py
      - .github/workflows/research-frozen-market-residual-2026-aug-nov.yml

permissions:
  contents: read

concurrency:
  group: frozen-market-value-AugNov-2026-${{ github.ref }}
  cancel-in-progress: true

jobs:
  2026-aug-nov-real-payout-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact read-only market-research libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1' 'beautifulsoup4==4.13.4'
      - name: Validate safety and JRA odds-probability accounting
        run: |
          python -m py_compile scripts/research-frozen-market-residual-2026-aug-nov.py
          python -u scripts/research-frozen-market-residual-2026-aug-nov.py --self-test
      - name: Freeze old 2024 odds-value training and settle 2026 Aug-Nov genuine JRA payout on pre-result features
        run: python -u scripts/research-frozen-market-residual-2026-aug-nov.py
      - name: Archive matched hit and JRA ROI with missing odds and T15 caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2026-aug-nov-actual-jra-market-model-no-t15-research
          path: analysis-results/2026aug-market-residual-jra-payout-not-t15.json
          if-no-files-found: warn
          retention-days: 30
