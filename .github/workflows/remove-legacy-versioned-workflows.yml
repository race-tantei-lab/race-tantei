name: Remove legacy versioned exploration workflows

on:
  push:
    branches: [main]
    paths:
      - "scripts/remove-legacy-versioned-workflows.py"
      - ".github/workflows/remove-legacy-versioned-workflows.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy exploration workflows
        run: python scripts/remove-legacy-versioned-workflows.py
      - name: Save cleanup
        shell: bash
        run: |
          git add -A .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No legacy workflows remain."
          else
            git commit -m "Remove remaining legacy versioned exploration workflows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish cleanup success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='analysis/legacy-workflow-cleanup' \
            -f description='Legacy versioned exploration workflows removed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
