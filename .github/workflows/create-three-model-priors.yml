name: Generate frozen cash priors for three-model comparison UI (research only)
on:
  push:
    branches: [feature/20261115-three-model-compare-safe]
    paths:
      - scripts/export-three-model-archived-cash-priors.py
      - .github/workflows/create-three-model-priors.yml
permissions:
  contents: write
jobs:
  priors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert all forecaster features have a historical source and export
        run: |
          python -m py_compile scripts/export-three-model-archived-cash-priors.py
          python scripts/export-three-model-archived-cash-priors.py --self-test
          python scripts/export-three-model-archived-cash-priors.py
      - name: Commit compact model cash priors back to research branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/three-model-archived-cash-priors.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: freeze 2016–Aug2026 time-bucketed historical cash priors'
            git push origin HEAD:refs/heads/feature/20261115-three-model-compare-safe
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: original-archive-three-model-money-training-priors
          path: src/v1/three-model-archived-cash-priors.json
          retention-days: 30
