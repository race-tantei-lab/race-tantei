name: Emergency Sep20 Remaining Race Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep20-remaining-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe selected races now
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'content-type: application/json' --data-binary @-
          }
          q "SELECT datetime('now') AS utcNow,datetime('now','+9 hours') AS jstNow" > /tmp/clock.json
          q "WITH s AS (SELECT state_value FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-20' LIMIT 1), selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId,json_extract(j.value,'$.venue') AS venue,json_extract(j.value,'$.raceNo') AS raceNo FROM s,json_each(json_extract(s.state_value,'$.selected')) j) SELECT x.venue,x.raceNo,x.raceId,r.start_time_jst AS startTimeJst,r.start_time_utc AS startTimeUtc,ROUND((julianday(r.start_time_utc)-julianday('now'))*1440.0,3) AS remainingMin,(SELECT COUNT(*) FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||x.raceId) AS previewState,(SELECT json_extract(p.state_value,'$.savedAt') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||x.raceId LIMIT 1) AS previewSavedAt,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId) AS finalRows,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId AND b.source_prediction_id=-2) AS sourceMinus2,(SELECT MIN(b.locked_at) FROM rt_public_bets b WHERE b.race_id=x.raceId) AS lockedAt,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId AND b.settlement_status='settled') AS settledRows FROM selected x JOIN rt_races r ON r.race_id=x.raceId ORDER BY r.start_time_utc" > /tmp/selected.json
          q "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('live_deadline_driver:2026-09-20','worker_live_lock:2026-09-20','worker_deadline_guard:2026-09-20','live_deadline_priority_guard_success:2026-09-20') ORDER BY state_key" > /tmp/state.json
          curl -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-20&_rt=$(date +%s)" > /tmp/day.json
          python3 - <<'PY'
          import json,pathlib,datetime
          def cf(path):
              x=json.load(open(path)); return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          selected=cf('/tmp/selected.json'); state=cf('/tmp/state.json'); day=json.load(open('/tmp/day.json'))
          state_by={r['state_key']:json.loads(r['state_value']) if isinstance(r.get('state_value'),str) and r.get('state_value','').startswith('{') else r.get('state_value') for r in state}
          api={r['raceId']:r.get('publicState') for r in day.get('races',[]) if r.get('raceId') in {x['raceId'] for x in selected}}
          report={'clock':cf('/tmp/clock.json'),'selected':selected,'state':state_by,'api':api}
          pathlib.Path('ops/sep20-remaining-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-remaining-probe.json
          git commit -m "ops: inspect Sep 20 remaining races"
          git pull --rebase origin main
          git push origin HEAD:main
