name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-race-tantei-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install canonical model runtime
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3'

      - name: Build canonical Worker model asset
        run: python scripts/build-worker-completed-model-assets.py

      - name: Verify canonical model parity before deploy
        run: npx tsx scripts/verify-worker-model-parity.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker and Cron triggers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.jsonc
