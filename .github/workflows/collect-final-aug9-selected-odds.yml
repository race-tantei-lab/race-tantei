name: Collect fixed August 9 official odds
run-name: Collect fixed Aug 9 official odds · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-final-aug9-selected-odds.py'
      - '.github/workflows/collect-final-aug9-selected-odds.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: collect-final-aug9-selected-odds
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect official odds for frozen fifteen races
        run: python scripts/collect-final-aug9-selected-odds.py
      - name: Audit selected-race coverage
        run: |
          mkdir -p analysis-results
          IDS=$(python - <<'PY'
          import json
          x=json.load(open('analysis-results/final-aug9-selection.json',encoding='utf-8'))
          print(','.join("'"+r['raceId'].replace("'","''")+"'" for r in x['selected']))
          PY
          )
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id AS raceId,bet_type AS betType,COUNT(*) AS rows,MAX(captured_at_utc) AS latest FROM rt_official_odds_latest WHERE race_id IN ($IDS) GROUP BY race_id,bet_type ORDER BY race_id,bet_type" > analysis-results/final-aug9-selected-odds-coverage.json
          cp official-odds-collection-report.json analysis-results/final-aug9-selected-odds-report.json
          python - <<'PY'
          import json
          cov=json.load(open('analysis-results/final-aug9-selected-odds-coverage.json',encoding='utf-8'))
          rows=[]
          for block in cov:
              rows.extend(block.get('results',[]))
          by={}
          for r in rows: by.setdefault(r['raceId'],set()).add(r['betType'])
          sel=json.load(open('analysis-results/final-aug9-selection.json',encoding='utf-8'))['selected']
          expected={'単勝','馬連','ワイド','馬単','3連複','3連単'}
          print('coverage',[(r['raceId'],sorted(by.get(r['raceId'],set()))) for r in sel])
          print('complete',sum(by.get(r['raceId'],set())>=expected for r in sel),'/',len(sel))
          PY
      - name: Save collection report
        if: always()
        run: |
          git add -f analysis-results/final-aug9-selected-odds-coverage.json analysis-results/final-aug9-selected-odds-report.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save August 9 selected official odds coverage'
          git pull --rebase origin main
          git push origin HEAD:main
