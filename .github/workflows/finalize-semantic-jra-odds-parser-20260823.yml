name: Finalize semantic JRA odds parser 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-semantic-jra-odds-parser-20260823.yml"]
permissions:
  contents: write
  statuses: write
env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Remove artificial JRA odds ceiling
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v1/jra-official-odds.ts')
          s = p.read_text()
          old1 = 'return Number.isFinite(value) && value >= 1 && value <= 100000 ? [value, value] : null;'
          new1 = 'return Number.isFinite(value) && value >= 1 ? [value, value] : null;'
          old2 = 'return Number.isFinite(low) && Number.isFinite(high) && low >= 1 && high >= low && high <= 100000 ? [low, high] : null;'
          new2 = 'return Number.isFinite(low) && Number.isFinite(high) && low >= 1 && high >= low ? [low, high] : null;'
          if old1 not in s: raise SystemExit('exact odds ceiling not found')
          if old2 not in s: raise SystemExit('wide odds ceiling not found')
          p.write_text(s.replace(old1,new1).replace(old2,new2))

          p = Path('tests/jra-official-odds-fetch-tests.ts')
          s = p.read_text()
          marker = 'const originalFetch = globalThis.fetch;'
          regression = r'''
          const tan3HighOddsHtml = `<ul class="tan3_list"><li>
            <div class="p_line"><div class="inner"><div class="cap"><span>1着</span></div><div class="num">7</div></div></div>
            <div class="p_line"><div class="inner"><div class="cap"><span>2着</span></div><div class="num">14</div></div></div>
            <table class="basic narrow-xy tan3"><tr><th scope="row">1</th><td>182345.6</td></tr></table>
          </li></ul>`;
          assert.deepEqual(parseFastJraOfficialOddsRows(tan3HighOddsHtml, "3連単"), [
            { betType: "3連単", combination: "7-14-1", oddsMin: 182345.6, oddsMax: 182345.6 },
          ]);

          '''.replace('          ','')
          if 'tan3HighOddsHtml' not in s:
              if marker not in s: raise SystemExit('test insertion marker not found')
              p.write_text(s.replace(marker, regression + marker))
      - name: Typecheck
        run: npm run typecheck
      - name: Verify semantic odds regressions
        run: npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Commit uncapped official odds parser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v1/jra-official-odds.ts tests/jra-official-odds-fetch-tests.ts
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Parse all published JRA odds without artificial ceiling'
          git push origin HEAD:main
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/jra-odds-ceiling-patch' -f description='Official JRA odds ceiling removed and tested' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/jra-odds-ceiling-patch' -f description='Official JRA odds ceiling patch failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
