name: Finalize semantic JRA odds parser 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-semantic-jra-odds-parser-20260823.yml"]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Parse each JRA trifecta unit structurally
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v1/jra-official-odds.ts')
          s = p.read_text()
          old = r'''function positionedHorse(context: string, label: "1着" | "2着"): number | null {
            const pattern = new RegExp(`${label}[\\s\\S]{0,500}?<div\\b([^>]*)>([\\s\\S]*?)<\\/div>`, "i");
            const match = pattern.exec(context);
            if (!match || !hasClass(match[1] ?? "", "num")) return null;
            return horseNumber(match[2] ?? "");
          }

          function parseTrifectaRows(pageHtml: string): OfficialOddsRow[] {
            const parsed = new Map<string, [number, number]>();
            for (const table of tablesByClass(pageHtml, "tan3")) {
              const liStart = pageHtml.lastIndexOf("<li", table.start);
              const contextStart = liStart >= 0 ? liStart : Math.max(0, table.start - 1800);
              const context = pageHtml.slice(contextStart, table.start);
              const first = positionedHorse(context, "1着");
              const second = positionedHorse(context, "2着");
              if (first == null || second == null || first === second) continue;
              for (const row of table.body.matchAll(/<tr\\b[^>]*>([\\s\\S]*?)<\\/tr>/gi)) {
                const rowHtml = row[0] ?? "";
                const third = rowHorseFromScope(rowHtml);
                const odds = exactRowOdds(rowHtml);
                if (third == null || odds == null || third === first || third === second) continue;
                parsed.set(`${first}-${second}-${third}`, odds);
              }
            }
            return [...parsed.entries()].sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true }))
              .map(([combination, [oddsMin, oddsMax]]) => ({ betType: "3連単", combination, oddsMin, oddsMax }));
          }'''.replace('          ','')
          new = r'''function positionedHorse(context: string, label: "1着" | "2着"): number | null {
            const pattern = new RegExp(
              `<span\\b[^>]*>\\s*${label}\\s*<\\/span>[\\s\\S]{0,350}?<div\\b([^>]*)>\\s*(\\d{1,2})\\s*<\\/div>`,
              "i",
            );
            const match = pattern.exec(context);
            if (!match || !hasClass(match[1] ?? "", "num")) return null;
            const value = Number(match[2]);
            return Number.isInteger(value) && value >= 1 && value <= 18 ? value : null;
          }

          function parseTrifectaRows(pageHtml: string): OfficialOddsRow[] {
            const parsed = new Map<string, [number, number]>();
            for (const unit of pageHtml.matchAll(/<li\\b[^>]*>([\\s\\S]*?)<\\/li>/gi)) {
              const unitHtml = unit[1] ?? "";
              const tables = tablesByClass(unitHtml, "tan3");
              if (tables.length !== 1) continue;
              const table = tables[0];
              const context = unitHtml.slice(0, table.start);
              const first = positionedHorse(context, "1着");
              const second = positionedHorse(context, "2着");
              if (first == null || second == null || first === second) continue;
              for (const row of table.body.matchAll(/<tr\\b[^>]*>([\\s\\S]*?)<\\/tr>/gi)) {
                const rowHtml = row[0] ?? "";
                const third = rowHorseFromScope(rowHtml);
                const odds = exactRowOdds(rowHtml);
                if (third == null || odds == null || third === first || third === second) continue;
                const combination = `${first}-${second}-${third}`;
                if (parsed.has(combination)) throw new Error(`JRA_TAN3_DUPLICATE_COMBINATION:${combination}`);
                parsed.set(combination, odds);
              }
            }
            return [...parsed.entries()].sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true }))
              .map(([combination, [oddsMin, oddsMax]]) => ({ betType: "3連単", combination, oddsMin, oddsMax }));
          }'''.replace('          ','')
          if old not in s:
              raise SystemExit('trifecta parser block not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/jra-official-odds-fetch-tests.ts')
          s = p.read_text()
          marker = 'const originalFetch = globalThis.fetch;'
          regression = r'''
          const tan3SiblingUnitsHtml = `<ul class="tan3_list">
            <li><div class="p_line"><div class="cap"><span>1着</span></div><div class="num">1</div></div><div class="p_line"><div class="cap"><span>2着</span></div><div class="num">2</div></div><table class="basic narrow-xy tan3"><tr><th scope="row">3</th><td>42.6</td></tr></table></li>
            <li><div class="p_line"><div class="cap"><span>1着</span></div><div class="num">1</div></div><div class="p_line"><div class="cap"><span>2着</span></div><div class="num">3</div></div><table class="basic narrow-xy tan3"><tr><th scope="row">2</th><td>51.4</td></tr></table></li>
          </ul>`;
          assert.deepEqual(parseFastJraOfficialOddsRows(tan3SiblingUnitsHtml, "3連単"), [
            { betType: "3連単", combination: "1-2-3", oddsMin: 42.6, oddsMax: 42.6 },
            { betType: "3連単", combination: "1-3-2", oddsMin: 51.4, oddsMax: 51.4 },
          ]);

          '''.replace('          ','')
          if 'tan3SiblingUnitsHtml' not in s:
              if marker not in s: raise SystemExit('test insertion marker not found')
              p.write_text(s.replace(marker, regression + marker))
      - name: Typecheck
        run: npm run typecheck
      - name: Verify all six semantic odds parsers
        run: npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Commit exact trifecta parser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v1/jra-official-odds.ts tests/jra-official-odds-fetch-tests.ts
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Parse JRA trifecta odds within exact list units'
          git push origin HEAD:main
