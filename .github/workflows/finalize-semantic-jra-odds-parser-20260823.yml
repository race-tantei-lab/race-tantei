name: Finalize semantic JRA odds parser 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-semantic-jra-odds-parser-20260823.yml"]
permissions:
  contents: write
  statuses: write
env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Parse each JRA trifecta unit structurally
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v1/jra-official-odds.ts')
          s = p.read_text()
          start = s.index('function parseTrifectaRows(pageHtml: string): OfficialOddsRow[] {')
          end = s.index('\n\nexport function parseJraOfficialOddsRows', start)
          new = r'''function parseTrifectaRows(pageHtml: string): OfficialOddsRow[] {
            const parsed = new Map<string, [number, number]>();
            for (const unit of pageHtml.matchAll(/<li\b[^>]*>([\s\S]*?)<\/li>/gi)) {
              const unitHtml = unit[1] ?? "";
              const tables = tablesByClass(unitHtml, "tan3");
              if (tables.length !== 1) continue;
              const table = tables[0];
              const context = unitHtml.slice(0, table.start);
              const first = positionedHorse(context, "1着");
              const second = positionedHorse(context, "2着");
              if (first == null || second == null || first === second) continue;
              for (const row of table.body.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)) {
                const rowHtml = row[0] ?? "";
                const third = rowHorseFromScope(rowHtml);
                const odds = exactRowOdds(rowHtml);
                if (third == null || odds == null || third === first || third === second) continue;
                const combination = `${first}-${second}-${third}`;
                if (parsed.has(combination)) throw new Error(`JRA_TAN3_DUPLICATE_COMBINATION:${combination}`);
                parsed.set(combination, odds);
              }
            }
            return [...parsed.entries()].sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true }))
              .map(([combination, [oddsMin, oddsMax]]) => ({ betType: "3連単", combination, oddsMin, oddsMax }));
          }'''.replace('          ','')
          p.write_text(s[:start] + new + s[end:])

          p = Path('tests/jra-official-odds-fetch-tests.ts')
          s = p.read_text()
          marker = 'const originalFetch = globalThis.fetch;'
          regression = r'''
          const tan3SiblingUnitsHtml = `<ul class="tan3_list">
            <li><div class="p_line"><div class="inner"><div class="cap"><span>1着</span></div><div class="num">1</div></div></div><div class="p_line"><div class="inner"><div class="cap"><span>2着</span></div><div class="num">2</div></div></div><table class="basic narrow-xy tan3"><caption><div class="p_line"><span class="cap">3着</span></div></caption><tr><th scope="row">3</th><td>42.6</td></tr></table></li>
            <li><div class="p_line"><div class="inner"><div class="cap"><span>1着</span></div><div class="num">1</div></div></div><div class="p_line"><div class="inner"><div class="cap"><span>2着</span></div><div class="num">3</div></div></div><table class="basic narrow-xy tan3"><caption><div class="p_line"><span class="cap">3着</span></div></caption><tr><th scope="row">2</th><td>51.4</td></tr></table></li>
          </ul>`;
          assert.deepEqual(parseFastJraOfficialOddsRows(tan3SiblingUnitsHtml, "3連単"), [
            { betType: "3連単", combination: "1-2-3", oddsMin: 42.6, oddsMax: 42.6 },
            { betType: "3連単", combination: "1-3-2", oddsMin: 51.4, oddsMax: 51.4 },
          ]);

          '''.replace('          ','')
          if 'tan3SiblingUnitsHtml' not in s:
              if marker not in s: raise SystemExit('test insertion marker not found')
              p.write_text(s.replace(marker, regression + marker))
      - name: Typecheck
        run: npm run typecheck
      - name: Verify all six semantic odds parsers
        run: npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Commit exact trifecta parser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v1/jra-official-odds.ts tests/jra-official-odds-fetch-tests.ts
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Parse JRA trifecta odds within exact list units'
          git push origin HEAD:main
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/jra-trifecta-semantic-patch' -f description='Exact JRA trifecta unit parser patched and tested' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/jra-trifecta-semantic-patch' -f description='Exact JRA trifecta unit parser patch failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
