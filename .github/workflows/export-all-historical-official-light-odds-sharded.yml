name: Export all historical official light odds sharded
run-name: Export all historical official light odds sharded · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - "scripts/export-selected-historical-official-light-odds.py"
      - ".github/workflows/export-all-historical-official-light-odds-sharded.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: export-all-historical-official-odds
  cancel-in-progress: true
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run id
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/all-historical-light-odds' -f description='固定7,695レースの単勝・ワイド・馬連公式オッズを7分割取得中' -f target_url="$TARGET" >/dev/null
  export:
    needs: register
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0,1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      SHARD_COUNT: 7
      SHARD_INDEX: ${{ matrix.shard }}
      ODDS_WORKERS: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py
      - name: Build fixed full-archive shard
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          ep=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['CLOUDFLARE_D1_DATABASE_ID']}/query"
          body=json.dumps({'sql':"SELECT race_id raceId FROM rt_races WHERE race_date>=? AND race_date<? AND status='finished' ORDER BY race_date,venue,race_no",'params':['2024-05-04','2026-08-03']}).encode();req=urllib.request.Request(ep,data=body,headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=90) as r:p=json.loads(r.read().decode())
          ids=[x['raceId'] for x in p.get('result',[{}])[0].get('results',[])]
          if len(ids)!=7695:raise RuntimeError(f'FIXED_ARCHIVE_COUNT_MISMATCH:{len(ids)}')
          n=int(os.environ['SHARD_COUNT']);i=int(os.environ['SHARD_INDEX']);part=[rid for j,rid in enumerate(ids) if j%n==i]
          Path('analysis-results/fixed-oos-five-races-per-venue-day.json').write_text(json.dumps({'generatedFrom':'full fixed archive; no outcome filtering','shardIndex':i,'shardCount':n,'races':part},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8');print(json.dumps({'all':len(ids),'shard':i,'count':len(part)}))
          PY
      - name: Export light official odds shard
        run: python scripts/export-selected-historical-official-light-odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-historical-official-light-odds-shard-${{ matrix.shard }}
          path: |
            artifacts/selected-historical-official-light-odds.jsonl.gz
            artifacts/selected-historical-official-light-odds-meta.json
          compression-level: 0
          retention-days: 14
  finalize:
    if: always()
    needs: [register,export]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.export.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/all-historical-light-odds' -f description='固定7,695レース単勝・ワイド・馬連公式オッズ取得成功' -f target_url="$TARGET" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/all-historical-light-odds' -f description="固定7,695レースライト公式オッズ取得失敗:$RESULT" -f target_url="$TARGET" >/dev/null; exit 1
          fi