name: Research joint pair regime cash 1112
on:
  push:
    branches:
      - research/nov2026-joint-pair-regime-cash-1112
    paths:
      - 'scripts/research-nov2026-joint-pair-regime-cash.py'
      - '.github/workflows/research-nov2026-joint-pair-regime-cash.yml'
  workflow_dispatch:
jobs:
  cash-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Unit accounting test
        run: python scripts/research-nov2026-joint-pair-regime-cash.py --self-test
      - name: Verify historical input is present (fail closed)
        run: |
          test -f analysis-results/premined-form/nov2026-form-decade-all-robust-cells.csv.gz
          test -f analysis-results/premined-joint/nov2026-relative-draw-robust-cells.csv.gz
          test -f analysis-results/premined-pair/nov2026-form-pair-venue-quarter-robust-cells.csv.gz
      - name: Full historical cash settlement
        run: python scripts/research-nov2026-joint-pair-regime-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-pair-regime-cash-1112
          path: |
            analysis-results/nov2026-joint-pair-regime-cash.json
            analysis-results/nov2026-joint-pair-regime-bets.csv.gz
          if-no-files-found: warn
