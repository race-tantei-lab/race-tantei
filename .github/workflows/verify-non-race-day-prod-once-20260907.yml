name: Verify non-race-day production gate once 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-non-race-day-prod-once-20260907.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify current production deployments and crons
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          cf() { curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$1"; }
          for w in race-tantei-live-deadline race-tantei-live-deadline-backup; do
            echo "=== $w deployments ==="
            cf "$base/workers/scripts/$w/deployments" | jq '{success, result:(.result|if type=="array" then .[0:3] else . end)}'
            echo "=== $w schedules ==="
            cf "$base/workers/scripts/$w/schedules" | jq '{success, result}'
          done
      - name: Prove Monday cron leaves D1 live state unchanged
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT state_key,updated_at FROM rt_system_state WHERE state_key IN ('live_deadline_primary_heartbeat:v1','live_deadline_driver:2026-09-07') ORDER BY state_key"
          before=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$query")
          echo "BEFORE=$before"
          sleep 75
          after=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$query")
          echo "AFTER=$after"
          BEFORE="$before" AFTER="$after" node - <<'NODE'
          const norm = (s) => {
            const p = JSON.parse(s || '[]');
            return (p?.[0]?.results || []).map(r => ({state_key:String(r.state_key), updated_at:String(r.updated_at)}));
          };
          const a = norm(process.env.BEFORE);
          const b = norm(process.env.AFTER);
          if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`NON_RACE_DAY_D1_STATE_CHANGED:${JSON.stringify({before:a,after:b})}`);
          console.log(JSON.stringify({nonRaceDayD1StateStable:true, rows:a}));
          NODE
