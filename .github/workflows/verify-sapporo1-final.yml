name: Verify final Sapporo 1R settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sapporo1-final.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify D1 and public API read-only
        run: |
          python - <<'PY'
          import datetime as dt,importlib.util,json,pathlib,sys,urllib.request
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('verify_final',p);m=importlib.util.module_from_spec(s);sys.modules['verify_final']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat();rid=f'{date}-sapporo-01'
          race=m.d1_query('SELECT refund_horse_nos_json AS refunds,result_url AS resultUrl FROM rt_races WHERE race_id=?',[rid])
          payouts=m.d1_query('SELECT bet_type AS betType,combination,payout_yen AS payoutYen FROM rt_payouts WHERE race_id=? ORDER BY bet_type,combination',[rid])
          bets=m.d1_query('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,return_yen AS returnYen,settlement_status AS settlementStatus FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid])
          if not race: raise RuntimeError('SAPPORO1_MISSING')
          refunds=set(json.loads(str(race[0]['refunds'] or '[]')))
          if not {8,10}.issubset(refunds): raise RuntimeError('REFUNDS_MISSING:'+json.dumps(sorted(refunds)))
          if len(bets)!=6: raise RuntimeError(f'BET_COUNT:{len(bets)}')
          if any(str(b['settlementStatus'])!='settled' for b in bets): raise RuntimeError('PENDING:'+json.dumps(bets,ensure_ascii=False))
          expected={
            'ライト|単勝':2100,'ライト|ワイド':1000,
            'スタンダード|単勝':5250,'スタンダード|ワイド':2500,
            'プレミアム|単勝':10500,'プレミアム|ワイド':5000,
          }
          actual={f"{b['course']}|{b['betType']}":int(b['returnYen'] or 0) for b in bets}
          if actual!=expected: raise RuntimeError('RETURN_MISMATCH:'+json.dumps({'actual':actual,'expected':expected},ensure_ascii=False))
          win=[p for p in payouts if str(p['betType'])=='単勝' and str(p['combination'])=='3']
          if len(win)!=1 or int(win[0]['payoutYen'])!=210: raise RuntimeError('WIN_PAYOUT_INVALID:'+json.dumps(payouts,ensure_ascii=False))
          url=f'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date={date}&verify_sapporo1_final=1'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as resp:
              payload=json.loads(resp.read().decode('utf-8'))
          row=next((r for r in payload.get('races',[]) if str(r.get('raceId'))==rid),None)
          if not row: raise RuntimeError('PUBLIC_RACE_MISSING')
          code=str((row.get('publicState') or {}).get('code') or '')
          label=str((row.get('publicState') or {}).get('label') or '')
          if code!='hit' or label!='的中': raise RuntimeError('PUBLIC_STATE_INVALID:'+json.dumps(row,ensure_ascii=False))
          out={'status':'SAPPORO1_FINAL_OK','raceId':rid,'refundHorseNos':sorted(refunds),'singleWinPayoutPer100Yen':210,'returns':actual,'publicState':{'code':code,'label':label},'resultUrl':race[0]['resultUrl']}
          print(json.dumps(out,ensure_ascii=False))
          PY
