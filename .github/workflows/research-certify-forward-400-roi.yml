name: Research-only future 400-percent ROI certification guard

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-certify-forward-400-roi.py
      - .github/workflows/research-certify-forward-400-roi.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile zero-dependency forward-only certification guard
        run: python3 -m py_compile scripts/research-certify-forward-400-roi.py
      - name: Reject synthetic 400% ROI and mismatched totals or missing dates
        run: python3 scripts/research-certify-forward-400-roi.py --self-test
