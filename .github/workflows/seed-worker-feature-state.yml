name: Seed Worker Feature State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed-worker-feature-state.yml

permissions:
  contents: read

concurrency:
  group: seed-worker-feature-state-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed canonical frozen feature state into dedicated D1 tables
        run: python scripts/seed-worker-feature-state.py --apply

      - name: Verify seed audit
        run: |
          python - <<'PY'
          import json
          audit=json.load(open('worker-feature-state-seed-audit.json',encoding='utf-8'))
          assert audit.get('applied') is True, audit
          assert audit.get('status') in {'SEEDED_D1_OK','ALREADY_CURRENT'}, audit
          assert audit.get('modelVersion')=='ten-year-completed-model', audit
          assert audit.get('modelSha256')=='63e35910123b6b187b6f29a6036e2362a6a6f1fd15e331525dd5e323ada453a5', audit
          assert audit.get('throughDate')=='2026-08-09', audit
          print(json.dumps({'status':'FEATURE_STATE_D1_SEED_VERIFIED','seedStatus':audit['status'],'generation':audit['generation'],'throughDate':audit['throughDate'],'counts':audit['counts']},ensure_ascii=False))
          PY

      - name: Upload production seed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-feature-state-production-seed-v2
          path: worker-feature-state-seed-audit.json
          if-no-files-found: warn
          retention-days: 30
