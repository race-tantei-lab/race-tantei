name: Diagnose current-day production state

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-current-day-production.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read bounded current-day D1 state
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=$today"

          echo '=== DRIVER ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT updated_at AS updatedAt, json_extract(state_value,'$.status') AS status, json_extract(state_value,'$.ok') AS ok, json_extract(state_value,'$.selection.status') AS selectionStatus, json_extract(state_value,'$.selection') AS selection, json_extract(state_value,'$.entryRepair') AS entryRepair, json_extract(state_value,'$.remainingToFirstRaceMs') AS remainingToFirstRaceMs, json_extract(state_value,'$.error') AS error FROM rt_system_state WHERE state_key='live_deadline_driver:${today}' LIMIT 1"

          echo '=== FINAL SELECTION ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT updated_at AS updatedAt, json_array_length(json_extract(state_value,'$.selected')) AS selectedCount, json_extract(state_value,'$.venueCounts') AS venueCounts, json_extract(state_value,'$.selectedVenueCounts') AS selectedVenueCounts, json_extract(state_value,'$.selected') AS selected FROM rt_system_state WHERE state_key='final_daily_selection:${today}' LIMIT 1"

          echo '=== TODAY PROGRAM STRUCTURE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT venue,COUNT(*) AS races,SUM(CASE WHEN start_time_utc IS NOT NULL THEN 1 ELSE 0 END) AS timed,SUM(CASE WHEN EXISTS(SELECT 1 FROM rt_runners u WHERE u.race_id=r.race_id AND COALESCE(u.runner_status,'active')='active') THEN 1 ELSE 0 END) AS withRunners FROM rt_races r WHERE race_date='${today}' GROUP BY venue ORDER BY venue"

          echo '=== FINAL BET ROWS FOR SELECTED ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "WITH selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:${today}') SELECT x.raceId,COUNT(b.id) AS finalRows FROM selected x LEFT JOIN rt_public_bets b ON b.race_id=x.raceId AND b.source_prediction_id=-2 GROUP BY x.raceId ORDER BY x.raceId"
