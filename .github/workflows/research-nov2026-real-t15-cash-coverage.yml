name: Real official pre-T15 JRA cash model data coverage read-only
on:
  push:
    branches:
      - research/nov2026-real-t15-official-cash-1113
permissions:
  contents: read
jobs:
  exact-t15-model-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no mutations
        run: |
          python -m py_compile scripts/research-nov2026-real-t15-cash-coverage.py
          python scripts/research-nov2026-real-t15-cash-coverage.py --self-test
      - name: Verify saved JRA official before-T15 odds vs real settlement
        run: python -u scripts/research-nov2026-real-t15-cash-coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-jra-t15-data-availability
          path: analysis-results/nov2026-real-t15-money-coverage.json
          retention-days: 14
