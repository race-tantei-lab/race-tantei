name: Audit six exact historical cash200 portfolio hit rates plus 2026 Aug-Nov D1 payout replay
on:
  push:
    branches:
      - research/20261114-six-roi200-hit-and-forward-audit
permissions:
  contents: read
jobs:
  learn-actual-cash-posterior-and-select-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1 beautifulsoup4==4.13.4
      - name: Verify 2-market multi-ticket 200pct strict cash accounting
        run: |
          python -m py_compile scripts/research-nov2026-full-history-free-stake-roi200.py
          python scripts/research-nov2026-full-history-free-stake-roi200.py --self-test
      - name: Restore chronological runner form and payout cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
            analysis-results
          key: historical-payout-mirror-v1
          restore-keys: |
            historical-payout-
      - name: Load pinned 136 monthly six-market payout records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/multiticket_months
          cat /tmp/multiticket_months | xargs -P 8 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Recompute six full-history ROI200 portfolios with actual SAME BET hit counts
        run: python -u scripts/research-nov2026-full-history-free-stake-roi200.py
      - name: Validate exact same-buy hit counting and forward replay mathematics
        run: |
          python -m py_compile scripts/research-nov2026-six-portfolio-postaug-replay.py
          python scripts/research-nov2026-six-portfolio-postaug-replay.py --self-test
      - name: Read D1 JRA August-November settlements without modifying production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python -u scripts/research-nov2026-six-portfolio-postaug-replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-historical-hit-and-2026-aug-nov-forward-cash-audit
          path: |
            analysis-results/nov2026-full-cash-free-stake-roi200-only.json
            analysis-results/nov2026-full-cash-free-stake-roi200-bets.csv.gz
            analysis-results/nov2026-six-roi200-candidates-postaug-audit.json
          if-no-files-found: warn
          retention-days: 30
