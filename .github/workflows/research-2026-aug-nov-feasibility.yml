name: Research 2026 Aug-Nov eligible data (D1 bounded read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-2026-aug-nov-feasibility-readonly.py
      - .github/workflows/research-2026-aug-nov-feasibility.yml

permissions:
  contents: read

jobs:
  available-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate query syntax
        run: python3 -m py_compile scripts/research-2026-aug-nov-feasibility-readonly.py
      - name: Check database completeness for Aug-Nov without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python3 scripts/research-2026-aug-nov-feasibility-readonly.py
