name: Run corrected normal T15 root fix
on:
  push:
    branches: [fix/normal-t15-atomic-v2-20260816]
    paths: [".github/workflows/run-normal-t15-atomic-root-v2.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/normal-t15-atomic-v2-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute corrected root patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/apply-normal-t15-atomic-root.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=text.index("\n          PY\n      - name: Validate root fix", start)
          lines=text[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          code=code.replace("'''.replace(/^          /gm,''),encoding='utf-8')", "''',encoding='utf-8')")
          exec(compile(code,'normal-t15-root-patch','exec'),{'__name__':'__main__'})
          PY
      - name: Validate root fix
        run: |
          npm ci
          python scripts/verify-live-lock-safety.py
          npm run typecheck
          npm run build:test
          npm test
          npx wrangler deploy --dry-run
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/completed-worker-deadline-guard.ts src/v1/completed-worker-live-lock.ts src/v1/completed-final-invariants.ts src/public-site-entry-v29.ts scripts/verify-live-lock-safety.py
          git commit -m "Make normal race T15 final atomic and immutable"
          git push origin HEAD:fix/normal-t15-atomic-v2-20260816
