          t=t.replace('    if (remaining > 0 && remaining < 15 * 60_000 && !finalReady) audit.deadlineMissedRaceIds.push(raceId);', '    if (remaining > 0 && remaining < 10 * 60_000 && !finalReady) audit.deadlineMissedRaceIds.push(raceId);', 1)
          p.write_text(t,encoding='utf-8')

          p=Path('src/live-deadline-entry-v2.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('live-deadline-v5-t15-optimal-refresh-20260823', 'live-deadline-v6-t15-start-t10-reflect-20260823')
          t=t.replace('LIVE_DEADLINE_HARD_T15_BREACH', 'LIVE_DEADLINE_HARD_T10_REFLECTION_BREACH')
          p.write_text(t,encoding='utf-8')

          p=Path('tests/completed-worker-deadline-guard-tests.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('  DEADLINE_GUARD_MS,\n', '  DEADLINE_GUARD_MS,\n  FINAL_REFLECTION_DEADLINE_MS,\n', 1)
          t=t.replace('assert.equal(DEADLINE_GUARD_ARM_MS, 16 * 60 * 1000, "rescue guard arms one minute before the hard T-15 boundary");', 'assert.equal(DEADLINE_GUARD_ARM_MS, 16 * 60 * 1000, "rescue guard arms one minute before the T-15 generation-start boundary");\nassert.equal(FINAL_REFLECTION_DEADLINE_MS, 10 * 60 * 1000, "an on-time fresh generation may reflect until T-10");')
          old='''assert.equal(isDeadlineGuardMissed(15 * 60 * 1000), false, "exactly T-15 is still on time");\nassert.equal(isDeadlineGuardMissed(15 * 60 * 1000 - 1), true, "one millisecond past T-15 is a hard miss");\nassert.equal(isDeadlineGuardMissed(14 * 60 * 1000), true);\nassert.equal(isDeadlineGuardMissed(1), true);'''
          new='''assert.equal(isDeadlineGuardMissed(15 * 60 * 1000), false, "T-15 begins the completion grace for an already-started fresh generation");\nassert.equal(isDeadlineGuardMissed(14 * 60 * 1000), false, "T-14 is still inside the reflection grace");\nassert.equal(isDeadlineGuardMissed(10 * 60 * 1000), false, "exactly T-10 is the last reflection instant");\nassert.equal(isDeadlineGuardMissed(10 * 60 * 1000 - 1), true, "past T-10 is a hard miss");\nassert.equal(isDeadlineGuardMissed(1), true);'''
          if old not in t: raise SystemExit('GUARD_TEST_BLOCK_NOT_FOUND')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          p=Path('scripts/verify-live-lock-safety.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace("        'const DEADLINE_MS = 15 * 60 * 1000;',\n", "        'const DEADLINE_MS = 15 * 60 * 1000;',\n        'const FINAL_REFLECTION_DEADLINE_MS = 10 * 60 * 1000;',\n", 1)
          t=t.replace("        'WORKER_HARD_T15_MISSED',\n        'WORKER_GENERATION_CROSSED_T15',", "        'WORKER_HARD_T15_START_MISSED',\n        'WORKER_GENERATION_CROSSED_T10',")
          t=t.replace('        "export const DEADLINE_GUARD_ARM_MS = 16 * 60 * 1000;",\n', '        "export const DEADLINE_GUARD_ARM_MS = 16 * 60 * 1000;",\n        "export const FINAL_REFLECTION_DEADLINE_MS = 10 * 60 * 1000;",\n', 1)
          t=t.replace('        "FINAL_BET_DEADLINE_PASSED",\n        "FINAL_STATE_DEADLINE_PASSED",', '        "FINAL_BET_REFLECTION_WINDOW_PASSED",\n        "FINAL_STATE_REFLECTION_WINDOW_PASSED",')
          t=t.replace('        "LIVE_DEADLINE_HARD_T15_BREACH",', '        "LIVE_DEADLINE_HARD_T10_REFLECTION_BREACH",')
          t=t.replace('        "deadline=15m_hard",', '        "generation_start_deadline=15m_hard",\n        "fresh_reflection_deadline=10m_hard",')
          t=t.replace('        "sla_t40_t30_t17_t16_t15=true",', '        "sla_t40_t30_t17_t16_t10=true",')
          t=t.replace('        "post_t15_creation=false",', '        "post_t15_new_generation=false",\n        "t15_started_fresh_reflection_to_t10=true",')
          p.write_text(t,encoding='utf-8')

          p=Path('HANDOFF.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('- **T-15**: hard creation boundary。新規作成を一切しない。既に正しくfinal済みか確認するだけ', '- **T-15**: 新規予想生成のhard start boundary。ここ以降は新しい計算を開始しない\n- **T-15〜T-10**: T-15までに開始済みのfresh生成だけ、完了した結果のfinal反映を許可\n- **T-10**: hard reflection boundary。以後は新規final反映を一切しない')
          t=t.replace('T-90/T-17/T-16/T-15構成', 'T-90/T-17/T-16/T-15-start/T-10-reflect構成')
          t=t.replace('T-90 preview開始 / T-30 required / T-17 fresh final / T-16 rescue / T-15 hard no-new-final', 'T-90 preview開始 / T-30 required / T-17 fresh final開始 / T-16 rescue / T-15 no-new-generation / T-10 hard reflection cutoff')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify patched runtime
        run: |
          npm run typecheck
          npm run build:test
          node dist-test/tests/completed-worker-deadline-guard-tests.js
          python3 scripts/verify-live-lock-safety.py
      - name: Commit runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/live-deadline-entry-v2.ts src/v1/completed-worker-live-lock.ts src/v1/completed-worker-deadline-guard.ts src/v1/completed-final-invariants.ts src/v1/live-preview-safety.ts tests/completed-worker-deadline-guard-tests.ts scripts/verify-live-lock-safety.py HANDOFF.md
          git commit -m 'Allow on-time fresh generations to reflect through T-10'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Deploy primary and backup v6
        run: |
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc
      - name: Verify v6 health
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://race-tantei-live-deadline.race-tantei.workers.dev/health' 'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
            ok=0
            for i in 1 2 3 4 5 6; do
              body=$(curl --max-time 20 --fail-with-body -sS "$url" || true)
              echo "$url $body"
              if printf '%s' "$body" | grep -Fq 'live-deadline-v6-t15-start-t10-reflect-20260823'; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          done
      - name: Wait for cron to install D1 reflection guards
        run: sleep 70
      - name: Verify D1 reflection guards and driver
        shell: bash
        run: |
          set -euo pipefail
          triggers=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT name,sql FROM sqlite_master WHERE name IN ('rt_guard_final_bet_insert_deadline','rt_guard_final_state_insert_deadline') ORDER BY name")
          echo "$triggers"
          printf '%s' "$triggers" | grep -Fq 'FINAL_BET_REFLECTION_WINDOW_PASSED'
          printf '%s' "$triggers" | grep -Fq 'FINAL_STATE_REFLECTION_WINDOW_PASSED'
          state=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT json_extract(state_value,'$.version') AS version,json_extract(state_value,'$.status') AS status,json_extract(state_value,'$.ok') AS ok,updated_at FROM rt_system_state WHERE state_key='live_deadline_driver:2026-08-23' LIMIT 1")
          echo "$state"
          printf '%s' "$state" | grep -Fq 'live-deadline-v6-t15-start-t10-reflect-20260823'
      - name: Mark success
        if: success()
        run: |
          sha="${PATCH_SHA:-$GITHUB_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=success -f context='production/t15-start-t10-reflect' \
            -f description='T-15 start / T-10 reflection v6 deployed and verified' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          sha="${PATCH_SHA:-$GITHUB_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=failure -f context='production/t15-start-t10-reflect' \
            -f description='T-15 start / T-10 reflection patch failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
