name: Apply T-15 start T-10 reflection window

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-t15-start-t10-reflect-20260823.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/t15-start-t10-reflect' -f description='Applying T-15 start / T-10 reflection window' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/apply-t15-start-t10-reflect-20260823.py
      - name: Verify
        run: |
          npm run typecheck
          npm run build:test
          node dist-test/tests/completed-worker-deadline-guard-tests.js
          python3 scripts/verify-live-lock-safety.py
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/live-deadline-entry-v2.ts src/v1/completed-worker-live-lock.ts src/v1/completed-worker-deadline-guard.ts src/v1/completed-final-invariants.ts src/v1/live-preview-safety.ts tests/completed-worker-deadline-guard-tests.ts scripts/verify-live-lock-safety.py
          git commit -m 'Allow on-time fresh generations to reflect through T-10'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Deploy v6 primary and backup
        run: |
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc
      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          for url in https://race-tantei-live-deadline.race-tantei.workers.dev/health https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health; do
            for i in 1 2 3 4 5 6; do
              body=$(curl --max-time 20 --fail-with-body -sS "$url" || true)
              echo "$url $body"
              printf '%s' "$body" | grep -Fq 'live-deadline-v6-t15-start-t10-reflect-20260823' && break
              test "$i" != 6
              sleep 3
            done
          done
      - name: Mark success
        if: success()
        run: |
          sha="${PATCH_SHA:-$GITHUB_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=success -f context='production/t15-start-t10-reflect' -f description='T-15 start / T-10 reflection v6 deployed' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: |
          sha="${PATCH_SHA:-$GITHUB_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=failure -f context='production/t15-start-t10-reflect' -f description='T-15/T-10 patch failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
