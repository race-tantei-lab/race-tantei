name: Apply T15 generation-start hardening

on:
  push:
    branches: [main]
    paths:
      - "scripts/_apply-t15-generation-start-hardening.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded source patch
        run: python3 scripts/_apply-t15-generation-start-hardening.py
      - name: Commit source hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/completed-worker-live-lock.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: recheck T-15 at actual generation start"
          git push
