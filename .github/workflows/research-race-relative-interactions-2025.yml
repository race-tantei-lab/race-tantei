name: Research horse form interactions and payout calibration against real JRA 2025

on:
  pull_request:
    branches: [research/structural-ranker-twohead-20261108]
    paths:
      - scripts/research-race-relative-interactions-2025.py
      - .github/workflows/research-race-relative-interactions-2025.yml

permissions:
  contents: read
concurrency:
  group: interaction-2025-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learn-race-conditional-ticket-value:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned machine learning dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Validate syntax, structural model hypotheses
        run: |
          python -m py_compile scripts/research-race-relative-interactions-2025.py
          python scripts/research-race-relative-interactions-2025.py --self-test
      - name: Run race-relative interaction fitting and genuine JRA payout 2025 validation
        run: python -u scripts/research-race-relative-interactions-2025.py
      - name: Preserve 2024 frozen model selection and 2025 JRA actual paired hit and ROI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-model-yearwise-jra-paid-return-report
          path: analysis-results/race-relative-interaction-2025-actual-jra.json
          if-no-files-found: warn
          retention-days: 30
