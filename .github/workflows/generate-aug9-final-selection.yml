name: Generate August 9 final five-race selection
run-name: Generate Aug 9 five-race selection · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-final-preday-selection.py'
      - '.github/workflows/generate-aug9-final-selection.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-aug9-final-selection
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export production D1 and build local SQLite
        shell: bash
        run: |
          npx wrangler d1 export race-tantei-phase0 --remote --output=/tmp/race-tantei.sql
          sqlite3 /tmp/race-tantei.db < /tmp/race-tantei.sql
          sqlite3 /tmp/race-tantei.db "SELECT COUNT(*) FROM rt_races; SELECT COUNT(*) FROM rt_runners; SELECT COUNT(*) FROM rt_results;"
      - name: Generate previous-day fixed five races
        run: |
          mkdir -p analysis-results
          python scripts/generate-final-preday-selection.py --db /tmp/race-tantei.db --date 2026-08-09 --out analysis-results/final-aug9-selection.json
          python - <<'PY'
          import json
          p='analysis-results/final-aug9-selection.json'
          x=json.load(open(p,encoding='utf-8'))
          assert len(x['selected'])==15
          assert all(sum(1 for r in x['selected'] if r['venue']==v)==5 for v in {'札幌','新潟','中京'})
          assert x['resultDataUsedForTargetDay'] is False
          print([(r['venue'],r['raceNo'],round(r['raceScore'],3)) for r in x['selected']])
          PY
      - name: Save fixed selection
        run: |
          git add -f analysis-results/final-aug9-selection.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save August 9 fixed five-race selection'
          git pull --rebase origin main
          git push origin HEAD:main
