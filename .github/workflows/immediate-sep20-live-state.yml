name: Immediate Sep20 live-state check
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/immediate-sep20-live-state.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check current D1 selection and live state
        shell: bash
        run: |
          set -euo pipefail
          echo "NOW_JST=$(TZ=Asia/Tokyo date '+%F %T %Z')"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key,state_value,updated_at
            FROM rt_system_state
            WHERE state_key IN (
              'final_daily_selection:2026-09-20',
              'worker_selection:2026-09-20',
              'live_deadline_driver:2026-09-20',
              'worker_live_preview:2026-09-20-hanshin-01',
              'worker_live_final:2026-09-20-hanshin-01'
            )
            ORDER BY state_key" > /tmp/state.json
          echo '=== STATE ==='
          cat /tmp/state.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT course,bet_type AS betType,combination,assumed_odds AS assumedOdds,locked_at AS lockedAt,source_prediction_id AS sourcePredictionId
            FROM rt_public_bets
            WHERE race_id='2026-09-20-hanshin-01'
            ORDER BY course,bet_type,combination" > /tmp/bets.json
          echo '=== H1_BETS ==='
          cat /tmp/bets.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT race_id AS raceId,venue,race_no AS raceNo,start_time_jst AS startTimeJst,start_time_utc AS startTimeUtc,
              (SELECT COUNT(*) FROM rt_runners x WHERE x.race_id=r.race_id AND COALESCE(x.runner_status,'active')='active') activeRunners,
              CASE WHEN LENGTH(TRIM(COALESCE(entry_url,'')))>0 THEN 1 ELSE 0 END hasEntryUrl
            FROM rt_races r WHERE race_date='2026-09-20'
            ORDER BY venue,race_no" > /tmp/races.json
          echo '=== RACES ==='
          cat /tmp/races.json
      - name: Check public and worker surfaces
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          curl --retry 3 --retry-delay 2 --retry-all-errors --max-time 20 -fsS "$base/api/public/day?date=2026-09-20" -o /tmp/day.json
          node - <<'NODE'
          const b=require('/tmp/day.json'),rows=b.races||[];
          const counts={},by={};
          for(const r of rows){counts[r.publicState?.code]=(counts[r.publicState?.code]||0)+1;by[r.venue]=(by[r.venue]||0)+1}
          console.log('PUBLIC_DAY',JSON.stringify({ok:b.ok,races:rows.length,by,states:counts,fallbackSource:b.fallbackSource||'live-d1'}));
          NODE
          for url in             https://race-tantei-live-deadline.race-tantei.workers.dev/health             https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health             https://race-tantei-win5.race-tantei.workers.dev/health             https://race-tantei-win5-backup.race-tantei.workers.dev/health; do
            echo "$url $(curl --max-time 15 -fsS "$url")"
          done
          code=$(curl --retry 2 --retry-delay 2 --retry-all-errors --max-time 20 -sS -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$base/")
          echo "HOME_HTTP=$code"
          grep -i '^x-race-ui-version:' /tmp/home.headers || true
      - name: Current D1 one-hour profile
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 insights race-tantei-phase0 --time-period 1h --sort-type sum --sort-by reads --sort-direction DESC --limit 100 --json >/tmp/insights.json
          node - <<'NODE'
          const a=require('/tmp/insights.json');
          const total=a.reduce((s,x)=>s+Number(x.totalRowsRead||0),0);
          const bad=a.filter(x=>{const q=String(x.query||'').toLowerCase().replace(/\s+/g,' ');return (q.includes('marketprobability')&&q.includes('join rt_results'))||(q.includes('from rt_public_bets b join rt_races r')&&q.includes("date('now','-14 days')"))||(q.includes('select distinct ra.race_id as raceid')&&q.includes('join rt_runners ru'));});
          console.log('ONE_HOUR_TOTAL_ROWS_READ',total);
          console.log('FORBIDDEN_HIGH_READ_MATCHES',JSON.stringify(bad));
          NODE
