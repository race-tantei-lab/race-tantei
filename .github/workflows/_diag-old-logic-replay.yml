name: Old logic replay 2026-09-21
on:
  push:
    branches:
      - diag/old-replay-20260921-20260923
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy<3"
      - name: Replay old canonical logic with historical official odds
        shell: bash
        run: |
          cat >/tmp/replay.py <<'PY'
          import datetime as dt, importlib.util, itertools, json, math, pathlib, subprocess, sys
          import lightgbm as lgb
          import numpy as np

          ROOT=pathlib.Path('.').resolve()
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(spec);sys.modules[name]=m;spec.loader.exec_module(m);return m
          core=load(ROOT/'scripts'/'ten-year-production-core.py','core')
          learning=load(ROOT/'scripts'/'live-recency-learning.py','learning')
          collector=load(ROOT/'scripts'/'collect-jra-official-odds.py','collector')
          cfg=core.load_config()
          booster=lgb.Booster(model_file=str(core.MODEL_PATH))
          features=list(cfg['runnerProbabilityModel']['features'])
          BET_ORDER=('単勝','ワイド','馬連','馬単','3連複','3連単')

          def q(sql,params=None):
              return collector.d1_query(sql,params or [])

          def combo_positions(kind,n):
              if kind=='単勝': return ((i,) for i in range(n))
              if kind in ('ワイド','馬連'): return itertools.combinations(range(n),2)
              if kind=='馬単': return itertools.permutations(range(n),2)
              if kind=='3連複': return itertools.combinations(range(n),3)
              if kind=='3連単': return itertools.permutations(range(n),3)
              raise RuntimeError(kind)
          def combo_text(kind,pos,horse_nos):
              vals=[horse_nos[i] for i in pos]
              if kind in ('ワイド','馬連','3連複'): vals=sorted(vals)
              return '-'.join(str(x) for x in vals)
          def choose_two(rid,runners,w,odds,bet_learning,venue):
              horse_nos=[int(r['horseNo']) for r in runners];n=len(runners);by_type=[]
              for bt in BET_ORDER:
                  cand=[]
                  for pos in combo_positions(bt,n):
                      combo=combo_text(bt,pos,horse_nos); odd=odds.get((bt,combo))
                      if odd is None: continue
                      p=float(core.combination_probability(bt,pos,w))
                      if not math.isfinite(p) or p<=0: continue
                      rf=float(learning.bet_factor(bet_learning,bt,venue,odd))
                      cand.append({'betType':bt,'combination':combo,'predictedProbability':p,'officialOdds':odd,'recencyFactor':rf,'valueProduct':p*odd*rf})
                  if not cand: raise RuntimeError(f'MISSING_ODDS_TYPE:{rid}:{bt}')
                  cand.sort(key=lambda x:(-x['valueProduct'],x['officialOdds'],x['combination']))
                  retained=cand[:5]
                  for x in retained: x['score']=math.log(x['predictedProbability'])+0.4*math.log(x['officialOdds'])+math.log(x['recencyFactor'])
                  retained.sort(key=lambda x:(-x['score'],-x['predictedProbability'],x['combination']))
                  by_type.append(retained[0])
              by_type.sort(key=lambda x:(-x['score'],BET_ORDER.index(x['betType']),x['combination']))
              return by_type[:2]

          sels={}
          for date in ('2026-09-21',):
              rows=q("SELECT state_value AS v FROM rt_system_state WHERE state_key=?",[f'final_daily_selection:{date}'])
              if not rows: continue
              p=json.loads(rows[0]['v']); sels[date]=[str(x['raceId']) for x in p.get('selected',[])]
          actual={}
          for date,ids in sels.items():
              for rid in ids:
                  fr=q("SELECT state_value AS v FROM rt_system_state WHERE state_key=?",[f'worker_live_final:{rid}'])
                  if not fr: continue
                  v=json.loads(fr[0]['v'])
                  actual[rid]=v

          replay_rows=[]
          for date,ids in sels.items():
              # canonical base state advanced only through dates before target date
              state=core.load_feature_state()
              # Advance only with races strictly before the target date; no future leakage.
              hist=core.bundles_from_d1(collector,"race_date>? AND race_date<?",[state['throughDate'],date])
              core.advance_feature_state(state,hist)
              target_map={str(b['race']['raceId']):b for b in core.target_bundles(collector,date)}
              for rid in ids:
                  av=actual.get(rid)
                  if not av: continue
                  # Replay at actual odds timestamp/final source timestamp.
                  cutoff=str(av.get('oddsFetchedAt') or av.get('previewGeneratedAt') or av.get('lockedAt') or '')
                  if not cutoff: continue
                  # old path included same-day finished results before cutoff
                  same_day=core.bundles_from_d1(collector,
                    "race_date=? AND start_time_utc IS NOT NULL AND datetime(start_time_utc)<datetime(?) AND EXISTS (SELECT 1 FROM rt_results rr WHERE rr.race_id=rt_races.race_id AND rr.finish_position IS NOT NULL)",
                    [date,cutoff])
                  race_state=core.clone_feature_state(state) if hasattr(core,'clone_feature_state') else None
                  if race_state is None:
                      # reload deterministic base for each race to avoid carrying later same-day races
                      race_state=core.load_feature_state()
                      hist2=core.bundles_from_d1(collector,"race_date>? AND race_date<?",[race_state['throughDate'],date])
                      core.advance_feature_state(race_state,hist2)
                  if same_day: core.update_feature_state_for_date(race_state,same_day)

                  b=target_map[rid]
                  runners=[r for r in b['runners'] if (r.get('runnerStatus') or 'active')=='active']; runners.sort(key=lambda r:int(r.get('horseNo') or 0))
                  x=np.asarray([[float(core.ml_feature_row(race_state,b['race'],r,len(runners))[f]) for f in features] for r in runners],dtype=np.float64)
                  raw=np.asarray(booster.predict(x),dtype=np.float64); base_w=raw/raw.sum()
                  runner_rows,bet_rows=learning.load_recent_learning_rows(collector,date,cutoff)
                  factors,runner_detail,runner_audit=learning.build_runner_learning(runner_rows,b['race'],runners,cutoff,date)
                  bet_learning=learning.build_bet_learning(bet_rows,cutoff,date)
                  adjusted=np.asarray([base_w[i]*float(factors[i]) for i in range(len(runners))],dtype=np.float64); w=adjusted/adjusted.sum()

                  # latest complete official odds snapshot at or before the actual final's odds timestamp
                  caps=q("SELECT captured_at_utc AS c,COUNT(*) AS n,COUNT(DISTINCT bet_type) AS types FROM rt_official_odds_snapshots WHERE race_id=? AND datetime(captured_at_utc)<=datetime(?) GROUP BY captured_at_utc HAVING types=6 ORDER BY datetime(captured_at_utc) DESC LIMIT 1",[rid,cutoff])
                  if not caps:
                      replay_rows.append({'date':date,'raceId':rid,'status':'NO_HISTORICAL_ODDS','cutoff':cutoff}); continue
                  cap=caps[0]['c']
                  ors=q("SELECT bet_type AS bt,combination AS combo,odds_min AS lo,odds_max AS hi FROM rt_official_odds_snapshots WHERE race_id=? AND captured_at_utc=?",[rid,cap])
                  odds={(str(r['bt']),str(r['combo'])):(float(r['lo'])+float(r['hi']))/2 for r in ors}
                  try:
                      old=choose_two(rid,runners,w,odds,bet_learning,str(b['race'].get('venue') or ''))
                  except Exception as e:
                      replay_rows.append({'date':date,'raceId':rid,'status':'REPLAY_ERROR','error':str(e),'cutoff':cutoff,'snapshot':cap}); continue

                  # actual tickets from final
                  act=[{'betType':str(t.get('betType')),'combination':str(t.get('combination')),'officialOdds':t.get('officialOdds')} for t in av.get('tickets',[])]
                  # payouts/results
                  pays=q("SELECT bet_type AS bt,combination AS combo,payout_yen AS pay FROM rt_payouts WHERE race_id=?",[rid])
                  pmap={(str(r['bt']),str(r['combo'])):int(r['pay']) for r in pays}
                  def ret(t):
                      return pmap.get((t['betType'],t['combination']),0)*10 # 1000 yen stake = payout per100 *10
                  oldRet=sum(ret(t) for t in old)
                  actRet=sum(ret(t) for t in act)
                  same={(t['betType'],t['combination']) for t in old}=={(t['betType'],t['combination']) for t in act}
                  replay_rows.append({
                    'date':date,'raceId':rid,'status':'OK','cutoff':cutoff,'oddsSnapshot':cap,
                    'oldTickets':[{k:t[k] for k in ('betType','combination','officialOdds','recencyFactor','score')} for t in old],
                    'actualTickets':act,'sameTickets':same,
                    'oldHit':oldRet>0,'actualHit':actRet>0,'oldReturnLight':oldRet,'actualReturnLight':actRet,
                    'sameDayFinishedRaces':runner_audit.get('sameDayFinishedRaces'),
                    'runnerHistoryRaces':runner_audit.get('runnerHistoryRaces'),
                    'betHistoryRaces':bet_learning.get('audit',{}).get('betHistoryRaces')
                  })

          print('REPLAY_DETAIL_BEGIN')
          for r in replay_rows: print(json.dumps(r,ensure_ascii=False))
          print('REPLAY_DETAIL_END')
          for date in ('2026-09-21',):
              rs=[r for r in replay_rows if r.get('date')==date and r.get('status')=='OK']
              print(json.dumps({
                'summaryDate':date,'races':len(rs),
                'changedTickets':sum(not r['sameTickets'] for r in rs),
                'oldHits':sum(r['oldHit'] for r in rs),
                'actualHits':sum(r['actualHit'] for r in rs),
                'oldStakeLight':len(rs)*2000,
                'oldReturnLight':sum(r['oldReturnLight'] for r in rs),
                'actualReturnLight':sum(r['actualReturnLight'] for r in rs),
              },ensure_ascii=False))
          PY
          python /tmp/replay.py
