name: One-time Cloudflare actual billable usage check (READ-ONLY)
on:
  push:
    branches:
      - audit/cloudflare-nov2026-billable-usage-readonly-1113
permissions:
  contents: read
jobs:
  read-only-billable-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only analytics and run once
        run: |
          python -m py_compile scripts/audit-cloudflare-billable-usage-readonly.py
          python -u scripts/audit-cloudflare-billable-usage-readonly.py
