name: Emergency D1 diagnostic 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-d1-diagnostic-20260906.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Export production D1 without live SELECT scans
        id: export
        shell: bash
        run: |
          set +e
          npx wrangler d1 export race-tantei-phase0 --remote --output=/tmp/prod.sql >/tmp/export.out 2>/tmp/export.err
          rc=$?
          echo "EXPORT_RC=$rc"
          echo "--- export stdout ---"
          cat /tmp/export.out || true
          echo "--- export stderr ---"
          cat /tmp/export.err || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect exported 2026-09-06 rows locally
        if: steps.export.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/prod.sqlite
          sqlite3 /tmp/prod.sqlite < /tmp/prod.sql
          echo '=== FINAL DAILY SELECTION ==='
          sqlite3 -header -column /tmp/prod.sqlite "SELECT state_key,updated_at,json_array_length(json_extract(state_value,'$.selected')) AS selectedCount,json_extract(state_value,'$.sourceModel') AS sourceModel,json_extract(state_value,'$.resultDataUsedForTargetDay') AS resultDataUsedForTargetDay FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-06';"
          echo '=== TARGET 15 LIVE COUNTS ==='
          sqlite3 -header -column /tmp/prod.sqlite <<'SQL'
          WITH targets(race_id) AS (VALUES
            ('2026-09-06-nakayama-01'),('2026-09-06-nakayama-02'),('2026-09-06-nakayama-03'),('2026-09-06-nakayama-07'),('2026-09-06-nakayama-10'),
            ('2026-09-06-hanshin-01'),('2026-09-06-hanshin-03'),('2026-09-06-hanshin-04'),('2026-09-06-hanshin-05'),('2026-09-06-hanshin-10'),
            ('2026-09-06-sapporo-02'),('2026-09-06-sapporo-03'),('2026-09-06-sapporo-04'),('2026-09-06-sapporo-05'),('2026-09-06-sapporo-11')
          )
          SELECT t.race_id AS raceId,
                 r.start_time_utc AS startUtc,
                 (SELECT COUNT(*) FROM rt_runners x WHERE x.race_id=t.race_id AND COALESCE(x.runner_status,'active')='active') AS activeRunners,
                 (SELECT COUNT(*) FROM rt_official_odds_latest o WHERE o.race_id=t.race_id) AS officialOddsRows,
                 (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=t.race_id) AS betRows
          FROM targets t LEFT JOIN rt_races r ON r.race_id=t.race_id
          ORDER BY r.start_time_utc,t.race_id;
          SQL
          echo '=== SELECTION MEMBERS ==='
          sqlite3 -header -column /tmp/prod.sqlite "SELECT json_extract(j.value,'$.raceId') AS raceId,json_extract(j.value,'$.course') AS course,json_extract(j.value,'$.raceNo') AS raceNo FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j WHERE s.state_key='final_daily_selection:2026-09-06' ORDER BY raceId;"
          echo '=== LIVE DEADLINE STATES ==='
          sqlite3 -header -column /tmp/prod.sqlite "SELECT state_key,updated_at,substr(state_value,1,240) AS statePreview FROM rt_system_state WHERE (state_key LIKE 'live_deadline%2026-09-06%' OR state_key LIKE 'worker_live_%2026-09-06%') ORDER BY updated_at DESC LIMIT 30;"

      - name: One-row D1 write quota probe
        shell: bash
        run: |
          set +e
          key="ops_write_probe:2026-09-06:${GITHUB_RUN_ID}"
          cmd="INSERT INTO rt_system_state (state_key,state_value,updated_at) VALUES ('$key','{\"probe\":true,\"date\":\"2026-09-06\"}',CURRENT_TIMESTAMP)"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$cmd" >/tmp/probe.out 2>/tmp/probe.err
          rc=$?
          echo "WRITE_PROBE_RC=$rc"
          echo "--- probe stdout ---"
          cat /tmp/probe.out || true
          echo "--- probe stderr ---"
          cat /tmp/probe.err || true
          exit 0

      - name: Check live Worker health
        shell: bash
        run: |
          set +e
          for url in \
            'https://race-tantei-live-deadline.race-tantei.workers.dev/health' \
            'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
            echo "=== $url ==="
            curl --max-time 15 --fail-with-body -sS "$url" || true
            echo
          done
