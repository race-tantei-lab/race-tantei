name: Research read-only August-November official JRA odds storage coverage
on:
  push:
    branches:
      - research/20261114-official-odds-coverage-readonly
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4==4.13.4 numpy==2.2.6
      - name: Inspect read-only odds storage counts
        run: python -u scripts/research-20261114-odds-coverage-readonly.py
