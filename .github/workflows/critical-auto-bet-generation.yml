name: Critical automatic bet generation

on:
  workflow_dispatch:
  schedule:
    # JST race days, every 5 minutes. This is the fail-safe path for pre-race tickets.
    - cron: "*/5 23 * * 5,6,0"
    - cron: "*/5 0-10 * * 6,0,1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/critical-auto-bet-generation.yml"
      - "scripts/run-critical-auto-bet-generation.py"
      - "scripts/run-auto-final-live.py"
      - "scripts/run-ten-year-auto-final-live.py"
      - "scripts/generate-ten-year-preday-selection.py"
      - "scripts/generate-ten-year-live-bets.py"
      - "scripts/collect-jra-official-odds.py"
      - "scripts/collect-current-jra-official-odds-live.py"
      - "scripts/collect-current-jra-official-odds-fast.py"
      - "scripts/ten-year-production-core.py"
      - "config/ten-year-completed-model.json"
      - "models/ten-year-completed-model.txt"
      - "models/ten-year-production-state-manifest.json"
      - "models/ten-year-runner-feature-state.json.gz"
      - "models/ten-year-race-selection-state.json.gz"

concurrency:
  group: critical-auto-bet-generation-live
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.35"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install completed-model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0"
      - name: Compile critical generator
        run: |
          python -m py_compile \
            scripts/run-critical-auto-bet-generation.py \
            scripts/run-auto-final-live.py \
            scripts/run-ten-year-auto-final-live.py \
            scripts/generate-ten-year-live-bets.py \
            scripts/collect-current-jra-official-odds-live.py \
            scripts/collect-current-jra-official-odds-fast.py
      - name: Wake current-day JRA sync
        shell: bash
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 1 --retry-delay 1 --retry-all-errors --connect-timeout 3 --max-time 8 -fsS \
            "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$today" >/dev/null || true
      - name: Generate every available selected race before start
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-critical-auto-bet-generation.py | tee critical-auto-bet-generation.log
      - name: Upload critical generation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-auto-bet-generation-audit
          path: |
            analysis-results/critical-auto-bet-generation.json
            analysis-results/critical-auto-bet-*.json
            official-odds-collection-report.json
            critical-auto-bet-generation.log
          if-no-files-found: warn
          retention-days: 30
