name: Promote completed ten-year model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-ten-year-completed-model.yml"
      - "config/ten-year-completed-model.json"
      - "scripts/build-ten-year-completed-model.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-ten-year-completed-model
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  FEATURE_ARTIFACT_ID: "9087261097"
  DEMAND_ARTIFACT_ID: "9074033903"
  EXPECTED_MODEL_SHA256: "63e35910123b6b187b6f29a6036e2362a6a6f1fd15e331525dd5e323ada453a5"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install byte-identical canonical environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 \
            pandas==2.2.3 \
            scipy==1.17.0 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0 \
            lightgbm==4.6.0
          python - <<'PY'
          import sys, lightgbm, numpy, pandas, scipy, sklearn
          print(sys.version)
          print({
              'lightgbm': lightgbm.__version__,
              'numpy': numpy.__version__,
              'pandas': pandas.__version__,
              'scipy': scipy.__version__,
              'sklearn': sklearn.__version__,
          })
          PY

      - name: Download frozen canonical runner feature corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/features
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FEATURE_ARTIFACT_ID}/zip" > /tmp/features.zip
          unzip -q /tmp/features.zip -d /tmp/features
          test -s /tmp/features/runner-ml-features.csv
          test -s /tmp/features/runner-ml-features-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/features/runner-ml-features-meta.json').read_text(encoding='utf-8'))
          assert m['racesProcessed']==40155,m
          assert m['runnerRows']==559546,m
          assert m['featureCount']==56,m
          assert m['sameDayResultsUsedForFeatures'] is False,m
          assert m['currentRaceFinishOrPayoutUsedForFeatures'] is False,m
          assert m['syntheticDataUsed'] is False,m
          print(json.dumps({'racesProcessed':m['racesProcessed'],'runnerRows':m['runnerRows'],'featureCount':m['featureCount']},ensure_ascii=False))
          PY

      - name: Download frozen 14,410-race demand
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEMAND_ARTIFACT_ID}/zip" > /tmp/demand.zip
          unzip -l /tmp/demand.zip | grep -q "demand.jsonl"

      - name: Build byte-identical completed model
        run: |
          set -euo pipefail
          mkdir -p models
          python scripts/build-ten-year-completed-model.py \
            --features /tmp/features/runner-ml-features.csv \
            --demand /tmp/demand.zip \
            --config config/ten-year-completed-model.json \
            --output models/ten-year-completed-model.txt
          actual="$(sha256sum models/ten-year-completed-model.txt | awk '{print $1}')"
          test "$actual" = "$EXPECTED_MODEL_SHA256"
          echo "canonical model sha256=$actual"

      - name: Commit completed model asset
        run: |
          set -euo pipefail
          git add models/ten-year-completed-model.txt
          if git diff --cached --quiet; then
            echo "Completed model asset already matches main."
            exit 0
          fi
          git config user.name "race-tantei-bot"
          git config user.email "race-tantei-bot@users.noreply.github.com"
          git commit -m "Promote completed ten-year model asset"
          git push origin HEAD:main
