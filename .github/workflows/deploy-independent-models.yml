name: Deploy independent 6-month and 96-month prediction Workers
on:
  push:
    branches: [main]
    paths:
      - "src/independent-rolling-worker.ts"
      - "src/v1/independent-rolling-core.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "wrangler.independent-6m.jsonc"
      - "wrangler.independent-96m.jsonc"
      - "tsconfig.independent.json"
      - ".github/workflows/deploy-independent-models.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: deploy-independent-rolling-models
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify both independently generated cash models
        run: |
          npx tsc -p tsconfig.independent.json
          npx tsx tests/independent-rolling-tests.ts
      - name: Validate independent 6m and 96m bundles
        run: |
          npx wrangler deploy --dry-run --config wrangler.independent-6m.jsonc --outdir dist-independent-6m
          npx wrangler deploy --dry-run --config wrangler.independent-96m.jsonc --outdir dist-independent-96m
      - name: Deploy independent 6m cron Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.independent-6m.jsonc
      - name: Deploy independent 96m cron Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.independent-96m.jsonc
      - name: Verify both Worker endpoints exist
        shell: bash
        run: |
          set -euo pipefail
          for mode in 6m 96m; do
            url="https://race-tantei-independent-${mode}.race-tantei.workers.dev"
            code=$(curl -sS --retry 5 --retry-delay 2 -o /tmp/independent-worker-${mode}.txt -w '%{http_code}' "$url")
            echo "INDEPENDENT_WORKER_${mode} HTTP=${code}"
            test "$code" = 404
          done
          echo INDEPENDENT_6M_96M_WORKERS_DEPLOYED
