name: Deploy retained six-month Worker with disabled schedule
on:
  push:
    branches: [main]
    paths:
      - "src/independent-rolling-worker.ts"
      - "src/v1/independent-rolling-core.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "wrangler.independent-6m.jsonc"
      - "tsconfig.independent.json"
      - ".github/workflows/deploy-independent-models.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: deploy-independent-rolling-models
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Compile and test the retained prediction worker
        run: |
          npx tsc -p tsconfig.independent.json
          npx tsx tests/independent-rolling-tests.ts
      - name: Validate six-month Worker bundle
        run: |
          npx wrangler deploy --dry-run --config wrangler.independent-6m.jsonc --outdir dist-independent-6m
      - name: Deploy independent 6m cron Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.independent-6m.jsonc
      - name: Verify six-month Worker endpoint exists
        shell: bash
        run: |
          set -euo pipefail
          url="https://race-tantei-independent-6m.race-tantei.workers.dev"
          code=$(curl -sS --retry 5 --retry-delay 2 -o /tmp/independent-worker-6m.txt -w '%{http_code}' "$url")
          echo "SIX_MONTH_WORKER HTTP=${code}"
          test "$code" = 404
          echo SIX_MONTH_WORKER_DEPLOYED_SCHEDULE_DISABLED
