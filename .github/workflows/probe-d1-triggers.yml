name: Probe D1 triggers
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/probe-d1-triggers.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Read live D1 trigger inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          u=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/d1/database/{os.environ['CLOUDFLARE_D1_DATABASE_ID']}/query"
          body=json.dumps({"sql":"SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('trigger','view') ORDER BY type,name","params":[]}).encode()
          req=urllib.request.Request(u,data=body,headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=60) as r: p=json.loads(r.read().decode())
          print("D1_SCHEMA_OBJECTS",json.dumps(p.get("result",[{}])[0].get("results",[]),ensure_ascii=False))
          PY
