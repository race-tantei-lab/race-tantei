name: Emergency Sep19 Settlement Inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep19-settlement-inspect.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Inspect 9/19 settlement truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          q() { jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-; }
          q "SELECT b.race_id AS raceId,COUNT(*) AS rows,SUM(b.settlement_status='settled') AS settledRows,SUM(b.settlement_status='pending') AS pendingRows,SUM(CASE WHEN COALESCE(b.return_yen,0)>0 THEN 1 ELSE 0 END) AS positiveReturnRows,MIN(b.locked_at) AS lockedAt,r.result_url AS resultUrl,r.status AS raceStatus,(SELECT COUNT(*) FROM rt_payouts p WHERE p.race_id=b.race_id) AS payoutRows,(SELECT COUNT(*) FROM rt_results x WHERE x.race_id=b.race_id) AS resultRows FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-09-19' AND b.source_prediction_id=-2 GROUP BY b.race_id ORDER BY b.race_id" > /tmp/byrace.json
          q "SELECT b.id,b.race_id AS raceId,b.course,b.bet_type AS betType,b.combination,b.stake_yen AS stakeYen,b.settlement_status AS settlementStatus,b.return_yen AS returnYen,r.refund_horse_nos_json AS refundsJson FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-09-19' AND b.source_prediction_id=-2 ORDER BY b.race_id,b.course,b.id" > /tmp/bets.json
          q "SELECT race_id AS raceId,bet_type AS betType,combination,payout_yen AS payoutYen,popularity FROM rt_payouts WHERE race_id LIKE '2026-09-19-%' ORDER BY race_id,bet_type,combination" > /tmp/payouts.json
          curl -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-19&_rt=$(date +%s)" > /tmp/day.json
          python3 - <<'PY'
          import json,pathlib
          def cf(p):
              x=json.load(open(p)); return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          report={'byRace':cf('/tmp/byrace.json'),'bets':cf('/tmp/bets.json'),'payouts':cf('/tmp/payouts.json'),'publicDay':json.load(open('/tmp/day.json'))}
          pathlib.Path('ops/sep19-settlement-inspect.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'byRace':report['byRace'],'payoutCount':len(report['payouts']),'publicStates':[{'raceId':r.get('raceId'),'state':r.get('publicState')} for r in report['publicDay'].get('races',[]) if r.get('raceId') in {x['raceId'] for x in report['byRace']}]},ensure_ascii=False,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep19-settlement-inspect.json
          git commit -m "ops: inspect Sep 19 settlement truth"
          git pull --rebase origin main
          git push origin HEAD:main
