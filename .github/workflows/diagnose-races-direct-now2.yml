name: Probe production races page direct now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-races-direct-now2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require all current weekend race details
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          : > /tmp/race-ids.txt
          for date in 2026-09-05 2026-09-06; do
            code=$(curl -sS -o "/tmp/day-$date.json" -w '%{http_code}' "$base/api/public/day?date=$date")
            [ "$code" = 200 ] || { echo "DAY_API_HTTP_${code}:$date"; exit 1; }
            python3 - "$date" <<'PY'
          import json,sys
          d=sys.argv[1]
          o=json.load(open(f'/tmp/day-{d}.json',encoding='utf-8'))
          races=o.get('races') or []
          if o.get('ok') is not True or len(races)!=36:
              raise SystemExit(f'DAY_API_INVALID:{d}:ok={o.get("ok")}:races={len(races)}')
          ids=[str(r.get('raceId') or '') for r in races]
          if len(set(ids))!=36 or any(not x for x in ids):
              raise SystemExit(f'RACE_IDS_INVALID:{d}')
          with open('/tmp/race-ids.txt','a') as f:
              for rid in ids: f.write(rid+'\n')
          print('DAY_OK',d,'RACES',len(ids))
          PY
          done

          total=$(wc -l < /tmp/race-ids.txt)
          [ "$total" -eq 72 ] || { echo "DETAIL_EXPECTED_72_GOT_$total"; exit 1; }
          failures=0
          checked=0
          while IFS= read -r rid; do
            [ -n "$rid" ] || continue
            path="/races/$rid"
            code=$(curl -L -sS -D /tmp/detail.h -o /tmp/detail.html -w '%{http_code}' "$base$path" || true)
            checked=$((checked+1))
            if [ "$code" != 200 ]; then
              echo "DETAIL_HTTP_FAIL $rid HTTP=$code"
              failures=$((failures+1))
              continue
            fi
            python3 - "$rid" <<'PY' || failures=$((failures+1))
          import re,sys
          rid=sys.argv[1]
          s=open('/tmp/detail.html',encoding='utf-8',errors='replace').read()
          forbidden=[
            'データ取得を一時的に再試行しています。',
            'データ取得を一時的に再試行しています',
            'データ取得を再試行しています',
            'データを再接続しています',
            '一時的にページを表示できません。',
            'レースが見つかりません',
          ]
          hits=[x for x in forbidden if x in s]
          title=re.findall(r'<title>(.*?)</title>',s,re.I|re.S)
          normal=('race-title' in s) and ('予想買い目' in s or '確定買い目' in s or '出走馬' in s or '見送り' in s)
          if hits or not title or not normal:
              print('DETAIL_BODY_FAIL',rid,'hits=',hits,'title=',title[:1],'normal=',normal)
              raise SystemExit(1)
          print('DETAIL_OK',rid,title[0])
          PY
          done < /tmp/race-ids.txt

          echo "DETAIL_CHECKED=$checked FAILURES=$failures"
          [ "$checked" -eq 72 ] || exit 1
          [ "$failures" -eq 0 ] || exit 1
          echo 'ALL_72_RACE_DETAILS_OK'
