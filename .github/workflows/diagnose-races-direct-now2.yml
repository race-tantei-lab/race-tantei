name: Probe production races page direct now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-races-direct-now2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe list and individual race details
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          curl -L -sS -D /tmp/list.h -o /tmp/list.html "$base/races/"
          python3 - <<'PY'
          import re
          s=open('/tmp/list.html',encoding='utf-8',errors='replace').read()
          links=[]
          for h in re.findall(r'href=["\']([^"\']+)["\']',s):
            if re.match(r'^/races/20\d{2}-\d{2}-\d{2}-[a-z0-9-]+-\d{2}/?$',h,re.I) and h not in links:
              links.append(h)
          print('DETAIL_LINK_COUNT',len(links))
          for h in links[:12]: print('DETAIL_LINK',h)
          open('/tmp/detail-links.txt','w').write('\n'.join(links[:12]))
          PY

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "=== DETAIL $path ==="
            code=$(curl -L -sS -D /tmp/detail.h -o /tmp/detail.html -w '%{http_code}' "$base$path" || true)
            echo "HTTP=$code BYTES=$(wc -c </tmp/detail.html)"
            grep -iE '^(location|content-type|cache-control|x-race|cf-ray|server):' /tmp/detail.h || true
            python3 - "$path" <<'PY'
          import re,sys
          p=sys.argv[1]
          s=open('/tmp/detail.html',encoding='utf-8',errors='replace').read()
          print('PATH',p)
          print('TITLE',re.findall(r'<title>(.*?)</title>',s,re.I|re.S)[:1])
          phrases=['データ取得を一時的に再試行しています。','データ取得を再試行しています','データを再接続しています','一時的にページを表示できません。','レースが見つかりません']
          for x in phrases: print('PHRASE',x, x in s)
          print('API_PATHS',sorted(set(re.findall(r'["\'](/api/[^"\']+)',s)))[:20])
          print('HEAD',repr(s[:400]))
          PY
          done < /tmp/detail-links.txt
