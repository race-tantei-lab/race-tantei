name: Sep21 Current Final Status

on:
  push:
    branches: [ops/sep21-final-preflight]
    paths:
      - ".github/workflows/sep21-current-final-status.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Query selected status
        shell: bash
        run: |
          set -euo pipefail
          sql="WITH sel AS (
            SELECT json_extract(j.value,'$.raceId') AS raceId
            FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
            WHERE s.state_key='final_daily_selection:2026-09-21'
          )
          SELECT datetime('now','+9 hours') AS jstNow,r.race_id AS raceId,r.start_time_jst AS startTimeJst,
                 ROUND((julianday(r.start_time_utc)-julianday('now'))*1440,2) AS remainingMin,
                 (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
                 (SELECT json_extract(p.state_value,'$.snapshots[0].generatedAt') FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||r.race_id) AS previewGeneratedAt,
                 (SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id=r.race_id) AS archiveRows
          FROM rt_races r JOIN sel ON sel.raceId=r.race_id ORDER BY r.start_time_utc"
          jq -n --arg sql "$sql" '{sql:$sql}' | curl -fsS             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${CF_DB}/query"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @-
