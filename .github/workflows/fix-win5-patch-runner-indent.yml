name: Fix WIN5 patch runner indentation

on:
  push:
    branches:
      - fix/win5-hard-lock-20260816
    paths:
      - .github/workflows/fix-win5-patch-runner-indent.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/win5-hard-lock-20260816
      - name: Fix verifier block in patch runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-win5-hard-lock-fix.yml')
          text=p.read_text(encoding='utf-8')
          start=text.index("          checks=r'''", text.index("needle='''"))
          end=text.index("          if needle not in text", start)
          block="""          checks = "\\n".join([\n              "    require('if (validSnapshot(existing, snapshot.date) && existing.locked) return existing;' in runtime, \\\"WIN5_FINAL_IMMUTABILITY_GUARD_MISSING\\\")",\n              "    require('nowMs >= cachedDeadlineMs && nowMs < cachedFirstStartMs' in runtime, \\\"WIN5_STORED_PREVIEW_DEADLINE_GUARD_MISSING\\\")",\n              "    require('await lockSnapshot(env.DB, preview, now, \\\"last_good\\\")' in runtime, \\\"WIN5_PREVIEW_PROMOTION_MISSING\\\")",\n              "    require('const freshCache = await resolveWin5Targets(env.DB, date, now, true)' not in runtime, \\\"WIN5_POST_DEADLINE_FRESH_REGEN_REINTRODUCED\\\")",\n              "    require('if (nowMs < deadlineMs)' in runtime, \\\"WIN5_PREVIEW_NOT_CUTOFF_AT_DEADLINE\\\")",\n              "    require('WIN5_DEADLINE_GUARD_BEFORE' in deadline and 'WIN5_DEADLINE_GUARD_AFTER' in deadline, \\\"WIN5_INDEPENDENT_DEADLINE_GUARD_MISSING\\\")",\n              "    require('state.status === \\\"final\\\" && state.snapshot?.lockedAt' in parent, \\\"WIN5_UI_NOT_SHOWING_ACTUAL_LOCK_TIME\\\")",\n              "    require('detail: \\\"T-15で固定済み\\\"' not in parent, \\\"WIN5_UI_FALSE_T15_CLAIM_REINTRODUCED\\\")",\n              "",\n              "",\n          ])\n"""
          p.write_text(text[:start]+block+text[end:],encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-win5-hard-lock-fix.yml
          git commit -m "Fix WIN5 verifier indentation"
          git push origin HEAD:fix/win5-hard-lock-20260816
