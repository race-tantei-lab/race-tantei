name: Audit exact archived JRA FINAL win odds coverage (NOT T15)
on:
  pull_request:
    branches: [research/multitarget-ranking-tweedie-catboost-20261108]
    paths:
      - scripts/audit-archived-final-odds-coverage.py
      - .github/workflows/audit-archived-final-odds-coverage.yml
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read 2023-2026 compressed historical runner archives locally, no network or D1
        run: python3 scripts/audit-archived-final-odds-coverage.py
