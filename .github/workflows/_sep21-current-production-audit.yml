name: Sep21 current production audit

on:
  push:
    branches:
      - fix/cancelled-race-active-count-verifiers
    paths:
      - ".github/workflows/_sep21-current-production-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit race-day weekday assumptions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SUSPICIOUS WEEKDAY/WEEKEND REFERENCES ==='
          grep -RInE 'date[[:space:]]+\+%u|weekday|weekend|Monday|Saturday|Sunday|Sat/Sun|土日|平日|cron:.*(6,0|0,6)' \
            src scripts .github/workflows wrangler*.jsonc \
            --include='*.ts' --include='*.js' --include='*.mjs' --include='*.py' --include='*.yml' --include='*.yaml' --include='*.jsonc' || true

      - name: Dump current production D1 invariants
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=$today"
          echo '=== SELECTION META ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key AS stateKey,updated_at AS updatedAt,
                   json_extract(state_value,'$.sourceModel') AS sourceModel,
                   json_extract(state_value,'$.resultDataUsedForTargetDay') AS resultDataUsedForTargetDay,
                   json_array_length(json_extract(state_value,'$.selected')) AS selectedCount,
                   state_value AS stateValue
            FROM rt_system_state
            WHERE state_key='final_daily_selection:'||'$today'
          "
          echo '=== SELECTED FINAL / LOCK / OFFICIAL PROVENANCE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH selected AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:'||'$today'
            )
            SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.status,
                   r.start_time_jst AS startTimeJst,r.start_time_utc AS startTimeUtc,
                   (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
                   (SELECT MIN(b.locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS firstLockedAt,
                   (SELECT MAX(b.locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS lastLockedAt,
                   ROUND((julianday((SELECT MAX(b.locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2))-julianday(r.start_time_utc))*1440.0,2) AS latestLockOffsetMin,
                   json_extract(fs.state_value,'$.finalizedFrom') AS finalizedFrom,
                   json_extract(fs.state_value,'$.oddsMode') AS oddsMode,
                   json_extract(fs.state_value,'$.oddsSource') AS oddsSource,
                   json_extract(fs.state_value,'$.oddsParserVersion') AS oddsParserVersion,
                   json_extract(fs.state_value,'$.lockedAt') AS finalStateLockedAt
            FROM rt_races r
            JOIN selected x ON x.raceId=r.race_id
            LEFT JOIN rt_system_state fs ON fs.state_key='worker_live_final:'||r.race_id
            ORDER BY r.start_time_utc,r.race_id
          "
          echo '=== CURRENT PREVIEW / ARCHIVE COVERAGE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH selected AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:'||'$today'
            )
            SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.status,
                   ROUND((julianday(r.start_time_utc)-julianday('now'))*1440.0,2) AS minutesToStart,
                   json_extract(p.state_value,'$.snapshots[0].generatedAt') AS previewGeneratedAt,
                   json_extract(p.state_value,'$.snapshots[0].oddsFetchedAt') AS previewOddsFetchedAt,
                   json_extract(p.state_value,'$.snapshots[0].oddsSource') AS previewOddsSource,
                   json_extract(p.state_value,'$.snapshots[0].oddsParserVersion') AS previewOddsParserVersion,
                   (SELECT COUNT(*) FROM rt_live_preview_archive a WHERE a.race_id=r.race_id) AS archiveRows
            FROM rt_races r
            JOIN selected x ON x.raceId=r.race_id
            LEFT JOIN rt_system_state p ON p.state_key='worker_live_preview:'||r.race_id
            ORDER BY r.start_time_utc,r.race_id
          "
          echo '=== HEARTBEAT / GUARD / DRIVER ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key AS stateKey,updated_at AS updatedAt,
                   unixepoch('now')-unixepoch(updated_at) AS ageSeconds,
                   state_value AS stateValue
            FROM rt_system_state
            WHERE state_key IN (
              'live_deadline_primary_heartbeat:v2',
              'live_deadline_driver:'||'$today',
              'worker_deadline_guard:'||'$today',
              'worker_live_lock:'||'$today'
            )
            ORDER BY state_key
          "
          echo '=== CANCELLED FINAL SAFETY ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT r.venue,r.status,COUNT(DISTINCT r.race_id) AS races,
                   COUNT(b.id) AS finalRows
            FROM rt_races r
            LEFT JOIN rt_public_bets b ON b.race_id=r.race_id AND b.source_prediction_id=-2
            WHERE r.race_date='$today'
              AND lower(COALESCE(r.status,'')) IN ('cancelled','canceled','postponed')
            GROUP BY r.venue,r.status
          "
          echo '=== SETTLEMENT BY SELECTED RACE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            WITH selected AS (
              SELECT json_extract(j.value,'$.raceId') AS raceId
              FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
              WHERE s.state_key='final_daily_selection:'||'$today'
            )
            SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.status,
                   (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS finalRows,
                   (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2 AND b.settlement_status='settled') AS settledRows,
                   (SELECT COUNT(*) FROM rt_results z WHERE z.race_id=r.race_id) AS resultRows
            FROM rt_races r JOIN selected x ON x.raceId=r.race_id
            ORDER BY r.start_time_utc,r.race_id
          "

      - name: Verify worker health and Cloudflare cron configuration
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://race-tantei-live-deadline.race-tantei.workers.dev/health' \
            'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health'; do
            echo "HEALTH $url"
            curl --max-time 20 --fail-with-body -sS "$url"
            echo
          done
          for spec in 'race-tantei-live-deadline|* * * * *' 'race-tantei-live-deadline-backup|1-59/2 * * * *'; do
            script=${spec%%|*}; expected=${spec#*|}
            echo "SCHEDULE $script expected=$expected"
            curl --max-time 20 --fail-with-body -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/schedules" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            echo
          done

      - name: Tail primary and backup cron outcomes
        shell: bash
        run: |
          set -euo pipefail
          (timeout 130s npx wrangler tail race-tantei-live-deadline --format=json > /tmp/primary-tail.log 2>&1 || true) &
          p1=$!
          (timeout 130s npx wrangler tail race-tantei-live-deadline-backup --format=json > /tmp/backup-tail.log 2>&1 || true) &
          p2=$!
          wait "$p1" || true
          wait "$p2" || true
          echo '=== PRIMARY TAIL ==='
          cat /tmp/primary-tail.log
          echo '=== BACKUP TAIL ==='
          cat /tmp/backup-tail.log
          if grep -q '"outcome":"exceededCpu"' /tmp/primary-tail.log /tmp/backup-tail.log; then
            echo 'EXCEEDED_CPU_OBSERVED' >&2
            exit 1
          fi
