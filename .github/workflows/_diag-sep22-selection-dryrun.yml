name: Sep22 selection exact dry run
on:
  push:
    branches:
      - diag/sep22-selection-dryrun-20260921
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Exact production selection dry run with virtual writes
        shell: bash
        run: |
          cat >/tmp/sep22-selection-dryrun.ts <<'TS'
          import { freezeCompletedWorkerSelectionIfNeeded } from '${{ github.workspace }}/src/v1/completed-selection-runtime.ts';

          const account=process.env.CLOUDFLARE_ACCOUNT_ID!;
          const database=process.env.CLOUDFLARE_D1_DATABASE_ID!;
          const token=process.env.CLOUDFLARE_API_TOKEN!;
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`;
          const virtual=new Map<string,string>();

          async function remote(sql:string,params:unknown[]){
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql,params})});
            const b:any=await r.json();
            if(!r.ok||!b.success) throw new Error('D1_REMOTE_FAILED:'+JSON.stringify(b));
            return b.result?.[0] ?? {results:[]};
          }
          class Bound {
            constructor(public sql:string,public params:unknown[]=[]){}
            bind(...params:unknown[]){ return new Bound(this.sql,params); }
            async all<T=any>(){
              const key=this.params[0];
              if(/FROM rt_system_state WHERE state_key=\?/i.test(this.sql)&&typeof key==='string'&&virtual.has(key)){
                return {results:[{value:virtual.get(key)}]} as any;
              }
              return await remote(this.sql,this.params) as any;
            }
            async first<T=any>(){
              const key=this.params[0];
              if(/FROM rt_system_state WHERE state_key=\?/i.test(this.sql)&&typeof key==='string'&&virtual.has(key)){
                return {value:virtual.get(key)} as any;
              }
              const out:any=await remote(this.sql,this.params);
              return (out.results?.[0] ?? null) as T|null;
            }
            async run(){
              if(/INSERT INTO rt_system_state/i.test(this.sql)){
                const key=String(this.params[0]??'');
                const value=String(this.params[1]??'');
                if(!key) throw new Error('VIRTUAL_STATE_KEY_MISSING');
                if(/ON CONFLICT\(state_key\) DO NOTHING/i.test(this.sql) && virtual.has(key)) return {success:true,meta:{virtual:true}} as any;
                virtual.set(key,value);
                console.log('VIRTUAL_WRITE',key);
                return {success:true,meta:{virtual:true}} as any;
              }
              throw new Error('UNEXPECTED_WRITE:'+this.sql.slice(0,120));
            }
          }
          class DB {
            prepare(sql:string){ return new Bound(sql); }
            async batch(stmts:any[]){ return await Promise.all(stmts.map((s)=>s.all())); }
          }
          async function main(){
            const now=new Date('2026-09-22T08:01:00+09:00');
            const result:any=await freezeCompletedWorkerSelectionIfNeeded({DB:new DB() as any} as any,now);
            const p:any=result.payload;
            console.log('DRYRUN_STATUS',result.status);
            console.log('DRYRUN_DATE',result.date);
            console.log('DRYRUN_MODEL',p?.sourceModel);
            console.log('DRYRUN_RESULT_DATA_USED',p?.resultDataUsedForTargetDay);
            console.log('DRYRUN_VENUE_COUNTS',JSON.stringify(p?.venueCounts));
            console.log('DRYRUN_SELECTED_COUNTS',JSON.stringify(p?.selectedVenueCounts));
            console.log('DRYRUN_SELECTED',JSON.stringify((p?.selected||[]).map((x:any)=>({raceId:x.raceId,venue:x.venue,raceNo:x.raceNo,raceScore:x.raceScore}))));
            if(result.status!=='frozen') throw new Error('DRYRUN_NOT_FROZEN');
            if(p?.sourceModel!=='ten-year-completed-model'||p?.resultDataUsedForTargetDay!==false) throw new Error('DRYRUN_SELECTION_INVARIANT');
            if(JSON.stringify(p?.venueCounts)!==JSON.stringify({中山:12})) throw new Error('DRYRUN_PROGRAM_NOT_SINGLE_NAKAYAMA');
            if(JSON.stringify(p?.selectedVenueCounts)!==JSON.stringify({中山:5})||(p?.selected||[]).length!==5) throw new Error('DRYRUN_SELECTED_NOT_FIVE');
            console.log('NO_PRODUCTION_WRITES');
          }
          main().catch((e)=>{console.error(e);process.exit(1)});
          TS
          npx tsx /tmp/sep22-selection-dryrun.ts
      - name: Audit Sep21 results available for prior-day learning
        shell: bash
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT r.venue,COUNT(DISTINCT r.race_id) AS races,COUNT(x.horse_no) AS resultRows,COUNT(DISTINCT CASE WHEN x.finish_position IS NOT NULL THEN r.race_id END) AS racesWithResults FROM rt_races r LEFT JOIN rt_results x ON x.race_id=r.race_id WHERE r.race_date='2026-09-21' AND lower(COALESCE(r.status,'scheduled')) NOT IN ('cancelled','canceled','postponed') GROUP BY r.venue ORDER BY r.venue"
