name: Backfill exact selection evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-selection-explanations.yml"
      - "scripts/write-ten-year-selection-explanations.py"
      - "scripts/run-ten-year-auto-final-live.py"
      - "scripts/ten-year-production-core.py"

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  BASE_URL: https://race-tantei-phase0.race-tantei.workers.dev

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile evidence writer
        run: |
          python -m py_compile \
            scripts/write-ten-year-selection-explanations.py \
            scripts/ten-year-production-core.py \
            scripts/collect-jra-official-odds.py

      - name: Persist exact evidence for today's frozen selection
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          dow=$(TZ=Asia/Tokyo date +%u)
          if [[ "$dow" != "6" && "$dow" != "7" && "$dow" != "1" ]]; then
            echo "Not a configured race day; backfill skipped."
            exit 0
          fi
          python scripts/write-ten-year-selection-explanations.py --date "$today" | tee /tmp/evidence.json
          TODAY="$today" python - <<'PY'
          import json, os, pathlib
          row=json.loads(pathlib.Path('/tmp/evidence.json').read_text(encoding='utf-8').strip().splitlines()[-1])
          assert row['status']=='ok', row
          assert row['date']==os.environ['TODAY'], row
          assert row['sourceModel']=='ten-year-completed-model', row
          assert row['version']=='canonical-selection-trace-v1', row
          assert row['rows']==15, row
          assert len(row['raceIds'])==15 and len(set(row['raceIds']))==15, row
          print('selection evidence D1 backfill=ok rows=15')
          PY

      - name: Verify exact evidence on a live race page
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/api/public/today-prediction-sample" -o /tmp/sample.json
          race_id=$(TODAY="$today" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/sample.json','utf8'));
          if(p.date!==process.env.TODAY) throw new Error('prediction sample date mismatch');
          if(!p.hasPredictions || !p.raceId) throw new Error('prediction sample missing');
          process.stdout.write(String(p.raceId));
          NODE
          )
          curl --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 3 --max-time 15 -fsS "$BASE_URL/races/$race_id" -o /tmp/detail.html
          for marker in \
            'data-selection-trace="canonical-selection-trace-v1"' \
            '凍結済み選定と一致' \
            '会場内順位' \
            'raceScore' \
            '選定用の上位候補5頭' \
            'レース選定用 仮買い目1' \
            'レース選定用 仮買い目2' \
            'レース選定用 仮買い目3' \
            'この条件の過去サンプル' \
            '補正後ROI' \
            '局所条件の加重ROI'; do
            if ! grep -q "$marker" /tmp/detail.html; then
              echo "MISSING_LIVE_EVIDENCE_MARKER:$marker race=$race_id" >&2
              exit 1
            fi
          done
          if grep -q '条件に合致' /tmp/detail.html; then
            echo 'GENERIC_CONDITION_COPY_REMAINS' >&2
            exit 1
          fi
          echo "EXACT_SELECTION_EVIDENCE_LIVE_OK race=$race_id"
