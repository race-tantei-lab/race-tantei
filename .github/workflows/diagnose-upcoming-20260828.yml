name: Diagnose upcoming races 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-upcoming-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Sunday schedule and ROI-only daily history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'race-tantei-prod-verifier'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read().decode('utf-8')
          for d in ['2026-08-29','2026-08-30']:
              p=json.loads(get(f'/api/public/day?date={d}&_rt={time.time_ns()}'))
              races=p.get('races') or []
              venues=sorted({str(x.get('venue')) for x in races if x.get('venue')})
              print('PUBLIC_DAY',d,json.dumps({'ok':p.get('ok'),'date':p.get('date'),'races':len(races),'venues':venues},ensure_ascii=False))
              if d=='2026-08-30' and (len(races)!=36 or len(venues)!=3):
                  raise SystemExit(f'PUBLIC_SUNDAY_INCOMPLETE races={len(races)} venues={venues}')
          home=get(f'/?_rt={time.time_ns()}')
          if 'daily-performance-v3-roi-only-history-20260828' not in home:
              raise SystemExit('ROI_ONLY_VERSION_MISSING')
          if "<span>回収率 '+pct(d.roiPct)+'</span></summary>" not in home:
              raise SystemExit('ROI_ONLY_SUMMARY_MISSING')
          if "回収率 '+pct(d.roiPct)+'　購入" in home:
              raise SystemExit('OLD_DAILY_AMOUNT_SUMMARY_STILL_PRESENT')
          print('ROI_ONLY_HOME_OK')
          PY
