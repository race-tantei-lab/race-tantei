name: Sep21 Nak1 Odds Cache Probe

on:
  push:
    branches: [ops/sep21-final-preflight]
    paths:
      - ".github/workflows/sep21-nak1-odds-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - name: Probe official cached odds
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT 'latest' AS src,bet_type AS betType,COUNT(*) AS rows,MAX(captured_at_utc) AS capturedAt
            FROM rt_official_odds_latest
            WHERE race_id='2026-09-21-nakayama-01'
            GROUP BY bet_type
            UNION ALL
            SELECT 'snap',bet_type,COUNT(*),MAX(captured_at_utc)
            FROM rt_official_odds_snapshots
            WHERE race_id='2026-09-21-nakayama-01'
            GROUP BY bet_type
            ORDER BY src,betType
          "
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT race_id AS raceId,entry_url AS entryUrl,start_time_utc AS startTimeUtc,
                   (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=rt_races.race_id AND b.source_prediction_id=-2) AS finalRows
            FROM rt_races WHERE race_id='2026-09-21-nakayama-01'
          "
