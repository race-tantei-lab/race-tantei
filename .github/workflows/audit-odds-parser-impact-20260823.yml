name: Audit malformed JRA odds parser impact
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-odds-parser-impact-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit immutable public bets and final provenance
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOURCE -2 COVERAGE BY DATE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT r.race_date, COUNT(DISTINCT b.race_id) AS races, COUNT(*) AS bet_rows, MIN(b.locked_at) AS first_lock, MAX(b.locked_at) AS last_lock FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE b.source_prediction_id=-2 GROUP BY r.race_date ORDER BY r.race_date"
          echo '=== SINGLE-WIN EXACT HORSE-NUMBER PATTERN ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT r.race_date,b.race_id,b.course,b.bet_type,b.combination,b.assumed_odds,b.locked_at FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE b.source_prediction_id=-2 AND b.bet_type='単勝' AND CAST(b.combination AS REAL)=b.assumed_odds ORDER BY r.race_date,b.locked_at,b.race_id,b.course"
          echo '=== SINGLE-WIN ALL SOURCE -2 ROWS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT r.race_date,b.race_id,b.course,b.combination,b.assumed_odds,b.locked_at FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE b.source_prediction_id=-2 AND b.bet_type='単勝' ORDER BY r.race_date,b.locked_at,b.race_id,b.course"
          echo '=== FINAL PROVENANCE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT substr(state_key,length('worker_live_final:')+1) AS race_id,updated_at,json_extract(state_value,'$.lockedAt') AS locked_at,json_extract(state_value,'$.oddsFetchedAt') AS odds_fetched_at,json_extract(state_value,'$.oddsSource') AS odds_source,json_extract(state_value,'$.oddsParserVersion') AS parser_version,json_extract(state_value,'$.tickets[0].betType') AS type0,json_extract(state_value,'$.tickets[0].combination') AS combo0,json_extract(state_value,'$.tickets[0].officialOdds') AS odds0,json_extract(state_value,'$.tickets[1].betType') AS type1,json_extract(state_value,'$.tickets[1].combination') AS combo1,json_extract(state_value,'$.tickets[1].officialOdds') AS odds1 FROM rt_system_state WHERE state_key LIKE 'worker_live_final:%' ORDER BY locked_at"
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/odds-parser-impact-audit' -f description='Historical odds-parser impact audit completed' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/odds-parser-impact-audit' -f description='Historical odds-parser impact audit failed' -f target_url="$STATUS_TARGET_URL" >/dev/null