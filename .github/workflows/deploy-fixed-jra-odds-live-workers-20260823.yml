name: Deploy fixed JRA odds parser to live workers 20260823
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-fixed-jra-odds-live-workers-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and odds regression suite
        run: |
          npm run typecheck
          npx tsx tests/jra-official-odds-fetch-tests.ts
      - name: Verify real JRA six-market completeness before deploy
        shell: bash
        run: |
          set -euo pipefail
          race='2026-08-23-chukyo-10'
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT entry_url FROM rt_races WHERE race_id='$race'" > /tmp/race.json
          entry=$(node -e "const p=require('/tmp/race.json');process.stdout.write(p[0].results[0].entry_url)")
          cat > /tmp/verify-real-odds.ts <<'TS'
          import { fetchFastJraOfficialOddsForRace } from "${GITHUB_WORKSPACE}/src/v1/jra-official-odds-fetch.ts";
          const entry=process.env.ENTRY_URL!;
          const r=await fetchFastJraOfficialOddsForRace(entry,{raceDate:"2026-08-23",venue:"中京",raceNo:10});
          const counts=Object.fromEntries(r.pages.map(p=>[p.betType,p.rows.length]));
          const expected={"単勝":14,"ワイド":91,"馬連":91,"馬単":182,"3連複":364,"3連単":2184};
          console.log("REAL_JRA_COUNTS",JSON.stringify(counts));
          for(const [k,v] of Object.entries(expected)) if(Number(counts[k])!==v) throw new Error(`COUNT_MISMATCH:${k}:${counts[k]}:${v}`);
          const tan3=r.rows.filter(x=>x.betType==="3連単");
          const high=tan3.filter(x=>x.oddsMin>100000);
          if(high.length!==253) throw new Error(`HIGH_ODDS_COUNT:${high.length}`);
          const win12=r.rows.find(x=>x.betType==="単勝"&&x.combination==="12");
          if(!win12||win12.oddsMin!==1.7||win12.oddsMax!==1.7) throw new Error(`WIN12_MISMATCH:${JSON.stringify(win12)}`);
          console.log("REAL_JRA_HIGH_ODDS",high.length,"WIN12",JSON.stringify(win12));
          TS
          sed -i "s|\${GITHUB_WORKSPACE}|$GITHUB_WORKSPACE|g" /tmp/verify-real-odds.ts
          ENTRY_URL="$entry" npx tsx /tmp/verify-real-odds.ts
      - name: Validate primary and backup bundles
        run: |
          rm -rf /tmp/live-primary /tmp/live-backup
          npx wrangler deploy --dry-run --outdir /tmp/live-primary --config wrangler.live-deadline.jsonc
          npx wrangler deploy --dry-run --outdir /tmp/live-backup --config wrangler.live-deadline-backup.jsonc
          grep -R -F 'jra-semantic-table-parser-v3-20260823' /tmp/live-primary >/dev/null
          grep -R -F 'jra-semantic-table-parser-v3-20260823' /tmp/live-backup >/dev/null
      - name: Deploy primary live deadline Worker
        run: npx wrangler deploy --config wrangler.live-deadline.jsonc
      - name: Deploy backup live deadline Worker
        run: npx wrangler deploy --config wrangler.live-deadline-backup.jsonc
      - name: Verify Cloudflare production scripts and cron schedules
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          for script in race-tantei-live-deadline race-tantei-live-deadline-backup; do
            curl -fsS "${auth[@]}" "$base/scripts/$script" -o "/tmp/$script.bundle"
            grep -a -F 'jra-semantic-table-parser-v3-20260823' "/tmp/$script.bundle" >/dev/null
            curl -fsS "${auth[@]}" "$base/scripts/$script/schedules" -o "/tmp/$script.schedules.json"
            node - "$script" "/tmp/$script.schedules.json" <<'NODE'
          const fs=require('fs');
          const [script,file]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!p.success) throw new Error(`${script}:SCHEDULE_API_FAILED:${JSON.stringify(p.errors)}`);
          const crons=(p.result||[]).map(x=>x.cron).sort();
          const expected=script.endsWith('-backup')?['2-59/5 * * * *']:['* * * * *'];
          if(JSON.stringify(crons)!==JSON.stringify(expected)) throw new Error(`${script}:CRON_MISMATCH:${JSON.stringify(crons)}`);
          console.log('PRODUCTION_WORKER_OK',script,'crons=',crons.join(','));
          NODE
          done
      - name: List deployed versions
        run: |
          npx wrangler deployments list --config wrangler.live-deadline.jsonc | head -80
          npx wrangler deployments list --config wrangler.live-deadline-backup.jsonc | head -80
      - name: Mark dual live deadline deploy success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/live-deadline' -f description='Fixed JRA odds parser deployed to primary and backup' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark dual live deadline deploy failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/live-deadline' -f description='Fixed JRA odds parser live deployment failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
