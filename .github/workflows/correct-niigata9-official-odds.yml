name: Correct Niigata 9R official odds before post

on:
  push:
    branches:
      - ops/finalize-niigata9-20260816
    paths:
      - .github/workflows/correct-niigata9-official-odds.yml

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Correct odds only, never tickets or lock time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        shell: bash
        run: |
          cat > /tmp/correct.ts <<'TS'
          async function main(){
            const mod:any = await import(process.cwd() + '/src/v1/jra-official-odds-fetch.ts');
            const fetchFastJraOfficialOddsForRace = mod.fetchFastJraOfficialOddsForRace;
            const rid='2026-08-16-niigata-09';
            const endpoint=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.CLOUDFLARE_D1_DATABASE_ID}/query`;
            async function q(sql:string,params:any[]=[]){
              const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
              const j:any=await r.json(); if(!j.success) throw new Error(JSON.stringify(j.errors)); return j.result?.[0]?.results??[];
            }
            const race=(await q('SELECT race_date AS raceDate,venue,race_no AS raceNo,entry_url AS entryUrl,start_time_utc AS startTimeUtc FROM rt_races WHERE race_id=? LIMIT 1',[rid]))[0];
            if(!race) throw new Error('RACE_NOT_FOUND');
            const now=Date.now(), start=Date.parse(race.startTimeUtc);
            if(!Number.isFinite(start)||now>=start) throw new Error('REFUSE_POST_START');
            const rows=await q('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,assumed_odds AS assumedOdds,locked_at AS lockedAt,source_prediction_id AS sourcePredictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid]);
            if(rows.length!==6||rows.some((x:any)=>Number(x.sourcePredictionId)!==-2)) throw new Error('FINAL_ROWS_INVALID');
            const sig=[...new Set(rows.map((x:any)=>`${x.betType}:${x.combination}`))].sort();
            if(sig.length!==2) throw new Error('TICKET_SIGNATURE_INVALID');
            const st=(await q('SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1',[`worker_live_final:${rid}`]))[0];
            if(!st?.value) throw new Error('FINAL_STATE_MISSING');
            const state=JSON.parse(st.value);
            const originalLockedAt=state.lockedAt;
            const originalTickets=JSON.stringify((state.tickets??[]).map((x:any)=>({betType:x.betType,combination:x.combination})));
            const fetched=await fetchFastJraOfficialOddsForRace(race.entryUrl,{raceDate:race.raceDate,venue:race.venue,raceNo:Number(race.raceNo)});
            const map=new Map<string,number>();
            for(const x of fetched.rows){ const mid=(Number(x.oddsMin)+Number(x.oddsMax))/2; if(Number.isFinite(mid)&&mid>0) map.set(`${x.betType}:${x.combination}`,mid); }
            for(const s of sig){ if(!map.has(s)) throw new Error(`OFFICIAL_ODDS_MISSING:${s}`); }
            for(const s of sig){ const [betType,...rest]=s.split(':'); const combination=rest.join(':'); const odd=map.get(s)!; await q('UPDATE rt_public_bets SET assumed_odds=? WHERE race_id=? AND bet_type=? AND combination=? AND source_prediction_id=-2',[Number(odd.toFixed(6)),rid,betType,combination]); }
            const correctedAt=new Date().toISOString();
            state.oddsAvailable=true;
            state.oddsMode='official_correction_pre_start';
            state.oddsFetchedAt=correctedAt;
            state.oddsSource=fetched.source;
            state.oddsCorrectedAt=correctedAt;
            state.tickets=(state.tickets??[]).map((t:any)=>{ const odd=map.get(`${t.betType}:${t.combination}`); return odd?{...t,officialOdds:Number(odd.toFixed(6))}:t; });
            if(state.lockedAt!==originalLockedAt) throw new Error('LOCK_TIME_CHANGED');
            if(JSON.stringify((state.tickets??[]).map((x:any)=>({betType:x.betType,combination:x.combination})))!==originalTickets) throw new Error('TICKETS_CHANGED');
            await q('UPDATE rt_system_state SET state_value=?,updated_at=CURRENT_TIMESTAMP WHERE state_key=?',[JSON.stringify(state),`worker_live_final:${rid}`]);
            const saved=await q('SELECT course,bet_type AS betType,combination,assumed_odds AS assumedOdds,locked_at AS lockedAt FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid]);
            console.log('CORRECTED='+JSON.stringify({correctedAt,source:fetched.source,odds:Object.fromEntries(sig.map(s=>[s,map.get(s)])),lockedAt:originalLockedAt,bets:saved}));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx tsx /tmp/correct.ts
