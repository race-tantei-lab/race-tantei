name: Research-only November 8 JRA race-day readiness (1 bounded SELECT)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research-20261108-preflight-readonly.py
      - .github/workflows/research-20261108-preflight-readonly.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only source syntax
        run: python3 -m py_compile scripts/research-20261108-preflight-readonly.py
      - name: Verify exact Nov 8 roster and both live Workers without modifying production
        run: python3 -u scripts/research-20261108-preflight-readonly.py
