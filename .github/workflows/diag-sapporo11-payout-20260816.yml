name: Diagnose Sapporo 11 payout 20260816

on:
  push:
    branches:
      - diag/sapporo11-payout-20260816
    paths:
      - .github/workflows/diag-sapporo11-payout-20260816.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Sapporo 11 final bets and payouts
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def q(sql,params=None):
              body=json.dumps({'sql':sql,'params':params or []}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as r: payload=json.loads(r.read().decode())
              if not payload.get('success'): raise RuntimeError(payload.get('errors'))
              return payload.get('result',[{}])[0].get('results',[])
          rid='2026-08-16-sapporo-11'
          bets=q('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,assumed_odds AS assumedOdds,COALESCE(return_yen,0) AS returnYen,settlement_status AS settlementStatus,locked_at AS lockedAt,source_prediction_id AS sourcePredictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination',[rid])
          payouts=q('SELECT bet_type AS betType,combination,payout_yen AS payoutYen FROM rt_payouts WHERE race_id=? ORDER BY bet_type,combination',[rid])
          results=q('SELECT horse_no AS horseNo,finish_position AS finishPosition FROM rt_results WHERE race_id=? ORDER BY finish_position,horse_no',[rid])
          state=q("SELECT state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=? LIMIT 1",['worker_live_final:'+rid])
          print('BETS='+json.dumps(bets,ensure_ascii=False,separators=(',',':')))
          print('PAYOUTS='+json.dumps(payouts,ensure_ascii=False,separators=(',',':')))
          print('RESULTS='+json.dumps(results,ensure_ascii=False,separators=(',',':')))
          print('FINAL_STATE='+json.dumps(state,ensure_ascii=False,separators=(',',':')))
          for course in sorted({str(x['course']) for x in bets}):
              rows=[x for x in bets if str(x['course'])==course]
              stake=sum(int(x.get('stakeYen') or 0) for x in rows)
              ret=sum(int(x.get('returnYen') or 0) for x in rows)
              print('COURSE='+json.dumps({'course':course,'stakeYen':stake,'returnYen':ret,'profitYen':ret-stake,'roiPct':(ret/stake*100 if stake else None)},ensure_ascii=False,separators=(',',':')))
          PY
