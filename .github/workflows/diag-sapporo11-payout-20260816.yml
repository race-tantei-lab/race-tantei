name: Diagnose WIN5 lock timestamps 20260816

on:
  push:
    branches:
      - diag/sapporo11-payout-20260816
    paths:
      - .github/workflows/diag-sapporo11-payout-20260816.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read WIN5 final preview and target timestamps
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def q(sql,params=None):
              body=json.dumps({'sql':sql,'params':params or []}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as r: payload=json.loads(r.read().decode())
              if not payload.get('success'): raise RuntimeError(payload.get('errors'))
              return payload.get('result',[{}])[0].get('results',[])
          date='2026-08-16'
          rows=q("SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key IN (?,?,?) ORDER BY state_key",[f'win5:targets:{date}',f'win5:preview:{date}',f'win5:final:{date}'])
          for row in rows:
              obj=json.loads(row['value'])
              summary={'stateKey':row['stateKey'],'updatedAt':row['updatedAt']}
              for k in ['generatedAt','locked','lockedAt','finalizedFrom','lockDeadlineUtc','firstRaceStartUtc','fetchedAt']:
                  if k in obj: summary[k]=obj.get(k)
              if isinstance(obj.get('profiles'),list):
                  summary['profiles']=[{'name':p.get('name'),'points':p.get('points'),'purchaseYen':p.get('purchaseYen'),'legs':[[x.get('leg'),[h.get('horseNo') for h in x.get('selected',[])]] for x in p.get('legs',[])]} for p in obj['profiles']]
              print('WIN5_STATE='+json.dumps(summary,ensure_ascii=False,separators=(',',':')))
          PY
