name: Final ticket-layer validation
on:
  push:
    branches: [main]
    paths:
      - ".github/analysis/final-ticket-layer-validation.py"
      - ".github/workflows/final-ticket-layer-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lightgbm==4.6.0 'numpy<3'
      - name: Freeze all selected races
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          A=os.environ['CLOUDFLARE_ACCOUNT_ID'];D=os.environ['CLOUDFLARE_D1_DATABASE_ID'];T=os.environ['CLOUDFLARE_API_TOKEN'];U=f'https://api.cloudflare.com/client/v4/accounts/{A}/d1/database/{D}/query'
          def q(sql,p=None):
            req=urllib.request.Request(U,data=json.dumps({'sql':sql,'params':p or []}).encode(),method='POST',headers={'Authorization':f'Bearer {T}','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=120) as r:x=json.loads(r.read().decode())
            if not x.get('success'):raise RuntimeError(x)
            return (x.get('result') or [{}])[0].get('results') or []
          rows=q("SELECT state_key k,state_value v FROM rt_system_state WHERE state_key LIKE 'final_daily_selection:%' ORDER BY state_key")
          ids=[]
          for z in rows:
            d=str(z['k']).split(':')[-1]
            if not ('2026-08-15'<=d<='2026-10-12'):continue
            p=json.loads(z['v']);ids.extend(str(a['raceId']) for a in p.get('selected',[]) if a.get('raceId'))
          ids=list(dict.fromkeys(ids));assert len(ids)==238,(len(ids),ids[-20:])
          Path('analysis-results/fixed-oos-five-races-per-venue-day.json').write_text(json.dumps({'races':ids},ensure_ascii=False)+'\n')
          print({'selectedRaces':len(ids)})
          PY
      - name: Fetch JRA official odds
        run: |
          cp scripts/export-selected-historical-official-odds.py /tmp/export.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/export.py');s=p.read_text();s=s.replace("ROOT = Path(__file__).resolve().parents[1]","ROOT = Path.cwd()");s=s.replace("START = '2024-05-04'","START = '2026-08-10'");s=s.replace("END_EXCLUSIVE = '2026-08-03'","END_EXCLUSIVE = '2026-10-13'");s=s.replace("WORKERS = 20","WORKERS = 12");s=s.replace("r'pw01sde10", "r'pw01sde(?:10|01)");s=s.replace("            tab[m.group(2)] = m.group(1)","            tab['15' + m.group(2)] = m.group(1)",1);p.write_text(s)
          PY
          python /tmp/export.py || true
          python .github/analysis/fetch-current-day-official-odds.py
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          seen=set();out=[]
          for p in [Path('artifacts/selected-historical-official-odds.jsonl.gz'),Path('artifacts/current-day-selected-official-odds.jsonl.gz')]:
            if not p.exists():continue
            with gzip.open(p,'rt',encoding='utf-8') as f:
              for line in f:
                if not line.strip():continue
                x=json.loads(line);rid=str(x['raceId'])
                if rid in seen:continue
                seen.add(rid);out.append(x)
          assert len(out)==238,(len(out),sorted(seen)[-30:])
          with gzip.open('artifacts/ticket-layer-official-odds.jsonl.gz','wt',encoding='utf-8') as f:
            for x in out:f.write(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n')
          print({'officialOddsRaces':len(out)})
          PY
      - name: Run full validation
        run: python .github/analysis/final-ticket-layer-validation.py
