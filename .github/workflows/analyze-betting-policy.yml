name: Analyze 5R-plus betting policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-betting-policy.yml"
      - "scripts/analyze-betting-policy.mjs"
      - "scripts/analyze-betting-factors.mjs"
      - "scripts/search-betting-policy-v2.mjs"
      - "scripts/train-realized-ticket-edge.mjs"
      - "scripts/train-runner-ranking-v2.mjs"
      - "src/v1/**"
      - "package.json"
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: analyze-5r-plus-betting-policy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build analysis modules
        run: npm run build:test

      - name: Analyze current policy
        shell: bash
        run: |
          set -o pipefail
          node scripts/analyze-betting-policy.mjs 2>&1 | tee policy-analysis.log

      - name: Decompose betting factors
        shell: bash
        run: |
          set -o pipefail
          node scripts/analyze-betting-factors.mjs 2>&1 | tee betting-factor-analysis.log

      - name: Search expanded candidate universe
        shell: bash
        run: |
          set -o pipefail
          node scripts/search-betting-policy-v2.mjs 2>&1 | tee expanded-policy-search.log

      - name: Train realized-return ticket edge model
        shell: bash
        run: |
          set -o pipefail
          node scripts/train-realized-ticket-edge.mjs 2>&1 | tee realized-ticket-edge.log

      - name: Train chronological runner ranking model
        shell: bash
        run: |
          set -o pipefail
          node scripts/train-runner-ranking-v2.mjs 2>&1 | tee runner-ranking-v2.log

      - name: Publish latest result in workflow summary
        if: always()
        shell: bash
        run: |
          for file in policy-analysis.json betting-factor-analysis.json expanded-policy-search.json realized-ticket-edge.json runner-ranking-v2.json; do
            if [[ -f "$file" ]]; then
              echo "## $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload analysis result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-analysis
          path: |
            policy-analysis.json
            policy-analysis.log
            betting-factor-analysis.json
            betting-factor-analysis.log
            expanded-policy-search.json
            expanded-policy-search.log
            realized-ticket-edge.json
            realized-ticket-edge.log
            runner-ranking-v2.json
            runner-ranking-v2.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save available results to GitHub
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          for file in \
            policy-analysis.json policy-analysis.log \
            betting-factor-analysis.json betting-factor-analysis.log \
            expanded-policy-search.json expanded-policy-search.log \
            realized-ticket-edge.json realized-ticket-edge.log \
            runner-ranking-v2.json runner-ranking-v2.log; do
            if [[ -f "$file" ]]; then
              cp "$file" "analysis-results/$file"
              git add -f "analysis-results/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No result change to commit."
          else
            git commit -m "Save runner ranking and betting analysis"
            git push
          fi
