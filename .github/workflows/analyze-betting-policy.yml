name: Analyze 5R-plus betting policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-betting-policy.yml"
      - "scripts/analyze-betting-policy.mjs"
      - "src/v1/**"
      - "package.json"
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: analyze-5r-plus-betting-policy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether a scheduled result already exists
        id: existing
        shell: bash
        run: |
          if [[ -f analysis-results/policy-analysis.json && "${{ github.event_name }}" == "schedule" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        run: npm ci

      - name: Analyze validation and untouched holdout
        if: steps.existing.outputs.skip != 'true'
        run: npm run learning:analyze

      - name: Publish result in workflow summary
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          echo "## 5R-plus betting policy analysis" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat policy-analysis.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full result
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: policy-analysis
          path: policy-analysis.json
          retention-days: 30

      - name: Save result to GitHub
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p analysis-results
          cp policy-analysis.json analysis-results/policy-analysis.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-results/policy-analysis.json
          if git diff --cached --quiet; then
            echo "No result change to commit."
          else
            git commit -m "Save 5R-plus policy analysis result"
            git push
          fi
