name: Evaluate speed-enriched high order
run-name: Evaluate speed-enriched high order · ${{ github.sha }}

on:
  workflow_run:
    workflows: ["Build speed-enriched runner OOS"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/evaluate-speed-enriched-high-order-policy.py"
      - ".github/workflows/evaluate-speed-enriched-high-order.yml"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: evaluate-speed-enriched-high-order
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve successful runner artifact run
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            RID=$(gh run list --workflow build-speed-runner-oos.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            SHA="$GITHUB_SHA"
          fi
          test -n "$RID"
          echo "RUNNER_RID=$RID" >> "$GITHUB_ENV"
          echo "STATUS_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publish evaluation start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" -f state=pending -f context='analysis/speed-high-order-evaluation' -f description='スタンダード・プレミアム完全OOS精算中' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Download persisted analysis inputs and runner OOS
        run: |
          gh run download "$RUNNER_RID" -n speed-analysis-input -D artifacts/speed-analysis-input
          gh run download "$RUNNER_RID" -n speed-runner-oos -D artifacts/speed-runner-oos
      - name: Install evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas lightgbm
      - name: Verify immutable constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py
      - name: Guarantee OOS load, align official odds to active runners, and optimize lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/evaluate-speed-enriched-high-order-policy.py'); s=p.read_text(encoding='utf-8')
          if 'npz = np.load(' not in s:
              lines=s.splitlines()
              pos=next((i for i,line in enumerate(lines) if line.lstrip().startswith('normalP =')),None)
              if pos is None: raise SystemExit('NORMALP_LINE_NOT_FOUND')
              lines.insert(pos, 'npz = np.load(RUN / "runner-oos-probabilities.npz")')
              s='\n'.join(lines)+'\n'
          old='''for ri,rec in enumerate(odds_records):\n    rid=rec["raceId"]; horses=[int(x) for x in rec["horses"]]\n    pn=model_combo_probs(runner_prob(rid,horses,normalP)); pr=model_combo_probs(runner_prob(rid,horses,residP))\n    for bt in BET_TYPES:\n        vals=official_values(rec,bt); mass=3.0 if bt=="wide" else 1.0; pm=official_market(vals,mass)\n        combos=combo_tuples(horses,bt); actual_map=payout[rid][bt]'''
          new='''for ri,rec in enumerate(odds_records):\n    rid=rec["raceId"]\n    all_horses=[int(x) for x in rec["horses"]]\n    active=race_rows[rid]\n    horses=[h for h in all_horses if h in active]\n    pn=model_combo_probs(runner_prob(rid,horses,normalP)); pr=model_combo_probs(runner_prob(rid,horses,residP))\n    for bt in BET_TYPES:\n        all_combos=combo_tuples(all_horses,bt)\n        keep=[j for j,c in enumerate(all_combos) if all(int(h) in active for h in c)]\n        raw_vals=official_values(rec,bt)\n        vals=raw_vals[keep]\n        mass=3.0 if bt=="wide" else 1.0; pm=official_market(vals,mass)\n        combos=combo_tuples(horses,bt)\n        if len(vals)!=len(combos): raise RuntimeError(f"ACTIVE_ODDS_ALIGNMENT:{bt}:{rid}:{len(vals)}:{len(combos)}")\n        actual_map=payout[rid][bt]'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'all_horses=[int(x) for x in rec["horses"]]' not in s:
              raise SystemExit('HIGH_ORDER_ACTIVE_PATCH_TARGET_NOT_FOUND')
          old="""for ri,rid in enumerate(race_ids):\n    g=meta[meta['raceIndex']==ri]; ids=g.index.to_numpy(int); mp=g['marketP'].to_numpy(float); pn=normalP[ids]; pr=residP[ids]; row=g.iloc[0]"""
          new="""for ri,rid in enumerate(race_ids):\n    ids=np.fromiter(race_rows[rid].values(),dtype=int); g=meta.iloc[ids]; mp=g['marketP'].to_numpy(float); pn=normalP[ids]; pr=residP[ids]; row=g.iloc[0]"""
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Evaluate locked Standard and Premium policy
        run: python scripts/evaluate-speed-enriched-high-order-policy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-high-order-evaluation
          path: artifacts/speed-high-order-evaluation/
          compression-level: 1
          retention-days: 30
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" -f state=success -f context='analysis/speed-high-order-evaluation' -f description='スタンダード・プレミアム完全OOS精算完了' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" -f state=failure -f context='analysis/speed-high-order-evaluation' -f description='スタンダード・プレミアム精算処理失敗' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
