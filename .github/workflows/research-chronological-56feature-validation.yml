name: Research chronological 56-feature OOS (never deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-chronological-56feature-validation.py"
      - "scripts/research-wide-flexible-oof-20261107.py"
      - ".github/workflows/research-chronological-56feature-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-chronological-56feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Check research script syntax
        run: python -m py_compile scripts/research-chronological-56feature-validation.py
      - name: Strict date-grouped training, validation and already-opened 2026 diagnostic
        run: python -u scripts/research-chronological-56feature-validation.py
      - name: Save independently reproducible non-promotable research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronological-56feature-oos-research
          path: analysis-results/research-chronological-56feature-validation-20261107.json
          if-no-files-found: warn
          retention-days: 30

  flexible-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Verify 1-5 race optional-abstention grid, script and non-leakage fixture
        run: |
          python -m py_compile scripts/research-wide-flexible-oof-20261107.py
          python -u scripts/research-wide-flexible-oof-20261107.py --self-test
      - name: Evaluate broad 2024 discovery and 2025+ chronological transfers
        run: python -u scripts/research-wide-flexible-oof-20261107.py
      - name: Save actual OOF research result; do not promote without real T15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexible-oof-patterns-non-promotable
          path: analysis-results/research-wide-flexible-oof-20261107.json
          if-no-files-found: warn
          retention-days: 30
