name: Research diagnose last market odds gap

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-diagnose-last-market-odds-gap.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CORRECTED_INPUT_RUN_ID: '31451680037'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download corrected input
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CORRECTED_INPUT_RUN_ID}/artifacts?per_page=100" > a.json
          id=$(jq -r '.artifacts[] | select(.name=="research-corrected-final-market-inputs" and .expired==false) | .id' a.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > input.zip
          unzip -q input.zip -d input
      - name: Reproduce candidate sets and print only missing official combos
        run: |
          python - <<'PY'
          import collections,importlib.util,json
          from pathlib import Path
          ROOT=Path('.')
          def load(path,name):
            s=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          cmod=load(ROOT/'scripts/research-continuous-walkforward-demand.py','diag_cmod')
          targets={'2026-08-09-chukyo-09','2026-08-09-niigata-10','2026-08-09-niigata-11'}
          odds={}
          for p in Path('input/corrected-odds').glob('*.jsonl'):
            for line in p.read_text().splitlines():
              if line.strip():
                r=json.loads(line)
                if str(r['raceId']) in targets:odds[str(r['raceId'])]=r
          state={'horse_hist':collections.defaultdict(lambda:collections.deque(maxlen=3)),'horse_starts':collections.Counter(),'jstats':collections.defaultdict(lambda:[0,0]),'tstats':collections.defaultdict(lambda:[0,0])}
          day=[];cur=None;answer={}
          def process(date,bundles):
            if date=='2026-08-09':
              for b in bundles:
                rid=str(b['race']['raceId'])
                if rid not in targets:continue
                active={int(x) for x in odds[rid]['horses']}
                raw=cmod.candidate_rows(state,b)
                raw=[t for t in raw if all(int(h) in active for h in t['horses'])]
                missing=[]
                for t in raw:
                  val=(odds[rid].get('officialOdds',{}).get(t['market']) or {}).get(t['combo'])
                  if val is None:missing.append({'betType':t['betType'],'market':t['market'],'combo':t['combo'],'horses':t['horses']})
                answer[rid]={'candidateCount':len(raw),'activeHorses':sorted(active),'missing':missing}
            cmod.dmod.update_state_for_date(state,bundles)
          with Path('input/history/ten-year-history-corpus.jsonl').open() as fh:
            for line in fh:
              if not line.strip():continue
              b=json.loads(line);date=str(b['race']['raceDate'])
              if cur is None:cur=date
              if date!=cur:
                process(cur,day);day=[];cur=date
                if date>'2026-08-09':break
              day.append(b)
          if day and cur<='2026-08-09':process(cur,day)
          Path('diagnosis.json').write_text(json.dumps(answer,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(answer,ensure_ascii=False))
          assert sum(len(x['missing']) for x in answer.values())>=1,answer
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-last-market-odds-gap-diagnosis
          path: diagnosis.json
          retention-days: 14
      - name: Mark diagnosis success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/last-market-odds-gap-diagnosis' \
            -f description='Last active-candidate official-odds gap identified' -f target_url="$STATUS_TARGET_URL" >/dev/null
