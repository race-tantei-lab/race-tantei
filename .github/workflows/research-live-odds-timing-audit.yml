name: Research live odds timing audit

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - "scripts/research-live-odds-timing-audit.py"
      - ".github/workflows/research-live-odds-timing-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark audit pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/live-odds-timing' \
            -f description='Comparing prestart and final win odds' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only timing audit
        run: python scripts/research-live-odds-timing-audit.py | tee research-live-odds-timing.log
      - name: Upload timing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-live-odds-timing-audit
          path: |
            analysis-results/research-live-odds-timing-audit.json
            research-live-odds-timing.log
          if-no-files-found: error
          retention-days: 30
      - name: Mark audit success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/live-odds-timing' \
            -f description='Prestart versus final odds audit completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark audit failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/live-odds-timing' \
            -f description='Prestart versus final odds audit failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
