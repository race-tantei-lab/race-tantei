name: Export August 9 final model input
run-name: Export Aug 9 final input · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-aug9-final-input.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-aug9-final-input
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export model inputs
        shell: bash
        run: |
          mkdir -p analysis-results
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id AS raceId,race_date AS raceDate,venue,race_no AS raceNo,race_name AS raceName,start_time_jst AS startTimeJst,surface,distance_m AS distanceM,conditions,direction,weather,track_condition AS trackCondition,status FROM rt_races WHERE race_date IN ('2026-08-08','2026-08-09') ORDER BY race_date,venue,race_no" > analysis-results/final-aug9-races.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id AS raceId,horse_no AS horseNo,frame_no AS frameNo,horse_name AS horseName,sex_age AS sexAge,jockey,assigned_weight AS assignedWeight,trainer,stable,horse_weight AS horseWeight,win_odds AS winOdds,popularity,runner_status AS runnerStatus FROM rt_runners WHERE race_id LIKE '2026-08-08-%' OR race_id LIKE '2026-08-09-%' ORDER BY race_id,horse_no" > analysis-results/final-aug9-runners.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id AS raceId,horse_no AS horseNo,finish_position AS finishPosition,final3f,result_status AS resultStatus FROM rt_results WHERE race_id LIKE '2026-08-08-%' ORDER BY race_id,horse_no" > analysis-results/final-aug8-results.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT bet_type AS betType,COUNT(DISTINCT race_id) AS races,COUNT(*) AS rows,MAX(captured_at_utc) AS latest FROM rt_official_odds_latest WHERE race_id LIKE '2026-08-09-%' GROUP BY bet_type ORDER BY bet_type" > analysis-results/final-aug9-odds-coverage.json
      - name: Save exports
        shell: bash
        run: |
          git add -f analysis-results/final-aug9-races.json analysis-results/final-aug9-runners.json analysis-results/final-aug8-results.json analysis-results/final-aug9-odds-coverage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save August 9 final model inputs'
          git pull --rebase origin main
          git push origin HEAD:main
