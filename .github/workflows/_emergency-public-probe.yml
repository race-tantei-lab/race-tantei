name: Emergency public endpoint probe
on:
  push:
    branches: [fix/cancelled-race-active-count-verifiers]
    paths: [".github/workflows/_emergency-public-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production public endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          today=$(TZ=Asia/Tokyo date +%F)
          for path in "/" "/races/" "/api/public/day?date=$today" "/api/public/calendar" "/api/public/today-summary" "/api/public/daily-performance?date=$today"; do
            echo "=== $path ==="
            code=$(curl -L --connect-timeout 5 --max-time 30 -sS -D /tmp/h -o /tmp/b -w '%{http_code} %{time_total} %{size_download}' "$base$path" || true)
            echo "RESULT $code"
            echo 'HEADERS'
            sed -n '1,40p' /tmp/h
            echo 'BODY_HEAD'
            head -c 5000 /tmp/b || true
            echo
          done
          curl -L --connect-timeout 5 --max-time 30 -sS "$base/" -o /tmp/home.html
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('/tmp/home.html').read_text(encoding='utf-8')
          print('=== LOADING/ERROR TEXT MATCHES ===')
          for pat in ['読み込','取得でき','レース情報','読み込み','api/public/day','fetch(']:
              print(pat, [m.start() for m in re.finditer(re.escape(pat), html)][:30])
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          print('SCRIPT_COUNT',len(scripts))
          for i,s in enumerate(scripts):
              path=pathlib.Path(f'/tmp/script-{i}.js')
              path.write_text(s,encoding='utf-8')
              print('SCRIPT',i,'bytes',len(s))
          PY
          for f in /tmp/script-*.js; do
            echo "CHECK $f"
            node --check "$f"
          done
