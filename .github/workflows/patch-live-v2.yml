name: Patch live v2 strict types

on:
  push:
    branches: [complete-live-v2]
    paths:
      - '.github/workflows/patch-live-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-live-v2
      - name: Fix strict optional access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/v1/jra.ts')
          s = p.read_text()
          old = 'const frameNo = frameAlt ? Number(frameAlt) : (nums.length >= 2 && nums[0] <= 8 ? nums[0] : null);'
          new = 'const firstFrame = nums[0] ?? null;\n    const frameNo = frameAlt ? Number(frameAlt) : (nums.length >= 2 && firstFrame !== null && firstFrame <= 8 ? firstFrame : null);'
          if old not in s:
              raise SystemExit('frame anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/patch-live-v2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict frame number typing"
          git push origin HEAD:complete-live-v2
