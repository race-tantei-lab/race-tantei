name: Diagnose current JRA result links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-current-jra-result-links.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch entries and print result links
        run: |
          python - <<'PY'
          import datetime as dt,html,importlib.util,json,pathlib,re,sys,urllib.parse,urllib.request
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('d',p);m=importlib.util.module_from_spec(s);sys.modules['d']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          rows=m.d1_query('''SELECT DISTINCT r.race_id AS raceId,r.entry_url AS entryUrl
                              FROM rt_races r JOIN rt_public_bets b ON b.race_id=r.race_id
                              WHERE r.race_date=? AND r.status='finished' ORDER BY r.start_time_utc''',[date])
          def cname(url):
              return (urllib.parse.parse_qs(urllib.parse.urlsplit(url).query).get('CNAME') or [''])[0]
          for row in rows:
              url=str(row['entryUrl'])
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja-JP,ja;q=0.9','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  raw=resp.read(4_000_000); ctype=resp.headers.get('content-type',''); final=resp.geturl()
              text=m.decode_body(raw,ctype)
              links=[]
              for x in re.findall(r'href=["\']([^"\']*accessS\.html[^"\']*)["\']',text,re.I):
                  try:
                      href=urllib.parse.urljoin(final,html.unescape(x))
                      links.append({'url':href,'cname':cname(href)})
                  except Exception: pass
              print('ENTRY_RESULT_LINKS='+json.dumps({'raceId':row['raceId'],'entryUrl':url,'final':final,'entryCname':cname(final),'linkCount':len(links),'links':links[:60]},ensure_ascii=False))
          PY
