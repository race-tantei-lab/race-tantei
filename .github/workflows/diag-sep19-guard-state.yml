name: Diagnose Sep 19 guard state from export
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/diag-sep19-guard-state.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Export state only
        shell: bash
        run: |
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_system_state --output /tmp/state.sql
          sqlite3 /tmp/state.db < /tmp/state.sql
      - name: Print live guard state
        shell: bash
        run: |
          echo '=== GUARD_STATES ==='
          sqlite3 -json /tmp/state.db "
            SELECT state_key,state_value,updated_at
            FROM rt_system_state
            WHERE state_key IN (
              'live_deadline_driver:2026-09-19',
              'worker_live_lock:2026-09-19',
              'worker_deadline_guard:2026-09-19',
              'live_deadline_sla:2026-09-19',
              'live_deadline_lease_skip:2026-09-19',
              'live_deadline_primary_heartbeat:v1'
            )
            ORDER BY state_key;"
          echo '=== NAKAYAMA2_PREVIEW ==='
          sqlite3 -json /tmp/state.db "
            SELECT state_key,state_value,updated_at FROM rt_system_state
            WHERE state_key='worker_live_preview:2026-09-19-nakayama-02';"
          echo '=== NAKAYAMA7_PREVIEW ==='
          sqlite3 -json /tmp/state.db "
            SELECT state_key,state_value,updated_at FROM rt_system_state
            WHERE state_key='worker_live_preview:2026-09-19-nakayama-07';"
