name: Apply JRA odds budget hardening

on:
  push:
    branches:
      - hardening/live-lock-v35
    paths:
      - "scripts/harden-jra-odds-budget-round3.py"
      - ".github/workflows/apply-jra-odds-budget-round3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-jra-odds-budget-round3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/live-lock-v35
          fetch-depth: 0
      - name: Apply deterministic transform
        run: python scripts/harden-jra-odds-budget-round3.py
      - name: Commit JRA odds budget hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v1/jra-official-odds-fetch.ts src/v1/jra-official-odds.ts
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m 'Bound JRA odds acquisition time per race'
          git push origin HEAD:hardening/live-lock-v35
