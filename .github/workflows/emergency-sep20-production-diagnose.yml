name: Emergency Sep20 Production Diagnose

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep20-production-diagnose.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Inspect and nudge production
        shell: bash
        run: |
          set -euo pipefail
          DATE=2026-09-20
          BASE=https://race-tantei-phase0.race-tantei.workers.dev
          d1() {
            npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$1"
          }
          mkdir -p ops

          d1 "SELECT venue,COUNT(*) AS races,SUM(CASE WHEN entry_url IS NOT NULL AND TRIM(entry_url)<>'' THEN 1 ELSE 0 END) AS entryUrls,MIN((SELECT COUNT(*) FROM rt_runners rr WHERE rr.race_id=r.race_id AND COALESCE(rr.runner_status,'active')='active')) AS minActive FROM rt_races r WHERE race_date='$DATE' GROUP BY venue ORDER BY venue" > /tmp/program.json

          d1 "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('final_daily_selection:$DATE','live_deadline_driver:$DATE','completed_worker_live_lock:$DATE','completed_worker_deadline_guard:$DATE','live_deadline_priority_guard_success:$DATE') ORDER BY state_key" > /tmp/state-before.json

          has_selection=$(python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/state-before.json')); rows=[]
          for b in raw if isinstance(raw,list) else [raw]:
              if isinstance(b,dict): rows += b.get('results') or []
          print(1 if any(r.get('state_key')=='final_daily_selection:2026-09-20' and r.get('state_value') for r in rows) else 0)
          PY
          )

          if [ "$has_selection" != 1 ]; then
            npx wrangler deploy --config wrangler.live-deadline.jsonc > /tmp/deploy-primary.txt 2>&1 || true
            npx wrangler deploy --config wrangler.live-deadline-backup.jsonc > /tmp/deploy-backup.txt 2>&1 || true
            for i in $(seq 1 18); do
              sleep 10
              d1 "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('final_daily_selection:$DATE','live_deadline_driver:$DATE','completed_worker_live_lock:$DATE','completed_worker_deadline_guard:$DATE','live_deadline_priority_guard_success:$DATE') ORDER BY state_key" > /tmp/state-after.json
              ready=$(python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/state-after.json')); rows=[]
          for b in raw if isinstance(raw,list) else [raw]:
              if isinstance(b,dict): rows += b.get('results') or []
          print(1 if any(r.get('state_key')=='final_daily_selection:2026-09-20' and r.get('state_value') for r in rows) else 0)
          PY
              )
              if [ "$ready" = 1 ]; then break; fi
            done
          else
            cp /tmp/state-before.json /tmp/state-after.json
          fi

          d1 "WITH s AS (SELECT state_value FROM rt_system_state WHERE state_key='final_daily_selection:$DATE' LIMIT 1), selected AS (SELECT json_extract(j.value,'$.raceId') AS raceId,json_extract(j.value,'$.venue') AS venue,json_extract(j.value,'$.raceNo') AS raceNo FROM s,json_each(json_extract(s.state_value,'$.selected')) j) SELECT x.venue,x.raceNo,x.raceId,r.start_time_utc AS startTimeUtc,(SELECT COUNT(*) FROM rt_runners rr WHERE rr.race_id=x.raceId AND COALESCE(rr.runner_status,'active')='active') AS activeRunners,(SELECT COUNT(*) FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||x.raceId) AS previewState,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=x.raceId) AS finalRows FROM selected x JOIN rt_races r ON r.race_id=x.raceId ORDER BY r.start_time_utc" > /tmp/selected.json || echo '[]' > /tmp/selected.json

          for worker in race-tantei-phase0 race-tantei-live-deadline race-tantei-live-deadline-backup race-tantei-win5 race-tantei-win5-backup; do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/schedules" > "/tmp/cron-$worker.json" || true
          done

          for nameurl in "day|$BASE/api/public/day?date=$DATE" "summary|$BASE/api/public/today-summary" "home|$BASE/" "live_primary|https://race-tantei-live-deadline.race-tantei.workers.dev/health" "live_backup|https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health" "win5_primary|https://race-tantei-win5.race-tantei.workers.dev/health" "win5_backup|https://race-tantei-win5-backup.race-tantei.workers.dev/health"; do
            n=${nameurl%%|*}; u=${nameurl#*|}
            curl --retry 2 --retry-delay 2 --max-time 20 -sS -o "/tmp/$n.body" -w '%{http_code}' "$u" > "/tmp/$n.code" || true
          done

          python3 - <<'PY'
          import json, pathlib
          def load(path, default=None):
              try: return json.load(open(path,encoding='utf-8'))
              except Exception: return default
          def rows(path):
              raw=load(path,[])
              out=[]
              for b in raw if isinstance(raw,list) else [raw]:
                  if isinstance(b,dict): out += b.get('results') or []
              return out
          state=rows('/tmp/state-after.json')
          selrow=next((r for r in state if r.get('state_key')=='final_daily_selection:2026-09-20'),None)
          sel=None
          if selrow and selrow.get('state_value'):
              try: sel=json.loads(selrow['state_value'])
              except Exception: sel={'parseError':True,'raw':selrow['state_value'][:500]}
          http={}
          for n in ['day','summary','home','live_primary','live_backup','win5_primary','win5_backup']:
              p=pathlib.Path(f'/tmp/{n}.body')
              body=p.read_text(errors='replace') if p.exists() else ''
              try: parsed=json.loads(body)
              except Exception: parsed=None
              c=pathlib.Path(f'/tmp/{n}.code')
              http[n]={'code':c.read_text().strip() if c.exists() else '', 'json':parsed, 'bodySnippet':body[:4000]}
          crons={}
          for n in ['race-tantei-phase0','race-tantei-live-deadline','race-tantei-live-deadline-backup','race-tantei-win5','race-tantei-win5-backup']:
              crons[n]=load(f'/tmp/cron-{n}.json',{})
          report={'program':rows('/tmp/program.json'),'systemState':state,'selection':sel,'selectedRaceAudit':rows('/tmp/selected.json'),'crons':crons,'http':http}
          pathlib.Path('ops/sep20-emergency-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'program':report['program'],'selectionSummary':None if not sel else {'sourceModel':sel.get('sourceModel'),'selectionMode':sel.get('selectionMode'),'selectedCount':len(sel.get('selected') or []),'venueCounts':sel.get('venueCounts'),'selectedVenueCounts':sel.get('selectedVenueCounts')},'selectedRaceAudit':report['selectedRaceAudit'],'httpCodes':{k:v['code'] for k,v in http.items()}},ensure_ascii=False,indent=2))
          PY

      - name: Persist emergency report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-emergency-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: capture Sep 20 production emergency state"
          git pull --rebase origin main
          git push origin HEAD:main
