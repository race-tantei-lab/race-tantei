name: Emergency finalize Sapporo 7R before start

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-sapporo6-final-now.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Promote latest valid Sapporo 7R preview to final before start
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def call(sql,params=None):
              body=json.dumps({'sql':sql,'params':params or []}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
              if not payload.get('success'): raise RuntimeError(payload.get('errors'))
              return payload.get('result',[{}])[0].get('results',[])
          rid='2026-08-16-sapporo-07'
          race=call('SELECT race_id,start_time_utc,start_time_jst FROM rt_races WHERE race_id=? LIMIT 1',[rid])
          if not race: raise RuntimeError('RACE_NOT_FOUND')
          now=dt.datetime.now(dt.timezone.utc)
          start=dt.datetime.fromisoformat(str(race[0]['start_time_utc']).replace('Z','+00:00'))
          if now>=start: raise RuntimeError(f'REFUSE_POST_START:{now.isoformat()}:{start.isoformat()}')
          bets=call('SELECT course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id,settlement_status FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination',[rid])
          if len(bets)==6 and all(int(x.get('source_prediction_id') or 0)==-2 for x in bets):
              print('ALREADY_FINAL='+json.dumps({'race':race[0],'bets':bets},ensure_ascii=False)); raise SystemExit(0)
          rows=call('SELECT state_value,updated_at FROM rt_system_state WHERE state_key=? LIMIT 1',[f'worker_live_preview:{rid}'])
          if not rows: raise RuntimeError('PREVIEW_MISSING')
          env=json.loads(rows[0]['state_value'])
          snaps=env.get('snapshots') or []
          if not snaps: raise RuntimeError('PREVIEW_EMPTY')
          snap=snaps[0]
          course_bets=snap.get('courseBets') or []
          tickets=snap.get('tickets') or []
          if len(course_bets)!=6 or len(tickets)!=2 or len({str(x.get('betType')) for x in tickets})!=2:
              raise RuntimeError('PREVIEW_INVALID')
          locked=now.isoformat().replace('+00:00','Z')
          call("DELETE FROM rt_public_bets WHERE race_id=? AND source_prediction_id=-2 AND settlement_status='pending'",[rid])
          for b in course_bets:
              call("INSERT INTO rt_public_bets(race_id,course,bet_type,combination,stake_yen,assumed_odds,return_yen,settlement_status,locked_at,source_prediction_id) VALUES(?,?,?,?,?,?,NULL,'pending',?,-2)",[rid,str(b['course']),str(b['betType']),str(b['combination']),int(b['stakeYen']),round(float(b['assumedOdds']),6),locked])
          final={
            'status':'locked','raceId':rid,'lockedAt':locked,'finalizedFrom':'manual_prestart_recovery',
            'sourceModel':snap.get('sourceModel'),'modelSha256':snap.get('modelSha256'),'previewGeneratedAt':snap.get('generatedAt'),
            'bodyWeightApplied':bool(snap.get('bodyWeightApplied')),'bodyWeightFetchedAt':(snap.get('bodyWeightSnapshot') or {}).get('fetchedAt'),
            'bodyWeightSource':(snap.get('bodyWeightSnapshot') or {}).get('sourceUrl'),'bodyWeightSnapshotSha256':(snap.get('bodyWeightSnapshot') or {}).get('snapshotSha256'),
            'bodyWeights':(snap.get('bodyWeightSnapshot') or {}).get('activeRunners'),'bodyWeightError':snap.get('bodyWeightError'),
            'oddsFetchedAt':snap.get('oddsFetchedAt'),'oddsSource':snap.get('oddsSource'),'oddsSnapshotSha256':snap.get('oddsSnapshotSha256'),
            'onlineLearning':snap.get('onlineLearning'),'runnerRecencyFactors':snap.get('runnerRecencyFactors'),'tickets':tickets,
            'recoveryReason':'system failed to finalize by scheduled cutoff; user requested pre-start recovery'
          }
          call("INSERT INTO rt_system_state(state_key,state_value,updated_at) VALUES(?,?,CURRENT_TIMESTAMP) ON CONFLICT(state_key) DO UPDATE SET state_value=excluded.state_value,updated_at=CURRENT_TIMESTAMP",[f'worker_live_final:{rid}',json.dumps(final,ensure_ascii=False,separators=(',',':'))])
          saved=call('SELECT course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id,settlement_status FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type,combination',[rid])
          if len(saved)!=6 or any(int(x.get('source_prediction_id') or 0)!=-2 for x in saved): raise RuntimeError('POST_WRITE_VERIFY_FAILED')
          print('SAPPORO7_EMERGENCY_FINAL_OK='+json.dumps({'race':race[0],'previewGeneratedAt':snap.get('generatedAt'),'oddsFetchedAt':snap.get('oddsFetchedAt'),'oddsSource':snap.get('oddsSource'),'tickets':tickets,'bets':saved},ensure_ascii=False,separators=(',',':')))
          PY
