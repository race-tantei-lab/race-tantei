name: Research canonical official-quote cash model same-source baseline (isolated)
on:
  push:
    branches:
      - research/nov2026-canonical-cash-direct-1112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-financial:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical research package
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Assert canonical cash arithmetic
        run: |
          python -m py_compile scripts/research-nov2026-canonical-cash-direct.py
          python -u scripts/research-nov2026-canonical-cash-direct.py --self-test
      - name: Same-source official-quote canonical retrospective research
        run: python -u scripts/research-nov2026-canonical-cash-direct.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-direct-financial-comparable-ledger
          path: |
            analysis-results/nov2026-canonical-direct-money-allocator.json
            analysis-results/nov2026-canonical-direct-money-allocator-bets.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
