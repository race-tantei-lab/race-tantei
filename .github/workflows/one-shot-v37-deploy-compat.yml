name: Finalize v37 deployment compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-v37-deploy-compat.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update deployment guards and canonical manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          safety = Path('scripts/verify-live-lock-safety.py')
          text = safety.read_text(encoding='utf-8')
          old = 'if public_wrangler.get("main") != "src/public-site-entry-v34.ts":'
          new = 'if public_wrangler.get("main") != "src/public-site-entry-v37.ts":'
          if old not in text and new not in text:
              raise SystemExit('public entry guard marker not found')
          safety.write_text(text.replace(old, new), encoding='utf-8')

          manifest_path = Path('config/canonical-production-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['asOfJst'] = '2026-08-30T18:20:00+09:00'
          manifest['site']['entry'] = 'src/public-site-entry-v37.ts'
          manifest['site']['revision'] = 'ten-year-completed-public-v37-canonical-home-roi-20260830'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entry = Path('src/public-site-entry-v37.ts')
          src = entry.read_text(encoding='utf-8')
          marker = '    const url = new URL(request.url);\n'
          addition = '    if (url.pathname === "/_ops/live-tick") return new Response("NOT_FOUND", { status: 404 });\n'
          if addition not in src:
              if marker not in src:
                  raise SystemExit('v37 URL marker not found')
              src = src.replace(marker, marker + addition, 1)
              entry.write_text(src, encoding='utf-8')
          PY
      - name: Persist and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-live-lock-safety.py config/canonical-production-manifest.json src/public-site-entry-v37.ts
          git rm .github/workflows/one-shot-v37-deploy-compat.yml
          git commit -m 'fix: align v37 deployment guards and manifest'
          git pull --rebase origin main
          git push origin HEAD:main
