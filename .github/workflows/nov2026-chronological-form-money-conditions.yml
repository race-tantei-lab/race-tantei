name: Search actual ROI200 horse-form cash conditions, select only useful cells
on:
  push:
    branches:
      - research/nov2026-subset-roi-selective-search
    paths:
      - scripts/research-nov2026-chronological-form-money-conditions.py
      - .github/workflows/nov2026-chronological-form-money-conditions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-money-horse-form:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned financial discovery environment
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'lightgbm==4.6.0' 'scikit-learn==1.6.1'
      - uses: actions/cache@v4
        with:
          path: |
            analysis-results/roi200-public-2024-26-categories-v1.npz
            analysis-results/roi200-public-2024-26-categories-v1.json
          key: frozen-third-party-sixmarket-sevenhorse-source-v1
      - name: Check immutable six market 2024-2026 true paid-yen candidates
        run: |
          test -s analysis-results/roi200-public-2024-26-categories-v1.npz
          test -s analysis-results/roi200-public-2024-26-categories-v1.json
      - name: Validate new chronological horse-form condition feature matrix
        run: |
          python -m py_compile scripts/research-nov2026-chronological-form-money-conditions.py
          python -u scripts/research-nov2026-chronological-form-money-conditions.py --self-test
      - name: Download unchanged public 2024-2026 actual paid six markets, not production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-archive
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          for year in 2024 2025; do
            for m in $(seq -w 1 12); do
              target="raceresults_$year$m.csv"
              curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
            done
          done
          for m in 01 02 03; do
            target="raceresults_2026$m.csv"
            curl -fsSL --retry 2 --max-time 35 -o "external-jra-cash-archive/$target" "$URL/$target"
          done
          test "$(find external-jra-cash-archive -name '*.csv' | wc -l)" -eq 27
      - name: Search pre-result horse form historic 200pc actual cash payout rules then frozen 2026 validation
        run: python -u scripts/research-nov2026-chronological-form-money-conditions.py
      - name: Archive actual paid ROI summary only, no production deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-result-horse-form-selective-roi200-real-cash
          path: analysis-results/nov2026-chronological-form-roi200-condition-shortlists.json
          if-no-files-found: warn
          retention-days: 30
