name: Walk-forward training pump

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: walk-forward-training-pump
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUMP_REVISION: "2026-09-05-free-tier-manual-only"
    steps:
      - name: Advance training or calibration manually
        shell: bash
        env:
          STATUS_URL: https://race-tantei-phase0.race-tantei.workers.dev/api/training/walk-forward/status
          TRAINING_URL: https://race-tantei-phase0.race-tantei.workers.dev/api/training/walk-forward/step
          CALIBRATION_URL: https://race-tantei-phase0.race-tantei.workers.dev/api/training/walk-forward/calibration-step
          TRAINING_HEADER: walk-forward-12m-v1
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          curl --fail --silent --show-error --max-time 30 "$STATUS_URL" > "$status_file"
          training_complete="$(jq -r '.training.complete // false' "$status_file")"
          calibration_phase="$(jq -r '.calibration.phase // "waiting-data"' "$status_file")"
          echo "training_complete=$training_complete calibration_phase=$calibration_phase"
          if [[ "$training_complete" == "true" && "$calibration_phase" == "complete" ]]; then exit 0; fi
          if [[ "$training_complete" == "true" ]]; then target="$CALIBRATION_URL"; else target="$TRAINING_URL"; fi
          curl --fail --silent --show-error --max-time 45 -X POST -H "x-race-training: $TRAINING_HEADER" "$target"
