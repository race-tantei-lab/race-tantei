name: Audit actual independent models historical cash ROI (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only research audit
        run: |
          python3 -m py_compile scripts/audit-independent-roi-history-20261115.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/audit-independent-roi-history-20261115.py').read_text()
          for dangerous in ('INSERT INTO','UPDATE rt_','DELETE FROM','DROP TABLE'):
            assert dangerous not in s, dangerous
          print('INDEPENDENT_ROI_READONLY_GATE_OK')
          PY
      - name: Compute actual 6m/96m returns and historical data availability
        run: python3 scripts/audit-independent-roi-history-20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-6m-96m-roi-history-audit
          path: analysis-results/independent-roi-actual-coverage-20261115.json
          if-no-files-found: warn
          retention-days: 30
