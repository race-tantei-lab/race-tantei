name: Research full-live ROI stake walk-forward (read-only)

on:
  push:
    branches: [research/live-roi-forward-stake-test-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify payout-scaled identical-ticket portfolios locally
        run: python3 scripts/research-live-stake-walkforward-20261107.py --self-test
      - name: Compare all real pre-T15 settled race stakes in chronological holdout (D1 SELECT only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python3 scripts/research-live-stake-walkforward-20261107.py
