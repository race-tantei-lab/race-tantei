name: V14 Guard First Branch Verify
# rerun after verifier alignment

on:
  push:
    branches: [fix/cpu-safe-deadline-guard-v14]
    paths:
      - ".github/workflows/v14-branch-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck
      - run: python3 scripts/verify-live-lock-safety.py
      - run: python3 scripts/verify-bodyweight-final-lock.py
      - run: python3 scripts/verify-live-preview-priority.py
      - run: python3 scripts/verify-live-hardening-policy.py
      - run: python3 scripts/verify-canonical-handoff.py
      - run: npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
      - run: npx --yes tsx tests/race-day-gate-tests.ts
      - run: npx wrangler deploy --dry-run --config wrangler.live-deadline.jsonc --outdir dist-v14-primary
      - run: npx wrangler deploy --dry-run --config wrangler.live-deadline-backup.jsonc --outdir dist-v14-backup
