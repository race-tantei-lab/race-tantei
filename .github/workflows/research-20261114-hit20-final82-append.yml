name: Research strict cash200 HIT20 portfolios final ALL 82 2026 venue-days JRA official
on:
  push:
    branches:
      - research/20261114-hit20-final82-completed-official
permissions:
  contents: read
  actions: read
jobs:
  final-82-day-cash-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1 beautifulsoup4==4.13.4
      - name: Download exact six historical ROI200 candidate portfolios
        uses: actions/download-artifact@v4
        with:
          name: whole-history-ROICASH200-HIT20-multiticket
          run-id: 43524969599
          github-token: ${{ github.token }}
          path: analysis-results
      - name: Download already-audited 81 eligible venue days
        uses: actions/download-artifact@v4
        with:
          name: hit20-robust-cash200-2026-aug-nov-all82-official-final
          run-id: 43526648704
          github-token: ${{ github.token }}
          path: analysis-results/forward-81-venue-days
      - name: Check immutable original six historical policies and previous 81-day cash
        run: |
          test -s analysis-results/20261114-full-period-roi200-hit20-multiticket.json
          test -s analysis-results/forward-81-venue-days/20261114-roi200-hit20-postaug-official-final-odds.json
          python -m py_compile scripts/research-20261114-hit20-final82-append-sep19.py
          python scripts/research-20261114-hit20-final82-append-sep19.py --self-test
          python scripts/research-20261114-public-results-six-payout-fallback.py --self-test
      - name: Load pinned all 136 pre-August cash historical months
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/whole_cash_months
          cat /tmp/whole_cash_months | xargs -P 8 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Read-only fully verified missing Sep19 Nakayama 12-race program and append to six variants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python -u scripts/research-20261114-hit20-final82-append-sep19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash200-hit20-final-all82-2026-aug-nov
          path: analysis-results/20261114-hit20-roi200-all82-venue-days-final.json
          if-no-files-found: warn
          retention-days: 30
