name: JRA all odds grouping diagnostic
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Print odds_list beginnings for all types with pacing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT entry_url AS entryUrl FROM rt_races WHERE race_date='2026-08-09' AND entry_url LIKE 'https://%/JRADB/accessD.html?%' AND status!='finished' ORDER BY start_time_utc DESC LIMIT 1" >/tmp/d1.json
          python - <<'PY' >/tmp/entry
          import json
          x=json.load(open('/tmp/d1.json')); rows=[]
          def w(v):
            if isinstance(v,dict):
              if isinstance(v.get('results'),list):rows.extend(v['results'])
              for z in v.values():w(z)
            elif isinstance(v,list):
              for z in v:w(z)
          w(x);print(next(r['entryUrl'] for r in rows if r.get('entryUrl')))
          PY
          entry="$(cat /tmp/entry)"; ua='Mozilla/5.0 Chrome/136 Safari/537.36'
          curl --retry 6 --retry-delay 2 --retry-all-errors -sSfL -A "$ua" -c /tmp/cj -b /tmp/cj "$entry" -o /tmp/e
          python - <<'PY' >/tmp/base
          import re,html
          s=open('/tmp/e','rb').read().decode('shift_jis',errors='ignore');xs=[html.unescape(x) for x in re.findall(r"doAction\(\s*['\"]\/JRADB\/accessO\.html['\"]\s*,\s*['\"]([^'\"]+)",s,re.I)];print(next(x for x in xs if x.startswith('pw151') and re.search(r'20\d{6}',x)))
          PY
          curl --retry 6 --retry-delay 2 --retry-all-errors -sSfL -A "$ua" -H 'Content-Type: application/x-www-form-urlencoded' -c /tmp/cj -b /tmp/cj --data-urlencode "cname=$(cat /tmp/base)" 'https://www.jra.go.jp/JRADB/accessO.html' -o /tmp/basepage
          python - <<'PY' >/tmp/actions
          import re,html
          s=open('/tmp/basepage','rb').read().decode('shift_jis',errors='ignore');xs=[html.unescape(x) for x in re.findall(r"doAction\(\s*['\"]\/JRADB\/accessO\.html['\"]\s*,\s*['\"]([^'\"]+)",s,re.I)]
          for p,l in [('154','馬連'),('155','ワイド'),('156','馬単'),('157','3連複'),('158','3連単')]:
            q=next(x for x in xs if x.startswith('pw'+p) and re.search(r'20\d{6}',x));print(l+'\t'+q)
          PY
          while IFS=$'\t' read -r label cname; do
            sleep 2
            curl --retry 6 --retry-delay 3 --retry-all-errors -sSfL -A "$ua" -H 'Content-Type: application/x-www-form-urlencoded' -c /tmp/cj -b /tmp/cj --data-urlencode "cname=${cname}" 'https://www.jra.go.jp/JRADB/accessO.html' -o /tmp/t
            LABEL="$label" python - <<'PY'
          import os,re
          s=open('/tmp/t','rb').read().decode('shift_jis',errors='ignore');m=re.search(r'<div id="odds_list"[\s\S]*',s,re.I)
          x=(m.group(0) if m else '')[:8000];x=re.sub(r'[\r\n\t]+',' ',x);x=re.sub(r'\s+',' ',x)
          print('GROUP',os.environ['LABEL'],x[:7000])
          PY
          done </tmp/actions
