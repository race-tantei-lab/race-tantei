name: Fixed race-tantei constraints

on:
  pull_request:
    paths:
      - "config/race-tantei-fixed-constraints.json"
      - "scripts/verify-race-tantei-fixed-constraints.py"
      - "scripts/analyze-v12-multi-course-upset.py"
      - "scripts/final-course-policy.py"
      - "scripts/run-final-course-production.py"
  push:
    branches: [main]
    paths:
      - "config/race-tantei-fixed-constraints.json"
      - "scripts/verify-race-tantei-fixed-constraints.py"
      - "scripts/analyze-v12-multi-course-upset.py"
      - "scripts/final-course-policy.py"
      - "scripts/run-final-course-production.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable project constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py
