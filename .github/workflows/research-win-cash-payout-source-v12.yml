name: Read-only actual JRA WIN cash-payout sample 2024-26 research
on:
  push:
    branches: [research/20261114-canonical-56feature-walkforward-v12]
    paths:
      - scripts/export-2024-26-win-cash-d1-readonly-v12.py
      - .github/workflows/research-win-cash-payout-source-v12.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export only 2024-2026 recorded real yen WIN payouts from D1
        run: |
          python -m py_compile scripts/export-2024-26-win-cash-d1-readonly-v12.py
          python -u scripts/export-2024-26-win-cash-d1-readonly-v12.py \
            --out /tmp/win-payouts-2024-2026.jsonl \
            --meta /tmp/win-payouts-2024-2026-meta.json
      - name: Store research-only true cash labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-win-payouts-2024-26-v12
          path: |
            /tmp/win-payouts-2024-2026.jsonl
            /tmp/win-payouts-2024-2026-meta.json
          if-no-files-found: warn
          retention-days: 14
