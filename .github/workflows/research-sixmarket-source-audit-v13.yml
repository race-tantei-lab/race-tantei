name: Research six-market D1 payout and odds schema (read-only)
on:
  push:
    branches: [research/20261114-sixmarket-56rolling-v13]
    paths: [.github/workflows/research-sixmarket-source-audit-v13.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only stored bet types and available historic odds sources
        run: |
          python - <<'PY'
          import os,json,urllib.request
          acc=os.environ['CLOUDFLARE_ACCOUNT_ID'];db=os.environ['CLOUDFLARE_D1_DATABASE_ID']
          url=f'https://api.cloudflare.com/client/v4/accounts/{acc}/d1/database/{db}/query'
          def read(sql):
              assert sql.upper().lstrip().startswith('SELECT ')
              req=urllib.request.Request(url,method='POST',
                data=json.dumps({'sql':sql,'params':[]}).encode(),
                headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as fh:j=json.load(fh)
              if not j.get('success'):raise RuntimeError(j.get('errors'))
              return (j.get('result') or [{}])[0].get('results',[])
          for key,sql in {
              'payout_market_counts':"SELECT bet_type, COUNT(*) AS n,COUNT(DISTINCT race_id) AS races, MIN(payout_yen) AS minPayout,MAX(payout_yen) AS maxPayout FROM rt_payouts GROUP BY bet_type ORDER BY n DESC",
              'all_odds_schema':"SELECT name,substr(sql,1,1800) AS schema FROM sqlite_master WHERE type='table' AND (name LIKE '%odd%' OR name LIKE '%snapshot%' OR name LIKE '%lock%') ORDER BY name LIMIT 30",
              'payout_sample':"SELECT race_id,bet_type,combination,payout_yen FROM rt_payouts WHERE race_id>='2026-01-01' AND race_id<'2026-01-05' LIMIT 22",
              'race_dates_sample':"SELECT race_id,race_date,venue FROM rt_races ORDER BY race_date DESC LIMIT 4"
          }.items():
              print('SIX_MARKET_SOURCE_SCHEMA',json.dumps({'key':key,'rows':read(sql)},ensure_ascii=False),flush=True)
          PY
