name: Priority bet generation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/priority-bet-generation-audit.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit today's 15 selected races and generated tickets
        run: |
          python - <<'PY'
          import datetime as dt,importlib.util,json,pathlib,sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('d1',p);m=importlib.util.module_from_spec(s);sys.modules['d1']=m;s.loader.exec_module(m)
          date=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          state=m.d1_query("SELECT state_value AS value FROM rt_system_state WHERE state_key=? LIMIT 1",[f'final_daily_selection:{date}'])
          if not state: raise RuntimeError('TODAY_SELECTION_NOT_FROZEN')
          payload=json.loads(str(state[0]['value'])); ids=[str(x['raceId']) for x in payload.get('selected',[])]
          if len(ids)!=15: raise RuntimeError(f'TODAY_SELECTION_COUNT_INVALID:{len(ids)}')
          ph=','.join('?' for _ in ids)
          rows=m.d1_query(f'''SELECT r.race_id AS raceId,r.venue,r.race_no AS raceNo,r.start_time_utc AS startTimeUtc,
                             COUNT(b.id) AS betRows,COUNT(DISTINCT b.course) AS courses,
                             COUNT(DISTINCT b.bet_type||':'||b.combination) AS distinctTickets
                             FROM rt_races r LEFT JOIN rt_public_bets b ON b.race_id=r.race_id
                             WHERE r.race_id IN ({ph}) GROUP BY r.race_id,r.venue,r.race_no,r.start_time_utc ORDER BY r.start_time_utc''',ids)
          result={'date':date,'selectedCount':len(ids),'generatedRaceCount':sum(1 for r in rows if int(r.get('betRows') or 0)>0),'rows':rows}
          result['missingRaceIds']=[str(r['raceId']) for r in rows if int(r.get('betRows') or 0)==0]
          print('PRIORITY_BET_AUDIT='+json.dumps(result,ensure_ascii=False))
          PY
