name: Research meta-selected late-year odds fast path

on:
  workflow_dispatch:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-meta-five-race-late-years-fast.yml"

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  DEMAND_ARTIFACT_ID: '9088428002'
  REUSE_ARTIFACT_ID: '9088437423'
  ORIGINAL_RUN_ID: '31456971683'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  fetch:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: ['2022','2023','2024','2025','2026']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mark fast path pending
        if: matrix.year == '2022'
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='research/meta-five-race-fast-source-clean' -f description='Parallel late-year official odds fetch and source-clean merge' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.4
      - name: Download audited missing-race demand
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEMAND_ARTIFACT_ID}/zip" > demand.zip
          unzip -q demand.zip -d input
          test -s input/missing-demand.jsonl
      - name: Fetch late-year missing official odds
        run: |
          python scripts/research-fetch-resolved-demanded-official-odds.py --input input/missing-demand.jsonl --year '${{ matrix.year }}' --workers 3 --out analysis-results/research-meta-fetched-odds-${{ matrix.year }}.jsonl --meta analysis-results/research-meta-fetched-odds-${{ matrix.year }}-meta.json
      - name: Require zero failures
        run: |
          python - <<'PY'
          import json,glob
          m=json.load(open(glob.glob('analysis-results/*-meta.json')[0]))
          assert not m['failures'],m['failures'][:10]
          assert m['completedRaces']==m['inputDemandRaces'],m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps({'year':m['year'],'input':m['inputDemandRaces'],'completed':m['completedRaces'],'coverage':m['coverage']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-fast-meta-fetched-odds-${{ matrix.year }}
          path: |
            analysis-results/research-meta-fetched-odds-${{ matrix.year }}.jsonl
            analysis-results/research-meta-fetched-odds-${{ matrix.year }}-meta.json
          retention-days: 30

  merge:
    if: always()
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download reuse input
        run: |
          mkdir -p input/reuse input/fetched
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REUSE_ARTIFACT_ID}/zip" > reuse.zip
          unzip -q reuse.zip -d input/reuse
          test -s input/reuse/reused-odds.jsonl
      - uses: actions/download-artifact@v4
        with:
          pattern: research-fast-meta-fetched-odds-20*
          path: input/fetched
          merge-multiple: true
      - name: Wait for and download original 2016-2021 successful fetch artifacts
        run: |
          set -euo pipefail
          for y in 2016 2017 2018 2019 2020 2021; do
            id=''
            for i in $(seq 1 600); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}/artifacts?per_page=100" > orig.json
              id=$(jq -r --arg n "research-meta-fetched-odds-${y}" '.artifacts[] | select(.name==$n and .expired==false) | .id' orig.json | head -n1)
              if [ -n "$id" ] && [ "$id" != null ]; then break; fi
              sleep 10
            done
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "orig-${y}.zip"
            unzip -q "orig-${y}.zip" -d input/fetched
          done
          test $(find input/fetched -name 'research-meta-fetched-odds-20*.jsonl' | wc -l) -eq 11
      - name: Merge and audit fast exact 14,410 source-clean corpus
        run: |
          python scripts/research-merge-meta-market-odds.py --selection input/reuse/meta-five-race-demand.jsonl --reused input/reuse/reused-odds.jsonl --fetched-dir input/fetched --out-dir analysis-results/meta-market-odds --meta analysis-results/meta-market-odds-meta.json
      - name: Require exact identity-clean corpus
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis-results/meta-market-odds-meta.json'))
          assert d['mergedOddsRaces']==14410,d
          assert not d['missingRaceIds'],d['missingRaceIds'][:20]
          assert not d['identityMismatchRows'],d['identityMismatchRows'][:20]
          assert not d['syntheticOddsRaceIds'],d['syntheticOddsRaceIds'][:20]
          assert d['productionDatabaseWritten'] is False,d
          print(json.dumps({'merged':d['mergedOddsRaces'],'sources':d['sourceCounts'],'byYear':d['byYear']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-meta-market-source-clean-fast
          path: |
            analysis-results/meta-market-odds/*.jsonl
            analysis-results/meta-market-odds-meta.json
          retention-days: 30
          compression-level: 9
      - name: Mark fast path success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='research/meta-five-race-fast-source-clean' -f description='Fast 14,410 source-clean official odds corpus completed' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark fast path failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='research/meta-five-race-fast-source-clean' -f description='Fast source-clean odds path needs targeted repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
