name: Patch stable JRA signatures v2

on:
  push:
    branches: [complete-live-v2]
    paths:
      - '.github/workflows/patch-signature-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-live-v2
      - name: Patch signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/v1/jra.ts')
          s = p.read_text()
          s = s.replace(
            'return /出馬表/.test(text) && /20\\d{2}年/.test(text) && /(?:札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉)/.test(text) && /<table\\b/i.test(html);',
            'return /出馬表/.test(text) && /<table\\b/i.test(html);'
          )
          s = s.replace(
            'return /レース結果/.test(text) && /20\\d{2}年/.test(text) && /<table\\b/i.test(html);',
            'return /レース結果/.test(text) && /<table\\b/i.test(html);'
          )
          p.write_text(s)
          PY
          rm -f .github/workflows/patch-signature-2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: detect JRA pages before dynamic race metadata"
          git push origin HEAD:complete-live-v2
