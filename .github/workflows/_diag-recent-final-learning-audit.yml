name: Recent final learning audit
on:
  push:
    branches:
      - diag/recent-final-learning-audit-20260922
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit recent final snapshots
        shell: bash
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "
            SELECT state_key AS stateKey,state_value AS value,updated_at AS updatedAt
            FROM rt_system_state
            WHERE state_key LIKE 'worker_live_final:2026-09-19-%'
               OR state_key LIKE 'worker_live_final:2026-09-20-%'
               OR state_key LIKE 'worker_live_final:2026-09-21-%'
               OR state_key LIKE 'worker_live_final:2026-09-22-%'
            ORDER BY state_key
          " >/tmp/finals.json
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/finals.json','utf8'));
          const rows=(Array.isArray(raw)?raw:[raw]).flatMap(x=>x.results||[]);
          for(const r of rows){
            let v={}; try{v=JSON.parse(r.value||'{}')}catch{}
            const learn=v.onlineLearning||v.learning||v.recencyLearning||{};
            const audit=learn.audit||{};
            const tickets=(v.tickets||[]).map(x=>({betType:x.betType,combination:x.combination,score:x.score,odds:x.odds}));
            console.log(JSON.stringify({
              stateKey:r.stateKey,updatedAt:r.updatedAt,
              generatedAt:v.generatedAt,finalizedFrom:v.finalizedFrom,
              learningStatus:audit.status,learningError:audit.error,
              runnerHistoryRaces:audit.runnerHistoryRaces,
              betHistoryRaces:audit.betHistoryRaces,
              sameDayFinishedRaces:audit.sameDayFinishedRaces,
              tickets
            }));
          }
          console.log('FINAL_COUNT',rows.length);
          NODE
