name: Validate normal T15 atomic root fix v3
on:
  push:
    branches: [fix/normal-t15-atomic-v2-20260816]
    paths: [".github/workflows/run-normal-t15-atomic-root-v3.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/normal-t15-atomic-v2-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply root patch and new verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/apply-normal-t15-atomic-root.yml').read_text(encoding='utf-8')
          start=wf.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=wf.index("\n          PY\n      - name: Validate root fix",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[start:end].splitlines())
          code=code.replace("'''.replace(/^          /gm,''),encoding='utf-8')","''',encoding='utf-8')")
          exec(compile(code,'root-patch','exec'),{'__name__':'__main__'})

          p=Path('scripts/verify-live-lock-safety.py')
          text=p.read_text(encoding='utf-8')
          a=text.index('    guard = read("src/v1/completed-worker-deadline-guard.ts")')
          b=text.index('    production_wrapper = read("src/public-site-entry-v29.ts")',a)
          block='''    guard = read("src/v1/completed-worker-deadline-guard.ts")\n    for needle in (\n        "export const DEADLINE_GUARD_MS = 15 * 60 * 1000;",\n        "remainingMs > 0 && remainingMs <= DEADLINE_GUARD_MS",\n        "orderSelectedRaceIds",\n        "start_time_utc AS startTimeUtc",\n        'snapshot.oddsSource!=="jra-fast-official" && snapshot.oddsSource!=="jra-crawl-official"',\n        'finalizedFrom:"persistent_official_deadline_guard"',\n        "await db.batch(statements)",\n        "for (const raceId of ids)",\n        "ensureCompletedRaceFinalAtDeadline",\n        "DEADLINE_GUARD_PREVIEW_MISSING",\n        "ensureCompletedFinalImmutability",\n    ):\n        require(guard, needle, "persistent deadline guard")\n    for forbidden in (\n        "LATE_LIMIT_MS",\n        "remaining > 14 * 60 * 1000",\n        "remaining > LATE_LIMIT_MS",\n        "fetch(",\n        "probability_fallback_persistent_deadline_guard",\n        "chooseCompletedProbabilityFallbackTickets",\n        "emergencyRunnerWeights",\n        "async function buildFallback",\n        "async function commitFallback",\n        "loadCompletedFeatureStateForRace",\n        "loadCompletedRecencyLearning",\n    ):\n        forbid(guard, forbidden, "persistent deadline guard")\n\n'''
          text=text[:a]+block+text[b:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate root fix
        run: |
          npm ci
          python scripts/verify-live-lock-safety.py
          npm run typecheck
          npm run build:test
          npm test
          npx wrangler deploy --dry-run
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/completed-worker-deadline-guard.ts src/v1/completed-worker-live-lock.ts src/v1/completed-final-invariants.ts src/public-site-entry-v29.ts scripts/verify-live-lock-safety.py
          git commit -m "Make normal race T15 final atomic and immutable"
          git push origin HEAD:fix/normal-t15-atomic-v2-20260816
