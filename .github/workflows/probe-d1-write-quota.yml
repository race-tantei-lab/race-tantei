name: Probe D1 write quota

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-d1-write-quota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Write-only D1 probe
        shell: bash
        run: |
          set -euo pipefail
          # This statement intentionally performs no SELECT and tests whether write quota remains available.
          npx wrangler d1 execute race-tantei-phase0 --remote --command "INSERT INTO rt_system_state(state_key,state_value,updated_at) VALUES('ops_write_probe_20260906','ok',CURRENT_TIMESTAMP) ON CONFLICT(state_key) DO UPDATE SET state_value='ok',updated_at=CURRENT_TIMESTAMP"
          echo WRITE_PROBE_OK
