name: Diagnose 9/6 D1 bets and odds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-d1-write-quota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Read current 9/6 selected-race state only
        shell: bash
        run: |
          set -euo pipefail
          IDS="'2026-09-06-nakayama-01','2026-09-06-nakayama-02','2026-09-06-nakayama-03','2026-09-06-nakayama-07','2026-09-06-nakayama-10','2026-09-06-hanshin-01','2026-09-06-hanshin-03','2026-09-06-hanshin-04','2026-09-06-hanshin-05','2026-09-06-hanshin-10','2026-09-06-sapporo-02','2026-09-06-sapporo-03','2026-09-06-sapporo-04','2026-09-06-sapporo-05','2026-09-06-sapporo-11'"
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT race_id,venue,race_no,start_time_utc FROM rt_races WHERE race_id IN ($IDS) ORDER BY start_time_utc" > /tmp/races.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT race_id,course,COUNT(*) AS tickets,COUNT(DISTINCT bet_type) AS bet_types,SUM(stake_yen) AS stake_yen,MIN(source_prediction_id) AS min_source,MAX(source_prediction_id) AS max_source FROM rt_public_bets WHERE race_id IN ($IDS) GROUP BY race_id,course ORDER BY race_id,course" > /tmp/bets.json
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT race_id,odds_source,COUNT(*) AS odds_rows FROM rt_official_odds_latest WHERE race_id IN ($IDS) GROUP BY race_id,odds_source ORDER BY race_id,odds_source" > /tmp/odds.json
          python3 - <<'PY'
          import json
          def rows(path):
            raw=json.load(open(path)); out=[]
            for b in raw if isinstance(raw,list) else [raw]:
              if isinstance(b,dict): out += b.get('results') or []
            return out
          races=rows('/tmp/races.json'); bets=rows('/tmp/bets.json'); odds=rows('/tmp/odds.json')
          print('RACES',json.dumps(races,ensure_ascii=False))
          print('BET_GROUPS',json.dumps(bets,ensure_ascii=False))
          print('ODDS_GROUPS',json.dumps(odds,ensure_ascii=False))
          ids=[r['race_id'] for r in races]
          by_bet={}; by_odds={}
          for r in bets: by_bet.setdefault(r['race_id'],[]).append(r)
          for r in odds: by_odds.setdefault(r['race_id'],[]).append(r)
          complete=[]
          for rid in ids:
            cs=by_bet.get(rid,[])
            ok=(len(cs)==3 and sorted(int(x.get('stake_yen') or 0) for x in cs)==[2000,5000,10000] and all(int(x.get('tickets') or 0)==2 and int(x.get('bet_types') or 0)==2 and int(x.get('min_source') or 0)==-2 and int(x.get('max_source') or 0)==-2 for x in cs))
            if ok: complete.append(rid)
            print('RACE',json.dumps({'raceId':rid,'betComplete':ok,'betGroups':cs,'oddsGroups':by_odds.get(rid,[])},ensure_ascii=False))
          print('SUMMARY',json.dumps({'selectedRaces':len(ids),'completeBetRaces':len(complete),'completeRaceIds':complete,'betGroupRows':len(bets),'oddsGroupRows':len(odds)},ensure_ascii=False))
          PY
