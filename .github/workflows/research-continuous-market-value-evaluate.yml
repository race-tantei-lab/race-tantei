name: Research continuous market value evaluation

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-continuous-market-value-evaluate.yml"
      - "scripts/research-evaluate-continuous-market-value.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  ODDS_RUN_ID: '31446629662'
  FAST_2023_RUN_ID: '31447695033'
  RECENT_ODDS_RUN_ID: '31446902302'
  REPAIR_RUN_ID: '31447072766'
  BEST_DEMAND_RUN_ID: '31417411680'
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Mark evaluation pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/continuous-market-value-evaluation' \
            -f description='Waiting only for required official odds shards and residual repair' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator before waiting on network research
        run: python -m py_compile scripts/research-evaluate-continuous-market-value.py
      - name: Wait for 2016-2022 base, fast 2023, recent, and repair artifacts
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 700); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}/artifacts?per_page=100" > base.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAST_2023_RUN_ID}/artifacts?per_page=100" > fast2023.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECENT_ODDS_RUN_ID}/artifacts?per_page=100" > recent.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}/artifacts?per_page=100" > repair.json
            base_count=0
            for year in $(seq 2016 2022); do
              name="research-continuous-market-odds-${year}"
              n=$(jq -r --arg n "$name" '[.artifacts[] | select(.name==$n and .expired==false)] | length' base.json)
              base_count=$((base_count+n))
            done
            fast_count=$(jq -r '[.artifacts[] | select(.name=="research-continuous-market-odds-2023-fast" and .expired==false)] | length' fast2023.json)
            recent_count=0
            for year in $(seq 2024 2026); do
              name="research-continuous-market-odds-recent-${year}"
              n=$(jq -r --arg n "$name" '[.artifacts[] | select(.name==$n and .expired==false)] | length' recent.json)
              recent_count=$((recent_count+n))
            done
            repair_count=$(jq -r '[.artifacts[] | select(.name=="research-continuous-market-odds-repair" and .expired==false)] | length' repair.json)
            echo "required artifacts base=$base_count/7 fast2023=$fast_count/1 recent=$recent_count/3 repair=$repair_count/1 poll=$i"
            if [ "$base_count" -eq 7 ] && [ "$fast_count" -eq 1 ] && [ "$recent_count" -eq 3 ] && [ "$repair_count" -eq 1 ]; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Download frozen history and pre-odds race selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds repair analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip ten-year-history-corpus.jsonl -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BEST_DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-blend-0.60" and .expired==false) | .id' demand-artifacts.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
          test -s demand/demand.jsonl
          test -s history/ten-year-history-corpus.jsonl
      - name: Download 2016-2022 odds from base run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ODDS_RUN_ID}/artifacts?per_page=100" > base-artifacts.json
          for year in $(seq 2016 2022); do
            name="research-continuous-market-odds-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' base-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$year.zip"
            mkdir -p "tmp-$year"; unzip -q "$year.zip" -d "tmp-$year"
            cp "tmp-$year/research-continuous-market-odds-${year}.jsonl" odds/
          done
      - name: Download fast 2023 odds
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAST_2023_RUN_ID}/artifacts?per_page=100" > fast2023-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-continuous-market-odds-2023-fast" and .expired==false) | .id' fast2023-artifacts.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > 2023.zip
          mkdir -p tmp-2023; unzip -q 2023.zip -d tmp-2023
          cp tmp-2023/research-continuous-market-odds-2023.jsonl odds/
      - name: Download archive-accelerated 2024-2026 odds
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECENT_ODDS_RUN_ID}/artifacts?per_page=100" > recent-artifacts.json
          for year in $(seq 2024 2026); do
            name="research-continuous-market-odds-recent-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' recent-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$year.zip"
            mkdir -p "tmp-$year"; unzip -q "$year.zip" -d "tmp-$year"
            cp "tmp-$year/research-continuous-market-odds-${year}.jsonl" odds/
          done
          test "$(find odds -name 'research-continuous-market-odds-20*.jsonl' -type f | wc -l)" -eq 11
      - name: Download and merge residual repaired odds
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_RUN_ID}/artifacts?per_page=100" > repair-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-continuous-market-odds-repair" and .expired==false) | .id' repair-artifacts.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > repair.zip
          unzip -q repair.zip -d repair
          python - <<'PY'
          import json
          from pathlib import Path
          rp=Path('repair/research-continuous-market-odds-repair.jsonl')
          repairs=[]
          if rp.exists():repairs=[json.loads(line) for line in rp.read_text().splitlines() if line.strip()]
          by_year={str(y):{} for y in range(2016,2027)}
          for year in by_year:
            p=Path(f'odds/research-continuous-market-odds-{year}.jsonl')
            for line in p.read_text().splitlines():
              if line.strip():
                r=json.loads(line);by_year[year][str(r['raceId'])]=r
          for r in repairs:
            year=str(r['raceDate'])[:4];by_year[year][str(r['raceId'])]=r
          for year,rows in by_year.items():
            p=Path(f'odds/research-continuous-market-odds-{year}.jsonl')
            p.write_text(''.join(json.dumps(rows[k],ensure_ascii=False,separators=(',',':'))+'\n' for k in sorted(rows)))
          print(json.dumps({'repairedRowsMerged':len(repairs),'counts':{y:len(r) for y,r in by_year.items()}},ensure_ascii=False))
          PY
      - name: Evaluate probability x official-odds value candidates
        run: |
          python scripts/research-evaluate-continuous-market-value.py \
            --corpus history/ten-year-history-corpus.jsonl \
            --demand demand/demand.jsonl \
            --odds-dir odds \
            --out analysis-results/research-continuous-market-value-evaluation.json
      - name: Verify research provenance and completion state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-continuous-market-value-evaluation.json').read_text())
          assert m['selectedDemandRaces']==14410,m
          assert m['raceSelectionFrozenBeforeOdds'] is True,m
          assert m['targetDayResultsUsedForRaceSelection'] is False,m
          assert m['sameDayResultsUsedForTicketProbability'] is False,m
          assert m['historicalFinalOddsUsed'] is True,m
          assert m['prestartTimingValidationPerformed'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          assert m['productionModelChanged'] is False,m
          b=m['bestVariant'];v=m['variants'][b]
          print(json.dumps({'best':b,'evaluated':v['evaluatedRaces'],'missingOdds':m['missingOddsRaceCount'],'errors':v['evaluationErrorCount'],'roi':{c:x['roiPct'] for c,x in v['courses'].items()},'all200':v['allThreeAtLeast200Pct']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-continuous-market-value-evaluation
          path: analysis-results/research-continuous-market-value-evaluation.json
          if-no-files-found: error
          retention-days: 30
      - name: Mark evaluation success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/continuous-market-value-evaluation' \
            -f description='Two-stage market-value walk-forward evaluated' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark evaluation failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/continuous-market-value-evaluation' \
            -f description='Two-stage market-value evaluation requires targeted repair' -f target_url="$STATUS_TARGET_URL" >/dev/null
