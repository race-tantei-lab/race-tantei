name: Live selection diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public race API
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"

          calendar="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/calendar")"
          day="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-08")"

          CALENDAR="$calendar" DAY="$day" python - <<'PY'
          import json, os

          calendar = json.loads(os.environ["CALENDAR"])
          day = json.loads(os.environ["DAY"])

          if calendar.get("ok") is not True:
              raise SystemExit("public calendar API is not healthy")
          if day.get("ok") is not True:
              raise SystemExit("public day API is not healthy")

          races = day.get("races") or []
          if not races:
              raise SystemExit("public day API returned no races for 2026-08-08")
          if any("publicState" not in row for row in races):
              raise SystemExit("public day API is missing publicState")

          selected = [row for row in races if (row.get("publicState") or {}).get("code") == "buy"]
          print(json.dumps({
              "calendarVenueDays": len(calendar.get("calendar") or []),
              "aug8Races": len(races),
              "aug8Selected": len(selected),
              "selectedRaceIds": [row.get("raceId") for row in selected]
          }, ensure_ascii=False))
          PY
