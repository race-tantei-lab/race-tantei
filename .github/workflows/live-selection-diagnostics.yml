name: Live selection diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public API and official calendar parsing shape
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"
          aug8="$(curl --silent --show-error --fail --max-time 25 "${base}/api/public/day?date=2026-08-08")"
          aug9="$(curl --silent --show-error --fail --max-time 25 "${base}/api/public/day?date=2026-08-09")"
          AUG8="$aug8" AUG9="$aug9" python - <<'PY'
          import collections,json,os
          for key in ('AUG8','AUG9'):
              p=json.loads(os.environ[key]); rows=p.get('races') or []
              print(key, json.dumps({'races':len(rows),'venues':dict(collections.Counter(r.get('venue') for r in rows)),'selected':sum((r.get('publicState') or {}).get('code')=='buy' for r in rows)},ensure_ascii=False))
          PY

          curl --silent --show-error --fail --max-time 25 -A 'Mozilla/5.0' \
            'https://www.jra.go.jp/keiba/calendar2026/2026/8/0809.html' -o /tmp/calendar.bin

          python - <<'PY'
          import html,re
          raw=open('/tmp/calendar.bin','rb').read()
          text=None
          for enc in ('utf-8','shift_jis','cp932'):
              try:
                  candidate=raw.decode(enc)
                  if '新潟' in candidate and 'レース' in candidate:
                      text=candidate; print('CALENDAR_ENCODING',enc,'bytes',len(raw)); break
              except Exception: pass
          if text is None:
              raise SystemExit('calendar decode failed')
          shaped=re.sub(r'</(?:td|th|tr|li|p|div|section|article|h[1-6]|dt|dd|ul|ol|table)>','\n',text,flags=re.I)
          shaped=re.sub(r'<\s*br\s*/?>','\n',shaped,flags=re.I)
          shaped=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',shaped,flags=re.I)
          shaped=re.sub(r'<style\b[^>]*>[\s\S]*?</style>','',shaped,flags=re.I)
          shaped=re.sub(r'<[^>]+>',' ',shaped)
          shaped=html.unescape(shaped)
          lines=[re.sub(r'[\u00a0\t ]+',' ',x).strip() for x in shaped.replace('\r','').split('\n')]
          lines=[x for x in lines if x]
          for i,line in enumerate(lines):
              if re.search(r'(?:回(?:新潟|中京|札幌).*日|レース|時\d+分)',line):
                  if 0 <= i < len(lines): print(f'{i}: {line}')
          PY
