name: Live selection diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public race API
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"

          calendar="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/calendar")"
          aug8="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-08")"
          aug9="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-09")"

          CALENDAR="$calendar" AUG8="$aug8" AUG9="$aug9" python - <<'PY'
          import collections, json, os

          calendar = json.loads(os.environ["CALENDAR"])
          aug8 = json.loads(os.environ["AUG8"])
          aug9 = json.loads(os.environ["AUG9"])

          if calendar.get("ok") is not True:
              raise SystemExit("public calendar API is not healthy")
          if aug8.get("ok") is not True or aug9.get("ok") is not True:
              raise SystemExit("public day API is not healthy")

          def summarize(payload):
              rows=payload.get("races") or []
              venues=collections.Counter(row.get("venue") for row in rows)
              selected=[row for row in rows if (row.get("publicState") or {}).get("code")=="buy"]
              pending=[row for row in rows if (row.get("publicState") or {}).get("code")=="pending"]
              return {
                  "races":len(rows),
                  "venues":dict(venues),
                  "selected":len(selected),
                  "pending":len(pending),
                  "raceIds":[row.get("raceId") for row in rows],
                  "selectedRaceIds":[row.get("raceId") for row in selected]
              }

          cal=calendar.get("calendar") or []
          print(json.dumps({
              "calendarVenueDays":len(cal),
              "lastCalendarRows":cal[-15:],
              "aug8":summarize(aug8),
              "aug9":summarize(aug9)
          },ensure_ascii=False))
          PY
