name: Live selection diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public race API and JRA entry candidates
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"

          calendar="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/calendar")"
          aug8="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-08")"
          aug9="$(curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-09")"

          CALENDAR="$calendar" AUG8="$aug8" AUG9="$aug9" python - <<'PY'
          import collections, json, os
          calendar=json.loads(os.environ['CALENDAR']); aug8=json.loads(os.environ['AUG8']); aug9=json.loads(os.environ['AUG9'])
          def summarize(payload):
              rows=payload.get('races') or []
              return {'races':len(rows),'venues':dict(collections.Counter(r.get('venue') for r in rows)),'selected':sum((r.get('publicState') or {}).get('code')=='buy' for r in rows)}
          print(json.dumps({'calendarVenueDays':len(calendar.get('calendar') or []),'aug8':summarize(aug8),'aug9':summarize(aug9)},ensure_ascii=False))
          PY

          python - <<'PY' >/tmp/candidates.txt
          venues=[('sapporo','01','01','06'),('niigata','04','02','06'),('chukyo','07','02','06')]
          for name,code,meeting,day in venues:
              core=f"pw01dde01{code}2026{meeting}{day}0120260809"
              print(name+'|https://www.jra.go.jp/JRADB/accessD.html?CNAME='+core)
              print(name+'-00|https://www.jra.go.jp/JRADB/accessD.html?CNAME='+core+'%2F00')
          PY

          while IFS='|' read -r label url; do
            code="$(curl --silent --show-error --location --max-time 25 -A 'Mozilla/5.0' -o "/tmp/${label}.html" -w '%{http_code}' "$url" || true)"
            size="$(wc -c < "/tmp/${label}.html" 2>/dev/null || echo 0)"
            if grep -q '2026年8月9日' "/tmp/${label}.html" 2>/dev/null && grep -q '1レース' "/tmp/${label}.html" 2>/dev/null; then ok=true; else ok=false; fi
            echo "JRA_CANDIDATE label=${label} http=${code} bytes=${size} valid=${ok}"
          done </tmp/candidates.txt
