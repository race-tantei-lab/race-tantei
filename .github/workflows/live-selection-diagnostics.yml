name: Live selection diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public race API
        run: |
          set -euo pipefail
          base="https://race-tantei-phase0.race-tantei.workers.dev"

          curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/calendar" > /tmp/race-tantei-calendar.json
          curl --silent --show-error --fail --max-time 25 -A 'race-tantei-diagnostics/1.0' "${base}/api/public/day?date=2026-08-08" > /tmp/race-tantei-day.json

          python - <<'PY'
          import json
          from pathlib import Path

          calendar = json.loads(Path("/tmp/race-tantei-calendar.json").read_text(encoding="utf-8"))
          day = json.loads(Path("/tmp/race-tantei-day.json").read_text(encoding="utf-8"))

          if calendar.get("ok") is not True:
              raise SystemExit("public calendar API is not healthy")
          if day.get("ok") is not True:
              raise SystemExit("public day API is not healthy")

          races = day.get("races") or []
          if not races:
              raise SystemExit("public day API returned no races for 2026-08-08")
          if any("publicState" not in row for row in races):
              raise SystemExit("public day API is missing publicState")

          selected_codes = {"buy", "lose", "hit", "miss", "refund"}
          selected = [row for row in races if (row.get("publicState") or {}).get("code") in selected_codes]
          print(json.dumps({
              "calendarVenueDays": len(calendar.get("calendar") or []),
              "aug8Races": len(races),
              "aug8Selected": len(selected),
              "selectedRaceIds": [row.get("raceId") for row in selected]
          }, ensure_ascii=False))
          PY
