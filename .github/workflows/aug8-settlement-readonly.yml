name: Aug 8 settlement readonly
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: [.github/workflows/aug8-settlement-readonly.yml]
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/aug8-engine-locate' -f description='v16上流候補エンジンを読取検索中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - name: Locate candidate engine
        run: |
          mkdir -p artifacts/aug8-engine
          { find scripts config analysis-results -maxdepth 2 -type f 2>/dev/null | sort; } > artifacts/aug8-engine/files.txt
          grep -R -n -E 'residRatio|predProb|marketProb|predicted-EV|primitiveScores|official.*candidate|candidate.*official' scripts config 2>/dev/null > artifacts/aug8-engine/grep.txt || true
          grep -R -n -E 'v16-uniform-rule-selector|select_venue_day|build_course_bets' scripts .github 2>/dev/null > artifacts/aug8-engine/v16refs.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: aug8-engine-locate
          path: artifacts/aug8-engine/
          retention-days: 1
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/aug8-engine-locate' -f description='v16上流候補エンジン検索完了' -f target_url="$TARGET" >/dev/null
