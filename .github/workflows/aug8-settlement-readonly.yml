name: Aug 8 settlement readonly
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: [.github/workflows/aug8-settlement-readonly.yml]
permissions:
  contents: read
  statuses: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/aug8-v16-settlement' -f description='凍結v16で8/8を読取精算中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn beautifulsoup4 requests
      - name: Patch JRA input parsing only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/aug8-v16-readonly-settlement.py')
          s=p.read_text(encoding='utf-8')
          old="\\s+(\\d+)kg\\s*\\(([+\\-]?\\d+)\\)"
          new="\\s+(\\d+)kg\\s*\\(([+\\-]?\\d+|初出走)\\)"
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace("'weightChange':int(change)","'weightChange':(0 if change=='初出走' else int(change))",1)
          old_loop="eh=get(s['entryUrl']); rows,m=parse_entry(s,eh); allrows.extend(rows); meta[s['raceId']]=m; odds_by[s['raceId']]=parse_odds(s); results[s['raceId']]=payout_map(get(s['resultUrl'])); print(json.dumps({'fetched':i,'raceId':s['raceId']},ensure_ascii=False),flush=True)"
          new_loop="eh=get(s['entryUrl']); rows,m=parse_entry(s,eh); rh=get(s['resultUrl']); rt=' '.join(BeautifulSoup(rh,'html.parser').stripped_strings); mh=re.search(r'天候\\s+([^\\s]+)\\s+(芝|ダート)\\s+(良|稍重|重|不良)',rt); m['weather']=mh.group(1) if mh else m.get('weather',''); m['trackCondition']=mh.group(3) if mh else m.get('trackCondition',''); allrows.extend(rows); meta[s['raceId']]=m; odds_by[s['raceId']]=parse_odds(s); results[s['raceId']]=payout_map(rh); print(json.dumps({'fetched':i,'raceId':s['raceId'],'weather':m['weather'],'condition':m['trackCondition']},ensure_ascii=False),flush=True)"
          if old_loop not in s: raise SystemExit('main loop target missing')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: python scripts/aug8-v16-readonly-settlement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aug8-v16-settlement
          path: artifacts/aug8-v16-settlement/
          retention-days: 1
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/aug8-v16-settlement' -f description='8/8 v16精算完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/aug8-v16-settlement' -f description='8/8 v16精算失敗' -f target_url="$TARGET" >/dev/null
