name: Aug 8 settlement readonly
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths: [.github/workflows/aug8-settlement-readonly.yml]
permissions:
  contents: read
  statuses: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/aug8-v16-settlement' -f description='凍結v16で8/8を読取精算中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn beautifulsoup4 requests
      - name: Patch JRA input parsing only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/aug8-v16-readonly-settlement.py')
          s=p.read_text(encoding='utf-8')
          old="\\s+(\\d+)kg\\s*\\(([+\\-]?\\d+)\\)"
          new="\\s+(\\d+)kg\\s*\\(([+\\-]?\\d+|初出走)\\)"
          if old in s: s=s.replace(old,new,1)
          s=s.replace("'weightChange':int(change)","'weightChange':(0 if change=='初出走' else int(change))",1)
          a=s.index('def parse_odds(spec):')
          b=s.index('def payout_map(result_html):')
          new_func='''def parse_odds(spec):\n    maps={}\n    for typ,(prefix,add,mid) in ADDS.items():\n        cd=(spec[\"entrySuffix\"]+add)%256\n        html=post(prefix+spec[\"body\"]+mid+f\"{cd:02X}\")\n        soup=BeautifulSoup(html,\"html.parser\")\n        out={}\n        if typ in (\"umaren\",\"wide\",\"umatan\"):\n            cls={\"umaren\":\"umaren\",\"wide\":\"wide\",\"umatan\":\"umatan\"}[typ]\n            for table in soup.find_all(\"table\",class_=lambda x: x and cls in x):\n                cap=table.find(\"caption\")\n                if not cap: continue\n                first_txt=\" \\".join(cap.stripped_strings).strip()\n                m=re.search(r\"(\\d{1,2})\",first_txt)\n                if not m: continue\n                first=int(m.group(1))\n                for tr in table.find_all(\"tr\"):\n                    th=tr.find(\"th\"); td=tr.find(\"td\")\n                    if not th or not td: continue\n                    m2=re.search(r\"\\d{1,2}\",\" \\".join(th.stripped_strings))\n                    if not m2: continue\n                    second=int(m2.group())\n                    if typ==\"wide\":\n                        mn=td.find(class_=\"min\")\n                        val=num(\" \\".join(mn.stripped_strings)) if mn else num(\" \\".join(td.stripped_strings).split(\"-\")[0])\n                        key=tuple(sorted((first,second)))\n                    else:\n                        val=num(\" \\".join(td.stripped_strings),0)\n                        key=(first,second) if typ==\"umatan\" else tuple(sorted((first,second)))\n                    if val>1: out[key]=val\n        elif typ==\"trio\":\n            for table in soup.find_all(\"table\",class_=lambda x:x and \"fuku3\" in x):\n                cap=\" \\".join(table.find(\"caption\").stripped_strings) if table.find(\"caption\") else \"\"\n                m=re.search(r\"(\\d{1,2})-(\\d{1,2})\",cap)\n                if not m: continue\n                a1,a2=map(int,m.groups())\n                for tr in table.find_all(\"tr\"):\n                    th=tr.find(\"th\"); td=tr.find(\"td\")\n                    if not th or not td: continue\n                    m3=re.search(r\"\\d{1,2}\",\" \\".join(th.stripped_strings))\n                    if not m3: continue\n                    a3=int(m3.group()); val=num(\" \\".join(td.stripped_strings),0)\n                    if val>1 and len({a1,a2,a3})==3: out[tuple(sorted((a1,a2,a3)))]=val\n        else:\n            for table in soup.find_all(\"table\",class_=lambda x:x and \"tan3\" in x):\n                par=table.parent\n                lines=par.find_all(\"div\",class_=\"p_line\",recursive=False) if par else []\n                first=second=None\n                for line in lines:\n                    txt=\" \\".join(line.stripped_strings)\n                    m1=re.search(r\"1着\\s*(\\d{1,2})\",txt); m2=re.search(r\"2着\\s*(\\d{1,2})\",txt)\n                    if m1: first=int(m1.group(1))\n                    if m2: second=int(m2.group(1))\n                if first is None or second is None: continue\n                for tr in table.find_all(\"tr\"):\n                    th=tr.find(\"th\"); td=tr.find(\"td\")\n                    if not th or not td: continue\n                    m3=re.search(r\"\\d{1,2}\",\" \\".join(th.stripped_strings))\n                    if not m3: continue\n                    third=int(m3.group()); val=num(\" \\".join(td.stripped_strings),0)\n                    if val>1 and len({first,second,third})==3: out[(first,second,third)]=val\n        maps[typ]=out\n    return maps\n\n'''
          s=s[:a]+new_func+s[b:]
          old_loop="eh=get(s['entryUrl']); rows,m=parse_entry(s,eh); allrows.extend(rows); meta[s['raceId']]=m; odds_by[s['raceId']]=parse_odds(s); results[s['raceId']]=payout_map(get(s['resultUrl'])); print(json.dumps({'fetched':i,'raceId':s['raceId']},ensure_ascii=False),flush=True)"
          new_loop="eh=get(s['entryUrl']); rows,m=parse_entry(s,eh); rh=get(s['resultUrl']); rt=' '.join(BeautifulSoup(rh,'html.parser').stripped_strings); mh=re.search(r'天候\\s+([^\\s]+)\\s+(芝|ダート)\\s+(良|稍重|重|不良)',rt); m['weather']=mh.group(1) if mh else m.get('weather',''); m['trackCondition']=mh.group(3) if mh else m.get('trackCondition',''); allrows.extend(rows); meta[s['raceId']]=m; odds_by[s['raceId']]=parse_odds(s); results[s['raceId']]=payout_map(rh); print(json.dumps({'fetched':i,'raceId':s['raceId'],'weather':m['weather'],'condition':m['trackCondition'],'oddsCounts':{k:len(v) for k,v in odds_by[s['raceId']].items()}},ensure_ascii=False),flush=True)"
          if old_loop not in s: raise SystemExit('main loop target missing')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: python scripts/aug8-v16-readonly-settlement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aug8-v16-settlement
          path: artifacts/aug8-v16-settlement/
          retention-days: 1
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/aug8-v16-settlement' -f description='8/8 v16精算完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/aug8-v16-settlement' -f description='8/8 v16精算失敗' -f target_url="$TARGET" >/dev/null
