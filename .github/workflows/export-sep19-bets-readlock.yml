name: Export Sep 19 bets during D1 read lock
on:
  push:
    branches: ["ops/diag-20260919"]
    paths: [".github/workflows/export-sep19-bets-readlock.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Show export help
        shell: bash
        run: npx wrangler d1 export --help
      - name: Export public bets table
        shell: bash
        run: |
          set +e
          rm -f /tmp/bets.sql
          npx wrangler d1 export race-tantei-phase0 --remote --table rt_public_bets --output /tmp/bets.sql
          rc=$?
          echo "EXPORT_RC=$rc"
          if [ -f /tmp/bets.sql ]; then
            echo "EXPORT_SIZE=$(wc -c </tmp/bets.sql)"
            grep -F "2026-09-19-" /tmp/bets.sql | tail -n 300 || true
          fi
          exit 0
