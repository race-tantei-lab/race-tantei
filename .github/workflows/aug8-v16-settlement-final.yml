name: Aug 8 v16 settlement final
on:
  push:
    branches: [analysis/aug8-settlement-readonly]
    paths:
      - 'scripts/aug8-v16-settlement-final.py'
      - '.github/workflows/aug8-v16-settlement-final.yml'
permissions:
  contents: read
  statuses: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/aug8-v16-settlement-final' -f description='8/8 v16最終精算中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn beautifulsoup4 requests
      - run: python scripts/aug8-v16-settlement-final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aug8-v16-settlement-final
          path: artifacts/aug8-v16-settlement-final/
          retention-days: 1
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/aug8-v16-settlement-final' -f description='8/8 v16最終精算完了' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/aug8-v16-settlement-final' -f description='8/8 v16最終精算失敗' -f target_url="$TARGET" >/dev/null
