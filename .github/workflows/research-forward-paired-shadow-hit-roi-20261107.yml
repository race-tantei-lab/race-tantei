name: Research paired T15 shadow hit and ROI self-test (no production)
on:
  push:
    branches: [research/forward-shadow-audit-20261107]
  workflow_dispatch:
    inputs:
      through_date:
        description: Inclusive JST race date (only after full settlement)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate same-cohort hit and ROI, refunds and six official markets
        run: python3 scripts/research-forward-paired-shadow-hit-roi-20261107.py --self-test
      - name: Query historical immutable pre-T15 actual/shadow picks (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.through_date != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python3 scripts/research-forward-paired-shadow-hit-roi-20261107.py --through-date "${{ inputs.through_date }}"
