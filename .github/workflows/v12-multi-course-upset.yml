name: V12 multi-course upset analysis
run-name: V12 multi-course upset analysis · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "config/race-tantei-fixed-constraints.json"
      - "scripts/verify-race-tantei-fixed-constraints.py"
      - "scripts/analyze-v12-multi-course-upset.py"
      - ".github/workflows/v12-multi-course-upset.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: v12-multi-course-upset
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish analysis start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/v12-multi-course-upset' \
            -f description='分析中：最低5レース・3コース分散・200%候補探索' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify immutable project constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py

      - name: Verify source
        run: python -m py_compile scripts/analyze-v12-multi-course-upset.py

      - name: Run multi-course upset analysis under current immutable rules
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee v12-multi-course-upset.log
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          path = root / "scripts" / "analyze-v12-multi-course-upset.py"
          spec = importlib.util.spec_from_file_location("v12_current_constraints", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.EXPECTED = json.loads((root / "config" / "race-tantei-fixed-constraints.json").read_text(encoding="utf-8"))
          module.main()
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-multi-course-upset
          path: |
            v12-multi-course-upset-analysis.json
            v12-multi-course-upset.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save report
        if: success()
        shell: bash
        run: |
          mkdir -p analysis-results
          cp v12-multi-course-upset-analysis.json analysis-results/v12-multi-course-upset-analysis.json
          cp v12-multi-course-upset.log analysis-results/v12-multi-course-upset.log
          git add -f analysis-results/v12-multi-course-upset-analysis.json analysis-results/v12-multi-course-upset.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Save v12 multi-course upset analysis under fixed rules"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
            DESCRIPTION='完了：最低5レース・3コース分散の200%候補分析'
          else
            STATE=failure
            DESCRIPTION='失敗：v12分析ログ確認が必要'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='analysis/v12-multi-course-upset' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
