name: Diagnose post-Aug9 production history

on:
  push:
    branches: [audit-post-aug9-history-20260904]
    paths:
      - ".github/workflows/diagnose-production-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Export relevant D1 tables despite query quota
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          db=os.environ['CLOUDFLARE_D1_DATABASE_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          tables=['rt_races','rt_public_bets','rt_system_state']
          def post(payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=json.load(r)
              if not body.get('success'):
                  raise RuntimeError(json.dumps(body,ensure_ascii=False))
              return body.get('result') or {}
          first=post({'output_format':'polling','dump_options':{'no_schema':True,'tables':tables}})
          bookmark=first.get('at_bookmark')
          print('EXPORT_START',json.dumps({'status':first.get('status'),'bookmark':bookmark,'messages':first.get('messages')},ensure_ascii=False))
          result=first
          for attempt in range(60):
              signed=(result.get('result') or {}).get('signed_url')
              if signed:
                  break
              if result.get('status')=='error':
                  raise RuntimeError('EXPORT_ERROR:'+str(result.get('error')))
              if not bookmark:
                  raise RuntimeError('EXPORT_BOOKMARK_MISSING')
              time.sleep(2)
              result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':{'no_schema':True,'tables':tables}})
              print('EXPORT_POLL',attempt+1,result.get('status'),result.get('messages'))
          signed=(result.get('result') or {}).get('signed_url')
          if not signed:
              raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=180) as r:
              data=r.read()
          open('/tmp/postaug9.sql','wb').write(data)
          print('EXPORT_BYTES',len(data))
          text=data.decode('utf-8','replace')
          dates=['2026-08-09','2026-08-15','2026-08-16','2026-08-22','2026-08-23','2026-08-29','2026-08-30']
          counts={d:{'rt_races':0,'rt_public_bets':0,'rt_system_state':0} for d in dates}
          selected_lines=[]
          for line in text.splitlines():
              table=None
              if 'INSERT INTO "rt_races"' in line or 'INSERT INTO rt_races' in line: table='rt_races'
              elif 'INSERT INTO "rt_public_bets"' in line or 'INSERT INTO rt_public_bets' in line: table='rt_public_bets'
              elif 'INSERT INTO "rt_system_state"' in line or 'INSERT INTO rt_system_state' in line: table='rt_system_state'
              if not table: continue
              matched=False
              for d in dates:
                  if d in line:
                      counts[d][table]+=1
                      matched=True
              if matched: selected_lines.append(line)
          open('/tmp/postaug9-filtered.sql','w',encoding='utf-8').write('\n'.join(selected_lines)+'\n')
          print('POST_AUG9_EXPORT_COUNTS',json.dumps(counts,ensure_ascii=False,sort_keys=True))
          print('FILTERED_LINES',len(selected_lines))
          if not any(counts[d]['rt_public_bets'] for d in dates):
              raise RuntimeError('NO_POST_AUG9_PUBLIC_BETS_IN_EXPORT')
          PY
      - name: Summarize filtered export
        shell: bash
        run: |
          set -euo pipefail
          wc -l /tmp/postaug9-filtered.sql
          grep -E "2026-08-(09|15|16|22|23|29|30)" /tmp/postaug9-filtered.sql | head -20 || true
