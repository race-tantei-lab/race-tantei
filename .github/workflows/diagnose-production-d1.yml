name: Diagnose production D1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-production-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Probe remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
        shell: bash
        run: |
          set -euo pipefail
          runq() {
            local label="$1" sql="$2"
            echo "===== ${label} ====="
            start=$(date +%s%3N)
            if npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$sql" >"/tmp/${label}.json" 2>"/tmp/${label}.err"; then
              end=$(date +%s%3N)
              echo "status=ok ms=$((end-start))"
              cat "/tmp/${label}.json"
            else
              end=$(date +%s%3N)
              echo "status=error ms=$((end-start))"
              cat "/tmp/${label}.err"
            fi
          }
          runq ping "SELECT 1 AS ok;"
          runq race_total "SELECT COUNT(*) AS n FROM rt_races;"
          runq today "SELECT COUNT(*) AS n FROM rt_races WHERE race_date='2026-09-04';"
          runq tomorrow "SELECT COUNT(*) AS n FROM rt_races WHERE race_date='2026-09-05';"
          runq tomorrow_rows "SELECT race_id,race_date,venue,race_no,start_time_jst FROM rt_races WHERE race_date='2026-09-05' ORDER BY venue,race_no LIMIT 12;"
          runq state_today "SELECT state_key,length(state_value) AS bytes FROM rt_system_state WHERE state_key='final_daily_selection:2026-09-04' LIMIT 1;"
          runq index_list "PRAGMA index_list('rt_races');"
