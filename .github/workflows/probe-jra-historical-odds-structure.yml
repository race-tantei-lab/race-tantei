name: Probe historical JRA odds table structure

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe-jra-historical-odds-structure.py"
      - ".github/workflows/probe-jra-historical-odds-structure.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/jra-historical-odds-structure' \
            -f description='Inspecting historical JRA odds table structure' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run structure probe
        run: python scripts/probe-jra-historical-odds-structure.py
      - name: Save report
        run: |
          git add -f analysis-results/jra-historical-odds-structure-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Save historical JRA odds structure probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='analysis/jra-historical-odds-structure' \
            -f description='Historical JRA odds structure probe completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Publish failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='analysis/jra-historical-odds-structure' \
            -f description='Historical JRA odds structure probe failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
