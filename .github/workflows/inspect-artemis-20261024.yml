name: Inspect Artemis Stakes model inputs (read-only)
on:
  push:
    branches: ["diagnostics/cpu-20261020"]
    paths: [".github/workflows/inspect-artemis-20261024.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only production D1 race model inputs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a="3c6d1826b573b2e68cb13ec37e9e8ade"; db="949b5e8b-d1a4-4c4e-80d1-d031afdc03de"
          url=f"https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{db}/query"
          def q(sql):
            req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=25) as f:j=json.load(f)
            if not j.get("success"):print("ERROR",j.get("errors"));return []
            return (j.get("result")or[{}])[0].get("results")or[]
          queries={
          "RACE": "SELECT race_id,race_date,venue,race_no,name,distance_m,start_time_utc,status,entry_url FROM rt_races WHERE race_date='2026-10-24' AND venue='東京' AND race_no=11",
          "RUNNERS":"SELECT * FROM rt_runners WHERE race_id IN (SELECT race_id FROM rt_races WHERE race_date='2026-10-24' AND venue='東京' AND race_no=11) ORDER BY horse_no",
          "SELECTION":"SELECT state_key,state_value FROM rt_system_state WHERE state_key='final_daily_selection:2026-10-24'",
          "PREVIEW":"SELECT state_key,state_value FROM rt_system_state WHERE state_key LIKE 'worker_live_preview:2026-10-24-%-11' LIMIT 5",
          "BETS":"SELECT b.* FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-10-24' AND r.venue='東京' AND r.race_no=11",
          "MODEL":"SELECT key,value FROM rt_ml_model_meta",
          }
          for k,s in queries.items():
            try:
              rows=q(s)
              print("ARTEMIS",k,json.dumps(rows,ensure_ascii=False)[:8000])
            except Exception as e:print("ARTEMIS_ERROR",k,str(e))
          PY
