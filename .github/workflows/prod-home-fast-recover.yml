name: Fast production home snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prod-home-fast-recover.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * *' # 08:45 JST
    - cron: '50 0 * * *'  # 09:50 JST

permissions:
  contents: write

concurrency:
  group: fast-production-home-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Export public production snapshot without rows_read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
            if not body.get('success'): raise RuntimeError(json.dumps(body,ensure_ascii=False))
            return body.get('result') or {}
          opts={'tables':['rt_races','rt_system_state','rt_public_bets']}
          result=post({'output_format':'polling','dump_options':opts}); bookmark=result.get('at_bookmark')
          for _ in range(90):
            signed=(result.get('result') or {}).get('signed_url')
            if signed: break
            if not bookmark: raise RuntimeError('EXPORT_BOOKMARK_MISSING')
            time.sleep(1)
            result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':opts})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=120) as r: open('/tmp/prod-public.sql','wb').write(r.read())
          print('EXPORT_BYTES',os.path.getsize('/tmp/prod-public.sql'))
          PY

      - name: Build rolling calendar and race-day fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt,json,sqlite3
          utc=dt.datetime.now(dt.timezone.utc)
          jst=(utc+dt.timedelta(hours=9)).date()
          recent_start=(jst-dt.timedelta(days=45)).isoformat()
          snapshot_start=(jst-dt.timedelta(days=21)).isoformat()
          snapshot_end=(jst+dt.timedelta(days=14)).isoformat()
          con=sqlite3.connect('/tmp/public.sqlite')
          con.executescript(open('/tmp/prod-public.sql',encoding='utf-8').read())
          calendar=[
            {'raceDate':r[0],'venue':r[1],'raceCount':int(r[2])}
            for r in con.execute('''
              SELECT race_date,venue,COUNT(*) FROM rt_races
              WHERE race_date>=? AND race_date<=?
              GROUP BY race_date,venue ORDER BY race_date,venue
            ''',(recent_start,snapshot_end)).fetchall()
          ]
          if not calendar: raise SystemExit('RECENT_CALENDAR_EMPTY')

          path='src/normal-home-snapshot.ts'
          source=open(path,encoding='utf-8').read().strip()
          prefix='export const NORMAL_HOME_SNAPSHOT = '
          if not source.startswith(prefix): raise SystemExit('SNAPSHOT_PREFIX_MISSING')
          payload=source[len(prefix):]
          if payload.endswith(';'): payload=payload[:-1]
          html=json.loads(payload)
          start=html.find('const calendar=['); end=html.find('];const today=',start)
          if start<0 or end<0: raise SystemExit('HOME_CALENDAR_MARKER_MISSING')
          existing=html[start:end]
          extra=[]
          for row in calendar:
            token=f'"raceDate":"{row["raceDate"]}","venue":"{row["venue"]}"'
            if token not in existing: extra.append(row)
          if extra:
            html=html[:end]+','+','.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in extra)+html[end:]
          open(path,'w',encoding='utf-8').write('export const NORMAL_HOME_SNAPSHOT = '+json.dumps(html,ensure_ascii=False)+';\n')
          open('src/recent-home-calendar-snapshot.ts','w',encoding='utf-8').write(
            'export const RECENT_HOME_CALENDAR_SNAPSHOT = '+json.dumps(calendar,ensure_ascii=False,separators=(',',':'))+' as const;\n'
          )

          dates=[r[0] for r in con.execute('''
            SELECT DISTINCT race_date FROM rt_races
            WHERE race_date>=? AND race_date<=? ORDER BY race_date
          ''',(snapshot_start,snapshot_end)).fetchall()]
          day_snapshot={}
          for date in dates:
            races=[]; race_ids=[]
            for r in con.execute('''
              SELECT race_id,race_date,venue,race_no,race_name,start_time_jst,start_time_utc,surface,distance_m,status,refund_horse_nos_json
              FROM rt_races WHERE race_date=? ORDER BY venue,race_no
            ''',(date,)).fetchall():
              race_ids.append(str(r[0]))
              races.append({'raceId':str(r[0]),'raceDate':str(r[1]),'venue':str(r[2]),'raceNo':int(r[3]),'raceName':r[4],
                'startTimeJst':r[5],'startTimeUtc':r[6],'surface':r[7],'distanceM':None if r[8] is None else int(r[8]),
                'status':str(r[9]),'refundsJson':r[10]})
            state=con.execute('SELECT state_value FROM rt_system_state WHERE state_key=? LIMIT 1',(f'final_daily_selection:{date}',)).fetchone()
            selection=state[0] if state else None
            bets=[]
            if race_ids:
              marks=','.join('?' for _ in race_ids)
              for b in con.execute(f'''SELECT race_id,course,bet_type,combination,return_yen,settlement_status
                FROM rt_public_bets WHERE race_id IN ({marks}) ORDER BY race_id,id''',race_ids).fetchall():
                bets.append({'raceId':str(b[0]),'course':str(b[1]),'betType':str(b[2]),'combination':str(b[3]),
                  'returnYen':None if b[4] is None else int(b[4]),'settlementStatus':str(b[5])})
            day_snapshot[date]={'selection':selection,'races':races,'bets':bets}
          con.close()
          today=jst.isoformat()
          if today in day_snapshot:
            races=day_snapshot[today]['races']
            by={}
            for r in races: by[r['venue']]=by.get(r['venue'],0)+1
            if any(v!=12 for v in by.values()): raise SystemExit('TODAY_PROGRAM_INCOMPLETE:'+json.dumps(by,ensure_ascii=False))
            print('TODAY_SNAPSHOT',today,'RACES',len(races),'VENUES',by)
          open('src/recent-public-day-snapshot.ts','w',encoding='utf-8').write(
            'export const RECENT_PUBLIC_DAY_SNAPSHOT = '+json.dumps(day_snapshot,ensure_ascii=False,separators=(',',':'))+' as const;\n'
          )
          print('ROLLING_CALENDAR_ROWS',len(calendar),'DATES',dates,'ADDED',len(extra))
          PY
          npm run typecheck

      - name: Detect snapshot changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- src/normal-home-snapshot.ts src/recent-home-calendar-snapshot.ts src/recent-public-day-snapshot.ts; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy public Worker only when snapshot changed
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify production normal HTML and current day when present
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          code=$(curl --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 -sS -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' https://race-tantei-phase0.race-tantei.workers.dev/ || true)
          test "$code" = '200'
          grep -qi '<html' /tmp/home.html
          for marker in 'データを再接続しています' 'データ取得を再試行しています' 'データベースへ接続できない' '表示データの読み込みに失敗しました' '表示系の自動復旧モードです' '一時的にページを表示できません。'; do
            ! grep -q "$marker" /tmp/home.html
          done
          if grep -q "\"$today\"" src/recent-public-day-snapshot.ts; then
            curl --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$today" -o /tmp/day.json
            python3 - <<'PY'
          import datetime as dt,json
          today=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=9)).date().isoformat()
          body=json.load(open('/tmp/day.json',encoding='utf-8')); races=body.get('races') or []
          by={}
          for r in races: by[str(r.get('venue'))]=by.get(str(r.get('venue')),0)+1
          if not races or any(v!=12 for v in by.values()): raise SystemExit(f'PROD_DAY_INVALID:{today}:{len(races)}:{by}')
          print('PRODUCTION_DAY_OK',today,'RACES',len(races),'VENUES',by,'SOURCE',body.get('fallbackSource','live-d1'))
          PY
          fi

      - name: Persist verified snapshots
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/normal-home-snapshot.ts src/recent-home-calendar-snapshot.ts src/recent-public-day-snapshot.ts
          git commit -m 'ops: refresh rolling public race-day snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
