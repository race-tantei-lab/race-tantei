name: Research cash-first form x three race contexts (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install numpy pandas requests
      - name: Fetch pinned third-party monthly results
        run: |
          git clone --filter=blob:none https://github.com/Kenseimk/keiba-agent.git /tmp/keiba-agent
          git -C /tmp/keiba-agent checkout f552ca8628646f39b05ffdbdc3ab8734939ffd66
          mkdir -p external-jra-cash-decade
          find /tmp/keiba-agent -type f -name 'raceresults_*.csv' -exec cp {} external-jra-cash-decade/ \;
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -ge 80
      - name: Enumerate novel cash conditions
        run: python scripts/research-nov2026-form-context-fourway-cash.py
      - name: Preserve cash results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-context-fourway-cash-results
          path: |
            analysis-results/nov2026-form-context-fourway-cash-roi200.json
            analysis-results/nov2026-form-context-fourway-robust-cells.csv.gz
          if-no-files-found: warn
          retention-days: 7
