name: Run bounded live deadline hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-live-deadline-bounded.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/live-deadline-hotfix' -f description='Applying bounded live deadline hotfix' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Patch live worker
        run: python .github/scripts/hotfix-live-deadline-bounded.py
      - name: Validate patch
        run: |
          git diff --check
          npm run typecheck
          npx wrangler deploy --dry-run --config wrangler.live-deadline.jsonc --outdir dist-live-hotfix
          npx wrangler deploy --dry-run --config wrangler.live-deadline-backup.jsonc --outdir dist-live-hotfix-backup
      - name: Deploy live deadline workers
        run: |
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc
      - name: Persist patch
        shell: bash
        run: |
          git add src/v1/completed-worker-live-lock.ts src/live-deadline-entry-v2.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bound live deadline subrequests and preserve saved previews"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/live-deadline-hotfix' -f description='Bounded live deadline Workers deployed' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/live-deadline-hotfix' -f description='Bounded live deadline hotfix failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
