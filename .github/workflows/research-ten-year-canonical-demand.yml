name: Research ten-year canonical demand

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-ten-year-canonical-demand.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  demand:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mark research pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='research/ten-year-canonical-demand' \
            -f description='Pruning canonical rules and scanning ten-year preday demand' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - name: Download assembled ten-year history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assembled
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > assembled.zip
          unzip -q assembled.zip -d assembled
          test -s assembled/ten-year-history-corpus.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assembled/ten-year-history-assembly-meta.json').read_text())
          assert m['evaluationStart']=='2016-08-10',m
          assert m['evaluationEnd']=='2026-08-09',m
          assert m['evaluationRaceCount']==34566,m
          assert m['duplicateRaceIds']==0,m
          assert not m['incompleteEvaluationRaceIds'],m
          assert m['syntheticOddsUsed'] is False
          assert m['productionDatabaseWritten'] is False
          print(json.dumps(m,ensure_ascii=False))
          PY

      - name: Prove behavior-equivalent 316 to 297 pruning
        run: |
          set -euo pipefail
          python scripts/research-prune-canonical-rules.py \
            --out analysis-results/research-canonical-rules-297.json \
            --meta analysis-results/research-canonical-rules-297-meta.json

      - name: Scan exact ten-year preday selection and odds demand
        run: |
          set -euo pipefail
          python scripts/research-ten-year-canonical-demand.py \
            --corpus assembled/ten-year-history-corpus.jsonl \
            --rules analysis-results/research-canonical-rules-297.json \
            --out analysis-results/research-ten-year-canonical-demand.jsonl \
            --meta analysis-results/research-ten-year-canonical-demand-meta.json

      - name: Verify research-only demand outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis-results/research-canonical-rules-297-meta.json').read_text())
          d=json.loads(Path('analysis-results/research-ten-year-canonical-demand-meta.json').read_text())
          assert p['sourceRuleCount']==316 and p['survivingRuleCount']==297 and p['removedRuleCount']==19,p
          assert p['fullScoreBehaviorPreservedByLogicalDominance'] is True,p
          assert p['predayScoreBehaviorPreservedByLogicalDominance'] is True,p
          assert d['evaluationRaceCount']==34566,d
          assert d['sourceRuleCount']==297,d
          assert d['selectedRaces']==d['venueDays']*5,d
          assert d['structuralCancellationExceptions']==[{'date':'2020-03-29','venue':'中山','eligible':2}],d
          assert d['targetDayResultsUsedForSelection'] is False,d
          assert d['syntheticOddsUsed'] is False,d
          assert d['productionDatabaseWritten'] is False,d
          assert d['productionModelChanged'] is False,d
          print(json.dumps({'pruning':p,'demand':d},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: research-ten-year-canonical-demand
          path: |
            analysis-results/research-canonical-rules-297.json
            analysis-results/research-canonical-rules-297-meta.json
            analysis-results/research-ten-year-canonical-demand.jsonl
            analysis-results/research-ten-year-canonical-demand-meta.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark research success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='research/ten-year-canonical-demand' \
            -f description='297-rule proof and ten-year odds-demand scan completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark research failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='research/ten-year-canonical-demand' \
            -f description='Canonical demand scan requires targeted repair' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
