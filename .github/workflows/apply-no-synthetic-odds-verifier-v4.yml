name: Update synthetic odds verifier v4
on:
  push:
    branches:
      - fix/no-synthetic-odds-final-20260816
    paths:
      - .github/workflows/apply-no-synthetic-odds-verifier-v4.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-synthetic-odds-final-20260816
      - name: Update safety verifier
        run: |
          sed -i '/probability_fallback_persistent_deadline_guard/d' scripts/verify-live-lock-safety.py
          sed -i '/    production_wrapper = read/i\    require(guard, "DEADLINE_GUARD_OFFICIAL_ODDS_REQUIRED", "persistent deadline guard")\n    forbid(guard, "await commitFallback(env.DB, raceId, race, runners, now)", "persistent deadline guard")\n' scripts/verify-live-lock-safety.py
          python scripts/verify-live-lock-safety.py
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add scripts/verify-live-lock-safety.py
          git commit -m 'Verify deadline finals require official odds'
          git push origin HEAD:fix/no-synthetic-odds-final-20260816
