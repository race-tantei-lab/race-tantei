name: Research exhaustive 18-feature multi-valued cash intersections (isolated)
on:
  push:
    branches:
      - research/nov2026-all18-multivalue-full10-1112
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  direct-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned third-party research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - name: Preflight integrity and financial ledger arithmetic
        run: |
          python -m py_compile scripts/research-nov2026-all18-multivalue-cash.py
          python -u scripts/research-nov2026-all18-multivalue-cash.py --self-test
      - name: Restore read-only historical feature cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
            analysis-results
          key: historical-payout-mirror-v1
          restore-keys: |
            historical-payout-
      - name: Fetch immutable third-party 136 months payout CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/multivalue_cash_months
          cat /tmp/multivalue_cash_months | xargs -P 12 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 3 --max-time 45 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Enumerate all 18-category value intersections and financially settle frozen policy
        run: python -u scripts/research-nov2026-all18-multivalue-cash.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhaustive-multivalue-all10-cash-ledger
          path: |
            analysis-results/nov2026-categorical-all18-depth4-cash.json
            analysis-results/nov2026-categorical-all18-depth4-bets.csv.gz
            analysis-results/nov2026-categorical-all18-depth4-rules.csv.gz
          if-no-files-found: warn
          retention-days: 30
