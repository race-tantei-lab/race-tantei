name: Sep22 production readiness audit
on:
  push:
    branches:
      - diag/sep22-readiness-20260921
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify race-day gate
        run: |
          npx tsx - <<'TS'
          import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts';
          const d=new Date('2026-09-22T00:00:00+09:00');
          console.log('SEP22_GATE',JSON.stringify(await shouldRunOnJraRaceDay(d)));
          TS
      - name: Query Sep22 production D1
        shell: bash
        run: |
          set -euo pipefail
          q() { npx wrangler d1 execute race-tantei-phase0 --remote --json --command "$1"; }
          echo '=== PROGRAM ==='
          q "SELECT venue,COUNT(*) AS races,SUM(CASE WHEN start_time_utc IS NOT NULL THEN 1 ELSE 0 END) AS timed,SUM(CASE WHEN status IN ('cancelled','canceled','postponed') THEN 1 ELSE 0 END) AS inactive FROM rt_races WHERE race_date='2026-09-22' GROUP BY venue ORDER BY venue"
          echo '=== ENTRIES ==='
          q "WITH p AS (SELECT r.race_id,r.venue,r.race_no,r.start_time_jst,r.start_time_utc,r.status,LENGTH(TRIM(COALESCE(r.entry_url,'')))>0 AS hasEntry,SUM(CASE WHEN rr.race_id IS NOT NULL AND COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS active FROM rt_races r LEFT JOIN rt_runners rr ON rr.race_id=r.race_id WHERE r.race_date='2026-09-22' GROUP BY r.race_id,r.venue,r.race_no,r.start_time_jst,r.start_time_utc,r.status,r.entry_url) SELECT race_id AS raceId,venue,race_no AS raceNo,start_time_jst AS startTimeJst,start_time_utc AS startTimeUtc,status,hasEntry,active FROM p ORDER BY venue,raceNo"
          echo '=== SELECTION ==='
          q "SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS value FROM rt_system_state WHERE state_key IN ('final_daily_selection:2026-09-22','worker_upcoming_calendar_day:2026-09-22','live_deadline_driver:2026-09-22','live_deadline_primary_heartbeat:v2') ORDER BY state_key"
          echo '=== EXISTING BETS ==='
          q "SELECT b.race_id AS raceId,COUNT(*) AS rows,MIN(b.locked_at) AS firstLock,MAX(b.locked_at) AS lastLock FROM rt_public_bets b JOIN rt_races r ON r.race_id=b.race_id WHERE r.race_date='2026-09-22' GROUP BY b.race_id ORDER BY b.race_id"
      - name: Worker health and cron configs
        shell: bash
        run: |
          set -euo pipefail
          for u in             https://race-tantei-live-deadline.race-tantei.workers.dev/health             https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health             https://race-tantei-win5.race-tantei.workers.dev/health             https://race-tantei-win5-backup.race-tantei.workers.dev/health; do
            echo "=== $u ==="
            curl --max-time 15 -fsS "$u"; echo
          done
          echo '=== WRANGLER PRIMARY ==='; cat wrangler.live-deadline.jsonc
          echo '=== WRANGLER BACKUP ==='; cat wrangler.live-deadline-backup.jsonc
          echo '=== WRANGLER WIN5 ==='; cat wrangler.win5.jsonc
          echo '=== WRANGLER WIN5 BACKUP ==='; cat wrangler.win5-backup.jsonc
      - name: Public Sep22 API
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for p in             '/api/public/day?date=2026-09-22'             '/api/public/daily-performance?date=2026-09-22'             '/api/public/calendar'; do
            echo "=== $p ==="
            curl --compressed --max-time 15 -fsS -D /tmp/h "$base$p" -o /tmp/b
            grep -iE '^(HTTP/|content-type:|x-race-|cache-control:)' /tmp/h || true
            wc -c /tmp/b
            head -c 12000 /tmp/b; echo
          done
