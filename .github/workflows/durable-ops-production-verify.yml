name: Durable Autonomous Ops Production Verify

on:
  push:
    branches: [fix/durable-autonomous-race-ops]
    paths:
      - ".github/workflows/durable-ops-production-verify.yml"

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: python scripts/verify-live-lock-safety.py
      - run: python scripts/verify-production-d1-budget.py
      - run: python scripts/verify-live-preview-priority.py
      - run: python scripts/verify-bodyweight-final-lock.py
      - run: python scripts/verify-live-hardening-policy.py
      - run: npm run typecheck

      - name: Deploy durable primary and backup
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.live-deadline.jsonc
          npx wrangler deploy --config wrangler.live-deadline-backup.jsonc

      - name: Seed one first-good archive for existing current previews
        shell: bash
        run: |
          set -euo pipefail
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
          }
          today=$(TZ=Asia/Tokyo date +%F)
          q "INSERT INTO rt_live_preview_archive(race_id,envelope_json,newest_generated_at,archived_at)
             SELECT substr(s.state_key,length('worker_live_preview:')+1),s.state_value,
                    json_extract(s.state_value,'$.snapshots[0].generatedAt'),CURRENT_TIMESTAMP
             FROM rt_system_state s
             WHERE s.state_key LIKE 'worker_live_preview:'||'$today'||'%'
               AND json_extract(s.state_value,'$.snapshots[0].oddsSource') IN ('jra-fast-official','jra-crawl-official')
               AND NOT EXISTS (
                 SELECT 1 FROM rt_live_preview_archive a
                 WHERE a.race_id=substr(s.state_key,length('worker_live_preview:')+1)
               )" > /tmp/archive.json
          cat /tmp/archive.json

      - name: Verify autonomous ticks and durable coverage
        shell: bash
        run: |
          set -euo pipefail
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
          }
          today=$(TZ=Asia/Tokyo date +%F)
          SQL="WITH sel AS (
                 SELECT json_extract(j.value,'$.raceId') AS raceId
                 FROM rt_system_state s,json_each(json_extract(s.state_value,'$.selected')) j
                 WHERE s.state_key='final_daily_selection:$today'
               ),
               future AS (
                 SELECT r.race_id AS raceId
                 FROM rt_races r JOIN sel ON sel.raceId=r.race_id
                 WHERE r.start_time_utc>datetime('now')
               )
               SELECT datetime('now','+9 hours') AS jstNow,
                 (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_driver:$today') AS driverUpdatedAt,
                 (SELECT state_value FROM rt_system_state WHERE state_key='live_deadline_driver:$today') AS driver,
                 (SELECT updated_at FROM rt_system_state WHERE state_key='live_deadline_primary_heartbeat:v1') AS heartbeatUpdatedAt,
                 (SELECT COUNT(*) FROM future) AS futureCount,
                 (SELECT COUNT(*) FROM future f
                   WHERE EXISTS(SELECT 1 FROM rt_system_state p WHERE p.state_key='worker_live_preview:'||f.raceId)
                      OR (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=f.raceId AND b.source_prediction_id=-2)=6) AS protectedFutureCount,
                 (SELECT COUNT(*) FROM rt_system_state s
                   WHERE s.state_key LIKE 'worker_live_final:$today%'
                     AND json_extract(s.state_value,'$.oddsMode')='probability_fallback') AS probabilityFallbackFinals,
                 (SELECT COUNT(DISTINCT a.race_id) FROM rt_live_preview_archive a JOIN sel ON sel.raceId=a.race_id) AS archivedSelectedCount"
          q "$SQL" > /tmp/a.json
          cat /tmp/a.json
          sleep 65
          q "$SQL" > /tmp/b.json
          cat /tmp/b.json
          python3 - <<'PY'
          import json,datetime
          def row(p):
              x=json.load(open(p)); return ((x.get('result') or [{}])[0].get('results') or [{}])[0]
          a,b=row('/tmp/a.json'),row('/tmp/b.json')
          d=json.loads(b.get('driver') or '{}')
          assert b.get('driverUpdatedAt') and b.get('driverUpdatedAt') != a.get('driverUpdatedAt'), (a,b)
          assert d.get('version')=='live-deadline-v13-durable-official-lastgood-20260920', d
          assert d.get('phase')=='complete', d
          assert int(b.get('protectedFutureCount') or 0)==int(b.get('futureCount') or 0), b
          assert int(b.get('probabilityFallbackFinals') or 0)==0, b
          assert int(b.get('archivedSelectedCount') or 0)>=1, b
          hb=datetime.datetime.fromisoformat(str(b['heartbeatUpdatedAt']).replace(' ','T')+'+00:00')
          assert (datetime.datetime.now(datetime.timezone.utc)-hb).total_seconds()<150, (hb,b)
          print(json.dumps({'first':a,'second':b,'driverStatus':d.get('status'),'version':d.get('version')},ensure_ascii=False))
          PY

      - name: Verify health endpoints
        run: |
          set -euo pipefail
          for u in             https://race-tantei-live-deadline.race-tantei.workers.dev/health             https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health
          do
            body=$(curl -fsS "$u")
            echo "$body"
            echo "$body" | grep -q 'live-deadline-v13-durable-official-lastgood-20260920'
          done
