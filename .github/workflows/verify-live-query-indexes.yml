name: Verify live query indexes

on:
  push:
    branches: [main]
    paths:
      - "src/live-deadline-entry-v3.ts"
      - "src/v1/live-preview-safety.ts"
      - "src/v1/completed-final-invariants.ts"
      - "scripts/verify-live-lock-safety.py"
      - ".github/workflows/verify-live-query-indexes.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify production D1 live query indexes
        shell: bash
        run: |
          set -euo pipefail
          rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --config wrangler.live-deadline.jsonc --command "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('rt_idx_ml_horse_hist_lookup','rt_idx_ml_horse_total_lookup','rt_idx_ml_horse_surface_lookup','rt_idx_ml_horse_dist_lookup','rt_idx_ml_horse_venue_lookup','rt_idx_ml_jockey_lookup','rt_idx_ml_trainer_lookup','rt_idx_ml_pair_lookup') ORDER BY name")
          ROWS="$rows" python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ['ROWS'])
          rows = payload[0].get('results', []) if payload else []
          present = {str(row.get('name', '')) for row in rows}
          required = {
              'rt_idx_ml_horse_hist_lookup',
              'rt_idx_ml_horse_total_lookup',
              'rt_idx_ml_horse_surface_lookup',
              'rt_idx_ml_horse_dist_lookup',
              'rt_idx_ml_horse_venue_lookup',
              'rt_idx_ml_jockey_lookup',
              'rt_idx_ml_trainer_lookup',
              'rt_idx_ml_pair_lookup',
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit('LIVE_QUERY_INDEXES_MISSING:' + ','.join(missing))
          print('LIVE_QUERY_INDEXES_OK', len(required))
          PY
