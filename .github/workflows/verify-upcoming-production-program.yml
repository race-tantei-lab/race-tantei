name: Verify upcoming production program

on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * 4,5" # 21:35 JST Thu/Fri

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Inspect next three JST days in production D1
        shell: bash
        run: |
          set -euo pipefail
          for offset in 1 2 3; do
            date=$(TZ=Asia/Tokyo date -d "+${offset} day" +%F)
            echo "=== UPCOMING_DATE=$date OFFSET=$offset ==="
            npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
              "WITH p AS (
                 SELECT r.race_id,r.venue,r.race_no,r.race_name,r.entry_url,r.start_time_utc,r.surface,r.distance_m,
                        SUM(CASE WHEN rr.race_id IS NOT NULL AND COALESCE(rr.runner_status,'active')='active' THEN 1 ELSE 0 END) AS active
                 FROM rt_races r
                 LEFT JOIN rt_runners rr ON rr.race_id=r.race_id
                 WHERE r.race_date='$date'
                 GROUP BY r.race_id,r.venue,r.race_no,r.race_name,r.entry_url,r.start_time_utc,r.surface,r.distance_m
               )
               SELECT race_id AS raceId,venue,race_no AS raceNo,race_name AS raceName,
                      entry_url AS entryUrl,
                      CASE WHEN LENGTH(TRIM(COALESCE(entry_url,'')))>0 THEN 1 ELSE 0 END AS hasEntryUrl,
                      start_time_utc AS startTimeUtc,surface,distance_m AS distanceM,active
               FROM p ORDER BY venue,race_no" > "/tmp/upcoming-$offset.json"
            cat "/tmp/upcoming-$offset.json"
          done

      - name: Verify tomorrow race-day gate without D1
        shell: bash
        run: |
          set -euo pipefail
          tomorrow=$(TZ=Asia/Tokyo date -d '+1 day' +%F)
          TOMORROW="$tomorrow" npx --yes tsx -e "import { shouldRunOnJraRaceDay } from './src/v1/race-day-gate.ts'; (async()=>{const d=new Date(process.env.TOMORROW+'T03:00:00Z'); const r=await shouldRunOnJraRaceDay(d); console.log('TOMORROW_RACE_DAY_GATE',JSON.stringify(r)); if(!r.shouldRun) process.exit(2);})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Verify model and selection runtime state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command             "SELECT 'selection' AS state,key,value FROM rt_selection_state_meta
             WHERE key IN ('ready','modelVersion','generation','chunkCount','byteLength','throughDate')
             UNION ALL
             SELECT 'model' AS state,key,value FROM rt_ml_model_meta
             WHERE key IN ('ready','modelVersion','sourceSha256','generation','chunkCount','byteLength')
             ORDER BY state,key" > /tmp/runtime-state.json
          cat /tmp/runtime-state.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/runtime-state.json')); rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
              if isinstance(block,dict): rows += block.get('results') or []
          by={}
          for r in rows:
              by.setdefault(str(r.get('state')),{})[str(r.get('key'))]=str(r.get('value'))
          print('RUNTIME_STATE',by)
          if by.get('selection',{}).get('ready')!='1':
              raise SystemExit('SELECTION_STATE_NOT_READY')
          if by.get('selection',{}).get('modelVersion')!='ten-year-completed-model':
              raise SystemExit('SELECTION_MODEL_VERSION_BAD')
          if by.get('model',{}).get('ready')!='1':
              raise SystemExit('ML_MODEL_NOT_READY')
          if by.get('model',{}).get('modelVersion')!='ten-year-completed-model':
              raise SystemExit('ML_MODEL_VERSION_BAD')
          for kind in ('selection','model'):
              if int(by.get(kind,{}).get('chunkCount','0') or 0)<=0 or int(by.get(kind,{}).get('byteLength','0') or 0)<=0:
                  raise SystemExit(f'{kind.upper()}_STATE_META_INCOMPLETE')
          print('RUNTIME_STATE_READY')
          PY

      - name: Verify production Workers and cron ownership
        shell: bash
        run: |
          set -euo pipefail
          primary=$(curl --max-time 20 --retry 4 --retry-delay 2 --fail-with-body -sS 'https://race-tantei-live-deadline.race-tantei.workers.dev/health')
          backup=$(curl --max-time 20 --retry 4 --retry-delay 2 --fail-with-body -sS 'https://race-tantei-live-deadline-backup.race-tantei.workers.dev/health')
          PRIMARY="$primary" BACKUP="$backup" node - <<'NODE'
          const p=JSON.parse(process.env.PRIMARY||'{}');
          const b=JSON.parse(process.env.BACKUP||'{}');
          if(p.status!=='up'||b.status!=='up') throw new Error('LIVE_WORKER_NOT_UP');
          if(p.service!=='race-tantei-live-deadline'||b.service!=='race-tantei-live-deadline') throw new Error('LIVE_WORKER_SERVICE_BAD');
          if(!p.version||p.version!==b.version) throw new Error('LIVE_WORKER_VERSION_MISMATCH');
          console.log('LIVE_WORKERS_READY',JSON.stringify({version:p.version,primary:p.status,backup:b.status}));
          NODE

          check_schedule() {
            script="$1"; expected="$2"
            body=$(curl --max-time 20 --retry 4 --retry-delay 2 --fail-with-body -sS               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/schedules"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            BODY="$body" SCRIPT="$script" EXPECTED="$expected" node - <<'NODE'
          const b=JSON.parse(process.env.BODY||'{}');
          const s=Array.isArray(b.result?.schedules)?b.result.schedules.map(x=>String(x.cron)).sort():[];
          if(b.success!==true||s.length!==1||s[0]!==process.env.EXPECTED) throw new Error('CRON_BAD:'+process.env.SCRIPT+':'+JSON.stringify(s));
          console.log('CRON_READY',process.env.SCRIPT,process.env.EXPECTED);
          NODE
          }
          check_schedule 'race-tantei-phase0' '*/15 * * * *'
          check_schedule 'race-tantei-live-deadline' '* * * * *'
          check_schedule 'race-tantei-live-deadline-backup' '2-59/5 * * * *'

      - name: Dry-run tomorrow canonical race selection
        shell: bash
        run: |
          set -euo pipefail
          tomorrow=$(TZ=Asia/Tokyo date -d '+1 day' +%F)
          python scripts/generate-ten-year-preday-selection.py --date "$tomorrow" --out /tmp/tomorrow-selection.json
          python3 - <<'PY'
          import collections,json
          p=json.load(open('/tmp/tomorrow-selection.json'))
          selected=p.get('selected') or []
          by=collections.Counter(str(r.get('venue') or '') for r in selected)
          if p.get('sourceModel')!='ten-year-completed-model':
              raise SystemExit('DRY_SELECTION_MODEL_BAD')
          if p.get('resultDataUsedForTargetDay') is not False:
              raise SystemExit('DRY_SELECTION_TARGET_RESULT_LEAK')
          if len(by)!=2 or any(v!=5 for v in by.values()) or len(selected)!=10:
              raise SystemExit('DRY_SELECTION_COUNT_BAD:'+json.dumps(dict(by),ensure_ascii=False))
          print('TOMORROW_SELECTION_DRY_RUN_OK', {'selected':len(selected),'venues':dict(by),'raceIds':[r.get('raceId') for r in selected]})
          PY

      - name: Inspect public maintenance audit state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT state_key AS stateKey,state_value AS stateValue,updated_at AS updatedAt
             FROM rt_system_state
             WHERE state_key IN ('worker_upcoming_calendar_repair','worker_upcoming_entry_repair','worker_upcoming_entry_derived_repair')
             ORDER BY state_key" > /tmp/maintenance-state.json
          cat /tmp/maintenance-state.json

      - name: Require tomorrow card to be complete on Thu/Fri preparation runs
        shell: bash
        run: |
          set -euo pipefail
          weekday=$(TZ=Asia/Tokyo date +%u)
          if [ "$weekday" != "4" ] && [ "$weekday" != "5" ]; then
            echo "NOT_PREPARATION_DAY weekday=$weekday"
            exit 0
          fi
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/upcoming-1.json'))
          rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
              if isinstance(block,dict):
                  rows += block.get('results') or []
          venues=sorted({str(r.get('venue') or '') for r in rows if r.get('venue')})
          missing=[r for r in rows if
                   int(r.get('active') or 0)<3
                   or int(r.get('hasEntryUrl') or 0)!=1
                   or not str(r.get('startTimeUtc') or '').strip()
                   or not str(r.get('surface') or '').strip()
                   or int(r.get('distanceM') or 0)<=0]
          print('TOMORROW_PROGRAM', {'venues':venues,'races':len(rows),'ready':len(rows)-len(missing)})
          print('TOMORROW_MISSING', missing)
          # 2026-09-19 has two JRA venues (Nakayama/Hanshin), 12 races each.
          if len(venues)!=2 or len(rows)!=24 or missing:
              raise SystemExit(f'UPCOMING_PROGRAM_INCOMPLETE venues={len(venues)} races={len(rows)} missing={len(missing)}')
          print('UPCOMING_PROGRAM_READY races=24 ready=24 venues=2 metadata=complete')
          PY
