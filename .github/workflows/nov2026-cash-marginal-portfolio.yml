name: Research marginal cash portfolio
on:
  push:
    branches: [research/nov2026-cash-marginal-portfolio-1110]
    paths:
      - scripts/research-nov2026-cash-marginal-portfolio.py
      - .github/workflows/nov2026-cash-marginal-portfolio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Recover pinned third party data
        env:
          PINNED_REF: f552ca8628646f39b05ffdbdc3ab8734939ffd66
        run: |
          if test -s analysis-results/jra-decade-sixmarket-top10-cash-v3.npz && test -s analysis-results/jra-decade-sixmarket-top10-races-v3.json; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import os
          p=Path('external-jra-cash-decade');p.mkdir(exist_ok=True)
          for year in range(2015,2027):
              for month in range(1,13 if year<2026 else 5):
                  name=f'raceresults_{year}{month:02d}.csv'
                  url=f'https://raw.githubusercontent.com/Kenseimk/keiba-agent/{os.environ["PINNED_REF"]}/data/{name}'
                  urlretrieve(url,p/name)
                  if (p/name).stat().st_size<100:raise RuntimeError(name)
          PY
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('cash_source','scripts/research-nov2026-decade-roi-first-sixmarkets.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          common=m.mod('scripts/research-nov2026-sixmarket-real-paid-cash.py','cash_parser')
          races=m.read_all_races(common.parse_payments)
          m.CACHE.parent.mkdir(parents=True,exist_ok=True)
          m.full_features(races)
          PY
      - name: Settle marginal cash portfolio
        run: python -u scripts/research-nov2026-cash-marginal-portfolio.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginal-cash-portfolio
          path: analysis-results/nov2026-cash-marginal-portfolio.json
          if-no-files-found: warn
