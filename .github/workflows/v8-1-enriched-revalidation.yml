name: V8.1 enriched clean-data OOS revalidation
run-name: Enriched clean-data OOS · ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - V8 clean-data nested OOS revalidation
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v8-1-enriched-revalidation
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SOURCE_BASELINE_RUN_ID: ${{ github.event.workflow_run.id || 'manual' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de

    steps:
      - name: Publish enriched analysis start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state=pending \
            -f context='analysis/v8-enriched-oos' \
            -f description='準備中：拡張履歴特徴量と最終ホールドアウト検証' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Checkout repaired main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify enriched analysis source
        run: python -m py_compile scripts/analyze-v7-enriched-ranking.py

      - name: Publish model comparison status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state=pending \
            -f context='analysis/v8-enriched-oos' \
            -f description='処理中：point・pair・ensembleの月次OOS比較' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Run enriched chronological ranking analysis
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-v7-enriched-ranking.py 2>&1 | tee v8-1-enriched-analysis.log

      - name: Normalize enriched report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('v7-enriched-ranking-analysis.json')
          if not source.exists():
              raise SystemExit('V8_1_SOURCE_REPORT_MISSING')
          report = json.loads(source.read_text(encoding='utf-8'))
          report['generatedAt'] = datetime.now(timezone.utc).isoformat()
          report['modelVersion'] = 'v8.1-clean-data-enriched-ranking-final-holdout'
          report['productionChanged'] = False
          report['cleanDataGate'] = {
              'requiredBaselineWorkflow': 'V8 clean-data nested OOS revalidation',
              'sourceBaselineRunId': os.environ.get('SOURCE_BASELINE_RUN_ID'),
              'sourceSha': os.environ.get('STATUS_SHA'),
              'baselineHadToSucceed': True,
          }
          Path('v8-1-enriched-analysis.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload enriched report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-enriched-analysis
          path: |
            v8-1-enriched-analysis.json
            v8-1-enriched-analysis.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final enriched status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ] && [ -f v8-1-enriched-analysis.json ]; then
            STATE=success
            DESCRIPTION=$(python - <<'PY'
          import json
          report = json.load(open('v8-1-enriched-analysis.json', encoding='utf-8'))
          courses = report.get('courses', {})
          values = []
          for course, label in [('ライト', 'L'), ('スタンダード', 'S'), ('プレミアム', 'P')]:
              roi = float(courses.get(course, {}).get('finalHoldout', {}).get('roiPct', 0.0))
              values.append(f'{label}{roi:.1f}%')
          verdict = '採用可' if report.get('promotionEligible') else '採用不可'
          print('最終H/O：' + ' '.join(values) + ' / ' + verdict)
          PY
          )
          else
            STATE=failure
            DESCRIPTION='失敗：拡張OOS検証のログ確認が必要'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="$STATE" \
            -f context='analysis/v8-enriched-oos' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
