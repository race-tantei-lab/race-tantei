name: Canonical 56-feature LightGBM rolling data preflight (research only)
on:
  push:
    branches: [research/20261114-canonical-56feature-walkforward-v12]
    paths:
      - .github/workflows/research-canonical-56feature-walkforward-v12.yml
      - scripts/research-canonical-56feature-walkforward-v12.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned canonical model runtime
        run: python -m pip install --disable-pip-version-check "lightgbm==4.6.0" "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1"
      - name: Inspect existence of frozen historical inputs
        shell: bash
        run: |
          set -euo pipefail
          for k in FEATURE:9087261097 DEMAND:9074033903 HISTORY:9056288221 ODDS:9086766461; do
            label="${k%%:*}"
            id="${k#*:}"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq '{name,expired,size_in_bytes}' > "/tmp/${label}.json"; then
              echo "CANONICAL_ASSET_${label} $(cat "/tmp/${label}.json")"
            else
              echo "::error::CANONICAL_INPUT_MISSING:${label}:artifact_${id}"
              exit 14
            fi
          done
      - name: Download frozen historical official/JRA-derived research inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical/{features,demand,history,odds}
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9087261097/zip" >/tmp/runner.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9074033903/zip" >/tmp/demand.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9056288221/zip" >/tmp/history.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9086766461/zip" >/tmp/odds.zip
          unzip -q /tmp/runner.zip runner-ml-features.csv -d /tmp/canonical/features
          unzip -q /tmp/demand.zip demand.jsonl -d /tmp/canonical/demand
          unzip -q /tmp/history.zip ten-year-history-corpus.jsonl -d /tmp/canonical/history
          unzip -q /tmp/odds.zip 'corrected-odds/*.jsonl' -d /tmp/canonical/odds
          echo "CANONICAL_INPUTS_READY"
      - name: Test chronological 56-feature LightGBM research code
        run: |
          python -m py_compile scripts/research-canonical-56feature-walkforward-v12.py
          python scripts/research-canonical-56feature-walkforward-v12.py --self-test
      - name: Compare baseline vs freshly trained rolling 56-feature models
        run: |
          python -u scripts/research-canonical-56feature-walkforward-v12.py \
            --features /tmp/canonical/features/runner-ml-features.csv \
            --demand /tmp/canonical/demand/demand.jsonl \
            --history /tmp/canonical/history/ten-year-history-corpus.jsonl \
            --odds-dir /tmp/canonical/odds/corrected-odds \
            --output /tmp/canonical/research-56feature-rolling-v12.json
      - name: Upload all research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-56feature-walkforward-research-v12
          path: /tmp/canonical/research-56feature-rolling-v12.json
          if-no-files-found: warn
          retention-days: 30
