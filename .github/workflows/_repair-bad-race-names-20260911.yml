name: Repair bad race names 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/_repair-bad-race-names-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect bad race names before repair
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,race_name,entry_url FROM rt_races WHERE race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース') ORDER BY race_date DESC,race_no LIMIT 200" | tee /tmp/before.json
      - name: Build bounded official-name repair SQL
        run: |
          cat > /tmp/build-repair.ts <<'TS'
          import { writeFileSync } from 'node:fs';

          const mod = await import(process.cwd() + '/src/v1/jra-calendar.ts');
          const { parseOfficialCalendar, officialCalendarUrl } = mod;
          const dates = ['2026-09-12','2026-09-13'];
          const bad = `(race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース'))`;
          const q = (s: string) => `'${s.replaceAll("'", "''")}'`;
          const sql: string[] = ['BEGIN;'];
          for (const date of dates) {
            const url = officialCalendarUrl(date);
            const response = await fetch(url, { headers: { 'user-agent': 'race-tantei-name-repair/1.0' } });
            if (!response.ok) throw new Error(`JRA_CALENDAR_HTTP_${response.status}:${date}`);
            const html = await response.text();
            const races = parseOfficialCalendar(html, date, url);
            if (races.length < 12) throw new Error(`JRA_CALENDAR_TOO_FEW_RACES:${date}:${races.length}`);
            for (const race of races) {
              if (/検索|メニューを開く|JRAホーム|レース情報トップ/.test(race.raceName)) {
                throw new Error(`BAD_PARSED_RACE_NAME:${race.raceId}:${race.raceName}`);
              }
              sql.push(`UPDATE rt_races SET race_name=${q(race.raceName)}, updated_at=CURRENT_TIMESTAMP WHERE race_id=${q(race.raceId)} AND ${bad};`);
            }
          }
          sql.push('COMMIT;');
          writeFileSync('/tmp/repair.sql', sql.join('\n'));
          console.log(`repair_statements=${sql.length - 2}`);
          TS
          npx tsx /tmp/build-repair.ts
          sed -n '1,8p' /tmp/repair.sql
      - name: Apply official-name repair
        run: npx wrangler d1 execute race-tantei-phase0 --remote --file=/tmp/repair.sql
      - name: Verify current and upcoming rows are clean
        run: |
          result=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,race_name FROM rt_races WHERE race_date >= '2026-09-11' AND (race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース')) ORDER BY race_date,race_no")
          echo "$result"
          RESULT="$result" node - <<'NODE'
          const payload=JSON.parse(process.env.RESULT||'[]');
          const rows=(payload||[]).flatMap(x=>x.results||[]);
          if(rows.length) throw new Error(`BAD_RACE_NAMES_REMAIN:${JSON.stringify(rows)}`);
          console.log('BAD_RACE_NAMES_CURRENT_UPCOMING=0');
          NODE
