name: Repair bad race names 2026-09-11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_repair-bad-race-names-20260911.yml'
      - 'src/v1/jra.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect bad race names before repair
        run: |
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,race_name,entry_url FROM rt_races WHERE race_date IN ('2026-09-12','2026-09-13') AND (race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース')) ORDER BY race_date,venue,race_no" | tee /tmp/before.json
      - name: Build bounded official entry-page repair SQL
        run: |
          cat > /tmp/build-repair.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          type BadRow = { race_id: string; race_date: string; venue: string; race_no: number; race_name: string; entry_url: string | null };
          const suspicious = (value: string) => /検索|メニューを開く|JRAホーム|レース情報トップ|^(?:出馬表|レース)$/.test(String(value || '').trim());
          const q = (s: string) => `'${String(s).replaceAll("'", "''")}'`;

          async function main() {
            const payload = JSON.parse(readFileSync('/tmp/before.json', 'utf8')) as Array<{ results?: BadRow[] }>;
            const rows = payload.flatMap((part) => part.results ?? []);
            const mod = await import(pathToFileURL(process.cwd() + '/src/v1/jra.ts').href);
            const { fetchJraPage, parseEntryPage } = mod;
            const sql: string[] = ['BEGIN;'];
            let repaired = 0;
            for (const row of rows) {
              if (!row.entry_url) throw new Error(`ENTRY_URL_MISSING:${row.race_id}`);
              const host = new URL(row.entry_url).hostname;
              if (!['www.jra.go.jp','jra.jp','sp.jra.jp'].includes(host)) throw new Error(`NON_JRA_ENTRY_URL:${row.race_id}:${host}`);
              const page = await fetchJraPage(row.entry_url);
              const bundle = parseEntryPage(page.html, page.url);
              const race = bundle.race;
              if (race.raceDate !== row.race_date || race.venue !== row.venue || Number(race.raceNo) !== Number(row.race_no)) {
                throw new Error(`IDENTITY_MISMATCH:${row.race_id}:${race.raceDate}:${race.venue}:${race.raceNo}`);
              }
              if (suspicious(race.raceName) || /^\d+レース$/.test(race.raceName)) {
                throw new Error(`BAD_OFFICIAL_ENTRY_NAME:${row.race_id}:${race.raceName}`);
              }
              sql.push(`UPDATE rt_races SET race_name=${q(race.raceName)},updated_at=CURRENT_TIMESTAMP WHERE race_id=${q(row.race_id)} AND (race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース'));`);
              repaired += 1;
              console.log(`${row.race_id}: ${row.race_name} -> ${race.raceName}`);
            }
            sql.push('COMMIT;');
            writeFileSync('/tmp/repair.sql', sql.join('\n'));
            console.log(`bad_rows=${rows.length} repair_statements=${repaired}`);
            if (rows.length > 0 && repaired !== rows.length) throw new Error(`INCOMPLETE_REPAIR_PLAN:${repaired}/${rows.length}`);
          }

          main().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx /tmp/build-repair.ts
      - name: Apply official-name repair
        run: npx wrangler d1 execute race-tantei-phase0 --remote --file=/tmp/repair.sql
      - name: Verify current and upcoming rows are clean
        run: |
          result=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,race_name FROM rt_races WHERE race_date IN ('2026-09-12','2026-09-13') AND (race_name LIKE '%検索%' OR race_name IN ('メニューを開く','JRAホーム','レース情報トップ','出馬表','レース')) ORDER BY race_date,venue,race_no")
          echo "$result"
          RESULT="$result" node - <<'NODE'
          const payload=JSON.parse(process.env.RESULT||'[]');
          const rows=(payload||[]).flatMap(x=>x.results||[]);
          if(rows.length) throw new Error(`BAD_RACE_NAMES_REMAIN:${JSON.stringify(rows)}`);
          console.log('BAD_RACE_NAMES_CURRENT_UPCOMING=0');
          NODE
