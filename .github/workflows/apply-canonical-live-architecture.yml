name: Apply canonical live architecture manifest

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-canonical-live-architecture.py"
      - ".github/workflows/apply-canonical-live-architecture.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-live-architecture
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical manifest
        run: python scripts/patch-canonical-live-architecture.py
      - name: Commit canonical manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/canonical-production-manifest.json
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m 'Update canonical live deadline architecture'
          git push origin HEAD:main
