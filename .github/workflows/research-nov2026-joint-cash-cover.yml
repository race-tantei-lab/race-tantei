name: Research joint cash venue-day coverage (manual)
on:
  workflow_dispatch:
jobs:
  cash-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Run new joint-cash study (fail closed on missing historical inputs)
        run: python scripts/research-nov2026-joint-cash-cover.py
      - name: Preserve actual cash results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov2026-joint-cash-cover
          path: |
            analysis-results/nov2026-joint-cash-cover.json
            analysis-results/nov2026-joint-cash-cover-bets.csv.gz
          if-no-files-found: warn
