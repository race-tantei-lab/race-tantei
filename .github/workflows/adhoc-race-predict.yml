name: Compute isolated requested race predictions
on:
  schedule:
    # Off the top of the hour to reduce GitHub scheduler contention.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["feature/adhoc-race-request-20261024"]
    paths:
      - ".github/workflows/adhoc-race-predict.yml"
      - "scripts/adhoc-race-runner.mjs"
permissions:
  contents: read
concurrency:
  group: adhoc-race-prediction
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lightweight peek; zero ML/D1 history reads without a queued job
        id: peek
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,sys
          # Push on the feature branch checks syntax only and NEVER touches production.
          if os.getenv("GITHUB_EVENT_NAME")=="push":
            print("FEATURE_BRANCH_BUILD_ONLY")
            with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("pending=no\n")
            sys.exit(0)
          acc="3c6d1826b573b2e68cb13ec37e9e8ade"
          db="949b5e8b-d1a4-4c4e-80d1-d031afdc03de"
          url=f"https://api.cloudflare.com/client/v4/accounts/{acc}/d1/database/{db}/query"
          payload={"sql":"SELECT race_id FROM rt_adhoc_requests WHERE status='queued' LIMIT 1"}
          req=urllib.request.Request(url,method="POST",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=25) as f:result=json.load(f)
            if not result.get("success"):raise ValueError("D1_REJECTED")
            pending=bool((result.get("result")or[{}])[0].get("results"))
          except Exception as e:
            print("ADHOC_QUEUE_UNAVAILABLE_FAIL_CLOSED",type(e).__name__)
            pending=False
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("pending="+("yes" if pending else "no")+"\n")
          print("ADHOC_QUEUE_HAS_WORK",pending)
          PY
      - uses: actions/setup-node@v4
        if: steps.peek.outputs.pending == 'yes' || github.event_name == 'push'
        with:
          node-version: "22"
          cache: npm
      - name: Compile canonical model shared TS without modifying source
        if: steps.peek.outputs.pending == 'yes' || github.event_name == 'push'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:test
          npm run typecheck
          node --check scripts/adhoc-race-runner.mjs
      - name: Compute at most one queued race with quota guards
        if: steps.peek.outputs.pending == 'yes'
        timeout-minutes: 8
        run: node scripts/adhoc-race-runner.mjs
