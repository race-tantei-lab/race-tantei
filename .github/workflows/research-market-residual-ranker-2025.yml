name: Research market residual ranker with historical JRA FINAL win odds (not T15)

on:
  pull_request:
    branches:
      - research/structural-ranker-twohead-20261108
    paths:
      - scripts/research-market-residual-ranker-2025.py
      - .github/workflows/research-market-residual-ranker-2025.yml

permissions:
  contents: read

concurrency:
  group: market-residual-historical-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market-model-retrospective-not-t15:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact historical research packages
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1'
      - name: Syntax and market implied probability checks
        run: |
          python -m py_compile scripts/research-market-residual-ranker-2025.py
          python -u scripts/research-market-residual-ranker-2025.py --self-test
      - name: Train separate market price-aware ranked horse and ticket payoff models, verify against 2025 true JRA returns
        run: python -u scripts/research-market-residual-ranker-2025.py
      - name: Keep retrospective market model report with explicit NOT pre-T15 qualifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-residual-final-win-odds-exploratory-not-t15-roi
          path: analysis-results/market-relative-ranking-2025-exploratory-close-odds.json
          if-no-files-found: warn
          retention-days: 30
