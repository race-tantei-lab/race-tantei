name: Research chronological holdout of joint cash policy (read only)
on:
  push:
    branches:
      - research/20261114-chronological-joint-cash-holdout
    paths:
      - scripts/research-20261114-joint-cash-chronological-holdout.py
      - .github/workflows/research-20261114-joint-cash-chronological-holdout.yml
permissions:
  contents: read
jobs:
  chronological-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - name: Check cutoff and strict cash metrics
        run: |
          python -m py_compile scripts/research-20261114-joint-cash-chronological-holdout.py
          python scripts/research-20261114-joint-cash-chronological-holdout.py --self-test
      - name: Restore payout cache if available
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
            analysis-results
          key: historical-payout-mirror-v1
          restore-keys: historical-payout-
      - name: Load pinned 136-month research payout archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/holdout_months
          cat /tmp/holdout_months | xargs -P 8 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Train venue-quarter method switching on data before 2025 then independently replay 2025-2026
        run: python -u scripts/research-20261114-joint-cash-chronological-holdout.py
      - name: Upload read-only holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronological-joint-cash-2025-2026-holdout
          path: |
            analysis-results/20261114-chronological-joint-oos-2025-2026.json
            analysis-results/20261114-chronological-joint-oos-2025-2026-ledger.csv.gz
          if-no-files-found: warn
          retention-days: 30
