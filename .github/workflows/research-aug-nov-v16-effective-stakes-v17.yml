name: Investigate positive-stake selection coverage for strict Aug-Nov holdout
on:
  push:
    branches: [research/20261115-aug-nov-v16-live-cash-v17]
    paths: [.github/workflows/research-aug-nov-v16-effective-stakes-v17.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Read-only inspect exact settled stake and odds coverage
        run: |
          python - <<'PY'
          import json,os,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; d=os.environ['CLOUDFLARE_D1_DATABASE_ID']
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{d}/query'
          def q(sql):
              assert sql.strip().upper().startswith('SELECT')
              req=urllib.request.Request(u,method='POST',data=json.dumps({'sql':sql,'params':[]}).encode(),
                headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(req,timeout=50) as f:r=json.load(f)
              if not r.get('success'):raise RuntimeError(str(r.get('errors')))
              return (r.get('result') or [{}])[0].get('results',[])
          items={
            'stake_groups':"SELECT CAST(stake_yen AS TEXT) stake,COUNT(*) n,SUM(return_yen) AS paid FROM rt_public_bets WHERE course='ライト' AND race_id>='2026-08-01-' AND race_id<'2026-11-15-' AND source_prediction_id=-2 GROUP BY stake_yen ORDER BY stake_yen",
            'bet_types':"SELECT bet_type, COUNT(*) n,COUNT(DISTINCT race_id) races,COUNT(DISTINCT CASE WHEN stake_yen=1000 THEN race_id END) fullstake_races FROM rt_public_bets WHERE course='ライト' AND race_id>='2026-08-01-' AND race_id<'2026-11-15-' AND source_prediction_id=-2 GROUP BY bet_type ORDER BY n DESC",
            'odds_status':"SELECT COUNT(*) n, SUM(CASE WHEN assumed_odds IS NULL THEN 1 ELSE 0 END) missingOdds,SUM(CASE WHEN assumed_odds<=0 THEN 1 ELSE 0 END) badOdds,SUM(CASE WHEN locked_at IS NULL THEN 1 ELSE 0 END) missingLocks FROM rt_public_bets WHERE course='ライト' AND race_id>='2026-08-01-' AND race_id<'2026-11-15-' AND source_prediction_id=-2",
            'selected_sample':"SELECT state_key, SUBSTR(state_value,1,2600) state_sample FROM rt_system_state WHERE state_key='final_daily_selection:2026-11-14'"
          }
          for key,sql in items.items():
              print('AUGNOV_STAKE_AUDIT',json.dumps({'key':key,'rows':q(sql)},ensure_ascii=False),flush=True)
          PY
