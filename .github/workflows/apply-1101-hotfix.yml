name: One-time D1 export audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-1101-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export production D1 without rows_read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python3 - <<'PY'
          import json, os, sqlite3, time, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; dbid=os.environ['CLOUDFLARE_D1_DATABASE_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/export'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def post(payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
              if not body.get('success'): raise RuntimeError(body)
              return body.get('result') or {}
          tables=['rt_races','rt_public_bets','rt_system_state','rt_live_preview_archive','rt_official_odds_latest','rt_official_odds_snapshots']
          result=post({'output_format':'polling','dump_options':{'tables':tables}}); bookmark=result.get('at_bookmark')
          for _ in range(120):
              signed=(result.get('result') or {}).get('signed_url')
              if signed: break
              time.sleep(2); result=post({'output_format':'polling','current_bookmark':bookmark,'dump_options':{'tables':tables}})
          signed=(result.get('result') or {}).get('signed_url')
          if not signed: raise RuntimeError('EXPORT_SIGNED_URL_MISSING')
          with urllib.request.urlopen(signed,timeout=240) as r: sql=r.read().decode('utf-8')
          con=sqlite3.connect(':memory:'); con.executescript(sql); con.row_factory=sqlite3.Row
          day='2026-09-05'; sel=con.execute('SELECT state_value FROM rt_system_state WHERE state_key=?',(f'final_daily_selection:{day}',)).fetchone()
          selected=[]
          if sel: selected=[str(x.get('raceId')) for x in json.loads(sel['state_value']).get('selected',[]) if x.get('raceId')]
          selected=list(dict.fromkeys(selected)); ph=','.join('?' for _ in selected) or "''"
          def schema(t): return [dict(x) for x in con.execute(f"PRAGMA table_info('{t}')")]
          def rows_for(t):
              cols={x['name'] for x in schema(t)}
              if 'race_id' not in cols or not selected: return []
              return [dict(x) for x in con.execute(f'SELECT * FROM {t} WHERE race_id IN ({ph}) ORDER BY race_id',selected)]
          payload={
            'selected':selected,
            'races':[dict(x) for x in con.execute(f'SELECT race_id,venue,race_no,start_time_utc FROM rt_races WHERE race_id IN ({ph}) ORDER BY start_time_utc',selected)] if selected else [],
            'publicBets':rows_for('rt_public_bets'),
            'previewArchives':rows_for('rt_live_preview_archive'),
            'officialOddsLatest':rows_for('rt_official_odds_latest'),
            'officialOddsSnapshots':rows_for('rt_official_odds_snapshots'),
            'schemas':{t:schema(t) for t in ['rt_live_preview_archive','rt_official_odds_latest','rt_official_odds_snapshots']},
            'indexes':{t:[dict(x) for x in con.execute(f"PRAGMA index_list('{t}')")] for t in ['rt_races','rt_public_bets','rt_live_preview_archive']},
            'driverStates':[dict(x) for x in con.execute("SELECT state_key,state_value,updated_at FROM rt_system_state WHERE state_key LIKE 'live_deadline_driver:%' OR state_key LIKE 'worker_live_preview:%' OR state_key LIKE 'worker_live_final:%' ORDER BY state_key")],
          }
          open('audit-output/emergency-live-export.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2))
          print(json.dumps({
            'selected':len(selected),
            'publicBetRows':len(payload['publicBets']),
            'archiveRows':len(payload['previewArchives']),
            'oddsLatestRows':len(payload['officialOddsLatest']),
            'oddsSnapshotRows':len(payload['officialOddsSnapshots']),
            'archiveRaceIds':sorted(set(str(x.get('race_id')) for x in payload['previewArchives'])),
            'oddsLatestRaceIds':sorted(set(str(x.get('race_id')) for x in payload['officialOddsLatest'])),
          },ensure_ascii=False))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: emergency-live-export-20260905
          path: audit-output/emergency-live-export.json
          if-no-files-found: error
          retention-days: 1
