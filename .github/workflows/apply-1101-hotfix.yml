name: Audit persistent D1 indexes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify persistent production indexes without writes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('rt_idx_races_date','rt_idx_public_bets_race','rt_idx_public_bets_settlement','rt_idx_ml_horse_hist_lookup','rt_idx_ml_horse_total_lookup','rt_idx_ml_horse_surface_lookup','rt_idx_ml_horse_dist_lookup','rt_idx_ml_horse_venue_lookup','rt_idx_ml_jockey_lookup','rt_idx_ml_trainer_lookup','rt_idx_ml_pair_lookup') ORDER BY name" \
            > /tmp/indexes.json
          python3 - <<'PY'
          import json
          required={'rt_idx_races_date','rt_idx_public_bets_race','rt_idx_public_bets_settlement','rt_idx_ml_horse_hist_lookup','rt_idx_ml_horse_total_lookup','rt_idx_ml_horse_surface_lookup','rt_idx_ml_horse_dist_lookup','rt_idx_ml_horse_venue_lookup','rt_idx_ml_jockey_lookup','rt_idx_ml_trainer_lookup','rt_idx_ml_pair_lookup'}
          raw=json.load(open('/tmp/indexes.json')); rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
            if isinstance(block,dict): rows += block.get('results') or []
          found={str(r.get('name')) for r in rows}; missing=sorted(required-found)
          print('PERSISTENT_INDEXES_FOUND',sorted(found))
          if missing: raise SystemExit('MISSING_PREPROVISIONED_INDEXES:'+','.join(missing))
          print('PERSISTENT_INDEX_AUDIT_OK')
          PY
