name: Deploy live deadline Workers
# Persistent D1 schema is installed once per deploy; race-day cron paths are DDL-free.

on:
  push:
    branches: [main]
    paths:
      - "src/live-deadline-entry-v2.ts"
      - "src/live-deadline-entry-v3.ts"
      - "src/v1/live-preview-safety.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/v1/completed-selection-runtime.ts"
      - "src/v1/completed-final-invariants.ts"
      - "src/v1/upcoming-entry-derived-repair.ts"
      - "src/v1/jra-official-odds-fetch.ts"
      - "src/v1/jra-official-odds-fast.ts"
      - "src/v1/jra-official-odds.ts"
      - "tests/jra-official-odds-fetch-tests.ts"
      - "tests/completed-worker-deadline-guard-tests.ts"
      - "scripts/install-race-day-runtime-guards.sql"
      - "scripts/verify-live-lock-safety.py"
      - "wrangler.live-deadline.jsonc"
      - "wrangler.live-deadline-backup.jsonc"
      - ".github/workflows/deploy-live-deadline.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

concurrency:
  group: deploy-race-tantei-live-deadline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify static live isolation and quota safety
        run: python3 scripts/verify-live-lock-safety.py
      - name: Verify live deadline regression suite
        run: |
          npx --yes tsx tests/jra-official-odds-fetch-tests.ts
          npx --yes tsx tests/completed-worker-deadline-guard-tests.ts
      - name: Install persistent D1 runtime guards once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --file=scripts/install-race-day-runtime-guards.sql
      - name: Verify persistent D1 runtime guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command \
            "SELECT type,name FROM sqlite_master WHERE name IN ('rt_live_preview_archive','idx_live_preview_archive_race_id','rt_live_deadline_lease','rt_guard_final_bet_insert_deadline','rt_guard_final_state_insert_deadline','rt_guard_locked_public_bet_terms','rt_guard_locked_worker_final_state','rt_guard_probability_fallback_final_insert','rt_guard_probability_fallback_final_update','rt_guard_official_odds_final_insert','rt_guard_official_odds_final_update','rt_ignore_unchanged_system_state','rt_ignore_unchanged_runner','rt_ignore_unchanged_race','rt_ignore_unchanged_race_source','rt_ignore_unchanged_result','rt_ignore_unchanged_payout') ORDER BY type,name" > /tmp/runtime-guards.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/runtime-guards.json'))
          rows=[]
          for block in raw if isinstance(raw,list) else [raw]:
            if isinstance(block,dict): rows += block.get('results') or []
          found={str(r.get('name')) for r in rows}
          required={
            'rt_live_preview_archive','idx_live_preview_archive_race_id','rt_live_deadline_lease',
            'rt_guard_final_bet_insert_deadline','rt_guard_final_state_insert_deadline',
            'rt_guard_locked_public_bet_terms','rt_guard_locked_worker_final_state',
            'rt_guard_probability_fallback_final_insert','rt_guard_probability_fallback_final_update',
            'rt_guard_official_odds_final_insert','rt_guard_official_odds_final_update',
            'rt_ignore_unchanged_system_state','rt_ignore_unchanged_runner','rt_ignore_unchanged_race',
            'rt_ignore_unchanged_race_source','rt_ignore_unchanged_result','rt_ignore_unchanged_payout'
          }
          missing=sorted(required-found)
          print('RUNTIME_GUARDS_FOUND',sorted(found))
          if missing: raise SystemExit('RUNTIME_GUARDS_MISSING:'+','.join(missing))
          print('RUNTIME_GUARDS_OK')
          PY
      - name: Validate primary isolated Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.live-deadline.jsonc --outdir dist-live-deadline
      - name: Validate backup isolated Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.live-deadline-backup.jsonc --outdir dist-live-deadline-backup
      - name: Deploy primary live deadline Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.live-deadline.jsonc
      - name: Deploy backup live deadline Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.live-deadline-backup.jsonc
      - name: Mark dual live deadline deploy success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/live-deadline' \
            -f description='Primary and standby live deadline Workers deployed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark dual live deadline deploy failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/live-deadline' \
            -f description='Live deadline Worker deployment failed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
