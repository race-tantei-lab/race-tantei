name: Deploy live deadline Worker

on:
  push:
    branches: [main]
    paths:
      - "src/live-deadline-entry-v1.ts"
      - "src/v1/completed-worker-live-lock.ts"
      - "src/v1/completed-worker-deadline-guard.ts"
      - "src/v1/completed-selection-runtime.ts"
      - "src/v1/completed-final-invariants.ts"
      - "src/v1/jra-official-odds-fetch.ts"
      - "wrangler.live-deadline.jsonc"
      - ".github/workflows/deploy-live-deadline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-race-tantei-live-deadline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate isolated Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.live-deadline.jsonc --outdir dist-live-deadline
      - name: Deploy isolated live deadline Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c6d1826b573b2e68cb13ec37e9e8ade
          command: deploy --config wrangler.live-deadline.jsonc
