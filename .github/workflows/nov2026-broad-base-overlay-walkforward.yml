name: Research broad coverage cash base plus overlay (isolated)
on:
  push:
    branches:
      - research/nov2026-broad-base-overlay-walkforward-1111
    paths:
      - scripts/research-nov2026-broad-base-overlay-walkforward.py
      - .github/workflows/nov2026-broad-base-overlay-walkforward.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  broad-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - run: python -u scripts/research-nov2026-broad-base-overlay-walkforward.py --self-test
      - uses: actions/cache@v4
        with:
          path: |
            analysis-results/jra-decade-sixmarket-top10-cash-v3.npz
            analysis-results/jra-decade-sixmarket-top10-races-v3.json
          key: pinned-thirdparty-jra-2015-2026-ten-runner-six-market-cache-v1
      - name: Restore immutable historical third-party payout mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/broad_csv_months
          cat /tmp/broad_csv_months | xargs -P 12 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 3 --max-time 45 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Walk-forward all six-market actual paid cash and five-race coverage
        run: python -u scripts/research-nov2026-broad-base-overlay-walkforward.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-base-overlay-sixmarket-real-cash
          path: |
            analysis-results/nov2026-broad-base-overlay-walkforward.json
            analysis-results/nov2026-broad-base-overlay-bets.csv.gz
          if-no-files-found: warn
          retention-days: 30
