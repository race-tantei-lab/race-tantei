name: Research sparse walk-forward discovery

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-sparse-walkforward-discovery.yml"
      - "scripts/research-sparse-walkforward-run.py"
      - "scripts/research-sparse-walkforward-demand.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mark discovery pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/sparse-walk-forward-discovery' \
            -f description='Discovering sparse rules using prior data only' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4

      - name: Download ten-year corpus with warmup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip ten-year-history-corpus.jsonl ten-year-history-assembly-meta.json -d history
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('history/ten-year-history-assembly-meta.json').read_text())
          assert m['corpusStart']=='2015-01-04',m
          assert m['evaluationStart']=='2016-08-10',m
          assert m['evaluationEnd']=='2026-08-09',m
          assert m['corpusRaceCount']==40155,m
          assert m['evaluationRaceCount']==34566,m
          assert m['productionDatabaseWritten'] is False,m
          print(json.dumps(m,ensure_ascii=False))
          PY

      - name: Discover quarterly sparse rules and demand
        run: |
          set -euo pipefail
          python scripts/research-sparse-walkforward-run.py \
            --corpus history/ten-year-history-corpus.jsonl \
            --out analysis-results/research-sparse-walkforward-demand.jsonl \
            --rules-out analysis-results/research-sparse-walkforward-rules.json \
            --meta analysis-results/research-sparse-walkforward-meta.json

      - name: Print verification diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-sparse-walkforward-meta.json').read_text())
          rules=json.loads(Path('analysis-results/research-sparse-walkforward-rules.json').read_text())
          eval_start=m['evaluationStart']; eval_end=m['evaluationEnd']
          schedule=collections.Counter()
          with Path('history/ten-year-history-corpus.jsonl').open(encoding='utf-8') as fh:
            for line in fh:
              if not line.strip(): continue
              b=json.loads(line); r=b['race']; d=str(r.get('raceDate') or '')
              if eval_start<=d<=eval_end: schedule[(d,str(r.get('venue')))] += 1
          structural=[{'date':d,'venue':v,'eligible':n} for (d,v),n in sorted(schedule.items()) if n<5]
          expected_selected=sum(5 for n in schedule.values() if n>=5)
          eval_rules=[x for x in rules if x['startDate']>=eval_start]
          diag={
            'meta':m,
            'evaluationVenueDays':len(schedule),
            'expectedSelectedRaces':expected_selected,
            'structuralShortVenueDays':structural,
            'ruleRows':len(rules),
            'evaluationFolds':len(eval_rules),
            'maxObservedRuleCount':max((x['ruleCount'] for x in eval_rules),default=0),
            'maxObservedPredicateCount':max((x['predicateCount'] for x in eval_rules),default=0),
            'offendingFolds':[{'fold':x['fold'],'startDate':x['startDate'],'ruleCount':x['ruleCount'],'predicateCount':x['predicateCount']} for x in eval_rules if x['ruleCount']>m['maxRulesPerFold'] or x['predicateCount']>m['maxRulesPerFold']*m['maxPredicatesPerRule']],
          }
          Path('analysis-results/research-sparse-walkforward-diagnostics.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(diag,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-sparse-walkforward-discovery-diagnostics
          path: |
            analysis-results/research-sparse-walkforward-demand.jsonl
            analysis-results/research-sparse-walkforward-rules.json
            analysis-results/research-sparse-walkforward-meta.json
            analysis-results/research-sparse-walkforward-diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify no future leakage and immutable research mode
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json
          from pathlib import Path
          m=json.loads(Path('analysis-results/research-sparse-walkforward-meta.json').read_text())
          assert m['evaluationStart']=='2016-08-10',m
          assert m['evaluationEnd']=='2026-08-09',m
          schedule=collections.Counter()
          with Path('history/ten-year-history-corpus.jsonl').open(encoding='utf-8') as fh:
            for line in fh:
              if not line.strip(): continue
              b=json.loads(line); r=b['race']; d=str(r.get('raceDate') or '')
              if m['evaluationStart']<=d<=m['evaluationEnd']: schedule[(d,str(r.get('venue')))] += 1
          structural=[{'date':d,'venue':v,'eligible':n} for (d,v),n in sorted(schedule.items()) if n<5]
          expected_selected=sum(5 for n in schedule.values() if n>=5)
          assert structural==[{'date':'2020-03-29','venue':'中山','eligible':2}],structural
          assert expected_selected==14410,expected_selected
          assert m['selectedRaces']==expected_selected,(m['selectedRaces'],expected_selected)
          assert m['constraintBackfillCount']==0,m['constraintBackfillCount']
          assert m['targetDayResultsUsedForSelection'] is False,m
          assert m['historicalFinalOddsUsedForDiscovery'] is False,m
          assert m['syntheticOddsUsed'] is False,m
          assert m['productionDatabaseWritten'] is False,m
          assert m['productionModelChanged'] is False,m
          rules=json.loads(Path('analysis-results/research-sparse-walkforward-rules.json').read_text())
          eval_rules=[x for x in rules if x['startDate']>=m['evaluationStart']]
          assert len(eval_rules)==41,len(eval_rules)
          assert all(x['ruleCount']<=m['maxRulesPerFold'] and x['predicateCount']<=m['maxRulesPerFold']*m['maxPredicatesPerRule'] for x in eval_rules),eval_rules
          print(json.dumps({'selected':m['selectedRaces'],'expectedSelected':expected_selected,'proxyRoi':m['proxyTicketRoiPct'],'backfills':m['constraintBackfillCount'],'evaluationFolds':len(eval_rules)},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: research-sparse-walkforward-discovery
          path: |
            analysis-results/research-sparse-walkforward-demand.jsonl
            analysis-results/research-sparse-walkforward-rules.json
            analysis-results/research-sparse-walkforward-meta.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark discovery success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/sparse-walk-forward-discovery' \
            -f description='Sparse walk-forward discovery completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Mark discovery failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/sparse-walk-forward-discovery' \
            -f description='Sparse walk-forward discovery requires targeted fix' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
