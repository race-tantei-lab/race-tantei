name: Verify Niigata11 final odds fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-niigata11-final-odds-fix-20260823.yml"]
permissions:
  contents: read
  statuses: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  GH_TOKEN: ${{ github.token }}
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='production/niigata11-final-odds-fix' -f description='Verifying next immutable final after odds fix' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Wait for and verify immutable final
        shell: bash
        run: |
          set -euo pipefail
          race='2026-08-23-niigata-11'
          ok=0
          for attempt in $(seq 1 10); do
            rows=$(npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT COUNT(*) AS n FROM rt_public_bets WHERE race_id='$race' AND source_prediction_id=-2" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))")
            echo "attempt=$attempt final_rows=$rows"
            if [[ "$rows" = "6" ]]; then ok=1; break; fi
            sleep 12
          done
          test "$ok" = "1"
          echo '=== FINAL BETS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id FROM rt_public_bets WHERE race_id='$race' ORDER BY id" | tee /tmp/bets.json
          echo '=== FINAL STATE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT updated_at,state_value FROM rt_system_state WHERE state_key='worker_live_final:$race' LIMIT 1" | tee /tmp/final.json
          BETS=$(cat /tmp/bets.json) FINAL=$(cat /tmp/final.json) node - <<'NODE'
          const bets=JSON.parse(process.env.BETS)[0]?.results||[];
          const finalRows=JSON.parse(process.env.FINAL)[0]?.results||[];
          if(bets.length!==6) throw new Error('FINAL_SHAPE:'+bets.length);
          const sig=new Set(bets.map(x=>x.bet_type+'|'+x.combination+'|'+x.assumed_odds));
          if(sig.size!==2) throw new Error('COURSE_TICKETS_DIVERGED:'+JSON.stringify([...sig]));
          if(bets.some(x=>Number(x.source_prediction_id)!==-2||!(Number(x.assumed_odds)>1))) throw new Error('FINAL_ODDS_INVALID');
          const state=JSON.parse(finalRows[0]?.state_value||'{}');
          if(!['jra-fast-official','jra-crawl-official'].includes(state.oddsSource)) throw new Error('NON_OFFICIAL_SOURCE:'+state.oddsSource);
          const fetched=Date.parse(state.oddsFetchedAt||'');
          if(!Number.isFinite(fetched)||fetched<Date.parse('2026-08-23T08:19:00Z')) throw new Error('FINAL_USED_PRE_FIX_PREVIEW:'+state.oddsFetchedAt);
          for(const t of state.tickets||[]){
            if(t.betType==='単勝' && Number(t.officialOdds)===Number(t.combination)) throw new Error('HORSE_NUMBER_AS_ODDS_PATTERN:'+JSON.stringify(t));
          }
          console.log(JSON.stringify({lockedAt:bets[0].locked_at,oddsFetchedAt:state.oddsFetchedAt,oddsSource:state.oddsSource,oddsParserVersion:state.oddsParserVersion||null,tickets:state.tickets},null,2));
          NODE
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='production/niigata11-final-odds-fix' -f description='Next final uses fresh official odds after parser fix' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='production/niigata11-final-odds-fix' -f description='Next final odds verification failed' -f target_url="$STATUS_TARGET_URL" >/dev/null