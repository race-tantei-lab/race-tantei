name: Train and freeze cash betting model v1 (real model, no ROI gate)
on:
  push:
    branches:
      - model/cash-bet-baseline-v1-1113
    paths:
      - scripts/train-frozen-cash-model-v1.py
      - .github/workflows/train-frozen-cash-model-v1.yml
permissions:
  contents: write
jobs:
  train-freeze-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 lightgbm==4.6.0 scikit-learn==1.6.1
      - name: Unit-test callable model inference
        run: |
          python -m py_compile scripts/train-frozen-cash-model-v1.py
          python scripts/train-frozen-cash-model-v1.py --self-test
      - name: Fetch 136 pinned monthly settled JRA files (third-party, no Cloudflare)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-jra-cash-decade
          REF=f552ca8628646f39b05ffdbdc3ab8734939ffd66
          URL="https://raw.githubusercontent.com/Kenseimk/keiba-agent/$REF/data"
          {
            for year in $(seq 2015 2025); do
              for month in $(seq -w 1 12); do printf '%s%s\n' "$year" "$month"; done
            done
            for month in 01 02 03 04; do printf '2026%s\n' "$month"; done
          } > /tmp/cash_model_months
          cat /tmp/cash_model_months | xargs -P 12 -I {} bash -c 'set -euo pipefail; curl -fsSL --retry 3 --max-time 45 -o "external-jra-cash-decade/raceresults_{}.csv" "'"$URL"'/raceresults_{}.csv"; test -s "external-jra-cash-decade/raceresults_{}.csv"'
          test "$(find external-jra-cash-decade -name 'raceresults_*.csv' | wc -l)" -eq 136
      - name: Train and freeze model regardless of numeric profitability
        run: python -u scripts/train-frozen-cash-model-v1.py --train
      - name: Verify frozen model produces concrete horse-number wagers
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("models/cash-bet-model-v1.json")
          m=json.loads(p.read_text())
          c={"id":"fixture","venue":5,"raceNo":9,"month":"202610","horses":[[1,2.5,4,55],[2,3.7,4,56],[3,5.1,3,55],[4,10,6,55],[5,15,6,57]]}
          from importlib.util import spec_from_file_location,module_from_spec
          sp=spec_from_file_location("bet_model","scripts/train-frozen-cash-model-v1.py")
          mod=module_from_spec(sp);sp.loader.exec_module(mod)
          result=mod.predict_one(m,c)
          assert len(result["bets"])==2 and result["totalStakeYen"]==200
          assert all(b["horseNumbers"] and b["stakeYen"]>0 for b in result["bets"])
          print("FROZEN_CASH_MODEL_ACTIONABLE_DEMO",json.dumps(result,ensure_ascii=False))
          PY
      - name: Save actual frozen model, validation report, and full cash ledger to this research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/cash-bet-model-v1.json analysis-results/cash-bet-model-v1-evaluation.json analysis-results/cash-bet-model-v1-settled-bets.csv
          if ! git diff --cached --quiet; then
            git commit -m 'model: freeze cash betting v1 weights and chronological yen ledger [skip ci]'
            git push origin HEAD:model/cash-bet-baseline-v1-1113
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concrete-trained-cash-betting-model-v1
          path: |
            models/cash-bet-model-v1.json
            analysis-results/cash-bet-model-v1-evaluation.json
            analysis-results/cash-bet-model-v1-settled-bets.csv
          if-no-files-found: warn
          retention-days: 30
