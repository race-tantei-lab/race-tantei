name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler*.jsonc"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/cloudflare-deploy' \
            -f description='Deploying Race Tantei to Cloudflare Workers' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install canonical model runtime
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3'

      - name: Build canonical Worker model asset
        run: python scripts/build-worker-completed-model-assets.py

      - name: Verify canonical model parity before deploy
        run: npx tsx scripts/verify-worker-model-parity.ts

      - name: Verify live-lock safety before deploy
        run: python scripts/verify-live-lock-safety.py

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee production-deployment.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

      - name: Lightweight production home smoke check
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev/'
          ok=0
          for attempt in $(seq 1 6); do
            code=$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$base" || true)
            echo "home attempt=$attempt http=$code"
            if [[ "$code" = '200' ]] && ! grep -q '一時的にページを表示できません。' /tmp/home.html; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = '1'

      - name: Publish deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare deploy and lightweight home check succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare deploy or lightweight home check failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
