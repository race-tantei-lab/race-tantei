name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - "analysis-results/**"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/cloudflare-deploy' \
            -f description='Deploying Race Tantei to Cloudflare Workers' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee production-deployment.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

      - name: Verify historical race APIs and detail
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'
          for d in 2024-05-26 2025-05-25 2026-08-02; do
            echo "Checking $d"
            code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o "/tmp/$d.json" -w '%{http_code}' "$base/api/public/day?date=$d")
            test "$code" = '200'
            DATE="$d" node -e "const fs=require('fs');const d=process.env.DATE;const p=JSON.parse(fs.readFileSync('/tmp/'+d+'.json','utf8'));const r=p.races;if(!Array.isArray(r)||r.length<12)throw new Error('bad historical races '+d);const s=r.filter(x=>['hit','miss','buy'].includes(x.publicState?.code));if(!s.length)throw new Error('no selected historical races '+d);console.log(d,'races=',r.length,'selected=',s.length)"
          done
          race_id=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/2024-05-26.json','utf8'));const r=p.races.find(x=>['hit','miss','buy'].includes(x.publicState?.code));if(!r)process.exit(2);process.stdout.write(r.raceId)")
          test -n "$race_id"
          echo "Historical detail: $race_id"
          code=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/historical-detail.html -w '%{http_code}' "$base/races/$race_id")
          test "$code" = '200'
          grep -q '確定買い目' /tmp/historical-detail.html
          grep -q '購入額' /tmp/historical-detail.html
          grep -q '出走馬' /tmp/historical-detail.html

      - name: Publish deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare deploy and historical race verification succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare deploy or historical race verification failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Save production deployment report
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          if [[ ! -f production-deployment.log ]]; then
            echo "Deployment did not reach the Wrangler step." > production-deployment.log
          fi
          cp production-deployment.log analysis-results/production-deployment.log
          git add -f analysis-results/production-deployment.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No deployment report change."
          else
            git commit -m "Save verified production deployment"
            git push
          fi
