name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - "analysis-results/**"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='production/cloudflare-deploy' \
            -f description='Deploying Race Tantei to Cloudflare Workers' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build canonical direct history index
        run: |
          python scripts/build-canonical-direct.py
          test -s src/v1/canonical-history-direct.ts
          grep -q '2024-05-26-kyoto-12' src/v1/canonical-history-direct.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee production-deployment.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade

      - name: Publish deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare Worker deployment succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='production/cloudflare-deploy' \
            -f description='Cloudflare Worker deployment failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Save production deployment report
        if: always()
        shell: bash
        run: |
          mkdir -p analysis-results
          if [[ ! -f production-deployment.log ]]; then
            echo "Deployment did not reach the Wrangler step." > production-deployment.log
          fi
          cp production-deployment.log analysis-results/production-deployment.log
          git add -f analysis-results/production-deployment.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No deployment report change."
          else
            git commit -m "Save verified production deployment"
            git push
          fi
