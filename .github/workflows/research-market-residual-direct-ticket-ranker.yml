name: Research 2025 payout-vs-market-residual and ticket LambdaRank objective (FINAL ODDS PROXY ONLY)

on:
  pull_request:
    branches: [main, research/multitarget-ranking-tweedie-catboost-20261108]
    paths:
      - scripts/research-market-residual-direct-ticket-ranker.py
      - .github/workflows/research-market-residual-direct-ticket-ranker.yml
permissions:
  contents: read
concurrency:
  group: market-residual-ranker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chronological-payout-model-against-real-jra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU ML libraries
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy<3' 'scikit-learn==1.6.1' 'catboost==1.2.8'
      - name: Syntax and market/ranking/payout self-test
        run: |
          python -m py_compile scripts/research-market-residual-direct-ticket-ranker.py
          python scripts/research-market-residual-direct-ticket-ranker.py --self-test
      - name: Fit new market-relative win and within-race JRA ticket payout rankers, settle chronological 2025
        run: python -u scripts/research-market-residual-direct-ticket-ranker.py
      - name: Preserve paired JRA payout ROI and same 5 races vs model-selected control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-market-relative-final-odds-proxy-no-T15-promotion
          path: analysis-results/market-residual-ticket-lambdarank-2025-jra.json
          if-no-files-found: warn
          retention-days: 30
