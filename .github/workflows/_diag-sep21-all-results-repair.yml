name: Sep21 all-race official result repair
on:
  push:
    branches:
      - diag/sep21-all-results-repair-20260921
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run patched bounded all-race settlement against production
        shell: bash
        run: |
          cat >/tmp/run-results-repair.ts <<'TS'
          import { runBoundedResultSettlement } from '${{ github.workspace }}/src/v1/bounded-result-settlement.ts';

          const account=process.env.CLOUDFLARE_ACCOUNT_ID!;
          const database=process.env.CLOUDFLARE_D1_DATABASE_ID!;
          const token=process.env.CLOUDFLARE_API_TOKEN!;
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`;

          async function exec(sql:string,params:unknown[]){
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql,params})});
            const b:any=await r.json();
            if(!r.ok||!b.success) throw new Error('D1_REMOTE_FAILED:'+JSON.stringify(b));
            return b.result?.[0] ?? {results:[],success:true};
          }
          class Bound {
            constructor(public sql:string,public params:unknown[]=[]){}
            bind(...params:unknown[]){ return new Bound(this.sql,params); }
            async all<T=any>(){ return await exec(this.sql,this.params) as any; }
            async first<T=any>(){ const out:any=await exec(this.sql,this.params); return (out.results?.[0] ?? null) as T|null; }
            async run(){ return await exec(this.sql,this.params) as any; }
          }
          class DB {
            prepare(sql:string){ return new Bound(sql); }
            async batch(stmts:any[]){ return await Promise.all(stmts.map(async(s)=>await s.all())); }
          }
          async function main(){
            const env:any={DB:new DB()};
            const now=new Date();
            const audit=await runBoundedResultSettlement(env,now);
            console.log('REPAIR_AUDIT',JSON.stringify(audit));
            if(audit.errors.length) throw new Error('RESULT_REPAIR_ERRORS:'+JSON.stringify(audit.errors));
            const verify:any=await exec(`
              SELECT r.race_id AS raceId,r.status,
                     (SELECT COUNT(*) FROM rt_results x WHERE x.race_id=r.race_id AND x.finish_position IS NOT NULL) AS resultRows,
                     (SELECT COUNT(*) FROM rt_payouts p WHERE p.race_id=r.race_id) AS payoutRows,
                     (SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2 AND b.settlement_status='pending') AS pendingFinalRows
              FROM rt_races r
              WHERE r.race_date='2026-09-21'
                AND lower(COALESCE(r.status,'scheduled')) NOT IN ('cancelled','canceled','postponed')
              ORDER BY r.venue,r.race_no
            `,[]);
            console.log('SEP21_VERIFY',JSON.stringify(verify.results));
            const rows=verify.results||[];
            if(rows.length!==12) throw new Error('SEP21_ACTIVE_RACE_COUNT:'+rows.length);
            const bad=rows.filter((x:any)=>Number(x.resultRows)<3||Number(x.payoutRows)<1||Number(x.pendingFinalRows)!==0);
            if(bad.length) throw new Error('SEP21_RESULTS_INCOMPLETE:'+JSON.stringify(bad));
            console.log('SEP21_ALL_RESULTS_COMPLETE');
          }
          main().catch((e)=>{console.error(e);process.exit(1)});
          TS
          npx tsx /tmp/run-results-repair.ts
