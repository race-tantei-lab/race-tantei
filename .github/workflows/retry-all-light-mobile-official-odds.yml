name: Retry all-light mobile official odds
run-name: Retry all-light mobile official odds · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "analysis-results/all-light-primary-failure-ids.json"
      - "scripts/retry-all-light-mobile-official-odds.py"
      - ".github/workflows/retry-all-light-mobile-official-odds.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish start
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='analysis/all-light-mobile-retry' -f description='一次取得失敗76レースをJRA公式モバイル経路で再取得中' -f target_url="$TARGET" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify fixed constraints
        run: python scripts/verify-race-tantei-fixed-constraints.py
      - name: Run exact locked official mobile retry
        run: python scripts/retry-all-light-mobile-official-odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-light-mobile-official-odds-retry
          path: |
            artifacts/all-light-mobile-retry.jsonl.gz
            artifacts/all-light-mobile-retry-meta.json
          compression-level: 0
          retention-days: 14
      - name: Publish success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='analysis/all-light-mobile-retry' -f description='76レースJRA公式モバイル再取得成功' -f target_url="$TARGET" >/dev/null
      - name: Publish failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='analysis/all-light-mobile-retry' -f description='76レースJRA公式モバイル再取得失敗' -f target_url="$TARGET" >/dev/null
