name: V13 constrained ROI 200 search
run-name: V13 constrained ROI 200 search · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-v13-constrained-roi-200-search.py"
      - "scripts/run-final-course-production.py"
      - "config/race-tantei-fixed-constraints.json"
      - ".github/workflows/v13-constrained-roi-200-search.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: v13-constrained-roi-200-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish search start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/v13-constrained-roi-200-search' \
            -f description='探索中：全条件固定で3コース最低ROIを最大化' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify immutable rules and source
        run: |
          python scripts/verify-race-tantei-fixed-constraints.py
          python -m py_compile scripts/analyze-v13-constrained-roi-200-search.py scripts/run-final-course-production.py

      - name: Run constrained ROI 200 search
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-v13-constrained-roi-200-search.py 2>&1 | tee v13-constrained-roi-200-search.log

      - name: Stage analysis result
        if: success()
        shell: bash
        run: |
          mkdir -p analysis-results candidate-policies
          cp v13-constrained-roi-200-search.json analysis-results/v13-constrained-roi-200-search.json
          git add -f analysis-results/v13-constrained-roi-200-search.json
          if [[ -f candidate-policies/v13-constrained-roi-200.py ]]; then
            python -m py_compile candidate-policies/v13-constrained-roi-200.py
            git add candidate-policies/v13-constrained-roi-200.py
          fi

      - name: Promote only when every gate passed
        if: success()
        shell: bash
        run: |
          set -o pipefail
          python scripts/find-and-promote-production-candidate.py | tee v13-production-promotion.log
          if [[ -f config/approved-production-model.json ]]; then
            python scripts/verify-approved-production-model.py
            git add scripts/final-course-policy.py config/approved-production-model.json
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-constrained-roi-200-search
          path: |
            v13-constrained-roi-200-search.json
            v13-constrained-roi-200-search.log
            v13-production-promotion.log
            candidate-policies/v13-constrained-roi-200.py
          if-no-files-found: warn
          retention-days: 30

      - name: Save result and approved model
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Save v13 constrained ROI 200 search"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            STATE=failure
            DESCRIPTION='失敗：v13制約付き探索ログを確認'
          elif [[ -f config/approved-production-model.json ]]; then
            STATE=success
            DESCRIPTION='合格：全条件を満たす200%以上モデルを本番昇格'
          else
            STATE=success
            DESCRIPTION='探索完了：合格前のため本番変更なし'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='analysis/v13-constrained-roi-200-search' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
