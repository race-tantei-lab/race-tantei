name: V14 historical payout ROI 200 search
run-name: V14 historical payout ROI 200 search · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-v13-constrained-roi-200-search.py"
      - "scripts/analyze-v14-historical-roi200.py"
      - "scripts/run-final-course-production.py"
      - "config/race-tantei-fixed-constraints.json"
      - ".github/workflows/v13-constrained-roi-200-search.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: v14-historical-payout-roi200
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish search start
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='analysis/v14-historical-payout-roi200' \
            -f description='探索中：過去払戻し学習で全3コース200%以上を直接最大化' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Verify immutable rules and source
        run: |
          python scripts/verify-race-tantei-fixed-constraints.py
          python -m py_compile \
            scripts/analyze-v13-constrained-roi-200-search.py \
            scripts/analyze-v14-historical-roi200.py \
            scripts/run-final-course-production.py

      - name: Train historical payout-value model and generate upcoming predictions
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze-v13-constrained-roi-200-search.py 2>&1 | tee v14-historical-roi200-search.log

      - name: Stage analysis and upcoming predictions
        if: success()
        shell: bash
        run: |
          mkdir -p analysis-results
          cp v13-constrained-roi-200-search.json analysis-results/v13-constrained-roi-200-search.json
          cp v14-historical-roi200-search.json analysis-results/v14-historical-roi200-search.json
          cp v14-upcoming-predictions.json analysis-results/v14-upcoming-predictions.json
          git add -f \
            analysis-results/v13-constrained-roi-200-search.json \
            analysis-results/v14-historical-roi200-search.json \
            analysis-results/v14-upcoming-predictions.json

      - name: Promote only when every historical gate passed
        if: success()
        shell: bash
        run: |
          set -o pipefail
          python scripts/find-and-promote-production-candidate.py | tee v14-production-promotion.log
          if [[ -f config/approved-production-model.json ]]; then
            python scripts/verify-approved-production-model.py
            git add scripts/final-course-policy.py config/approved-production-model.json
          fi

      - name: Upload complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-historical-payout-roi200
          path: |
            v13-constrained-roi-200-search.json
            v14-historical-roi200-search.json
            v14-upcoming-predictions.json
            v14-historical-roi200-search.log
            v14-production-promotion.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save result
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Save v14 historical payout ROI 200 result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            STATE=failure
            DESCRIPTION='失敗：v14過去払戻しモデルのログを確認'
          elif [[ -f config/approved-production-model.json ]]; then
            STATE=success
            DESCRIPTION='合格：過去検証200%以上のモデルを本番昇格'
          else
            STATE=success
            DESCRIPTION='探索完了：予想生成済み・200%合格前は本番変更なし'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='analysis/v14-historical-payout-roi200' \
            -f description="$DESCRIPTION" \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
