name: Diagnose production race page now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-race-page-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production races page and APIs
        shell: bash
        run: |
          set -euo pipefail
          base='https://race-tantei-phase0.race-tantei.workers.dev'

          for path in '/' '/races/' '/api/public/day?date=2026-09-05' '/api/public/day?date=2026-09-06'; do
            echo "=== $path ==="
            code=$(curl -L -sS -D /tmp/h -o /tmp/b -w '%{http_code}' "$base$path" || true)
            echo "HTTP=$code BYTES=$(wc -c </tmp/b)"
            grep -iE '^(location|content-type|cache-control|x-race|cf-ray|server):' /tmp/h || true
            python3 - "$path" <<'PY'
          import json,re,sys
          path=sys.argv[1]
          raw=open('/tmp/b','rb').read()
          text=raw.decode('utf-8','replace')
          print('HEAD',repr(text[:500]))
          print('FORBIDDEN', '一時的にページを表示できません。' in text)
          if path=='/races/':
            print('HAS_RACES_TITLE', 'レース' in text)
            print('HAS_FETCH_DAY', '/api/public/day' in text)
            scripts=re.findall(r'<script[^>]*src=["\']([^"\']+)',text,re.I)
            print('SCRIPT_SRCS',scripts[:20])
            hrefs=re.findall(r'href=["\']([^"\']+)',text,re.I)
            print('HREFS',hrefs[:30])
          if path.startswith('/api/'):
            try:
              obj=json.loads(text)
              races=obj.get('races') if isinstance(obj,dict) else None
              print('JSON_OK',obj.get('ok') if isinstance(obj,dict) else None,'RACES',len(races) if isinstance(races,list) else None)
            except Exception as e:
              print('JSON_ERROR',repr(e))
          PY
          done
