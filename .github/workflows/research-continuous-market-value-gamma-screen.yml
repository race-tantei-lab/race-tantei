name: Research continuous market gamma screen

on:
  push:
    branches: [research/ten-year-minimal-rules]
    paths:
      - ".github/workflows/research-continuous-market-value-gamma-screen.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  OLD_ODDS_RUN_ID: '31373205723'
  BEST_DEMAND_RUN_ID: '31417411680'
  HISTORY_ARTIFACT_ID: '9056288221'
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark gamma screen pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='research/continuous-market-gamma-screen' \
            -f description='Screening stronger high-odds penalties on overlap-only official odds' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - name: Download corpus and frozen race selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history demand odds analysis-results
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT_ID}/zip" > history.zip
          unzip -q history.zip ten-year-history-corpus.jsonl -d history
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BEST_DEMAND_RUN_ID}/artifacts?per_page=100" > demand-artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="research-blend-0.60" and .expired==false) | .id' demand-artifacts.json | head -n1)
          test -n "$id" && test "$id" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > demand.zip
          unzip -q demand.zip -d demand
      - name: Download existing official odds overlap
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_ODDS_RUN_ID}/artifacts?per_page=100" > odds-artifacts.json
          for year in $(seq 2016 2026); do
            name="research-demanded-odds-${year}"
            id=$(jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' odds-artifacts.json | head -n1)
            test -n "$id" && test "$id" != null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$year.zip"
            mkdir -p "tmp-$year"; unzip -q "$year.zip" -d "tmp-$year"
            cp "tmp-$year/research-demanded-odds-${year}.jsonl" "odds/research-continuous-market-odds-${year}.jsonl"
          done
      - name: Expand only research gamma grid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research-evaluate-continuous-market-value.py')
          s=p.read_text()
          old='RISK_GAMMAS=(0.0,0.25,0.50,0.75)'
          new='RISK_GAMMAS=(0.75,1.00,1.25,1.50,1.75,2.00)'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile scripts/research-evaluate-continuous-market-value.py
      - name: Run stronger-risk overlap screen
        run: |
          python scripts/research-evaluate-continuous-market-value.py \
            --corpus history/ten-year-history-corpus.jsonl \
            --demand demand/demand.jsonl \
            --odds-dir odds \
            --out analysis-results/gamma-screen.json
      - name: Summarize screen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('analysis-results/gamma-screen.json').read_text())
          b=m['bestVariant'];v=m['variants'][b]
          print(json.dumps({
            'partialScreenOnly':True,
            'best':b,
            'evaluated':v['evaluatedRaces'],
            'errors':v['evaluationErrorCount'],
            'roi':{c:x['roiPct'] for c,x in v['courses'].items()},
            'top6':[{"variant":k,"roi":{c:m['variants'][k]['courses'][c]['roiPct'] for c in m['variants'][k]['courses']}} for k in m['ranking'][:6]]
          },ensure_ascii=False))
          assert m['raceSelectionFrozenBeforeOdds'] is True
          assert m['sameDayResultsUsedForTicketProbability'] is False
          assert m['syntheticOddsUsed'] is False
      - uses: actions/upload-artifact@v4
        with:
          name: research-continuous-market-value-gamma-screen
          path: analysis-results/gamma-screen.json
          retention-days: 14
      - name: Mark gamma screen success
        if: success()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='research/continuous-market-gamma-screen' \
            -f description='Strong risk-penalty overlap screen completed' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark gamma screen failure
        if: failure()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='research/continuous-market-gamma-screen' \
            -f description='Strong risk-penalty screen requires repair' \
            -f target_url="$STATUS_TARGET_URL" >/dev/null
