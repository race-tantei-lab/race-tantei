name: Build canonical direct history
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-canonical-direct.py'
      - '.github/workflows/build-canonical-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build direct index
        run: python scripts/build-canonical-direct.py
      - name: Save generated index
        run: |
          git add -f src/v1/canonical-history-direct.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Generate direct canonical history index'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
