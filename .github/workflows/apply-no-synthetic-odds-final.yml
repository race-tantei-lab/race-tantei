name: Apply no synthetic odds finalization fix

on:
  push:
    branches:
      - fix/no-synthetic-odds-final-20260816
    paths:
      - .github/workflows/apply-no-synthetic-odds-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-synthetic-odds-final-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove probability fallback finalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v1/completed-worker-deadline-guard.ts')
          s=p.read_text()
          s=s.replace('import { COMPLETED_MODEL_SHA256, COMPLETED_MODEL_VERSION, completedFeatureVector, loadCompletedFeatureStateForRace } from "./completed-feature-runtime.js";\n','import { COMPLETED_MODEL_SHA256, COMPLETED_MODEL_VERSION } from "./completed-feature-runtime.js";\n')
          s=s.replace('import { loadCompletedModelRuntime, type CompletedModelRuntime } from "./completed-model-runtime.js";\n','')
          s=s.replace('import { completedRecencyBetFactor, loadCompletedRecencyLearning } from "./completed-recency-learning.js";\n','')
          s=s.replace('import { chooseCompletedProbabilityFallbackTickets, emergencyRunnerWeights } from "./completed-ticket-fallback.js";\n','')
          s=s.replace('  completedCourseBets,\n  normalizeCompletedWeights,\n','')
          s=s.replace('type ModelMetaRow = { key: string; value: string };\ntype ModelChunkRow = { seq: number; dataB64: string };\n','')
          a=s.index('function decodeBase64(')
          b=s.index('async function loadSelection(',a)
          s=s[:a]+s[b:]
          a=s.index('async function buildFallback(')
          b=s.index('async function saveAudit(',a)
          s=s[:a]+s[b:]
          old='''      const official = await latestOfficialPreview(env.DB, raceId, now);
      if (official) {
        await commitOfficialPreview(env.DB, raceId, official, now);
        audit.lockedOfficialPreviewRaceIds.push(raceId);
      } else {
        const { race, runners } = await loadRace(env.DB, raceId);
        await commitFallback(env.DB, raceId, race, runners, now);
        audit.lockedProbabilityFallbackRaceIds.push(raceId);
      }
      audit.lockedRaceIds.push(raceId);'''
          new='''      const official = await latestOfficialPreview(env.DB, raceId, now);
      if (!official) {
        // Never manufacture odds or final tickets. The normal scheduled chain
        // retries JRA official acquisition, and this guard runs again after the
        // chain and on every subsequent minute before the recorded start.
        throw new Error(`DEADLINE_GUARD_OFFICIAL_ODDS_PREVIEW_MISSING:${raceId}`);
      }
      await commitOfficialPreview(env.DB, raceId, official, now);
      audit.lockedOfficialPreviewRaceIds.push(raceId);
      audit.lockedRaceIds.push(raceId);'''
          if old not in s: raise SystemExit('deadline fallback block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('tests/completed-worker-deadline-guard-tests.ts')
          x=t.read_text()
          if 'readFileSync' not in x:
            x=x.replace('import { strict as assert } from "node:assert";','import { strict as assert } from "node:assert";\nimport { readFileSync } from "node:fs";')
          marker='assert.equal(shouldDeadlineGuardLock(Number.NaN), false);\n'
          checks='''assert.equal(shouldDeadlineGuardLock(Number.NaN), false);

const guardSource = readFileSync("src/v1/completed-worker-deadline-guard.ts", "utf8");
assert.equal(guardSource.includes("commitFallback("), false, "deadline guard must never finalize probability-only synthetic odds");
assert.equal(guardSource.includes("chooseCompletedProbabilityFallbackTickets"), false, "deadline guard must not construct tickets without official odds");
assert.equal(guardSource.includes('oddsMode: "probability_fallback"'), false, "probability fallback final state must never be written");
assert.equal(guardSource.includes("DEADLINE_GUARD_OFFICIAL_ODDS_PREVIEW_MISSING"), true, "missing official odds must remain unresolved and retryable");
'''
          if marker not in x: raise SystemExit('test marker missing')
          x=x.replace(marker,checks,1)
          t.write_text(x)
          PY
      - name: Validate root fix
        run: |
          npm install
          npm run typecheck
          npm run build:test
          npm run test:unit
          npm run build
          ! grep -q 'commitFallback(' src/v1/completed-worker-deadline-guard.ts
          ! grep -q 'oddsMode: "probability_fallback"' src/v1/completed-worker-deadline-guard.ts
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/completed-worker-deadline-guard.ts tests/completed-worker-deadline-guard-tests.ts
          git commit -m "Forbid synthetic odds in deadline finalization"
          git push origin HEAD:fix/no-synthetic-odds-final-20260816
