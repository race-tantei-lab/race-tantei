name: Diagnose Sapporo 9R timeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-niigata05-timeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mark pending
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='diagnostic/sapporo09-timeline' -f description='Reading Sapporo 9R generation timeline' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dump Sapporo 9R exact timeline
        shell: bash
        run: |
          set -euo pipefail
          RID='2026-08-23-sapporo-09'
          DATE='2026-08-23'
          echo '=== RACE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,start_time_jst,start_time_utc,status FROM rt_races WHERE race_id='$RID'"
          echo '=== DAILY SELECTION ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key='final_daily_selection:$DATE'"
          echo '=== FINAL BET ROWS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT id,race_id,course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id,created_at,settlement_status FROM rt_public_bets WHERE race_id='$RID' ORDER BY id"
          echo '=== FINAL/PREVIEW/DRIVER STATES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS stateValue FROM rt_system_state WHERE state_key IN ('worker_live_preview:$RID','worker_live_final:$RID','live_deadline_driver:$DATE','worker_deadline_guard:$DATE','worker_live_lock:$DATE') ORDER BY state_key"
          echo '=== PREVIEW ARCHIVE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT id,race_id,newest_generated_at,archived_at,envelope_json FROM rt_live_preview_archive WHERE race_id='$RID' ORDER BY rowid"
          echo '=== PUBLIC API ==='
          curl --max-time 20 --fail-with-body -sS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=$DATE&_diag=$(date +%s)" -o /tmp/day.json
          node - <<'NODE'
          const p=require('/tmp/day.json');
          console.log(JSON.stringify((p.races||[]).find(x=>x.raceId==='2026-08-23-sapporo-09')||null,null,2));
          NODE
      - name: Mark success
        if: success()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='diagnostic/sapporo09-timeline' -f description='Sapporo 9R timeline captured' -f target_url="$STATUS_TARGET_URL" >/dev/null
      - name: Mark failure
        if: failure()
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='diagnostic/sapporo09-timeline' -f description='Sapporo 9R timeline diagnostic failed' -f target_url="$STATUS_TARGET_URL" >/dev/null
