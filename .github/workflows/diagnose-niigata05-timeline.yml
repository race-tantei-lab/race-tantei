name: Diagnose Niigata 5R timeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-niigata05-timeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
  STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dump Niigata 5R exact timeline
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RACE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT race_id,race_date,venue,race_no,start_time_jst,start_time_utc FROM rt_races WHERE race_id='2026-08-23-niigata-05'"
          echo '=== FINAL BET ROWS ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT id,race_id,course,bet_type,combination,stake_yen,assumed_odds,locked_at,source_prediction_id,created_at FROM rt_public_bets WHERE race_id='2026-08-23-niigata-05' ORDER BY id"
          echo '=== FINAL/PREVIEW STATES ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT state_key AS stateKey,updated_at AS updatedAt,state_value AS stateValue FROM rt_system_state WHERE state_key IN ('worker_live_preview:2026-08-23-niigata-05','worker_live_final:2026-08-23-niigata-05','live_deadline_driver:2026-08-23','worker_deadline_guard:2026-08-23','worker_live_lock:2026-08-23') ORDER BY state_key"
          echo '=== PREVIEW ARCHIVE ==='
          npx wrangler d1 execute race-tantei-phase0 --remote --json --command "SELECT * FROM rt_live_preview_archive WHERE race_id='2026-08-23-niigata-05' ORDER BY rowid"
          echo '=== PUBLIC API ==='
          curl --max-time 20 --fail-with-body -sS 'https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-08-23' -o /tmp/day.json
          node - <<'NODE'
          const p=require('/tmp/day.json');
          console.log(JSON.stringify((p.races||[]).find(x=>x.raceId==='2026-08-23-niigata-05')||null,null,2));
          NODE
