name: Read-only 2026 JRA payout gap inventory and external source probe
on:
  push:
    branches:
      - research/20261114-inspect-sep19-final-odds-identity
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 beautifulsoup4==4.13.4
      - name: Diagnose read-only D1 missing JRA settlements and public archive coverage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
          CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
        run: python -u scripts/research-20261114-sep19-jra-identity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aug-nov-2026-official-payout-gap-diagnostic
          path: analysis-results/20261114-six-market-payout-gap-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
