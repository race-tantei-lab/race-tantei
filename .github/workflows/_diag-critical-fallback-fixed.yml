name: Critical fallback fixed verification
on:
  push:
    branches:
      - diag/critical-fallback-fixed-20260921
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      JRA_ODDS_REQUEST_PAUSE_SECONDS: "0.35"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixed critical fallback against current production state
        shell: bash
        run: |
          set -o pipefail
          python scripts/run-critical-auto-bet-generation.py | tee /tmp/critical.log
          grep -F 'CRITICAL_CANCELLED_RACES_SKIPPED' /tmp/critical.log
          ! grep -F 'KeyError' /tmp/critical.log
          echo CRITICAL_FALLBACK_FIXED_OK
