name: Research late 2026 independent ROI history export
on:
  push:
    branches: [research/20261115-rolling-final-odds-replay]
    paths:
      - .github/workflows/export-independent-late-2026-20261115.yml
      - scripts/export-independent-late-2026-d1-20261115.py
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - name: Export completed JRA 2026 Aug-Nov research records read-only
        run: python3 scripts/export-independent-late-2026-d1-20261115.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-2026-independent-replay-inputs
          path: artifacts/independent-late-2026-d1.json.gz
          retention-days: 14
