name: Emergency Sep20 Live Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-sep20-live-probe.yml"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 3c6d1826b573b2e68cb13ec37e9e8ade
      CF_DB: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Probe now
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          q() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$CF_DB/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @-
          }
          q "SELECT datetime('now') AS utcNow, datetime('now','+9 hours') AS jstNow" > /tmp/clock.json
          q "SELECT race_id AS raceId,start_time_utc AS startTimeUtc,start_time_jst AS startTimeJst,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS finalRows,(SELECT COUNT(*) FROM rt_public_bets b WHERE b.race_id=r.race_id AND b.source_prediction_id=-2) AS sourceMinus2,(SELECT MIN(locked_at) FROM rt_public_bets b WHERE b.race_id=r.race_id) AS lockedAt,(SELECT COUNT(*) FROM rt_system_state s WHERE s.state_key='worker_live_preview:'||r.race_id) AS previewState FROM rt_races r WHERE race_id='2026-09-20-hanshin-01'" > /tmp/first.json
          q "SELECT state_key,updated_at,state_value FROM rt_system_state WHERE state_key IN ('final_daily_selection:2026-09-20','live_deadline_driver:2026-09-20','worker_deadline_guard:2026-09-20','worker_live_final:2026-09-20-hanshin-01','worker_live_preview:2026-09-20-hanshin-01') ORDER BY state_key" > /tmp/state.json
          q "SELECT race_id AS raceId,course,COUNT(*) AS rows,COUNT(DISTINCT bet_type) AS betTypes,MIN(source_prediction_id) AS minSource,MAX(source_prediction_id) AS maxSource,MIN(locked_at) AS lockedAt FROM rt_public_bets WHERE race_id='2026-09-20-hanshin-01' GROUP BY race_id,course ORDER BY course" > /tmp/course.json
          curl -fsS -D /tmp/home.headers -o /tmp/home.html "https://race-tantei-phase0.race-tantei.workers.dev/?_rt=$(date +%s)"
          curl -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/day?date=2026-09-20&_rt=$(date +%s)" > /tmp/day.json
          curl -fsS "https://race-tantei-phase0.race-tantei.workers.dev/api/public/today-summary?_rt=$(date +%s)" > /tmp/summary.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/race-day-bootstrap.yml/runs?per_page=8" > /tmp/bootstrap.json
          python3 - <<'PY'
          import json,pathlib
          def load(p):
              return json.load(open(p,encoding='utf-8'))
          def cfrows(p):
              x=load(p)
              return ((x.get('result') or [{}])[0].get('results') or []) if x.get('success') else []
          home=pathlib.Path('/tmp/home.html').read_text(errors='replace')
          h=pathlib.Path('/tmp/home.headers').read_text(errors='replace')
          day=load('/tmp/day.json'); summary=load('/tmp/summary.json')
          runs=load('/tmp/bootstrap.json').get('workflow_runs',[])
          report={
            'clock':cfrows('/tmp/clock.json'),'first':cfrows('/tmp/first.json'),
            'state':cfrows('/tmp/state.json'),'courseFinals':cfrows('/tmp/course.json'),
            'home':{'oldFalseEmptyPhrasePresent':'公開買い目はありません' in home,'newSelectedMessagePresent':'買い目対象として選定済みです' in home,'headers':h[:4000]},
            'day':day,'summary':summary,
            'bootstrapRuns':[{'id':r.get('id'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'head_sha':r.get('head_sha'),'html_url':r.get('html_url')} for r in runs]
          }
          pathlib.Path('ops/sep20-live-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'clock':report['clock'],'first':report['first'],'courseFinals':report['courseFinals'],'home':report['home'],'summary':summary,'bootstrapRuns':report['bootstrapRuns'][:6]},ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name race-tantei-emergency-bot
          git config user.email race-tantei-emergency-bot@users.noreply.github.com
          git add ops/sep20-live-probe.json
          git commit -m "ops: probe Sep 20 live production now"
          git pull --rebase origin main
          git push origin HEAD:main
