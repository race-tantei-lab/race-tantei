name: Diagnose Niigata 9R root now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-niigata9-root-now.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c6d1826b573b2e68cb13ec37e9e8ade
      CLOUDFLARE_D1_DATABASE_ID: 949b5e8b-d1a4-4c4e-80d1-d031afdc03de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read exact production timing
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib,sys
          p=pathlib.Path('scripts/collect-jra-official-odds.py')
          s=importlib.util.spec_from_file_location('diag',p);m=importlib.util.module_from_spec(s);sys.modules['diag']=m;s.loader.exec_module(m)
          rid='2026-08-16-niigata-09'
          out={}
          out['race']=m.d1_query('SELECT race_id AS raceId,start_time_utc AS startTimeUtc,start_time_jst AS startTimeJst FROM rt_races WHERE race_id=?',[rid])
          out['bets']=m.d1_query('SELECT course,bet_type AS betType,combination,stake_yen AS stakeYen,locked_at AS lockedAt,source_prediction_id AS sourcePredictionId FROM rt_public_bets WHERE race_id=? ORDER BY course,bet_type',[rid])
          for label,key in [('final','worker_live_final:'+rid),('preview','worker_live_preview:'+rid),('deadline','worker_deadline_guard:2026-08-16'),('live','worker_live_lock:2026-08-16')]:
              rows=m.d1_query('SELECT state_value AS value,updated_at AS updatedAt FROM rt_system_state WHERE state_key=? LIMIT 1',[key])
              cooked=[]
              for row in rows:
                  value=row.pop('value',None)
                  try: row['parsed']=json.loads(value) if value else None
                  except Exception: row['parsed']='PARSE_ERROR'
                  cooked.append(row)
              out[label]=cooked
          print('NIIGATA9_ROOT='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
